// =====================================================================
// TAVA GEOMETRI CIZIMI
// =====================================================================
// Referans cizimler: &quot;TAVA 60'LIK CIHAZ.dxf&quot; / &quot;TAVA 50'LIK CIHAZ.dxf&quot;
// (panel 600 genis x 1350 yuksek -> govde 555 x 1305). Uretilen geometri referansla
// birebir dogrulandi: 16/16 entity, en buyuk sapma 0.000 mm.
//
//   W (govde eni)  = panel GENISLIGI  - 45     -> ust/alt yatay kenar
//   H (govde boyu) = panel YUKSEKLIGI - 45     -> egimli yan kenarin DIK yuksekligi
//
// YON ANLAMLIDIR - iki olcuyu max/min ile normalize ETMEYIN. Ust bukum payi (52.5)
// ile alt bukum payi (60'lik 77.5 / 50'lik 62.5) FARKLI oldugu icin H ekseni fiziksel
// olarak asimetriktir: 600x1350 ile 1350x600 ayni parca degildir. Damperde de ayni
// tuzaga dusulmustu (bkz. asagidaki DAMPER bolumu).
//
// Bukum paylari SABIT, panel olcusuyle degismez:
//   ust pay 52.5 | alt pay: 60'lik 77.5, 50'lik 62.5 | kose bosaltmasi r=0.5 (270 derece)
// Yan kanat ustte UST, altta ALT genisliginde oldugu icin yan kenar egimlidir.
// Cizginin TAMAMI beyaz (layer 0) - referanstaki mavi/sari sadece kural isaretiydi.

var TAVA_UST = 52.5;            // ust bukum payi (iki cihazda da ayni)
var TAVA_R = 0.5;               // kose bosaltma radyusu
var TAVA_ALT = { '60': 77.5, '50': 62.5 };   // alt bukum payi
var TAVA_PAY = 45;              // panel olcusunden dusulen pay
var TAVA_MIN_PANEL = 100;       // altinda bukum paylari ust uste biner
var TAVA_GAP = 150.0;           // parcalar arasi bosluk
var TAVA_LAYER = '0';           // her sey beyaz

// Govde sol-alt kosesi (ox, oy) olacak sekilde tek tava acilimi cizer.
function drawTava(dxf, ox, oy, W, H, alt) {
  var L = TAVA_LAYER;
  var ust = TAVA_UST;
  var r = TAVA_R;

  var yUst = H + r + ust;        // ust kenarin dis hatti
  var yAlt = -(r + alt);         // alt kenarin dis hatti
  var xSolUst = -(r + ust);      // sol kanat ust ucu
  var xSolAlt = -(r + alt);      // sol kanat alt ucu
  var xSagUst = W + r + ust;
  var xSagAlt = W + r + alt;

  // Ust kenar (kisa olcu)
  dxf.addLine(ox + 0, oy + yUst, ox + W, oy + yUst, L);
  dxf.addLine(ox + 0, oy + H + r, ox + 0, oy + yUst, L);
  dxf.addLine(ox + W, oy + H + r, ox + W, oy + yUst, L);

  // Kose bosaltmalari - 270 derecelik bukum rolyefi (DXF yaylari CCW)
  dxf.addArc(ox + 0, oy + H, r, 180, 90, L);
  dxf.addArc(ox + W, oy + H, r, 90, 0, L);
  dxf.addArc(ox + W, oy + 0, r, 0, 270, L);
  dxf.addArc(ox + 0, oy + 0, r, 270, 180, L);

  // Alt kenar (kisa olcu)
  dxf.addLine(ox + 0, oy - r, ox + 0, oy + yAlt, L);
  dxf.addLine(ox + W, oy - r, ox + W, oy + yAlt, L);
  dxf.addLine(ox + 0, oy + yAlt, ox + W, oy + yAlt, L);

  // Sol kanat (egimli dis kenar)
  dxf.addLine(ox - r, oy + H, ox + xSolUst, oy + H, L);
  dxf.addLine(ox - r, oy + 0, ox + xSolAlt, oy + 0, L);
  dxf.addLine(ox + xSolAlt, oy + 0, ox + xSolUst, oy + H, L);

  // Sag kanat (egimli dis kenar)
  dxf.addLine(ox + W + r, oy + H, ox + xSagUst, oy + H, L);
  dxf.addLine(ox + W + r, oy + 0, ox + xSagAlt, oy + 0, L);
  dxf.addLine(ox + xSagAlt, oy + 0, ox + xSagUst, oy + H, L);
}

// Parcayi sol-alt kosesi (ox, oy) olacak sekilde yerlestirir, dis olcuyu doner.
function drawTavaParca(dxf, ox, oy, W, H, alt) {
  drawTava(dxf, ox + TAVA_R + alt, oy + TAVA_R + alt, W, H, alt);
  return { w: W + 2 * (TAVA_R + alt), h: H + 2 * TAVA_R + TAVA_UST + alt };
}

function generateAndDownloadTavaDxf(list) {

    for (var a = 0; a < t.adet; a++) {

      xCursor += dim.w + TAVA_GAP;
    }

  var name = modulDxfIndir(dxf, elTDosyaAdi, TAVA_DOSYA_EKI, 'tava');
  return { success: true, count: totalCount, filename: name };
}

// Girilen GENISLIK'ten: yatay parcanin kenari + kac takim gerektigi.
//
// BOLME KURALI YALNIZCA GENISLIGE BAKAR. Yukseklik ne olursa olsun bolmez —
// bolunme yatay parcanin imal edilebilir uzunlugundan doguyor, dikey parcanin
// boyuyla ilgisi yok. (Bagimsiz modulde bu kural &quot;uzun olcu&quot;ye bakiyordu; dik
// bir damperde yukseklik esigi asinca yanlislikla ikiye boluyordu.)
function damperHesap(genislik) {
  if (genislik >= DAMPER_BOLME_ESIGI) {
    return { kenar: ((genislik + DAMPER_BOLME_EK) / 2) - DAMPER_BOLME_DUS, takim: 2 };
  }
  return { kenar: genislik + DAMPER_UZUN_EK, takim: 1 };
}

// Olcu yazimi: 1015 -> &quot;1015&quot;, 286.4 -> &quot;286.4&quot;
function damperSayi(v) {
  return (Math.round(v * 1000) / 1000).toString();
}

// Gomulu geometriyi esneterek (ox, oy) noktasina cizer.
// delta: uzama miktari - sinir: bu degerin otesindeki noktalar blok halinde kayar
function drawDamperParca(dxf, geom, ox, oy, delta, sinir, eksen) {
  var L = DAMPER_LAYER;
  function px(x) { return ox + (eksen === 'x' && x > sinir ? x + delta : x); }
  function py(y) { return oy + (eksen === 'y' && y > sinir ? y + delta : y); }

  geom.forEach(function(e) {
    if (e[0] === 'L') {
      dxf.addLine(px(e[1]), py(e[2]), px(e[3]), py(e[4]), L);
    } else if (e[0] === 'C') {
      dxf.addCircle(px(e[1]), py(e[2]), e[3], L);
    } else if (e[0] === 'A') {
      dxf.addArc(px(e[1]), py(e[2]), e[3], e[4], e[5], L);
    } else if (e[0] === 'S') {
      var pts = e[1].map(function(p) { return [px(p[0]), py(p[1])]; });
      dxf.addSpline(pts, e[3], e[2], 8, L);   // flags 8 = PLANAR (referansla ayni)
    }
  });
}

// Bir damper takimi = 2 YATAY + 2 DIKEY parca.
//   DAMPER_UZUN_GEOM = yatay cerceve parcasi -> boyu GENISLIGI takip eder (x'te esner)
//   DAMPER_KISA_GEOM = dikey cerceve parcasi -> boyu YUKSEKLIGI takip eder (y'de esner)
// Sac uzerindeki dizilim referans &quot;100 X 30 DAMPER.dxf&quot; ile ayni:
// [DIKEY] [YATAY/YATAY] [DIKEY]
function drawDamperTakim(dxf, ox, oy, kenar, yukseklik) {
  var dUzun = kenar - DAMPER_UZUN_REF_KENAR;
  var dKisa = (yukseklik + DAMPER_KISA_EK) - DAMPER_KISA_REF_KENAR;

  var uzunG = DAMPER_UZUN_BOYUT[0] + dUzun;
  var uzunY = DAMPER_UZUN_BOYUT[1];
  var kisaG = DAMPER_KISA_BOYUT[0];
  var kisaY = DAMPER_KISA_BOYUT[1] + dKisa;

  var uzunToplamY = 2 * uzunY + DAMPER_GAP;
  var takimY = Math.max(uzunToplamY, kisaY);
  var ortaX = ox + kisaG + DAMPER_GAP;

  for (var i = 0; i < 2; i++) {
    var ty = oy + (takimY - uzunToplamY) / 2 + i * (uzunY + DAMPER_GAP);
    drawDamperParca(dxf, DAMPER_UZUN_GEOM, ortaX, ty, dUzun, DAMPER_UZUN_X_BOL, 'x');
  }
  var kisaTabanY = oy + (takimY - kisaY) / 2;
  drawDamperParca(dxf, DAMPER_KISA_GEOM, ox, kisaTabanY, dKisa, DAMPER_KISA_Y_BOL, 'y');
  drawDamperParca(dxf, DAMPER_KISA_GEOM, ortaX + uzunG + DAMPER_GAP, kisaTabanY,
                  dKisa, DAMPER_KISA_Y_BOL, 'y');

  return { w: 2 * kisaG + uzunG + 2 * DAMPER_GAP, h: takimY };
}

// Bir kaydin tum takimlarini (bolunmusse 2, degilse 1) YAN YANA cizer.
// genislik ve yukseklik AYRI anlamlidir — buyuk/kucuk diye normalize EDILMEZ.
function drawDamperKayit(dxf, ox, oy, genislik, yukseklik) {
  var h = damperHesap(genislik);
  var toplamW = 0;
  var yuk = 0;
  for (var t = 0; t < h.takim; t++) {
    var dim = drawDamperTakim(dxf, ox + toplamW, oy, h.kenar, yukseklik);
    toplamW += dim.w + (t < h.takim - 1 ? DAMPER_GAP : 0);
    yuk = dim.h;
  }
  return { w: toplamW, h: yuk };
}

function generateAndDownloadDamperDxf(list) {
  var dxf = new DxfWriter();
  var xCursor = 0;

  list.forEach(function(d) {
    for (var a = 0; a < d.adet; a++) {
      var dim = drawDamperKayit(dxf, xCursor, 0, d.genislik, d.yukseklik);
      xCursor += dim.w + DAMPER_GAP;
    }
  });

  var totalCount = 0;
  list.forEach(function(d) { totalCount += d.adet; });

  // Dosya adi: elle girilen > proje adi + son ek > varsayilan. Modulun kendi
  // [^a-zA-Z0-9_-] temizligi Turkce harfleri bozuyordu, modulDxfIndir kullaniyoruz.
  var name = modulDxfIndir(dxf, elDDosyaAdi, DAMPER_DOSYA_EKI, 'damper');
  return { success: true, count: totalCount, filename: name };
}

var ARAKAT_SET_GAP_X = 700.0;   // DIS ile IC arasi yatay bosluk
var ARAKAT_SET_GAP_Y = 500.0;   // ustuste setler arasi dusey bosluk

function akAddMiddleHoles(dxf, ox, oy, x1, y1, x2, y2, maxGap, r, layer) {
  var d = Math.sqrt((x2-x1)*(x2-x1) + (y2-y1)*(y2-y1));
  if (d > maxGap) {
    var n = Math.ceil(d / maxGap);
    for (var i = 1; i < n; i++) {
      var frac = i / n;
      var x = x1 + frac * (x2 - x1);
      var y = y1 + frac * (y2 - y1);
      dxf.addCircle(ox + x, oy + y, r, layer);
    }
  }
}

// Tek bir ara kat parcasi (DIS veya IC) cizer, tumu beyaz (color 7)
function drawArakatPiece(dxf, ox, oy, B, K, DLT, LT, NEAR_OFS, FAR_OFS) {
  var r = 2.5;
  var L = ARAKAT_LAYER;
  var W = B + 2*LT - DLT;
  var H = K + 2*LT - DLT;

  // Buyuk olcu cizgileri (ust/alt yatay)
  dxf.addLine(ox + LT,            oy + H, ox + LT + B - DLT, oy + H,  L);
  dxf.addLine(ox + LT + B - DLT,  oy,     ox + LT,           oy,      L);

  // Kucuk olcu cizgileri (sol/sag dikey)
  dxf.addLine(ox + W, oy + LT + K - DLT, ox + W, oy + LT, L);
  dxf.addLine(ox,     oy + LT,           ox,     oy + LT + K - DLT, L);

  // 4 kose L parcasi (2 cizgi her bir L)
  dxf.addLine(ox + LT,     oy + H,     ox + LT,     oy + H - LT, L);
  dxf.addLine(ox + LT,     oy + H - LT,ox,          oy + H - LT, L);
  dxf.addLine(ox + W - LT, oy + H,     ox + W - LT, oy + H - LT, L);
  dxf.addLine(ox + W - LT, oy + H - LT,ox + W,      oy + H - LT, L);
  dxf.addLine(ox + LT,     oy,         ox + LT,     oy + LT,     L);
  dxf.addLine(ox + LT,     oy + LT,    ox,          oy + LT,     L);
  dxf.addLine(ox + W - LT, oy,         ox + W - LT, oy + LT,     L);
  dxf.addLine(ox + W - LT, oy + LT,    ox + W,      oy + LT,     L);

  // Sabit delikler (8 adet)
  dxf.addCircle(ox + FAR_OFS,      oy + H - NEAR_OFS, r, L);
  dxf.addCircle(ox + W - FAR_OFS,  oy + H - NEAR_OFS, r, L);
  dxf.addCircle(ox + FAR_OFS,      oy + NEAR_OFS,     r, L);
  dxf.addCircle(ox + W - FAR_OFS,  oy + NEAR_OFS,     r, L);
  dxf.addCircle(ox + NEAR_OFS,     oy + FAR_OFS,      r, L);
  dxf.addCircle(ox + NEAR_OFS,     oy + H - FAR_OFS,  r, L);
  dxf.addCircle(ox + W - NEAR_OFS, oy + FAR_OFS,      r, L);
  dxf.addCircle(ox + W - NEAR_OFS, oy + H - FAR_OFS,  r, L);

  // Ek delikler (pembe) - sari delikler arasinda 390 mm kurali
  akAddMiddleHoles(dxf, ox, oy, FAR_OFS,     H - NEAR_OFS, W - FAR_OFS, H - NEAR_OFS, ARAKAT_MAX_GAP, r, L);
  akAddMiddleHoles(dxf, ox, oy, FAR_OFS,     NEAR_OFS,     W - FAR_OFS, NEAR_OFS,     ARAKAT_MAX_GAP, r, L);
  akAddMiddleHoles(dxf, ox, oy, NEAR_OFS,    FAR_OFS,      NEAR_OFS,    H - FAR_OFS,  ARAKAT_MAX_GAP, r, L);
  akAddMiddleHoles(dxf, ox, oy, W - NEAR_OFS,FAR_OFS,      W - NEAR_OFS,H - FAR_OFS,  ARAKAT_MAX_GAP, r, L);
}

// Bir ara kat seti (DIS solda + IC sagda, merkez hizali)
function drawArakatPair(dxf, ox, oy, B, K, DIS_LT, IC_LT) {
  var W_DIS = B + 2*DIS_LT - 1;
  var OFS_Y = DIS_LT - IC_LT + 1.5;
  // DIS (solda)
  drawArakatPiece(dxf, ox, oy, B, K, 1, DIS_LT, DIS_LT - 15, DIS_LT + 100);
  // IC (sagda, merkez hizali)
  drawArakatPiece(dxf, ox + W_DIS + ARAKAT_SET_GAP_X, oy + OFS_Y,
                  B, K, 4, IC_LT, 15, IC_LT + 98.5);
}

function generateAndDownloadArakatDxf(list) {
  var dxf = new DxfWriter();
  var yCursor = 0;
  var totalCount = 0;

  list.forEach(function(entry) {
    var t = ARAKAT_TYPES[entry.tip];
    var H_DIS = entry.K + 2*t.dis - 1;  // DIS her zaman daha yuksek
    for (var a = 0; a < entry.adet; a++) {
      drawArakatPair(dxf, 0, yCursor, entry.B, entry.K, t.dis, t.ic);
      yCursor -= (H_DIS + ARAKAT_SET_GAP_Y);
      totalCount++;
    }
  });

  // Dosya adi: elle girilen > proje adi + son ek > varsayilan. Modulun kendi
  // [^a-zA-Z0-9_-] temizligi Turkce harfleri bozuyordu, modulDxfIndir kullaniyoruz.
  var name = modulDxfIndir(dxf, elADosyaAdi, ARAKAT_DOSYA_EKI, 'arakat');
  return { success: true, count: totalCount, filename: name };
}

// esnetmeler: [{eksen:'x'|'y', orta, delta}]
function kizakEsnet(geom, esnetmeler) {
  function kay(v, eksen) {
    var r = v;
    esnetmeler.forEach(function(e) { if (e.eksen === eksen && v > e.orta) r += e.delta; });
    return r;
  }
  return geom.map(function(a) {
    return a.length === 4
      ? ['L', kay(a[0], 'x'), kay(a[1], 'y'), kay(a[2], 'x'), kay(a[3], 'y')]
      : ['A', kay(a[0], 'x'), kay(a[1], 'y'), a[2], a[3], a[4]];
  });
}
// L ve UST L ayni tablodan cikar: alt L'de kanat hep 20'dir (delta 0), ust L'de X.
function kizakLGeom(boy, kanat) {
  return kizakEsnet(KIZAK_L, [
    { eksen: 'y', orta: KIZAK_ORTA,       delta: boy   - KIZAK_REF_BOY },
    { eksen: 'x', orta: KIZAK_KANAT_ORTA, delta: kanat - KIZAK_REF_KANAT }
  ]);
}
function kizakOmegaGeom(boy, seri) {
  return kizakEsnet(String(seri) === '50' ? KIZAK_O50 : KIZAK_O60,
    [{ eksen: 'x', orta: KIZAK_ORTA, delta: boy - KIZAK_REF_BOY }]);
}
// Cizilen parcanin sinir kutusu — yerlesim ve olcu yazisi icin.
function kizakKutu(g) {
  var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  function nok(x, y) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  g.forEach(function(a) {
    if (a[0] === 'L') { nok(a[1], a[2]); nok(a[3], a[4]); }
    else { nok(a[1] - a[3], a[2] - a[3]); nok(a[1] + a[3], a[2] + a[3]); }
  });
  return { x0: x0, y0: y0, w: x1 - x0, h: y1 - y0 };
}
// Parcayi (ox, oy) orijinine cizer; geometri kendi sinir kutusundan orijine cekilir.
function drawKizakParca(dxf, ox, oy, g) {
  var k = kizakKutu(g);
  g.forEach(function(a) {
    if (a[0] === 'L') dxf.addLine(ox + a[1] - k.x0, oy + a[2] - k.y0, ox + a[3] - k.x0, oy + a[4] - k.y0, KIZAK_LAYER);
    else dxf.addArc(ox + a[1] - k.x0, oy + a[2] - k.y0, a[3], a[4], a[5], KIZAK_LAYER);
  });
  return k;
}

// Bir takim = ALT L + OMEGA + UST L, her birinden 'adet' kadar.
function kizakParcalari(entry) {
  return [
    { ad: 'ALT L',  g: kizakLGeom(entry.boy, KIZAK_REF_KANAT) },
    { ad: 'OMEGA',  g: kizakOmegaGeom(entry.boy, entry.seri) },
    { ad: 'UST L',  g: kizakLGeom(entry.boy, entry.kanat) }
  ];
}

function generateAndDownloadKizakDxf(list) {
  var dxf = new DxfWriter();
  var yCursor = 0;
  var toplam = 0;

  list.forEach(function(entry) {
    var adet = entry.adet || 1;
    kizakParcalari(entry).forEach(function(pc) {
      var k = kizakKutu(pc.g);
      for (var a = 0; a < adet; a++) {
        drawKizakParca(dxf, 0, yCursor, pc.g);
        dxf.addText(0, yCursor - KIZAK_KOD_H - 4, KIZAK_KOD_H,
          pc.ad + ' ' + Math.round(k.w * 10) / 10 + 'x' + Math.round(k.h * 10) / 10, KIZAK_LAYER);
        yCursor -= (k.h + KIZAK_KOD_H + 4 + KIZAK_GAP);
        toplam++;
      }
    });
  });

  var name = modulDxfIndir(dxf, elKDosyaAdi, KIZAK_DOSYA_EKI, 'batarya_kizak');
  return { success: true, count: toplam, filename: name };
}

// srcdoc TUZAGI — bu fonksiyon modulun tek gercek uyarlamasidir.
// HTML varlik METNI uretmesi gerekiyor ('&' + 'amp;' gibi), ama iframe srcdoc'u
// cozulurken kaynakta duz yazili &amp; / &lt; / &quot; dizileri GERCEK karaktere
// cevrilir; bagimsiz modulden oldugu gibi tasinsaydi fonksiyon sessizce etkisiz
// kalir, kodlama alanina yazilan &lt;b&gt; gibi bir metin tabloya HAM HTML olarak
// girerdi. Bu yuzden hem '&' hem cift tirnak karakter kodundan uretiliyor ve
// regex string'den kuruluyor (f1'deki dosyaAdiTemizle de ayni sebeple boyle).
function esanjorEscapeHtml(s) {
  var AMP = String.fromCharCode(38);      // &
  var TIRNAK = String.fromCharCode(34);   // cift tirnak
  var harita = {};
  harita[AMP]    = AMP + 'amp;';
  harita['<']    = AMP + 'lt;';
  harita['>']    = AMP + 'gt;';
  harita[TIRNAK] = AMP + 'quot;';
  harita[&quot;'&quot;] = AMP + '#39;';
  var desen = new RegExp('[' + AMP + '<>' + TIRNAK + &quot;']&quot;, 'g');
  return String(s).replace(desen, function(c) { return harita[c]; });
}

// =====================================================================
// ESANJOR GEOMETRI (ESANJOR_OTOMATIK.lsp portu)
// =====================================================================
// Tum cizgiler beyaz (color 7) - LSP ile birebir.
// 50'LIK esanjor saci: W = CI + 38, ust = CI - 2, alt = CI - 12, alt ic kose = duz 25x25 L kose
// 60'LIK esanjor saci: W = CI + 33, ust = CI - 7, alt = CI - 17, alt ic kose = R5 yay
// Her iki tip: H = O + 50, yan dikey = O - 5, ust kose = 20 yatay + 30 dikey basamak
// Duz parca : H = 60, sol/sag kenarda Y=29.5..30.5 araligindan 1x1 ic centik
//             50'lik W = CI - 2 ; 60'lik W = CI - 7

var ESANJOR_LAYER = '0';
var ESANJOR_GAP_X = 500.0;   // parcalar arasi yatay bosluk (LSP'deki G)
var ESANJOR_GAP_Y = 500.0;   // setler / satirlar arasi dusey bosluk
var ESANJOR_KOD_H = 10.0;    // kodlama text yuksekligi (mm)

// Kodlama text (10mm, sag-alt hizali). LSP es:text ile birebir.
function esanjorKodYaz(dxf, ox, oy, x, y, kod) {
  if (!kod) return;
  var s = String(kod).trim();
  if (s.length === 0) return;
  // hAlign=2 (Right), vAlign=1 (Bottom) - text genisligine bagimsiz konum.
  if (typeof dxf.addText === 'function') {
    dxf.addText(ox + x, oy + y, ESANJOR_KOD_H, s, ESANJOR_LAYER, 0, 2, 1);
  }
}

function drawEsanjorSac(dxf, ox, oy, kalinlik, CI, O, kod) {
  var L = ESANJOR_LAYER;
  var W = (kalinlik === '60') ? (CI + 33.0) : (CI + 38.0);
  var H = O + 50.0;

  dxf.addLine(ox + 20,     oy + H,       ox + 20,     oy + H - 30, L);
  dxf.addLine(ox + 20,     oy + H - 30,  ox,          oy + H - 30, L);

  dxf.addLine(ox,          oy + H - 30,  ox,          oy + 25,     L);

  if (kalinlik === '60') {
    dxf.addLine(ox,        oy + 25,      ox + 20,     oy + 25,     L);
    dxf.addArc (ox + 25,   oy + 25, 5.0, 180.0, 270.0, L);
    dxf.addLine(ox + 25,   oy + 20,      ox + 25,     oy,          L);
  } else {
    dxf.addLine(ox,        oy + 25,      ox + 25,     oy + 25,     L);
    dxf.addLine(ox + 25,   oy + 25,      ox + 25,     oy,          L);
  }

  dxf.addLine(ox + 25,     oy,           ox + W - 25, oy,          L);

  if (kalinlik === '60') {
    dxf.addLine(ox + W - 25, oy,         ox + W - 25, oy + 20,     L);
    dxf.addArc (ox + W - 25, oy + 25, 5.0, 270.0, 360.0, L);
    dxf.addLine(ox + W - 20, oy + 25,    ox + W,      oy + 25,     L);
  } else {
    dxf.addLine(ox + W - 25, oy,         ox + W - 25, oy + 25,     L);
    dxf.addLine(ox + W - 25, oy + 25,    ox + W,      oy + 25,     L);
  }

  dxf.addLine(ox + W,      oy + 25,      ox + W,      oy + H - 30, L);

  dxf.addLine(ox + W,      oy + H - 30,  ox + W - 20, oy + H - 30, L);
  dxf.addLine(ox + W - 20, oy + H - 30,  ox + W - 20, oy + H,      L);

  dxf.addLine(ox + W - 20, oy + H,       ox + 20,     oy + H,      L);

  // Kodlama: sag-alt = (W-25, H-15) → ust kenardan 5mm bosluk.
  esanjorKodYaz(dxf, ox, oy, W - 25.0, H - 15.0, kod);

  return { W: W, H: H };
}

function drawEsanjorDuz(dxf, ox, oy, kalinlik, CI, kod) {
  var L = ESANJOR_LAYER;
  var W = (kalinlik === '60') ? (CI - 7.0) : (CI - 2.0);
  var H = 60.0;

  dxf.addLine(ox,           oy,          ox + W,       oy,          L);

  dxf.addLine(ox + W,       oy,          ox + W,       oy + 29.5,   L);
  dxf.addLine(ox + W,       oy + 29.5,   ox + W - 1,   oy + 29.5,   L);
  dxf.addLine(ox + W - 1,   oy + 29.5,   ox + W - 1,   oy + 30.5,   L);
  dxf.addLine(ox + W - 1,   oy + 30.5,   ox + W,       oy + 30.5,   L);
  dxf.addLine(ox + W,       oy + 30.5,   ox + W,       oy + 60,     L);

  dxf.addLine(ox + W,       oy + 60,     ox,           oy + 60,     L);

  dxf.addLine(ox,           oy + 60,     ox,           oy + 30.5,   L);
  dxf.addLine(ox,           oy + 30.5,   ox + 1,       oy + 30.5,   L);
  dxf.addLine(ox + 1,       oy + 30.5,   ox + 1,       oy + 29.5,   L);
  dxf.addLine(ox + 1,       oy + 29.5,   ox,           oy + 29.5,   L);
  dxf.addLine(ox,           oy + 29.5,   ox,           oy,          L);

  // Kodlama: sag-alt = (W-5, 45) → ust kenardan 5mm bosluk, centikten uzak.
  esanjorKodYaz(dxf, ox, oy, W - 5.0, 45.0, kod);

  return { W: W, H: H };
}

// Tek set ciz: 4 esanjor yan yana + 4 duz parca 5. konumda alt alta.
// LSP ESANJOR4 / ESANJOR460 ile ayni yerlesim (step = W + 500, duz Y'leri 0/560/1120/1680).
// 'kod' tum 4 sac + 4 duz parcaya ortak yazilir (LSP davranisi ile ayni).
function drawEsanjorSet(dxf, ox, oy, kalinlik, CI, Os, kod, opts) {
  opts = opts || {};
  var includeDuz = opts.includeDuz !== false; // varsayilan: 4 duz parca cizilir
  var n = Os.length;
  var Wsac = (kalinlik === '60') ? (CI + 33.0) : (CI + 38.0);
  var step = Wsac + ESANJOR_GAP_X;

  // N esanjor saci (filtrelenmis Os)
  var maxH = 0;
  for (var i = 0; i < n; i++) {
    var dim = drawEsanjorSac(dxf, ox + step * i, oy, kalinlik, CI, Os[i], kod);
    if (dim.H > maxH) maxH = dim.H;
  }

  var Wdp = (kalinlik === '60') ? (CI - 7.0) : (CI - 2.0);
  var dYs = [0.0, 60.0 + 500.0, 120.0 + 1000.0, 180.0 + 1500.0];

  // 4 duz parca (sac sutunlarinin sagindan baslar; sac yoksa duz solda)
  if (includeDuz) {
    var dX = ox + step * n;
    for (var j = 0; j < 4; j++) {
      drawEsanjorDuz(dxf, dX, oy + dYs[j], kalinlik, CI, kod);
    }
  }

  var setW = step * n + (includeDuz ? Wdp : (n > 0 ? -ESANJOR_GAP_X : 0));
  if (setW < 0) setW = 0;
  var duzH = includeDuz ? (60.0 + dYs[3]) : 0;
  var setH = Math.max(maxH, duzH);
  return { W: setW, H: setH };
}

function generateAndDownloadEsanjorDxf(list) {
  // Her entry icin 1.5mm secili olculer ayri DXF'e gider; geri kalan + duz parca ana DXF'e.
  var mainDxf = new DxfWriter();
  var narrowDxf = new DxfWriter();
  var mainY = 0, narrowY = 0;
  var mainHasContent = false;
  var narrowHasContent = false;

  list.forEach(function(entry) {
    var allOs = [entry.O1, entry.O2, entry.O3, entry.O4];
    var flags = [!!entry.o1_15, !!entry.o2_15, !!entry.o3_15, !!entry.o4_15];
    var mainOs = [], narrowOs = [];
    for (var i = 0; i < 4; i++) {
      if (flags[i]) narrowOs.push(allOs[i]);
      else mainOs.push(allOs[i]);
    }
    // Ana DXF: isaretlenmemis olculer + duz parcalar her zaman
    var mDim = drawEsanjorSet(mainDxf, 0, mainY, entry.kalinlik, entry.CI, mainOs, entry.kod, { includeDuz: true });
    mainY -= (mDim.H + ESANJOR_GAP_Y);
    mainHasContent = true;
    // 1.5mm DXF: sadece isaretli olculer (duz parca yok)
    if (narrowOs.length > 0) {
      var nDim = drawEsanjorSet(narrowDxf, 0, narrowY, entry.kalinlik, entry.CI, narrowOs, entry.kod, { includeDuz: false });
      narrowY -= (nDim.H + ESANJOR_GAP_Y);
      narrowHasContent = true;
    }
  });

  // Dosya adi: elle girilen > proje adi + son ek > varsayilan. Modulun kendi
  // [^a-zA-Z0-9_-] temizligi Turkce harfleri bozuyordu, ortak yardimcilar kullaniliyor.
  // Esanjor TEK cagride IKI dosya uretir: ana set + '1.5 MM' isaretli olculer.
  // Ikisi de ayni tabandan turer (bagimsiz moduldeki davranisin aynisi).
  var taban = modulDosyaAdi(elEDosyaAdi, ESANJOR_DOSYA_EKI, 'esanjor');
  var mainName = taban + '.dxf';
  var narrowName = taban + ' (1.5 MM).dxf';

  if (mainHasContent) modulDxfKaydet(mainDxf, mainName);
  if (narrowHasContent) modulDxfKaydet(narrowDxf, narrowName);

  var combinedName = narrowHasContent ? (mainName + ' + ' + narrowName) : mainName;
  return { success: true, count: list.length, filename: combinedName };
}

// ---------- ANALİZ MOTORU (f0'ın Analiz Excel'i için) ----------
// f0 kendi Excel'ini üretir ama sac plakası sayısı ile kapaktaki delik adedi YALNIZ
// burada bilinir (nesting ve bütün draw* ailesi f1'dedir). Bu yüzden f0 'analizIste'
// yollar, burası hesaplayıp 'analizSonuc' geri döner — ikinci bir nesting/çizim
// kopyası yazılmadı.
//
// DELİK SAYIMI ÖLÇÜLÜR, FORMÜLLE VERİLMEZ: parça atılabilir bir sayaç writer'a
// çizilir ve delikler YARIÇAPA göre ayrılır (olcuAyakIzi'nin deseni). Katman adı
// ölçüt DEĞİLDİR — 60 serisi galvaniz çizimleri katman vermiyor, hepsi '0'a düşüyor
// (ölçüldü: dogrulama/_delik-yaricap.js).
//   r 2.3 daire -> perçin        r 8.1 daire -> vida
//   r 5.0 yay   -> paslanmaz iç sacın vida slotu (1 vida = 2 yay)
//   r 1.0 yay   -> büküm köşesi, delik DEĞİL
var ANALIZ_R_PERCIN = 2.3, ANALIZ_R_VIDA = 8.1, ANALIZ_R_SLOT = 5, ANALIZ_R_TOL = 0.05;

function AnalizSayacW() { this.percin = 0; this.vida = 0; this.slotYay = 0; }
AnalizSayacW.prototype.addLine = function () {};
AnalizSayacW.prototype.addText = function () {};
AnalizSayacW.prototype.addSpline = function () {};
AnalizSayacW.prototype.addCircle = function (cx, cy, r) {
  if (Math.abs(r - ANALIZ_R_PERCIN) < ANALIZ_R_TOL) this.percin++;
  else if (Math.abs(r - ANALIZ_R_VIDA) < ANALIZ_R_TOL) this.vida++;
};
AnalizSayacW.prototype.addArc = function (cx, cy, r) {
  if (Math.abs(r - ANALIZ_R_SLOT) < ANALIZ_R_TOL) this.slotYay++;
};

// PERÇİN İÇ sacdan, VİDA DIŞ sacdan sayılır (Cenk, 31.08.2026: &quot;iç dış eşleşip aynı
// deliğe perçin atılıyor&quot;). Perçin iki sacı birbirine bağlar ve iki sacda AYNI deliğe
// atılır — ölçüldü, iç ile dış perçin sayısı her varyantta eşit, iki kez sayılmaz.
// Vida ise dış sacdan profile takılır; paslanmaz iç sacındaki slot aynı vidanın geçiş
// yeridir, ayrı bir vida değildir (ölçüldü: 50P dış 12 vida = iç 24 yay / 2). Üst
// panelde dış sac hiç yoktur, orada vida da yoktur.
function analizPanelDelik(panelList) {
  var toplam = { percin: 0, vida: 0 }, tipler = {};
  var slotVida = 0;   // tutarlılık kontrolü: paslanmaz iç slot sayısı dış vidayla eşleşmeli
  buildNestPieces(panelList || []).forEach(function (p) {
    var sw = new AnalizSayacW();
    drawNestPiece(sw, { piece: p, x: 0, y: 0, w: p.w, h: p.h, rotated: false });
    var percin = (p.side === 'IC') ? sw.percin : 0;
    var vida = (p.side === 'DIS') ? sw.vida : 0;
    if (p.side === 'IC') slotVida += sw.slotYay / 2;
    if (!percin && !vida) return;
    var t = p.tip || 'DİĞER';
    if (!tipler[t]) tipler[t] = { percin: 0, vida: 0 };
    tipler[t].percin += percin; tipler[t].vida += vida;
    toplam.percin += percin; toplam.vida += vida;
  });
  return { percin: toplam.percin, vida: toplam.vida, slotVida: slotVida, tipler: tipler };
}

// İZOLASYON — kapak arası kayayünü. Alan kapağın KESİM ölçüsünden (B×K) toplanır,
// iç sacın açılımından değil: kayayünü levhası büküm paylarının içine girmez
// (Cenk, 31.08.2026). Kalınlık PROFİL SERİSİNİ izler — 50'lik cihazda 50 mm, 60'lık
// cihazda 60 mm; panelin kendi kalınlığı zaten odur.
//
// Yalnız KAPAK panelleri sayılır. Boğaz/damper/tava tek sac parçalardır, ara katın
// profili de 30 mm'dir — hiçbirinin arasına 50 mm kayayünü girmez.
function analizIzolasyon(panelList) {
  var mm2 = {};   // kalınlık (mm) → alan (mm²)
  (panelList || []).forEach(function (p) {
    var seri = String(p.kalinlik).replace('P', '');
    var kal = Number(seri);
    if (!(kal > 0)) return;
    var B = Number(p.B) || 0, K = Number(p.K) || 0;
    if (!(B > 0 && K > 0)) return;
    var adet = Math.max(1, Number(p.adet) || 1);
    mm2[kal] = (mm2[kal] || 0) + B * K * adet;
  });
  return Object.keys(mm2).sort(function (a, b) { return a - b; }).map(function (k) {
    return { kalinlikMm: Number(k), m2: mm2[k] / 1000000 };
  });
}

// Analiz, kullanıcının kendi listelerine ve nesting modalının durumuna DOKUNMAZ:
// altı liste ile nestState yedeklenir, payload kurulur, hesap yapılır ve finally
// içinde hepsi aynen geri yüklenir. Render çağrılmaz, DOM'a yazılmaz.
function analizHesapla(payload) {
  payload = payload || {};
  var yedek = {
    panels: panels.slice(), bogazList: bogazList.slice(), tavaList: tavaList.slice(),
    damperList: damperList.slice(), arakatList: arakatList.slice(), esanjorList: esanjorList.slice()
  };
  var nestYedek = nestState;
  var listeler = { panels: panels, bogazList: bogazList, tavaList: tavaList,
                   damperList: damperList, arakatList: arakatList, esanjorList: esanjorList };
  try {
    Object.keys(listeler).forEach(function (k) {
      listeler[k].length = 0;
      (payload[k] || []).forEach(function (x) { listeler[k].push(x); });
    });
    var st = nestComputeAll();
    var gruplar = st.groups.map(function (g) {
      return {
        etiket: g.label, malzeme: g.malzeme, gaugeMm: g.report.gaugeMm,
        plaka: g.report.sheetCount, sacW: g.report.sheetW, sacH: g.report.sheetH,
        kg: g.report.totalKg, kgPlaka: g.report.kgPerSheet,
        fire: g.report.firePercent, parca: g.pieces.length
      };
    });
    return {
      gruplar: gruplar, sacW: st.sheetW, sacH: st.sheetH, gap: st.gap,
      toplamPlaka: st.aggregate.totalSheetCount, toplamKg: st.aggregate.totalKg,
      fire: st.aggregate.firePercent,
      delik: analizPanelDelik(payload.panels || []),
      izolasyon: analizIzolasyon(payload.panels || [])
    };
  } finally {
    Object.keys(listeler).forEach(function (k) {
      listeler[k].length = 0;
      yedek[k].forEach(function (x) { listeler[k].push(x); });
    });
    nestState = nestYedek;
  }
}

window.addEventListener('message', function (e) {
  if (!e.data || e.data.type !== 'analizIste') return;
  var sonuc = null, hata = null;
  try { sonuc = analizHesapla(e.data.payload); } catch (ex) { hata = ex && ex.message ? ex.message : String(ex); }
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'analizSonuc', id: e.data.id, sonuc: sonuc, hata: hata }, '*');
  }
});

// postMessage üzerinden (AHU Studio wrapper içinden)
window.addEventListener('message', function(e) {
  if (!e.data || e.data.type !== 'dxfInject') return;
  try { applyKapakData(e.data.payload); } catch(ex) { console.warn('dxfInject hatası:', ex); }
});

// Wrapper'a hazır olduğumuzu bildir (delay: parent listener'ın kurulmasını bekle)
setTimeout(function() {
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'dxfReady' }, '*');
  }
}, 300);
</script>

const ROZET = {plan:['rz-plan','PLANLANDI'], suruyor:['rz-suruyor','SÜRÜYOR'], tamam:['rz-tamam','TAMAM']};
function yolKacar(){
  const tamam = YOL_HARITASI.filter(x=>x.durum==='tamam').length;
  return {tamam, toplam: YOL_HARITASI.length};
}
function yolHaritasiCiz(){
  const s = yolKacar();
  document.getElementById('road-sayac').textContent = s.toplam+' maddenin '+s.tamam+'’i tamam';
  document.getElementById('road-btn-sayac').textContent = s.tamam+'/'+s.toplam;
  document.getElementById('road-body').innerHTML = YOL_HARITASI.map(x=>{
    const rz = ROZET[x.durum] || ROZET.plan;
    const alt = [x.d || '', x.tarih ? ('Bitti: '+x.tarih) : ''].filter(Boolean).join(' · ');
    return '<div class="road-item '+(x.durum==='tamam'?'tamam':'')+'">'
      + '<div class="road-no">'+x.n+'</div>'
      + '<div class="road-ic"><div class="road-t">'+x.t+'</div>'
      + (alt ? '<div class="road-d">'+alt+'</div>' : '')+'</div>'
      + '<span class="road-rozet '+rz[0]+'">'+rz[1]+'</span></div>';
  }).join('');
}
function yolHaritasiAc(ac){
  document.getElementById('road-modal').classList.toggle('open', !!ac);
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') yolHaritasiAc(false); });
yolHaritasiCiz();

window.addEventListener('message',e=>{
  if(e.data&&e.data.type==='dxfExport'){
    show(1);
    setTimeout(()=>document.getElementById('f1').contentWindow.postMessage({type:'dxfInject',payload:e.data.payload},'*'),300);
  }
  // ANALİZ — f0 hesabı ister, f1 yanıtlar. Köprü burada İKİ YÖNLÜDÜR ve dxfExport'tan
  // farklı olarak SEKME DEĞİŞTİRMEZ: kullanıcı Kapak Hesabı'nda kalır, hesap arka planda
  // yapılır. Yük olduğu gibi iletilir (id ile eşlenir, birden çok AHU sırayla sorulur).
  if(e.data&&e.data.type==='analizIste'){
    document.getElementById('f1').contentWindow.postMessage(e.data,'*');
  }
  if(e.data&&e.data.type==='analizSonuc'){
    document.getElementById('f0').contentWindow.postMessage(e.data,'*');
  }
});
</script>
