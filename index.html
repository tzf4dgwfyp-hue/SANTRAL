    const w = (p.xhi - p.xlo) * 10, h = (p.yhi - p.ylo) * 10;
    if (Math.abs(w - 50) <= 6 && Math.abs(h - 50) <= 6) kare++;
    else if (Math.abs(w - 30) <= 6 && Math.abs(h - 100) <= 6) kol++;
  }
  return kare >= 2 && kol >= 1;
}

function bilesenCoz(rpolys) {
  const grup = {};
  for (let i = 0; i < rpolys.length; i++) {
    const p = rpolys[i];
    const m = BILESEN_LAY_RE.exec(p.layer || '');
    if (!m) continue;
    if (m[3] !== 'Right' && m[3] !== 'Left') continue;
    if (p.n < 4 || p.n > 5) continue;
    const k = m[1] + '|' + m[3];
    if (!grup[k]) grup[k] = { mid: m[1], tip: m[2], gor: m[3], rects: [] };
    grup[k].rects.push(p);
  }
  const cikti = {};
  Object.keys(grup).forEach(function (k) {
    const g = grup[k], rects = g.rects;
    let kasa = rects[0];
    for (let i = 1; i < rects.length; i++) {
      const r = rects[i];
      if ((r.xhi - r.xlo) * (r.yhi - r.ylo) > (kasa.xhi - kasa.xlo) * (kasa.yhi - kasa.ylo)) kasa = r;
    }
    const kapaklar = [];
    rects.forEach(function (A) {
      if (A === kasa) return;
      if ((A.xhi - A.xlo) < 15 || (A.yhi - A.ylo) < 30) return;
      for (let i = 0; i < rects.length; i++) {
        if (rects[i] !== A && bilesenIcIce(A, rects[i])) { kapaklar.push(A); return; }
      }
    });
    let blok = null;
    if (/Batarya/i.test(g.tip)) {
      const kh = kasa.yhi - kasa.ylo;
      rects.forEach(function (r) {
        if (r === kasa) return;
        if (r.xlo <= kasa.xlo + 0.1 || r.xhi >= kasa.xhi - 0.1) return;
        const h = r.yhi - r.ylo;
        if (h < kh * 0.5 || h > kh * 0.95) return;
        if (!blok || (r.xhi - r.xlo) > (blok.xhi - blok.xlo)) blok = r;
      });
    }
    // TAVA — kasanin ALTINDA duran dikdortgen(ler). Olculdu (634 cizim): Rotorlu
    // Esanjorde 2 tane, Plakali Esanjor / DX Batarya / Nemlendirici / Karisimda 1 tane.
    // Isitici bataryada da cizili ama Cenk (29.08.2026) 'o hatali cizilmis, isitici
    // altinda tava olmaz' dedi — eleme gercekTavalar'da yapilir, cikarim ham kalir.
    const tavalar = [];
    rects.forEach(function (r) {
      if (r === kasa) return;
      if (r.yhi > kasa.ylo + 0.2) return;
      if ((r.xhi - r.xlo) < 15) return;
      tavalar.push(r);
    });
    if (!cikti[g.mid]) cikti[g.mid] = { tip: g.tip, yanlar: {} };
    cikti[g.mid].yanlar[g.gor] = {
      acilir: acilirIsareti(rpolys, g.gor, g.mid),
      lo: Math.round(kasa.xlo * 10), hi: Math.round(kasa.xhi * 10),
      ylo: Math.round(kasa.ylo * 10), yhi: Math.round(kasa.yhi * 10),
      // 'alt' = kapagin kasanin TABANINDAN yuksekligi. Iki katli modulde hangi kapagin
      // hangi kata ait oldugu bununla bilinir (Cenk, 31.08.2026 — KLM-01 M1'de iki acilir
      // kapak var, biri ust katta biri alt katta ve CAPRAZ duruyorlar).
      kapaklar: kapaklar.sort(function (a, b) { return a.xlo - b.xlo; }).map(function (r) {
        return { lo: Math.round((r.xlo - kasa.xlo) * 10), w: Math.round((r.xhi - r.xlo) * 10),
                 h: Math.round((r.yhi - r.ylo) * 10), alt: Math.round((r.ylo - kasa.ylo) * 10) };
      }),
      batarya: blok ? { lo: Math.round((blok.xlo - kasa.xlo) * 10),
                        kalinlik: Math.round((blok.xhi - blok.xlo) * 10) } : null,
      // ORTUSEN dikdortgenler TEK govdedir (Cenk, 29.08.2026). Olculdu: 45 rotorlu
      // esanjorun 45'inde tava iki parca cizilmis ve parcalar 20 mm ortusuyor
      // (50+240 ile 270+240) — ikisi birlikte tek 460 mm'lik tavadir.
      tavalar: (function () {
        const ham = tavalar.sort(function (a, b) { return a.xlo - b.xlo; }).map(function (r) {
          return { lo: Math.round((r.xlo - kasa.xlo) * 10), w: Math.round((r.xhi - r.xlo) * 10) };
        });
        const out = [];
        ham.forEach(function (t) {
          const son = out[out.length - 1];
          if (son && t.lo <= son.lo + son.w + 0.5) {
            const hi = Math.max(son.lo + son.w, t.lo + t.w);
            son.w = hi - son.lo;
          } else out.push({ lo: t.lo, w: t.w });
        });
        return out;
      })()
    };
  });
  return cikti;
}

// ---------- AGIZ (BOGAZ / DAMPER) CIKARIMI (2026-08-28) ----------
// Cizim agizlari KENDI USTUNDE etiketliyor: her gorunuste ayri bir '#DirectionArrow#'
// katmani + TAZE / ATIŞ / DÖNÜŞ / EGZOZ yazisi var. Okun YAN (Right) gorunusteki konumu
// yuzu verir — govdenin solunda SOL, saginda SAG, KATIN tavaninin ustunde UST — x'i de
// modulu. Front/Back gorunusunun hangi uca baktigini cozmeye GEREK YOK.
//
// Agzin OLCUSU ve TIPI teknik tablodan DEGIL geometriden okunur: uc gorunuste modulun yuz
// konturu + cerceve profilleri cizili, agiz iceride ayri bir dikdortgen, damper olanin
// icinde kanat cizgileri var. 634 cizim / 1400 ok uzerinde olculdu:
//   modul + yuz cozulen 1393 · SOL 672'nin 672'sinde olcu VE tip tabloyla birebir ayni
//   SAG 673'un 371'inin olcusu TABLODA HIC YOK ama geometriden okunuyor
//   1345 SOL/SAG agzin 1343'u yuz icinde W ekseninde TAM ORTALI
// Bu yuzden kaynak geometridir.
//
// UST agizlar (48 tane) 28.08.2026'da kapsama alindi. Onlar PLAN (Top) gorunusunden
// okunur ve iki ek kural gerekir (olculdu, 634 cizim):
//   - eksen TAKASTIR: plan x = L, plan y = W. Teknik tabloyla karsilastirilan 32 agzin
//     32'sinde tablo 'Genislik' -> W, 'Yukseklik' -> L cikti; duz eslesme 0.
//   - agiz dikdortgeni 4 NOKTALI; plandaki 5 noktali dikdortgen FILTRE KASETIDIR
//     (dogru okunan 32 agzin 32'si n=4, yanlis secilen 6 kasetin 6'si n=5).
//   - W ekseninde 32/32 TAM ORTALI — SOL/SAG kuralinin aynisi.
// Cizimde dikdortgen bulunamazsa teknik tablo YEDEGE girer (DES ailesinde 12 agiz).
const AGIZ_ETIKET = { 'TAZE': 'TAZE', 'ATIŞ': 'ATIŞ', 'ATIS': 'ATIŞ', 'DÖNÜŞ': 'DÖNÜŞ',
                      'DONUS': 'DÖNÜŞ', 'EGZOZ': 'EGZOST', 'EGZOST': 'EGZOST' };
const AGIZ_OK_RE = /#DirectionArrow#_(\w+?)_/;

function agizBuyut(b, e) {
  if (e.xlo < b.xlo) b.xlo = e.xlo;
  if (e.xhi > b.xhi) b.xhi = e.xhi;
  if (e.ylo < b.ylo) b.ylo = e.ylo;
  if (e.yhi > b.yhi) b.yhi = e.yhi;
}

// gorunus|modul -> sinir kutusu
function agizModulKutulari(rpolys, rlines) {
  const g = {};
  function ekle(e) {
    const m = BILESEN_LAY_RE.exec(e.layer || '');
    if (!m) return;
    const k = m[3] + '|' + m[1];
    if (!g[k]) g[k] = { mod: m[1], islev: m[2], gor: m[3],
                        xlo: e.xlo, xhi: e.xhi, ylo: e.ylo, yhi: e.yhi };
    else agizBuyut(g[k], e);
  }
  for (let i = 0; i < rpolys.length; i++) ekle(rpolys[i]);
  for (let i = 0; i < rlines.length; i++) ekle(rlines[i]);
  return g;
}

// gorunus -> etiketli ok kumeleri
function agizOklari(rpolys, rlines, texts) {
  const ent = {};
  function ekle(e) {
    const m = AGIZ_OK_RE.exec(e.layer || '');
    if (!m) return;
    if (!ent[m[1]]) ent[m[1]] = [];
    ent[m[1]].push(e);
  }
  for (let i = 0; i < rpolys.length; i++) ekle(rpolys[i]);
  for (let i = 0; i < rlines.length; i++) ekle(rlines[i]);
  const out = {};
  Object.keys(ent).forEach(function (gor) {
    const ks = [];
    ent[gor].forEach(function (e) {
      let hit = null;
      for (let i = 0; i < ks.length; i++) {
        const k = ks[i];
        if (e.xlo <= k.xhi + 12 && e.xhi >= k.xlo - 12
         && e.ylo <= k.yhi + 12 && e.yhi >= k.ylo - 12) { hit = k; break; }
      }
      if (hit) agizBuyut(hit, e);
      else ks.push({ xlo: e.xlo, xhi: e.xhi, ylo: e.ylo, yhi: e.yhi });
    });
    ks.forEach(function (k) {
      for (let i = 0; i < texts.length; i++) {
        const t = texts[i];
        if (!t.layer || t.layer.indexOf('#DirectionArrow#_' + gor + '_') < 0) continue;
        if (t.x < k.xlo - 30 || t.x > k.xhi + 30) continue;
        if (t.y < k.ylo - 30 || t.y > k.yhi + 30) continue;
        const e = AGIZ_ETIKET[String(t.str || '').trim().toUpperCase()];
        if (e) { k.etiket = e; break; }
      }
    });
    out[gor] = ks.filter(function (k) { return k.etiket; });
  });
  return out;
}

// Okun modulunu ve yuzunu yan gorunusten cozer.
// KAT BANDI TAM YUKSEKLIK MODULUYLE KURULMAZ: rotor gibi iki kati birden kaplayan modul
// bantlari tek banda kaynastirir. Bantlari yalniz EN KISA modul yuksekligine yakin olanlar
// tanimlar, sonra her modul ortustugu HER banda girer.
function agizYuzCoz(modKut, oklar, catiOf) {
  const mods = [];
  Object.keys(modKut).forEach(function (k) { if (modKut[k].gor === 'Right') mods.push(modKut[k]); });
  const oks = oklar.Right || [];
  if (!mods.length || !oks.length) return [];
  let minH = Infinity;
  mods.forEach(function (m) { const h = m.yhi - m.ylo; if (h < minH) minH = h; });
  if (!(minH > 0)) return [];
  const bant = [];
  mods.forEach(function (m) {
    if ((m.yhi - m.ylo) > minH * 1.4) return;
    let hit = null;
    for (let i = 0; i < bant.length; i++) {
      const b = bant[i];
      if (Math.min(b.yhi, m.yhi) - Math.max(b.ylo, m.ylo) > minH * 0.5) { hit = b; break; }
    }
    if (hit) { if (m.ylo < hit.ylo) hit.ylo = m.ylo; if (m.yhi > hit.yhi) hit.yhi = m.yhi; }
    else bant.push({ ylo: m.ylo, yhi: m.yhi, mods: [] });
  });
  if (!bant.length) return [];
  bant.sort(function (a, b) { return a.ylo - b.ylo; });
  mods.forEach(function (m) {
    bant.forEach(function (b) {
      if (Math.min(b.yhi, m.yhi) - Math.max(b.ylo, m.ylo) > minH * 0.5) b.mods.push(m);
    });
  });
  const out = [];
  oks.forEach(function (k) {
    const cx = (k.xlo + k.xhi) / 2, cy = (k.ylo + k.yhi) / 2;
    let band = null;
    for (let i = 0; i < bant.length; i++)
      if (cy >= bant[i].ylo - 2 && cy <= bant[i].yhi + 2) { band = bant[i]; break; }
    if (!band) {
      band = bant[0];
      let en = Math.abs(cy - (bant[0].ylo + bant[0].yhi) / 2);
      for (let i = 1; i < bant.length; i++) {
        const d = Math.abs(cy - (bant[i].ylo + bant[i].yhi) / 2);
        if (d < en) { en = d; band = bant[i]; }
      }
    }
    if (!band.mods.length) return;
    // CATI BACASI ONCELIKLIDIR (Cenk, 31.08.2026 — KLM-01 'atış boğazını hiç görmedin').
    // Ok bir modulun catisinin UZERINDE ve o modulun tam o x'inde bir baca varsa agiz
    // UST'tedir. Kat bandinin x araligina bakip 'govdenin saginda' demek yanlis: KLM-01'de
    // ATIS oku M4'un catisi uzerinde ama ust kat bandi orada bitiyor, agiz SAG/M6'ya
    // atiliyor ve olculemeyip hic konmuyordu. Baca sarti dar tutuldu — gercek bir kanal
    // parcasi gormeden bu dal calismaz.
    if (catiOf) {
      let bacaHedef = null;
      for (let i = 0; i < mods.length && !bacaHedef; i++) {
        const m = mods[i];
        if (cx < m.xlo - 2 || cx > m.xhi + 2) continue;
        const ci = catiOf(m.mod);
        if (!ci || !ci.kasa || !ci.bacalar.length) continue;
        if (cy <= ci.kasa.yhi + 0.2) continue;             // catinin UZERINDE olmali
        for (let j = 0; j < ci.bacalar.length; j++)
          if (cx >= ci.bacalar[j].xlo - 2 && cx <= ci.bacalar[j].xhi + 2) { bacaHedef = m; break; }
      }
      if (bacaHedef) { out.push({ etiket: k.etiket, yuz: 'ÜST', mod: bacaHedef.mod, ok: k }); return; }
    }
    let xlo = Infinity, xhi = -Infinity;
    band.mods.forEach(function (m) { if (m.xlo < xlo) xlo = m.xlo; if (m.xhi > xhi) xhi = m.xhi; });
    let yuz = null, hedef = null;
    if (k.xhi <= xlo + 6) {
      yuz = 'SOL';
      band.mods.forEach(function (m) { if (!hedef || m.xlo < hedef.xlo) hedef = m; });
    } else if (k.xlo >= xhi - 6) {
      yuz = 'SAĞ';
      band.mods.forEach(function (m) { if (!hedef || m.xhi > hedef.xhi) hedef = m; });
    } else if (cy > band.yhi || cy < band.ylo) {
      // KATIN tavani/tabani esas alinir, govdenin degil: DES ailesinde plakali esanjor
      // komsularindan yuksek, global tavan kullanilirsa UST agizlar cozulemiyor.
      yuz = cy > band.yhi ? 'ÜST' : 'ALT';
      band.mods.forEach(function (m) { if (cx >= m.xlo - 2 && cx <= m.xhi + 2) hedef = m; });
    } else return;   // govde icinde kalan ok: sahte ic akis oku (olculdu, 7 tane), atlanir
    if (!hedef) return;
    out.push({ etiket: k.etiket, yuz: yuz, mod: hedef.mod, ok: k });
  });
  return out;
}

// Bir gorunusteki bir modulun yuz konturu + icindeki agiz adaylari.
// Cerceve profili = kenara yapisik ve ince serit (cizim birimi cm; 10 birim = 100 mm).
function agizAdaylari(rpolys, gor, mod) {
  const rects = [];
  for (let i = 0; i < rpolys.length; i++) {
    const p = rpolys[i];
    const m = BILESEN_LAY_RE.exec(p.layer || '');
    if (!m || m[3] !== gor || m[1] !== mod) continue;
    if ((p.xhi - p.xlo) < 3 || (p.yhi - p.ylo) < 3) continue;
    rects.push(p);
  }
  if (!rects.length) return null;
  let yuz = rects[0];
  rects.forEach(function (r) {
    if ((r.xhi - r.xlo) * (r.yhi - r.ylo) > (yuz.xhi - yuz.xlo) * (yuz.yhi - yuz.ylo)) yuz = r;
  });
  const E = 1.0;
  const aday = [];
  rects.forEach(function (k) {
    if (k === yuz) return;
    if (k.xlo < yuz.xlo - E || k.xhi > yuz.xhi + E) return;
    if (k.ylo < yuz.ylo - E || k.yhi > yuz.yhi + E) return;
    const w = k.xhi - k.xlo, h = k.yhi - k.ylo;
    const yapX = Math.abs(k.xlo - yuz.xlo) < E || Math.abs(k.xhi - yuz.xhi) < E;
    const yapY = Math.abs(k.ylo - yuz.ylo) < E || Math.abs(k.yhi - yuz.yhi) < E;
    if ((yapX || yapY) && (w <= 10 || h <= 10)) return;
    for (let i = 0; i < aday.length; i++) {
      const a = aday[i];
      if (Math.abs(a.xlo - k.xlo) < 0.4 && Math.abs(a.xhi - k.xhi) < 0.4
       && Math.abs(a.ylo - k.ylo) < 0.4 && Math.abs(a.yhi - k.yhi) < 0.4) return;
    }
    aday.push(k);
  });
  const net = aday.filter(function (a) {
    return !aday.some(function (b) {
      return b !== a && b.xlo <= a.xlo + E && b.xhi >= a.xhi - E
          && b.ylo <= a.ylo + E && b.yhi >= a.yhi - E
          && (b.xhi - b.xlo) * (b.yhi - b.ylo) > (a.xhi - a.xlo) * (a.yhi - a.ylo) + 1;
    });
  });
  return { yuz: yuz, agizlar: net };
}

// CATI BACASI (2026-08-31) — UST agzin L eksenindeki YERI ve BOYU.
// Yan gorunuste kasanin USTUNE tasan dikdortgen, cati agzinin kanal parcasidir; plandaki
// agiz dikdortgeniyle birebir tutar. OLCULDU (KLM-01): M1 300@50, M4 300@750, M6 450@50 —
// ucu de plandaki dikdortgenlerle ayni; eski havuzda 42 UST agzin 42'sinde de mevcut
// okuma bu bacayla tutuyor. Bacaya bakmak iki kusuru birden kapatir:
//   * iki katli modulun plani IKI KEZ cizilir; hangi plandaki dikdortgenin agiz oldugunu
//     yalniz baca soyler (KLM-01 M1'de kod esanjor govdesini 660x630 agiz saniyordu),
//   * kat bandinin x araligi disinda kalan ok 'govdenin saginda' sanilip SAG'a atiliyordu
//     (KLM-01 ATIS oku M4'un catisi uzerinde; agiz hic konmuyordu).
// Donus: { kasa, bacalar: [{xlo, xhi, lo, w}] } — lo/w mm, kasanin solundan.
function agizCatiBilgi(rpolys, mod) {
  const rects = [];
  for (let i = 0; i < rpolys.length; i++) {
    const p = rpolys[i];
    const m = BILESEN_LAY_RE.exec(p.layer || '');
    if (!m || m[3] !== 'Right' || m[1] !== mod) continue;
    rects.push(p);
  }
  if (!rects.length) return { kasa: null, bacalar: [] };
  let kasa = rects[0];
  rects.forEach(function (r) {
    if ((r.xhi - r.xlo) * (r.yhi - r.ylo) > (kasa.xhi - kasa.xlo) * (kasa.yhi - kasa.ylo)) kasa = r;
  });
  const out = [];
  rects.forEach(function (r) {
    if (r === kasa) return;
    if (Math.abs(r.ylo - kasa.yhi) > 0.5) return;          // TAM catinin uzerinde baslamali
    const w = r.xhi - r.xlo, h = r.yhi - r.ylo;
    if (w < 10 || h < 2 || h > 40) return;                 // >=100 mm genis, 20..400 mm derin
    if (r.xlo < kasa.xlo - 5 || r.xhi > kasa.xhi + 5) return;
    for (let i = 0; i < out.length; i++)
      if (Math.abs(out[i].xlo - r.xlo) < 0.5 && Math.abs(out[i].xhi - r.xhi) < 0.5) return;
    out.push({ xlo: r.xlo, xhi: r.xhi,
               lo: Math.round((r.xlo - kasa.xlo) * 10), w: Math.round(w * 10) });
  });
  out.sort(function (a, b) { return a.xlo - b.xlo; });
  return { kasa: kasa, bacalar: out };
}

// Bir gorunuste modulun BUTUN yuz konturlari (iki katli modulun plani IKI KEZ cizilir).
// agizAdaylari tek konturu — en buyugunu — alir; burasi ayni boydaki her konturu ayri
// paket olarak dondurur.
function agizPaketleri(rpolys, gor, mod) {
  const rects = [];
  for (let i = 0; i < rpolys.length; i++) {
    const p = rpolys[i];
    const m = BILESEN_LAY_RE.exec(p.layer || '');
    if (!m || m[3] !== gor || m[1] !== mod) continue;
    if ((p.xhi - p.xlo) < 3 || (p.yhi - p.ylo) < 3) continue;
    rects.push(p);
  }
  if (!rects.length) return [];
  let enB = 0;
  rects.forEach(function (r) {
    const a = (r.xhi - r.xlo) * (r.yhi - r.ylo);
    if (a > enB) enB = a;
  });
  const konturlar = [];
  rects.forEach(function (r) {
    if ((r.xhi - r.xlo) * (r.yhi - r.ylo) < enB * 0.99) return;
    for (let i = 0; i < konturlar.length; i++)
      if (Math.abs(konturlar[i].xlo - r.xlo) < 0.5 && Math.abs(konturlar[i].ylo - r.ylo) < 0.5) return;
    konturlar.push(r);
  });
  const E = 1.0;
  return konturlar.map(function (yuz) {
    const aday = [];
    rects.forEach(function (k) {
      if (k === yuz) return;
      if (k.xlo < yuz.xlo - E || k.xhi > yuz.xhi + E) return;
      if (k.ylo < yuz.ylo - E || k.yhi > yuz.yhi + E) return;
      const w = k.xhi - k.xlo, h = k.yhi - k.ylo;
      const yapX = Math.abs(k.xlo - yuz.xlo) < E || Math.abs(k.xhi - yuz.xhi) < E;
      const yapY = Math.abs(k.ylo - yuz.ylo) < E || Math.abs(k.yhi - yuz.yhi) < E;
      if ((yapX || yapY) && (w <= 10 || h <= 10)) return;
      for (let i = 0; i < aday.length; i++) {
        const a = aday[i];
        if (Math.abs(a.xlo - k.xlo) < 0.4 && Math.abs(a.xhi - k.xhi) < 0.4
         && Math.abs(a.ylo - k.ylo) < 0.4 && Math.abs(a.yhi - k.yhi) < 0.4) return;
      }
      aday.push(k);
    });
    const net = aday.filter(function (a) {
      return !aday.some(function (b) {
        return b !== a && b.xlo <= a.xlo + E && b.xhi >= a.xhi - E
            && b.ylo <= a.ylo + E && b.yhi >= a.yhi - E
            && (b.xhi - b.xlo) * (b.yhi - b.ylo) > (a.xhi - a.xlo) * (a.yhi - a.ylo) + 1;
      });
    });
    return { yuz: yuz, agizlar: net };
  });
}

// Dikdortgenin ICINDE kanat cizgisi var mi — damperin isareti, flansta yoktur.
// KENARA DENK GELEN CIZGI DE KANATTIR (Cenk, 28.08.2026: 'kenarda kanat varsa o kesin
// damperdir'). Onceki surum dikdortgenin kendi kenarini kanat sanmamak icin onlari
// eliyordu; olculdu — 634 cizimde eleme HIC tetiklenmiyordu (kanatlar hep iceride) ve
// kaldirmak tek bir agzin tipini bile degistirmedi. Kural yine de dogru tarafta durur:
// kenara denk gelen bir kanat artik damper sayilir.
function agizKanat(rlines, gor, mod, k) {
  const E = 0.8;
  let n = 0;
  for (let i = 0; i < rlines.length; i++) {
    const e = rlines[i];
    const m = BILESEN_LAY_RE.exec(e.layer || '');
    if (!m || m[3] !== gor || m[1] !== mod) continue;
    const yatay = (e.yhi - e.ylo) < 0.01, dikey = (e.xhi - e.xlo) < 0.01;
    if (!yatay && !dikey) continue;
    if (e.xlo < k.xlo - E || e.xhi > k.xhi + E) continue;
    if (e.ylo < k.ylo - E || e.yhi > k.yhi + E) continue;
    n++;
  }
  return n;
}

// Teknik tablodaki agiz satirlari — UST agizlar icin YEDEK kaynak. Tablo BIRINCIL DEGILDIR:
// cogu cizim yalniz 'Taze Hava' satirini tasiyor (371 SAG agzin olcusu tabloda hic yok) ve
// bayat olabiliyor (P-HSV-WM-12000: tablo 300, cizim 450; kardes cizim 15000 cizimi
// dogruluyor). Bu yuzden yalniz cizimde dikdortgen bulunamadiginda kullanilir.
const AGIZ_TABLO_ALAN = [
  ['TAZE',   /Taze Hava\s*-\s*Taze Hava\s*-\s*/],
  ['ATIŞ',   /Taze Hava\s*-\s*Atış Havası\s*-\s*/],
  ['DÖNÜŞ',  /Dönüş Havası\s*-\s*Dönüş Havası\s*-\s*/],
  ['EGZOST', /Dönüş Havası\s*-\s*Egzost Havası\s*-\s*/]
];

function agizTabloSayi(v) {
  const m = String(v || '').replace(/\./g, '').match(/(\d+)/);
  return m ? +m[1] : 0;
}

function agizTablo(texts) {
  const sol = [];
  for (let i = 0; i < texts.length; i++) if (texts[i].h > 0 && texts[i].h < 8) sol.push(texts[i]);
  const res = {};
  AGIZ_TABLO_ALAN.forEach(function (par) {
    const ad = par[0], re = par[1], rec = {};
    ['Bağlantı Tipi', 'Genişlik', 'Yükseklik'].forEach(function (alan) {
      let et = null;
      for (let i = 0; i < sol.length; i++) {
        const t = String(sol[i].str || '');
        if (re.test(t) && t.slice(-alan.length) === alan) { et = sol[i]; break; }
      }
      if (!et) return;
      let en = null;
      for (let i = 0; i < sol.length; i++) {
        const t = sol[i];
        if (Math.abs(t.y - et.y) > 1.5 || t.x <= et.x + 10) continue;
        if (!en || t.x < en.x) en = t;
      }
      if (en) rec[alan] = en.str;
    });
    const W = agizTabloSayi(rec['Genişlik']), L = agizTabloSayi(rec['Yükseklik']);
    if (W > 0 && L > 0) res[ad] = { W: W, L: L, damper: /damper/i.test(rec['Bağlantı Tipi'] || '') };
  });
  return res;
}

// Cizimdeki butun agizlar. Cikti mm cinsinden ve modulun KENDI yuz kutusuna goredir:
//   { etiket, mod, yuz, w, h, x, y, yuzW, yuzH, damper }
// x/y yuzun sol-alt kosesinden olculur. w yuzun GENISLIK eksenidir (SOL/SAG'da W, UST'te L),
// h yukseklik ekseni (SOL/SAG'da H, UST'te W). Olcu teknik tablodan geldiyse tabloDan=true
// olur ve x null kalir — cagiran o agzi L ekseninde ortalar ve bunu soyler.
function agizCoz(rpolys, rlines, texts) {
  const modKut = agizModulKutulari(rpolys, rlines);
  const oklar = agizOklari(rpolys, rlines, texts);
  const catiBellek = {};
  const catiOf = function (m) {
    if (!(m in catiBellek)) catiBellek[m] = agizCatiBilgi(rpolys, m);
    return catiBellek[m];
  };
  const ham = agizYuzCoz(modKut, oklar, catiOf);
  if (!ham.length) return [];

  // Uc gorunuslerden (Front/Back) hangisi SOL hangisi SAG: agzi olmasi BEKLENEN moduller
  // hangi gorunuste dikdortgen tasiyorsa o eslesme kazanir.
  const ucGor = [];
  ['Front', 'Back'].forEach(function (g) {
    for (const k in modKut) if (modKut[k].gor === g) { ucGor.push(g); return; }
  });
  const bulunan = {};
  ucGor.forEach(function (g) {
    bulunan[g] = {};
    for (const k in modKut) {
      if (modKut[k].gor !== g) continue;
      const a = agizAdaylari(rpolys, g, modKut[k].mod);
      if (a && a.agizlar.length) bulunan[g][modKut[k].mod] = a;
    }
  });
  function skor(g, yuzAd) {
    let s = 0;
    ham.forEach(function (h) { if (h.yuz === yuzAd && bulunan[g] && bulunan[g][h.mod]) s++; });
    return s;
  }
  const esle = {};
  if (ucGor.length === 2) {
    const a = skor('Front', 'SOL') + skor('Back', 'SAĞ');
    const b = skor('Front', 'SAĞ') + skor('Back', 'SOL');
    if (a >= b) { esle['SOL'] = 'Front'; esle['SAĞ'] = 'Back'; }
    else { esle['SOL'] = 'Back'; esle['SAĞ'] = 'Front'; }
  } else if (ucGor.length === 1) {
    if (skor(ucGor[0], 'SOL') >= skor(ucGor[0], 'SAĞ')) esle['SOL'] = ucGor[0];
    else esle['SAĞ'] = ucGor[0];
  }

  // UST'te ayni modulde birden fazla agiz olabilir (olculdu: yalniz KS-1'de, M1'de iki
  // tane). Ok ile ayirma YALNIZ o zaman yapilir — tek agizda W-ortali sira daha iyidir.
  const ustSay = {};
  ham.forEach(function (h) { if (h.yuz === 'ÜST') ustSay[h.mod] = (ustSay[h.mod] || 0) + 1; });
  const tablo = agizTablo(texts);

  const out = [];
  ham.forEach(function (h) {
    const rec = { etiket: h.etiket, mod: h.mod, yuz: h.yuz,
                  w: null, h: null, x: null, y: null, yuzW: null, yuzH: null, damper: false };
    const ust = (h.yuz === 'ÜST');
    const gor = ust ? 'Top' : (esle[h.yuz] || null);
    if (gor) {
      let paket = (!ust && bulunan[gor]) ? bulunan[gor][h.mod] : null;
      if (!paket) paket = agizAdaylari(rpolys, gor, h.mod);
      let liste = (paket && paket.agizlar.length) ? paket.agizlar.slice() : [];
      if (ust) {
        // Iki katli modulun plani IKI KEZ cizilir; agiz dikdortgeni oteki konturda
        // olabilir (KLM-01 M1). Butun konturlarin adaylari toplanir.
        const paketler = agizPaketleri(rpolys, gor, h.mod);
        // 5 noktali dikdortgen filtre kasetidir, agiz degil.
        const hepsi = [];
        paketler.forEach(function (pk) {
          pk.agizlar.forEach(function (a) { if (a.n === 4) hepsi.push({ k: a, pk: pk }); });
        });
        // CATI BACASI kesin ayractir: L eksenindeki boy ve yer birebir tutmali.
        const ci = catiOf(h.mod);
        const bacali = [];
        if (ci && ci.kasa && ci.bacalar.length) {
          hepsi.forEach(function (e) {
            const aw = Math.round((e.k.xhi - e.k.xlo) * 10);
            const ax = Math.round((e.k.xlo - e.pk.yuz.xlo) * 10);
            for (let j = 0; j < ci.bacalar.length; j++) {
              const b = ci.bacalar[j];
              if (Math.abs(b.w - aw) <= 5 && Math.abs(b.lo - ax) <= 5) { bacali.push(e); return; }
            }
          });
        }
        let secili = null;
        if (bacali.length === 1) secili = bacali[0];
        else if (bacali.length > 1) {
          // Ayni modulde birden cok UST agiz (olculdu: KS-1 M1) — okun L eksenindeki
          // yeriyle ayrilir. Baca eslesmesi adaylari daraltir, okun kendisi secer.
          const okC = (h.ok.xlo + h.ok.xhi) / 2;
          let en = Infinity;
          bacali.forEach(function (e) {
            const c = (e.k.xlo + e.k.xhi) / 2, d = Math.abs(c - okC);
            if (d < en) { en = d; secili = e; }
          });
        }
        if (secili) { paket = secili.pk; liste = [secili.k]; }
        else if (paket) {
          // Baca yoksa eski davranis: W ekseninde ortali olan tercih edilir (32/32 kanit).
          liste = liste.filter(function (a) { return a.n === 4; });
          const yW = paket.yuz.yhi - paket.yuz.ylo;
          liste.sort(function (a, b) {
            return Math.abs((a.ylo - paket.yuz.ylo) - (yW - (a.yhi - a.ylo)) / 2)
                 - Math.abs((b.ylo - paket.yuz.ylo) - (yW - (b.yhi - b.ylo)) / 2);
          });
        }
      }
      if (liste.length) {
        // Ayni modulde birden fazla agiz: SOL/SAG'da iki kat (y ekseni), UST'te iki ayri
        // agiz (L ekseni). Ikisi de YAN gorunusteki okla ayrilir — uc/plan gorunusteki
        // ilgili eksen, yan gorunustekiyle ayni dunya kotudur.
        let k = liste[0];
        if (!ust || ustSay[h.mod] > 1) {
          const okC = ust ? (h.ok.xlo + h.ok.xhi) / 2 : (h.ok.ylo + h.ok.yhi) / 2;
          let en = Infinity;
          liste.forEach(function (a) {
            const c = ust ? (a.xlo + a.xhi) / 2 : (a.ylo + a.yhi) / 2;
            const d = Math.abs(c - okC);
            if (d < en) { en = d; k = a; }
          });
        }
        rec.w = Math.round((k.xhi - k.xlo) * 10);
        rec.h = Math.round((k.yhi - k.ylo) * 10);
        rec.x = Math.round((k.xlo - paket.yuz.xlo) * 10);
        rec.y = Math.round((k.ylo - paket.yuz.ylo) * 10);
        // UST agzin W eksenindeki yeri (Cenk, 31.08.2026: «çizimden anlaşılıyor hangi yüze
        // dayalı olduğu, her zaman arka yüze dayalı olmak zorunda değil»). Cizim BIRINCI
        // ACI izdusumudur — plan yan gorunusun ALTINDA, alt gorunus USTUNDE, Right gorunus
        // sayfanin solunda; ucu de ayni sonucu veriyor. Birinci acida planin yan gorunuse
        // KOMSU kenari ON (servis) yuzdur. 'on' = agzin ON kenarina uzakligi (mm).
        if (ust) {
          const yan = modKut['Right|' + h.mod];
          const onYukari = !yan || yan.ylo > paket.yuz.yhi;
          rec.on = onYukari ? Math.round((paket.yuz.yhi - k.yhi) * 10)
                            : Math.round((k.ylo - paket.yuz.ylo) * 10);
        }
        rec.yuzW = Math.round((paket.yuz.xhi - paket.yuz.xlo) * 10);
        rec.yuzH = Math.round((paket.yuz.yhi - paket.yuz.ylo) * 10);
        rec.damper = agizKanat(rlines, gor, h.mod, k) >= 1;
      }
    }
    // Cizimde dikdortgen yoksa UST agzin olcusu TEKNIK TABLODAN alinir (Cenk, 28.08.2026).
    // Tablo 'Genislik' W eksenine, 'Yukseklik' L eksenine gider; L eksenindeki YER
    // bilinmedigi icin cagiran agzi ortalar ve uyari dusurur.
    if (ust && rec.w == null && tablo[h.etiket]) {
      const t = tablo[h.etiket];
      rec.w = t.L; rec.h = t.W; rec.damper = t.damper; rec.tabloDan = true;
    }
    out.push(rec);
  });
  return out;
}

function mergeIntervals(ivals, gap) {
  ivals.sort(function (a, b) { return a[0] - b[0]; });
  const out = [];
  for (let i = 0; i < ivals.length; i++) {
    const iv = ivals[i], last = out[out.length - 1];
    if (last && iv[0] - last[1] < gap) { if (iv[1] > last[1]) last[1] = iv[1]; }
    else out.push([iv[0], iv[1]]);
  }
  return out;
}

function mode(arr) {
  const f = {};
  let best = null, bestN = 0;
  for (let i = 0; i < arr.length; i++) {
    const k = arr[i];
    f[k] = (f[k] || 0) + 1;
    if (f[k] > bestN) { bestN = f[k]; best = k; }
  }
  return best;
}

// ---------- ÇİZİM BİRİMİ (2026-08-31) ----------
// Çizimlerin neredeyse tamamı SANTİMETRE biriminde çizilir: tablo 1070 mm derken
// geometri 107 birimdir ve kodun tamamı bu 10 katını varsayar. Bir çizim (O-AHU-02)
// MİLİMETRE biriminde çıktı: hiçbir görünüş kutusu, hiçbir kat, hiçbir hücre çözülmedi.
// Ölçek ölçülerek bulunur, başlıktan değil — $INSUNITS iki dosyada da 0 (tanımsız).
// Tablodan kesin bilinen üç değer (Genişlik, Yükseklik, Ayak Yüksekliği) çizimdeki ölçü
// metinleriyle karşılaştırılır. Ölçüldü (713 teknik çizim): 712 çizimde cm oyu ağır
// bastı (mm oyu 8 ve altı), tek mm çiziminde cm oyu 0 / mm oyu 30 — ayrım keskin.
// Normalizasyon PARSE SINIRINDA yapılır; aşağıdaki kodun tamamı eskisi gibi cm görür.
function olcekNormalize(P) {
  const oku = function (etiket) {
    for (let i = 0; i < P.texts.length; i++) {
      const lt = P.texts[i];
      if (lt.str.replace(/^(Özellikler|Boyut|Malzemeler) - /, '') !== etiket) continue;
      let val = null;
      for (let j = 0; j < P.texts.length; j++) {
        const t = P.texts[j];
        if (Math.abs(t.y - lt.y) < 3 && t.x > lt.x + 10 && (!val || t.x < val.x)) val = t;
      }
      if (val) { const n = parseInt(val.str.replace(/[^\d]/g, ''), 10); if (n > 0) return n; }
    }
    return null;
  };
  const hedef = [oku('Genişlik'), oku('Yükseklik'), oku('Ayak Yüksekliği (mm)') || 150]
    .filter(function (v) { return v; });
  if (!hedef.length) return 1;
  let cmOy = 0, mmOy = 0;
  for (let i = 0; i < P.dims.length; i++) {
    const m = P.dims[i].meas;
    if (m == null) continue;
    for (let k = 0; k < hedef.length; k++) {
      if (Math.abs(m - hedef[k] / 10) < 0.6) cmOy++;
      if (Math.abs(m - hedef[k]) < 0.6) mmOy++;
    }
  }
  if (!(mmOy > cmOy && mmOy >= 3)) return 1;
  const b = function (o, alan) {
    for (let i = 0; i < alan.length; i++) if (o[alan[i]] != null) o[alan[i]] /= 10;
  };
  P.texts.forEach(function (t) { b(t, ['x', 'y', 'h']); });
  P.dims.forEach(function (d) { b(d, ['x13', 'y13', 'x14', 'y14', 'meas']); });
  P.geo.forEach(function (g) { b(g, ['xlo', 'xhi', 'ylo', 'yhi']); });
  P.rlines.forEach(function (g) { b(g, ['xlo', 'xhi', 'ylo', 'yhi']); });
  P.rpolys.forEach(function (g) { b(g, ['xlo', 'xhi', 'ylo', 'yhi']); });
  return 10;
}

function analyzeDxf(text, fileName) {
  const P = parseDxf(text);
  olcekNormalize(P);
  const texts = P.texts, dims = P.dims, geo = P.geo;

  // ---------- teknik tablo ----------
  const kv = {};
  const tableLabelXs = [];
  // Bazı çizimler (P-ESF, P-HSV-WM ailesi) tablo etiketini grup önekiyle yazıyor:
  // 'Özellikler - Santral Adı', 'Boyut - Genişlik', 'Malzemeler - İç Sac Adı'.
  // Önek listesi KAPALI tutulur; '(M2) - Filtre - Genişlik(1)' ve
  // 'Bağlantı Noktaları - Taze Hava - … - Genişlik' tabloya GİRMEMELİ.
  const GRUP_ONEK = /^(Özellikler|Boyut|Malzemeler) - /;
  const TABLE_RE = /^(Santral Adı|Model Adı|Boyut Adı|Genişlik|Yükseklik|Ayak Yüksekliği \(mm\)|Ağırlık|Hava Debisi|Proje Adı)$/;
  for (let i = 0; i < texts.length; i++) {
    const lt = texts[i];
    const etiket = lt.str.replace(GRUP_ONEK, '');
    if (!TABLE_RE.test(etiket)) continue;
    let val = null;
    for (let j = 0; j < texts.length; j++) {
      const t = texts[j];
      if (Math.abs(t.y - lt.y) < 3 && t.x > lt.x + 10 && (!val || t.x < val.x)) val = t;
    }
    if (val && !(etiket in kv)) kv[etiket] = val.str;
    tableLabelXs.push(lt.x);
  }
  // Kasa kunyesi — ayri harita (tableX'i etkilememeli, bkz. yukarisi)
  const kasa = {};
  const KASA_RE = /^(Profil Adı|İç Sac Adı|İç Sac Kalınlığı \(mm\)|Dış Sac Adı|Dış Sac Kalınlığı \(mm\))$/;
  for (let i = 0; i < texts.length; i++) {
    const lt = texts[i];
    const ketiket = lt.str.replace(GRUP_ONEK, '');
    if (!KASA_RE.test(ketiket) || (ketiket in kasa)) continue;
    let val = null;
    for (let j = 0; j < texts.length; j++) {
      const t = texts[j];
      if (Math.abs(t.y - lt.y) < 3 && t.x > lt.x + 10 && (!val || t.x < val.x)) val = t;
    }
    if (val) kasa[ketiket] = val.str;
  }

  const bilesenler = bilesenCoz(P.rpolys);
  const agizlar = agizCoz(P.rpolys, P.rlines, P.texts);

  const modTypes = {};
  for (let i = 0; i < texts.length; i++) {
    const m = texts[i].str.match(/^\((M\d+)\)\s*-\s*(.+?)\s*-\s*/);
    if (m && !modTypes[m[1]]) modTypes[m[1]] = m[2].trim();
  }
  const W = kv['Genişlik'] ? parseInt(kv['Genişlik'].replace(/[^\d]/g, ''), 10) : null;
  const Htab = kv['Yükseklik'] ? parseInt(kv['Yükseklik'].replace(/[^\d]/g, ''), 10) : null;
  const ayak = kv['Ayak Yüksekliği (mm)'] ? parseInt(kv['Ayak Yüksekliği (mm)'].replace(/[^\d]/g, ''), 10) : 150;
  const tableX = tableLabelXs.length ? Math.min.apply(null, tableLabelXs) - 30 : Infinity;

  // ---------- görünüş kutuları ----------
  const gsegs = geo.filter(function (g) { return (g.yhi - g.ylo) <= 300 && g.xlo < tableX; });
  const bands = mergeIntervals(gsegs.map(function (g) { return [g.ylo, g.yhi]; }), 25);
  const boxes = [];
  for (let bi = 0; bi < bands.length; bi++) {
    const ylo = bands[bi][0], yhi = bands[bi][1];
    const inBand = gsegs.filter(function (g) { return g.ylo >= ylo - 0.5 && g.yhi <= yhi + 0.5; });
    const xIv = mergeIntervals(inBand.map(function (g) { return [g.xlo, g.xhi]; }), 25);
    for (let xi = 0; xi < xIv.length; xi++) {
      if (xIv[xi][1] - xIv[xi][0] < 20 || yhi - ylo < 20) continue;
      boxes.push({ xlo: xIv[xi][0], xhi: xIv[xi][1], ylo: ylo, yhi: yhi, chains: [] });
    }
  }

  // ---------- ölçüler ----------
  const hsegs = dims.filter(function (d) {
    return d.meas != null && d.x13 != null && d.x14 != null && d.y13 != null && d.y14 != null &&
      Math.abs(d.y13 - d.y14) < 0.01;
  }).map(function (d) {
    return { lo: Math.min(d.x13, d.x14), hi: Math.max(d.x13, d.x14), y: d.y13, meas: d.meas };
  }).filter(function (d) { return d.hi - d.lo >= 3; });
  const vdims = dims.filter(function (d) {
    return d.meas != null && d.x13 != null && d.x14 != null && d.y13 != null && d.y14 != null &&
      Math.abs(d.x13 - d.x14) < 0.01;
  }).map(function (d) {
    return { lo: Math.min(d.y13, d.y14), hi: Math.max(d.y13, d.y14), x: d.x13, meas: d.meas };
  });

  for (let i = 0; i < hsegs.length; i++) {
    const s = hsegs[i];
    let best = null, bestD = 71;
    for (let j = 0; j < boxes.length; j++) {
      const b = boxes[j];
      if (s.lo < b.xlo - 12 || s.hi > b.xhi + 12) continue;
      const d = (s.y >= b.ylo && s.y <= b.yhi) ? 0 : (s.y < b.ylo ? b.ylo - s.y : s.y - b.yhi);
      if (d < bestD) { bestD = d; best = b; }
    }
    if (best) best.chains.push(s);
  }
  for (let j = 0; j < boxes.length; j++) {
    const b = boxes[j], byY = {};
    for (let i = 0; i < b.chains.length; i++) {
      const s = b.chains[i], key = Math.round(s.y * 2) / 2;
      (byY[key] = byY[key] || []).push(s);
    }
    b.groups = Object.keys(byY).map(function (y) {
      const uniq = [];
      byY[y].sort(function (a, c) { return a.lo - c.lo || a.hi - c.hi; });
      for (let i = 0; i < byY[y].length; i++) {
        const s = byY[y][i], last = uniq[uniq.length - 1];
        if (last && Math.abs(last.lo - s.lo) < 0.5 && Math.abs(last.hi - s.hi) < 0.5) continue;
        uniq.push(s);
      }
      return { y: +y, segs: uniq };
    });
    b.extLo = b.chains.length ? Math.min.apply(null, b.chains.map(function (s) { return s.lo; })) : b.xlo;
    b.extHi = b.chains.length ? Math.max.apply(null, b.chains.map(function (s) { return s.hi; })) : b.xhi;
  }

  // ---------- kat yapısı (kaide referanslı) ----------
  const baseVal = ayak / 10;
  const baseDims = vdims.filter(function (d) {
    return Math.abs(d.meas - baseVal) < 1 && Math.abs((d.hi - d.lo) - baseVal) < 1;
  });
  let deckHeights = [], deckBounds = null, bandY = null;
  if (baseDims.length) {
    const ys = baseDims.map(function (b) { return Math.round(b.hi * 2) / 2; });
    bandY = +mode(ys);
    let curY = bandY;
    for (let k = 0; k < 4; k++) {
      let next = null;
      for (let i = 0; i < vdims.length; i++) {
        const d = vdims[i];
        if (d.meas * 10 < (Htab ? Htab * 0.5 : 400)) continue;
        if (Math.abs(d.lo - curY) >= 2 || d.hi <= d.lo) continue;
        if (!next || d.meas < next.meas) next = d;
      }
      if (!next) break;
      deckHeights.push(Math.round(next.meas * 10));
      curY = next.hi;
    }
    if (deckHeights.length) {
      deckBounds = [bandY];
      let yy = bandY;
      for (let i = 0; i < deckHeights.length; i++) { yy += deckHeights[i] / 10; deckBounds.push(yy); }
    }
  }
  if (!deckHeights.length && Htab) deckHeights = [Htab];
  const nDecks = deckHeights.length;

  // ---------- yan görünüş kutuları + toplam boy ----------
  // Uç görünüşün yatay ölçüsü santralin ENİdir, yan görünüşünki BOYudur. Ayrım eni
  // referans alır: en tablodan kesin okunur, boy okunmaz.
  //
  // 'En uzun yatay ölçü boydur' varsayımı YANLIŞ: eni boyundan büyük santralde en uzun
  // ölçü endir (P-ESF 30000 → en 3100 / boy 3000; P-PH-100T → en 1750 / boy 1600).
  // Bu yüzden toplam boy da genel maksimumdan değil YAN GÖRÜNÜŞLERDEN okunur.
  //
  // Kare santralde (boy = en) iki görünüş geometrik olarak ayırt edilemez; o durumda
  // hepsi yan görünüş sayılır — ölçü zaten aynı olduğu için sonuç değişmez. Eski kod
  // burada hiçbirini kabul etmiyordu ve santral hiç okunmuyordu (P-PH-52T kusuru).
  const bandBoxes = boxes.filter(function (b) {
    return bandY != null && b.ylo - 20 <= bandY && bandY <= b.yhi && b.groups && b.groups.length;
  });
  const kutuSpan = function (b) { return (b.extHi - b.extLo) * 10; };
  let sideBoxes = bandBoxes.filter(function (b) {
    return !W || (Math.abs(kutuSpan(b) - W) > 20 && kutuSpan(b) > W * 0.5);
  });
  if (!sideBoxes.length)
    sideBoxes = bandBoxes.filter(function (b) { return !W || kutuSpan(b) >= W * 0.9; });

  let totalLen = null;
  const yanZincir = [];
  sideBoxes.forEach(function (b) { for (let i = 0; i < b.chains.length; i++) yanZincir.push(b.chains[i]); });
  if (yanZincir.length)
    totalLen = Math.round(Math.max.apply(null, yanZincir.map(function (d) { return d.hi - d.lo; })) * 10);
  else if (hsegs.length)
    totalLen = Math.round(Math.max.apply(null, hsegs.map(function (d) { return d.hi - d.lo; })) * 10);

  // ---------- modül etiketi -> zincir eşleştirme ----------
  const mlabels = texts.filter(function (t) { return /^M\d+$/.test(t.str); })
    .map(function (t) { return { str: t.str, x: t.x, y: t.y, h: t.h, cx: t.x + 0.35 * t.h * t.str.length }; });
  const modVotes = {}, modVotesYan = {}, modDecksAll = {}, recs = [];
  for (let li = 0; li < mlabels.length; li++) {
    const ml = mlabels[li];
    let box = null;
    for (let j = 0; j < boxes.length; j++) {
      const b = boxes[j];
      if (ml.cx >= b.xlo - 8 && ml.cx <= b.xhi + 8 && ml.y >= b.ylo - 8 && ml.y <= b.yhi + 8) { box = b; break; }
    }
    if (!box || !box.groups.length) continue;
    const isSideBox = bandY != null && box.ylo - 20 <= bandY && bandY <= box.yhi;
    let deck = null;
    if (isSideBox && deckBounds && nDecks > 1 &&
        ml.y >= deckBounds[0] - 8 && ml.y <= deckBounds[nDecks] + 8) {
      deck = 0;
      for (let i = 1; i < nDecks; i++) if (ml.y > deckBounds[i]) deck = i;
      (modDecksAll[ml.str] = modDecksAll[ml.str] || []).push(deck);
    }
    if (ml.cx < box.extLo - 8 || ml.cx > box.extHi + 8) continue;
    let cands = box.groups.filter(function (g) {
      return g.segs.some(function (s) { return s.hi - s.lo >= 15; });
    });
    if (!cands.length) continue;
    if (deck != null) {
      const side = deck === 0 ? cands.filter(function (g) { return g.y <= ml.y; })
        : deck === nDecks - 1 ? cands.filter(function (g) { return g.y >= ml.y; }) : cands;
      if (side.length) cands = side;
    } else if (nDecks === 1) {
      const below = cands.filter(function (g) { return g.y < ml.y - 5; });
      if (below.length) cands = below;
    }
    const multi = cands.filter(function (g) { return g.segs.length >= 2; });
    if (multi.length) cands = multi;
    // Etiket hiçbir ölçünün üstüne denk gelmiyorsa değer, komşu iki ölçü arasındaki
    // BOŞLUKTAN türetilir (aşağıdaki 'edges' dalı). Böyle bir boşluk santralin toplam
    // boyunu aşıyorsa o zincir bu görünüşe ait değildir: iki görünüş tek kutuda
    // birleşmiş demektir (aradaki küçük semboller kutuları köprülüyor — DES-01'de M1
    // için 3790 mm çıkıyordu, santralin tamamı 3500 mm).
    if (totalLen) {
      const makul = cands.filter(function (g) {
        if (g.segs.some(function (s) { return ml.cx >= s.lo - 0.5 && ml.cx <= s.hi + 0.5; })) return true;
        const ke = [box.extLo];
        for (let i = 0; i < g.segs.length; i++) { ke.push(g.segs[i].lo); ke.push(g.segs[i].hi); }
        ke.push(box.extHi);
        ke.sort(function (a, b) { return a - b; });
        for (let i = 0; i + 1 < ke.length; i++)
          if (ml.cx >= ke[i] && ml.cx <= ke[i + 1]) return (ke[i + 1] - ke[i]) * 10 <= totalLen + 1;
        return true;
      });
      if (makul.length) cands = makul;
    }
    // Modüller santralin boyunu paylaşır: modül ölçü zinciri görünüşün UCUNDAN UCUNA gider.
    // Uçlara değmeyen zincir (iç ölçü, kapak açıklığı, ventüri…) modül zinciri değildir.
    // Tek modüllü çizimde belirleyici olan tek şey budur: etikete en yakın ölçü iç ölçüdür
    // (P-PH-100T: 1650), modülün kendisi dış ölçüdür (1600).
    const uctanUca = cands.filter(function (g) {
      let mlo = Infinity, mhi = -Infinity;
      for (let i = 0; i < g.segs.length; i++) { mlo = Math.min(mlo, g.segs[i].lo); mhi = Math.max(mhi, g.segs[i].hi); }
      return mlo <= box.extLo + 2 && mhi >= box.extHi - 2;
    });
    if (uctanUca.length) cands = uctanUca;
    cands.sort(function (a, b) { return Math.abs(ml.y - a.y) - Math.abs(ml.y - b.y); });
    const g = cands[0];
    let val = null, lo = null, hi = null;
    let seg = null;
    for (let i = 0; i < g.segs.length; i++) {
      if (ml.cx >= g.segs[i].lo - 0.5 && ml.cx <= g.segs[i].hi + 0.5) { seg = g.segs[i]; break; }
    }
    if (seg) { val = seg.meas; lo = seg.lo; hi = seg.hi; }
    else {
      const edges = [box.extLo];
      for (let i = 0; i < g.segs.length; i++) { edges.push(g.segs[i].lo); edges.push(g.segs[i].hi); }
      edges.push(box.extHi);
      edges.sort(function (a, b) { return a - b; });
      for (let i = 0; i + 1 < edges.length; i++) {
        if (ml.cx >= edges[i] && ml.cx <= edges[i + 1]) {
          const wgap = edges[i + 1] - edges[i];
          if (wgap >= 4) { val = wgap; lo = edges[i]; hi = edges[i + 1]; }
          break;
        }
      }
      if (val == null) {
        let near = null, nearD = Infinity;
        for (let i = 0; i < g.segs.length; i++) {
          const s = g.segs[i];
          const d = ml.cx < s.lo ? s.lo - ml.cx : ml.cx - s.hi;
          if (d < nearD) { nearD = d; near = s; }
        }
        if (near) { val = near.meas; lo = near.lo; hi = near.hi; }
      }
    }
    if (val != null) {
      (modVotes[ml.str] = modVotes[ml.str] || []).push(Math.round(val * 10));
      if (sideBoxes.indexOf(box) >= 0)
        (modVotesYan[ml.str] = modVotesYan[ml.str] || []).push(Math.round(val * 10));
      recs.push({ name: ml.str, box: box, isSideBox: isSideBox, deck: deck, gy: g.y, lo: lo, hi: hi, ml: ml });
    }
  }

  // ---------- TAM YÜKSEKLİK MODÜLÜ (2026-08-31) ----------
  // Bir modülün etiketi tek katta duruyor ama ÖTEKİ katın modül zincirinde tam o
  // aralık etiketsiz kalıyorsa, o modül iki katı birden kaplıyor demektir. Bugüne
  // kadar tam yükseklik yalnız TİP ADINDAN (Eşanjör) biliniyordu; kural geometriktir
  // ve ölçüldü: 713 çizimde 124 eşanjörün 124.ünü aynen buluyor, üstüne yalnız
  // K.S-1.in Dikey Karışım modülünü ekliyor (etiketi yalnız üst kata yazılmış,
  // gövdesi iki katlı — alt kat toplamı 700 mm eksik çıkıyordu).
  const tamKat = {};
  if (nDecks > 1) sideBoxes.forEach(function (box) {
    const kutuRecs = recs.filter(function (r) { return r.box === box && r.deck != null && r.lo != null; });
    for (let dk = 0; dk < 2; dk++) {
      const benim = kutuRecs.filter(function (r) { return r.deck === dk; });
      const oteki = kutuRecs.filter(function (r) { return r.deck === 1 - dk; });
      if (!benim.length || !oteki.length) continue;
      const gy = +mode(benim.map(function (r) { return r.gy; }));
      const grp = box.groups.filter(function (g) { return g.y === gy; })[0];
      if (!grp) continue;
      grp.segs.forEach(function (s) {
        if (s.hi - s.lo < 15) return;
        if (benim.some(function (r) { return Math.abs(r.lo - s.lo) < 2 && Math.abs(r.hi - s.hi) < 2; })) return;
        oteki.forEach(function (r) {
          if (Math.abs(r.lo - s.lo) < 2 && Math.abs(r.hi - s.hi) < 2) tamKat[r.name] = true;
        });
      });
    }
  });

  const modules = {};
  Object.keys(modVotes).forEach(function (name) {
    // Modül boyu santralin UZUNLUK ekseninde ölçülür. Uç görünüşteki yatay ölçü modülün
    // boyu değil kasanın enidir; çok görünüşlü çizimde bu oylar doğru boyu bastırabiliyordu
    // (P-PH ailesinde 4 uç görünüş 1750 diyor, 2 yan görünüş 1600). Yan görünüşten oy
    // geldiyse yalnız onlar sayılır. NOT: 'isSideBox' bunun yerine kullanılamaz — o yalnız
    // kutunun kaide bandında olduğunu söyler, uç görünüşler de o banttadır.
    const arr = (modVotesYan[name] && modVotesYan[name].length) ? modVotesYan[name] : modVotes[name], freq = {};
    for (let i = 0; i < arr.length; i++) freq[arr[i]] = (freq[arr[i]] || 0) + 1;
    let best = null;
    Object.keys(freq).forEach(function (k) {
      if (!best || freq[k] > freq[best] || (freq[k] === freq[best] && +k > +best)) best = k;
    });
    modules[name] = { len: +best, votes: freq[best] + '/' + arr.length, all: freq };
  });

  const isEsanjor = function (name) { return /Eşanjör/i.test(modTypes[name] || ''); };
  // Tam yükseklik: tip adı eşanjör OLAN ya da yukarıdaki geometrik kurala takılan modül.
  // NOT: hücreleri TAM YÜKSEKLİĞE BİRLEŞTİRME kararı (esRanges) bilerek isEsanjor.te
  // kaldı — orada modülün kendi hücresini kapladığı varsayılır. K.S-1.de tam yükseklik
  // dikey karışım 2200 mm.lik bir bölümün yalnız 700 mm.si; o bölüm iki kat olarak
  // kalmalı, tek 2640 mm.lik kutuya inmemeli.
  const isTamKat = function (name) { return isEsanjor(name) || tamKat[name] === true; };

  // ---------- modül çıktısı ----------
  const modOut = Object.keys(modules).sort(function (a, b) { return +a.slice(1) - +b.slice(1); })
    .map(function (name) {
      const type = modTypes[name] || '';
      let deck = null, hgt = null;
      if (nDecks === 1) hgt = deckHeights[0];
      else if (isTamKat(name)) { deck = 'her iki kat'; hgt = deckHeights.reduce(function (a, b) { return a + b; }, 0); }
      else if (modDecksAll[name] && modDecksAll[name].length) {
        const best = +mode(modDecksAll[name]);
        deck = best === 0 ? 'alt kat' : 'üst kat';
        hgt = deckHeights[best] != null ? deckHeights[best] : deckHeights[0];
        modules[name].deckIdx = best;
      } else hgt = deckHeights[0];
      return { name: name, type: type, en: W, boy: modules[name].len, yukseklik: hgt, deck: deck,
               votes: modules[name].votes, all: modules[name].all };
    });

  // ---------- HÜCRE ÇIKARIMI ----------
  function segRuns(segs) {
    const runs = [];
    const sorted = segs.slice().sort(function (a, b) { return a.lo - b.lo; });
    for (let i = 0; i < sorted.length; i++) {
      const last = runs[runs.length - 1];
      if (last && sorted[i].lo - last[1] <= 2) { if (sorted[i].hi > last[1]) last[1] = sorted[i].hi; }
      else runs.push([sorted[i].lo, sorted[i].hi]);
    }
    return runs;
  }

  // ---------- gövde dikdörtgenleri (modül yükseklikleri) ----------
  // Yan görünüşte her modül, kaide çizgisine oturan bir dikdörtgendir; o dikdörtgenin
  // yüksekliği modülün yüksekliğidir. Plakalı eşanjör gibi modüller kat yüksekliğinden
  // TAŞAR (DES ailesi: kat 920, eşanjör 1600) ve çizimin ölçü zinciri bunu ayrı hücre
  // olarak göstermeyebilir — böyle bir çelişkide GEOMETRİ doğruyu söyler.
  // Kaideden yukarıda başlayan iç parçalar (panel, kapak, ızgara) bu filtreye takılmaz.
  function govdeKutulari(lo, hi) {
    const cikti = [];
    if (bandY == null) return cikti;
    const gorulen = {};
    for (let i = 0; i < geo.length; i++) {
      const g = geo[i];
      if (Math.abs(g.ylo - bandY) > 1.2) continue;
      if (g.xlo < lo - 1 || g.xhi > hi + 1) continue;
      const gen = (g.xhi - g.xlo) * 10, yuk = (g.yhi - g.ylo) * 10;
      if (gen < 200 || yuk < 200) continue;
      const k = Math.round(g.xlo * 2) + '|' + Math.round(g.xhi * 2);
      if (gorulen[k]) { if (Math.round(yuk) > gorulen[k].h) gorulen[k].h = Math.round(yuk); continue; }
      gorulen[k] = { lo: g.xlo, hi: g.xhi, h: Math.round(yuk) };
      cikti.push(gorulen[k]);
    }
    cikti.sort(function (a, b) { return a.lo - b.lo || a.hi - b.hi; });
    return cikti;
  }

  function hucreForBox(box) {
    const inBox = recs.filter(function (r) { return r.box === box; });
    if (!inBox.length) return null;
    const perDeck = [];
    const modSegs = {};   // kat -> o katın MODÜL aralıkları (hücre sınırı bunları kesemez)
    let viewRange = null; // alt katın (bu görünüşteki) x aralığı; üst kat buna kırpılır
    for (let d = 0; d < nDecks; d++) {
      const dRecs = inBox.filter(function (r) { return (nDecks === 1 ? true : r.deck === d); });
      const nonEs = dRecs.filter(function (r) { return !isTamKat(r.name); });
      const useRecs = nonEs.length ? nonEs : dRecs;
      if (!useRecs.length) { perDeck.push(null); continue; }
      const modeY = +mode(useRecs.map(function (r) { return r.gy; }));
      const grp = box.groups.filter(function (g) { return g.y === modeY; })[0];
      if (!grp) { perDeck.push(null); continue; }
      // Bu kattaki modüllerin x aralıkları: katın kendi ölçü zinciri + bu kata düşen
      // etiket aralıkları. Tam yükseklik modülü (eşanjör) yalnız ikincisinde görünür —
      // kendi zinciri alt katın satırındadır (KLM-03 A/D BLOK).
      const katModul = grp.segs.concat(dRecs.filter(function (r) { return r.lo != null; })
        .map(function (r) { return { lo: r.lo, hi: r.hi }; }));
      modSegs[d] = katModul;
      // modül zincirini bitişik koşulara (run) ayır — aynı kutuda birleşmiş Sağ/Sol görünüşleri ayırt et
      const runs = segRuns(grp.segs);
      // en çok etiket içeren koşu = bu görünüşteki kat gövdesi
      let bestRun = runs[0], bestN = -1;
      for (let i = 0; i < runs.length; i++) {
        const n = dRecs.filter(function (r) {
          const mid = (r.lo + r.hi) / 2;
          return mid >= runs[i][0] - 2 && mid <= runs[i][1] + 2;
        }).length;
        if (n > bestN) { bestN = n; bestRun = runs[i]; }
      }
      if (!bestRun) { perDeck.push(null); continue; }
      let extLo = bestRun[0], extHi = bestRun[1];
      // bitişik parçaları (etiket aralıkları + diğer koşular) kademeli olarak yut (ör. eşanjör boşluğu köprüsü)
      const pieces = runs.slice();
      for (let i = 0; i < dRecs.length; i++) {
        if (dRecs[i].lo != null) pieces.push([dRecs[i].lo, dRecs[i].hi]);
      }
      let grew = true;
      while (grew) {
        grew = false;
        for (let i = 0; i < pieces.length; i++) {
          const p = pieces[i];
          if (p[1] < extLo - 2 || p[0] > extHi + 2) continue; // temas etmiyor
          if (p[0] < extLo - 0.5) { extLo = p[0]; grew = true; }
          if (p[1] > extHi + 0.5) { extHi = p[1]; grew = true; }
        }
      }
      if (d === 0) {
        // alt katı, aynı görünüşteki toplam/ara-toplam koşusuyla sınırla
        const center = (bestRun[0] + bestRun[1]) / 2;
        let widest = null;
        const lower = box.groups.filter(function (g) { return g.y < modeY - 1; });
        for (let i = 0; i < lower.length; i++) {
          const lruns = segRuns(lower[i].segs);
          for (let j = 0; j < lruns.length; j++) {
            if (lruns[j][0] - 2 <= center && center <= lruns[j][1] + 2) {
              if (!widest || (lruns[j][1] - lruns[j][0]) > (widest[1] - widest[0])) widest = lruns[j];
            }
          }
        }
        if (widest) {
          extLo = Math.max(extLo, widest[0] - 2);
          extHi = Math.min(extHi, widest[1] + 2);
          extLo = Math.min(extLo, bestRun[0]); extHi = Math.max(extHi, bestRun[1]);
        }
        viewRange = [extLo - 2, extHi + 2];
      } else if (viewRange) {
        // üst kat alt katın aralığı dışına taşamaz
        extLo = Math.max(extLo, viewRange[0]);
        extHi = Math.min(extHi, viewRange[1]);
        if (extHi - extLo < 4) { perDeck.push(null); continue; }
      }
      // hücre zinciri: kat zincirinin dışındaki bir sonraki seviye
      let candGroups;
      if (nDecks > 1 && d === nDecks - 1) {
        candGroups = box.groups.filter(function (g) {
          return g.y > modeY + 1 && g.segs.some(function (s) { return s.hi - s.lo >= 15; });
        }).sort(function (a, b) { return a.y - b.y; });
      } else {
        candGroups = box.groups.filter(function (g) {
          return g.y < modeY - 1 && g.segs.some(function (s) { return s.hi - s.lo >= 15; });
        }).sort(function (a, b) { return b.y - a.y; });
      }
      let cells = [];
      const spanExt = extHi - extLo;
      const cand = candGroups[0];
      if (!cand) {
        cells.push({ lo: extLo, hi: extHi, src: 'fill' });
      } else if (cand.segs.length === 1 && (cand.segs[0].hi - cand.segs[0].lo) >= 0.9 * spanExt) {
        cells.push({ lo: cand.segs[0].lo, hi: cand.segs[0].hi, src: 'seg' });
      } else {
        // ara toplam zinciri + boşluk doldurma (kat aralığına kırpılmış)
        let segsIn = cand.segs.filter(function (s) { return s.hi > extLo + 1 && s.lo < extHi - 1; })
          .map(function (s) { return { lo: Math.max(s.lo, extLo), hi: Math.min(s.hi, extHi) }; })
          .filter(function (s) { return s.hi - s.lo >= 4; });
        // Aynı satırda bir ölçü bir diğerini TAMAMEN kapsıyorsa, kapsayan ölçü bir ara
        // toplam değil GENEL toplamdır — bazı çizimler toplamı hücre satırına da yazıyor
        // (DES-03: 3900 ile 1900 aynı y'de). Hücre sayılırsa komşu hücreyi yutar.
        segsIn = segsIn.filter(function (s) {
          return !segsIn.some(function (o) {
            return o !== s && o.lo >= s.lo - 0.5 && o.hi <= s.hi + 0.5 && (o.hi - o.lo) < (s.hi - s.lo) - 0.5;
          });
        });
        // Bir ölçü tek bir MODÜLÜN İÇİNDE başlayıp bitiyorsa o bir hücre sınırı değil,
        // modülün kendi detay ölçüsüdür (iç açıklık). Hücre en az bir modül içerir;
        // hiçbir hücre bir modülün içine sığmaz. (KLM ailesi: 800 mm.lik boş modülün
        // gövdesine yazılmış 700 mm.lik iç ölçü, komşu katın hücrelerini 50 mm.lik
        // şeritlere bölüyordu — KLM-01..04, KLM-02/03/04 blokları, V-AHU-05.)
        segsIn = segsIn.filter(function (s) {
          return !katModul.some(function (m) { return s.lo > m.lo + 0.6 && s.hi < m.hi - 0.6; });
        });
        for (let i = 0; i < segsIn.length; i++) cells.push({ lo: segsIn[i].lo, hi: segsIn[i].hi, src: 'seg' });
        // boşluklar
        const evs = [extLo];
        segsIn.sort(function (a, b) { return a.lo - b.lo; });
        for (let i = 0; i < segsIn.length; i++) { evs.push(segsIn[i].lo); evs.push(segsIn[i].hi); }
        evs.push(extHi);
        evs.sort(function (a, b) { return a - b; });
        for (let i = 0; i + 1 < evs.length; i += 1) {
          const glo = evs[i], ghi = evs[i + 1];
          const mid = (glo + ghi) / 2;
          const covered = segsIn.some(function (s) { return mid > s.lo && mid < s.hi; });
          if (!covered && ghi - glo >= 4) cells.push({ lo: glo, hi: ghi, src: 'fill' });
        }
        // dedupe/sırala
        cells.sort(function (a, b) { return a.lo - b.lo; });
        const ded = [];
        for (let i = 0; i < cells.length; i++) {
          const last = ded[ded.length - 1];
          if (last && cells[i].lo < last.hi - 1) continue;
          ded.push(cells[i]);
        }
        cells = ded;
      }
      perDeck.push(cells);
    }
    // dolgu kaynaklı (çizimde ara-toplam ölçüsü olmayan) hücreleri karşı katın hücre sınırlarında böl:
    // ör. üst katta tek parça görünen uzantı, alt katın blok sınırında ikiye ayrılır
    function splitFillCells(cells, otherCells, kendiModul) {
      if (!cells || !otherCells || !otherCells.length) return cells;
      const edges = [];
      otherCells.forEach(function (c) { edges.push(c.lo); edges.push(c.hi); });
      edges.sort(function (a, b) { return a - b; });
      // Karşı katın sınırı BU katın bir modülünün ORTASINA denk geliyorsa orada bölünmez:
      // hücre sınırı modülü kesemez. (KLM-03: alt kattaki 1600 mm.lik fan, üstündeki
      // 800 mm.lik boş modülün sınırı yüzünden 800 + 800 diye ikiye bölünüyordu.)
      const bolunebilir = function (e) {
        return !kendiModul || !kendiModul.some(function (m) { return e > m.lo + 0.6 && e < m.hi - 0.6; });
      };
      const out2 = [];
      cells.forEach(function (c) {
        if (c.src !== 'fill') { out2.push(c); return; }
        const parts = [{ lo: c.lo, hi: c.hi, src: 'fill' }];
        edges.forEach(function (e) {
          const p = parts[parts.length - 1];
          if (e > p.lo + 4 && e < p.hi - 4 && bolunebilir(e)) {
            parts[parts.length - 1] = { lo: p.lo, hi: e, src: 'fill' };
            parts.push({ lo: e, hi: p.hi, src: 'fill' });
          }
        });
        out2.push.apply(out2, parts);
      });
      return out2;
    }

    // eşanjör bloklarını tam yükseklik hücreye birleştir
    const esRanges = inBox.filter(function (r) { return isEsanjor(r.name) && r.lo != null; })
      .map(function (r) { return [r.lo, r.hi]; });
    const out = [];
    const used1 = [];
    let cells0 = perDeck[0] || [], cells1 = nDecks > 1 ? (perDeck[1] || []) : [];
    cells1 = splitFillCells(cells1, cells0, modSegs[1]);
    cells0 = splitFillCells(cells0, cells1, modSegs[0]);
    for (let i = 0; i < cells0.length; i++) {
      const c0 = cells0[i];
      let merged = false;
      for (let j = 0; j < cells1.length; j++) {
        const c1 = cells1[j];
        if (Math.abs(c0.lo - c1.lo) < 3 && Math.abs(c0.hi - c1.hi) < 3) {
          const hasEs = esRanges.some(function (er) {
            return er[0] < c0.hi - 1 && er[1] > c0.lo + 1;
          });
          if (hasEs) {
            out.push({ lo: c0.lo, hi: c0.hi, kat: 'tam', h: deckHeights.reduce(function (a, b) { return a + b; }, 0) });
            used1.push(j); merged = true; break;
          }
        }
      }
      if (!merged) out.push({ lo: c0.lo, hi: c0.hi, kat: nDecks === 1 ? 'tek' : 'alt', h: deckHeights[0] });
    }
    for (let j = 0; j < cells1.length; j++) {
      if (used1.indexOf(j) >= 0) continue;
      out.push({ lo: cells1[j].lo, hi: cells1[j].hi, kat: 'üst', h: deckHeights[nDecks - 1] });
    }
    out.sort(function (a, b) { return a.lo - b.lo || (a.kat === 'üst' ? 1 : -1); });

    // Gövde yükseklikleri: tek katlı santralde hücre, farklı yükseklikteki gövdelerin
    // sınırında BÖLÜNÜR ve her parça kendi yüksekliğini alır — ölçü zinciri ikisini tek
    // hücre gösterse bile (DES ailesinde eşanjör böyle: zincir 2000 diyor, gövdeler
    // 900 + 1100 ve ikincisi 1600 mm yüksek). Çok katlıda eşanjör zaten 'tam yükseklik'
    // hücresi olarak çözülüyor, oraya dokunulmaz.
    if (nDecks === 1 && out.length) {
      let sinirLo = Infinity, sinirHi = -Infinity;
      out.forEach(function (c) { sinirLo = Math.min(sinirLo, c.lo); sinirHi = Math.max(sinirHi, c.hi); });
      const gov = govdeKutulari(sinirLo, sinirHi);
      if (gov.length) {
        const yeni = [];
        for (let i = 0; i < out.length; i++) {
          const c = out[i];
          const ic = gov.filter(function (b) {
            const orta = (b.lo + b.hi) / 2;
            return orta > c.lo + 0.5 && orta < c.hi - 0.5;
          });
          if (!ic.length) { yeni.push(c); continue; }
          let hMax = -Infinity, hMin = Infinity;
          ic.forEach(function (b) { hMax = Math.max(hMax, b.h); hMin = Math.min(hMin, b.h); });
          if (hMax - hMin <= 10) { yeni.push(c); continue; }
          let x = c.lo;
          for (let j = 0; j < ic.length; j++) {
            const bl = Math.max(c.lo, ic[j].lo), bh = Math.min(c.hi, ic[j].hi);
            if (bl - x > 0.4) yeni.push({ lo: x, hi: bl, kat: c.kat, h: c.h });
            yeni.push({ lo: bl, hi: bh, kat: c.kat, h: ic[j].h });
            x = bh;
          }
          if (c.hi - x > 0.4) yeni.push({ lo: x, hi: c.hi, kat: c.kat, h: c.h });
        }
        out.length = 0;
        out.push.apply(out, yeni);
      }
    }

    // hücre içindeki modüller
    const seen = {};
    for (let i = 0; i < out.length; i++) {
      const c = out[i];
      c.boy = Math.round((c.hi - c.lo) * 10);
      c.moduller = [];
    }
    inBox.forEach(function (r) {
      if (seen[r.name]) return;
      const mid = (r.lo + r.hi) / 2;
      // yalnızca hücre aralığındaki etiketler (ayna görünüşteki kopyaları atla)
      const inAny = out.some(function (c) { return mid > c.lo - 2 && mid < c.hi + 2; });
      if (!inAny) return;
      seen[r.name] = true;
      for (let i = 0; i < out.length; i++) {
        const c = out[i];
        if (mid > c.lo && mid < c.hi) {
          const dOk = c.kat === 'tam' || c.kat === 'tek' ||
            (c.kat === 'alt' && (r.deck === 0 || r.deck == null)) ||
            (c.kat === 'üst' && r.deck === nDecks - 1);
          // NOT: burası bilerek isEsanjor.te kaldı. Bir modül adı yalnız TEK hücreye
          // yazılır (seen); geometrik tam yükseklik modülünü buraya da katmak, adı üst
          // hücreden alıp alt hücreye taşımaktan başka bir şey yapmıyor (K.S-1 / M9).
          if (dOk || isEsanjor(r.name)) { c.moduller.push(r.name); break; }
        }
      }
    });
    for (let i = 0; i < out.length; i++) {
      out[i].moduller.sort(function (a, b) { return +a.slice(1) - +b.slice(1); });
    }
    // kat yüksekliğinden taşan modüller (uyarı metni için)
    const tasan = [];
    if (nDecks === 1 && deckHeights[0])
      out.forEach(function (c) {
        if (Math.abs(c.h - deckHeights[0]) > 10)
          tasan.push((c.moduller.length ? c.moduller.join('+') : Math.round((c.hi - c.lo) * 10) + ' mm') +
            ' → ' + c.h + ' mm');
      });
    return { box: box, cells: out, nLabels: inBox.length, tasan: tasan };
  }

  let hucre = null, mirrorMismatch = null;
  const hucreAll = sideBoxes.map(hucreForBox).filter(Boolean);
  if (hucreAll.length) {
    hucreAll.sort(function (a, b) { return b.nLabels - a.nLabels; });
    hucre = hucreAll[0];
    // ayna görünüş tutarlılığı: yeterli etiketi olan diğer yan görünüşler aynı hücre imzasını vermeli
    function sig(h) { return h.cells.map(function (c) { return c.kat + ':' + c.boy; }).sort().join(' | '); }
    const s0 = sig(hucre);
    for (let i = 1; i < hucreAll.length; i++) {
      if (hucreAll[i].nLabels < hucre.nLabels * 0.7) continue;
      if (sig(hucreAll[i]) !== s0) { mirrorMismatch = sig(hucreAll[i]) + '  ≠  ' + s0; break; }
    }
  }
  const hucreler = hucre ? hucre.cells.map(function (c, i) {
    return { sira: i + 1, kat: c.kat === 'tam' ? 'Alt+Üst (tam yükseklik)' : c.kat === 'tek' ? 'Tek kat' : c.kat === 'alt' ? 'Alt kat' : 'Üst kat',
             en: W, boy: c.boy, yukseklik: c.h, moduller: c.moduller.join(', '),
             katKod: c.kat, lo: c.lo, hi: c.hi };
  }) : [];

  // ---------- FAN / MOTOR ----------
  // Cizim her modulun alanlarini '(M5) - Fan - Guc' bicimindeki etiket satirlariyla tasiyor;
  // deger her zaman ayni satirda SAGDAKI en yakin metindir (teknik tablodaki desenin ayni).
  const fanlar = {};
  const FAN_ALAN = /^(Fan Tipi|Fan Adı|Fan İşlevi|Fan Sayısı|Motor Adı|Güç|Devir \(d\/d\)|Fan Kasnak Çapı \(mm\)|Motor Kasnak Çapı \(mm\)|Kayış Uzunluğu|Kasnak Adı)$/;
  for (let i = 0; i < texts.length; i++) {
    const lt = texts[i];
    const m = lt.str.match(/^\((M\d+)\)\s*-\s*(.+)$/);
    if (!m) continue;
    const ad = m[1], tur = modTypes[ad] || '';
    if (!/fan/i.test(tur)) continue;
    let alan = m[2];
    if (tur && alan.indexOf(tur + ' - ') === 0) alan = alan.slice(tur.length + 3);
    if (!FAN_ALAN.test(alan)) continue;
    const kayit = fanlar[ad] || (fanlar[ad] = { modul: ad, tur: tur });
    if (alan in kayit) continue;
    let val = null;
    for (let j = 0; j < texts.length; j++) {
      const t = texts[j];
      if (Math.abs(t.y - lt.y) < 3 && t.x > lt.x + 10 && (!val || t.x < val.x)) val = t;
    }
    kayit[alan] = val ? val.str : '';
  }

  // ---------- DOĞRULAMA BATARYASI ----------
  // Her sonuç, birbirinden bağımsız kontrollerden geçer. Kritik bir kontrol çökerse sonuç
  // guvenilmez (error), kritik olmayan cokerse uyarili (warning) isaretlenir.
  const checks = [];
  function chk(name, ok, detail, critical) {
    checks.push({ name: name, ok: !!ok, detail: detail || '', critical: !!critical });
  }

  // 1. teknik tablo okunabildi mi
  chk('Teknik tablo (santral / genişlik / yükseklik)', kv['Santral Adı'] && W && Htab,
    !kv['Santral Adı'] ? 'santral adı yok' : !W ? 'genişlik yok' : !Htab ? 'yükseklik yok' : '', true);

  // 2. geometri: modül etiketi ve ölçü zinciri bulunabildi mi
  chk('Modül etiketleri (M1, M2, …)', mlabels.length > 0, mlabels.length + ' etiket', true);
  chk('Ölçü zincirleri', hsegs.length > 0, hsegs.length + ' yatay ölçü', true);

  // 3. kat yüksekliği = tablo yüksekliği
  if (Htab && deckHeights.length)
    chk('Alt kat yüksekliği = tablo yüksekliği', deckHeights[0] === Htab,
      deckHeights[0] + ' vs ' + Htab, false);

  // 4. kat toplamı çizimdeki dikey toplam ölçüsüyle eşleşmeli
  if (nDecks > 1) {
    const deckSum = deckHeights.reduce(function (a, b) { return a + b; }, 0);
    const okV = vdims.some(function (d) {
      const v = Math.round(d.meas * 10);
      return Math.abs(v - deckSum) < 25 || Math.abs(v - deckSum - ayak) < 25;
    });
    chk('Kat toplamı çizim ölçüsüyle teyit', okV, 'katlar: ' + deckHeights.join('+'), false);
  }

  // 5. tabloda listelenen modüller = çizimde bulunanlar
  const tableMods = {};
  for (let i = 0; i < texts.length; i++) {
    const m = texts[i].str.match(/^\((M\d+)\)\s*-/);
    if (m) tableMods[m[1]] = true;
  }
  const tmKeys = Object.keys(tableMods);
  if (tmKeys.length) {
    const missing = tmKeys.filter(function (m) { return !modules[m]; });
    const extra = Object.keys(modules).filter(function (m) { return !tableMods[m]; });
    chk('Tablo modülleri = bulunan modüller', !missing.length && !extra.length,
      (missing.length ? 'eksik: ' + missing.join(',') : '') + (extra.length ? ' fazla: ' + extra.join(',') : ''), true);
  }

  // 6. modül ölçüsü oy güveni (her modül birden çok görünüşten teyitli olmalı)
  const lowConf = [];
  modOut.forEach(function (m) {
    const p = m.votes.split('/');
    if (+p[0] < 2 || +p[0] / +p[1] < 0.5) lowConf.push(m.name + ' (' + m.votes + ')');
  });
  chk('Modül ölçüleri çok görünüşten teyitli', !lowConf.length, lowConf.join(', '), false);

  // 7. hücreler bulunabildi mi
  chk('Hücre tespiti', hucreler.length > 0, hucreler.length + ' hücre', true);

  // 8. alt kat hücre toplamı = çizimdeki toplam boy
  let altSum = 0;
  hucreler.forEach(function (h) { if (h.kat !== 'Üst kat') altSum += h.boy; });
  if (hucreler.length && totalLen)
    chk('Alt kat hücre toplamı = toplam boy', Math.abs(altSum - totalLen) <= 15,
      altSum + ' vs ' + totalLen, true);

  // 9. alt kat modül boyları toplamı = toplam boy (hücrelerden bağımsız ikinci yol)
  if (totalLen && modOut.length) {
    const altModSum = modOut.filter(function (m) { return !m.deck || m.deck === 'alt kat' || m.deck === 'her iki kat'; })
      .reduce(function (a, m) { return a + m.boy; }, 0);
    chk('Alt kat modül toplamı = toplam boy', Math.abs(altModSum - totalLen) <= 15,
      altModSum + ' vs ' + totalLen, true);
  }

  // 10. üst kat modül toplamı = üst hücre toplamı
  if (nDecks > 1 && hucreler.length) {
    const ustModSum = modOut.filter(function (m) { return m.deck === 'üst kat' || m.deck === 'her iki kat'; })
      .reduce(function (a, m) { return a + m.boy; }, 0);
    const ustHucSum = hucreler.filter(function (h) { return h.kat === 'Üst kat' || h.kat.indexOf('Alt+Üst') === 0; })
      .reduce(function (a, h) { return a + h.boy; }, 0);
    chk('Üst kat modül toplamı = üst hücre toplamı', Math.abs(ustModSum - ustHucSum) <= 15,
      ustModSum + ' vs ' + ustHucSum, false);
  }

  // 11. her modül bir hücreye atanmış olmalı
  if (hucreler.length) {
    const inCells = {};
    hucreler.forEach(function (h) {
      h.moduller.split(',').forEach(function (s) { s = s.trim(); if (s) inCells[s] = true; });
    });
    const unassigned = Object.keys(modules).filter(function (m) { return !inCells[m]; });
    chk('Her modül bir hücrede', !unassigned.length, unassigned.join(', '), true);
  }

  // 13. profil serisi ile model adı aynı seriyi söylemeli (RW50 ↔ Alüminyum 50)
  (function(){
    const pm = String(kasa['Profil Adı'] || '').match(/Alüminyum\s*(\d+)/);
    const mm2 = String(kv['Model Adı'] || '').match(/RW\s*(\d+)/);
    if (!pm) chk('Profil serisi okunabildi', false, kasa['Profil Adı'] || 'Profil Adı alanı yok', false);
    else if (mm2) chk('Profil serisi = model serisi', pm[1] === mm2[1], pm[1] + ' vs ' + mm2[1], false);
  })();

  // 14. iç sac malzemesi okunabildi mi
  chk('İç sac malzemesi', !!kasa['İç Sac Adı'], kasa['İç Sac Adı'] || 'İç Sac Adı alanı yok', false);

  // 15. gövde yüksekliği kat yüksekliğinden taşan modül var mı
  // Kritik değil: ölçü gövde geometrisinden doğru alındı, aktarım engellenmez —
  // ama çizimin tablosu/ölçü zinciri bunu söylemediği için kullanıcıya haber verilir.
  if (hucre && hucre.tasan && hucre.tasan.length)
    chk('Modül yükseklikleri = kat yüksekliği', false,
      hucre.tasan.join(', ') + ' (kat ' + deckHeights[0] + ' mm) — ölçü zinciri bu modülü ayrı ' +
      'hücre göstermiyor, yükseklik gövde geometrisinden alındı', false);

  // 12. ayna görünüş tutarlılığı (Sağ ve Sol aynı hücre imzasını vermeli)
  if (hucreAll.length > 1)
    chk('Ayna görünüşler aynı sonucu veriyor', !mirrorMismatch, mirrorMismatch || '', false);


  const failCrit = checks.filter(function (c) { return !c.ok && c.critical; });
  const failWarn = checks.filter(function (c) { return !c.ok && !c.critical; });
  const status = failCrit.length ? 'error' : failWarn.length ? 'warning' : 'verified';

  let warn = null;
  if (hucreler.length && totalLen && Math.abs(altSum - totalLen) > 15)
    warn = 'Alt kat hücre toplamı (' + altSum + ') toplam boy (' + totalLen + ') ile uyuşmuyor — kontrol edin.';

  return {
    file: fileName || '',
    santral: kv['Santral Adı'] || null,
    proje: kv['Proje Adı'] || null,
    model: kv['Model Adı'] || null,
    boyut: kv['Boyut Adı'] || null,
    debi: kv['Hava Debisi'] || null,
    genislik: W, yukseklikTablo: Htab, ayak: ayak,
    agirlik: kv['Ağırlık'] || null,
    deckHeights: deckHeights, totalLen: totalLen,
    hucreler: hucreler,
    modules: modOut,
    bilesenler: bilesenler,
    agizlar: agizlar,
    fanlar: fanlar,
    profilAdi: kasa['Profil Adı'] || null,
    icSac: kasa['İç Sac Adı'] || null,
    disSac: kasa['Dış Sac Adı'] || null,
    icSacKal: kasa['İç Sac Kalınlığı (mm)'] || null,
    status: status, checks: checks,
    warn: warn
  };
}

  return { coz: analyzeDxf };
})();

// ---------- MOTOR GÖVDESİ VE KAİDE ----------
// Kaynak: proje kökündeki 'motor gövde bilgisi.xlsx' (Cenk, 26.08.2026).
// Kural: aynı kW'ta devir düştükçe gövde büyür (moment arttığı için).
// Tablo tam kare DEĞİL: 0,55 kW yalnız 3000'de, 37 ve 45 kW yalnız 1500'de var.
const MOTOR_GOVDE = [
  { kw: 0.55, g: {3000: 71} },
  { kw: 0.75, g: {3000: 80,  1500: 80,  1000: 90} },
  { kw: 1.1,  g: {3000: 80,  1500: 90,  1000: 90} },
  { kw: 1.5,  g: {3000: 90,  1500: 90,  1000: 100} },
  { kw: 2.2,  g: {3000: 90,  1500: 100, 1000: 112} },
  { kw: 3,    g: {3000: 100, 1500: 100, 1000: 132} },
  { kw: 4,    g: {3000: 112, 1500: 112, 1000: 132} },
  { kw: 5.5,  g: {3000: 132, 1500: 132, 1000: 132} },
  { kw: 7.5,  g: {3000: 132, 1500: 132, 1000: 160} },
  { kw: 11,   g: {3000: 160, 1500: 160, 1000: 160} },
  { kw: 15,   g: {3000: 160, 1500: 160, 1000: 180} },
  { kw: 18.5, g: {3000: 160, 1500: 180, 1000: 200} },
  { kw: 22,   g: {3000: 180, 1500: 180, 1000: 200} },
  { kw: 30,   g: {3000: 200, 1500: 200, 1000: 225} },
  { kw: 37,   g: {1500: 225} },
  { kw: 45,   g: {1500: 225} }
];

// Tam kademe yoksa BİR ÜST kW kademesine çıkılır — büyük gövde güvenli taraftır.
// O devirde hiç karşılık yoksa null döner; çağıran motor adına düşer.
function motorGovde(kw, devir){
  if(!(kw > 0) || !(devir > 0)) return null;
  for(let i = 0; i < MOTOR_GOVDE.length; i++){
    const s = MOTOR_GOVDE[i];
    if(s.kw + 1e-9 < kw) continue;
    const g = s.g[devir];
    if(g) return { govde: g, kademe: s.kw, yuvarlandi: Math.abs(s.kw - kw) > 1e-9 };
  }
  return null;
}

// 'SYWB 400 R' -> 400 · 'SYQ 450 R' -> 450
// 'RLM E6-5663-43-21-A' -> 630 : dört haneli kodun İKİNCİ yarısı çapı verir (Cenk, 26.08.2026),
// yani 5663 -> 630, 6371 -> 710, 7180 -> 800.
function fanCapi(fanAd){
  const s = String(fanAd || '');
  if(/^RLM/i.test(s)){
    const m = s.match(/\b\d{2}(\d{2})\b\s*-/);
    if(m) return +m[1] * 10;
  }
  const d = s.match(/^[A-Za-zĞÜŞİÖÇğüşıöç]+\s*(\d{3,4})\b/);
  return d ? +d[1] : null;
}

// 'AGM3EL 132 M 4b IE3' -> 132
function motorAdiGovde(motorAd){
  const m = String(motorAd || '').match(/\b(\d{2,3})\s*[SML]\b/);
  return m ? +m[1] : null;
}

const FAN_KASNAK = ['Fan Kasnak Çapı (mm)', 'Motor Kasnak Çapı (mm)', 'Kayış Uzunluğu', 'Kasnak Adı'];

// Çizimden gelen ham fan alanlarını çözer. TABLO ASIL KAYNAKTIR, motor adı doğrulamadır
// (Cenk, 26.08.2026); çeliştiklerinde ikisi de yazılır ve uyarı düşülür.
function dxfFanCoz(fk){
  if(!fk) return null;
  const sayi = function(s){
    const m = String(s == null ? '' : s).replace(/\./g, '').replace(/,/g, '.').match(/-?\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  };
  const kayis = FAN_KASNAK.some(function(k){ return fk[k]; });
  const kw = sayi(fk['Güç']), devir = sayi(fk['Devir (d/d)']);
  const cap = fanCapi(fk['Fan Adı']);
  const t = motorGovde(kw, devir);
  const adG = motorAdiGovde(fk['Motor Adı']);
  const uyari = [];
  let govde = t ? t.govde : null, kaynak = 'tablo';
  if(t && t.yuvarlandi) uyari.push('Tabloda ' + kw + ' kW yok — ' + t.kademe + ' kW kademesine yuvarlandı.');
  if(!govde && adG){ govde = adG; kaynak = 'motor adı'; uyari.push('kW + devir tablosunda karşılık yok; gövde motor adından okundu.'); }
  if(govde && adG && govde !== adG) uyari.push('Tablo ' + govde + ' gövde diyor, motor adı ' + adG + ' diyor — çizimden teyit edin.');
  if(!cap) uyari.push('Fan çapı addan çözülemedi: ' + (fk['Fan Adı'] || '—'));
  let kaide = '', kapsam = '';
  if(kayis) kapsam = 'Kayış-kasnaklı fan — motor kaidesi kütüphanesi kapsamı dışında.';
  else if(cap && govde) kaide = 'SYWB' + cap + '-' + govde;
  return { modul: fk.modul || '', ad: fk['Fan Adı'] || '', tip: fk['Fan Tipi'] || '',
           islev: fk['Fan İşlevi'] || '', adet: sayi(fk['Fan Sayısı']) || 1,
           cap: cap, kw: kw, devir: devir, govde: govde, govdeKaynak: kaynak,
           motorAd: fk['Motor Adı'] || '', kayis: kayis, kaide: kaide, kapsam: kapsam, uyari: uyari };
}

// Modele yazılan kalıcı alan — sunum bilgisi (uyarı/kaynak/kapsam) taşınmaz, o her seferinde
// yeniden üretilir.
function dxfFanKalici(f){
  if(!f) return null;
  return { ad: f.ad, tip: f.tip, islev: f.islev, adet: f.adet, cap: f.cap,
           kw: f.kw, devir: f.devir, govde: f.govde, motorAd: f.motorAd,
           kayis: f.kayis, kaide: f.kaide };
}

// ---------- DXF -> AHU STUDIO ESLEME KATMANI ----------
// DIKKAT — ad cakismasi: DXF.te M1/M2 diye etiketlenen sey bir ISLEVDIR (Fan, Filtre);
// AHU Studio.nun modulu ise bir KUTU. Karsilik su sekildedir:
//     DXF HUCRESI  <->  AHU Studio MODULU
// Bu katman hucreleri kutuya cevirir; yuzlerdeki kapaklara HIC dokunmaz.
// Saf model kodudur — renderAll'i cagirmaz, cagiran taraf bir kez cagirir.

// Dosya adinda AYNALANACAK gecmesi Cenk'in isaretidir; DXF'in ICINDE bu bilgi yok (olculdu).
function dxfAynalaOnerisi(dosyaAdi){
  return /AYNALANACAK/i.test(String(dosyaAdi||''));
}

// URETIM ADEDI de dosya adinda yazar — AYNALANACAK ile ayni desen (Cenk, 31.08.2026:
// 'dxf adina da dikkat et, oraya da yaziyor'). Cizimin ICINDE bu bilgi yok; teknik
// tabloda adet alani hic gecmiyor.
//
// Olculdu (713 teknik cizim): adinda ADET gecen 5 dosya var, besi de '2 ADET' ve besinde
// de sayi ADET kelimesinin hemen solunda — 'KLM-01 (2 ADET)', 'P-PH-51T EF-02 2 ADET',
// 'P-PH-11T (HAP-02)(2 ADET)', 'P-PH-53T (AYNALANACAK) (2 ADET)'. Kalan 708 dosyada
// ADET hic gecmiyor, yani yanlis pozitif riski olculerek sifirdir.
// Desen ADET kelimesine capalanir: '(HAP-02)(2 ADET)' icindeki 02'yi degil 2'yi okur.
function dxfAdetOnerisi(dosyaAdi){
  const m = String(dosyaAdi||'').match(/(\d+)\s*ADET/i);
  return m ? ahuAdet({ adet: parseInt(m[1], 10) }) : 1;
}

// Adet IKI yerde birden yazili olabilir: dosya adinda ve teknik tablonun 'Santral Adı'
// alaninda. Olculdu (713 teknik cizim): dosya adinda 5, Santral Adı'nda 2 kez geciyor;
// ikisinin birden yazdigi 2 cizimde de ayni sayi. Buyugu alinir, hicbiri yoksa 1.
// (AYNALANACAK isareti Santral Adı'nda HIC gecmiyor — o yalniz dosya adindan okunur.)
function dxfAdetOku(dosyaAdi, santralAdi){
  return Math.max(dxfAdetOnerisi(dosyaAdi), dxfAdetOnerisi(santralAdi));
}

// AHU ADINDAN '(2 ADET)' TEMIZLENIR. Ad Excel ve DXF DOSYA ADINA giriyor
// ('{isNo}_{ahuAd}_KAPAK_HESABI.xlsx', '{proje} — YAN PANELLER.dxf'); adet ayri bir
// alanda tutuldugu icin adin icinde birakilsa dosya adinda iki kez yazardi.
function dxfAdSadelestir(ad){
  return String(ad||'')
    .replace(/\(?\s*\d+\s*ADET\s*\)?/gi, ' ')
    .replace(/\s+\)/g, ')')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

// Kunye: cizimin teknik tablosundan AHU duzeyindeki alanlar.
function dxfKunye(r){
  const uyari = [];
  const pm = String(r.profilAdi||'').match(/Alüminyum\s*(\d+)/);
  let seri = pm ? pm[1] : '';
  if(!pm) uyari.push('Profil Adı okunamadı — profil serisi elle seçilmeli.');
  else if(!PROFILES[seri]){ uyari.push('Profil serisi '+seri+' tanımlı değil — varsayımlar boş bırakıldı.'); seri = ''; }
  let malzeme = '';
  if(r.icSac) malzeme = /paslanmaz/i.test(r.icSac) ? 'paslanmaz' : 'galvaniz';
  else uyari.push('İç Sac Adı okunamadı — malzeme elle seçilmeli.');
  if(!r.genislik) uyari.push('Genişlik okunamadı — modüllerin W ölçüsü boş kalır.');
  // Ad '(2 ADET)' taşıyabilir (ölçüldü: 713 çizimin 2'sinde Santral Adı böyle yazılmış);
  // adet ayrı alanda tutulduğu için addan temizlenir — bkz. dxfAdSadelestir.
  const ad = dxfAdSadelestir(r.santral || String(r.file||'DXF').replace(/\.dxf$/i,'')) || 'DXF';
  return { ad, seri, malzeme, en: r.genislik||0, katlar: (r.deckHeights||[]).slice(),
           profilAdi: r.profilAdi||'', icSac: r.icSac||'', toplamBoy: r.totalLen||0, uyari };
}

// Hucre listesi -> modul kutulari. Konum: x uzunluk ekseni, y kat.
// Aynalandiginda yalniz x aynalanir (toplamBoy - x - L); kat ve olculer degismez.
// Bir hucrenin icindeki DXF modullerini L ekseninde SIRALI parcalara cevirir.
// Mutlak x hizasina GUVENILMEZ: cizimde dort aday yan gorunus var ve hucre zinciri
// bunlardan hangisinden cozuldugu belli degil (P-PH-52T'de hucre 0..1250'den, modul
// katmani 3050..4300'den geliyor). Bu yuzden eslesme MODUL ADIYLA yapilir; sira ve
// kapak konumu modulun kendi katman kutusundan gelir. Katman boyu ile olcu zincirinden
// gelen boy 918 modulun 918'inde birebir esit olcusdu — iki kaynak catismaz.
function dxfParcaListesi(r, adlar, aynala){
  const bl = (r && r.bilesenler) || {};
