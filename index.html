// ---------- PROJE KAYDET / YÜKLE ----------
// v4: panel.colSpan + face.anaSplitLevels (eski dosyaların alan göçü syncStructure'da yapılır)
// v5: module.araKat (ara kat — 7. sanal yüz). Eski v4/v3/v2 dosyalar açılmaya devam eder,
//     ara katsız modül olarak gelirler (araKatNormalize kurar).
const PROJECT_VERSION = 17;  // v10 = DXF'ten okunan bileşenler (module.dxfBilgi)
                             // v11 = çizimden okunan ağızlar (dxfBilgi.parcalar[].agizlar)
                             // v12 = ÜST ağzın L eksenindeki yeri (agizlar[].x) + tabloDan
                             // v13 = açılır kapak işareti (parcalar[].acilir)
                             // v15 = santralin üretim adedi (ahu.adet, yalnız 1'den büyükken)
                             // v16 = bir bölmedeki BÜTÜN kapaklar (parcalar[].kapaklar, her
                             //       birinde 'alt' = tabandan yüksekliği) + ÜST ağzın W
                             // v17 = batarya kızağı (module.kizak) — föyden okunan HR
                             //       eksenindeki yeri (agizlar[].on = ÖN kenarına uzaklık)

// Yüklenen her modülde araKat alanını kurar. Tembel kurulum (araKatOf) tek başına yeterli
// olurdu ama o zaman projectData() → JSON → applyProjectData() → projectData() gidiş-dönüşü
// SABİT NOKTA olmazdı: ilk çıktıda alan yok, render sırasında oluşup ikincisinde çıkardı.
function araKatNormalize(){
  state.ahus.forEach(function(ahu){
    (ahu.modules||[]).forEach(function(md){ araKatOf(md); });
  });
}
// Aynı gerekçe: tembel kurulum tek başına yeterli olurdu ama o zaman
// projectData() → JSON → applyProjectData() → projectData() SABİT NOKTA olmazdı
// (alan ilk çıktıda yok, render sırasında oluşup ikincisinde çıkardı).
function esanjorNormalize(){
  state.ahus.forEach(function(ahu){
    (ahu.modules||[]).forEach(function(md){ esanjorOf(md); });
  });
}
// Aynı gerekçe (JSON gidiş-dönüşü sabit nokta kalsın).
function kizakNormalize(){
  state.ahus.forEach(function(ahu){
    (ahu.modules||[]).forEach(function(md){ kizakOf(md); });
  });
}

function projectData(){
  return {
    version: PROJECT_VERSION,
    proje: state.proje,
    ahus: state.ahus,
    activeAhu: state.activeAhu
  };
}

// Ayrıştırılmış proje nesnesini modele uygular. Doğrulama sürüm numarasına DEĞİL BİÇİME
// bakar — sürüm her arttığında yükleyiciyi güncellemeyi unutmak, kendi kaydettiğimiz
// dosyanın &quot;geçersiz&quot; sayılmasına yol açıyordu. Alan farklarını syncStructure kapatır.
// Dönüş: tanınan bir biçim miydi.
function applyProjectData(data){
  if(!data || typeof data !== 'object') return false;
  if(Array.isArray(data.ahus)){
    // v3+ : çok-AHU formatı
    state.ahus = data.ahus;
    state.activeAhu = typeof data.activeAhu==='number' ? Math.max(0, Math.min(data.activeAhu, data.ahus.length-1)) : 0;
  } else if(Array.isArray(data.modules)){
    // v2 : tek-AHU geriye uyumluluk
    const ahu = newAhu(1);
    ahu.modules = data.modules;
    ahu.active = typeof data.active==='number' ? Math.max(0, Math.min(data.active, data.modules.length-1)) : 0;
    if(data.varsayimlar) ahu.varsayimlar = data.varsayimlar;
    state.ahus = [ahu];
    state.activeAhu = 0;
  } else {
    return false;
  }
  if(data.proje) state.proje = data.proje;
  araKatNormalize();   // v4 ve öncesi: ara katsız modül olarak kurulur
  esanjorNormalize();  // v5 ve öncesi: eşanjörsüz modül olarak kurulur
  kizakNormalize();    // v16 ve öncesi: kızaksız modül olarak kurulur
  adetNormalize();     // v14 ve öncesi: adetsiz (tek cihaz) olarak kurulur
  return true;
}

function saveProject(){
  const data = projectData();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const fname = (state.proje.isNo || '').trim() || 'proje';
  a.download = fname.replace(/[/\\:*?&quot;<>|]/g,'_') + '.json';
  // Element yalnızca adı ve URL'yi taşımak için kuruldu; tıklamayı kuyruk yapar.
  indirmeSirala(a.href, a.download);
}

function loadProject(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!applyProjectData(data)){
        alert('Geçersiz proje dosyası.');
        return;
      }
      if(Number(data.version) > PROJECT_VERSION){
        alert('Bu dosya programın daha yeni bir sürümüyle kaydedilmiş (v'+data.version+' > v'+PROJECT_VERSION+'). Açıldı, ancak tanınmayan ayarlar korunmayabilir.');
      }
      const isNoEl = document.getElementById('prj_isno');
      if(isNoEl) isNoEl.value = state.proje.isNo || '';
      renderAll(); // renderAll → renderAhuTabs → prj_ad synced to active AHU
    }catch(err){
      alert('Proje yüklenemedi: '+err.message);
    }
  };
  reader.readAsText(file);
}

// ---------- THREE.JS 3B MOTORU İÇİN KÖPRÜ ----------
// Sayfa sonundaki <script type=&quot;module&quot;> bu nesne üzerinden mevcut veri modeline
// ve fonksiyonlara erişir. Modüller (ES module) klasik <script> içindeki const/function
// tanımlarını doğrudan göremediğinden, ihtiyaç duyulan her şey burada açıkça köprülenir.
window.APP = {
  state, FACE_DEFS, EL3_DEPTH,
  modExt, withModule, faceLayoutRects, faceUVtoXYZ,
  faceMated, detectCollisions, addModuleAt
};
</script>

<script type=&quot;module&quot;>
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ============================================================================
// GERÇEK 3B RENDER MOTORU (Three.js / WebGL)
// ----------------------------------------------------------------------------
// Önceki sürüm elle yazılmış bir projeksiyon + &quot;ressam algoritması&quot; (painter's
// algorithm) kullanıyordu: nesneler uzaklığa göre sıralanıp sırayla çiziliyordu.
// Bu yaklaşım, bitişik/çıkıntılı geometrilerde (damper, boğaz, komşu modüller)
// yanlış üst-üste-binme hatalarına açıktı, çünkü gerçek bir derinlik testi
// (Z-Buffer) yoktu. Bu motor onun yerine GPU'nun donanımsal derinlik tamponunu
// kullanır: her piksel için &quot;kameraya en yakın yüzey&quot; otomatik ve kesin olarak
// belirlenir; çizim sırası artık görünürlüğü etkilemez.
// ============================================================================

function boot(){
  if(!window.APP){ setTimeout(boot, 30); return; }
  const APP = window.APP;
  const {
    state, FACE_DEFS, modExt, withModule, faceLayoutRects,
    faceUVtoXYZ, faceMated, detectCollisions, addModuleAt, EL3_DEPTH
  } = APP;

  const NORMALS = [[0,0,1],[0,0,-1],[0,1,0],[0,-1,0],[-1,0,0],[1,0,0]];
  const DARK_EDGE = 0x0a1118, COLL_EDGE = 0xd9534f;

  const container = document.getElementById('canvas3d');
  const warnEl = document.getElementById('coll_warn');
  const resetBtn = document.getElementById('v3_reset');
  if(!container) return;

  function containerSize(){
    // Sekme gizliyken (display:none) clientWidth 0 döner — 900x560 sabit oranına düş.
    const w = container.clientWidth || 900;
    const h = container.clientHeight || Math.round(w*560/900);
    return {w, h: h||560};
  }

  // ---------- Sahne / Kamera / Render ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);

  const camera = new THREE.OrthographicCamera(-1,1,1,-1, 1, 200000);

  const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  container.innerHTML = '';
  container.appendChild(renderer.domElement);

  const labelRenderer = new CSS2DRenderer();
  Object.assign(labelRenderer.domElement.style, {position:'absolute', top:'0', left:'0', pointerEvents:'none'});
  container.appendChild(labelRenderer.domElement);

  // Not: ışıklandırma/gölgelendirme kasıtlı olarak kullanılmıyor — tüm malzemeler unlit
  // (MeshBasicMaterial). Bu hem titreme/pırpır sorununu ortadan kaldırır hem de her rengin
  // her açıdan birebir aynı, düz göründüğü bir teknik çizim görünümü verir.

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.12;
  controls.screenSpacePanning = true;
  controls.minZoom = 0.22; controls.maxZoom = 6;
  controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
  controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

  const modelGroup = new THREE.Group();
  scene.add(modelGroup);

  let defaultCam = null;      // &quot;Görünümü Sıfırla&quot; için
  let faceHitMeshes = [];     // tıkla-ekle vuruş düzlemleri
  let solidMeshes = [];       // opak paneller/eklentiler — tıklama engelleme (occlusion) testi için
  let labelEntries = [];      // {obj, normal} — kamera açısına göre görünürlük güncellemesi için
  let modNameGroups = [];     // her modül için aday &quot;M#&quot; etiketleri — her karede en dönük yüzdeki gösterilir

  // ---------- Yardımcı: yüz düzleminde kutu parametreleri ----------
  // fi'nin normali doğrultusunda ('outward': yüzden dışa taşan | 'center': yüz düzleminde ortalanmış)
  // u0..v1 aralığını gerçek dünya (mm) kutusuna çevirir. Diğer 6 yüz için de aynı genel mantık
  // çalışır — yüze özel kod dallanmasına gerek yoktur.
  // Sıfır kalınlıklı düz yüzey: panel gibi &quot;ince kutu&quot; yerine gerçek bir düzlem kullanır.
  // Bir kutunun kendi ön/arka/yan yüzeyleri arasında büyük düz alanlarda oluşabilecek
  // z-fighting'i kökten ortadan kaldırır (kalınlık kavramı hiç yok). outward: yüz düzleminden
  // normal yönünde dışa doğru ofset (mm) — komşu geometriyle (çerçeve, vuruş düzlemi) net
  // ayrışma için.
  function facePlaneQuad(fi, u0,v0,u1,v1, L,H,W, pos, outward){
    const n = NORMALS[fi];
    const pts = [[u0,v0],[u1,v0],[u1,v1],[u0,v1]].map(([u,v])=>{
      const p = faceUVtoXYZ(fi,u,v,L,H,W);
      return new THREE.Vector3(p[0]+pos.x+n[0]*outward, p[1]+pos.y+n[1]*outward, p[2]+pos.z+n[2]*outward);
    });
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(12);
    pts.forEach((p,i)=>{ positions[i*3]=p.x; positions[i*3+1]=p.y; positions[i*3+2]=p.z; });
    geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    geo.setIndex([0,1,2, 0,2,3]);
    return {geo, pts};
  }

  // 4 köşeden DOĞRUDAN kapalı bir dörtgen çerçeve çizer — EdgesGeometry'nin otomatik
  // köşegen algılamasına (sayısal hassasiyet nedeniyle yanlışlıkla &quot;kenar&quot; sayılıp görünür
  // bir çizgi/artefakt oluşturabilir) hiç gerek bırakmaz; sadece bilinen 4 gerçek kenar çizilir.
  function addQuadOutline(grp, pts, colorHex){
    const positions = new Float32Array(24); // 4 kenar × 2 nokta × 3 eksen
    const pairs = [[0,1],[1,2],[2,3],[3,0]];
    pairs.forEach(([a,b], i)=>{
      positions[i*6]   = pts[a].x; positions[i*6+1] = pts[a].y; positions[i*6+2] = pts[a].z;
      positions[i*6+3] = pts[b].x; positions[i*6+4] = pts[b].y; positions[i*6+5] = pts[b].z;
    });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    const ln = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({color:colorHex, transparent:true, opacity:0.85}));
    grp.add(ln);
  }

  function facePlaneBox(fi, u0,v0,u1,v1, L,H,W, pos, depth, mode){
    const corners = [[u0,v0],[u1,v0],[u1,v1],[u0,v1]].map(([u,v])=>{
      const p = faceUVtoXYZ(fi,u,v,L,H,W);
      return [p[0]+pos.x, p[1]+pos.y, p[2]+pos.z];
    });
    let mn=[Infinity,Infinity,Infinity], mx=[-Infinity,-Infinity,-Infinity];
    corners.forEach(c=>{ for(let k=0;k<3;k++){ mn[k]=Math.min(mn[k],c[k]); mx[k]=Math.max(mx[k],c[k]); } });
    const n = NORMALS[fi];
    for(let k=0;k<3;k++){
      if(mx[k]-mn[k] > 1e-6) continue; // bu eksen yüzeyin genişliği/yüksekliği — dokunma
      if(mode==='outward'){
        if(n[k]>0) mx[k]+=depth; else mn[k]-=depth;
      } else {
        mn[k]-=depth/2; mx[k]+=depth/2;
      }
    }
    return {
      center: new THREE.Vector3((mn[0]+mx[0])/2, (mn[1]+mx[1])/2, (mn[2]+mx[2])/2),
      size:   new THREE.Vector3(Math.max(mx[0]-mn[0],0.02), Math.max(mx[1]-mn[1],0.02), Math.max(mx[2]-mn[2],0.02))
    };
  }

  function addBoxEdges(mesh, colorHex){
    const eg = new THREE.EdgesGeometry(mesh.geometry, 1);
    const ln = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({color:colorHex, transparent:true, opacity:0.85}));
    mesh.add(ln);
  }

  // Silindir eksenini (varsayılan Y) verilen yüzey normaline hizalar
  function orientAlongNormal(mesh, n){
    const from = new THREE.Vector3(0,1,0);
    const to = new THREE.Vector3(n[0],n[1],n[2]).normalize();
    mesh.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(from, to));
  }

  // lines: [{text, cls}] — hem CSS2D DOM görünümü hem de Excel'e aktarırken canvas'a elle
  // yeniden çizim için gereken yapılandırılmış veri burada birlikte tutulur (bkz. capture3DView).
  function makeLabel(lines, extraClass){
    const div = document.createElement('div');
    div.className = 'label3d' + (extraClass? ' '+extraClass : '');
    div.innerHTML = lines.map(l=>`<span class=&quot;${l.cls}&quot;>${l.text}</span>`).join('<br>');
    const obj = new CSS2DObject(div);
    obj.userData.lines = lines;
    return obj;
  }

  function addLabel(grp, lines, worldPos, faceNormal, extraClass){
    const label = makeLabel(lines, extraClass);
    label.position.copy(worldPos);
    grp.add(label);
    labelEntries.push({obj:label, normal:new THREE.Vector3(faceNormal[0],faceNormal[1],faceNormal[2])});
    return label;
  }

  // ---------- Bir modülün tüm geometrisini kur ----------
  function buildModule(m, collides){
    const md = state.modules[m];
    const L = modExt(md,'x'), H = modExt(md,'y'), W = modExt(md,'z');
    const pos = md.pos;
    const grp = new THREE.Group();
    grp.name = 'module'+m;

    // Gövde çerçevesi: normalde ÇİZİLMEZ (&quot;kenar&quot; panel katmanları zaten aynı görseli
    // sağlıyor — bu çizgi onlara ek, gereksiz bir tekrardı). Yalnızca modüller ÇAKIŞTIĞINDA
    // kırmızı bir uyarı çerçevesi olarak çizilir.
    if(collides){
      const frameGeo = new THREE.BoxGeometry(L,H,W);
      const frameLine = new THREE.LineSegments(new THREE.EdgesGeometry(frameGeo),
        new THREE.LineBasicMaterial({color: COLL_EDGE, linewidth: 2}));
      frameLine.position.set(pos.x+L/2, pos.y+H/2, pos.z+W/2);
      grp.add(frameLine);
      frameGeo.dispose();
    }

    const modNameCandidates = [];

    NORMALS.forEach((n, fi)=>{
      if(faceMated(m, fi)) return; // komşu modülle birleşen iç yüz — çizilmez
      const lay = withModule(m, ()=>faceLayoutRects(fi));

      // Modül adı için bu yüzde de bir aday etiket oluşturulur; hangisi gösterileceğine
      // (o anki kamera açısına göre hangi yüz en dönük duruyorsa) her karede karar verilir —
      // böylece modülün HERHANGİ bir yüzü görünürken adı da mutlaka görünür.
      {
        const dk = {L, H, W};
        const fw = dk[FACE_DEFS[fi].wKey], fh = dk[FACE_DEFS[fi].hKey];
        const p = faceUVtoXYZ(fi, fw/2, fh*0.09, L,H,W);
        const wp = new THREE.Vector3(p[0]+pos.x, p[1]+pos.y, p[2]+pos.z)
          .addScaledVector(new THREE.Vector3(n[0],n[1],n[2]), 14);
        const label = makeLabel([{text:`M${m+1}`, cls:'modname'}], 'modname');
        label.position.copy(wp);
        label.userData.mi = m;
        label.visible = false;
        grp.add(label);
        modNameCandidates.push({obj:label, normal:new THREE.Vector3(n[0],n[1],n[2])});
      }

      lay.rects.forEach((rc, idx)=>{
        if(rc.eleman) return; // damper/boğaz/tava ayrı işlenir (aşağıda)
        // faceLayoutRects, 2D SVG mantığıyla ÜST ÜSTE binen rect'ler üretir (arka plan → kenar
        // şeritleri → köşe plastikleri → gerçek paneller — dizideki SONRAKİ rect 2D'de otomatik
        // üstte görünürdü). 3B'de bunların hepsini AYNI derinlikte çizmek z-fighting'e yol açar;
        // bu yüzden dizideki sırayı gerçek derinliğe çeviriyoruz. Fark, GÖZLE FARK EDİLMEYECEK
        // kadar küçük tutulur (mm'nin onda biri) — z-fighting'i önlemeye yeter ama katmanlar
        // arasında görünür bir &quot;basamak/boşluk&quot; oluşturmaz.
        const outward = 1.2 + idx*0.12;
        if(rc.circle){
          // Camlı Açılır gözetleme camı — Yüz Düzenleme (2B) görünümüyle aynı renk/çerçeve:
          // açık mavi dolgu (rgba(150,215,235,.62)) + koyu mavi çerçeve (#2f8fae)
          const c3 = faceUVtoXYZ(fi, rc.cu, rc.cv, L,H,W);
          const rim = new THREE.Mesh(
            new THREE.CylinderGeometry(rc.r, rc.r, 15, 24),
            new THREE.MeshBasicMaterial({color:0x2f8fae, transparent:true, opacity:0.9})
          );
          const glass = new THREE.Mesh(
            new THREE.CylinderGeometry(rc.r*0.86, rc.r*0.86, 17, 24),
            new THREE.MeshBasicMaterial({color:0x96d7eb, transparent:true, opacity:0.62})
          );
          orientAlongNormal(rim, n);
          orientAlongNormal(glass, n);
          rim.position.set(c3[0]+pos.x+n[0]*(outward+0.9), c3[1]+pos.y+n[1]*(outward+0.9), c3[2]+pos.z+n[2]*(outward+0.9));
          glass.position.set(c3[0]+pos.x+n[0]*(outward+1), c3[1]+pos.y+n[1]*(outward+1), c3[2]+pos.z+n[2]*(outward+1));
          grp.add(rim); grp.add(glass);
          solidMeshes.push(rim); solidMeshes.push(glass);
          return;
        }
        const {geo:quadGeo, pts:quadPts} = facePlaneQuad(fi, rc.u0, rc.v0, rc.u1, rc.v1, L,H,W, pos, outward);
        const mesh = new THREE.Mesh(
          quadGeo,
          new THREE.MeshBasicMaterial({color: rc.fill, side:THREE.DoubleSide, transparent: !!rc.bos, opacity: rc.bos?0.55:1})
        );
        grp.add(mesh);
        // Arka plan ve köşe-plastiği dekoratif katmanlarına kenarlık çizilmez. Ama KENAR
        // şeridine (gerçek panellerle aynı şekilde) çizilir — bu, iki modül yan yana geldiğinde
        // her modülün kendi çerçevesini ayırt edilebilir kılan çizgidir.
        if(rc.fill!=='#131d27' && rc.fill!=='#10161d'){
          addQuadOutline(grp, quadPts, DARK_EDGE);
        }
        solidMeshes.push(mesh);
        // Açılır panel donanımı — Yüz Düzenleme (2B) görünümüyle aynı: 2 menteşe noktası
        // (u0 kenarı) + kapı kolu (u1 kenarı), gerçek panel yüzeyine oturan düz dörtgenler.
        if(rc.acilir){
          const uSpan = rc.u1-rc.u0, vSpan = rc.v1-rc.v0;
          const edgeOff = Math.min(15, uSpan*0.12);
          [0.3, 0.7].forEach(fv=>{
            const hv = rc.v0 + vSpan*fv;
            const c3h = faceUVtoXYZ(fi, rc.u0+edgeOff, hv, L,H,W);
            const dot = new THREE.Mesh(
              new THREE.CylinderGeometry(7,7,6,16),
              new THREE.MeshBasicMaterial({color:0x4fb8a8})
            );
            orientAlongNormal(dot, n);
            dot.position.set(c3h[0]+pos.x+n[0]*(outward+3), c3h[1]+pos.y+n[1]*(outward+3), c3h[2]+pos.z+n[2]*(outward+3));
            grp.add(dot);
            solidMeshes.push(dot);
          });
          const handleW = Math.min(9, uSpan*0.1), handleHalf = Math.min(22, vSpan*0.18);
          const hu1 = rc.u1-edgeOff-handleW/2, hu2 = rc.u1-edgeOff+handleW/2;
          const hv1 = rc.v0+vSpan*0.5-handleHalf, hv2 = rc.v0+vSpan*0.5+handleHalf;
          const bw = Math.max(handleW*0.22, 1.5);
          const handleRim = new THREE.Mesh(
            facePlaneQuad(fi, hu1-bw, hv1-bw, hu2+bw, hv2+bw, L,H,W, pos, outward+2.8).geo,
            new THREE.MeshBasicMaterial({color:0x4fb8a8, side:THREE.DoubleSide})
          );
          const handle = new THREE.Mesh(
            facePlaneQuad(fi, hu1, hv1, hu2, hv2, L,H,W, pos, outward+3).geo,
            new THREE.MeshBasicMaterial({color:0x14212b, side:THREE.DoubleSide})
          );
          grp.add(handleRim); grp.add(handle);
          solidMeshes.push(handleRim); solidMeshes.push(handle);
        }
      });

      // Etiketler: panel kodu + gerçek mm ölçüsü (KAPAKSIZ / BOŞ dahil)
      lay.labels.forEach(lb=>{
        const p = faceUVtoXYZ(fi, lb.u, lb.v, L,H,W);
        const wp = new THREE.Vector3(p[0]+pos.x, p[1]+pos.y, p[2]+pos.z)
          .addScaledVector(new THREE.Vector3(n[0],n[1],n[2]), 14);
        const isPanelCode = /-B\d/.test(lb.text);
        const txt = isPanelCode ? 'M'+(m+1)+'·'+lb.text : lb.text;
        const boscls = lb.bos ? ' bos' : '';
        const lines = [{text:txt, cls:'l1'+boscls}];
        if(lb.type) lines.push({text: lb.type.length>12 ? lb.type.slice(0,11)+'…' : lb.type, cls:'l3'+boscls});
        if(lb.size) lines.push({text:lb.size, cls:'l2'+boscls});
        const lblObj = addLabel(grp, lines, wp, n);
        lblObj.userData.mi = m;
        // Panelin dört köşesi (dünya) — Excel'e yakalarken etiketin YÖNÜ ve BOYU bu kutuya
        // göre seçilir. lb.size zaten '{Δu}×{Δv}' mm'dir; faceLayoutRects'in sözleşmesini
        // büyütmemek için oradan okunur (o çıktının bayt bayt sabitliği testlerle korunuyor).
        const olcuMM = /^(\d+)×(\d+)$/.exec(lb.size||'');
        if(olcuMM){
          const du = +olcuMM[1]/2, dv = +olcuMM[2]/2;
          lblObj.userData.kose = [[-du,-dv],[du,-dv],[-du,dv],[du,dv]].map(uv=>{
            const q = faceUVtoXYZ(fi, lb.u+uv[0], lb.v+uv[1], L,H,W);
            return new THREE.Vector3(q[0]+pos.x, q[1]+pos.y, q[2]+pos.z);
          });
        }
      });

      // Tıkla-modül-ekle: görünmez vuruş düzlemi — bu yüzün KENDİ tüm katmanlarının (arka plan,
      // kenar şeridi, gerçek panel, Tava) önünde durur ki panelin ortasına tıklamak da kenarına
      // tıklamak kadar kolay olsun. Yine de gerçekten önde duran BAŞKA bir modülün gövdesi
      // tarafından (ayrı raycaster hedefi olarak) doğru şekilde engellenmeye devam eder.
      const hitBox = facePlaneBox(fi, 0, 0, lay.FW, lay.FH, L,H,W, pos, 14, 'outward');
      const hitMesh = new THREE.Mesh(
        new THREE.BoxGeometry(hitBox.size.x, hitBox.size.y, hitBox.size.z),
        new THREE.MeshBasicMaterial({color:0x4fb8a8, transparent:true, opacity:0, side:THREE.FrontSide, depthWrite:false, depthTest:false})
      );
      hitMesh.position.copy(hitBox.center);
      hitMesh.userData = {faceHit:true, m, fi};
      grp.add(hitMesh);
      faceHitMeshes.push(hitMesh);

      // Damper / Boğaz / Tava — kendi eklerini kur
      lay.rects.filter(rc=>rc.eleman).forEach(rc=>{
        buildElemanMesh(grp, fi, rc, L,H,W, pos, n, m);
      });
      // PANELE MONTE AĞIZ (Cenk, 29.08.2026): boğaz kendi gözünü açmaz, panelin
      // ÜZERİNE monte edilir — 3B'de panelin deliği kadar bir eleman gövdesi çizilir.
      lay.rects.filter(rc=>rc.delik).forEach(rc=>{
        const d = rc.delik;
        buildElemanMesh(grp, fi, {u0:d.u0, v0:d.v0, u1:d.u1, v1:d.v1,
          eleman:true, elType:d.tip, lbl:d.lbl}, L,H,W, pos, n, m);
      });
    });

    if(modNameCandidates.length) modNameGroups.push(modNameCandidates);

    return grp;
  }

  // Damper: metal kanat gövdesi + kırmızı conta şeridi (150mm dışa çıkıntı)
  // Boğaz : flanş kutusu + koyu kanal açıklığı (150mm dışa çıkıntı)
  // Tava  : çıkıntısız düz panel + küçük tahliye deliği
  function buildElemanMesh(grp, fi, rc, L,H,W, pos, n, m){
    const isDamper = rc.elType==='Damper';
    const isTava = rc.elType==='Tava';
    const nrm = new THREE.Vector3(n[0],n[1],n[2]);
    // Elemanın dört köşesi (dünya) — etiketin yönü/boyu bu kutuya göre seçilir. Etiket
    // yüzeyden `disari` kadar dışarıda durduğu için köşeler de aynı düzleme taşınır.
    const elKose = (disari)=> [[rc.u0,rc.v0],[rc.u1,rc.v0],[rc.u0,rc.v1],[rc.u1,rc.v1]].map(uv=>{
      const q = faceUVtoXYZ(fi, uv[0], uv[1], L,H,W);
      return new THREE.Vector3(q[0]+pos.x, q[1]+pos.y, q[2]+pos.z).addScaledVector(nrm, disari);
    });

    if(isTava){
      const {geo:quadGeo, pts:quadPts} = facePlaneQuad(fi, rc.u0, rc.v0, rc.u1, rc.v1, L,H,W, pos, 9);
      const mesh = new THREE.Mesh(quadGeo,
        new THREE.MeshBasicMaterial({color:0x111315, side:THREE.DoubleSide, polygonOffset:true, polygonOffsetFactor:2, polygonOffsetUnits:2}));
      grp.add(mesh);
      addQuadOutline(grp, quadPts, DARK_EDGE);
      solidMeshes.push(mesh);

      // tahliye deliği (u/v dünya mm ile 1:1 olduğundan holeR doğrudan yarıçaptır)
      const holeU = (rc.u0+rc.u1)/2, holeV = rc.v0+(rc.v1-rc.v0)*0.72;
      const holeR = Math.max(Math.min(rc.u1-rc.u0, rc.v1-rc.v0)*0.09, 3);
      const hc3 = faceUVtoXYZ(fi, holeU, holeV, L,H,W);
      const hole = new THREE.Mesh(new THREE.CylinderGeometry(holeR, holeR, 6, 20),
        new THREE.MeshBasicMaterial({color:0x05080c}));
      orientAlongNormal(hole, n);
      hole.position.set(hc3[0]+pos.x, hc3[1]+pos.y, hc3[2]+pos.z);
      hole.position.addScaledVector(nrm, 10.5);
      grp.add(hole);

      const centerTava = faceUVtoXYZ(fi, (rc.u0+rc.u1)/2, (rc.v0+rc.v1)/2, L,H,W);
      const labelPos = new THREE.Vector3(centerTava[0]+pos.x, centerTava[1]+pos.y, centerTava[2]+pos.z)
        .addScaledVector(nrm, 12);
      addElemanLabel(grp, rc, m, labelPos, n, elKose(12));
      return;
    }

    // Damper / Boğaz: 150mm dışa çıkıntılı İÇİ BOŞ ÇERÇEVE (dolu kutu değil — aksi halde
    // ön yüzü, içine konacak kanatları/kanalı tamamen gizler; tıpkı orijinal 2D SVG'deki
    // gibi burada da sadece kenar çerçevesi katı, orta kısım açık bırakılır).
    const bodyColor = isDamper ? 0x4b5158 : 0x5c3a1e;
    const frameMat = new THREE.MeshBasicMaterial({color:bodyColor, polygonOffset:true, polygonOffsetFactor:2, polygonOffsetUnits:2});
    const frameT = Math.max(Math.min(rc.u1-rc.u0, rc.v1-rc.v0) * 0.09, 14);
    const uMid0 = rc.u0+frameT, uMid1 = rc.u1-frameT, vMid0 = rc.v0+frameT, vMid1 = rc.v1-frameT;
    const frameStrips = [
      [uMid0, rc.v0, uMid1, rc.v0+frameT],   // üst (orta genişlik — köşeler sol/sağ şeride ait)
      [uMid0, rc.v1-frameT, uMid1, rc.v1],   // alt
      [rc.u0, rc.v0, rc.u0+frameT, rc.v1],   // sol (tam yükseklik)
      [rc.u1-frameT, rc.v0, rc.u1, rc.v1]    // sağ (tam yükseklik)
    ];
    frameStrips.forEach(([su0,sv0,su1,sv1])=>{
      const sbox = facePlaneBox(fi, su0,sv0,su1,sv1, L,H,W, pos, EL3_DEPTH, 'outward');
      const smesh = new THREE.Mesh(new THREE.BoxGeometry(sbox.size.x, sbox.size.y, sbox.size.z), frameMat);
      smesh.position.copy(sbox.center);
      grp.add(smesh);
      addBoxEdges(smesh, DARK_EDGE);
      solidMeshes.push(smesh);
    });

    if(isDamper){
      // Kanatlar: çerçeve açıklığı içinde dizilmiş bloklar + her kanadın dış (kameraya en
      // yakın) kenarında ince kırmızı conta şeridi — referans görsele göre.
      // ÇİZİM YÖNÜNÜ İZLER (2B yüz çiziminin aynası): yatayda v ekseni boyunca dizilir
      // (yatay kanatlar), 'dikey' seçilince u ekseni boyunca dizilir — yani 90° döner.
      const dik = rc.yon==='dikey';
      const d0 = dik ? uMid0 : vMid0, d1 = dik ? uMid1 : vMid1;   // kanatların dizildiği eksen
      const nSlat = Math.max(3, Math.min(7, Math.round((d1-d0)/140)));
      // Kanadın diğer eksendeki (boyunca uzandığı) aralığı — dizilim ekseninin tersi
      const kutu = (b0, b1, derinlik) => dik
        ? facePlaneBox(fi, b0, vMid0, b1, vMid1, L,H,W, pos, derinlik, 'outward')
        : facePlaneBox(fi, uMid0, b0, uMid1, b1, L,H,W, pos, derinlik, 'outward');
      for(let i=0;i<nSlat;i++){
        const t0 = i/nSlat, t1 = (i+0.86)/nSlat; // aralarda küçük boşluk
        const b0 = d0 + (d1-d0)*t0, b1 = d0 + (d1-d0)*t1;
        const bladeBox = kutu(b0, b1, EL3_DEPTH*0.86);
        const blade = new THREE.Mesh(new THREE.BoxGeometry(bladeBox.size.x, bladeBox.size.y, bladeBox.size.z),
          new THREE.MeshBasicMaterial({color:0xaeb4ba}));
        blade.position.copy(bladeBox.center);
        grp.add(blade);
        solidMeshes.push(blade);

        const sealBox = kutu(b0+(b1-b0)*0.78, b1, EL3_DEPTH*0.88);
        const seal = new THREE.Mesh(new THREE.BoxGeometry(sealBox.size.x, sealBox.size.y, sealBox.size.z),
          new THREE.MeshBasicMaterial({color:0xc1272d}));
        seal.position.copy(sealBox.center);
        grp.add(seal);
        solidMeshes.push(seal);
      }
    } else {
      // Boğaz: çerçeve açıklığı içinde, hafif geride (içeri çekilmiş) koyu kanal yüzeyi
      const innerBox = facePlaneBox(fi, uMid0, vMid0, uMid1, vMid1, L,H,W, pos, EL3_DEPTH*0.65, 'outward');
      const inner = new THREE.Mesh(new THREE.BoxGeometry(innerBox.size.x, innerBox.size.y, innerBox.size.z),
        new THREE.MeshBasicMaterial({color:0x05080c}));
      inner.position.copy(innerBox.center);
      grp.add(inner);
      solidMeshes.push(inner);
    }

    const centerP = faceUVtoXYZ(fi, (rc.u0+rc.u1)/2, (rc.v0+rc.v1)/2, L,H,W);
    const labelPos = new THREE.Vector3(centerP[0]+pos.x, centerP[1]+pos.y, centerP[2]+pos.z)
      .addScaledVector(nrm, EL3_DEPTH*0.95);
    addElemanLabel(grp, rc, m, labelPos, n, elKose(EL3_DEPTH*0.95));
  }

  function addElemanLabel(grp, rc, m, worldPos, n, koseler){
    const lines = [
      {text:`M${m+1}·${rc.lbl} — ${rc.elType}`, cls:'l1'},
      {text: rc.olcu || `${Math.round(rc.u1-rc.u0)}×${Math.round(rc.v1-rc.v0)}`, cls:'l2'}
    ];
    const lbl = addLabel(grp, lines, worldPos, n);
    lbl.userData.mi = m;
    if(koseler) lbl.userData.kose = koseler;
  }

  // ---------- Sahneyi tamamen yeniden kur ----------
  function disposeGroup(g){
    g.traverse(obj=>{
      if(obj.geometry) obj.geometry.dispose();
      if(obj.material){
        if(Array.isArray(obj.material)) obj.material.forEach(mm=>mm.dispose());
        else obj.material.dispose();
      }
      if(obj.isCSS2DObject && obj.element && obj.element.parentNode){
        obj.element.parentNode.removeChild(obj.element);
      }
    });
  }

  function rebuildScene(){
    disposeGroup(modelGroup);
    while(modelGroup.children.length) modelGroup.remove(modelGroup.children[0]);
    faceHitMeshes = []; solidMeshes = []; labelEntries = []; modNameGroups = [];

    const pairs = detectCollisions();
    const collSet = new Set(pairs.flat());
    state.modules.forEach((md, m)=>{
      modelGroup.add(buildModule(m, collSet.has(m)));
    });

    // Sınır kutusu → kamera hedefi ve mesafesi
    const box = new THREE.Box3().setFromObject(modelGroup);
    const sphere = new THREE.Sphere();
    box.getBoundingSphere(sphere);
    const center = sphere.center.clone();
    const radius = Math.max(sphere.radius, 200);

    const {w, h} = containerSize();
    const aspect = w/h;
    const fitR = radius * 1.15;
    camera.left = -fitR*aspect; camera.right = fitR*aspect;
    camera.top = fitR; camera.bottom = -fitR;
    camera.near = Math.max(radius*0.1, 1); camera.far = radius*8;

    if(!defaultCam){
      const dist = radius*3;
      const dir = new THREE.Vector3(Math.sin(-0.55)*Math.cos(0.42), Math.sin(0.42), Math.cos(-0.55)*Math.cos(0.42));
      const camPos = center.clone().addScaledVector(dir, dist);
      defaultCam = {pos:camPos.clone(), target:center.clone(), zoom:1};
      camera.position.copy(camPos);
      camera.zoom = 1;
      controls.target.copy(center);
    } else {
      // Mevcut bakış yönünü koru, sadece hedef merkezi güncelle
      const offset = camera.position.clone().sub(controls.target);
      controls.target.copy(center);
      camera.position.copy(center.clone().add(offset));
    }
    camera.updateProjectionMatrix();
    controls.update();

    updateCollisionWarning(pairs);
  }

  function updateCollisionWarning(pairs){
    if(!warnEl) return;
    if(pairs.length){
      warnEl.style.display = 'block';
      warnEl.textContent = '⚠ ÇAKIŞMA: ' + pairs.map(p=>'M'+(p[0]+1)+' ↔ M'+(p[1]+1)).join(', ')
        + ' — modüller iç içe geçiyor. Kırmızı çerçeveli modüllerin ölçülerini düzeltin; kesim listeleri çakışmayı bilmez, çıktı bu haliyle güvenilmez.';
    } else warnEl.style.display = 'none';
  }

  // ---------- Boyutlandırma ----------
  function resize(){
    const {w, h} = containerSize();
    renderer.setSize(w, h, false);
    labelRenderer.setSize(w, h);
    const aspect = w/h;
    const r = (camera.top - camera.bottom)/2;
    camera.left = -r*aspect; camera.right = r*aspect;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(container);

  // ---------- Tıkla → modül ekle (Raycaster, engel-farkında) ----------
  // Vuruş düzlemleriyle BİRLİKTE opak panel/eklenti gövdeleri de ışın testine dahil edilir;
  // böylece önünde başka bir modülün gövdesi varsa (kameraya daha yakınsa) tıklama o modüle
  // çarpar ve arkadaki yüz — doğru şekilde — tıklanabilir sayılmaz.
  const raycaster = new THREE.Raycaster();
  const pointerNDC = new THREE.Vector2();
  let downPt = null, moved = false;

  function updateNDC(e){
    const rect = renderer.domElement.getBoundingClientRect();
    pointerNDC.x = ((e.clientX-rect.left)/rect.width)*2-1;
    pointerNDC.y = -((e.clientY-rect.top)/rect.height)*2+1;
  }
  function castTargets(){ return [...faceHitMeshes, ...solidMeshes]; }

  renderer.domElement.addEventListener('pointerdown', e=>{
    downPt = {x:e.clientX, y:e.clientY}; moved = false;
  });
  renderer.domElement.addEventListener('pointermove', e=>{
    if(downPt){
      const dx=e.clientX-downPt.x, dy=e.clientY-downPt.y;
      if(Math.abs(dx)+Math.abs(dy) > 4) moved = true;
      return; // sürükleme/döndürme sırasında hover vurgusu için ışın taraması yapma
    }
    updateNDC(e);
    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObjects(castTargets(), false);
    faceHitMeshes.forEach(hm=>{ hm.material.opacity = 0; });
    if(hits.length && hits[0].object.userData.faceHit) hits[0].object.material.opacity = 0.16;
  });
  renderer.domElement.addEventListener('pointerup', e=>{
    if(downPt && !moved){
      updateNDC(e);
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(castTargets(), false);
      if(hits.length && hits[0].object.userData.faceHit){
        const {m, fi} = hits[0].object.userData;
        addModuleAt(m, fi); // renderAll() → render3D() zinciriyle sahne otomatik güncellenir
      }
    }
    downPt = null; moved = false;
  });

  if(resetBtn){
    resetBtn.addEventListener('click', ()=>{
      if(!defaultCam) return;
      camera.position.copy(defaultCam.pos);
      controls.target.copy(defaultCam.target);
      camera.zoom = defaultCam.zoom;
      camera.updateProjectionMatrix();
      controls.update();
    });
  }

  // ---------- Render döngüsü ----------
  const camDir = new THREE.Vector3();
  function updateLabelVisibility(){
    camera.getWorldDirection(camDir);
    labelEntries.forEach(({obj,normal})=>{ obj.visible = normal.dot(camDir) < -0.05; });
    // Modül adı: her modülde, o anki kamera açısına göre en dönük duran yüzdeki aday
    // gösterilir, diğerleri gizlenir — modülün herhangi bir yüzü görünürken adı da görünür.
    modNameGroups.forEach(group=>{
      let best = null, bestDot = -0.05;
      group.forEach(({obj,normal})=>{
        const d = normal.dot(camDir);
        obj.visible = false;
        if(d < bestDot){ bestDot = d; best = obj; }
      });
      if(best) best.visible = true;
    });
  }
  renderer.setAnimationLoop(()=>{
    controls.update();
    // Etiket görünürlüğü: yalnızca kameraya dönük yüzeylerin etiketleri gösterilir —
    // aksi halde CSS2D metni, derinlik testine girmediği için katı geometrinin arkasından sızar.
    updateLabelVisibility();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  });

  // ---------- Dışa aktarım: sabit açıdan / mevcut açıdan PNG yakala ----------
  window.capture3DView = function(yaw, pitch, w, h){
    return new Promise((resolve, reject)=>{
      try{
        const savedPos = camera.position.clone();
        const savedTarget = controls.target.clone();
        const savedZoom = camera.zoom;
        const savedCamL=camera.left, savedCamR=camera.right, savedCamT=camera.top, savedCamB=camera.bottom;
        const savedUp = camera.up.clone();

        const box = new THREE.Box3().setFromObject(modelGroup);
        const sphere = new THREE.Sphere();
        box.getBoundingSphere(sphere);
        const center = sphere.center.clone();
        const radius = Math.max(sphere.radius, 200);

        if(yaw!==null && pitch!==null){
          const dir = new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch));
          camera.position.copy(center.clone().addScaledVector(dir, radius*3));
          controls.target.copy(center);
          camera.zoom = 1;
          // Üst/Alt görünümde up vektörü bakış yönüyle çakışır → dejenere matris; Z eksenini kullan
          if(Math.abs(pitch) > Math.PI/2 - 0.01){
            camera.up.set(0, 0, pitch > 0 ? -1 : 1);
          } else {
            camera.up.set(0, 1, 0);
          }
          camera.lookAt(center);
        }
        // Sıkı fit: Box3 köşelerini view uzayına dönüştür, gerçek sınırı hesapla
        camera.updateMatrixWorld();
        const viewMat = camera.matrixWorldInverse;
        const corners3D = [
          new THREE.Vector3(box.min.x,box.min.y,box.min.z),
          new THREE.Vector3(box.max.x,box.min.y,box.min.z),
          new THREE.Vector3(box.min.x,box.max.y,box.min.z),
          new THREE.Vector3(box.max.x,box.max.y,box.min.z),
          new THREE.Vector3(box.min.x,box.min.y,box.max.z),
          new THREE.Vector3(box.max.x,box.min.y,box.max.z),
          new THREE.Vector3(box.min.x,box.max.y,box.max.z),
          new THREE.Vector3(box.max.x,box.max.y,box.max.z)
        ];
        let vMinX=Infinity,vMaxX=-Infinity,vMinY=Infinity,vMaxY=-Infinity;
        corners3D.forEach(c=>{
          c.applyMatrix4(viewMat);
          if(c.x<vMinX)vMinX=c.x; if(c.x>vMaxX)vMaxX=c.x;
          if(c.y<vMinY)vMinY=c.y; if(c.y>vMaxY)vMaxY=c.y;
        });
        const aspect = w/h;
        const hrX=(vMaxX-vMinX)/2, hrY=(vMaxY-vMinY)/2;
        // Sabit cephe görünümlerinde modül genişlik/yükseklik etiketleri kutunun hemen
        // dışına taşar — kırpılmasınlar diye bu görünümlerde çerçeveye ekstra pay bırakılır.
        // Dar (örn. SOL/SAĞ birleştirmesi için yarı genişlikte alınan) görünümlerde aynı
        // mutlak metin genişliği orantılı olarak daha fazla yer kapladığından pay artırılır.
        const fitMargin = (yaw!==null && pitch!==null) ? (w<600 ? 1.30 : 1.16) : 1.04;
        let halfW,halfH;
        if(hrX/Math.max(hrY,0.001)>aspect){ halfW=hrX*fitMargin; halfH=halfW/aspect; }
        else{ halfH=hrY*fitMargin; halfW=halfH*aspect; }
        halfW=Math.max(halfW,1); halfH=Math.max(halfH,1);
        const cxFit=(vMinX+vMaxX)/2, cyFit=(vMinY+vMaxY)/2;
        camera.left=cxFit-halfW; camera.right=cxFit+halfW;
        camera.top=cyFit+halfH; camera.bottom=cyFit-halfH;
        camera.updateProjectionMatrix();
        controls.update();

        const prevPR = renderer.getPixelRatio();
        renderer.setPixelRatio(1);
        renderer.setSize(w*2, h*2, false);
        updateLabelVisibility();
        renderer.render(scene, camera);

        // CSS2DRenderer etiketleri gerçek DOM elemanlarıdır — WebGL canvas'ının pikseline dahil
        // değildir, bu yüzden toDataURL() onları hiç yakalamaz. Görünür etiketleri burada elle,
        // 2B canvas metni olarak WebGL görüntüsünün üstüne besteliyoruz (composite).
        const outCanvas = document.createElement('canvas');
        outCanvas.width = w*2; outCanvas.height = h*2;
        const ctx = outCanvas.getContext('2d');
        ctx.drawImage(renderer.domElement, 0, 0);

        // Modül genişlik/yükseklik ölçü etiketleri — yalnızca sabit cephe görünümlerinde
        // (yaw/pitch verilmişse) anlamlı; serbest açıda &quot;genişlik altta/üstte&quot; gibi bir
        // yön tanımlanamaz. Etiket metninin gerçek yer kaplayacağı dikdörtgen tahmini başka
        // BİR modülün izdüşüm kutusuyla çakışıyorsa (basit &quot;bitişik mi&quot; testi değil, gerçek
        // çakışma testi — çapraz/kademeli modül dizilimlerinde de doğru çalışır) metin karşı
        // tarafa kaydırılır; her iki taraf da doluysa o ölçü hiç yazılmaz.
        // ---- ARKADA KALAN MODÜLÜN ETİKETİ ÇİZİLMEZ ----
        // Sabit cephe görünümünde izdüşüm eksene dik olduğu için bir modülün ekran kutusu
        // SİLUETİNE eşittir; önünde başka modül duran etiketi bu yüzden güvenle eleyebiliriz.
        // Serbest açıda kutu silueti aşar (köşeden bakışta AABB gerçek gölgeden büyüktür),
        // eleme yanlış olurdu — orada eski davranış sürer.
        // Kusur buydu: SOL cepheden M1'in ARKASINDAKİ M3 görünmüyor ama etiketleri aynı ekran
        // noktasına basılıyor, iki panel yazısı üst üste binip okunmaz hâle geliyordu.
        const sabitCephe = (yaw!==null && pitch!==null);
        const gorusZ = p => p.clone().applyMatrix4(camera.matrixWorldInverse).z;  // büyük z = kameraya YAKIN
        const ekranXY = p => { const q = p.clone().project(camera); return [(q.x*0.5+0.5)*w*2, (-q.y*0.5+0.5)*h*2]; };
        const modKutu = [];
        if(sabitCephe){
          state.modules.forEach((md, mi)=>{
            const ex = modExt(md,'x'), ey = modExt(md,'y'), ez = modExt(md,'z');
            let mnX=Infinity, mxX=-Infinity, mnY=Infinity, mxY=-Infinity, yakin=-Infinity;
            [0,ex].forEach(dx=>[0,ey].forEach(dy=>[0,ez].forEach(dz=>{
              const p = new THREE.Vector3(md.pos.x+dx, md.pos.y+dy, md.pos.z+dz);
              const xy = ekranXY(p);
              if(xy[0]<mnX)mnX=xy[0]; if(xy[0]>mxX)mxX=xy[0];
              if(xy[1]<mnY)mnY=xy[1]; if(xy[1]>mxY)mxY=xy[1];
              const z = gorusZ(p); if(z>yakin) yakin=z;
            })));
            modKutu.push({mi, mnX, mxX, mnY, mxY, yakin});
          });
        }
        // Etiket NOKTASI önde duran bir modülün kutusuna düşüyorsa çizilmez.
        const onuKapali = (obj, sx, sy)=>{
          if(!sabitCephe || obj.userData.mi===undefined) return false;
          const z = gorusZ(obj.position);
          return modKutu.some(k=> k.mi!==obj.userData.mi
            && sx>k.mnX+2 && sx<k.mxX-2 && sy>k.mnY+2 && sy<k.mxY-2 && k.yakin > z+1);
        };
        // Modül ölçü etiketi kutunun DIŞINA yazıldığı için nokta testi işe yaramaz: modül
        // ancak başka bir modül onu TAMAMEN örtüyorsa elenir (kısmen görünen ölçülenmeye
        // devam eder). M1 ile M3 aynı ekran kutusuna düştüğünde iki 'Yükseklik' yazısının
        // üst üste binmesinin sebebi buydu.
        const tamGizli = (mi)=>{
          if(!sabitCephe) return false;
          const me = modKutu.find(k=>k.mi===mi);
          if(!me) return false;
          return modKutu.some(k=> k.mi!==mi && k.yakin > me.yakin+1
            && k.mnX <= me.mnX+2 && k.mxX >= me.mxX-2 && k.mnY <= me.mnY+2 && k.mxY >= me.mxY-2);
        };
        if(yaw!==null && pitch!==null && state.modules.length){
          const isTopBottom = Math.abs(Math.abs(pitch) - Math.PI/2) < 0.01;
          const isSide = Math.abs(pitch) < 0.01 && Math.abs(Math.abs(yaw) - Math.PI/2) < 0.01;
          const wAxis = isTopBottom ? 'x' : (isSide ? 'z' : 'x');
          const hAxis = isTopBottom ? 'z' : 'y';
          const EKSEN_TR = { L:'Uzunluk', H:'Yükseklik', W:'Genişlik' };
          const wEtiket = EKSEN_TR[EXT_KEY[wAxis]], hEtiket = EKSEN_TR[EXT_KEY[hAxis]];
          const modBoxes = [];
          state.modules.forEach((md, mi)=>{
            const grp = modelGroup.children.find(c=>c.name==='module'+mi);
            if(!grp) return;
            const mbox = new THREE.Box3().setFromObject(grp);
            if(mbox.isEmpty()) return;
            const corners = [
              [mbox.min.x,mbox.min.y,mbox.min.z],[mbox.max.x,mbox.min.y,mbox.min.z],
              [mbox.min.x,mbox.max.y,mbox.min.z],[mbox.max.x,mbox.max.y,mbox.min.z],
              [mbox.min.x,mbox.min.y,mbox.max.z],[mbox.max.x,mbox.min.y,mbox.max.z],
              [mbox.min.x,mbox.max.y,mbox.max.z],[mbox.max.x,mbox.max.y,mbox.max.z]
            ];
            let sMinX=Infinity,sMaxX=-Infinity,sMinY=Infinity,sMaxY=-Infinity;
            corners.forEach(c=>{
              const p = new THREE.Vector3(c[0],c[1],c[2]).project(camera);
              const sx=(p.x*0.5+0.5)*w*2, sy=(-p.y*0.5+0.5)*h*2;
              if(sx<sMinX)sMinX=sx; if(sx>sMaxX)sMaxX=sx;
              if(sy<sMinY)sMinY=sy; if(sy>sMaxY)sMaxY=sy;
            });
            modBoxes.push({mi, sMinX, sMaxX, sMinY, sMaxY, wVal: modExt(md, wAxis), hVal: modExt(md, hAxis)});
          });
          // Etiketin kaplayacağı alanın kabaca tahmini (mevcut 20px font ölçüsüne göre) —
          // yatay (genişlik) metni geniş/alçak, dikey (yükseklik) tarafı dar/uzun kabul edilir.
          const rectsOverlap = (a,b)=> a.minX<b.maxX && a.maxX>b.minX && a.minY<b.maxY && a.maxY>b.minY;
          const H_LBL_H = 22, V_LBL_W = 22, V_LBL_H = 90, GAP = 8;
          const olcuMetni = (me, yatayMi)=> yatayMi
            ? (wEtiket+' '+Math.round(me.wVal)+' mm')
            : (hEtiket+' '+Math.round(me.hVal)+' mm');
          // Modül kutularıyla çakışma testi için KABA alan (eski davranış, dokunulmadı)
          const kabaKutu = (me, dir)=>{
            const midY=(me.sMinY+me.sMaxY)/2;
            if(dir==='below') return { minX: me.sMinX, maxX: me.sMaxX, minY: me.sMaxY+GAP, maxY: me.sMaxY+GAP+H_LBL_H };
            if(dir==='above') return { minX: me.sMinX, maxX: me.sMaxX, minY: me.sMinY-GAP-H_LBL_H, maxY: me.sMinY-GAP };
            if(dir==='left') return { minX: me.sMinX-GAP-V_LBL_W, maxX: me.sMinX-GAP, minY: midY-V_LBL_H/2, maxY: midY+V_LBL_H/2 };
            return { minX: me.sMaxX+GAP, maxX: me.sMaxX+GAP+V_LBL_W, minY: midY-V_LBL_H/2, maxY: midY+V_LBL_H/2 };
          };
          // Yazı-yazı çakışması için GERÇEK (ölçülmüş) alan: V_LBL_H tahmini uzun metinlerin
            // yarısı kadar; 'Yükseklik 1600 mm' döndürülünce ~190 px yer kaplıyor. Kusur buydu —
          // aynı kenara yazılan iki modül ölçüsü üst üste biniyordu.
          const yaziKutusu = (me, dir)=>{
            const midX=(me.sMinX+me.sMaxX)/2, midY=(me.sMinY+me.sMaxY)/2;
            if(dir==='below'||dir==='above'){
              const tw = ctx.measureText(olcuMetni(me,true)).width;
              const k = kabaKutu(me, dir);
              return { minX: midX-tw/2, maxX: midX+tw/2, minY: k.minY, maxY: k.maxY };
            }
            const th = ctx.measureText(olcuMetni(me,false)).width;   // döndürülmüş → DİKEY uzunluk
            const k = kabaKutu(me, dir);
            return { minX: k.minX, maxX: k.maxX, minY: midY-th/2, maxY: midY+th/2 };
          };
          const yaziAlanlari = [];
          const sideFree = (me, dir)=>{
            const test = kabaKutu(me, dir);
            if(modBoxes.some(n=> n!==me && rectsOverlap(test, {minX:n.sMinX,maxX:n.sMaxX,minY:n.sMinY,maxY:n.sMaxY}))) return false;
            return !yaziAlanlari.some(a=> rectsOverlap(yaziKutusu(me, dir), a));
          };
          ctx.font = '600 20px Inter, Arial, sans-serif';
          ctx.shadowColor = 'rgba(255,255,255,0.85)';
          ctx.shadowBlur = 3;
          ctx.fillStyle = '#000000';
          modBoxes.forEach(me=>{
            if(tamGizli(me.mi)) return;   // arkada tamamen kalan modül ölçülenmez
            const midX=(me.sMinX+me.sMaxX)/2, midY=(me.sMinY+me.sMaxY)/2;
            const belowFree = sideFree(me,'below'), aboveFree = sideFree(me,'above');
            if(belowFree || aboveFree){
              ctx.textAlign = 'center';
              if(belowFree){ ctx.textBaseline = 'top'; ctx.fillText(wEtiket+' '+Math.round(me.wVal)+' mm', midX, me.sMaxY+8); }
              else { ctx.textBaseline = 'bottom'; ctx.fillText(wEtiket+' '+Math.round(me.wVal)+' mm', midX, me.sMinY-8); }
              yaziAlanlari.push(yaziKutusu(me, belowFree?'below':'above'));
            }
            const leftFree = sideFree(me,'left'), rightFree = sideFree(me,'right');
            if(leftFree || rightFree){
              yaziAlanlari.push(yaziKutusu(me, leftFree?'left':'right'));
              // Sol/sağa yazılan yükseklik etiketi de panel etiketleri gibi 90° döndürülür —
              // ortalanmış (center/middle) çapa, sideFree'nin V_LBL_W/H tahminiyle tutarlıdır.
              const hTxt = hEtiket+' '+Math.round(me.hVal)+' mm';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.save();
              ctx.translate(leftFree ? me.sMinX-8 : me.sMaxX+8, midY);
              ctx.rotate(-Math.PI/2);
              ctx.fillText(hTxt, 0, 0);
              ctx.restore();
            }
          });
        }

        const allLabelObjs = [
          ...labelEntries.map(e=>e.obj),
          ...modNameGroups.flatMap(g=>g.map(e=>e.obj))
        ];
        // Satır stilleri — canlı DOM'daki `.label3d .l1/.l2/.l3` ile ELLE senkron tutulur
        // (CSS font-size'ın 2 katı; bu canvas 2× pikselde yakalanıyor).
        const satirStili = cls=>{
          const parts = (cls||'').split(' ');
          const base = parts[0], bos = parts.indexOf('bos')>=0;
          if(base==='modname') return {fs:26, ag:'700', renk:'#4fb8a8', golge:'rgba(0,0,0,0.5)'};
          const renk = bos ? '#ffffff' : '#000000';
          const golge = bos ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.85)';
          if(base==='l3') return {fs:22, ag:'600', renk, golge};
          if(base==='l2') return {fs:24, ag:'700', renk, golge};
          return {fs:26, ag:'700', renk, golge};
        };
        const blokOlc = (satirlar, sc)=>{
          let genis = 0;
          satirlar.forEach(l=>{
            const s = satirStili(l.cls);
            ctx.font = s.ag+' '+(s.fs*sc)+'px Inter, Arial, sans-serif';
            genis = Math.max(genis, ctx.measureText(l.text).width);
          });
          return {genis, boy: satirlar.length*24*sc};
        };
        const kutuOf = kose=>{
          let a=Infinity, b=-Infinity, c2=Infinity, d=-Infinity;
          kose.forEach(p=>{ const xy = ekranXY(p);
            if(xy[0]<a)a=xy[0]; if(xy[0]>b)b=xy[0]; if(xy[1]<c2)c2=xy[1]; if(xy[1]>d)d=xy[1]; });
          return {x0:a, x1:b, y0:c2, y1:d, kirpildi:false};
        };
        // Panelin GÖRÜNEN parçası: önde duran modüllerin kapattığı kısım kutudan çıkarılır,
        // kalan en büyük şerit alınır. Hiç yer kalmazsa etiket çizilmez; kısmen kalıyorsa
        // etiket o şeridin ortasına kayar ve boyunu ona göre alır. Kutu kırpılmadıysa
        // (panel tümüyle görünüyorsa) hiçbir şey değişmez — çıktı eskisiyle birebir aynı.
        const gorunenKutu = (obj, kutu)=>{
          if(!sabitCephe || obj.userData.mi===undefined) return kutu;
          const z = gorusZ(obj.position);
          let k = kutu;
          modKutu.forEach(o=>{
            if(o.mi===obj.userData.mi || !(o.yakin > z+1)) return;
            if(o.mxX<=k.x0 || o.mnX>=k.x1 || o.mxY<=k.y0 || o.mnY>=k.y1) return;   // çakışma yok
            const serit = [
              {x0:k.x0, x1:Math.min(k.x1,o.mnX), y0:k.y0, y1:k.y1},
              {x0:Math.max(k.x0,o.mxX), x1:k.x1, y0:k.y0, y1:k.y1},
              {x0:k.x0, x1:k.x1, y0:k.y0, y1:Math.min(k.y1,o.mnY)},
              {x0:k.x0, x1:k.x1, y0:Math.max(k.y0,o.mxY), y1:k.y1}
            ];
            let enIyi = serit[0], enIyiAlan = -1;
            serit.forEach(s=>{
              const alan = Math.max(s.x1-s.x0,0)*Math.max(s.y1-s.y0,0);
              if(alan>enIyiAlan){ enIyiAlan = alan; enIyi = s; }
            });
            k = {x0:enIyi.x0, x1:enIyi.x1, y0:enIyi.y0, y1:enIyi.y1, kirpildi:true};
          });
          return k;
        };
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        allLabelObjs.forEach(obj=>{
          if(!obj.visible) return;
          const ndc = obj.position.clone().project(camera);
          if(ndc.z<-1 || ndc.z>1) return;
          const sx = (ndc.x*0.5+0.5)*w*2, sy = (-ndc.y*0.5+0.5)*h*2;
          let satirlar = (obj.userData.lines||[]).slice();
          if(!satirlar.length) return;
          const modAdi = (satirlar[0].cls||'').split(' ')[0]==='modname';
          // Panelin ekran kutusu (dört köşesi buildModule'de dünya koordinatı olarak saklandı)
          const kose = obj.userData.kose;
          let cx = sx, cy = sy, pw = 0, ph = 0;
          if(kose && kose.length===4){
            const g = gorunenKutu(obj, kutuOf(kose));
            pw = g.x1-g.x0; ph = g.y1-g.y0;
            if(pw < 14 || ph < 14) return;         // arkada kaldı — hiç yazma
            if(g.kirpildi){ cx = (g.x0+g.x1)/2; cy = (g.y0+g.y1)/2; }
          } else if(onuKapali(obj, sx, sy)) return;   // kutusuz etiket (modül adı, KAPAKSIZ)
          // YÖN VE BOY. Önce MEVCUT davranış denenir (90° döndürülmüş, tam boy): sığıyorsa
          // etiket eskisiyle BİREBİR aynı çizilir — sığan yüzler (ÖN/ARKA/ÜST/ALT) değişmez.
          // Sığmıyorsa yatay denenir; o da sığmazsa küçültülür; hâlâ sığmıyorsa alttan satır
          // atılır. Öncelik 2B yüz çizimindekiyle aynı: kod > tip > ölçü.
          // Kusur buydu: geniş-alçak kapakta (damper 1250×450, boğaz 1250×230) döndürülmüş
          // yazı panelin dışına taşıp komşu kapağın etiketine biniyordu.
          let yatay = false, sc = 1;
          if(!modAdi && pw>2 && ph>2){
            for(;;){
              const m = blokOlc(satirlar, 1);
              const dikS = Math.min(1, (ph*0.94)/Math.max(m.genis,1), (pw*0.94)/Math.max(m.boy,1));
              const yatS = Math.min(1, (pw*0.94)/Math.max(m.genis,1), (ph*0.94)/Math.max(m.boy,1));
              const enIyi = Math.max(dikS, yatS);
              if(enIyi >= 0.55 || satirlar.length===1){
                yatay = yatS > dikS;
                sc = Math.max(enIyi, 0.42);
                break;
              }
              satirlar = satirlar.slice(0, -1);
            }
          }
          if(modAdi) yatay = true;
          const satirH = 24*sc;
          // modname yatay kalır ve dikeyde y ile alt alta dizilir; döndürülmüş panel etiketleri
          // x boyunca yan yana &quot;şeritler&quot; hâlinde dizilir — aksi halde döndürülmüş satırlar
          // birbirinin üzerine gelirdi (dikeydeki aralık, döndürülmüş metnin boyuna yetmez).
          let y = cy - (satirlar.length-1)*satirH/2;
          let x = cx - (satirlar.length-1)*satirH/2;
          satirlar.forEach(l=>{
            const s = satirStili(l.cls);
            ctx.font = s.ag+' '+(s.fs*sc)+'px Inter, Arial, sans-serif';
            ctx.fillStyle = s.renk;
            ctx.shadowColor = s.golge;
            ctx.shadowBlur = 3;
            if(yatay){
              ctx.fillText(l.text, cx, y);
              y += satirH;
            } else {
              ctx.save();
              ctx.translate(x, cy);
              ctx.rotate(-Math.PI/2);
              ctx.fillText(l.text, 0, 0);
              ctx.restore();
              x += satirH;
            }
          });
        });
        const dataURL = outCanvas.toDataURL('image/png');

        renderer.setPixelRatio(prevPR);
        camera.up.copy(savedUp);
        camera.position.copy(savedPos);
        controls.target.copy(savedTarget);
        camera.zoom = savedZoom;
        camera.left=savedCamL; camera.right=savedCamR; camera.top=savedCamT; camera.bottom=savedCamB;
        camera.updateProjectionMatrix();
        controls.update();
        resize();

        resolve(dataURL);
      }catch(err){ reject(err); }
    });
  };

  // ---------- Dışarıya (klasik script'e) bağlan ----------
  window.render3D = function(){ rebuildScene(); };

  resize();
  rebuildScene();
}

boot();
</script>

      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 24px 20px;

      max-height: 90vh;
      display: flex; flex-direction: column;

    .nest-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }

      transition: all 0.15s;

      padding: 12px 14px; margin-bottom: 14px;

<script>
// =====================================================================
// DXF WRITER
// =====================================================================

class DxfWriter {
  constructor() {
    this.entities = [];
    this.handle = 100;
  }

  _nextHandle() {
    return (this.handle++).toString(16).toUpperCase();
  }

  /** Cizgi ekle */
  addLine(x1, y1, x2, y2, layer) {
    if (layer === undefined) layer = '0';
    this.entities.push({ type: 'LINE', x1: x1, y1: y1, x2: x2, y2: y2, layer: layer });
  }

  /** Daire ekle */
  addCircle(cx, cy, r, layer) {
    if (layer === undefined) layer = '0';
    this.entities.push({ type: 'CIRCLE', cx: cx, cy: cy, r: r, layer: layer });
  }

  /** Ark ekle (acilar derece cinsinden) */
  addArc(cx, cy, r, startAngle, endAngle, layer) {
    if (layer === undefined) layer = '0';
    this.entities.push({ type: 'ARC', cx: cx, cy: cy, r: r, startAngle: startAngle, endAngle: endAngle, layer: layer });
  }

  /** Text ekle. (x,y) konumu hAlign/vAlign'a gore yorumlanir:
   *    hAlign: 0=Left (varsayilan), 1=Center, 2=Right
   *    vAlign: 0=Baseline (varsayilan), 1=Bottom, 2=Middle, 3=Top
   *  hAlign>0 veya vAlign>0 ise (x,y) DXF code 11 (alignment point) olur. */
  addText(x, y, height, text, layer, rotation, hAlign, vAlign) {
    if (layer === undefined) layer = '0';
    if (rotation === undefined) rotation = 0;
    if (hAlign === undefined) hAlign = 0;
    if (vAlign === undefined) vAlign = 0;
    this.entities.push({
      type: 'TEXT', x: x, y: y, height: height, text: text,
      layer: layer, rotation: rotation, hAlign: hAlign, vAlign: vAlign
    });
  }

  /** Spline ekle (control points + knots) */
  addSpline(controlPoints, knots, degree, flags, layer) {
    if (degree === undefined) degree = 3;
    if (flags === undefined) flags = 8;
    if (layer === undefined) layer = '0';
    this.entities.push({ type: 'SPLINE', controlPoints: controlPoints, knots: knots, degree: degree, flags: flags, layer: layer });
  }

  /** DXF string uret - DXF R12 (AC1009) formati, tum AutoCAD surumlerinde acilir */
  generate() {
    var dxf = '';

    // ======== HEADER ========
    dxf += '0\nSECTION\n2\nHEADER\n';
    dxf += '9\n$ACADVER\n1\nAC1009\n';
    dxf += '9\n$INSUNITS\n70\n4\n';
    dxf += '9\n$EXTMIN\n10\n-1000.0\n20\n-100000.0\n30\n0.0\n';
    dxf += '9\n$EXTMAX\n10\n100000.0\n20\n100000.0\n30\n0.0\n';
    dxf += '0\nENDSEC\n';

    // ======== TABLES ========
    dxf += '0\nSECTION\n2\nTABLES\n';

    // VPORT
    dxf += '0\nTABLE\n2\nVPORT\n70\n1\n';
    dxf += '0\nVPORT\n2\n*ACTIVE\n70\n0\n';
    dxf += '10\n0.0\n20\n0.0\n11\n1.0\n21\n1.0\n';
    dxf += '12\n0.0\n22\n0.0\n13\n0.0\n23\n0.0\n14\n1.0\n24\n1.0\n';
    dxf += '15\n0.0\n25\n0.0\n16\n0.0\n26\n0.0\n36\n1.0\n';
    dxf += '17\n0.0\n27\n0.0\n37\n0.0\n40\n1000.0\n41\n1.5\n42\n50.0\n43\n0.0\n44\n0.0\n';
    dxf += '50\n0.0\n51\n0.0\n71\n0\n72\n100\n73\n1\n74\n3\n75\n0\n76\n0\n77\n0\n78\n0\n';
    dxf += '0\nENDTAB\n';

    // LTYPE
    dxf += '0\nTABLE\n2\nLTYPE\n70\n1\n';
    dxf += '0\nLTYPE\n2\nCONTINUOUS\n70\n0\n3\nSolid line\n72\n65\n73\n0\n40\n0.0\n';
    dxf += '0\nENDTAB\n';

    // LAYER
    var layers = ['0'];
    var layerSet = {};
    layerSet['0'] = true;
    for (var i = 0; i < this.entities.length; i++) {
      var ln = this.entities[i].layer;
      if (!layerSet[ln]) {
        layerSet[ln] = true;
        layers.push(ln);
      }
    }

    // Katman rengi: varsayılan 7 (beyaz/siyah) — sadece büyük marka etiketi katmanı
    // (KOD_BUYUK, tüm DXF çıktılarında ortak) mavi (ACI 5) alır. Diğer TÜM mevcut katmanlar birebir aynı kalır.
    var LAYER_COLOR = { KOD_BUYUK: 5 };
    dxf += '0\nTABLE\n2\nLAYER\n70\n' + layers.length + '\n';
    for (var li = 0; li < layers.length; li++) {
      var lclr = LAYER_COLOR[layers[li]] || 7;
      dxf += '0\nLAYER\n2\n' + layers[li] + '\n70\n0\n62\n' + lclr + '\n6\nCONTINUOUS\n';
    }
    dxf += '0\nENDTAB\n';

    // STYLE
    dxf += '0\nTABLE\n2\nSTYLE\n70\n1\n';
    dxf += '0\nSTYLE\n2\nSTANDARD\n70\n0\n40\n0.0\n41\n1.0\n50\n0.0\n71\n0\n42\n3.5\n3\ntxt\n4\n\n';
    dxf += '0\nENDTAB\n';

    dxf += '0\nENDSEC\n';

    // ======== BLOCKS (bos ama zorunlu) ========
    dxf += '0\nSECTION\n2\nBLOCKS\n';
    dxf += '0\nENDSEC\n';

    // ======== ENTITIES ========
    dxf += '0\nSECTION\n2\nENTITIES\n';

    for (var i = 0; i < this.entities.length; i++) {
      var e = this.entities[i];
      switch (e.type) {
        case 'LINE':
          dxf += '0\nLINE\n8\n' + e.layer + '\n';
          dxf += '10\n' + e.x1 + '\n20\n' + e.y1 + '\n30\n0.0\n';
          dxf += '11\n' + e.x2 + '\n21\n' + e.y2 + '\n31\n0.0\n';
          break;

        case 'CIRCLE':
          dxf += '0\nCIRCLE\n8\n' + e.layer + '\n';
          dxf += '10\n' + e.cx + '\n20\n' + e.cy + '\n30\n0.0\n';
          dxf += '40\n' + e.r + '\n';
          break;

        case 'ARC':
          dxf += '0\nARC\n8\n' + e.layer + '\n';
          dxf += '10\n' + e.cx + '\n20\n' + e.cy + '\n30\n0.0\n';
          dxf += '40\n' + e.r + '\n';
          dxf += '50\n' + e.startAngle + '\n51\n' + e.endAngle + '\n';
          break;

        case 'TEXT':
          dxf += '0\nTEXT\n8\n' + e.layer + '\n';
          dxf += '10\n' + e.x + '\n20\n' + e.y + '\n30\n0.0\n';
          dxf += '40\n' + e.height + '\n';
          dxf += '1\n' + e.text + '\n';
          if (e.rotation) dxf += '50\n' + e.rotation + '\n';
          // Sag-/orta-/sol- ve baseline/bottom/middle/top hizalama (DXF 72/73 + 11).
          // hAlign>0 veya vAlign>0 ise alignment point (DXF 11) eklenir; aksi
          // halde TEXT default Left/Baseline yorumlanir (eski davranis korunur).
          if (e.hAlign || e.vAlign) {
            if (e.hAlign) dxf += '72\n' + e.hAlign + '\n';
            dxf += '11\n' + e.x + '\n21\n' + e.y + '\n31\n0.0\n';
            if (e.vAlign) dxf += '73\n' + e.vAlign + '\n';
          }
          break;

        case 'SPLINE':
          // R12 SPLINE yok - POLYLINE ile yaklasik cizim
          var pts = this._evalSpline(e.controlPoints, e.knots, e.degree, 200);
          dxf += '0\nPOLYLINE\n8\n' + e.layer + '\n66\n1\n70\n0\n';
          for (var si = 0; si < pts.length; si++) {
            dxf += '0\nVERTEX\n8\n' + e.layer + '\n';
            dxf += '10\n' + pts[si][0] + '\n20\n' + pts[si][1] + '\n30\n0.0\n';
          }
          dxf += '0\nSEQEND\n8\n' + e.layer + '\n';
          break;
      }
    }

    dxf += '0\nENDSEC\n';
    dxf += '0\nEOF\n';

    return dxf;
  }

  /** B-spline noktalarini hesapla (De Boor algoritmasi) */
  _evalSpline(ctrlPts, knots, degree, numPts) {
    var points = [];
    if (!ctrlPts || ctrlPts.length < 2) return points;

    var n = ctrlPts.length - 1;
    var p = degree;

    // Parametre araligi
    var tMin = knots[p];
    var tMax = knots[n + 1];

    for (var i = 0; i <= numPts; i++) {
      var t = tMin + (tMax - tMin) * i / numPts;
      if (t >= tMax) t = tMax - 1e-10;

      // Knot span bul
      var span = p;
      for (var j = p; j <= n; j++) {
        if (t >= knots[j] && t < knots[j + 1]) { span = j; break; }
      }

      // De Boor
      var d = [];
      for (var j = 0; j <= p; j++) {
        var idx = span - p + j;
        if (idx >= 0 && idx <= n) {
          d.push([ctrlPts[idx][0], ctrlPts[idx][1]]);
        } else {
          d.push([0, 0]);
        }
      }

      for (var r = 1; r <= p; r++) {
        for (var j = p; j >= r; j--) {
          var left = span - p + j;
          var kl = knots[left];
          var kr = knots[left + p - r + 1];
          var denom = kr - kl;
          var alpha = (denom > 1e-14) ? (t - kl) / denom : 0.0;
          d[j] = [
            (1 - alpha) * d[j - 1][0] + alpha * d[j][0],
            (1 - alpha) * d[j - 1][1] + alpha * d[j][1]
          ];
        }
      }
      points.push([d[p][0], d[p][1]]);
    }
    return points;
  }
}


// =====================================================================
// 50'lik PANEL CIZIM MOTORU
// =====================================================================

// Percin hesaplama: ceil(span / maxSp) esit aralikli daire
// vidaPos: paralel siradaki vida konumlari (yatay sira icin X, dikey sutun icin Y).
//          Percin bu listedeki bir konumla ortusurse 13mm kaydirilir.
function addPercin(dxf, ox, oy, x1, y1, x2, y2, r, dir, maxSp, layer, vidaPos) {
  var span = dir === 'V' ? Math.abs(y2 - y1) : Math.abs(x2 - x1);
  var n = Math.ceil(span / maxSp);
  vidaPos = vidaPos || [];
  // Herhangi bir percin vida ile cakisiyorsa n'i artir (max 20 deneme)
  for (var iter = 0; iter < 20; iter++) {
    var sp = span / n;
    var base = (dir === 'V' ? Math.min(y1, y2) : Math.min(x1, x2));
    var conflict = false;
    for (var i = 1; i < n; i++) {
      var pos = base + i * sp;
      for (var j = 0; j < vidaPos.length; j++) {
        if (Math.abs(pos - vidaPos[j]) < 1) { conflict = true; break; }
      }
      if (conflict) break;
    }
    if (!conflict) break;
    n++;
  }
  var sp = span / n;
  var base = (dir === 'V' ? Math.min(y1, y2) : Math.min(x1, x2));
  for (var i = 1; i < n; i++) {
    var pos = base + i * sp;
    if (dir === 'V') {
      dxf.addCircle(ox + x1, oy + pos, r, layer);
    } else {
      dxf.addCircle(ox + pos, oy + y1, r, layer);
    }
  }
  return n; // cagiran, ayni sayiyi es (ic/dis) kapaga da uygulayabilsin diye
}

// addPercin ile AYNI kenara, ama vida cakisma kontrolu yapmadan, DISARIDAN VERILEN n
// sayisinda percin dagitir. Dis kapakta vida cakismasi nedeniyle n artmissa, ic kapak
// bunu (kendi vida deligi olmasa bile) AYNEN miras alsin diye kullanilir.
function addPercinN(dxf, ox, oy, x1, y1, x2, y2, r, dir, n, layer) {
  var span = dir === 'V' ? Math.abs(y2 - y1) : Math.abs(x2 - x1);
  var sp = span / n;
  var base = (dir === 'V' ? Math.min(y1, y2) : Math.min(x1, x2));
  for (var i = 1; i < n; i++) {
    var pos = base + i * sp;
    if (dir === 'V') {
      dxf.addCircle(ox + x1, oy + pos, r, layer);
    } else {
      dxf.addCircle(ox + pos, oy + y1, r, layer);
    }
  }
}

// Vida kurali: 800-1600 arasi 1 orta, 1600+ ise 2 tane (1/3 ve 2/3)
function addVida(dxf, ox, oy, dir, x1, y1, x2, y2, dimVal, r, layer) {
  if (dimVal >= 800 && dimVal < 1600) {
    if (dir === 'H') {
      dxf.addCircle(ox + (x1 + x2) / 2, oy + y1, r, layer);
    } else {
      dxf.addCircle(ox + x1, oy + (y1 + y2) / 2, r, layer);
    }
  } else if (dimVal >= 1600) {
    var sp = dir === 'H' ? Math.abs(x2 - x1) : Math.abs(y2 - y1);
    if (dir === 'H') {
      dxf.addCircle(ox + x1 + sp / 3, oy + y1, r, layer);
      dxf.addCircle(ox + x1 + sp * 2 / 3, oy + y1, r, layer);
    } else {
      dxf.addCircle(ox + x1, oy + y1 + sp / 3, r, layer);
      dxf.addCircle(ox + x1, oy + y1 + sp * 2 / 3, r, layer);
    }
  }
}


// -------------------------------------------------------
// DIS SABIT PANEL (50'lik)
// W = B+98, H = K+98
// -------------------------------------------------------
function drawDisSabit(dxf, ox, oy, B, K, kod) {
  var W = B + 98, H = K + 98;
  var R_P = 2.3, R_V = 8.1;

  // Bukum cizgileri
  var lb = 'DP_BUKUM';
  // Alt-Sol
  dxf.addLine(ox + 0, oy + 69, ox + 20, oy + 49, lb);
  dxf.addLine(ox + 20, oy + 49, ox + 49, oy + 49, lb);
  dxf.addLine(ox + 49, oy + 49, ox + 49, oy + 20, lb);
  dxf.addLine(ox + 49, oy + 20, ox + 69, oy + 0, lb);
  // Ust-Sol
  dxf.addLine(ox + 0, oy + H - 69, ox + 20, oy + H - 49, lb);
  dxf.addLine(ox + 20, oy + H - 49, ox + 49, oy + H - 49, lb);
  dxf.addLine(ox + 49, oy + H - 49, ox + 49, oy + H - 20, lb);
  dxf.addLine(ox + 49, oy + H - 20, ox + 69, oy + H, lb);
  // Alt-Sag
  dxf.addLine(ox + W - 69, oy + 0, ox + W - 49, oy + 20, lb);
  dxf.addLine(ox + W - 49, oy + 20, ox + W - 49, oy + 49, lb);
  dxf.addLine(ox + W - 49, oy + 49, ox + W - 20, oy + 49, lb);
  dxf.addLine(ox + W - 20, oy + 49, ox + W, oy + 69, lb);
  // Ust-Sag
  dxf.addLine(ox + W, oy + H - 69, ox + W - 20, oy + H - 49, lb);
  dxf.addLine(ox + W - 20, oy + H - 49, ox + W - 49, oy + H - 49, lb);
  dxf.addLine(ox + W - 49, oy + H - 49, ox + W - 49, oy + H - 20, lb);
  dxf.addLine(ox + W - 49, oy + H - 20, ox + W - 69, oy + H, lb);

  // Yesil kenarlar (B-40)
  var ly = 'DP_YESIL';
  dxf.addLine(ox + 69, oy + 0, ox + W - 69, oy + 0, ly);
  dxf.addLine(ox + 69, oy + H, ox + W - 69, oy + H, ly);

  // Turkuaz kenarlar (K-40)
  var lt = 'DP_TURKUAZ';
  dxf.addLine(ox + 0, oy + 69, ox + 0, oy + H - 69, lt);
  dxf.addLine(ox + W, oy + 69, ox + W, oy + H - 69, lt);

  // Sabit percin O4.2
  var lsp = 'DP_SABIT_PERCIN';
  dxf.addCircle(ox + 10.8, oy + 89.5, R_P, lsp);
  dxf.addCircle(ox + 10.8, oy + H - 89.5, R_P, lsp);
  dxf.addCircle(ox + 89.5, oy + 10.8, R_P, lsp);
  dxf.addCircle(ox + 89.5, oy + H - 10.8, R_P, lsp);
  dxf.addCircle(ox + W - 89.5, oy + 10.8, R_P, lsp);
  dxf.addCircle(ox + W - 89.5, oy + H - 10.8, R_P, lsp);
  dxf.addCircle(ox + W - 10.8, oy + 89.5, R_P, lsp);
  dxf.addCircle(ox + W - 10.8, oy + H - 89.5, R_P, lsp);

  // Sabit vida O16.2
  var lsv = 'DP_SABIT_VIDA';
  dxf.addCircle(ox + 64, oy + 109, R_V, lsv);
  dxf.addCircle(ox + 64, oy + H - 109, R_V, lsv);
  dxf.addCircle(ox + 109, oy + 64, R_V, lsv);
  dxf.addCircle(ox + 109, oy + H - 64, R_V, lsv);
  dxf.addCircle(ox + W - 109, oy + 64, R_V, lsv);
  dxf.addCircle(ox + W - 109, oy + H - 64, R_V, lsv);
  dxf.addCircle(ox + W - 64, oy + 109, R_V, lsv);
  dxf.addCircle(ox + W - 64, oy + H - 109, R_V, lsv);

  // Vida konumlari (vidayla ayni hizaya gelen percin 13mm kayar; hiza tol. 1mm)
  var vidaXs = [109, W - 109];
  if (B >= 800 && B < 1600) vidaXs.push(W / 2);
  else if (B >= 1600) {
    vidaXs.push(109 + (W - 218) / 3);
    vidaXs.push(109 + 2 * (W - 218) / 3);
  }
  var vidaYs = [109, H - 109];
  if (K >= 800 && K < 1600) vidaYs.push(H / 2);
  else if (K >= 1600) {
    vidaYs.push(109 + (H - 218) / 3);
    vidaYs.push(109 + 2 * (H - 218) / 3);
  }

  // Degisken percin max 390mm
  var lp = 'DP_PERCIN';
  var nLeft = addPercin(dxf, ox, oy, 10.8, 89.5, 10.8, H - 89.5, R_P, 'V', 390, lp, vidaYs);
  var nRight = addPercin(dxf, ox, oy, W - 10.8, 89.5, W - 10.8, H - 89.5, R_P, 'V', 390, lp, vidaYs);
  var nBottom = addPercin(dxf, ox, oy, 89.5, 10.8, W - 89.5, 10.8, R_P, 'H', 390, lp, vidaXs);
  var nTop = addPercin(dxf, ox, oy, 89.5, H - 10.8, W - 89.5, H - 10.8, R_P, 'H', 390, lp, vidaXs);

  // Degisken vida 800/1600
  var lv = 'DP_VIDA';
  addVida(dxf, ox, oy, 'H', 109, 64, W - 109, 64, B, R_V, lv);
  addVida(dxf, ox, oy, 'H', 109, H - 64, W - 109, H - 64, B, R_V, lv);
  addVida(dxf, ox, oy, 'V', 64, 109, 64, H - 109, K, R_V, lv);
  addVida(dxf, ox, oy, 'V', W - 64, 109, W - 64, H - 109, K, R_V, lv);

  // Vida cakismasi nedeniyle artan percin sayisi ic kapaga da aktarilsin diye dondurulur
  return { left: nLeft, right: nRight, bottom: nBottom, top: nTop };
}
