// ---------- SVG ----------
// Kod/tür/ölçü etiketlerini panel genişliğine göre büyük-ama-taşırmayan boyuta sığdırır;
// en küçük okunur boyutta (minSize) bile sığmıyorsa üç noktayla kısaltır. Canlı görünüm ve
// Excel çıktısı aynı drawFaceSVG'yi kullandığından ikisinde de aynı sonucu verir.
let __measureCtx = null;
function fitLabelText(text, maxWidth, maxSize, minSize, weight){
  if(!__measureCtx) __measureCtx = document.createElement('canvas').getContext('2d');
  // body{font-family} ile birebir aynı olmak zorunda — ayrışırsa etiketler taşar veya boşuna kısalır.
  const fam = &quot;'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif&quot;;
  let size = maxSize;
  __measureCtx.font = `${weight} ${size}px ${fam}`;
  while(size > minSize && __measureCtx.measureText(text).width > maxWidth){
    size -= 0.5;
    __measureCtx.font = `${weight} ${size}px ${fam}`;
  }
  let out = text;
  if(__measureCtx.measureText(out).width > maxWidth){
    while(out.length > 1 && __measureCtx.measureText(out+'…').width > maxWidth) out = out.slice(0,-1);
    if(out.length < text.length) out += '…';
  }
  return {text: out, size};
}
function drawFaceSVG(fi){
  const r = computeFace(fi);
  const face = faceOf(fi);
  const V = r.V;
  const orient = r.orient;
  const kodMap = excelKodModu ? buildActiveAhuKodMap() : null;
  const mi = state.active;

  const SVG_W = 880, SVG_H = 480, PAD = 46;
  const hasDims = r.faceW>0 && r.faceH>0;
  const modelW = hasDims ? r.faceW : 1400;
  const modelH = hasDims ? r.faceH : 1200;
  const reserveX = orient === 'H' ? 30 : 0;
  const reserveY = orient === 'V' ? 30 : 0;
  const scale = Math.min((SVG_W-2*PAD-reserveX)/modelW, (SVG_H-2*PAD-reserveY)/modelH);
  const fw = modelW*scale, fh = modelH*scale;
  const ox = PAD, oy = PAD;
  const kenarPx = Math.max(V.kenar*scale, 4);
  const takviyePx = Math.max(V.takviye*scale, 4);

  let svg = `<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;${SVG_W}&quot; height=&quot;${SVG_H}&quot; viewBox=&quot;0 0 ${SVG_W} ${SVG_H}&quot;>`;
  svg += `<rect x=&quot;${ox}&quot; y=&quot;${oy}&quot; width=&quot;${fw}&quot; height=&quot;${fh}&quot; fill=&quot;#eef1f4&quot; stroke=&quot;#3a4d5c&quot; stroke-width=&quot;2&quot;/>`;
  svg += `<rect x=&quot;${ox}&quot; y=&quot;${oy}&quot; width=&quot;${fw}&quot; height=&quot;${kenarPx}&quot; fill=&quot;#22303d&quot;/>`;
  svg += `<rect x=&quot;${ox}&quot; y=&quot;${oy+fh-kenarPx}&quot; width=&quot;${fw}&quot; height=&quot;${kenarPx}&quot; fill=&quot;#22303d&quot;/>`;
  svg += `<rect x=&quot;${ox}&quot; y=&quot;${oy}&quot; width=&quot;${kenarPx}&quot; height=&quot;${fh}&quot; fill=&quot;#22303d&quot;/>`;
  svg += `<rect x=&quot;${ox+fw-kenarPx}&quot; y=&quot;${oy}&quot; width=&quot;${kenarPx}&quot; height=&quot;${fh}&quot; fill=&quot;#22303d&quot;/>`;
  // ARA KAT: kenar bandı dus/2 (modül duvarı) + p (ara kat profili) toplamıdır. Tek renk
  // çizilse kullanıcı hangisinin ne olduğunu göremez — iç p'lik şerit ayrı tonda çizilir.
  if(V.arakat && V.p>0){
    const pPx = Math.min(Math.max(V.p*scale, 2), kenarPx);
    const ix = ox+kenarPx-pPx, iy = oy+kenarPx-pPx;
    const iw = fw-2*(kenarPx-pPx), ih = fh-2*(kenarPx-pPx);
    svg += `<rect x=&quot;${ix}&quot; y=&quot;${iy}&quot; width=&quot;${iw}&quot; height=&quot;${pPx}&quot; fill=&quot;#4a6b57&quot;/>`;
    svg += `<rect x=&quot;${ix}&quot; y=&quot;${iy+ih-pPx}&quot; width=&quot;${iw}&quot; height=&quot;${pPx}&quot; fill=&quot;#4a6b57&quot;/>`;
    svg += `<rect x=&quot;${ix}&quot; y=&quot;${iy}&quot; width=&quot;${pPx}&quot; height=&quot;${ih}&quot; fill=&quot;#4a6b57&quot;/>`;
    svg += `<rect x=&quot;${ix+iw-pPx}&quot; y=&quot;${iy}&quot; width=&quot;${pPx}&quot; height=&quot;${ih}&quot; fill=&quot;#4a6b57&quot;/>`;
  }
  // Köşe plastikleri (4 adet) — yalnızca görsel; boy düşümleri hesapta zaten mevcut
  const kosePx = V.kose>0 ? Math.max(V.kose*scale, 6) : 0;
  const plastikPx = V.takviyePlastik>0 ? Math.max(V.takviyePlastik*scale, 2.5) : 0;
  const PL = '#10161d';
  // Her takviye kendi süreklilik durumuna göre renklenir: CONT_FILL = o noktada tek parça/sürekli,
  // SEG_FILL = o noktada kesik/segmentli (bar bazında r.bars'tan — Ayır/Birleştir ile ayarlanır)
  const CONT_FILL = '#547a96', SEG_FILL = '#3d5568';
  // Ctrl ile çoklu seçilen takviyeler vurgulanır — hangilerine toplu işlem uygulanacağı görünsün
  const NRM_STROKE = 'stroke=&quot;#4a5d6e&quot; stroke-width=&quot;0.8&quot;';
  const SEL_STROKE = 'stroke=&quot;#4fb8a8&quot; stroke-width=&quot;2.5&quot;';
  if(kosePx>0) [[ox,oy],[ox+fw-kosePx,oy],[ox,oy+fh-kosePx],[ox+fw-kosePx,oy+fh-kosePx]].forEach(cc=>{
    svg += `<rect x=&quot;${cc[0]}&quot; y=&quot;${cc[1]}&quot; width=&quot;${kosePx}&quot; height=&quot;${kosePx}&quot; fill=&quot;${PL}&quot; stroke=&quot;#55707f&quot; stroke-width=&quot;0.8&quot;/>`;
  });
  svg += `<text x=&quot;${ox+fw/2}&quot; y=&quot;${oy-14}&quot; fill=&quot;#33424e&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;>${r.def.wKey} = ${hasDims?r.faceW:'?'} mm</text>`;
  svg += `<text x=&quot;${ox-14}&quot; y=&quot;${oy+fh/2}&quot; fill=&quot;#33424e&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 ${ox-14} ${oy+fh/2})&quot;>${r.def.hKey} = ${hasDims?r.faceH:'?'} mm</text>`;

  if(face.kapaksiz){
    svg += `<text x=&quot;${ox+fw/2}&quot; y=&quot;${oy+fh/2}&quot; fill=&quot;#3d4d5a&quot; font-size=&quot;15&quot; text-anchor=&quot;middle&quot;>KAPAKSIZ YÜZ — DOLU PANEL</text>`;
    svg += `<text x=&quot;${SVG_W-PAD}&quot; y=&quot;${SVG_H-14}&quot; fill=&quot;#9aa8b2&quot; font-size=&quot;9.5&quot; text-anchor=&quot;end&quot; font-style=&quot;italic&quot;>Cenk Altınay</text></svg>`;
    return svg;
  }

  const innerX = ox+kenarPx, innerY = oy+kenarPx;
  const innerW = fw-2*kenarPx, innerH = fh-2*kenarPx;
  const alongStartPx = orient==='H' ? innerX : innerY;
  const acrossStartPx = orient==='H' ? innerY : innerX;
  const acrossLenPx = orient==='H' ? innerH : innerW;

  // Bölüm görsel ölçüleri: girilmişse mm oranlı, girilmemişse eşit paylaştır
  const icKullMm = Math.max(r.icKullAlong||0, 1);
  const colSizes = r.colResults.map(c=>c.colSize);
  const totalEntered = colSizes.reduce((a,b)=>a+(b>0?b:0),0);
  const zeroCount = colSizes.filter(v=>v<=0).length;
  const remainingMm = Math.max(icKullMm-totalEntered, 0);
  const placeholderMm = zeroCount>0 ? Math.max(remainingMm/zeroCount, icKullMm*0.10) : 0;

  // SATIR BAZLI YERLEŞİM (px) — computeFace'teki mm çözümüyle aynı fonksiyon; buradaki
  // fark yalnızca birimin piksel olması ve boş ölçüler için yer tutucu/min-piksel kullanılması.
  const colPxOf = ci=>{ const c = r.colResults[ci]; return Math.max((c.colSize>0?c.colSize:placeholderMm)*scale, 26); };
  const cellPxOf = (ci,pi)=>{
    const c = r.colResults[ci], p = c.panels[pi];
    const colMm = c.colSize>0 ? c.colSize : placeholderMm;
    return Math.max(((p.pColSize||0)>0 ? p.pColSize : colMm)*scale, 26);
  };
  const LP = resolveColumnLayout(r.colResults, face, r.bars.ana, cellPxOf, colPxOf, takviyePx);
  const startOf = (ci,pi)=> alongStartPx + LP.start[ci][pi];
  const junctionPx = (ci,seg)=> alongStartPx + LP.junctionX[ci][Math.min(seg, LP.junctionX[ci].length-1)];
  const endPx = alongStartPx + LP.endMax;
  // Ara takviye kaplaması — computeFace'teki araSpanOf ile BİREBİR aynı kural
  const araSpanPx = m=>{
    const cRes = r.colResults[m.ci];
    const a = m.gi, b2 = Math.min(m.gi+1, cRes.panels.length-1);
    return {left:  Math.max(startOf(m.ci,a), startOf(m.ci,b2)),
            right: alongStartPx + Math.max(LP.rightAt(m.ci,a), LP.rightAt(m.ci,b2))};
  };

  const innerBars = [], colBars = []; // ayrılmış/birleşik barlar kesişimde üstte çizilsin diye tamponlanır
  const gapAcrossPx = face.columns.map(()=>({})); // açık her ara takviyenin piksel across-konumu, [ci][gi]

  r.colResults.forEach((cRes, ci)=>{
    const col = face.columns[ci];
    const colMm = cRes.colSize>0 ? cRes.colSize : placeholderMm;
    const colPx = colPxOf(ci);

    // Kademeli (zigzag) bölümde her panel kendi satırının along-başlangıcını alır.
    const colStartPx = alongStartPx + Math.min(...LP.start[ci]);
    const alongOf = pi => startOf(ci, pi);

    // Bölüm içi paneller (dik eksende)
    const icColMm = Math.max(cRes.icColAcross, 1);
    const pEntered = cRes.panels.map(p=>p.auto ? cRes.icColAcross : p.entered);
    const pTotal = pEntered.reduce((a,b)=>a+(b>0?b:0),0);
    const pZero = pEntered.filter(v=>v<=0).length;
    const pRemaining = Math.max(icColMm-pTotal, 0);
    const pPlaceholder = pZero>0 ? Math.max(pRemaining/pZero, icColMm*0.12) : 0;

    let pCursor = acrossStartPx;
    cRes.panels.forEach((p, pi)=>{
      const pMm = pEntered[pi]>0 ? pEntered[pi] : pPlaceholder;
      const pPx = Math.max(pMm*scale, 20);
      // Per-panel along-axis boyutu
      const pColMm = (p.pColSize||0) > 0 ? p.pColSize : colMm;
      const pColPx = Math.max(pColMm*scale, 26);
      const color = TYPE_COLORS[p.type] || &quot;#34495e&quot;;
      const isSel = face.selectedCells.some(s=>s.col===ci && s.idx===pi);
      const dash = p.bos ? 'stroke-dasharray=&quot;7,5&quot; fill-opacity=&quot;0.35&quot;'
                 : ((p.entered<=0 && !p.auto) ? 'stroke-dasharray=&quot;5,4&quot; fill-opacity=&quot;0.4&quot;' : '');

      const alongPx = alongOf(pi);
      let px, py, pw, ph;
      if(orient==='H'){ px=alongPx; py=pCursor; pw=pColPx; ph=pPx; }
      else            { px=pCursor; py=alongPx; pw=pPx; ph=pColPx; }

      // Birleştirilmiş kapağın kapladığı hücre: yer tutar (bant yüksekliği, bölüm genişliği)
      // ama ÇİZİLMEZ — soldaki yayılan kapağın tek geniş dikdörtgeni onun üzerini de kaplar.
      if(!p.covered){
      svg += `<g class=&quot;svg-panel&quot; data-face=&quot;${fi}&quot; data-col=&quot;${ci}&quot; data-panel=&quot;${pi}&quot;>`;
      svg += `<rect class=&quot;panel-rect${isSel?' selected':''}&quot; x=&quot;${px}&quot; y=&quot;${py}&quot; width=&quot;${pw}&quot; height=&quot;${ph}&quot; fill=&quot;${color}&quot; stroke=&quot;#4a5d6e&quot; stroke-width=&quot;1.5&quot; ${dash}/>`;
      // PANELE MONTE AĞIZ (Cenk, 29.08.2026): boğaz panelin ÜZERİNE monte edilir; panelin
      // İÇ ve DIŞ sacına aynı ölçüde delik açılır. Delik panelin SOL-ALT köşesine göre
      // mm cinsindedir (DXF yönü) ve KESİM dikdörtgenine göredir — ekranda açıklık
      // çizildiği için tolerans/2 kadar geri eklenir.
      if(p.delik){
        const dxm = p.delik.x + (Number(V.tolW)||0)/2, dym = p.delik.y + (Number(V.tolH)||0)/2;
        const dwp = (orient==='H' ? p.delik.w : p.delik.h)*scale;
        const dhp = (orient==='H' ? p.delik.h : p.delik.w)*scale;
        const dxp = px + (orient==='H' ? dxm : dym)*scale;
        const dyp = py + ph - (orient==='H' ? dym + p.delik.h : dxm + p.delik.w)*scale;
        svg += `<rect x=&quot;${dxp.toFixed(1)}&quot; y=&quot;${dyp.toFixed(1)}&quot; width=&quot;${Math.max(dwp,2).toFixed(1)}&quot; height=&quot;${Math.max(dhp,2).toFixed(1)}&quot; fill=&quot;#e2bfa1&quot; fill-opacity=&quot;0.6&quot; stroke=&quot;#8a5a2b&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;7,4&quot;/>`;
        if(dwp > 62 && dhp > 24){
          const dl = fitLabelText(p.delik.tip+' '+Math.round(p.delik.w)+'×'+Math.round(p.delik.h), dwp-8, 11, 8, 700);
          svg += `<text x=&quot;${(dxp+dwp/2).toFixed(1)}&quot; y=&quot;${(dyp+dhp/2).toFixed(1)}&quot; fill=&quot;#3a2a14&quot; font-size=&quot;${dl.size}&quot; font-weight=&quot;700&quot; text-anchor=&quot;middle&quot; dominant-baseline=&quot;middle&quot;>${dl.text}</text>`;
        }
      }
      if(p.type==='Camlı Açılır'){
        const gr = Math.max(Math.min(GLASS_R_MM*scale, Math.min(pw,ph)*0.42), 4);
        svg += `<circle cx=&quot;${px+pw/2}&quot; cy=&quot;${py+ph/2}&quot; r=&quot;${gr.toFixed(1)}&quot; fill=&quot;rgba(150,215,235,0.62)&quot; stroke=&quot;#2f8fae&quot; stroke-width=&quot;2.4&quot;/><circle cx=&quot;${px+pw/2}&quot; cy=&quot;${py+ph/2}&quot; r=&quot;${(gr*0.55).toFixed(1)}&quot; fill=&quot;none&quot; stroke=&quot;#eaf7fb&quot; stroke-width=&quot;1&quot; stroke-opacity=&quot;0.8&quot;/>`;
      }
      if(p.acilir) svg += `<circle cx=&quot;${px+7}&quot; cy=&quot;${py+ph*0.3}&quot; r=&quot;2.5&quot; fill=&quot;#4fb8a8&quot;/><circle cx=&quot;${px+7}&quot; cy=&quot;${py+ph*0.7}&quot; r=&quot;2.5&quot; fill=&quot;#4fb8a8&quot;/><rect x=&quot;${(px+pw-15).toFixed(1)}&quot; y=&quot;${(py+ph/2-11).toFixed(1)}&quot; width=&quot;7&quot; height=&quot;22&quot; rx=&quot;3&quot; fill=&quot;#14212b&quot; stroke=&quot;#4fb8a8&quot; stroke-width=&quot;1.5&quot;/>`;
      if(p.eleman){
        if(p.type==='Damper'){
          // Jaluzi kanatlı damper (frontal) — metal kanat gövdesi + kırmızı conta şeridi.
          // KANATLAR ÇİZİM YÖNÜNÜ İZLER: yatayda yatay şeritler, 'dikey' seçilince 90°
          // dönüp dikey şeritler olur. Göz ölçüsü takas edilmediği için (yerleşim aynı
          // kalır) yönü ekranda belli eden tek şey bu görünüm ve tipin yanındaki ↕.
          svg += `<rect x=&quot;${px+3}&quot; y=&quot;${py+3}&quot; width=&quot;${pw-6}&quot; height=&quot;${ph-6}&quot; fill=&quot;none&quot; stroke=&quot;#9199a0&quot; stroke-width=&quot;1.4&quot;/>`;
          const dik = p.yon==='dikey';
          const dizBoy = dik ? pw : ph;          // kanatların DİZİLDİĞİ eksen
          const kanatBas = dik ? py+5 : px+5;    // kanadın diğer eksende başlangıcı
          const kanatBoy = dik ? ph-10 : pw-10;  // ve o eksendeki boyu
          const nSlat = Math.max(3, Math.min(7, Math.floor(dizBoy/24)));
          const bandH = (dizBoy-8)/nSlat;
          for(let li=0; li<nSlat; li++){
            const bo = (dik ? px : py) + 4 + bandH*li;
            const bh = Math.max(bandH-3, 4);
            const sealH = Math.max(bh*0.22, 2);
            // Conta, yatayda kanadın ALTINDA; 90° dönünce SAĞINDA kalır.
            svg += dik
              ? `<rect x=&quot;${bo.toFixed(1)}&quot; y=&quot;${kanatBas}&quot; width=&quot;${bh.toFixed(1)}&quot; height=&quot;${kanatBoy}&quot; fill=&quot;#aeb4ba&quot; stroke=&quot;#6b7178&quot; stroke-width=&quot;0.6&quot;/>`
                + `<rect x=&quot;${(bo+bh-sealH).toFixed(1)}&quot; y=&quot;${kanatBas}&quot; width=&quot;${sealH.toFixed(1)}&quot; height=&quot;${kanatBoy}&quot; fill=&quot;#c1272d&quot;/>`
              : `<rect x=&quot;${kanatBas}&quot; y=&quot;${bo.toFixed(1)}&quot; width=&quot;${kanatBoy}&quot; height=&quot;${bh.toFixed(1)}&quot; fill=&quot;#aeb4ba&quot; stroke=&quot;#6b7178&quot; stroke-width=&quot;0.6&quot;/>`
                + `<rect x=&quot;${kanatBas}&quot; y=&quot;${(bo+bh-sealH).toFixed(1)}&quot; width=&quot;${kanatBoy}&quot; height=&quot;${sealH.toFixed(1)}&quot; fill=&quot;#c1272d&quot;/>`;
          }
        } else if(p.type==='Tava'){
          // Tava (frontal) — düz panel görünümü, sadece küçük bir tahliye deliği
          const hr = Math.max(Math.min(pw,ph)*0.09, 4);
          svg += `<circle cx=&quot;${(px+pw/2).toFixed(1)}&quot; cy=&quot;${(py+ph*0.72).toFixed(1)}&quot; r=&quot;${hr.toFixed(1)}&quot; fill=&quot;#05080c&quot; stroke=&quot;#3a4750&quot; stroke-width=&quot;1&quot;/>`;
        } else {
          // Boğaz (frontal) — flanş çerçevesi + koyu kanal açıklığı
          svg += `<rect x=&quot;${px+4}&quot; y=&quot;${py+4}&quot; width=&quot;${pw-8}&quot; height=&quot;${ph-8}&quot; fill=&quot;none&quot; stroke=&quot;#7a6a4a&quot; stroke-width=&quot;1.4&quot;/>`;
          const iw=(pw-8)*0.68, ih=(ph-8)*0.68;
          svg += `<rect x=&quot;${(px+pw/2-iw/2).toFixed(1)}&quot; y=&quot;${(py+ph/2-ih/2).toFixed(1)}&quot; width=&quot;${iw.toFixed(1)}&quot; height=&quot;${ih.toFixed(1)}&quot; fill=&quot;#05080c&quot; stroke=&quot;#3a4750&quot; stroke-width=&quot;1&quot;/>`;
        }
        // +150 mm çıkıntı notu (Tava düz/çıkıntısız olduğundan hariç tutulur)
        if(p.type!=='Tava') svg += `<text x=&quot;${px+pw/2}&quot; y=&quot;${py+12}&quot; fill=&quot;#000000&quot; font-size=&quot;8.5&quot; text-anchor=&quot;middle&quot;>+${'150'} mm çıkıntı</text>`;
      }
      const cx=px+pw/2, cy=py+ph/2;
      const colDisp = (p.pColSize||0) > 0 ? Math.round(p.pColSize) : Math.round(pColMm);
      const effDisp = p.eff>0 ? Math.round(p.eff) : Math.round(pMm);
      const colIsAuto = !!p.colAuto || (p.pColSize||0) <= 0;
      const autoSfx = (colIsAuto || p.auto) ? ' (oto)' : '';
      // TAM BOĞAZ: gözün açıklığı büyük olsa da ekranda İMALAT ölçüsü yazar
      // (kesim listesiyle aynı sayı); açıklık düzenleyicinin bilgi satırında.
      const sizeTxt = p.elemanOlcu
        ? `${Math.round(p.elemanOlcu.w)}×${Math.round(p.elemanOlcu.h)}`
        : (orient==='H'
          ? `${colDisp}×${effDisp}${autoSfx}`
          : `${effDisp}×${colDisp}${autoSfx}`);
      const labelFill = p.bos ? '#ffffff' : '#000000';
      const kodTxt = (excelKodModu && !p.eleman) ? kodFor(kodMap, mi, fi, ci, pi) : `${faceCodeOf(fi)}-B${ci+1}K${pi+1}`;
      const padW = Math.max(pw-8, 10);
      // ph'ye göre kaç satır sığar (kod / tür / ölçü — bu sırayla öncelikli); her satırın
      // FONT BOYUTU ayrıca pw'ye göre fitLabelText ile küçültülür/kısaltılır, böylece yan
      // yana duran kapakların yazıları asla birbirine taşmaz.
      let lineCount = pw<18 ? 0 : ph>=46 ? 3 : ph>=30 ? 2 : ph>=18 ? 1 : 0;
      if(lineCount>0){
        const rows = [fitLabelText(kodTxt, padW, 13, 8, 700)];
        rows[0].weight = 700;
        // Çizim yönü dikey olan eleman tipin yanında ↕ ile işaretlenir — göz ölçüleri
        // yüzün kendi ekseninde kaldığı için işaret olmasa yerleşimden anlaşılmazdı.
        const tipTxt = p.type + (p.yon==='dikey' ? ' ↕' : '');
        if(lineCount>=2){ const t=fitLabelText(tipTxt, padW, 11, 8, 400); t.weight=400; rows.push(t); }
        if(lineCount>=3){ const t=fitLabelText(sizeTxt, padW, 12, 8, 700); t.weight=700; rows.push(t); }
        const lineGap = rows.length===3 ? 16 : rows.length===2 ? 13 : 0;
        const totalH = (rows.length-1)*lineGap;
        const clipId = `clip${fi}_${ci}_${pi}`;
        svg += `<clipPath id=&quot;${clipId}&quot;><rect x=&quot;${(px+1).toFixed(1)}&quot; y=&quot;${(py+1).toFixed(1)}&quot; width=&quot;${Math.max(pw-2,1).toFixed(1)}&quot; height=&quot;${Math.max(ph-2,1).toFixed(1)}&quot;/></clipPath>`;
        svg += `<g clip-path=&quot;url(#${clipId})&quot;>`;
        rows.forEach((row,ri)=>{
          const ly = cy - totalH/2 + ri*lineGap;
          svg += `<text x=&quot;${cx}&quot; y=&quot;${ly.toFixed(1)}&quot; fill=&quot;${labelFill}&quot; font-size=&quot;${row.size}&quot; font-weight=&quot;${row.weight}&quot; text-anchor=&quot;middle&quot; dominant-baseline=&quot;middle&quot;>${row.text}</text>`;
        });
        svg += `</g>`;
      }
      svg += `</g>`;
      } // if(!p.covered)

      pCursor += pPx;

      // Bölüm içi ara boşluk / ara takviye
      if(pi < cRes.panels.length-1){
        const on = col.innerGaps[pi];
        // Kademeli düzende üstteki ve alttaki kapak farklı genişlikte olabilir; ara takviye
        // EN DIŞ kenara kadar uzanır ki iki dikey takviye de üzerine otursun. Kademesiz
        // durumda iki kenar zaten aynı olduğundan bugünkü çizimle birebir aynı sonucu verir.
        const sp = araSpanPx({ci, gi:pi});
        const gapAlongStart = sp.left;
        const gapColPx = Math.max(sp.right - sp.left, 0);
        if(on){
          gapAcrossPx[ci][pi] = pCursor;
          // Zincir üyesi barlar tek parça olarak döngü sonrasında çizilir
          const inChain = r.bars.araChainIdx[ci][pi] !== undefined;
          if(!inChain){
            const araStroke = face.selectedBars.some(s=>s.kind==='ara' && s.ci===ci && s.gi===pi) ? SEL_STROKE : NRM_STROKE;
            if(orient==='H') innerBars.push(`<g class=&quot;svg-innergap&quot; data-face=&quot;${fi}&quot; data-col=&quot;${ci}&quot; data-gap=&quot;${pi}&quot;><rect x=&quot;${gapAlongStart}&quot; y=&quot;${pCursor}&quot; width=&quot;${gapColPx}&quot; height=&quot;${takviyePx}&quot; fill=&quot;${SEG_FILL}&quot; ${araStroke}/>${plastikPx>0?`<rect x=&quot;${gapAlongStart}&quot; y=&quot;${pCursor}&quot; width=&quot;${plastikPx}&quot; height=&quot;${takviyePx}&quot; fill=&quot;${PL}&quot;/><rect x=&quot;${gapAlongStart+gapColPx-plastikPx}&quot; y=&quot;${pCursor}&quot; width=&quot;${plastikPx}&quot; height=&quot;${takviyePx}&quot; fill=&quot;${PL}&quot;/>`:``}<rect x=&quot;${gapAlongStart}&quot; y=&quot;${pCursor-5}&quot; width=&quot;${gapColPx}&quot; height=&quot;${takviyePx+10}&quot; fill=&quot;transparent&quot;/></g>`);
            else innerBars.push(`<g class=&quot;svg-innergap&quot; data-face=&quot;${fi}&quot; data-col=&quot;${ci}&quot; data-gap=&quot;${pi}&quot;><rect x=&quot;${pCursor}&quot; y=&quot;${gapAlongStart}&quot; width=&quot;${takviyePx}&quot; height=&quot;${gapColPx}&quot; fill=&quot;${SEG_FILL}&quot; ${araStroke}/>${plastikPx>0?`<rect x=&quot;${pCursor}&quot; y=&quot;${gapAlongStart}&quot; width=&quot;${takviyePx}&quot; height=&quot;${plastikPx}&quot; fill=&quot;${PL}&quot;/><rect x=&quot;${pCursor}&quot; y=&quot;${gapAlongStart+gapColPx-plastikPx}&quot; width=&quot;${takviyePx}&quot; height=&quot;${plastikPx}&quot; fill=&quot;${PL}&quot;/>`:``}<rect x=&quot;${pCursor-5}&quot; y=&quot;${gapAlongStart}&quot; width=&quot;${takviyePx+10}&quot; height=&quot;${gapColPx}&quot; fill=&quot;transparent&quot;/></g>`);
          }
          pCursor += takviyePx;
        } else {
          if(orient==='H'){
            svg += `<g class=&quot;svg-innergap&quot; data-face=&quot;${fi}&quot; data-col=&quot;${ci}&quot; data-gap=&quot;${pi}&quot;><line class=&quot;gap-hint&quot; x1=&quot;${gapAlongStart}&quot; y1=&quot;${pCursor}&quot; x2=&quot;${gapAlongStart+gapColPx}&quot; y2=&quot;${pCursor}&quot; stroke=&quot;#55697c&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;3,5&quot;/><rect x=&quot;${gapAlongStart}&quot; y=&quot;${pCursor-7}&quot; width=&quot;${gapColPx}&quot; height=&quot;14&quot; fill=&quot;transparent&quot;><title>Ara takviye ekle/kaldır</title></rect></g>`;
          } else {
            svg += `<g class=&quot;svg-innergap&quot; data-face=&quot;${fi}&quot; data-col=&quot;${ci}&quot; data-gap=&quot;${pi}&quot;><line class=&quot;gap-hint&quot; x1=&quot;${pCursor}&quot; y1=&quot;${gapAlongStart}&quot; x2=&quot;${pCursor}&quot; y2=&quot;${gapAlongStart+gapColPx}&quot; stroke=&quot;#55697c&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;3,5&quot;/><rect x=&quot;${pCursor-7}&quot; y=&quot;${gapAlongStart}&quot; width=&quot;14&quot; height=&quot;${gapColPx}&quot; fill=&quot;transparent&quot;><title>Ara takviye ekle/kaldır</title></rect></g>`;
          }
        }
      }
    });

    // Bölüm dik yön kalan boşluğu
    if(hasDims && !cRes.autoUsed && cRes.kalanAcross>1e-6 && (cRes.panels.length>1 || cRes.panels[0].entered>0)){
      const kPx = Math.min(Math.max(cRes.kalanAcross*scale,8), acrossStartPx+acrossLenPx-pCursor);
      if(kPx>2){
        if(orient==='H') svg += `<rect x=&quot;${colStartPx}&quot; y=&quot;${pCursor}&quot; width=&quot;${colPx}&quot; height=&quot;${kPx}&quot; fill=&quot;#3a2a10&quot; fill-opacity=&quot;0.5&quot; stroke=&quot;#e0a13a&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;4,3&quot;/>`;
        else svg += `<rect x=&quot;${pCursor}&quot; y=&quot;${colStartPx}&quot; width=&quot;${kPx}&quot; height=&quot;${colPx}&quot; fill=&quot;#3a2a10&quot; fill-opacity=&quot;0.5&quot; stroke=&quot;#e0a13a&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;4,3&quot;/>`;
      }
    }

    // Kapak ekle butonu (bölümün dik yön sonunda küçük +)
    {
      let bx, by;
      if(orient==='H'){ bx = colStartPx+colPx/2-11; by = innerY+innerH+4; }
      else            { bx = innerX+innerW+4;   by = colStartPx+colPx/2-11; }
      svg += `<g class=&quot;svg-addpanel&quot; data-face=&quot;${fi}&quot; data-col=&quot;${ci}&quot;>
        <rect x=&quot;${bx}&quot; y=&quot;${by}&quot; width=&quot;22&quot; height=&quot;22&quot; rx=&quot;5&quot; fill=&quot;#1c3a34&quot; stroke=&quot;#4fb8a8&quot; stroke-width=&quot;1&quot;/>
        <text x=&quot;${bx+11}&quot; y=&quot;${by+16}&quot; fill=&quot;#4fb8a8&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; text-anchor=&quot;middle&quot;>+</text>
        <title>${orient==='V' ? 'Bu satıra kapak ekle' : 'Bu bölüme kapak ekle (dik yönde böl)'}</title>
      </g>`;
    }


    // Bölümler arası ANA takviye / boşluk
    if(ci < r.colResults.length-1){
      const on = face.colGaps[ci];
      const bAna = r.bars.ana[ci];
      const cursor = junctionPx(ci, 0);   // kademesiz junction'da tek X; kademelide 1. segment
      if(on && bAna && !bAna.fullySuppressed){
        // Tek yol: bar, KESİLMİŞ seviyelerden (bAna.cutLevels) segmentlere ayrılır. Hiç kesim
        // yoksa tek segment çıkar ve bu, eski &quot;boydan boya sürekli&quot; çizimin birebir aynısıdır.
        // Kademeli (zigzag) düzende her segment kendi satır genişliğine göre farklı X'te durur.
        const aEnd = (orient==='H') ? innerY+innerH : innerX+innerW;
        const aStart = (orient==='H') ? innerY : innerX;
        const anaStroke = face.selectedBars.some(s=>s.kind==='ana' && s.i===ci) ? SEL_STROKE : NRM_STROKE;
        const segXs = LP.junctionX[ci].map((_,s)=>junctionPx(ci, s));
        const xOf = seg => junctionPx(ci, seg);
        const fill = bAna.splitValid ? SEG_FILL : CONT_FILL;

        const boundsPx = bAna.cutLevels.map(ix=>gapAcrossPx[ci][ix]).filter(v=>v!=null).sort((a,b)=>a-b);
        let segStart = aStart;
        const bounds = [];
        boundsPx.forEach(b=>{ bounds.push([segStart, b]); segStart = b + takviyePx; });
        bounds.push([segStart, aEnd]);

        let segs = '';
        bounds.forEach((bd, seg)=>{
          if(bAna.segments[seg] && bAna.segments[seg].suppressed) return; // o bant birleşik kapak → takviye yok
          const s0=bd[0], s1=bd[1];
          if(s1-s0 < 1) return;
          const segX = xOf(seg);
          if(orient==='H'){
            segs += `<rect x=&quot;${segX}&quot; y=&quot;${s0}&quot; width=&quot;${takviyePx}&quot; height=&quot;${(s1-s0)}&quot; fill=&quot;${fill}&quot; ${anaStroke}/>`;
            if(plastikPx>0) segs += `<rect x=&quot;${segX}&quot; y=&quot;${s0}&quot; width=&quot;${takviyePx}&quot; height=&quot;${plastikPx}&quot; fill=&quot;${PL}&quot;/><rect x=&quot;${segX}&quot; y=&quot;${s1-plastikPx}&quot; width=&quot;${takviyePx}&quot; height=&quot;${plastikPx}&quot; fill=&quot;${PL}&quot;/>`;
          } else {
            segs += `<rect x=&quot;${s0}&quot; y=&quot;${segX}&quot; width=&quot;${(s1-s0)}&quot; height=&quot;${takviyePx}&quot; fill=&quot;${fill}&quot; ${anaStroke}/>`;
            if(plastikPx>0) segs += `<rect x=&quot;${s0}&quot; y=&quot;${segX}&quot; width=&quot;${plastikPx}&quot; height=&quot;${takviyePx}&quot; fill=&quot;${PL}&quot;/><rect x=&quot;${s1-plastikPx}&quot; y=&quot;${segX}&quot; width=&quot;${plastikPx}&quot; height=&quot;${takviyePx}&quot; fill=&quot;${PL}&quot;/>`;
          }
        });

        // KESİM NOKTALARI — hizalı her seviyede küçük bir tutamak. Tıklayınca YALNIZ o
        // seviyedeki kesim açılır/kapanır. Dolu (turkuaz) = kesik, boş (gri) = sürekli.
        let cuts = '';
        bAna.levels.forEach(l=>{
          const ap = gapAcrossPx[ci][l.idxA];
          if(ap==null) return;
          const isCut = bAna.cutLevels.indexOf(l.idxA) >= 0;
          const segIdx = bAna.cutLevels.filter(c=>c<l.idxA).length;
          const hx = xOf(Math.min(segIdx, bounds.length-1)) + takviyePx/2;
          const hv = ap + takviyePx/2;
          const dot = isCut ? '#4fb8a8' : 'rgba(150,168,182,0.75)';
          const ttl = isCut ? 'Kesimi kaldır (bu seviyede sürekli yap)' : 'Bu seviyeden ayır';
          const cx0 = orient==='H' ? hx : hv, cy0 = orient==='H' ? hv : hx;
          cuts += `<g class=&quot;svg-anacut&quot; data-face=&quot;${fi}&quot; data-gap=&quot;${ci}&quot; data-lvl=&quot;${l.idxA}&quot;>`
               +  `<circle cx=&quot;${cx0.toFixed(1)}&quot; cy=&quot;${cy0.toFixed(1)}&quot; r=&quot;4.5&quot; fill=&quot;${dot}&quot; stroke=&quot;#0f1a22&quot; stroke-width=&quot;1&quot;/>`
               +  `<circle cx=&quot;${cx0.toFixed(1)}&quot; cy=&quot;${cy0.toFixed(1)}&quot; r=&quot;9&quot; fill=&quot;transparent&quot;><title>${ttl}</title></circle></g>`;
        });

        const hitMin = Math.min(...segXs);
        const hitMax = Math.max(...segXs);
        const hit = (orient==='H')
          ? `<rect x=&quot;${hitMin-5}&quot; y=&quot;${innerY}&quot; width=&quot;${hitMax-hitMin+takviyePx+10}&quot; height=&quot;${innerH}&quot; fill=&quot;transparent&quot;/>`
          : `<rect x=&quot;${innerX}&quot; y=&quot;${hitMin-5}&quot; width=&quot;${innerW}&quot; height=&quot;${hitMax-hitMin+takviyePx+10}&quot; fill=&quot;transparent&quot;/>`;
        colBars.push(`<g class=&quot;svg-gap&quot; data-face=&quot;${fi}&quot; data-gap=&quot;${ci}&quot;>${segs}${hit}</g>${cuts}`);
      } else if(on){
        // Tüm yükseklik birleşik kapağın altında kaldı: bar çizilmez ama genişlikte yerini korur
        // (birleşik kapağın pColSize'ı bu takviye kalınlığını zaten içeriyor).
      } else {
        if(orient==='H'){
          svg += `<g class=&quot;svg-gap&quot; data-face=&quot;${fi}&quot; data-gap=&quot;${ci}&quot;><line class=&quot;gap-hint&quot; x1=&quot;${cursor}&quot; y1=&quot;${innerY}&quot; x2=&quot;${cursor}&quot; y2=&quot;${innerY+innerH}&quot; stroke=&quot;#55697c&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;3,5&quot;/>`;
          svg += `<rect x=&quot;${cursor-7}&quot; y=&quot;${innerY}&quot; width=&quot;14&quot; height=&quot;${innerH}&quot; fill=&quot;transparent&quot;><title>Ana takviye ekle/kaldır</title></rect>`;
          svg += `</g>`;
        } else {
          svg += `<g class=&quot;svg-gap&quot; data-face=&quot;${fi}&quot; data-gap=&quot;${ci}&quot;><line class=&quot;gap-hint&quot; x1=&quot;${innerX}&quot; y1=&quot;${cursor}&quot; x2=&quot;${innerX+innerW}&quot; y2=&quot;${cursor}&quot; stroke=&quot;#55697c&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;3,5&quot;/>`;
          svg += `<rect x=&quot;${innerX}&quot; y=&quot;${cursor-7}&quot; width=&quot;${innerW}&quot; height=&quot;14&quot; fill=&quot;transparent&quot;><title>Ana takviye ekle/kaldır</title></rect>`;
          svg += `</g>`;
        }
      }
    }
  });

  // Ana yön kalan boşluk
  if(hasDims && r.kalanAlong>1e-6){
    const kPx = Math.max(r.kalanAlong*scale, 10);
    if(orient==='H'){
      const w = Math.min(kPx, ox+fw-kenarPx-endPx);
      if(w>2){
        svg += `<rect x=&quot;${endPx}&quot; y=&quot;${innerY}&quot; width=&quot;${w}&quot; height=&quot;${innerH}&quot; fill=&quot;#3a2a10&quot; fill-opacity=&quot;0.5&quot; stroke=&quot;#e0a13a&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;4,3&quot;/>`;
        svg += `<text x=&quot;${endPx+w/2}&quot; y=&quot;${innerY+innerH/2}&quot; fill=&quot;#e0a13a&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 ${endPx+w/2} ${innerY+innerH/2})&quot;>${r.kalanAlong.toFixed(0)} mm boş</text>`;
      }
    } else {
      const h = Math.min(kPx, oy+fh-kenarPx-endPx);
      if(h>2){
        svg += `<rect x=&quot;${innerX}&quot; y=&quot;${endPx}&quot; width=&quot;${innerW}&quot; height=&quot;${h}&quot; fill=&quot;#3a2a10&quot; fill-opacity=&quot;0.5&quot; stroke=&quot;#e0a13a&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;4,3&quot;/>`;
        svg += `<text x=&quot;${innerX+innerW/2}&quot; y=&quot;${endPx+h/2+3}&quot; fill=&quot;#e0a13a&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot;>${r.kalanAlong.toFixed(0)} mm boş</text>`;
      }
    }
  }

  // BİRLEŞİK (zincir) ARA TAKVİYELER — kaç bölüm sürerse sürsün TEK parça çizilir.
  // Görsel tek dikdörtgen; üstüne her ÜYE bölüm için ayrı bir şeffaf tıklama alanı konur,
  // böylece barın sağ yarısına tıklayıp zinciri bir bölüm daha uzatmak mümkün olur.
  r.bars.araChains.forEach(ch=>{
    const acrossPx = gapAcrossPx[ch.members[0].ci][ch.members[0].gi];
    if(acrossPx==null) return;
    const s0 = araSpanPx(ch.members[0]).left;
    const s1 = araSpanPx(ch.members[ch.members.length-1]).right;
    if(s1-s0 < 1) return;
    const anySel = ch.members.some(m=>face.selectedBars.some(s=>s.kind==='ara' && s.ci===m.ci && s.gi===m.gi));
    const djStroke = anySel ? SEL_STROKE : NRM_STROKE;
    // Üye sınırları: her üye bir sonrakinin başlangıcına kadar uzar (aradaki ana takviye dahil)
    const edges = ch.members.map(m=>araSpanPx(m).left);
    const hits = ch.members.map((m,ix)=>{
      const h0 = ix===0 ? s0 : edges[ix];
      const h1 = ix===ch.members.length-1 ? s1 : edges[ix+1];
      return (orient==='H')
        ? `<g class=&quot;svg-innergap&quot; data-face=&quot;${fi}&quot; data-col=&quot;${m.ci}&quot; data-gap=&quot;${m.gi}&quot;><rect x=&quot;${h0}&quot; y=&quot;${acrossPx-5}&quot; width=&quot;${Math.max(h1-h0,1)}&quot; height=&quot;${takviyePx+10}&quot; fill=&quot;transparent&quot;/></g>`
        : `<g class=&quot;svg-innergap&quot; data-face=&quot;${fi}&quot; data-col=&quot;${m.ci}&quot; data-gap=&quot;${m.gi}&quot;><rect x=&quot;${acrossPx-5}&quot; y=&quot;${h0}&quot; width=&quot;${takviyePx+10}&quot; height=&quot;${Math.max(h1-h0,1)}&quot; fill=&quot;transparent&quot;/></g>`;
    }).join('');
    if(orient==='H'){
      innerBars.push(`<rect x=&quot;${s0}&quot; y=&quot;${acrossPx}&quot; width=&quot;${s1-s0}&quot; height=&quot;${takviyePx}&quot; fill=&quot;${CONT_FILL}&quot; ${djStroke}/>${plastikPx>0?`<rect x=&quot;${s0}&quot; y=&quot;${acrossPx}&quot; width=&quot;${plastikPx}&quot; height=&quot;${takviyePx}&quot; fill=&quot;${PL}&quot;/><rect x=&quot;${s1-plastikPx}&quot; y=&quot;${acrossPx}&quot; width=&quot;${plastikPx}&quot; height=&quot;${takviyePx}&quot; fill=&quot;${PL}&quot;/>`:``}${hits}`);
    } else {
      innerBars.push(`<rect x=&quot;${acrossPx}&quot; y=&quot;${s0}&quot; width=&quot;${takviyePx}&quot; height=&quot;${s1-s0}&quot; fill=&quot;${CONT_FILL}&quot; ${djStroke}/>${plastikPx>0?`<rect x=&quot;${acrossPx}&quot; y=&quot;${s0}&quot; width=&quot;${takviyePx}&quot; height=&quot;${plastikPx}&quot; fill=&quot;${PL}&quot;/><rect x=&quot;${acrossPx}&quot; y=&quot;${s1-plastikPx}&quot; width=&quot;${takviyePx}&quot; height=&quot;${plastikPx}&quot; fill=&quot;${PL}&quot;/>`:``}${hits}`);
    }
  });
  svg += innerBars.join('') + colBars.join('');

  // H orient: face sağ tarafında tek + butonu (bölüm ekle)
  if(orient === 'H'){
    const cbx = ox+fw+4, cby = oy+fh/2-11;
    svg += `<g class=&quot;svg-addcol&quot; data-face=&quot;${fi}&quot; data-addcol=&quot;${r.colResults.length-1}&quot;>
      <rect x=&quot;${cbx}&quot; y=&quot;${cby}&quot; width=&quot;22&quot; height=&quot;22&quot; rx=&quot;5&quot; fill=&quot;#1c2a24&quot; stroke=&quot;#4fb8a8&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;3,2&quot;/>
      <text x=&quot;${cbx+11}&quot; y=&quot;${cby+16}&quot; fill=&quot;#4fb8a8&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; text-anchor=&quot;middle&quot;>+</text>
      <title>Sağa yeni bölüm ekle</title>
    </g>`;
  }
  // V orient: face altında tek + butonu (satır ekle)
  if(orient === 'V'){
    const arx = ox+fw/2-11, ary = oy+fh+4;
    svg += `<g class=&quot;svg-addrow&quot; data-face=&quot;${fi}&quot; data-addrow=&quot;${r.colResults.length-1}&quot;>
      <rect x=&quot;${arx}&quot; y=&quot;${ary}&quot; width=&quot;22&quot; height=&quot;22&quot; rx=&quot;5&quot; fill=&quot;#1c2a24&quot; stroke=&quot;#4fb8a8&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;3,2&quot;/>
      <text x=&quot;${arx+11}&quot; y=&quot;${ary+16}&quot; fill=&quot;#4fb8a8&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; text-anchor=&quot;middle&quot;>+</text>
      <title>Yeni satır ekle</title>
    </g>`;
  }

  svg += `<text x=&quot;${SVG_W-PAD}&quot; y=&quot;${SVG_H-14}&quot; fill=&quot;#9aa8b2&quot; font-size=&quot;9.5&quot; text-anchor=&quot;end&quot; font-style=&quot;italic&quot;>Cenk Altınay</text>`;
  svg += `</svg>`;
  return svg;
}

// ---------- HTML ----------
function buildFaceHTML(fi){
  const def = faceDefOf(fi);
  const ak = isAraKat(fi);
  // ARA KAT: &quot;kapaksız&quot; seçeneği yoktur (açık/kapalı bilgisi araKat.aktif'te), yerine
  // aktiflik + profil + sürekli yön kontrolleri ve modülden türetilen salt-okunur ölçü
  // zinciri durur. Gerisi — ızgara, editör, kesim tablosu — yüzlerin AYNISI.
  const basligi = ak ? `
        <div class=&quot;checkbox-row&quot;>
          <input type=&quot;checkbox&quot; id=&quot;f${fi}_aktif&quot;>
          <label for=&quot;f${fi}_aktif&quot;>Bu modülde ara kat var</label>
        </div>
        <div class=&quot;orient-select&quot;>
          <label>Profil</label>
          <select id=&quot;f${fi}_profil&quot;>
            <option value=&quot;30x30&quot;>30×30</option>
            <option value=&quot;30x60&quot;>30×60</option>
            <option value=&quot;profilsiz&quot;>Profilsiz</option>
          </select>
        </div>
        <div class=&quot;orient-select&quot; id=&quot;f${fi}_surekli_row&quot;>
          <label>Boydan Boya Giden Yön</label>
          <select id=&quot;f${fi}_surekli&quot;>
            <option value=&quot;&quot;>Otomatik (uzun kenar)</option>
            <option value=&quot;L&quot;>Uzunluk (L)</option>
            <option value=&quot;W&quot;>Genişlik (W)</option>
          </select>
        </div>` : `
        <div class=&quot;checkbox-row&quot;>
          <input type=&quot;checkbox&quot; id=&quot;f${fi}_kapaksiz&quot; data-kapaksizface=&quot;${fi}&quot;>
          <label for=&quot;f${fi}_kapaksiz&quot;>Bu yüz kapaksız</label>
        </div>`;
  const olcuSatiri = ak ? `
    <div class=&quot;dim-readout&quot; id=&quot;f${fi}_zincir&quot;>
      <div><div class=&quot;lbl&quot;>Modül Dış (L × W)</div><div class=&quot;val&quot; id=&quot;f${fi}_z_dis&quot;>—</div></div>
      <div><div class=&quot;lbl&quot;>İç Ölçü (− düşüm)</div><div class=&quot;val&quot; id=&quot;f${fi}_z_ic&quot;>—</div></div>
      <div><div class=&quot;lbl&quot; id=&quot;f${fi}_z_acik_lbl&quot;>Panel Açıklığı (− 2p)</div><div class=&quot;val&quot; id=&quot;f${fi}_z_acik&quot;>—</div></div>
      <div><div class=&quot;lbl&quot;>Düşüm / Profil</div><div class=&quot;val&quot; id=&quot;f${fi}_z_pay&quot;>—</div></div>
    </div>` : '';
  const legend = ak ? `
          <span><i style=&quot;background:#b3c9b8;&quot;></i> Ara kat paneli</span>
          <span><i style=&quot;background:#b7bcc2;&quot;></i> Damper (0 tolerans)</span>
          <span><i style=&quot;background:#7499be;&quot;></i> Boş Alan</span>
          <span>Ölçüler modülden türetilir — burada ölçü girilmez, <b>modülün L / W</b> ölçüsünü değiştirin.</span>

function typeOptions(sel, fi){
  // Ara kat gözünde kapak tipleri geçerli değil — 6 yüzde eski liste aynen kalır.
  if(isAraKat(fi)){
    return ARAKAT_CELL_TYPES.map(t=>`<option value=&quot;${t}&quot;${sel===t?' selected':''}>${t}</option>`).join('');
  }
  return `<optgroup label=&quot;Sabit&quot;>${SABIT_TYPES.map(t=>`<option value=&quot;${t}&quot;${sel===t?' selected':''}>${t}</option>`).join('')}</optgroup>`+
         `<optgroup label=&quot;Açılır&quot;>${ACILIR_TYPES.map(t=>`<option value=&quot;${t}&quot;${sel===t?' selected':''}>${t}</option>`).join('')}</optgroup>`+
         `<optgroup label=&quot;Eleman (0 tolerans)&quot;>${ELEMAN_TYPES.map(t=>`<option value=&quot;${t}&quot;${sel===t?' selected':''}>${t}</option>`).join('')}</optgroup>`+
         `<optgroup label=&quot;Boş&quot;>${BOS_TYPES.map(t=>`<option value=&quot;${t}&quot;${sel===t?' selected':''}>${t}</option>`).join('')}</optgroup>`;
}

// Seçili kapakların TEK bir birleşik kapağa dönüşüp dönüşemeyeceğinin ön kontrolü — düğmeyi
// etkinleştirmek ve sebebi göstermek için. NİHAİ karar computeFace'te verilir (geçersiz kalırsa
// orada uyarıyla çözülür), böylece kural tek yerde kalır.
function canMergeCells(r, face, cells){
  if(!cells.length) return {ok:false, reason:'En az 2 kapak seçin'};
  // Seçimi NORMALİZE et: zaten birleşik bir kapak seçiliyse kapladığı hücreler de kapsama
  // girer (kaplanan bir hücre seçiliyse sahibinden başlanır) — böylece mevcut bir birleşim
  // yanına bir bölüm daha eklenerek genişletilebilir.
  const byCol = new Map();
  const owners = [];
  cells.forEach(c=>{
    const p = r.colResults[c.col] && r.colResults[c.col].panels[c.idx];
    if(!p) return;
    const o = p.covered && p.spanOwner ? p.spanOwner : {col:c.col, idx:c.idx};
    const op = r.colResults[o.col].panels[o.idx];
    if(!owners.some(x=>x.col===o.col && x.idx===o.idx)) owners.push(o);
    byCol.set(o.col, o.idx);
    (op.spanCovers||[]).forEach(cv=>{ byCol.set(cv.col, cv.idx); });
  });
  if(byCol.size < 2) return {ok:false, reason:'En az 2 kapak seçin'};
  const sorted = [...byCol.keys()].sort((a,b)=>a-b).map(col=>({col, idx:byCol.get(col)}));
  for(let i=1;i<sorted.length;i++){
    if(sorted[i].col !== sorted[i-1].col+1) return {ok:false, reason:'Kapaklar yan yana bölümlerde olmalı'};
  }
  // sharedGapLevels ile AYNI kümülatif eff uzayı — hizalama ölçütü her yerde aynı kalsın
  const bounds = r.colResults.map(cRes=>{
    const o=[]; let cum=0;
    cRes.panels.forEach(p=>{ o.push({top:cum, bot:cum+p.eff}); cum+=p.eff; });
    return o;
  });
  const first = bounds[sorted[0].col][sorted[0].idx];
  for(const c of sorted){
    const b = bounds[c.col][c.idx];
    if(Math.abs(b.top-first.top)>0.51 || Math.abs(b.bot-first.bot)>0.51) return {ok:false, reason:'Seçili kapaklar aynı hizada değil'};
    const col = face.columns[c.col];
    if(c.idx>0 && !col.innerGaps[c.idx-1]) return {ok:false, reason:'Üst sınırda ara takviye yok (Bölüm '+(c.col+1)+')'};
    if(c.idx<col.panels.length-1 && !col.innerGaps[c.idx]) return {ok:false, reason:'Alt sınırda ara takviye yok (Bölüm '+(c.col+1)+')'};
  }
  // Kapsamdaki eski birleşim sahipleri çözülür, en soldaki yeni base olur
  return {ok:true, reason:'', base:sorted[0], span:sorted.length, cells:sorted, owners};
}

// Bir kapağın (birleşikse kapsamının) SAĞINDAKİ bölümde hizalı hücreyi bulur — yoksa null.
// &quot;Sağdaki Bölümü Ekle&quot; düğmesinin hedefi budur. Hizalama ölçütü canMergeCells ve
// sharedGapLevels ile AYNI kümülatif eff uzayı ve aynı 0.51 mm epsilon'u kullanır.
function nextAlignedCell(r, ci, pi){
  const p = r.colResults[ci] && r.colResults[ci].panels[pi];
  if(!p) return null;
  const nc = ci + Math.max(1, p.spanN||1);
  if(nc >= r.colResults.length) return null;
  const boundsOf = cRes=>{ const o=[]; let cum=0; cRes.panels.forEach(q=>{ o.push({top:cum, bot:cum+q.eff}); cum+=q.eff; }); return o; };
  const me = boundsOf(r.colResults[ci])[pi];
  const k = boundsOf(r.colResults[nc]).findIndex(b=> Math.abs(b.top-me.top)<=0.51 && Math.abs(b.bot-me.bot)<=0.51);
  return k < 0 ? null : {col:nc, idx:k};
}

// canMergeCells kararını modele uygular. Kapsamdaki eski birleşimler çözülür, en soldaki
// hücre yeni base olur. Kapsam değiştiği için elle girilmiş birleşim genişliği sıfırlanır —
// eski genişlik yeni kapsamda anlamsızdır (2 bölüm için girilen ölçü 3 bölüme taşınmaz).
function applyMerge(face, chk){
  chk.owners.forEach(o=>{ const q = face.columns[o.col].panels[o.idx]; q.colSpan = 1; q.spanSize = 0; });
  const base = face.columns[chk.base.col].panels[chk.base.idx];
  base.colSpan = chk.span;
  base.spanSize = 0;
  // Kapsanan hücrelerin ölçü/tipini hemen base'e eşitle — bundan sonra tek kapak gibi davransın
  chk.cells.slice(1).forEach(c=>{
    Object.assign(face.columns[c.col].panels[c.idx], {size: base.size, type: base.type});
  });
  face.selectedCells = [chk.base];
}

function editorInfo(r, ci, pi, orient){
  const c = r.colResults[ci];
  const p = c.panels[pi];
  let info = '';
  if(p.spanN>1){
    info += `${p.spanN} bölüm birleşik — `;
    info += p.spanEntered
      ? `genişlik elle girildi: ${Math.round(p.pColSize)} mm (bölüm ölçülerinden türetilen: ${Math.round(p.spanDerived)} mm — alanı boşaltırsanız ona döner). `
      : `genişlik bölüm ölçülerinden türetilir: ${Math.round(p.pColSize)} mm (elle de girebilirsiniz). `;
  }
  const kOlc = kesimOlcusu(p);
  if(p.elemanOlcu && p.sabitW!==null && p.sabitH!==null)
    info += `Bölüm ${p.sabitW.toFixed(0)}×${p.sabitH.toFixed(0)} mm — ağız çizimdeki `
          + `ölçüsünde kalır, aradaki pay çerçeveye gider. `;
  if(kOlc.w!==null) info += `SABİT w: ${kOlc.w.toFixed(0)} mm. `;
  if(kOlc.h!==null) info += `SABİT h: ${kOlc.h.toFixed(0)} mm. `;
  if(p.eleman) info += `Eleman — 0 tolerans: girilen ölçü kesim/sipariş ölçüsüdür. `;
  if(isYonlu(p.type)){
    const c = elemanCizimOlcusu(p);
    if(c.w!==null && c.h!==null) info += p.yon==='dikey'
      ? `Çizim yönü DİKEY — ölçüler takas edilir: çizime yatay parça ${Math.round(c.w)} mm, dikey parça ${Math.round(c.h)} mm olarak gider. `
      : `Çizim yönü yatay — çizime yatay parça ${Math.round(c.w)} mm, dikey parça ${Math.round(c.h)} mm olarak gider. `;
  }
  if(p.bos) info += `Boş Alan — kesim listesine girmez; son hücrede ölçüsüz bırakılırsa kalan alanı otomatik doldurur. `;
  const acrossLbl = orient==='V' ? 'Genişlik' : 'Yükseklik';
  const alongLbl  = orient==='V' ? 'Yükseklik' : 'Genişlik';
  const rowLbl    = orient==='V' ? 'satır' : 'bölüm';
  if(p.colAuto) info += `${alongLbl} otomatik — bu satırda kalan boşluk: ${Math.round(p.pColSize)} mm. `;
  if(p.auto) info += `${acrossLbl} otomatik (${rowLbl} iç ölçüsü: ${c.icColAcross.toFixed(0)} mm). `;
  if(!c.autoUsed && Math.abs(c.kalanAcross)>1e-6 && c.panels.length>1) info += `${rowLbl.charAt(0).toUpperCase()+rowLbl.slice(1)} dik yön kalanı: ${c.kalanAcross.toFixed(0)} mm.`;
  return info;
}

// Birleşik bir kapağın dik-yön ölçüsü ve tipi, KAPLADIĞI hücrelere de yazılır.
// Bu hücreler kapak sayılmasa da kendi bölümlerinin bant yapısını belirler; senkron
// kalmazlarsa bantlar hizadan çıkar ve computeFace birleşimi çözmek zorunda kalır.
// Dönüş: model değişti mi (yeniden hesap gerekiyor mu).
function syncSpannedCell(fi, ci, pi, patch){
  const face = faceOf(fi);
  const p = face.columns[ci] && face.columns[ci].panels[pi];
  if(!p) return false;
  const pre = computeFace(fi);   // hizalama HENÜZ bozulmadan kapladığı hücreleri bul
  const pres = pre.colResults[ci] && pre.colResults[ci].panels[pi];
  Object.assign(p, patch);
  if(!pres || !pres.spanCovers) return true;
  pres.spanCovers.forEach(c=>{
    const t = face.columns[c.col] && face.columns[c.col].panels[c.idx];
    if(t) Object.assign(t, patch);
  });
  return true;
}

function renderEditor(fi){
  const face = faceOf(fi);
  if(face.selectedBars.length && !face.kapaksiz){ renderBarEditor(fi); return; }
  const body = document.getElementById(`f${fi}_editor_body`);
  const titleEl = document.getElementById(`f${fi}_editor_title`);
  const infoEl = document.getElementById(`f${fi}_ed_info`);
  if(!face.selectedCells.length || face.kapaksiz){
    titleEl.textContent = 'Kapak Düzenleyici';
    body.innerHTML='<div class=&quot;editor-placeholder&quot;>Bir kapak seçerek düzenleyin<br><span style=&quot;font-size:11px;opacity:.8;&quot;>Ctrl ile birden fazla seçip birleştirebilirsiniz</span></div>';
    infoEl.textContent='';
    return;
  }
  const r = computeFace(fi);
  const orient = face.orient;

  // ÇOKLU SEÇİM → hücre birleştirme paneli (tekil düzenleme alanları anlamsız olurdu)
  if(face.selectedCells.length > 1){
    const chk = canMergeCells(r, face, face.selectedCells);
    const liste = face.selectedCells.slice().sort((a,b)=>a.col-b.col)
      .map(c=>'B'+(c.col+1)+'K'+(c.idx+1)).join(' + ');
    titleEl.textContent = `${face.selectedCells.length} kapak seçili`;
    body.innerHTML = `<div class=&quot;grid&quot;>
      <div style=&quot;grid-column:1/-1;font-size:12.5px;color:var(--muted);&quot;>${liste}</div>
      <div style=&quot;display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1;&quot;>
        <button class=&quot;add-btn2&quot; id=&quot;f${fi}_cell_merge&quot; ${chk.ok?'':'disabled'} style=&quot;opacity:${chk.ok?1:0.45}&quot; title=&quot;${chk.reason}&quot;>Kapakları Birleştir</button>
        <button class=&quot;add-btn2 ghost&quot; id=&quot;f${fi}_cell_clear&quot;>Seçimi Temizle</button>
      </div>
    </div>`;
    infoEl.textContent = chk.ok
      ? `${chk.span} bölüm tek kapak olur ve aradaki ana takviyeler YALNIZ bu bantta kalkar — böylece bu satır diğerlerinden farklı sayıda kapak içerebilir. Mevcut bir birleşimi seçip yanına bir bölüm daha ekleyerek genişletebilirsiniz.`
      : chk.reason;
    return;
  }

  const {col:ci, idx:pi} = face.selectedCells[0];
  const col = face.columns[ci];
  const p = col.panels[pi];
  const pRes = r.colResults[ci].panels[pi];
  const spanned = pRes.spanN > 1;

  titleEl.textContent = (orient==='V' ? `Satır ${ci+1} / Kapak ${pi+1}` : `Bölüm ${ci+1} / Kapak ${pi+1}`)
    + (spanned ? ` — ${pRes.spanN} bölüm birleşik` : '');
  const colLbl = orient==='H' ? 'Bu Kapak Genişliği w (mm)' : 'Kapak Yüksekliği h (mm)';
  const pLbl = orient==='H' ? 'Kapak Yüksekliği h (mm)' : 'Kapak Genişliği w (mm)';
  const single = col.panels.length===1;
  const colInputVal = orient==='H' ? (p.colSize||'') : (col.size||'');
  const colInputPh  = orient==='H' ? (col.size||'') : 'oto';
  // Birleşik kapağın along ölçüsü normalde kapladığı bölümlerden TÜRETİLİR; elle bir ölçü
  // girilirse o esas alınır (satır kademelenir). Alan boşaltılınca türetilene geri döner —
  // yer tutucu her zaman türetilen değeri gösterir.
  const colField = spanned
    ? `<div><label>${colLbl} — birleşik</label><input type=&quot;number&quot; id=&quot;f${fi}_ed_spansize&quot; value=&quot;${p.spanSize||''}&quot; placeholder=&quot;${Math.round(pRes.spanDerived||pRes.pColSize)}&quot;></div>`
    : `<div><label>${colLbl}</label><input type=&quot;number&quot; id=&quot;f${fi}_ed_colsize&quot; value=&quot;${colInputVal}&quot; placeholder=&quot;${colInputPh}&quot;></div>`;
  // Birleşimi bir bölüm sağa büyütme. Ctrl ile çoklu seçim gerektirmediği için ardışık
  // tıklamalarla 2 → 3 → 4 … bölüm birleştirilebilir.
  const growTarget = nextAlignedCell(r, ci, pi);
  const growChk = growTarget ? canMergeCells(r, face, [{col:ci, idx:pi}, growTarget]) : null;
  const growField = (ci + (pRes.spanN||1) < face.columns.length)
    ? `<button class=&quot;add-btn2&quot; id=&quot;f${fi}_cell_grow&quot; ${growChk && growChk.ok ? '' : 'disabled'} style=&quot;opacity:${growChk && growChk.ok ? 1 : 0.45}&quot; title=&quot;${growChk ? (growChk.reason || 'Sağdaki bölümü bu kapağa katar') : 'Sağdaki bölümde hizalı kapak yok'}&quot;>Sağdaki Bölümü Ekle</button>`
    : '';
  const pField = `<div><label>${pLbl}${single?' — boş = otomatik tam':''}</label><input type=&quot;number&quot; id=&quot;f${fi}_ed_psize&quot; value=&quot;${p.size||''}&quot; placeholder=&quot;${single?'oto':''}&quot;></div>`;
  const dimFields = orient==='V' ? pField + colField : colField + pField;
  // Yönlü elemanda (Damper/Boğaz) çizim yönü seçilir: girilen ölçülerin çerçeve
  // parçalarına eşlenmesi takas edilebilir. Yüzdeki yerleşim ve kesim ölçüsü değişmez.
  const dikeyMi = isDikeyEleman(p);
  const yonField = isYonlu(p.type)
    ? `<div><label>Çizim Yönü</label><select id=&quot;f${fi}_ed_yon&quot;>`
      + `<option value=&quot;&quot;${dikeyMi?'':' selected'}>Yatay (varsayılan)</option>`
      + `<option value=&quot;dikey&quot;${dikeyMi?' selected':''}>Dikey (ölçüler takas)</option>`
      + `</select></div>`
    : '';
  body.innerHTML = `<div class=&quot;grid&quot;>
    ${dimFields}
    <div><label>Panel Tipi</label><select id=&quot;f${fi}_ed_type&quot;>${typeOptions(p.type, fi)}</select></div>
    ${yonField}
    <div style=&quot;display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;&quot;>
      ${growField}
      ${spanned?`<button class=&quot;add-btn2 ghost&quot; id=&quot;f${fi}_cell_unmerge&quot;>Birleşimi Çöz</button>`:''}
      <button class=&quot;del-btn&quot; id=&quot;f${fi}_ed_del&quot; ${(face.columns.length<=1 && single)?'disabled':''}>Kapağı Sil</button>
    </div>
  </div>`;
  infoEl.textContent = editorInfo(r, ci, pi, orient);
}

// Bir ANA takviyenin bölünebilirlik durumu (tekil ve toplu düzenleyici aynı kaynağı kullanır)
function anaBarState(r, i){
  const b = r.bars.ana[i];
  if(!b) return null;
  return {bar:b, canSplit: b.levels.length>0, isSplit: b.splitValid,
          reason: b.levels.length ? '' : 'Hizalı ara takviye seviyesi yok — komşu bölümlerin ara takviyeleri aynı yükseklikte olmalı'};
}
// Bir ARA takviyenin komşu bölüme geçebilirlik durumu
function araBarState(r, face, ci, gi){
  const b = r.bars.ara.find(x=>x.ci===ci && x.gi===gi);
  if(!b) return null;
  const anaBar = r.bars.ana[ci];
  const hasAdjacent = ci < face.columns.length-1;
  const levelShared = hasAdjacent && !!anaBar && anaBar.levels.some(l=>l.idxA===gi);
  const blockedByAna = hasAdjacent && !!anaBar && anaBar.on && !anaBar.fullySuppressed && anaBar.cutLevels.indexOf(gi) < 0;
  const canJoin = hasAdjacent && levelShared && !blockedByAna;
  const reason = canJoin ? '' : (!hasAdjacent ? 'Son bölümün ara takviyesi birleştirilemez'
    : blockedByAna ? 'Aradaki ana takviye önce bu seviyeden kesilmeli (bar üzerindeki noktaya tıklayın)'
    : 'Komşu bölümde hizalı seviye yok');
  // Bu bar bir zincirin (2, 3, … bölüm) parçasıysa zincirin kapsamı da döner
  const ciX = r.bars.araChainIdx[ci] ? r.bars.araChainIdx[ci][gi] : undefined;
  const chain = ciX!==undefined ? r.bars.araChains[ciX] : null;
  return {bar:b, canJoin, isJoined:b.joinValid, reason, chain};
}

function renderBarEditor(fi){
  const face = faceOf(fi);
  const body = document.getElementById(`f${fi}_editor_body`);
  const titleEl = document.getElementById(`f${fi}_editor_title`);
  const infoEl = document.getElementById(`f${fi}_ed_info`);
  const r = computeFace(fi);
  const orient = face.orient;
  const sel = selBar(face);
  if(!sel){ face.selectedBars = []; renderEditor(fi); return; }
  const isAna = sel.kind === 'ana';
  // Seçim daima tek türden (bkz. attachListeners) — karışık seçim oluşamaz
  const picks = face.selectedBars.filter(b=>b.kind===sel.kind);
  const states = picks.map(b => isAna ? anaBarState(r, b.i) : araBarState(r, face, b.ci, b.gi));
  if(states.some(s=>!s)){ face.selectedBars = []; renderEditor(fi); return; }

  const yon = isAna ? (orient==='H' ? 'Dikey' : 'Yatay') : (orient==='H' ? 'Yatay' : 'Dikey');
  const etiket = b => isAna ? `B${b.i+1}/B${b.i+2}` : `B${b.ci+1}·S${b.gi+1}`;

  // ANA:  Birleştir = tüm kesimleri kaldır (boydan boya sürekli)
  //       Ayır      = hizalı TÜM seviyelerden kes (tek nokta için bar üzerindeki tutamak kullanılır)
  // ARA:  Birleştir = komşu bölümle sürekli   |  Ayır = kendi bölümünde segmentli
  const joinN  = isAna ? states.length : states.filter(s=>s.canJoin).length;
  const splitN = isAna ? states.filter(s=>s.canSplit).length : states.length;
  const blockers = [...new Set(states.map(s=>s.reason).filter(Boolean))];
  const multi = picks.length > 1;

  titleEl.textContent = multi
    ? `${picks.length} ${isAna?'Ana':'Ara'} Takviye (${yon}) seçili`
    : (isAna ? `Ana Takviye (${yon}) — Bölüm ${sel.i+1}/${sel.i+2} arası`
             : `Ara Takviye (${yon}) — Bölüm ${sel.ci+1}, Seviye ${sel.gi+1}`);

  const durum = multi
    ? picks.map(etiket).join(', ')
    : (isAna ? (states[0].isSplit ? `Ayrılmış — ${states[0].bar.cutLevels.length} kesim` : 'Sürekli (boydan boya)')
             : (states[0].chain ? `Birleşik (Bölüm ${states[0].chain.members.map(m=>m.ci+1).join('-')} arası sürekli)` : 'Segmentli (kendi bölümünde)'));

  const btnStyle = disabled=>`style=&quot;opacity:${disabled?0.45:1}&quot;`;
  body.innerHTML = `<div class=&quot;grid&quot;>
    <div style=&quot;grid-column:1/-1;font-size:12.5px;color:var(--muted);&quot;>${multi?'Seçim':'Durum'}: <b style=&quot;color:var(--text);&quot;>${durum}</b></div>
    <div style=&quot;display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1;&quot;>
      <button class=&quot;add-btn2&quot; id=&quot;f${fi}_bar_join&quot; ${joinN?'':'disabled'} ${btnStyle(!joinN)} title=&quot;${joinN?'':blockers.join(' | ')}&quot;>Birleştir${multi?` (${joinN}/${picks.length})`:''}</button>
      <button class=&quot;add-btn2 ghost&quot; id=&quot;f${fi}_bar_split&quot; ${splitN?'':'disabled'} ${btnStyle(!splitN)} title=&quot;${splitN?'':blockers.join(' | ')}&quot;>Ayır${multi?` (${splitN}/${picks.length})`:''}</button>
      <button class=&quot;del-btn&quot; id=&quot;f${fi}_bar_remove&quot;>Kaldır${multi?` (${picks.length})`:''}</button>
    </div>
  </div>`;
  infoEl.textContent = blockers.length
    ? blockers.join(' | ')
    : (isAna ? 'Tek bir noktadan bölmek için bar üzerindeki yuvarlak tutamağa tıklayın; buradaki Ayır hizalı TÜM seviyelerden keser.'
             : 'Zinciri uzatmak için birleşik barın SAĞ ucuna (bir sonraki bölümün üzerine) tıklayıp Birleştir deyin — bölüm sayısı sınırsızdır.');
}

// Kesim listesi satırları — HTML tablosu ve Excel çıktısı aynı kaynaktan beslenir
function getCutRows(r){
  const out = [];
  const fc = codeOfDef(r.def);
  r.colResults.forEach((c,ci)=>{
    c.panels.forEach((p,pi)=>{
      if(p.bos || p.covered) return; // Boş Alan ve birleşik kapağın kapladığı hücre kesim listesine girmez
      // &quot;(oto)&quot; işareti hangi eksende otomatik doldurma yapıldığına göre yerleşir:
      // p.auto = dik eksen (bölüm içi), p.colAuto = ana eksen (satırda kalan boşluk)
      const wAuto = r.orient==='H' ? p.colAuto : p.auto;
      const hAuto = r.orient==='H' ? p.auto : p.colAuto;
      const istW = p.panelW>0 ? Math.round(p.panelW)+(wAuto?' (oto)':'') : null;
      const istH = p.panelH>0 ? Math.round(p.panelH)+(hAuto?' (oto)':'') : null;
      const ko = kesimOlcusu(p);
      const sabH = ko.h!==null ? Math.round(ko.h) : null;
      out.push([fc+'-B'+(ci+1)+'K'+(pi+1), p.type, istW!==null?istW:'—', istH!==null?istH:'—',
        ko.w!==null?Math.round(ko.w):'—', sabH!==null?sabH:'—']);
    });
  });
  return out;
}

// Excel çıktısı için: yalnızca SABİT ölçüler (imalat kesim değerleri)
function getSabitRows(r){
  const out = [];
  const fc = codeOfDef(r.def);
  r.colResults.forEach((c,ci)=>{
    c.panels.forEach((p,pi)=>{
      if(p.bos || p.covered) return; // Boş Alan ve birleşik kapağın kapladığı hücre kesim listesine girmez
      const ko = kesimOlcusu(p);
      const g = ko.w!==null ? Math.round(ko.w) : 'ÖLÇÜ EKSİK';
      const y = ko.h!==null ? Math.round(ko.h) : 'ÖLÇÜ EKSİK';
      // Çizim yönü dikeyse tipin yanına yazılır — ölçü sütunları yüzün kendi ekseninde
      // kalır (fiziksel açıklık), takas yalnız çizime gider. Yatayda satır değişmez.
      out.push([fc+'-B'+(ci+1)+'K'+(pi+1), p.type + (p.yon==='dikey' ? ' (dikey)' : ''), g, y]);
    });
  });
  return out;
}

// ---------- CİHAZ GENELİ TAKVİYE ÖZETİ ----------
// KÖŞE (KASA) PROFİLİ — modül başına 12 ayrıt: L/H/W eksenlerinin her birinde 4 profil.
// Boy = eksen ölçüsü − 2×köşe plastiği. Ekran özeti, Excel ÖZET sayfası ve Analiz'in
// kesim planı bu TEK kaynaktan beslenir; üç yerde ayrı yazılsaydı biri değişince
// diğerleri sessizce ayrışırdı.
function koseProfilKalemleri(){
  const V = getV();
  const map = new Map();     // boy → adet
  let eksik = 0;             // ölçüsü girilmemiş eksen sayısı × 4
  state.modules.forEach(md=>{
    ['L','H','W'].forEach(k=>{
      if(md[k]>0){ const boy = md[k]-2*V.kose; map.set(boy,(map.get(boy)||0)+4); }
      else eksik += 4;
    });
  });
  const kalemler = [...map.entries()].sort((a,b)=>b[0]-a[0]).map(([boy,adet])=>({boy, adet}));
  return {kalemler, eksik, modulSayisi: state.modules.length};
}

function collectTakviyeRows(){
  const rows = [];      // {face, tip, yon, kaynak, adet, boy|null}
  const missing = [];
  state.modules.forEach((md, m)=>{
    withModule(m, ()=>{
      FACE_DEFS.forEach((def, fi)=>{
        const r = computeFace(fi);
        if(r.kapaksiz) return;
        const faceName = 'M'+(m+1)+' '+def.name;
        r.takviyeRecords.forEach(t=>{
          rows.push({face:faceName, tip:t.tip, yon:t.yon, kaynak:t.kaynak, adet:t.adet, boy:t.boy});
          if(t.boy===null) missing.push(faceName+' '+t.kaynak+': ölçü eksik');
        });
        (r.barWarnings||[]).forEach(w=>{ missing.push(faceName+': '+w); });
      });
      // ARA KAT — FACE_DEFS döngüsünün DIŞINDA, ayrı adım. Kayıtlar arakat:true taşır;
      // sipariş listesinde ayrı aile olarak gruplanır (kare profil, kaynak birleşim).
      const ak = araKatOf(md);
      if(ak.aktif){
        const ra = computeFace(ARAKAT_FI);
        const akName = 'M'+(m+1)+' ARA KAT';
        ra.takviyeRecords.forEach(t=>{
          rows.push({face:akName, tip:t.tip, yon:t.yon, kaynak:t.kaynak, adet:t.adet, boy:t.boy,
                     arakat:true, profil:t.profil});
          if(t.boy===null) missing.push(akName+' '+t.kaynak+': ölçü eksik');
        });
        (ra.barWarnings||[]).forEach(w=>{ missing.push(akName+': '+w); });
      }
    });
  });
  return {rows, missing};
}

// Ara kat parçaları PROFİL + boy bazında gruplanır; 50/60 takviyeyle aynı kaleme girmez.
function groupAraKatSiparis(rows){
  const map = new Map();
  let skipped = 0;
  rows.forEach(x=>{
    if(x.boy===null){ skipped += x.adet; return; }
    const key = (x.profil||'—')+'|'+Math.round(x.boy);
    if(!map.has(key)) map.set(key, {profil:x.profil||'—', boy:Math.round(x.boy), adet:0});
    map.get(key).adet += x.adet;
  });
  const groups = [...map.values()].sort((a,b)=> a.profil.localeCompare(b.profil,'tr') || b.boy-a.boy);
  groups.forEach(g=>{ g.metre = Number((g.boy*g.adet/1000).toFixed(2)); });
  return {groups, skipped};
}

// SİPARİŞ listesi gruplaması — ekran ve Excel TEK kaynaktan beslenir.
// YALNIZCA boya göre gruplanır: ana/ara ve yatay/dikey ayrımı burada anlamsızdır (hepsi aynı
// takviye profilinden kesilir), ad ayrımı korunsaydı aynı ölçüdeki barlar ayrı satırlarda
// kalır ve toplanamazdı. Hangi takviyenin nereye gittiği detay tablosunda durur.
function groupTakviyeSiparis(rows){
  const map = new Map();
  let skipped = 0;
  rows.forEach(x=>{
    if(x.boy===null){ skipped += x.adet; return; }
    const key = Math.round(x.boy);
    if(!map.has(key)) map.set(key, {boy:key, adet:0});
    map.get(key).adet += x.adet;
  });
  const groups = [...map.values()].sort((a,b)=> b.boy-a.boy);
  groups.forEach(g=>{ g.metre = Number((g.boy*g.adet/1000).toFixed(2)); });
  return {groups, skipped};
}

// Tüm AHU/modül/yüzleri tarar; kapaksız olmayıp &quot;good&quot; durumda olmayan (eksik/fazla ölçü,
// hizalanmamış bölüm, takviye uyarısı vb.) her yüzü toplar. Üstteki her-zaman-görünür rozet
// ve DXF/Excel çıktısından önceki engelleme kontrolü aynı bu fonksiyonu kullanır.
function collectFaceIssues(){
  const issues = [];
  const origActiveAhu = state.activeAhu;
  state.ahus.forEach((ahu, ai)=>{
    state.activeAhu = ai;
    const ahuLabel = ahu.ad || ('AHU-'+(ai+1));
    state.modules.forEach((md, m)=>{
      withModule(m, ()=>{
        FACE_DEFS.forEach((def, fi)=>{
          const r = computeFace(fi);
          if(r.kapaksiz) return;
          if(r.status.cls !== 'good') issues.push({ahu:ahuLabel, mod:'M'+(m+1), face:def.name, text:r.status.text});
        });
        // Ara kat da aynı kapıdan geçer — hatalıysa Excel/DXF kilitlenir. Kapalı ara kat
        // hiç hesaba katılmaz (yüz döngüsünün DIŞINDA, ayrı adım).
        if(araKatOf(md).aktif){
          const ra = computeFace(ARAKAT_FI);
          if(ra.status.cls !== 'good') issues.push({ahu:ahuLabel, mod:'M'+(m+1), face:ARAKAT_DEF.name, text:ra.status.text});
        }
        // Batarya kızağı da aynı kapıdan geçer.
        if(kizakOf(md).aktif){
          const ko = kizakOlculeri();
          if(!ko.gecerli) issues.push({ahu:ahuLabel, mod:'M'+(m+1), face:KIZAK_DEF.name,
            text: (ko.eksik.length ? ko.eksik : ko.hatalar).join('  |  ')});
        }
        // Eşanjör de aynı kapıdan geçer: eksik/geçersiz ölçü DXF ve Excel'i kilitler.
        if(esanjorOf(md).aktif){
          const eo = esanjorOlculeri();
          if(!eo.gecerli) issues.push({ahu:ahuLabel, mod:'M'+(m+1), face:ESANJOR_DEF.name,
            text: (eo.eksik.length ? eo.eksik : eo.hatalar).join('  |  ')});
        }
      });
    });
  });
  state.activeAhu = origActiveAhu;
  return issues;
}

}

function renderGlobalSummary(){
  renderIssuesBadge();
  // 3B İSKELET — 12 ayrıt: 4×W, 4×H, 4×L (ayrıtlar yüzler arasında paylaşılır, bir kez sayılır)
  const V = getV();
  const frameEl = document.getElementById('gsum_frame');
  if(frameEl){
    const kp = koseProfilKalemleri();
    const N = kp.modulSayisi, missingDim = kp.eksik;
    let frameRows = '';
    kp.kalemler.forEach(({boy,adet})=>{
      frameRows += `<tr><td>Köşe Profili</td><td>${adet}</td><td>${boy.toFixed(0)}</td><td>${(adet*boy/1000).toFixed(2)}</td><td>Eksen ölçüsü − 2×Köşe Plastik</td></tr>`;
    });
    if(missingDim>0) frameRows += `<tr><td>Köşe Profili</td><td>${missingDim}</td><td>⚠</td><td>—</td><td>Modül ölçüleri eksik</td></tr>`;
    frameRows += `<tr><td>Köşe Plastiği (3 yönlü)</td><td>${8*N}</td><td>—</td><td>—</td><td>Modül başına 8</td></tr>`;
    frameEl.innerHTML = frameRows;
  }

  const {rows, missing} = collectTakviyeRows();
  // KAPAKLAR (SABİT) — tüm modüller, tip + ölçü bazında gruplu; Boğaz/Damper ayrı listede
  const gk = document.getElementById('global_kapak');
  const gbd = document.getElementById('global_bogazdamper');
  if(gk){
    const kmap = new Map();
    const bdMap = new Map();
    const say = (rk)=>{
      if(!rk || rk.kapaksiz) return;
      rk.colResults.forEach(c=>c.panels.forEach(p=>{
        if(p.bos || p.covered) return;
        const w = p.sabitW!==null ? Math.round(p.sabitW) : 'ÖLÇÜ EKSİK';
        const h = p.sabitH!==null ? Math.round(p.sabitH) : 'ÖLÇÜ EKSİK';
        const key = p.type+'|'+w+'|'+h;
        const map = isEleman(p.type) ? bdMap : kmap;
        map.set(key, (map.get(key)||0)+1);
      }));
    };
    state.modules.forEach((md,m)=>{
      withModule(m, ()=>{
        FACE_DEFS.forEach((_,fi)=>{ say(computeFace(fi)); });
        // Ara kat gözleri de özete girer (paneller kapak listesine, damperler eleman listesine)
        if(araKatOf(md).aktif) say(computeFace(ARAKAT_FI));
      });
    });
    gk.innerHTML = [...kmap.entries()]
      .sort((a,b)=>a[0].localeCompare(b[0],'tr'))
      .map(([key,adet])=>{
        const kp = key.split('|');
        return `<tr><td>${kp[0]}</td><td>${kp[1]}</td><td>${kp[2]}</td><td>${adet}</td></tr>`;
      }).join('') || `<tr><td colspan=&quot;4&quot; style=&quot;color:var(--muted);&quot;>Henüz kapak tanımlanmadı</td></tr>`;
    if(gbd) gbd.innerHTML = [...bdMap.entries()]
      .sort((a,b)=>a[0].localeCompare(b[0],'tr'))
      .map(([key,adet])=>{
        const kp = key.split('|');
        return `<tr><td>${kp[0]}</td><td>${kp[1]}</td><td>${kp[2]}</td><td>${adet}</td></tr>`;
      }).join('') || `<tr><td colspan=&quot;4&quot; style=&quot;color:var(--muted);&quot;>Henüz boğaz/damper tanımlanmadı</td></tr>`;
  }

  const detail = document.getElementById('gsum_detail');
  const group = document.getElementById('gsum_group');
  const note = document.getElementById('gsum_note');
  if(!detail) return;
  render3D();

  // Ara kat profilleri AYRI aile — 50/60 takviyeyle aynı kaleme girmez, kendi bölümünde durur.
  const akRows = rows.filter(x=>x.arakat);
  const takRows = rows.filter(x=>!x.arakat);
  const akWrap = document.getElementById('gsum_arakat_wrap');
  if(akWrap){
    akWrap.style.display = akRows.length ? '' : 'none';
    if(akRows.length){
      document.getElementById('gsum_arakat_detail').innerHTML = akRows.map(x=>
        `<tr><td>${x.face}</td><td>${x.yon} ${x.tip}</td><td>${x.profil||'—'}</td><td>${x.kaynak}</td><td>${x.adet}</td><td>${x.boy!==null?x.boy.toFixed(0):'⚠ ölçü eksik'}</td></tr>`
      ).join('');
      const ag = groupAraKatSiparis(akRows);
      document.getElementById('gsum_arakat_group').innerHTML = ag.groups.map(g=>
        `<tr><td>${g.profil}</td><td>${g.boy}</td><td>${g.adet}</td><td>${g.metre.toFixed(2)}</td></tr>`
      ).join('') || '<tr><td colspan=&quot;4&quot;>—</td></tr>';
    }
  }

  if(takRows.length===0){
    detail.innerHTML = '<tr><td colspan=&quot;5&quot;>Henüz takviye eklenmedi — görselde ara boşluklara tıklanarak eklenir</td></tr>';
    group.innerHTML = '<tr><td colspan=&quot;3&quot;>—</td></tr>';
    note.textContent = '';
    return;
  }

  detail.innerHTML = takRows.map(x=>
    `<tr><td>${x.face}</td><td>${x.yon} ${x.tip}</td><td>${x.kaynak}</td><td>${x.adet}</td><td>${x.boy!==null?x.boy.toFixed(0):'⚠ ölçü eksik'}</td></tr>`
  ).join('');

  const {groups, skipped} = groupTakviyeSiparis(takRows);
  group.innerHTML = groups.map(g=>
    `<tr><td>${g.boy}</td><td>${g.adet}</td><td>${g.metre.toFixed(2)}</td></tr>`
  ).join('') || '<tr><td colspan=&quot;3&quot;>—</td></tr>';

  const _kat = aktifAdet();
  let noteTxt = (_kat > 1 ? 'Bu santralden ' + _kat + ' cihaz üretilecek — aşağıdaki listeler BİR cihaz içindir; '
    + 'toplam (×' + _kat + ') Excel çıktısında ayrı sütunda, satın alma miktarları Analiz dosyasındadır. ' : '')
    + 'Boylar otomatik türetilir: Ana Takviye = dik eksen − 2×Kenar − 2×Takviye Plastik (boydan boya); kesilmişse her segment kendi bant yüksekliğinden. Ara Takviye = o satırdaki gerçek kaplama − 2×Takviye Plastik; birleşik (zincir) barlarda kapsadığı tüm bölümler + aradaki ana takviyeler tek parça sayılır. Sipariş listesinde ana/ara ve yatay/dikey ayrımı yapılmaz — kesit aynıdır, aynı boydakiler tek kalemde toplanır.';
  if(skipped>0) noteTxt = '⚠ '+skipped+' adet takviye eksik ölçü nedeniyle sipariş listesine dahil edilemedi. '+noteTxt;
  if(missing.length>0) noteTxt += ' Eksikler: '+[...new Set(missing)].join('; ')+'.';
  note.textContent = noteTxt;
}

function renderAhuTabs(){
  const bar = document.getElementById('ahutabs');
  if(!bar) return;
  bar.innerHTML = '';
  // &quot;Santral Adı&quot; ve &quot;İç Sac&quot; alanlarını aktif AHU'ya eşitle
  const adEl = document.getElementById('prj_ad');
  if(adEl) adEl.value = state.ahus[state.activeAhu].ad || '';
  const icSacEl = document.getElementById('prj_icsac');
  if(icSacEl) icSacEl.value = state.ahus[state.activeAhu].malzeme || '';
  // Üretim adedi de aktif AHU'ya aittir (santral bazında) — ad/iç sac ile aynı kural.
  const adetEl = document.getElementById('prj_adet');
  const kat = aktifAdet();
  if(adetEl && document.activeElement !== adetEl) adetEl.value = kat;
  const adetNot = document.getElementById('prj_adet_not');
  if(adetNot) adetNot.textContent = kat > 1
    ? 'Bu santralden ' + kat + ' cihaz üretilecek — DXF, sac serme ve analiz ' + kat + ' katı sayar.'
    : 'Aynı santralden kaç cihaz üretilecek. DXF ve analiz bu sayıyla çarpılır.';
  state.ahus.forEach((ahu, i)=>{
    const tab = document.createElement('div');
    tab.className = 'tab'+(i===state.activeAhu?' active':'');
    tab.dataset.ahutab = i;
    tab.style.cssText = 'display:flex;align-items:center;gap:4px;cursor:pointer;';
    const nameSpan = document.createElement('span');
    nameSpan.textContent = ahu.ad || ('AHU-'+(i+1));
    nameSpan.dataset.ahuname = i;
    nameSpan.title = 'Çift tıkla: yeniden adlandır';
    tab.appendChild(nameSpan);
    if(ahuAdet(ahu) > 1){
      const kt = document.createElement('span');
      kt.style.cssText = 'color:var(--warn);font-weight:700;flex-shrink:0;';
      kt.title = ahuAdet(ahu) + ' adet üretilecek';
      kt.textContent = '×' + ahuAdet(ahu);
      tab.appendChild(kt);
    }
    if(state.ahus.length > 1){
      const del = document.createElement('span');
      del.dataset.ahudel = i;
      del.style.cssText = 'color:var(--bad);padding:0 2px;flex-shrink:0;';
      del.title = 'AHU sil';
      del.textContent = '✕';
      tab.appendChild(del);
    }
    bar.appendChild(tab);
  });
}
