// Yüz → eksen/yön eşlemesi (modül ekleme ve birleşim tespiti için)
const FACE_ATT = [
  {axis:'z', dir:+1},  // ÖN
  {axis:'z', dir:-1},  // ARKA
  {axis:'y', dir:+1},  // ÜST
  {axis:'y', dir:-1},  // ALT
  {axis:'x', dir:-1},  // SOL
  {axis:'x', dir:+1}   // SAĞ
];
const EXT_KEY = {x:'L', y:'H', z:'W'};
function modExt(md, axis){ const v = md[EXT_KEY[axis]]; return v>0 ? v : PH3[EXT_KEY[axis]]; }
function modExtAll(md){ return {x:modExt(md,'x'), y:modExt(md,'y'), z:modExt(md,'z')}; }

// İki modül gerçek bir YÜZDEN mi temas ediyor? Kural: bir eksende yüzeyler çakışık
// (temas), diğer İKİ eksende gerçek örtüşme. Kenar/köşe teması (iki eksende birden
// yüzey çakışması) bağ SAYILMAZ — çapraz komşu birlikte kaymamalı.
function faceContact(A, aExt, B, bExt){
  const eps = 0.5;
  let temas = 0, ortusme = 0;
  for(const a of ['x','y','z']){
    const a0 = A.pos[a], a1 = a0 + aExt[a];
    const b0 = B.pos[a], b1 = b0 + bExt[a];
    if(a0 < b1-eps && b0 < a1-eps) ortusme++;
    else if(Math.abs(a1-b0) <= eps || Math.abs(b1-a0) <= eps) temas++;
    else return false;   // o eksende ayrıklar → temas yok
  }
  return ortusme === 2 && temas === 1;
}

// md, `axis` ekseninde büyüyünce/küçülünce onunla BİRLİKTE kayması gereken modüller.
// İki şart birden: (1) büyüme düzleminin ötesinde olmak, (2) md'ye yüz temasıyla —
// gerekirse aracı modüller üzerinden — bağlı olmak. Zincir şart: M2'nin ÜSTÜNDEKİ M3,
// M1 büyüyüp M2'yi ittiğinde M2 ile birlikte gitmeli, yoksa havada kalır.
function itilecekModuller(md, axis, oldExt){
  const eps = 0.5;
  const mdExt = modExtAll(md); mdExt[axis] = oldExt;   // ESKİ geometri
  const plane = md.pos[axis] + oldExt;
  const aday = state.modules.filter(B=> B!==md && B.pos[axis] >= plane - eps);
  const kume = [], kaynak = [{m:md, ext:mdExt}];
  let changed = true;
  while(changed){
    changed = false;
    for(let i=aday.length-1; i>=0; i--){
      const B = aday[i], bExt = modExtAll(B);
      if(kaynak.some(s=> faceContact(s.m, s.ext, B, bExt))){
        kume.push(B); kaynak.push({m:B, ext:bExt});
        aday.splice(i,1); changed = true;
      }
    }
  }
  return kume;
}

// Bir yüze tıklanınca o yönde yeni modül: ölçüler komşudan kopyalanır (sonradan düzenlenebilir), konum bitişik
function addModuleAt(m, fi){
  const nb = state.modules[m];
  const att = FACE_ATT[fi];
  const nm = newModule();
  nm.L = nb.L; nm.H = nb.H; nm.W = nb.W;
  nm.pos = {x:nb.pos.x, y:nb.pos.y, z:nb.pos.z};
  nm.pos[att.axis] += att.dir>0 ? modExt(nb, att.axis) : -modExt(nm, att.axis);
  nm.attAxis = att.axis; nm.attDir = att.dir;

  // Çakışma çözümü: MEVCUT modüller ASLA kaymaz — uyum sağlayan yeni gelendir.
  // Yan yüzlerde (x/z) yeni modül tıklanan yüze YAPIŞIK kalır ve önündeki engelin
  // ÜSTÜNE çıkar: alçak bir komşunun yanına eklerken onun üstüne biner, montajın
  // dışına fırlamaz. Üst/alt yüze eklerken çözüm ekseni zaten y'dir, kendi yönünde
  // ilerler (üst üste istiflenir).
  const ax = att.axis;
  const cozDir = ax === 'y' ? att.dir : 1;   // yan yüzlerde tek çıkış yolu: yukarı
  const eps = 0.5;
  let changed = true, guard = 0;
  while(changed && guard++ < 200){
    changed = false;
    state.modules.forEach(B=>{
      const bE = {x:modExt(B,'x'), y:modExt(B,'y'), z:modExt(B,'z')};
      const nE = {x:modExt(nm,'x'), y:modExt(nm,'y'), z:modExt(nm,'z')};
      const overlaps = ['x','y','z'].every(a=>
        nm.pos[a] < B.pos[a]+bE[a]-eps && B.pos[a] < nm.pos[a]+nE[a]-eps);
      if(overlaps){
        nm.pos.y = cozDir>0 ? B.pos.y+bE.y : B.pos.y-nE.y;
        changed = true;
      }
    });
  }

  state.modules.push(nm);
  state.active = state.modules.length-1;
  renderAll();
}

// AABB çakışma denetimi: iki modül üç eksende de iç içe geçiyorsa (temas hariç) çakışmadır
function detectCollisions(){
  const out = [];
  const eps = 0.5;
  for(let i=0; i<state.modules.length; i++){
    for(let j=i+1; j<state.modules.length; j++){
      const A = state.modules[i], B = state.modules[j];
      const aE = {x:modExt(A,'x'), y:modExt(A,'y'), z:modExt(A,'z')};
      const bE = {x:modExt(B,'x'), y:modExt(B,'y'), z:modExt(B,'z')};
      const hit = ['x','y','z'].every(a=>
        A.pos[a] < B.pos[a]+bE[a]-eps && B.pos[a] < A.pos[a]+aE[a]-eps);
      if(hit) out.push([i,j]);
    }
  }
  return out;
}

// Yüz, başka bir modülün eş-düzlemli karşı yüzü tarafından TAM örtülüyorsa iç birleşimdir → çizilmez
function faceMated(m, fi){
  const A = state.modules[m];
  const att = FACE_ATT[fi];
  const aExt = {x:modExt(A,'x'), y:modExt(A,'y'), z:modExt(A,'z')};
  const plane = A.pos[att.axis] + (att.dir>0 ? aExt[att.axis] : 0);
  const tang = ['x','y','z'].filter(a=>a!==att.axis);
  const eps = 0.5;
  return state.modules.some((B,bi)=>{
    if(bi===m) return false;
    const bExt = {x:modExt(B,'x'), y:modExt(B,'y'), z:modExt(B,'z')};
    const bPlane = B.pos[att.axis] + (att.dir>0 ? 0 : bExt[att.axis]);
    if(Math.abs(bPlane-plane)>eps) return false;
    return tang.every(a=> B.pos[a] <= A.pos[a]+eps && B.pos[a]+bExt[a] >= A.pos[a]+aExt[a]-eps);
  });
}

// Yüzün YÜKSEKLİK ekseninde (0 = modülün altı) komşu modüllerin kapladığı ÜST sınır.
// faceMated TAM örtüşme arar (komşu yüzü bütünüyle kapatmalı); bu ise KISMİ örtüşmeyi de
// verir — KS-10'da M1 (H=1740) ile M2 (H=870) yan yana, yüzün alt 870 mm'si kapalıdır.
// Cenk (29.08.2026): «birbirine denk gelen yüzler boş olmalı — bu cihazların içinde hava
// akışı var, geçemez.» Yalnız DÜŞEY yüzler (SOL/SAĞ/ÖN/ARKA) için anlamlıdır ve komşunun
// tabandan başlaması aranır; yandaki eksende tam örtüşme şartı korunur.
function faceMateHi(m, fi){
  const A = state.modules[m];
  const att = FACE_ATT[fi];
  if(att.axis === 'y') return 0;
  const aExt = {x:modExt(A,'x'), y:modExt(A,'y'), z:modExt(A,'z')};
  const plane = A.pos[att.axis] + (att.dir>0 ? aExt[att.axis] : 0);
  const yan = (att.axis === 'x') ? 'z' : 'x';
  const eps = 0.5;
  let hi = 0;
  state.modules.forEach(function(B, bi){
    if(bi === m) return;
    const bExt = {x:modExt(B,'x'), y:modExt(B,'y'), z:modExt(B,'z')};
    const bPlane = B.pos[att.axis] + (att.dir>0 ? 0 : bExt[att.axis]);
    if(Math.abs(bPlane-plane) > eps) return;
    if(!(B.pos[yan] <= A.pos[yan]+eps && B.pos[yan]+bExt[yan] >= A.pos[yan]+aExt[yan]-eps)) return;
    if(B.pos.y > A.pos.y + eps) return;
    const t = B.pos.y + bExt.y - A.pos.y;
    if(t > hi) hi = t;
  });
  return Math.min(hi, aExt.y);
}

// Yüz kısa kodları — kapak adlandırmasında yüz ayrımı için (örn. ÖN-B1K1)

function syncStructure(face){
  const needCG = Math.max(face.columns.length-1, 0);
  while(face.colGaps.length < needCG) face.colGaps.push(true);   // otomatik: yeni ara = takviyeli (boğaz bitişiği dahil)
  face.colGaps.length = needCG;

  // GÖÇ: eski anaSplit[i] boolean'ı → anaSplitLevels[i] seviye listesi. true = &quot;hizalı TÜM
  // seviyelerden kes&quot; demekti; o seviyeler ancak computeFace içinde (sharedGapLevels ile)
  // bilindiğinden burada '*' işareti olarak taşınır, computeFace'te gerçek listeye açılır.
  if(!Array.isArray(face.anaSplitLevels)){
    const old = Array.isArray(face.anaSplit) ? face.anaSplit : [];
    face.anaSplitLevels = old.map(v=> v ? '*' : []);
  }
  while(face.anaSplitLevels.length < needCG) face.anaSplitLevels.push([]); // yeni ana takviye: sürekli
  face.anaSplitLevels.length = needCG;

  // GÖÇ: tekil seçim alanları → çoklu seçim listeleri
  if(!Array.isArray(face.selectedCells)) face.selectedCells = face.selected ? [face.selected] : [];
  if(!Array.isArray(face.selectedBars))  face.selectedBars  = face.selectedBar ? [face.selectedBar] : [];

  face.columns.forEach((col, ci)=>{
    const needIG = Math.max(col.panels.length-1, 0);
    while(col.innerGaps.length < needIG) col.innerGaps.push(true); // otomatik: yeni ara = takviyeli
    col.innerGaps.length = needIG;
    if(!col.araJoinNext) col.araJoinNext = [];
    while(col.araJoinNext.length < needIG) col.araJoinNext.push(false); // yeni ara takviye varsayılan: segmentli (birleşmemiş)
    col.araJoinNext.length = needIG;
    // colSpan: tanımsız/bozuksa 1; sağda o kadar bölüm kalmadıysa kırp
    col.panels.forEach(p=>{
      const n = Math.round(Number(p.colSpan)||1);
      p.colSpan = Math.max(1, Math.min(n, face.columns.length - ci));
      // spanSize (elle girilmiş birleşim genişliği) yalnız birleşik kapakta anlamlıdır.
      // Birleşim çözülür ya da kırpılırsa temizlenir; aksi halde tek kapak, iki bölüm
      // genişliğinde bir ölçüyle geri dönerdi.
      if(p.colSpan === 1 && p.spanSize) p.spanSize = 0;
      // Çizim yönü yalnız yönlü elemanda (Damper/Boğaz) ve yalnız 'dikey' değeriyle
      // anlamlıdır — başka her durumda alan tamamen DÜŞER. Böylece yatay (varsayılan)
      // projelerin JSON'u eskisiyle bayt bayt aynı kalır ve gidiş-dönüş sabit nokta olur.
      if(p.yon !== undefined && !(isYonlu(p.type) && p.yon === 'dikey')) delete p.yon;
      // elemanOlcu (tam bogazda cizimdeki kesim olcusu) yalniz ELEMAN gozunde ve
      // gecerli olcuyle anlamlidir — baska her durumda DUSER ki JSON gidis-donusu
      // sabit nokta kalsin.
      if(p.elemanOlcu !== undefined && !(isEleman(p.type) && p.elemanOlcu
         && Number(p.elemanOlcu.w) > 0 && Number(p.elemanOlcu.h) > 0)) delete p.elemanOlcu;
      // delik yalniz KAPAK panelinde (eleman/bos degil) ve gecerli olcuyle anlamlidir
      if(p.delik !== undefined && !(gecerliDelik(p) && !isEleman(p.type) && !isBos(p.type)))
        delete p.delik;
    });
  });

  // Bölüm/kapak silinince geçersiz kalan kesim seviyelerini ve seçimleri bud
  face.anaSplitLevels = face.anaSplitLevels.map((lv, i)=>{
    if(lv === '*') return '*';
    const maxIdx = (face.columns[i] ? face.columns[i].panels.length : 1) - 2;
    return (Array.isArray(lv) ? lv : []).filter(ix => ix>=0 && ix<=maxIdx);
  });
  face.selectedCells = face.selectedCells.filter(s => face.columns[s.col] && face.columns[s.col].panels[s.idx]);
  face.selectedBars  = face.selectedBars.filter(b => b.kind==='ana'
    ? b.i < needCG
    : (face.columns[b.ci] && b.gi < face.columns[b.ci].innerGaps.length));
}

// İki BİTİŞİK bölümün ara takviye seviyelerini kümülatif yüksekliğe göre eşleştirir
// (index eşitliğine değil — farklı kapak sayılı bölümler de hizalanabilir).
// Dönüş: [{idxA, idxB, cum}] — her ikisinde de açık bir innerGaps olup üst üste
// (±0.51mm) gelen her sınır için bir kayıt. Hiç eşleşme yoksa boş dizi (örn. hiç
// bölünmemiş, tek kapaklı bir komşu bölüm — o taraftan hizalanacak bir şey yok).
function sharedGapLevels(colResA, faceColA, colResB, faceColB){
  function boundaries(colRes, faceCol){
    const out = []; let cum = 0;
    colRes.panels.forEach((p, idx)=>{
      cum += p.eff;
      if(idx < faceCol.innerGaps.length && faceCol.innerGaps[idx]) out.push({idx, cum});
    });
    return out;
  }
  const A = boundaries(colResA, faceColA), B = boundaries(colResB, faceColB);
  const shared = [];
  A.forEach(a=>{
    const m = B.find(b=>Math.abs(a.cum-b.cum)<=0.51);
    if(m) shared.push({idxA:a.idx, idxB:m.idx, cum:a.cum});
  });
  return shared;
}

// Bölüm başlangıçlarını SATIR BAZINDA çözer. Kesilmiş bir ANA takviye, kesildiği her
// seviyede kendi X'ini değiştirebilir (kademeli/zigzag sınır); junction'lar soldan sağa
// ZİNCİRLEME çözüldüğü için ART ARDA gelen kademeler de birbirini taşır — böylece her
// satır kendi genişlik dağılımını taşıyabilir (üst satır 500/600/660, alt 600/600/560 gibi).
// Birim bağımsızdır: mm (hesap/3B) ve px (SVG; min-piksel ve yer tutucular dahil) aynı kodu kullanır.
//   widthOf(ci,pi) → hücrenin along-eksen ölçüsü
//   colWidthOf(ci) → bölümün kendi ölçüsü (segmentte hiç katkı veren hücre yoksa yedek)
//   gapW           → ana takviye kalınlığı (aynı birimde)
//   autoEnd        → yüzün iç bitiş noktası; SON bölümde ölçüsü girilmemiş bir hücre, kendi
//                    SATIRINDA kalan boşluğu doldurur (dik eksendeki &quot;oto&quot; kuralının aynısı).
//                    Yalnız solundaki tüm hücreler girilmişse devreye girer.
// Dönüş: start[ci][pi] (hücre along-başlangıcı), junctionX[i][seg] (ana takviye X'leri),
//        segOfL (segment haritası), inconsistent (uyarı için),
//        endMax/endMin, autoWidth[pi] (son bölümde otomatik doldurulan genişlikler).
function resolveColumnLayout(colResults, face, anaBars, widthOf, colWidthOf, gapW, autoEnd){
  const TOL = 0.51;
  const n = colResults.length;
  const start = colResults.map(c=>new Array(c.panels.length).fill(0));
  const junctionX = [], segOfL = [], inconsistent = [];
  const autoWidth = new Array(colResults[n-1].panels.length).fill(null);
  // complete[ci][pi] = bu hücrenin SOLUNDAKİ her şey gerçek ölçüyle girilmiş mi (satır bazında).
  // Otomatik doldurma yalnız bu doğruysa yapılır — aksi halde eksik veri &quot;TAM OTURDU&quot; gibi görünürdü.
  const complete = colResults.map(c=>new Array(c.panels.length).fill(true));
  // Bir hücrenin SAĞ kenarı — yalnızca o junction'da BİTİYORSA katkı verir. Yayılan (colSpan>1)
  // hücre aradaki junction'ları geçer ve kendi son bölümünde (spanLast) sayılır.
  // real=false → ölçüsü henüz girilmemiş; hizasızlık uyarısında dikkate alınmaz.
  function edgeOf(ci, pi){
    const p = colResults[ci].panels[pi];
    if(p.covered){
      if(!p.spanLast || !p.spanOwner) return null;      // birleşimin ortası: junction geçiliyor
      const o = p.spanOwner, w = widthOf(o.col, o.idx);
      return {e: start[o.col][o.idx] + w, real: w > 0, complete: w > 0 && complete[o.col][o.idx]};
    }
    if(p.spanN > 1) return null;                        // sağa taşıyor; son bölümünde sayılacak
    const w = widthOf(ci, pi);
    if(w <= 0 && ci === n-1 && autoEnd != null && complete[ci][pi]){
      const aw = Math.max(autoEnd - start[ci][pi], 0);  // satırda kalan boşluk
      autoWidth[pi] = aw;
      return {e: start[ci][pi] + aw, real: true, complete: true};
    }
    return {e: start[ci][pi] + w, real: w > 0, complete: w > 0 && complete[ci][pi]};
  }
  for(let i=0; i<n-1; i++){
    const b = anaBars[i];
    const cuts = (b && b.staggerable) ? b.cutLevels : [];
    const segCount = cuts.length + 1;
    let s = 0;
    const mapL = colResults[i].panels.map((p,pi)=>{ const v=s; if(cuts.indexOf(pi)>=0) s++; return v; });
    const cutsB = cuts.map(ix=>{ const l = b.levels.find(L=>L.idxA===ix); return l ? l.idxB : -1; });
    s = 0;
    const mapR = colResults[i+1].panels.map((p,pj)=>{ const v=s; if(cutsB.indexOf(pj)>=0) s++; return v; });

    const hi = new Array(segCount).fill(null), lo = new Array(segCount).fill(null);
    const compAt = new Array(segCount).fill(false);   // segmentin sağ kenarını belirleyen hücre eksiksiz mi
    colResults[i].panels.forEach((p,pi)=>{
      const c = edgeOf(i, pi);
      if(!c) return;
      const sg = Math.min(mapL[pi], segCount-1);
      if(hi[sg]===null || c.e>hi[sg]){ hi[sg]=c.e; compAt[sg]=c.complete; }
      if(c.real && (lo[sg]===null || c.e<lo[sg])) lo[sg]=c.e;
    });
    // Tamamen birleşik kapağın altında kalan segmentte bar zaten çizilmez; yine de bir X gerekir
    let fb = 0;
    colResults[i].panels.forEach((p,pi)=>{ const v = start[i][pi] + colWidthOf(i); if(v>fb) fb=v; });
    let bad = false;
    for(let k=0;k<segCount;k++){
      if(hi[k]===null){ hi[k] = fb; lo[k] = fb; }
      else if(lo[k]!==null && hi[k]-lo[k] > TOL) bad = true;
    }
    junctionX.push(hi); segOfL.push(mapL);
    inconsistent.push(bad);
    const g = face.colGaps[i] ? gapW : 0;
    colResults[i+1].panels.forEach((p,pj)=>{
      const sg = Math.min(mapR[pj], segCount-1);
      start[i+1][pj] = hi[sg] + g;
      complete[i+1][pj] = compAt[sg];
    });
  }
  let endMax = null, endMin = null;
  colResults[n-1].panels.forEach((p,pi)=>{
    const c = edgeOf(n-1, pi);
    if(!c) return;
    if(endMax===null || c.e>endMax) endMax = c.e;
    if(c.real && (endMin===null || c.e<endMin)) endMin = c.e;
  });
  if(endMax===null){
    endMax = 0;
    colResults[n-1].panels.forEach((p,pi)=>{ const v = start[n-1][pi] + colWidthOf(n-1); if(v>endMax) endMax=v; });
  }
  if(endMin===null) endMin = endMax;
  // Bir hücrenin along-eksen SAĞ kenarı: ara bölümlerde o banttaki ANA TAKVİYE'nin durduğu
  // yer, son bölümde hücrenin kendi kenarı. Ara takviye boyu buradan okunur — böylece
  // bölüm maksimumuna (colSize) hiç bağlı kalmaz; birleşik kapağın KAPLADIĞI hücrenin
  // kendi (artık anlamsız) ölçüsü bar boyunu şişiremez.
  function rightAt(ci, pi){
    if(ci < n-1) return junctionX[ci][Math.min(segOfL[ci][pi], junctionX[ci].length-1)];
    const c = edgeOf(ci, pi);
    return c ? c.e : start[ci][pi] + colWidthOf(ci);
  }
  return {start, junctionX, segOfL, inconsistent, endMax, endMin, rightAt, autoWidth};
}

function computeFace(fi){
  const def = faceDefOf(fi);
  const face = faceOf(fi);
  syncStructure(face);
  const V = vOf(fi);
  const faceW = Number(state.dims[def.wKey])||0;
  const faceH = Number(state.dims[def.hKey])||0;
  const orient = face.orient;

  const alongDim  = orient==='H' ? faceW : faceH;   // bölüm dizilim ekseni
  const acrossDim = orient==='H' ? faceH : faceW;   // bölüm içi dizilim ekseni
  const tolAlong  = orient==='H' ? V.tolW : V.tolH; // bölüm ölçüsü = genişlik (H) → tolW
  const tolAcross = orient==='H' ? V.tolH : V.tolW;
  const icAcross = acrossDim - 2*V.kenar;

  if(face.kapaksiz){
    return {def, faceW, faceH, orient, V, kapaksiz:true,
      status:{cls:&quot;info&quot;, text:&quot;Bu yüz kapaksız — dolu panel&quot;},
      colResults:[], anaTakAdedi:0, icKullAlong:null, kalanAlong:null, toplamKapak:0, araTakToplam:0};
  }

  const anaTakAdedi = face.colGaps.filter(Boolean).length;
  const icKullAlong = alongDim - 2*V.kenar - anaTakAdedi*V.takviye;

  // pColSize (along) ve eff (across) değerlerinden gerçek w/h eşleşmesini ve SABİT (kesim)
  // ölçülerini türetir. Yayılan (colSpan>1) hücrelerde pColSize 2. geçişte değiştiği için
  // orada bir kez daha çağrılır — formülün tek kopyası burada durur.
  function applyDims(p){
    p.panelW = orient==='H' ? p.pColSize : p.eff;
    p.panelH = orient==='H' ? p.eff : p.pColSize;
    const along  = (p.pColSize>0 && !p.bos) ? (p.eleman ? p.pColSize : p.pColSize - (p.acilir?tolAlong+V.acilirEk:tolAlong)) : null;
    const across = (p.eff>0 && !p.bos)      ? (p.eleman ? p.eff      : p.eff      - (p.acilir?tolAcross+V.acilirEk:tolAcross)) : null;
    p.sabitW = orient==='H' ? along : across;
    p.sabitH = orient==='H' ? across : along;
  }

  let toplamKapak = 0, araTakToplam = 0;

  // ---- GEÇİŞ 1: bölüm genişlikleri ve kapak yükseklikleri ----
  // Yayılan hücre KENDİ bölümünün genişliğini belirlemez (genişliği 2. geçişte, kapladığı
  // bölümlerin toplamından türetilir) — bu yüzden maxPanelColSize'a katkı vermez.
  const colResults = face.columns.map((col, ci)=>{
    // col.size = bölüm varsayılan genişliği (yeni kapaklar için); panel.colSize = bireysel kapak genişliği
    const colSizeDefault = Number(col.size)||0;

    const innerTakAdedi = col.innerGaps.filter(Boolean).length;
    araTakToplam += innerTakAdedi;
    const icColAcross = icAcross - innerTakAdedi*V.takviye; // bölüm içi kullanılabilir dik ölçü

    const single = col.panels.length===1;
    let toplamAcross = 0;
    const enteredList = col.panels.map(pp=>Number(pp.size)||0);
    const lastIdx = col.panels.length-1;
    let maxPanelColSize = 0;
    const panels = col.panels.map((p,pi)=>{
      const spanN = Math.max(1, Math.min(Math.round(Number(p.colSpan)||1), face.columns.length - ci));
      const pColSize = Number(p.colSize)||0 || colSizeDefault; // bireysel kapak along-ekseni ölçüsü
      if(spanN===1 && pColSize > maxPanelColSize) maxPanelColSize = pColSize;

      const eleman = isEleman(p.type);      // Damper/Boğaz: 0 tolerans
      const bos = isBos(p.type);            // Boş Alan: yer kaplar, kesime girmez
      const entered = enteredList[pi];
      // Otomatik doldurma: tek hücre boş bırakılırsa VEYA son hücre &quot;Boş Alan&quot; ve ölçüsüzse kalan alanı alır
      const trailingBosAuto = bos && entered<=0 && pi===lastIdx && !single
        && enteredList.slice(0,lastIdx).every(v=>v>0);
      const auto = (single && entered<=0) || trailingBosAuto;
      const eff = auto
        ? (single ? Math.max(icColAcross,0)
                  : Math.max(icColAcross - enteredList.slice(0,lastIdx).reduce((a,b)=>a+b,0), 0))
        : entered;
      if(!auto && entered>0) toplamAcross += entered;
      const acilir = isAcilir(p.type);

      const out = {entered, auto, eff, pColSize, type:p.type, acilir, eleman, bos,
                   yon: (isYonlu(p.type) && p.yon === 'dikey') ? 'dikey' : '',
                   elemanOlcu: (eleman && p.elemanOlcu && Number(p.elemanOlcu.w) > 0
                                && Number(p.elemanOlcu.h) > 0)
                     ? {w: Number(p.elemanOlcu.w), h: Number(p.elemanOlcu.h)} : null,
                   delik: gecerliDelik(p) ? {w:+p.delik.w, h:+p.delik.h, x:+p.delik.x,
                                             y:+p.delik.y, tip:p.delik.tip} : null,
                   spanN, covered:false, spanCovers:null, spanOwner:null, spanLast:false, colAuto:false};
      applyDims(out);
      return out;
    });

    // Bölümün along katkısı = en büyük panel colSize (bölüm cursor'ı bu ölçüde ilerler)
    const colSize = maxPanelColSize || colSizeDefault;

    const autoUsed = panels.some(pp=>pp.auto);
    const kalanAcross = autoUsed ? 0 : (icColAcross - toplamAcross);
    return {colSize, panels, innerTakAdedi, icColAcross, kalanAcross, autoUsed};
  });

  // ---- GEÇİŞ 2: HÜCRE BİRLEŞTİRME (colSpan) ----
  // Yayılan hücre kapladığı bölümlerin genişlikleri + aradaki ANA takviye kalınlıkları kadar
  // genişler; kapladığı bölümlerdeki HİZALI hücreler &quot;covered&quot; olur (kapak sayılmaz). Toplam
  // genişlik değişmediği için icKullAlong muhasebesi olduğu gibi doğru kalır.
  const spanWarnings = [];
  const spanForcedCuts = face.columns.map(()=>[]);      // [junction i] → zorunlu kesim seviyeleri (idxA)
  const junctionSuppressed = face.columns.map(()=>({})); // [junction i][bant idx] → o bandda ana takviye yok
  const cellBounds = colResults.map(cRes=>{              // sharedGapLevels ile AYNI kümülatif eff uzayı
    const out = []; let cum = 0;
    cRes.panels.forEach(p=>{ out.push({top:cum, bot:cum+p.eff}); cum += p.eff; });
    return out;
  });
  colResults.forEach((cRes, ci)=>{
    cRes.panels.forEach((p, pi)=>{
      if(p.spanN <= 1 || p.covered) return;
      const last = ci + p.spanN - 1;
      const me = cellBounds[ci][pi];
      const covers = [];
      let bad = null;
      for(let j=ci+1; j<=last && !bad; j++){
        const k = cellBounds[j].findIndex(b=> Math.abs(b.top-me.top)<=0.51 && Math.abs(b.bot-me.bot)<=0.51);
        if(k < 0){ bad = 'Bölüm '+(j+1)+' içinde hizalı hücre yok'; break; }
        const target = colResults[j].panels[k];
        if(target.covered || target.spanN>1){ bad = 'Bölüm '+(j+1)+' hücresi başka bir birleşimde'; break; }
        covers.push({col:j, idx:k});
      }
      // Birleşen hücrenin üst ve alt sınırı ya yüz kenarına ya da GERÇEK bir ara takviyeye
      // dayanmalı — aksi halde dikey takviye boşlukta biterdi.
      if(!bad){
        const all = [{col:ci, idx:pi}].concat(covers);
        for(const c of all){
          const col = face.columns[c.col];
          if(c.idx > 0 && !col.innerGaps[c.idx-1]){ bad = 'üst sınırda ara takviye yok (Bölüm '+(c.col+1)+')'; break; }
          if(c.idx < col.panels.length-1 && !col.innerGaps[c.idx]){ bad = 'alt sınırda ara takviye yok (Bölüm '+(c.col+1)+')'; break; }
        }
      }
      if(bad){
        p.spanN = 1;
        spanWarnings.push('Kapak birleşimi (Bölüm '+(ci+1)+', Kapak '+(pi+1)+') uygulanamadı: '+bad+' — birleşim çözüldü');
        return;
      }
      const all = [{col:ci, idx:pi}].concat(covers);
      covers.forEach((c,cx)=>{
        const t = colResults[c.col].panels[c.idx];
        t.covered = true;
        t.spanOwner = {col:ci, idx:pi};
        t.spanLast = (cx === covers.length-1);   // birleşimin SON bölümü: sağ kenarı orada sayılır
      });
      p.spanCovers = covers;
      // Kaplanan junction'lar: o bandda ana takviye yok, iki ucunda kesim zorunlu
      all.slice(0, all.length-1).forEach(c=>{
        const j = c.col;
        junctionSuppressed[j][c.idx] = true;
        if(c.idx > 0) spanForcedCuts[j].push(c.idx-1);
        if(c.idx < face.columns[j].panels.length-1) spanForcedCuts[j].push(c.idx);
      });
      // Genişlik = kapladığı bölümlerin toplamı + aradaki AÇIK ana takviyelerin kalınlığı
      let w = 0;
      for(let j=ci; j<=last; j++) w += colResults[j].colSize;
      for(let j=ci; j<last; j++) if(face.colGaps[j]) w += V.takviye;
      // spanSize girilmişse TÜRETİLEN değerin yerine o geçer. Türetilen değer editörde
      // yer tutucu olarak gösterilip &quot;boş bırakınca geri dönülecek&quot; ölçü olarak saklanır.
      const spanEntered = Number(face.columns[ci].panels[pi].spanSize)||0;
      p.spanDerived = w;
      p.spanEntered = spanEntered > 0;
      p.pColSize = p.spanEntered ? spanEntered : w;
      // Elle girilen genişlik türetilenden farklıysa bu satır komşu satırlardan farklı bir
      // noktada biter. Birleşimden SONRAKİ ana takviye o bandın iki ucundan kesilmezse
      // satır kendi genişliğini taşıyamaz (resolveColumnLayout segment başına tek X kullanır).
      // Birleşimin KENDİ junction'larındaki zorunlu kesimle aynı geometrik gerekçe.
      if(p.spanEntered && Math.abs(spanEntered - w) > 0.51 && last < face.columns.length-1){
        const lastIdx = covers[covers.length-1].idx;
        if(lastIdx > 0) spanForcedCuts[last].push(lastIdx-1);
        if(lastIdx < face.columns[last].panels.length-1) spanForcedCuts[last].push(lastIdx);
      }
      applyDims(p);   // pColSize değişti → panelW/panelH ve SABİT ölçüler yeniden türetilir
    });
  });

  // Kapak sayımı covered hücreleri saymaz (onlar tek bir birleşik kapağın parçası)
  colResults.forEach(cRes=>cRes.panels.forEach(p=>{ if(!p.eleman && !p.bos && !p.covered) toplamKapak++; }));

  // TAKVİYE BAR ÇÖZÜMLEME — her ana/ara takviye kendi süreklilik durumuna göre
  // ayrı ayrı değerlendirilir (bkz. sharedGapLevels). face.anaSplitLevels[i] → o ANA
  // takviyenin HANGİ seviyelerden kesildiği; col.araJoinNext[gi]=true → o ARA takviye
  // bir sonraki bölümle birleşik.
  const bars = { ana: [], ara: [] };
  const barWarnings = spanWarnings.slice();

  for(let i=0; i<face.columns.length-1; i++){
    const on = !!face.colGaps[i];
    const levels = on ? sharedGapLevels(colResults[i], face.columns[i], colResults[i+1], face.columns[i+1]) : [];
    // Elle seçilen kesim seviyeleri ('*' = eski projelerin &quot;hepsini ayır&quot; davranışı) ile
    // hücre birleştirmenin ZORUNLU kıldığı sınırların birleşimi. Zorunlu kesim otomatik
    // bölme değildir: birleşik kapak o bandda takviyeyi kaldırdığından bandın iki ucunun
    // kesilmesi geometrik zorunluluktur.
    const req = face.anaSplitLevels[i];
    const manual = (req === '*') ? levels.map(l=>l.idxA) : (Array.isArray(req) ? req : []);
    const wanted = new Set(manual.concat(spanForcedCuts[i]));
    const cutLevels = levels.filter(l=>wanted.has(l.idxA)).map(l=>l.idxA);
    const splitValid = on && cutLevels.length>0;
    const lostManual = manual.filter(ix=>!levels.some(l=>l.idxA===ix));
    if(on && lostManual.length) barWarnings.push('Ana Takviye (Bölüm '+(i+1)+'/'+(i+2)+' arası): '+lostManual.length+' kesim noktası hizasını kaybetti (komşu bölümde hizalı ara takviye yok) — o noktalar sürekli çizildi');

    // Segmentler yukarıdan aşağıya. Bir segment tamamen birleşik bir kapağın bandına
    // düşüyorsa orada takviye fiziksel olarak yoktur → suppressed (çizilmez, kesime girmez).
    const segments = [];
    if(on){
      let len = 0, from = 0;
      colResults[i].panels.forEach((p,k)=>{
        len += p.eff;
        if(cutLevels.indexOf(k) >= 0){ segments.push({len, from, to:k}); len = 0; from = k+1; }
      });
      segments.push({len, from, to: Math.max(colResults[i].panels.length-1, 0)});
      segments.forEach(sg=>{
        sg.suppressed = true;
        for(let k=sg.from; k<=sg.to; k++){ if(!junctionSuppressed[i][k]){ sg.suppressed = false; break; } }
      });
    }
    // Bu junction'ın TAMAMI birleşik kapağın altında kaldıysa ortada bar yok demektir
    const fullySuppressed = on && segments.length>0 && segments.every(sg=>sg.suppressed);

    // Birleşik kapak içeren junction kademeli (stagger) olamaz: kademe çözümü iki bölümün
    // bandı tam paylaştığını varsayar, birleşimde o varsayım geçersizdir.
    const hasSpan = Object.keys(junctionSuppressed[i]).length > 0;
    const staggerable = splitValid && !hasSpan;
    bars.ana.push({i, on, cutLevels, splitValid, staggerable, fullySuppressed, levels, segments});
  }

  // ---- GEÇİŞ 3: SATIR BAZLI YERLEŞİM (zincirleme kademe) ----
  const layout = resolveColumnLayout(colResults, face, bars.ana,
    (ci,pi)=>colResults[ci].panels[pi].pColSize||0,
    ci=>colResults[ci].colSize||0,
    V.takviye,
    alongDim>0 ? alongDim - 2*V.kenar : null);
  bars.layout = layout;

  // ---- GEÇİŞ 4: SON BÖLÜMDE OTOMATİK GENİŞLİK ----
  // Ölçüsü girilmemiş bir hücre, bölüm maksimumunu (üstteki kapağın ölçüsünü) DEĞİL kendi
  // satırında kalan boşluğu alır — aksi halde satır yüzün dışına taşardı.
  {
    const lastCi = colResults.length-1;
    layout.autoWidth.forEach((w, pi)=>{
      if(w==null) return;
      const p = colResults[lastCi].panels[pi];
      p.pColSize = w;
      p.colAuto = true;      // etiketlerde &quot;(oto)&quot; olarak gösterilir
      applyDims(p);
    });
  }
  layout.inconsistent.forEach((bad,i)=>{
    if(bad) barWarnings.push('Ana Takviye (Bölüm '+(i+1)+'/'+(i+2)+' arası): satırlar aynı hizada bitmiyor — en geniş satır esas alındı'+(bars.ana[i].staggerable ? '' : ' (bu takviye kesilirse her satır kendi genişliğini alabilir)'));
  });
  if(layout.endMax - layout.endMin > 0.51)
    barWarnings.push('Satırların toplam genişliği eşit değil ('+Math.round(layout.endMin)+'/'+Math.round(layout.endMax)+' mm) — en geniş satır esas alındı');

  // Her satır kendi genişlik dağılımını taşıyabildiği için toplam kullanım, sütun
  // maksimumlarının toplamı değil, EN GENİŞ satırın bittiği yerdir.
  const kalanAlong = icKullAlong - (layout.endMax - anaTakAdedi*V.takviye);

  face.columns.forEach((col,ci)=>{
    col.innerGaps.forEach((on,gi)=>{
      const joinReq = ci<face.columns.length-1 && !!col.araJoinNext[gi];
      let joinValid = false, blockedByAna = false;
      if(on && joinReq){
        const anaBar = bars.ana[ci];
        const levelShared = !!anaBar && anaBar.levels.some(l=>l.idxA===gi);
        // Ara takviyenin komşu bölüme geçebilmesi için aradaki ana takviyenin TAM BU SEVİYEDEN
        // kesilmiş olması gerekir. (Eskiden barın herhangi bir yerinden kesilmiş olması yeterdi;
        // seviye bazlı kesimle birlikte kontrol de seviye bazlı hale geldi.)
        blockedByAna = !!anaBar && anaBar.on && !anaBar.fullySuppressed && anaBar.cutLevels.indexOf(gi) < 0;
        // Kademeli (zigzag) bir ana takviyenin ÜZERİNDEN birleştirme serbesttir: barın iki ucu
        // artık satır bazlı gerçek koordinatlardan (bars.layout) okunuyor, çift-toplam tahminine
        // gerek yok. Zincirin kaç bölüm sürdüğü de sınırsızdır (bkz. bars.araChains).
        joinValid = levelShared && !blockedByAna;
        if(!joinValid) barWarnings.push('Ara Takviye (Bölüm '+(ci+1)+', Seviye '+(gi+1)+') birleştirilemedi: '+(blockedByAna ? 'aradaki ana takviye önce bu seviyeden kesilmeli' : 'komşu bölümde hizalı seviye yok')+' — segmentli düzene geri düşüldü');
      }
      bars.ara.push({ci, gi, on, joinReq, joinValid, blockedByAna});
    });
  });

  // ARA TAKVİYE ZİNCİRLERİ — birleşme 2 bölümle sınırlı değil: ardışık her araJoinNext
  // dizisi TEK parça bir takviyedir. Zincir, hizalı seviyeler (levels[].idxB) üzerinden
  // sağa doğru yürütülür, böylece bölümlerin kapak sayıları farklı olsa da izlenebilir.
  const araChains = [];
  const araChainIdx = face.columns.map(()=>({}));   // [ci][gi] → zincir indeksi
  face.columns.forEach((col,ci)=>{
    col.innerGaps.forEach((on,gi)=>{
      if(!on || araChainIdx[ci][gi]!==undefined) return;
      const head = bars.ara.find(x=>x.ci===ci && x.gi===gi);
      if(!head || !head.joinValid) return;           // zincir yalnız birleşik bir bardan başlar
      const members = [{ci, gi}];
      let cc = ci, cg = gi;
      while(true){
        const bb = bars.ara.find(x=>x.ci===cc && x.gi===cg);
        if(!bb || !bb.joinValid) break;
        const lvl = bars.ana[cc] ? bars.ana[cc].levels.find(l=>l.idxA===cg) : null;
        if(!lvl) break;
        cc = cc+1; cg = lvl.idxB;
        if(araChainIdx[cc][cg]!==undefined) break;   // güvenlik: aynı barı iki kez zincirleme
        members.push({ci:cc, gi:cg});
      }
      const idx = araChains.length;
      members.forEach(m=>{ araChainIdx[m.ci][m.gi] = idx; });
      araChains.push({idx, members, ciFirst: members[0].ci, ciLast: members[members.length-1].ci});
    });
  });
  bars.araChains = araChains;
  bars.araChainIdx = araChainIdx;

  // Bir ara takviyenin along-eksen kaplaması. Kademeli düzende üstteki ve alttaki kapak
  // farklı genişlikte olabilir; bar EN GENİŞ kenara kadar uzanır ki dar taraftaki dikey
  // takviye üzerine otursun. İki uç da &quot;en sağdaki&quot; alınır: sol uç bir önceki ana
  // takviyenin EN SAĞ konumundan başlar — böylece komşu bölümün barıyla ÇAKIŞMAZ, tam
  // bitişik dizilirler.
  function araSpanOf(m){
    const cRes = colResults[m.ci];
    const a = m.gi, b2 = Math.min(m.gi+1, cRes.panels.length-1);
    return {left:  Math.max(layout.start[m.ci][a],   layout.start[m.ci][b2]),
            right: Math.max(layout.rightAt(m.ci, a), layout.rightAt(m.ci, b2))};
  }
  bars.araSpanOf = araSpanOf;
  function araChainSpan(ch){
    const f = araSpanOf(ch.members[0]), l = araSpanOf(ch.members[ch.members.length-1]);
    return {left: f.left, right: l.right};
  }

  // DURUM
  const alongName = orient==='H' ? 'genişlik' : 'yükseklik';
  const acrossName = orient==='H' ? 'yükseklik' : 'genişlik';
  let cls='info', lines=[];
  if(faceW<=0 || faceH<=0){ lines.push(`Gerekli ana ölçüler girilmedi (${def.wKey}, ${def.hKey})`); }
  else {
    const anyColSize = colResults.some(c=>c.colSize>0);
    if(!anyColSize) lines.push(`Bölüm ${alongName} ölçüleri girilmedi — görselde kapağa tıklanarak girilir`);
    else {
      if(Math.abs(kalanAlong)<1e-6){ lines.push(`✓ Ana yön (${alongName}) TAM OTURDU — iç kullanılabilir: ${icKullAlong.toFixed(0)} mm`); cls='good'; }
      else if(kalanAlong>0){ lines.push(`⚠ Ana yön (${alongName}): ${kalanAlong.toFixed(0)} mm EKSİK`); cls='warn'; }
      else { lines.push(`⚠ Ana yön (${alongName}): ${Math.abs(kalanAlong).toFixed(0)} mm FAZLA`); cls='bad'; }
    }
    colResults.forEach((c,ci)=>{
      if(c.autoUsed) return; // tek kapak oto → her zaman tam
      if(c.panels.length>1 || c.panels[0].entered>0){
        if(Math.abs(c.kalanAcross)>1e-6){
          const t = c.kalanAcross>0 ? `${c.kalanAcross.toFixed(0)} mm EKSİK` : `${Math.abs(c.kalanAcross).toFixed(0)} mm FAZLA`;
          lines.push(`⚠ Bölüm ${ci+1} dik yön (${acrossName}): ${t}`);
          if(cls==='good'||cls==='info') cls = c.kalanAcross>0?'warn':'bad';
          else if(cls==='warn' && c.kalanAcross<0) cls='bad';
        }
      }
    });
    barWarnings.forEach(w=>{
      lines.push('⚠ '+w);
      if(cls==='good'||cls==='info') cls='warn';
    });
  }
  const status = {cls, text: lines.join('  |  ')};

  const anaTakBoy = acrossDim - 2*V.kenar - 2*V.takviyePlastik; // boydan boya (dik eksende tam)
  const anaTakYon = orient==='H' ? 'Dikey' : 'Yatay';
  const araTakYon = orient==='H' ? 'Yatay' : 'Dikey';

  // TAKVİYE KAYITLARI — her bar kendi süreklilik durumuna göre kesim boyu üretir
  const takviyeRecords = [];
  const dimsOk = faceW>0 && faceH>0;

  let anaContCount = 0;
  bars.ana.forEach(b=>{
    if(!b.on || b.fullySuppressed) return;   // fullySuppressed: tüm yükseklik birleşik kapağın altında
    if(b.splitValid){
      let si = 0;
      b.segments.forEach(sg=>{
        if(sg.suppressed) return;            // o bant birleşik kapak — orada takviye yok
        si++;
        takviyeRecords.push({tip:'Ana Takviye', yon:anaTakYon, kaynak:'Bölüm '+(b.i+1)+'/'+(b.i+2)+' arası — segment '+si, adet:1, boy: (dimsOk && sg.len>0) ? sg.len-2*V.takviyePlastik : null});
      });
    } else {
      anaContCount++;
    }
  });
  if(anaContCount>0) takviyeRecords.push({tip:'Ana Takviye', yon:anaTakYon, kaynak:'Boydan boya', adet:anaContCount, boy: dimsOk ? anaTakBoy : null});

  // Her ZİNCİR tek parça bir ara takviyedir (2, 3, … bölüm fark etmez); boyu satır bazlı
  // gerçek koordinatlardan okunur, böylece kademeli düzende de doğrudur.
  araChains.forEach(ch=>{
    const sp = araChainSpan(ch);
    const boy = sp.right - sp.left;
    takviyeRecords.push({tip:'Ara Takviye', yon:araTakYon,
      kaynak:'Bölüm '+ch.members.map(m=>m.ci+1).join('-')+' arası — sürekli', adet:1,
      boy: (dimsOk && boy>0) ? boy-2*V.takviyePlastik : null});
  });
  // Birleşmemiş ara takviyeler kendi bölümlerinde kalır; aynı bölümde farklı boylar
  // çıkabileceği için (kademeli satırlar) boya göre gruplanır.
  face.columns.forEach((col,ci)=>{
    const byLen = {};
    col.innerGaps.forEach((on,gi)=>{
      if(!on || araChainIdx[ci][gi]!==undefined) return;
      const sp = araSpanOf({ci, gi});
      const key = Math.round(Math.max(sp.right - sp.left, 0));
      byLen[key] = (byLen[key]||0)+1;
    });
    Object.keys(byLen).forEach(k=>{
      const boy = Number(k);
      takviyeRecords.push({tip:'Ara Takviye', yon:araTakYon, kaynak:'Bölüm '+(ci+1)+' — segment',
        adet:byLen[k], boy: (dimsOk && boy>0) ? boy-2*V.takviyePlastik : null});
    });
  });

  // ARA KAT: profil ailesi 50/60 takviyeden farklı (kare profil, kaynak birleşim) —
  // sipariş listesinde karışmasın diye kayıtlar etiketlenir, üstüne çerçevenin 4 parçası
  // eklenir. Köşe birleşimi gönye değil: sürekli yön boydan boya, diğer yön 2p kısalır.
  if(isAraKat(fi)){
    const profilTanim = ARAKAT_PROFILLER[activeAraKat().profil] || ARAKAT_PROFILLER['30x30'];
    const profilAd = profilTanim.ad;
    // PROFİLSİZ: ne çerçeve ne bölme profili var — takviye kaydı da olmaz. (Bölme yine
    // eklenebilir; payı 0 mm olduğu için yalnız paneli ikiye ayırır, profil doğurmaz.)
    if(profilTanim.etki === 0){
      takviyeRecords.length = 0;
      return {def, faceW, faceH, orient, V, kapaksiz:false,
        colResults, anaTakAdedi, araTakToplam,
        icKullAlong, kalanAlong, toplamKapak, status,
        takviyeRecords, bars, barWarnings};
    }
    takviyeRecords.forEach(t=>{ t.tip = 'Ara Kat ' + t.tip; t.arakat = true; t.profil = profilAd; });
    const olc = araKatOlculeri();
    olc.cerceve.forEach(c=>{
      takviyeRecords.unshift({tip:'Ara Kat Çerçevesi', yon: c.yon==='L' ? 'Uzunluk (L)' : 'Genişlik (W)',
        kaynak: (c.yon===olc.surekliYon ? 'Boydan boya' : 'Aradan girer (−2p)'),
        adet: c.adet, boy: (dimsOk && c.boy>0) ? c.boy : null, arakat:true, profil:profilAd});
    });
    if(!dimsOk || olc.icL<=0 || olc.icW<=0){
      takviyeRecords.unshift({tip:'Ara Kat Çerçevesi', yon:'—', kaynak:'Modül ölçüleri eksik',
        adet:4, boy:null, arakat:true, profil:profilAd});
    }
  }

  return {def, faceW, faceH, orient, V, kapaksiz:false,
    colResults, anaTakAdedi, araTakToplam,
    icKullAlong, kalanAlong, toplamKapak, status,
    takviyeRecords, bars, barWarnings};
}

// ---------- OTOMATİK KAPAK YERLEŞİMİ (kaba maliyet iskeleti) ----------
// Bir yüzü, kapakların sac ölçüsüne sığacağı EN AZ sayıda parçaya böler. Ölçüler
// computeFace'in kendi zincirinden (icKullAlong / icColAcross) türetildiği için
// uygulandığında yüzün durum satırı &quot;TAM OTURDU&quot; der.
const OTO_SAC_KEY = 'kh_oto_sac';
const OTO_SAC_VARSAYILAN = {w:1500, h:3000, pay:3, birlesikAtla:true};
const OTO_MAX_BOLME = 40;   // arama üst sınırı — gerçek yüzlerde birkaç basamakta biter

// Kapak DIŞ sacının açılım payı — f1'deki nestFootprint ile AYNI sayılar (50 → +98,
// 60 → +125). Buradaki kopya yalnız &quot;kaç parçaya bölelim&quot; kararı içindir; DXF ve nesting
// hâlâ f1'in kendi tablosundan çizer. Sayı değişirse iki yer birden güncellenmeli.
const OTO_ACILIM_PAYI = {'50':98, '60':125};

let otoSac = Object.assign({}, OTO_SAC_VARSAYILAN);
try{
  const otoHam = localStorage.getItem(OTO_SAC_KEY);
  if(otoHam) otoSac = Object.assign({}, OTO_SAC_VARSAYILAN, JSON.parse(otoHam));
}catch(e){}
function otoSacYaz(){ try{ localStorage.setItem(OTO_SAC_KEY, JSON.stringify(otoSac)); }catch(e){} }

// Bilinmeyen/özel seride en büyük pay alınır: küçük tahmin edip sacı taşırmaktansa
// bir kapak fazla bölmek güvenli taraftır.
function otoAcilimPayi(){
  const seri = String(state.varsayimlar.seri||'').replace('P','');
  return OTO_ACILIM_PAYI[seri] !== undefined ? OTO_ACILIM_PAYI[seri] : 125;
}

// total'i n parçaya TAM dağıtır: taban ölçü + artan mm'ler baştan birer birer, kesir
// varsa sonuncuya. Toplam bire bir korunur — aksi halde yüzde &quot;EKSİK&quot; uyarısı kalırdı.
// Otomatik bölünen kapağın en büyük kenarı (Cenk, 29.08.2026: «saca sığsın yeter demiştim
// ancak 2000 mm'yi geçmemesini istiyorum; üst panel olarak değerlendirilenlerde ise 1200
// mm'yi geçmesin»). Sınır YALNIZ programın bölebildiği eksende uygulanır — öbür eksen
// modülün kendi ölçüsünden gelir — ve YALNIZ gerçek yerleşimde geçerlidir; kaba maliyet
// otomatiği (⚡ düğmesi) eskisi gibi yalnız saca bakar.
// En dar kapak (Cenk, 29.08.2026): altında kalan şerit komşu kapağa katılır. 100 mm
// seçildi ki KS-10 SAĞ yüzdeki 120 mm Boğaz Uzun geçerli kalsın, 62 mmlik şerit kalksın.
const GERCEK_MIN_KAPAK = 100;
// PANELE MONTE AGIZ (kayis-kasnakli = sik/seyrek kanatli fanin ATIS agzi): cizim ondalikli
// bir olcu uretiyor (fan capindan turuyor: 560 -> 715, 630 -> 801, 710 -> 898), imalat ise
// 10'un ust katini kullanir — Cenk, 29.08.2026: «115 cizilmis ama 120 yaziyor ve 120 olmali».
// Kural YALNIZ bu agiza uygulanir; tam bogaz ve oteki agizlar cizimdeki olcusunde kalir.
const GERCEK_AGIZ_YUVARLA = 10;
const GERCEK_KAPAK_MAX = 2000;
// UST PANEL SINIRI 1200 -> 1800 (Cenk, 03.09.2026: «buyuk santrallerde ust kapagi
// gereksiz yere cok kucuk parcalara ayirdigini gordum»). 29.08'de 1200 secilmisti;
// olculdu (713 cizim, 961 UST yuz): 1200'de toplam 2921 ust parca, 1800'de 1756.
// Ornek — AHU-01 M2'nin 2700x3270 catisi 3x3=9 parca (817x1007) yerine 2x2=4 parca
// (1257x1542). Sinir kalksa bile parca SACA sigmak zorunda: 1500'luk sacta kisa kenar
// en fazla ~1396 mm, yani bu sayi sonsuz buyuk panel uretmez.
const GERCEK_UST_MAX   = 1800;

function otoDagit(total, n){
  const base = Math.floor(total/n);
  const out = [];
  for(let i=0;i<n;i++) out.push(base);
  let kalan = total - base*n;
  for(let i=0;i<n && kalan>=1;i++){ out[i] += 1; kalan -= 1; }
  if(kalan > 1e-9) out[n-1] += kalan;
  return out;
}

// Kesim ölçüsü a × b olan kapak, açılım payıyla birlikte saca sığıyor mu? Parça
// nesting'de döndürülebildiği için uzun kenar sacın uzun kenarına bakılır.
function otoSigar(a, b){
  const pay = otoAcilimPayi();
  const limUzun = Math.max(otoSac.w, otoSac.h) - 2*otoSac.pay - pay;
  const limKisa = Math.min(otoSac.w, otoSac.h) - 2*otoSac.pay - pay;
  return Math.max(a,b) <= limUzun && Math.min(a,b) <= limKisa;
}

// Aktif modülün fi. yüzü için en az kapaklı (N bölüm × M kapak) ızgarayı arar; eşit
// kapak sayısında kareye en yakın olan kazanır. tak = aralara takviye konacak mı
// (takviye yer kapladığı için kullanılabilir ölçüyü değiştirir).
function otoPlan(fi, tak, limit){
  const def = faceDefOf(fi), V = vOf(fi), face = faceOf(fi);
  const faceW = Number(state.dims[def.wKey])||0, faceH = Number(state.dims[def.hKey])||0;
  if(faceW<=0 || faceH<=0) return null;
  const orient = face.orient;
  const alongDim  = orient==='H' ? faceW : faceH;
  const acrossDim = orient==='H' ? faceH : faceW;
  const tolAlong  = orient==='H' ? V.tolW : V.tolH;
  const tolAcross = orient==='H' ? V.tolH : V.tolW;
  let best = null;
  for(let N=1; N<=OTO_MAX_BOLME; N++){
    const kullA = alongDim - 2*V.kenar - (tak ? (N-1)*V.takviye : 0);
    if(kullA <= 0) break;
    const cs = kullA/N;
    for(let M=1; M<=OTO_MAX_BOLME; M++){
      const kullB = acrossDim - 2*V.kenar - (tak ? (M-1)*V.takviye : 0);
      if(kullB <= 0) break;
      const a = cs - tolAlong, b = kullB/M - tolAcross;
      if(a<=0 || b<=0) continue;
      if(!otoSigar(a,b)) continue;
      if(limit && (a > limit || b > limit)) continue;   // gerçek yerleşimin kapak sınırı
      const adet = N*M, oran = Math.max(a,b)/Math.min(a,b);
      if(!best || adet < best.adet || (adet === best.adet && oran < best.oran))
        best = {N, M, adet, oran, kullA, kullB,
                kapakW: orient==='H' ? a : b, kapakH: orient==='H' ? b : a};
    }
  }
  if(!best) return null;
  best.colSizes   = otoDagit(best.kullA, best.N);
  best.panelSizes = otoDagit(best.kullB, best.M);
  return best;
}

// Planı modele yazar. Seçimler ve ana takviye kesim seviyeleri sıfırlanır — yeni
// ızgarada eski indeksler anlamsızdır.
function otoUygulaYuz(fi, tak, limit){
  const plan = otoPlan(fi, tak, limit);
  if(!plan) return null;
  const face = faceOf(fi);
  face.columns = plan.colSizes.map(cs=>({
    size: cs,
    panels: plan.panelSizes.map(ps=>({size: ps, type:'Normal Panel', colSpan:1})),
    innerGaps: plan.panelSizes.slice(1).map(()=>!!tak),
    araJoinNext: plan.panelSizes.slice(1).map(()=>false)
  }));
  face.colGaps = plan.colSizes.slice(1).map(()=>!!tak);
  face.anaSplitLevels = plan.colSizes.slice(1).map(()=>[]);
  face.selectedCells = [];
  face.selectedBars = [];
  return plan;
}

// Bölüm ve kapak SAYISINA dokunmadan takviyeleri açar/kapatır ve ölçüleri yeniden
// eşit dağıtır. Dönüş: sac ölçüsünü aşan kapak sayısı (takviye kalkınca kapaklar
// büyür), ölçü girilmemiş yüzde -1.
function otoTakviyeYuz(fi, tak){
  const def = faceDefOf(fi), V = vOf(fi), face = faceOf(fi);
  const faceW = Number(state.dims[def.wKey])||0, faceH = Number(state.dims[def.hKey])||0;
  if(faceW<=0 || faceH<=0) return -1;
  syncStructure(face);
  const orient = face.orient;
  const alongDim  = orient==='H' ? faceW : faceH;
  const acrossDim = orient==='H' ? faceH : faceW;
  const tolAlong  = orient==='H' ? V.tolW : V.tolH;
  const tolAcross = orient==='H' ? V.tolH : V.tolW;
  const N = face.columns.length;
  const kullA = alongDim - 2*V.kenar - (tak ? (N-1)*V.takviye : 0);
  if(kullA <= 0) return -1;
  face.colGaps = face.colGaps.map(()=>!!tak);
  const cs = otoDagit(kullA, N);
  let tasan = 0;
  face.columns.forEach((col, ci)=>{
    col.size = cs[ci];
    col.innerGaps = col.innerGaps.map(()=>!!tak);
    const M = col.panels.length;
    const kullB = acrossDim - 2*V.kenar - (tak ? (M-1)*V.takviye : 0);
    const ps = otoDagit(Math.max(kullB,0), M);
    col.panels.forEach((p, pi)=>{
      p.size = ps[pi];
      // Bireysel genişlik ve elle girilmiş birleşim genişliği artık bayat — bölüm
      // ölçüsünden türetilene geri dönülür (alanlar tamamen düşer, JSON temiz kalır).
      delete p.colSize;
      delete p.spanSize;
      const span = Math.max(1, Math.min(Math.round(Number(p.colSpan)||1), N - ci));
      let a = -tolAlong;
      for(let k=0; k<span; k++) a += cs[ci+k] + (k>0 && tak ? V.takviye : 0);
      const b = ps[pi] - tolAcross;
      if(!isEleman(p.type) && !isBos(p.type) && a>0 && b>0 && !otoSigar(a,b)) tasan++;
    });
  });
  return tasan;
}


// ---------- GERÇEK DEĞERLERLE KAPAK YERLEŞİMİ (2026-08-28, gizli) ----------
// 27.08'deki otomatik yerleşim KABA MALİYET içindir: yüzü saca sığacak en az parçaya
// böler, kapak tipi hep 'Normal Panel'dir. Buradaki ikinci motor İMALAT içindir —
// kapakların yerini ve tipini DXF çiziminden okunan gerçek değerlerden kurar
// (module.dxfBilgi, bkz. dxfParcaListesi). Yalnız DXF'ten kurulmuş modüllerde çalışır;
// dxfBilgi'si olmayan modül eski otomatikle dolar.
//
// Kurallar (Cenk, 28.08.2026):
//   açılır kapak          — BÖLÜM genişliği 500 mm; fan/motor bölümündeyse CAMLI
//   ısıtma bataryası önü  — kalınlık <= 220 ise 300 mm, değilse kalınlık + 100
//   soğutma bataryası önü — kalınlık + 250
//   üst yüz               — üstünde modül varsa 'Normal Panel', açıksa 'Üst Panel'
//   kapağın yeri          — çizimdeki kapağın MERKEZİNE oturur, genişliği 500'e çıkar
//   kalan alan            — saca sığacak en az sayıda 'Normal Panel'
const GERCEK_ACILIR_W = 500;      // standart açılır kapak BÖLÜM genişliği
const GERCEK_ISITMA_ESIK = 220;   // bu kalınlığın üstünde kapak kalınlıktan türer
const GERCEK_ISITMA_W = 300;
const GERCEK_ISITMA_EK = 100;
const GERCEK_SOGUTMA_EK = 250;
const GERCEK_TAVA_W = 600;        // soğutma bataryası altındaki tava (varsayılan)
const GERCEK_TAVA_ESIK = 400;     // batarya bu kalınlığın üstündeyse tava kalınlıktan türer
const GERCEK_TAVA_EK = 250;

// DXF'teki işlev adı → kural ailesi. 'Kondenser Batarya' ısıtma tarafına konur: örnekte
// kalınlığı 145 mm ve modül kasası 300 mm — soğutma kuralı (145+250=395) kasaya sığmazdı.
function gercekIslev(p){
  const t = String((p && p.islev) || '');
  if(/Isıt|Kondenser/i.test(t)) return 'isitma';
  if(/Batarya/i.test(t)) return 'sogutma';
  if(/Fan/i.test(t)) return 'fan';
  return 'diger';
}

// Bir parçanın kapağı: {w, tip} ya da null.
//
// AÇILIR OLUP OLMADIĞINI ÇİZİM SÖYLER (Cenk, 29.08.2026): açılır panel kapı kolu ve menteşe
// sembolüyle çizilmiştir (`p.acilir`). Bataryanın önünde kapak VARDIR — ölçüsü bataryanın
// kendisinden gelir — ama menteşesi yoksa o kapak `Normal Panel`dir, açılır değil.
// Cam yalnız fan/motor bölümünde olur.
function gercekKapakTipi(p, acilir){
  if(!acilir) return 'Normal Panel';
  return gercekIslev(p) === 'fan' ? 'Camlı Açılır' : 'Camsız Açılır';
}

function gercekKapak(p){
  const t = gercekIslev(p);
  const kal = (p.batarya && Number(p.batarya.kalinlik)) || 0;
  const ac = !!p.acilir;
  if(t === 'isitma')
    return { w: kal > GERCEK_ISITMA_ESIK ? kal + GERCEK_ISITMA_EK : GERCEK_ISITMA_W,
             tip: gercekKapakTipi(p, ac) };
  if(t === 'sogutma')
    return kal > 0 ? { w: kal + GERCEK_SOGUTMA_EK, tip: gercekKapakTipi(p, ac) } : null;
  if(!ac) return null;
  return { w: GERCEK_ACILIR_W, tip: gercekKapakTipi(p, true) };
}

// Bir parçanın ALT yüze düşen tavaları: [{lo, w}] — parçanın KENDİ başından ölçülü.
// Tava ALT yüze konur (Cenk, 28.08.2026): ALT yüz L×W'dir ve tavanın ayak izi de L×W'dir,
// ÖN yüz (L×H) değil. 'Tava' bir ELEMAN göz tipidir — toleransı yoktur.
//
// KAYNAK (Cenk, 29.08.2026):
//   soğutma bataryası → 28.08'de verdiği kural (600 / kalınlık+250), bataryanın merkezinde
//   ısıtıcı batarya   → TAVA YOK (çizimde var ama «hatalı çizilmiş»)
//   diğerleri         → ölçü ve yer ÇİZİMDEN (nemlendirici, rotorlu/plakalı eşanjör, karışım)
// Ölçüldü: rotorlu eşanjörde 2 tava var, ötekilerde 1.
function gercekTavalar(p){
  const t = gercekIslev(p);
  const boy = Number(p.boy)||0;
  if(t === 'isitma') return [];
  if(t === 'sogutma'){
    const kal = (p.batarya && Number(p.batarya.kalinlik)) || 0;
    if(kal <= 0) return [];
    const w = kal > GERCEK_TAVA_ESIK ? kal + GERCEK_TAVA_EK : GERCEK_TAVA_W;
    if(w > boy) return [];
    const merkez = p.batarya ? (Number(p.batarya.lo)||0) + kal/2 : boy/2;
    let lo = Math.round(merkez - w/2);
    if(lo < 0) lo = 0;
    if(lo > boy - w) lo = boy - w;
    return [{ lo: lo, w: w }];
  }
  // Çizimdeki tava kasadan taşabiliyor (rotorlu eşanjörde 10 mm) — bölme boyuna kırpılır.
  return (p.tavalar || []).map(function(x){
    const lo = Math.max(0, Number(x.lo)||0);
    let w = Number(x.w)||0;
    if(lo + w > boy) w = boy - lo;
    return { lo: lo, w: w };
  }).filter(function(x){ return x.w > 0; });
}

// Eski tekil arayüz — yalnız soğutma bataryası için, geriye dönük çağrılar ve testler için.
function gercekTava(p){
  const l = gercekTavalar(p);
  return l.length ? { w: l[0].w, tip: 'Tava' } : null;
}

// Kapaksız bir boşluğu, açılımı saca sığacak EN AZ sayıda eşit parçaya böler. Bölme BÖLÜM
// ölçüsünde yapılır; ölçüler ilerideki düşümle yalnız KISALACAĞI için bu güvenli taraftır.
function gercekBolNormal(segs, w, across, limit){
  if(w <= 0.5) return;
  const lim = limit || GERCEK_KAPAK_MAX;
  let n = 1;
  while(n < OTO_MAX_BOLME && (!otoSigar(w/n, across) || w/n > lim)) n++;
  const pay = otoDagit(w, n);
  for(let i=0;i<n;i++) segs.push({ w: pay[i], tip: 'Normal Panel', sabit: false });
}

// Bir katın parçalarını ham segmentlere çevirir; toplamları modül boyuna (L) eşittir.
// Kapak segmenti ham genişliğinin YANINDA bir de 'hedef' taşır: düşüm hedefi bozmaz,
// yani 500 mm kapak 500 mm kalır. Çizimde kapak çerçeveye dayalı başladığı için
// (x = kenar) uçta kalan kenar payı kapağa katılır — o pay kapak değil çerçevedir.
function gercekSatirSegment(parcalar, across, V, uyari, secici, limit, kapakSec){
  const segs = [];
  // Uçtaki segmentten çerçeve payı da düşer, ortadakinden düşmez — eşik ona göre.
  const esikUc = V.kenar + GERCEK_MIN_KAPAK, esikOrta = GERCEK_MIN_KAPAK;
  const esik = esikOrta;
  const sec = secici || gercekKapak;
  // ARDIŞIK KAPAKSIZ ALAN BİRİKTİRİLİR (Cenk, 29.08.2026). Eskiden her parçanın kalanı
  // ayrı bölünüyordu; iki parçanın bitişik kalanları (DX'in sağındaki 220 + fanın
  // solundaki 500) ayrı bölümlere düşüyor ve orada olmayan bir dikme çıkıyordu.
  let bos = 0;
  function bosBosalt(){
    if(bos <= 0.5){ bos = 0; return; }
    // en dar kapaktan ince kalan şerit komşu kapağa katılır
    if(segs.length && bos <= esikUc){ segs[segs.length-1].w += bos; bos = 0; return; }
    gercekBolNormal(segs, bos, across, limit);
    bos = 0;
  }
  parcalar.forEach(function(p){
    const boy = Number(p.boy)||0;
    if(boy <= 0) return;
    const k = sec(p);
    // BIR PARCADA BIRDEN COK KAPAK olabilir (Cenk, 31.08.2026 — KLM-01 M1'de iki acilir,
    // DES M1'lerde uc). 'kapakSec' bu SATIRA dusen kapaklari verir; her biri kendi
    // merkezinde ayri bir sabit bolum olur. Batarya kurali tek kapaklidir, oraya girmez.
    let odak = null;
    if(kapakSec && k && k.w > 0 && !p.batarya){
      const kl = kapakSec(p);
      if(kl && kl.length > 1){
        odak = kl.map(function(d){ return (Number(d.x)||0) + (Number(d.w)||0)/2; })
                 .sort(function(a,b){ return a-b; });
        if(odak.length * k.w > boy + 0.5){
          uyari.push(p.islev + ' bölmesinde ' + odak.length + ' kapak var ama ' + boy
            + ' mm yetmiyor — ilki kondu');
          odak = null;
        }
      }
    }
    if(odak){
      let imlec = 0;
      odak.forEach(function(mz, i){
        let lo = Math.round(mz - k.w/2);
        if(lo < imlec) lo = imlec;
        const kalanKapak = (odak.length - 1 - i) * k.w;
        if(lo > boy - k.w - kalanKapak) lo = boy - k.w - kalanKapak;
        let ham = k.w;
        bos += lo - imlec;
        if(bos <= (segs.length ? esikOrta : esikUc)){ ham += bos; bos = 0; }
        bosBosalt();
        segs.push({ w: ham, hedef: k.w, tip: k.tip, sabit: true });
        imlec = lo + k.w;
      });
      bos = boy - imlec;
      if(bos > 0 && bos <= esik){ segs[segs.length-1].w += bos; bos = 0; }
      return;
    }
    if(k && k.w > 0 && k.w <= boy){
      let merkez;
      if(p.batarya) merkez = (Number(p.batarya.lo)||0) + (Number(p.batarya.kalinlik)||0)/2;
      else if(kapakSec && (kapakSec(p)||[]).length)
        merkez = (Number(kapakSec(p)[0].x)||0) + (Number(kapakSec(p)[0].w)||0)/2;
      else if(p.kapak) merkez = (Number(p.kapak.x)||0) + (Number(p.kapak.w)||0)/2;
      else merkez = boy/2;
      let lo = Math.round(merkez - k.w/2);
      if(lo < 0) lo = 0;
      if(lo > boy - k.w) lo = boy - k.w;
      const sag = boy - lo - k.w;
      let ham = k.w;
      bos += lo;
      // Uçta kalan çerçeve payı kapağa katılır — o pay kapak değil çerçevedir.
      if(bos <= (segs.length ? esikOrta : esikUc)){ ham += bos; bos = 0; }
      bosBosalt();
      segs.push({ w: ham, hedef: k.w, tip: k.tip, sabit: true });
      bos = sag;
      if(bos <= esik){ segs[segs.length-1].w += bos; bos = 0; }
    }else{
      if(k && k.w > boy)
        uyari.push(p.islev + ' kapağı ' + k.w + ' mm ama bölme yalnız ' + boy + ' mm — kapak konmadı');
      bos += boy;
    }
  });
  bosBosalt();
  return segs;
}

// Segment listesinin iç sınırları (0 ve L hariç).
function gercekSinirlar(segs){
  const out = []; let c = 0;
  for(let i=0;i<segs.length-1;i++){ c += segs[i].w; out.push(c); }
  return out;
}

// İki katın sınırları birleştirilir: takviye kalınlığından yakın olanlar tek sınıra iner,
// kapak kenarı olan sınır kazanır (kapak genişliği bozulmamalı). AYNI KATIN iki sınırı
// asla birleştirilmez — birleşseydi o katın iki segmenti tek sütuna düşer ve çakışırdı.
// Dönüş sınırların yanında ESLEME HARITASINI da verir: harita[kat][segment] = sütun indeksi.
function gercekSinirBirlestir(satirlar, tak){
  const ham = [];
  satirlar.forEach(function(sa, ri){
    let c = 0;
    for(let i=0;i<sa.segs.length-1;i++){
      c += sa.segs[i].w;
      ham.push({ x: c, ri: ri, i: i, sabit: !!(sa.segs[i].sabit || sa.segs[i+1].sabit) });
    }
  });
  ham.sort(function(a,b){ return a.x - b.x; });
  const kume = [];
  ham.forEach(function(h){
    const son = kume[kume.length-1];
    // '<=' bilinçli: iki satırın sınırı TAM bir profil genişliği kadar ayrıysa bunlar
    // aynı dikmenin iki kenarıdır (KLM-01 M1: 450 ile 500, arada 50'lik profil).
    if(son && Math.abs(h.x - son.x) <= tak + 0.5 && !son.katlar[h.ri]){
      if(h.sabit && !son.sabit) son.x = h.x;
      son.sabit = son.sabit || h.sabit;
      son.katlar[h.ri] = true;
      son.uye.push(h);
      return;
    }
    const y = { x: h.x, sabit: h.sabit, katlar: {}, uye: [h] };
    y.katlar[h.ri] = true;
    kume.push(y);
  });
  const harita = satirlar.map(function(){ return {}; });
  kume.forEach(function(kk, ki){
    kk.uye.forEach(function(u){ harita[u.ri][u.i] = ki + 1; });
  });
  return { sinir: kume.map(function(kk){ return kk.x; }), harita: harita };
}

// KAT AYIRICININ YERİ — kuralın TEK kopyası (Cenk, 31.08.2026):
//   «komşudaki üst köşe profilinin İÇ YÜZÜ ile kat ayırıcı yatay takviyenin ALT YÜZÜ
//    aynı hizada olsun» — böylece iki katlı modülün ALT KAT kapağı, yanındaki alt kat
//    modülün kapağıyla BİREBİR aynı çıkar.
// Komşunun üst köşe profilinin iç yüzü altKat - kenar'dadır; alt satırın açıklığı da
// oradan çerçevenin üst yüzüne kadardır:  altKat - 2*kenar.
// ÖLÇÜLDÜ: bu kural uygulanmadan önce havuzdaki 47 iki katlı modülün 47'sinde de alt kat
// kapağı komşusundan (kenar - takviye/2) kadar sapıyordu; ÖN ile ARKA da 14 modülde
// birbirini tutmuyordu (ARKA satırları orantıyla bölüyordu, ÖN kat çizgisine ortalıyordu).
// 'kull' = iki satırın PAYLAŞTIĞI açıklık (iç açıklık - kat ayırıcı takviyesi).
function gercekAltSatir(altKat, V, kull){
  let a = Math.round(altKat - 2*V.kenar);
  if(a < 1) a = 1;
  if(a > kull-1) a = kull-1;
  return a;
}

// Ham bölüm genişliklerinden hedef toplama iner. KAPAK bölümü hedefine sabitlenir
// (500 mm kapak 500 mm kalır); çerçeve ve takviye payı kapak dışı bölümlerden
// ham genişlikleriyle orantılı alınır. Kapak dışı alan yetmezse kapaklar da kısalır ve
// bu duyurulur — sessizce yanlış ölçü vermektense söylemek daha iyidir.
function gercekDusur(ham, hedefler, toplamHedef, uyari){
  const toplam = ham.reduce(function(a,b){ return a+b; }, 0);
  const D = toplam - toplamHedef;
  let sabitDus = 0;
  for(let i=0;i<ham.length;i++) if(hedefler[i] != null) sabitDus += ham[i] - hedefler[i];
  let serbest = hedefler.map(function(h){ return h == null; });
  let havuz = ham.reduce(function(a,b,i){ return a + (serbest[i] ? b : 0); }, 0);
  let kalanD = D - sabitDus;
  // BÜTÜN bölümler sabit ve hedeflerin toplamı sığıyorsa cevap HEDEFLERİN TA KENDİSİDİR;
  // artan pay baştan birer birer dağıtılır. Eskiden bu durumda 'kapak dışı alan yetersiz'
  // denip bütün kapaklar orantıyla kısalıyordu — KLM-01 M1'de 950 mm'lik bölmede iki
  // 400'lük açılır var (hedef 800, kullanılabilir 810) ve ikisi de 380/422'ye düşüyordu.
  if(havuz <= 0 && hedefler.every(function(h){ return h != null; })){
    const hT = hedefler.reduce(function(a,b){ return a+b; }, 0);
    if(hT <= toplamHedef + 0.5){
      const out = hedefler.map(function(h){ return Math.max(1, Math.round(h)); });
      let f2 = Math.round(toplamHedef) - out.reduce(function(a,b){ return a+b; }, 0);
      for(let i=0; f2 > 0 && out.length; i = (i+1) % out.length){ out[i]++; f2--; }
      return out;
    }
  }
  if(kalanD < 0 || havuz < kalanD + serbest.filter(Boolean).length){
    uyari.push('kapak dışı alan yetersiz — kapak ölçüleri de kısaldı');
    serbest = ham.map(function(){ return true; });
    havuz = toplam;
    kalanD = D;
  }
  // Butun segmentler sabitse (agiz yuzunde tek bolum: yan paylar cerceve kadar oldugu icin
  // banda katilir) serbest havuz sifirdir. Kalan pay da sifirsa cevap HEDEFLERIN TA KENDISI —
  // 'oynayacak yer yok' diye null donmek dogru cevabi atmak olurdu.
  if(havuz <= 0){
    if(Math.abs(kalanD) < 0.5 && hedefler.every(function(h){ return h != null; }))
      return hedefler.map(function(h){ return Math.max(1, Math.round(h)); });
    return null;
  }
  const yuv = ham.map(function(w,i){
    if(!serbest[i] && hedefler[i] != null) return Math.max(1, Math.round(hedefler[i]));
    return Math.max(1, Math.round(w - kalanD*(w/havuz)));
  });
  let fark = toplamHedef - yuv.reduce(function(a,b){ return a+b; }, 0);
  for(let tur=0; fark !== 0 && tur < 5000; tur++){
    let oynadi = false;
    for(let i=0;i<yuv.length && fark!==0;i++){
      if(!serbest[i]) continue;
      if(fark > 0){ yuv[i]++; fark--; oynadi = true; }
      else if(yuv[i] > 1){ yuv[i]--; fark++; oynadi = true; }
    }
    if(!oynadi) break;
  }
  if(fark !== 0){ uyari.push('ölçüler tam oturmadı ('+fark+' mm)'); return null; }
  return yuv;
}

// Aktif modülün ÖN yüzünü gerçek değerlerle kurar. withModule içinden çağrılır.
// Dönüş: {kapak, acilir, camli} ya da null (kurulamadı).
function gercekOnYuz(uyari){
  const md = state.modules[state.active];
  const bilgi = md && md.dxfBilgi;
  if(!bilgi || !bilgi.parcalar || !bilgi.parcalar.length) return null;
  const L = Number(state.dims.L)||0, H = Number(state.dims.H)||0;
  if(L <= 0 || H <= 0) return null;
  const V = getV(), face = state.faces[0], ps = bilgi.parcalar;
  const icAcross = H - 2*V.kenar;
  if(icAcross <= 1) return null;

  // Tam yükseklik hücresinde parçalar seri değil, ALT ve ÜST katta ayrı dizilir.
  const katliParca = ps.some(function(p){ return p.kat==='alt'; })
                  && ps.some(function(p){ return p.kat==='üst'; });
  // TAŞAN GÖVDE (Cenk, 31.08.2026): tek katlı çizimde komşularından yüksek duran modül
  // (DES ailesindeki plakalı eşanjör) de ASLINDA iki katlıdır — ölçü zinciri onu tek hücre
  // gösterir ama gövdesi kat yüksekliğini aşar. Parçaları 'tek' kaldığı için kat filtresi
  // iş görmez: her iki satır da parçaların TAMAMINI görür ('tam' gibi).
  const altKatH = Number(bilgi.altKat)||0;
  const tasan = !katliParca && altKatH > 0 && altKatH < H;
  const ikiKat = katliParca || tasan;
  const satirlar = [];
  if(ikiKat){
    const icColAcross = icAcross - V.takviye;
    if(icColAcross <= 2) return null;
    const a = gercekAltSatir(altKatH, V, icColAcross);
    // panels[] dizisi yüzün ÜSTÜNDEN ALTINA doğrudur — ÜST kat önce gelmeli.
    // (Cenk, 29.08.2026: çizimde fan üst katta ama camlı açılır 3B'de alt sırada çıkıyordu.)
    satirlar.push({ yuk: icColAcross-a, parcalar: tasan ? ps : ps.filter(function(p){ return p.kat==='üst'||p.kat==='tam'; }), tasan: tasan });
    satirlar.push({ yuk: a, parcalar: tasan ? ps : ps.filter(function(p){ return p.kat==='alt'||p.kat==='tam'; }), tasan: tasan });
  }else{
    satirlar.push({ yuk: icAcross, parcalar: ps });
  }

  // KAPAK HANGİ SATIRA DÜŞÜYOR? Çizimdeki kapağın tabandan yüksekliği (`alt`) bunu kesin
  // söyler — KLM-01 M1'de iki açılır ÇAPRAZ duruyor (üst kat solda, alt kat sağda), ikisi
  // de kol+menteşe taşıyor. `alt` yoksa (eski proje dosyası) kapağın YÜKSEKLİĞİ satırın
  // açıklığına eşittir kuralına düşülür; DES ailesinin 6 çiziminde birebir ölçüldü.
  function satirKapaklari(ri){
    return function(p){
      const kl = (p.kapaklar && p.kapaklar.length) ? p.kapaklar : (p.kapak ? [p.kapak] : []);
      if(!kl.length || !ikiKat) return kl;
      // Parçanın KENDİ katı belliyse kapaklarının hepsi bu satıra aittir. 'alt' alanı
      // parçanın kendi kasasının tabanından ölçülüdür, modülün değil — üst kattaki bir
      // fanın kapağı da kendi kasasında 60 mm'dedir. Yalnız İKİ KATI BİRDEN kaplayan
      // parçada ('tam', ya da taşan gövdede 'tek') o ölçü modül tabanından sayılır.
      if(p.kat === 'alt' || p.kat === 'üst') return kl;
      const ust = (ri === 0);
      if(kl.every(function(d){ return d.alt != null; }))
        return kl.filter(function(d){
          const mz = (Number(d.alt)||0) + (Number(d.h)||0)/2;
          return ust ? (mz > altKatH) : (mz <= altKatH);
        });
      return kl.filter(function(d){
        const hh = Number(d.h)||0;
        if(!(hh > 0)) return true;
        return Math.abs(hh - satirlar[ri].yuk) <= Math.abs(hh - satirlar[1-ri].yuk);
      });
    };
  }
  function satirSecici(ri){
    const f = satirKapaklari(ri);
    return function(p){
      const kl = (p.kapaklar && p.kapaklar.length) ? p.kapaklar : (p.kapak ? [p.kapak] : []);
      const benim = f(p);
      if(ikiKat && kl.length && !p.batarya && !benim.length) return null;  // kapağı bu satırda değil
      const k = gercekKapak(p);
      if(!k || p.batarya || kl.length < 2 || !benim.length) return k;
      // Standart 500'lük açılır BÖLÜM bu bölmeye sığmıyorsa (aynı bölmede birden çok
      // açılır) çizimdeki kapak genişliği esas alınır — KLM-01 M1: 950 mm'lik bölmede
      // iki açılır var, çizimde ikisi de 400 ve aralarında 50'lik dikme.
      if(kl.length * k.w <= (Number(p.boy)||0) + 0.5) return k;
      const w = Number(benim[0].w)||0;
      return w > 0 ? { w: w, tip: k.tip } : k;
    };
  }
  for(let i=0;i<satirlar.length;i++){
    satirlar[i].segs = gercekSatirSegment(satirlar[i].parcalar, satirlar[i].yuk, V, uyari,
                                          satirSecici(i), null, satirKapaklari(i));
    if(!satirlar[i].segs.length) return null;
    const t = satirlar[i].segs.reduce(function(a,b){ return a+b.w; }, 0);
    if(Math.abs(t - L) > 1.5){ uyari.push('kat toplamı '+Math.round(t)+' mm, modül boyu '+L+' mm'); return null; }
  }

  let sinir, harita;
  if(ikiKat){
    // Eşik ÇİZİLEN profil kalınlığıdır, imalattaki takviye değil. Çizim bütün ara
    // profilleri kenar profili genişliğinde çizer (50'likte 50, 60'lıkta 60); iki satırın
    // sınırları o profilin İKİ KENARIDIR, yani aralarındaki fark profilin genişliği kadar
    // olur. `V.takviye` (50'likte 40) ile ölçünce aynı dikme iki ayrı sınır sanılıyordu —
    // KLM-01 M1'de araya 38 mm'lik sahte bir sütun giriyordu (Cenk, 31.08.2026).
    const b = gercekSinirBirlestir(satirlar, Math.max(V.takviye, V.kenar));
    sinir = b.sinir; harita = b.harita;
  }else{
    sinir = gercekSinirlar(satirlar[0].segs);
    harita = [{}];
    for(let i=0;i<sinir.length;i++) harita[0][i] = i+1;
  }
  const N = sinir.length + 1;
  const icKullAlong = L - 2*V.kenar - (N-1)*V.takviye;
  if(icKullAlong <= N){ uyari.push(L+' mm modüle '+N+' bölüm sığmıyor'); return null; }

  const kenarlar = [0].concat(sinir, [L]);
  const hamCol = [], hedefCol = [];
  for(let i=0;i<N;i++) hamCol.push(kenarlar[i+1]-kenarlar[i]);
  // Bir sütun ancak TEK BAŞINA bir kapak segmentine denk düşüyorsa hedefe sabitlenir.
  // Kapak birden çok sütuna yayılıyorsa (üst kat o kapağın ortasında bölünüyorsa) genişliği
  // türetilir — aradaki dikme gerçekten oradadır.
  for(let i=0;i<N;i++) hedefCol.push(null);
  satirlar.forEach(function(sa, ri){
    let i0 = 0;
    for(let j=0;j<sa.segs.length;j++){
      const i1 = (j === sa.segs.length-1) ? N : harita[ri][j];
      if(i1 == null || i1 <= i0) return;
      if(sa.segs[j].sabit && i1 - i0 === 1 && hedefCol[i0] == null) hedefCol[i0] = sa.segs[j].hedef;
      i0 = i1;
    }
  });
  const colSize = gercekDusur(hamCol, hedefCol, icKullAlong, uyari);
  if(!colSize) return null;

  // Her satırın segmentini sütun aralığına eşle (birleşik kapak = colSpan).
  const sahip = [];
  for(let i=0;i<N;i++) sahip.push([]);
  let hata = null;
  satirlar.forEach(function(sa, ri){
    let i0 = 0;
    for(let j=0; j<sa.segs.length && !hata; j++){
      const i1 = (j === sa.segs.length-1) ? N : harita[ri][j];
      if(i1 == null){ hata = 'kat sınırı sütunlara oturmadı'; break; }
      if(i1 <= i0){ hata = 'kat sınırları çakıştı'; break; }
      sahip[i0][ri] = { tip: sa.segs[j].tip, span: i1-i0 };
      for(let k=i0+1;k<i1;k++) sahip[k][ri] = { tip: 'Normal Panel', span: 1 };
      i0 = i1;
    }
    if(!hata && i0 !== N) hata = 'kat sütunları kapatmadı';
  });
  if(hata){ uyari.push(hata); return null; }

  const tek = satirlar.length === 1;
  face.kapaksiz = false;
  face.orient = 'H';
  face.columns = colSize.map(function(cs, ci){
    return {
      size: cs,
      panels: satirlar.map(function(sa, ri){
        const h = sahip[ci][ri] || { tip: 'Normal Panel', span: 1 };
        return { size: tek ? 0 : sa.yuk, type: h.tip, colSpan: h.span };
      }),
      innerGaps: satirlar.slice(1).map(function(){ return true; }),
      // İki katlı modülde kat ayırıcı YATAY TAKVİYE BÜTÜNDÜR (Cenk, 29.08.2026):
      // bölümler arasında kesilmez, bir uçtan öbür uca gider. (İstisna kuralları Cenk
      // sonra anlatacak.)
      araJoinNext: satirlar.slice(1).map(function(){ return true; })
    };
  });
  face.colGaps = colSize.slice(1).map(function(){ return true; });
  // Kat ayırıcı yatay takviye BÜTÜN olacaksa aradaki dikey ana takviye o seviyeden
  // KESİLMELİ — motorun şartı (yoksa birleşme çözülür ve segmentli düzene düşer).
  const katKesim = (satirlar.length > 1) ? [0] : [];
  face.anaSplitLevels = colSize.slice(1).map(function(){ return katKesim.slice(); });
  face.selectedCells = [];
  face.selectedBars = [];

  let kapak = 0, acilir = 0, camli = 0;
  for(let ci=0; ci<N; ci++) for(let ri=0; ri<satirlar.length; ri++){
    const h = sahip[ci][ri];
    if(!h) continue;
    kapak++;
    if(isAcilir(h.tip)) acilir++;
    if(h.tip === 'Camlı Açılır') camli++;
  }
  return { kapak: kapak, acilir: acilir, camli: camli };
}

// Agiz yuzunde takviye kararı: bir aralığa ancak İKİ YANINDAKİ parça da bir takviye
// kalınlığı kadar genişse kuşak/dikme konur. Uçtaki parçadan çerçeve payı düşülür —
// çizimde ağzın çevresinde kalan 25 mm'lik şerit çerçevenin devamıdır, panel değildir.
// (KS-9: ağız 700×650, yüz 820; kuşak konsa kullanılabilir 580'e düşer ve ağız sığmaz.)
// Tek bir bolumun genisligi bu siniri asarsa parca saca HIC girmez — satirlar ne kadar
// bolunurse bolunsun. Bolum sayisi bu yuzden once genisligden, sonra yukseklikten cozulur.
function gercekEnGenisBolum(){
  return Math.max(otoSac.w, otoSac.h) - 2*otoSac.pay - otoAcilimPayi();
}

// Bir genisligi, her parcasi saca girecek en az sayida esit bolume ayirir.
function gercekBolGenislik(hedef, w, limit){
  if(w <= 0.5) return;
  const sac = gercekEnGenisBolum();
  const lim = Math.min(sac > 0 ? sac : Infinity, limit || GERCEK_KAPAK_MAX);
  let n = 1;
  while(n < OTO_MAX_BOLME && lim > 0 && w/n > lim) n++;
  const pay = otoDagit(w, n);
  for(let i=0;i<n;i++) hedef.push({ w: pay[i] });
}

function gercekAraliklar(ham, kenar, takviye){
  const n = ham.length, g = [];
  const net = ham.map(function(v,i){ return (i===0 || i===n-1) ? v - kenar : v; });
  for(let i=0;i<n-1;i++) g.push(net[i] >= takviye && net[i+1] >= takviye);
  return g;
}

// PANEL UZERINE MONTE AGIZ (Cenk, 29.08.2026): kayis-kasnakli fanin BASMA (ATIS) agzi
// yuze kendi bolumunu acmaz — yuz normal kapak kuraliyla bolunur, agzin geldigi panelin
// IC ve DIS sacina ayni olcude delik acilir ve bogaz o delige monte edilir.
// Olculdu (634 cizim, 1393 agiz): 372 tane; hicbiri tam bogazla ayni yuzde degil ve
// boyle yuzlerin hepsinde TEK agiz var. Fan tipi (sik/seyrek kanat) kayis-kasnakli
// olmasiyla birlikte gelir — ayrimi Cenk sectiği icin geometriye degil FANA bakilir.
function gercekMonteAgiz(md, p, a){
  return !!(md && md.fan && md.fan.kayis && p && p.islev === 'Fan' && a.etiket === 'ATIŞ');
}

// Bir ekseni, DELIGIN TEK PARCADA kalacagi ve her parcanin saca sigacagi en az sayida
// bolume ayirir. Delik parcasi once saca sigan en genis olcude kurulur ve delige
// ORTALANIR (cevresindeki pay en buyuk olsun), sonra iki yandaki kalan normal bolunur.
// across null ise sinir yalniz genisliktendir (sutun bolmesi, 28.08 dersi).
function gercekDelikBol(toplam, lo, hi, across, esikHam){
  const sac = gercekEnGenisBolum();
  let lim = Math.min(sac > 0 ? sac : Infinity, GERCEK_KAPAK_MAX);
  if(across != null){
    // otoSigar w'de monoton: en genis sigan olcuyu ikili aramayla bul
    let lo2 = 1, hi2 = Math.min(lim, toplam), en = 0;
    while(lo2 <= hi2){
      const orta = Math.floor((lo2 + hi2)/2);
      if(otoSigar(orta, across)){ en = orta; lo2 = orta + 1; } else hi2 = orta - 1;
    }
    lim = en;
  }
  if(!(lim > 0)) return null;
  if(toplam <= lim + 0.5) return [{ w: toplam, delik: true }];
  const pw = Math.min(lim, toplam);
  if(pw < hi - lo - 0.5) return null;              // delik hicbir parcaya sigmiyor
  let A = (lo + hi)/2 - pw/2;
  if(A < 0) A = 0;
  if(A + pw > toplam) A = toplam - pw;
  // Delik parcasinin yaninda 100 mm den ince kapak kalirsa parca O KENARA DAYANIR
  // ve pay otekine yigilir — 'agiz kenara dayanir' kuralinin ayni mantigi. Ham esik
  // cerceve + takviye + 100'dur; delik parcanin icinde kalmaya devam etmeli.
  const es = Number(esikHam) || 0;
  if(es > 0){
    const solPay = A, sagPay = toplam - A - pw;
    if(solPay > 0.5 && solPay < es && hi <= pw + 0.5) A = 0;
    else if(sagPay > 0.5 && sagPay < es && lo >= toplam - pw - 0.5) A = toplam - pw;
  }
  const segs = [];
  gercekBolGenislik(segs, A);
  segs.push({ w: pw, delik: true });
  gercekBolGenislik(segs, toplam - A - pw);
  return segs;
}

// Bolum olculeri cozuldukten sonra her bolumun yuz uzerindeki FIZIKSEL araligi:
// cerceve payiyla baslar, aradaki takviyeyi de sayar.
function gercekAralikKonum(olcu, gap, kenar, takviye){
  const out = []; let c = kenar;
  olcu.forEach(function(v, i){ out.push({ lo: c, hi: c + v }); c += v + (gap[i] ? takviye : 0); });
  return out;
}

// Kayis-kasnakli fanin basma agzi: yuz normal kapaklarla bolunur, agiz bir panelin
// DELIGI olur. withModule icinden cagrilir. Donus: {damper, bogaz, kapak, monte} | null.
function gercekMontajYuz(fi, a, uyari){
  const V = getV(), face = state.faces[fi];
  const W = Number(state.dims.W)||0, H = Number(state.dims.H)||0;
  if(W <= 0 || H <= 0 || !(a.w > 0 && a.h > 0)) return null;
  const yuzAd = fi === 4 ? 'SOL' : 'SAĞ';
  // OLCU 10'UN UST KATINA YUVARLANIR (Cenk, 29.08.2026) — buyume MERKEZE gore olur ki
  // kanalin ekseni cizimdeki yerinde kalsin; W ekseninde zaten ortali.
  const yv = GERCEK_AGIZ_YUVARLA;
  const aw = Math.ceil(a.w/yv)*yv, ah = Math.ceil(a.h/yv)*yv;
  const ay = a.y - (ah - a.h)/2;
  a = { etiket: a.etiket, tip: a.tip, w: aw, h: ah, y: ay };
  // agiz W ekseninde ORTALI (1345 agzin 1343'u cizimde de oyle), H ekseninde cizimdeki yerinde
  const x0 = (W - a.w)/2, x1 = x0 + a.w, y0 = a.y, y1 = y0 + a.h;
  if(x0 < V.kenar - 0.5 || x1 > W - V.kenar + 0.5 || y0 < V.kenar - 0.5 || y1 > H - V.kenar + 0.5){
    uyari.push(a.etiket+' ağzı '+yuzAd+' yüzde çerçevenin içine sığmıyor — konmadı, elle eklenmeli');
    return null;
  }
  const esikHam = V.kenar + V.takviye + GERCEK_MIN_KAPAK;
  const colSeg = gercekDelikBol(W, x0, x1, null, esikHam);
  if(!colSeg){ uyari.push(a.etiket+' ağzı '+yuzAd+' yüzde tek panele sığmıyor — konmadı'); return null; }
  const colGap = gercekAraliklar(colSeg.map(function(g){ return g.w; }), V.kenar, V.takviye);
  const icKullAlong = W - 2*V.kenar - colGap.filter(Boolean).length*V.takviye;
  if(icKullAlong <= colSeg.length) return null;
  const colSize = gercekDusur(colSeg.map(function(g){ return g.w; }),
                              colSeg.map(function(){ return null; }), icKullAlong, uyari);
  if(!colSize) return null;
  let enGenis = 0;
  colSize.forEach(function(c){ if(c > enGenis) enGenis = c; });
  // satirlar USTTEN ALTA kurulur (panels[] dizisinin yonu)
  const rowSeg = gercekDelikBol(H, H - y1, H - y0, enGenis, esikHam);
  if(!rowSeg){ uyari.push(a.etiket+' ağzı '+yuzAd+' yüzde tek panele sığmıyor — konmadı'); return null; }
  const rowGap = gercekAraliklar(rowSeg.map(function(g){ return g.w; }), V.kenar, V.takviye);
  const icKullAcross = H - 2*V.kenar - rowGap.filter(Boolean).length*V.takviye;
  if(icKullAcross <= rowSeg.length) return null;
  const rowSize = gercekDusur(rowSeg.map(function(g){ return g.w; }),
                              rowSeg.map(function(){ return null; }), icKullAcross, uyari);
  if(!rowSize) return null;
  // delik hangi panelin icinde? (olculer dustugu icin FIZIKSEL konumdan bulunur)
  const colK = gercekAralikKonum(colSize, colGap, V.kenar, V.takviye);
  const rowK = gercekAralikKonum(rowSize, rowGap, V.kenar, V.takviye);   // ustten alta
  let dCi = -1, dRi = -1;
  colK.forEach(function(k, i){ if(x0 >= k.lo - 0.5 && x1 <= k.hi + 0.5) dCi = i; });
  rowK.forEach(function(k, i){ if(H - y1 >= k.lo - 0.5 && H - y0 <= k.hi + 0.5) dRi = i; });
  if(dCi < 0 || dRi < 0){
    uyari.push(a.etiket+' ağzı '+yuzAd+' yüzde iki panelin sınırına denk geliyor — konmadı, elle eklenmeli');
    return null;
  }
  // delik konumu panelin SOL-ALT kosesine gore (DXF cizim yonu)
  // rowK USTTEN olculur; panelin ALT kenari yuzde: H - rowK[dRi].hi.
  // Delik KESIM dikdortgenine gore verilir: kapak acikliktan tolerans kadar kucuktur ve
  // aciklikta ORTALANIR, yani her kenarda tolerans/2 bosluk kalir.
  const kaymaX = (Number(V.tolW)||0)/2, kaymaY = (Number(V.tolH)||0)/2;
  const delik = { w: a.w, h: a.h, tip: a.tip,
                  x: Math.round((x0 - colK[dCi].lo - kaymaX)*10)/10,
                  y: Math.round((y0 - (H - rowK[dRi].hi) - kaymaY)*10)/10 };
  if(delik.x < 0.5 || delik.y < 0.5
     || delik.x + a.w > colSize[dCi] - 0.5 || delik.y + a.h > rowSize[dRi] - 0.5){
    uyari.push(a.etiket+' ağzı '+yuzAd+' yüzde panelin kenarına dayanıyor — konmadı, elle eklenmeli');
    return null;
  }
  face.kapaksiz = false;
  face.orient = 'H';
  face.columns = colSize.map(function(cs, ci){
    return {
      size: cs,
      panels: rowSize.map(function(rs, ri){
        const p = { size: rs, type: 'Normal Panel', colSpan: 1 };
        if(ci === dCi && ri === dRi) p.delik = { w: delik.w, h: delik.h, x: delik.x, y: delik.y, tip: delik.tip };
        return p;
      }),
      innerGaps: rowGap.slice(),
      araJoinNext: rowSize.slice(1).map(function(){ return false; })
    };
  });
  face.colGaps = colGap.slice();
  face.anaSplitLevels = colSize.slice(1).map(function(){ return []; });
  face.selectedCells = [];
  face.selectedBars = [];
  return { damper: a.tip === 'Damper' ? 1 : 0, bogaz: a.tip === 'Damper' ? 0 : 1,
           kapak: colSize.length*rowSize.length, monte: 1 };
}

// Bir agiz yuzunde satir segmentinin SABIT hedefi (agiz / bos alan) ya da null (serbest kapak).
function gercekSegHedef(sg){
  if(sg.agiz) return (sg.hedef != null) ? sg.hedef : sg.agiz.h;
  if(sg.bos) return sg.hedef;
  return null;
}

// Serbest segmentlerin dusum sonrasi olcusunu tahmin eder: gercekDusur serbest
// segmentleri ORANLARINI KORUYARAK kisaltir, sabitler hedefinde kalir.
function gercekSeritOlcu(rowSeg, ic){
  let sabit = 0, havuz = 0;
  rowSeg.forEach(function(sg){
    const h = gercekSegHedef(sg);
    if(h != null) sabit += h; else havuz += sg.h;
  });
  const kalan = ic - sabit;
  return rowSeg.map(function(sg){
    return gercekSegHedef(sg) != null ? null : (havuz > 0 ? sg.h*kalan/havuz : 0);
  });
}

// Ince seridin OTE YANINDAKI serbest kapak: aradaki segmentlerin hepsi AGIZ olmali.
// Bos Alan sabittir, oradan gecilmez. Iki yan da uygunsa GENIS olana aktarilir.
function gercekSeritKomsu(rowSeg, i){
  function ara(yon){
