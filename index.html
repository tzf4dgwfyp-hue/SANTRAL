<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>AHU Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d1b2a;display:flex;flex-direction:column;height:100vh;font-family:sans-serif;}
#toolbar{background:#111f2e;border-bottom:1px solid #1e3a52;padding:6px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
#toolbar span{color:#7aa8c8;font-size:13px;font-weight:600;letter-spacing:.5px;}
.tab-btn{background:#1a2e42;color:#7aa8c8;border:1px solid #1e3a52;border-radius:5px;padding:4px 14px;font-size:12px;cursor:pointer;}
.tab-btn.active{background:#4fb8a8;color:#0d1b2a;border-color:#4fb8a8;font-weight:700;}
#frames{flex:1;position:relative;overflow:hidden;}
iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:none;}
iframe.active{display:block;}
.road-btn{background:#1a2e42;color:#7aa8c8;border:1px solid #1e3a52;border-radius:5px;padding:4px 12px;font-size:12px;cursor:pointer;margin-left:auto;}
.road-btn:hover{border-color:#4fb8a8;color:#cfe6f2;}
.road-btn .road-rakam{color:#4fb8a8;font-weight:700;}
#road-modal{position:fixed;inset:0;background:rgba(4,10,16,.72);display:none;align-items:center;justify-content:center;z-index:9999;padding:24px;}
#road-modal.open{display:flex;}
#road-card{background:#111f2e;border:1px solid #1e3a52;border-radius:10px;max-width:780px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.5);}
#road-head{padding:13px 18px;border-bottom:1px solid #1e3a52;display:flex;align-items:center;gap:10px;flex-shrink:0;}
#road-head h2{color:#cfe6f2;font-size:14.5px;font-weight:700;letter-spacing:.3px;}
#road-sayac{color:#7aa8c8;font-size:11.5px;}
#road-kapat{background:none;border:none;color:#7aa8c8;font-size:22px;line-height:1;cursor:pointer;padding:0 2px;margin-left:auto;}
#road-kapat:hover{color:#4fb8a8;}
#road-body{padding:10px 10px 14px;overflow:auto;}
.road-item{display:flex;gap:10px;padding:8px 10px;border-radius:7px;align-items:flex-start;}
.road-item:hover{background:#16283a;}
.road-no{color:#5c7f9b;font-size:11px;font-weight:700;min-width:20px;padding-top:3px;text-align:right;}
.road-ic{flex:1;min-width:0;}
.road-t{color:#cfe6f2;font-size:13px;font-weight:600;}
.road-d{color:#7f9db3;font-size:11.5px;margin-top:3px;line-height:1.45;}
.road-rozet{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;margin-top:2px;letter-spacing:.3px;}
.rz-plan{background:#1a2e42;color:#7aa8c8;border:1px solid #24435f;}
.rz-suruyor{background:#3a2f10;color:#e0a13a;border:1px solid #6a541c;}
.rz-tamam{background:#12362f;color:#4fb8a8;border:1px solid #1d5b4f;}
.road-item.tamam .road-t{color:#83a89e;}
#road-alt{padding:9px 18px;border-top:1px solid #1e3a52;color:#5c7f9b;font-size:11px;flex-shrink:0;}
</style>
</head>
<body>
<div id="toolbar">
  <span>AHU Studio</span>
  <button class="tab-btn active" onclick="show(0)">Kapak Hesabı</button>
  <button class="tab-btn" onclick="show(1)">DXF Üretme</button>
  <button class="road-btn" onclick="yolHaritasiAc(true)">Yakında Eklenecekler <span class="road-rakam" id="road-btn-sayac"></span></button>
</div>

<style>
  /* ---------- TEMALAR ---------- */
  :root{

    --warn:#ffb340; --bad:#ff453a; --bad-soft:rgba(255,69,58,.14); --good:#32d74b;

    --shadow-sm-el:0 1px 3px rgba(0,0,0,.4);
    --r-s:10px; --r-m:16px;
  }
  body[data-theme=&quot;celik&quot;]{
    --bg:#111214; --panel:#1a1c1f; --panel2:#222528; --border:rgba(255,255,255,.08);
    --text:#eceeef; --muted:#98999e; --accent:#5aa9e6; --accent-soft:rgba(90,169,230,.15); --accent-ring:rgba(90,169,230,.35); --accent-fg:#ffffff;
    --warn:#e0a541; --bad:#ff453a; --bad-soft:rgba(255,69,58,.14); --good:#5fc26a;
    --input-bg:#1c1e21;    --header-bg:rgba(26,28,31,.72);
    --shadow-card:0 1px 2px rgba(0,0,0,.5),0 12px 28px -10px rgba(0,0,0,.6);
    --shadow-pop:0 16px 44px -10px rgba(0,0,0,.65);
    --shadow-sm-el:0 1px 3px rgba(0,0,0,.4);
  }
  body[data-theme=&quot;aydinlik&quot;]{
    --bg:#f5f5f7; --panel:#ffffff; --panel2:#f7f8fa; --border:rgba(0,0,0,.08);
    --text:#1d1d1f; --muted:#6e6e73; --accent:#0071e3; --accent-soft:rgba(0,113,227,.08); --accent-ring:rgba(0,113,227,.28); --accent-fg:#ffffff;
    --warn:#c17f0a; --bad:#d70015; --bad-soft:rgba(215,0,21,.09); --good:#248a3d;
    --input-bg:#ffffff;    --header-bg:rgba(255,255,255,.72);
    --shadow-card:0 1px 3px rgba(0,0,0,.04),0 10px 24px -8px rgba(0,0,0,.10);
    --shadow-pop:0 18px 40px -10px rgba(0,0,0,.16);
    --shadow-sm-el:0 1px 2px rgba(0,0,0,.08);
  }
  body[data-theme=&quot;kehribar&quot;]{
    --bg:#141110; --panel:#1c1815; --panel2:#241f1a; --border:rgba(255,255,255,.08);
    --text:#f2ece3; --muted:#a89b89; --accent:#e5a53c; --accent-soft:rgba(229,165,60,.15); --accent-ring:rgba(229,165,60,.35); --accent-fg:#241a06;
    --warn:#e5a53c; --bad:#ff453a; --bad-soft:rgba(255,69,58,.14); --good:#8fbf5a;
    --input-bg:#1a1613;    --header-bg:rgba(28,24,21,.72);
    --shadow-card:0 1px 2px rgba(0,0,0,.5),0 12px 28px -10px rgba(0,0,0,.6);
    --shadow-pop:0 16px 44px -10px rgba(0,0,0,.65);
    --shadow-sm-el:0 1px 3px rgba(0,0,0,.4);
  }
  body[data-theme=&quot;nordik&quot;]{
    --bg:#0b0f16; --panel:#141b25; --panel2:#1b2431; --border:rgba(255,255,255,.08);
    --text:#e8eef7; --muted:#8a9bb5; --accent:#5bc9e0; --accent-soft:rgba(91,201,224,.14); --accent-ring:rgba(91,201,224,.34); --accent-fg:#04222a;
    --warn:#e0b04a; --bad:#ff5e5a; --bad-soft:rgba(255,94,90,.14); --good:#5fbf8f;
    --input-bg:#111826;    --header-bg:rgba(20,27,37,.72);
    --shadow-card:0 1px 2px rgba(0,0,0,.5),0 12px 28px -10px rgba(0,0,0,.6);
    --shadow-pop:0 16px 44px -10px rgba(0,0,0,.65);
    --shadow-sm-el:0 1px 3px rgba(0,0,0,.4);
  }

  /* PANEL — kaynak: tema/tema.css (PANEL TEMA v1.0) koyu paleti. Gizli imalat
     modunun temasi budur (ADMIN_TEMA). Indigo vurgu, neredeyse siyah zemin. */
  body[data-theme=&quot;panel&quot;]{
    --bg:#08090b; --panel:#101214; --panel2:#16181c; --border:#1e2126;
    --text:#e8eaed; --muted:#858c98; --accent:#8b93f8; --accent-soft:rgba(139,147,248,.16); --accent-ring:rgba(139,147,248,.35); --accent-fg:#0a0b0e;
    --warn:#e0a45f; --bad:#ff5e5a; --bad-soft:rgba(255,94,90,.14); --good:#4cc38a;
    --input-bg:#131519;    --header-bg:rgba(16,18,20,.74);
    --shadow-card:0 1px 2px rgba(0,0,0,.4),0 4px 18px -8px rgba(0,0,0,.6);
    --shadow-pop:0 16px 40px -12px rgba(0,0,0,.7);
    --shadow-sm-el:0 1px 3px rgba(0,0,0,.4);
    --r-s:8px; --r-m:11px;
  }
  /* Temanin imzasi: ustten gelen isik yikamasi + ince izgara. Yalniz bu temada
     vardir, sabit konumludur ve pointer-events almaz — hicbir tiklamaya karismaz.
     (body arka plani en altta boyanir, negatif z-index bunlarin ustune duser.) */
  body[data-theme=&quot;panel&quot;]::before,
  body[data-theme=&quot;panel&quot;]::after{content:'';position:fixed;inset:0;pointer-events:none;}
  body[data-theme=&quot;panel&quot;]::before{z-index:-2;background:
    radial-gradient(62% 44% at 50% -12%, rgba(139,147,248,.16), transparent 68%),
    radial-gradient(38% 30% at 96% -4%, rgba(139,147,248,.07), transparent 70%);}
  body[data-theme=&quot;panel&quot;]::after{z-index:-1;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(78% 55% at 50% 0%,#000,transparent 76%);
    mask-image:radial-gradient(78% 55% at 50% 0%,#000,transparent 76%);}

  /* ================= PANEL TEMASI — EFEKT KATMANI =================
     Kaynak: tema/tema.css (PANEL TEMA v1.0). Temanin sinif adlari alinamaz
     (.card/header/nav/button.tool); GORSEL DIL uygulamanin kendi seciciler ine
     giydirildi. Hepsi bu tema altinda — oteki bes tema hic etkilenmez.
     Hareketi azaltilmis (prefers-reduced-motion) ortamda hepsi kapanir. */

  /* --- ust cubukta dolasan isik cizgisi (tema: header::after) --- */
  /* Cizgi TRANSFORM ile kayar. Onceki hali background-position animasyonuydu:
     bilesik katmanda kosmaz, her kare yeniden boyanir — ustelik .appbar'da
     backdrop-filter:blur var, yani bulanik zemin de her kare yeniden uretiliyordu
     (olculdu: acilista kare sayisi yariya duyuyordu). */
  /* .appbar KIRPILMAZ: sorunlu-yuz rozetinin acilir paneli bu cubugun icindedir ve
     asagi tasar — overflow:hidden onu keserdi. Cizgi bunun yerine cubugun ICINDE
     kalacak kadar yuruyor. */
  body[data-theme=&quot;panel&quot;] .appbar::after{content:'';position:absolute;bottom:0;left:0;width:34%;height:1px;
    pointer-events:none;opacity:.85;will-change:transform;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    animation:temaSweep 8s cubic-bezier(.16,1,.3,1) infinite;}
  @keyframes temaSweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(194%)}}

  /* --- kartlar: imleci takip eden isik + hover kalkmasi (tema: .card) --- */
  body[data-theme=&quot;panel&quot;] .section{position:relative;transition:border-color .2s,box-shadow .2s;}
  body[data-theme=&quot;panel&quot;] .section:hover{border-color:#2a2e35;box-shadow:var(--shadow-pop);}
  body[data-theme=&quot;panel&quot;] .section::after{content:'';position:absolute;inset:0;border-radius:inherit;
    pointer-events:none;z-index:0;opacity:0;transition:opacity .3s;
    background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.055),transparent 62%);}
  body[data-theme=&quot;panel&quot;] .section:hover::after{opacity:1;}
  body[data-theme=&quot;panel&quot;] .section > *{position:relative;z-index:1;}

  /* --- kart basligi: versal + kucuk kare isaret (tema: .card h3) --- */
  body[data-theme=&quot;panel&quot;] .section h2{font-size:11.5px;font-weight:650;color:var(--muted);
    text-transform:uppercase;letter-spacing:.08em;}
  body[data-theme=&quot;panel&quot;] .section h2::before{width:5px;height:5px;border-radius:1px;}

  /* --- kartlarin sirayla iceri girmesi (tema: panelIn). YALNIZ .tema-giris
         varken calisir: her tusa basista renderAll yeniden ciziyor, animasyon
         her seferinde tekrarlasa ekran titrerdi. Sinifi JS ekleyip 900 ms sonra alir. */
  /* blur BILEREK yok: 34 kartta her kare yeniden bulaniklastirmak acilisi takiyordu
     (olculdu). translateY + opacity bilesik katmanda kosar, gorunum neredeyse ayni. */
  @keyframes temaPanelIn{from{opacity:0;transform:translateY(12px) scale(.994)}
    to{opacity:1;transform:none}}
  /* Yalniz .tema-gir isaretli kartlar (ilk 12) animasyonla gelir: hepsini animasyona
     sokmak 34 bilesik katman demekti ve acilisi yaviaslatiyordu (olculdu). */
  body[data-theme=&quot;panel&quot;].tema-giris .section.tema-gir{animation:temaPanelIn .46s cubic-bezier(.16,1,.3,1) both;
    animation-delay:calc(var(--i,0) * 55ms);will-change:transform,opacity;}
  @keyframes temaCizgi{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  body[data-theme=&quot;panel&quot;].tema-giris .section h2{transform-origin:left;}
  body[data-theme=&quot;panel&quot;].tema-giris .viewbar{animation:temaPanelIn .4s cubic-bezier(.16,1,.3,1) both;}

  /* --- butonlar (tema: button.tool / nav .grp button.on) --- */
  body[data-theme=&quot;panel&quot;] .add-btn2{transition:transform .12s ease,filter .15s ease,box-shadow .2s ease;
    box-shadow:0 2px 10px -3px rgba(139,147,248,.55);}
  body[data-theme=&quot;panel&quot;] .add-btn2:hover{transform:translateY(-1px);box-shadow:0 7px 20px -7px rgba(139,147,248,.75);}
  body[data-theme=&quot;panel&quot;] .add-btn2:active{transform:scale(.97);}
  body[data-theme=&quot;panel&quot;] .add-btn2.ghost{box-shadow:none;}
  body[data-theme=&quot;panel&quot;] .tab{transition:color .16s,background .16s,border-color .16s,transform .12s;}
  body[data-theme=&quot;panel&quot;] .tab:hover{transform:translateY(-1px);}
  body[data-theme=&quot;panel&quot;] .tab.active{box-shadow:0 2px 10px -4px rgba(139,147,248,.55);}
  body[data-theme=&quot;panel&quot;] .vbtn{transition:color .2s ease;}
  body[data-theme=&quot;panel&quot;] .viewbar-thumb{box-shadow:0 2px 10px -4px rgba(139,147,248,.5);}

  /* --- olcu kutulari: vurgulu kutudaki isik supurmesi (tema: .o.hi) --- */
  body[data-theme=&quot;panel&quot;] .dim-readout div{position:relative;overflow:hidden;
    transition:border-color .18s,transform .18s cubic-bezier(.16,1,.3,1);}
  body[data-theme=&quot;panel&quot;] .dim-readout div:hover{transform:translateY(-1px);border-color:#2a2e35;}
  body[data-theme=&quot;panel&quot;] .dim-readout div::after{content:'';position:absolute;top:0;bottom:0;left:0;width:55%;
    pointer-events:none;will-change:transform;
    background:linear-gradient(115deg,transparent 20%,rgba(139,147,248,.13) 50%,transparent 80%);
    animation:temaSweepKutu 9s cubic-bezier(.16,1,.3,1) infinite;}
  /* Kutu kendi icinde kirpildigi icin cizgi disari tasabilir. */
  @keyframes temaSweepKutu{0%{transform:translateX(-120%)}55%,100%{transform:translateX(310%)}}

  /* --- tablolar (tema: th versal + satir hover) --- */
  body[data-theme=&quot;panel&quot;] table th{text-transform:uppercase;letter-spacing:.06em;}
  body[data-theme=&quot;panel&quot;] tbody tr{transition:background .14s;}
  body[data-theme=&quot;panel&quot;] tbody tr:hover{background:var(--panel2);}

  /* --- secim, odak, kaydirma cubugu --- */
  body[data-theme=&quot;panel&quot;] ::selection{background:rgba(139,147,248,.30);color:var(--text);}
  body[data-theme=&quot;panel&quot;] :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  body[data-theme=&quot;panel&quot;] ::-webkit-scrollbar-thumb{background:#2a2e35;border-radius:6px;
    border:3px solid var(--bg);background-clip:padding-box;}
  body[data-theme=&quot;panel&quot;] ::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box;}

  /* --- acilis: isik supurmesi (tema: #loadbeam) --- */
  #tema-loadbeam{position:fixed;inset:0;z-index:200;pointer-events:none;will-change:transform;
    background:linear-gradient(104deg,transparent 38%,rgba(139,147,248,.10) 47%,
      rgba(255,255,255,.07) 50%,rgba(139,147,248,.10) 53%,transparent 62%);
    animation:temaBeam 1.15s cubic-bezier(.32,0,.24,1) both;}
  @keyframes temaBeam{from{transform:translate3d(-115%,0,0)}to{transform:translate3d(115%,0,0)}}

  /* --- acilis: isik ucgeni (tema: #splash). Yalniz sayfa Panel temasiyla
         acildiginda gorunur; tiklama/tus/tekerlek ile hemen kapanir. --- */
  #tema-splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;pointer-events:none;
    background:radial-gradient(64% 50% at 50% 45%, #121418 0%, #0a0b0e 42%, #050506 78%, #030304 100%);}
  #tema-splash.oyna{animation:temaSplashOut .6s cubic-bezier(.16,1,.3,1) 1.78s both;}
  /* Animasyonlar .oyna sinifiyla baslar: katman ONCE basilir (ekrani kaplasin),
     animasyon ancak agir acilis isi bittikten sonra baslar — yoksa ilk kareler duser. */
  #tema-splash .tri{position:relative;width:0;height:0;--u:50px;--v:43px;--d:26px;}
  #tema-splash.oyna .tri{animation:temaTriIn 1.2s cubic-bezier(.16,1,.3,1) both,
    temaTriOut .6s cubic-bezier(.16,1,.3,1) 1.78s both;}
  #tema-splash i{position:absolute;width:var(--d);height:var(--d);border-radius:50%;background:#fff;
    left:calc(var(--x) * var(--u) - var(--d)/2);
    top:calc((var(--y) - 1.5) * var(--v) - var(--d)/2);
    opacity:0;transform:scale(.35);will-change:transform,opacity,filter;}
  #tema-splash.oyna i{
    animation:temaDotIn .48s cubic-bezier(.16,1,.3,1) both, temaDotGlow 2.4s ease-in-out infinite,
              temaEdgeRun .46s ease-out forwards;
    animation-delay:calc(var(--i) * 38ms), calc(460ms + var(--i) * 38ms), calc(880ms + var(--p) * 50ms);}
  /* Temanin bloom'u: nokta basina iki bulanik katman. Once box-shadow'a cevrilmisti
     ama OLCULDU — kare sayisina etkisi yoktu (48 vs 49); asil maliyet sweep
     animasyonundaydi. Gorunum kaybetmemek icin temanin kendi hali geri alindi. */
  #tema-splash i::before,#tema-splash i::after{content:'';position:absolute;left:50%;top:50%;
    border-radius:50%;background:#fff;transform:translate(-50%,-50%);pointer-events:none;}
  #tema-splash i::before{width:205%;height:205%;filter:blur(6px);opacity:.30;}
  #tema-splash i::after{width:470%;height:470%;filter:blur(21px);opacity:.062;}
  @keyframes temaDotIn{to{opacity:1;transform:none}}
  /* Parlama filter:brightness ile yapiliyordu; noktanin altinda blur(6px) ve blur(21px)
     iki katman var, her kare yeniden boyaniyordu. Opacity bilesik katmanda kosar. */
  @keyframes temaDotGlow{0%,100%{opacity:.82}50%{opacity:1}}
  @keyframes temaEdgeRun{0%{transform:scale(1);filter:brightness(1)}
    30%{transform:scale(1.72);filter:brightness(2.6) drop-shadow(0 0 26px rgba(255,255,255,.95))}
    100%{transform:scale(1);filter:brightness(1)}}
  @keyframes temaTriIn{from{transform:scale(.88)}to{transform:scale(1)}}
  @keyframes temaTriOut{to{transform:scale(1.3);opacity:0;filter:blur(7px)}}
  @keyframes temaSplashOut{to{opacity:0;visibility:hidden}}

  @media (prefers-reduced-motion:reduce){
    #tema-splash,#tema-loadbeam{display:none;}
    body[data-theme=&quot;panel&quot;] *,body[data-theme=&quot;panel&quot;] *::before,body[data-theme=&quot;panel&quot;] *::after{animation:none!important;}
  }

  /* --- tipografi (tema: 13.5px, sik harf araligi) --- */
  body[data-theme=&quot;panel&quot;]{font-size:13.5px;letter-spacing:-.005em;}
  body[data-theme=&quot;panel&quot;] h1{font-weight:640;letter-spacing:-.02em;}

  /* --- notlar (tema: .note — sol kenarda vurgu, kendi zemini) --- */
  body[data-theme=&quot;panel&quot;] .note{background:var(--input-bg);border:1px solid var(--border);
    border-left:2px solid #2a2e35;padding:6px 10px;border-radius:0 var(--r-s) var(--r-s) 0;
    font-size:11.5px;line-height:1.5;transition:border-left-color .18s;}
  body[data-theme=&quot;panel&quot;] .note:hover{border-left-color:var(--accent);}
  /* Bos not kutusu cizgi gibi gorunurdu — kutu yalniz metin varken cizilir. */
  body[data-theme=&quot;panel&quot;] .note:empty{display:none;}

  /* --- rozetler (tema: .chip) --- */
  body[data-theme=&quot;panel&quot;] .badge{background:var(--accent-soft);color:var(--accent);border-color:transparent;
    font-weight:600;letter-spacing:.01em;}

  /* --- durum kutulari: sol kenarda renk seridi --- */
  body[data-theme=&quot;panel&quot;] .status{border-left:2px solid currentColor;border-radius:0 var(--r-s) var(--r-s) 0;}

  /* --- kart basliginin altindaki cizgi buyuyerek gelsin (tema: h2::after lineGrow) --- */
  @keyframes temaCizgiBuyu{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  body[data-theme=&quot;panel&quot;] .section h2{position:relative;}
  body[data-theme=&quot;panel&quot;] .section h2::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,var(--accent),transparent 70%);opacity:.6;transform-origin:left;}
  body[data-theme=&quot;panel&quot;].tema-giris .section.tema-gir h2::after{animation:temaCizgiBuyu .75s cubic-bezier(.16,1,.3,1) both;
    animation-delay:calc(140ms + var(--i,0) * 55ms);}

  /* ---------- TEMEL ---------- */
  *{box-sizing:border-box;}
  ::selection{background:var(--accent-soft);color:var(--text);}
  body{background:var(--bg);color:var(--text);
    /* 'Inter' başta olmalı: BlinkMacSystemFont Windows'ta sistem fontuna çözüldüğü için
       kendinden sonrakileri hiç sıraya sokmuyordu. fitLabelText'teki stack ile aynı kalmalı. */
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    font-size:14px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  h1{font-size:19px;font-weight:700;letter-spacing:-.2px;margin:0;color:var(--text);}
  .appdev{color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.2px;display:block;margin-top:4px;opacity:.8;}

  /* İnce kaydırma çubuğu */
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(128,132,138,.35);border-radius:999px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(128,132,138,.5);background-clip:padding-box;}

  /* ---------- UYGULAMA ÇUBUĞU ---------- */
  .appbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:14px;
    background:var(--header-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--border);padding:14px 24px;}
  .appbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .appbar-right label{margin:0 4px 0 0;display:inline;color:var(--muted);font-size:13px;}

  /* ---------- YERLEŞİM ---------- */
  .app{display:grid;grid-template-columns:320px 1fr;gap:20px;padding:20px 24px;align-items:start;}
  .side{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 104px);overflow-y:auto;}
  .main{min-width:0;}
  @media(max-width:1150px){ .app{grid-template-columns:1fr;} .side{position:static;max-height:none;} }

  /* ---------- GÖRÜNÜM SEKMELERİ (segmented control) ---------- */
  .viewbar{position:relative;display:inline-flex;gap:2px;padding:4px;margin-bottom:20px;
    background:var(--panel2);border:1px solid var(--border);border-radius:999px;}
  .viewbar-thumb{position:absolute;top:4px;left:0;height:calc(100% - 8px);background:var(--panel);
    border-radius:999px;box-shadow:var(--shadow-sm-el);
    transition:transform .28s cubic-bezier(.4,0,.2,1),width .28s cubic-bezier(.4,0,.2,1);z-index:0;}
  .vbtn{position:relative;z-index:1;background:transparent;border:none;color:var(--muted);
    padding:9px 20px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;letter-spacing:0;border-radius:999px;transition:color .2s ease;}
  .vbtn:hover{color:var(--text);}
  .vbtn.active{color:var(--text);}
  .view{display:none;}
  .view.active{display:block;}

  /* ---------- KARTLAR ---------- */
  .section{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-m);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-card);}
  .section h2{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--text);margin:0 0 14px;border-bottom:1px solid var(--border);padding-bottom:12px;}
  .section h2::before{content:'';width:6px;height:6px;flex:0 0 auto;border-radius:50%;background:var(--accent);}
  .side .section{margin-bottom:0;padding:16px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
  .grid > div{display:flex;flex-direction:column;justify-content:flex-end;}
  .side .grid{grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px;}

  /* ---------- FORM ---------- */
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:510;text-transform:none;letter-spacing:0;}
  label .lbl-1, label .lbl-2{display:block;white-space:nowrap;}
  label .lbl-2{margin-top:1px;}
  input, select{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:var(--r-s);font-size:14px;font-family:inherit;font-variant-numeric:tabular-nums;
    transition:border-color .15s ease,box-shadow .15s ease;}
  input::placeholder{color:var(--muted);opacity:.65;}
  select{cursor:pointer;}
  input.readonly{color:var(--muted);background:var(--panel2);}
  input:focus, select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-ring);}

  /* ---------- BUTONLAR ---------- */
  .add-btn2{background:var(--accent);color:var(--accent-fg);border:none;padding:11px 22px;border-radius:999px;
    font-weight:600;font-size:13.5px;font-family:inherit;cursor:pointer;letter-spacing:0;white-space:nowrap;
    box-shadow:var(--shadow-sm-el);transition:transform .12s ease,filter .15s ease;}
  .add-btn2:hover{filter:brightness(1.08);}
  .add-btn2:active{transform:scale(.97);}
  .add-btn2.ghost{background:var(--accent-soft);color:var(--accent);box-shadow:none;}
  .add-btn2.ghost:hover{filter:brightness(1.05);}
  .del-btn{background:var(--bad-soft);color:var(--bad);border:none;padding:9px 16px;border-radius:999px;
    font-weight:600;font-size:12.5px;font-family:inherit;cursor:pointer;transition:filter .15s ease,transform .12s ease;}
  .del-btn:hover{filter:brightness(1.1);}
  .del-btn:active{transform:scale(.97);}
  .del-btn:disabled{background:var(--panel2);color:var(--muted);cursor:not-allowed;}

  /* ---------- SEKMELER (yüz + modül) ---------- */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .tab{padding:9px 16px;background:transparent;border:1px solid var(--border);border-radius:999px;cursor:pointer;
    font-size:13px;font-weight:600;color:var(--muted);transition:all .15s ease;}
  .tab:hover{color:var(--text);border-color:var(--muted);}
  .tab.active{background:var(--accent-soft);color:var(--accent);border-color:transparent;}

  /* ---------- TABLO ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
  th{background:var(--panel2);color:var(--muted);font-weight:600;padding:8px 10px;text-align:center;border:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
  td{padding:7px 10px;border:1px solid var(--border);text-align:center;}
  tbody tr:hover td{background:var(--panel2);}
  .profil-table td:first-child, .profil-table th:first-child, .cut-table td:first-child{text-align:left;}

  /* ---------- DURUM & NOT ---------- */
  .status{font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:12px;margin-top:14px;line-height:1.5;}
  .status.good{background:rgba(50,215,75,.12);color:var(--good);}
  .status.warn{background:rgba(255,179,64,.14);color:var(--warn);}
  .status.bad{background:var(--bad-soft);color:var(--bad);}
  .status.info{background:var(--accent-soft);color:var(--muted);}
  .note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55;}

  /* ---------- HER-ZAMAN-GÖRÜNÜR SORUN ROZETİ (üstbilgi, tüm sekmelerde sabit) ---------- */
  .issues-badge{position:relative;background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);
    border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;user-select:none;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .issues-badge:hover{filter:brightness(1.12);}
  .issues-panel{position:absolute;top:calc(100% + 8px);right:0;background:var(--panel2);border:1px solid var(--border);
    border-radius:var(--r-m);box-shadow:var(--shadow-pop);padding:10px 14px;min-width:280px;max-width:420px;
    max-height:360px;overflow-y:auto;z-index:80;text-align:left;white-space:normal;font-weight:400;}
  .issues-panel .issue-row{font-size:12.5px;color:var(--text);padding:7px 0;border-bottom:1px solid var(--border);line-height:1.5;}
  .issues-panel .issue-row:last-child{border-bottom:none;}
  .issues-panel .issue-face{font-weight:700;display:block;margin-bottom:2px;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .badge{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:11px;color:var(--muted);font-weight:500;}
  .checkbox-row{display:flex;align-items:center;gap:8px;}
  .checkbox-row input[type=checkbox]{width:auto;accent-color:var(--accent);transform:scale(1.1);}
  .checkbox-row label{margin:0;text-transform:none;font-size:13px;color:var(--text);}
  .dim-readout{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
  .dim-readout div{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:9px 15px;}
  .dim-readout .val{font-size:16px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
  .dim-readout .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .orient-select{max-width:230px;}

  /* ---------- ÇİZİM ALANLARI (tema bağımsız açık görünüm penceresi) ---------- */
  .canvas-wrap{background:#ffffff;border:1px solid var(--border);border-radius:var(--r-m);padding:16px;overflow-x:auto;box-shadow:var(--shadow-card);}
  #canvas3d{position:relative;width:100%;aspect-ratio:900/560;overflow:hidden;border-radius:8px;}
  #canvas3d canvas{display:block;width:100%;height:100%;}
  #canvas3d .label3d{position:absolute;pointer-events:none;font-family:inherit;white-space:nowrap;text-align:center;transform:translate(-50%,-50%);}
  #canvas3d .label3d .l1{font-size:13px;font-weight:700;color:#000000;text-shadow:0 1px 2px rgba(255,255,255,.85),0 0 3px rgba(255,255,255,.7);}
  #canvas3d .label3d .l3{font-size:11px;font-weight:600;color:#000000;text-shadow:0 1px 2px rgba(255,255,255,.85),0 0 3px rgba(255,255,255,.7);}
  #canvas3d .label3d .l2{font-size:12px;font-weight:700;color:#000000;text-shadow:0 1px 2px rgba(255,255,255,.85),0 0 3px rgba(255,255,255,.7);}
  #canvas3d .label3d .l1.bos,#canvas3d .label3d .l3.bos,#canvas3d .label3d .l2.bos{color:#ffffff;text-shadow:0 1px 2px rgba(0,0,0,.6);}
  #canvas3d .label3d.modname{font-size:13px;font-weight:700;color:#4fb8a8;text-shadow:0 1px 2px rgba(0,0,0,.5);}
  .app-footer{text-align:center;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.4px;padding:20px 20px 26px;opacity:.6;}
  svg{display:block;margin:0 auto;}
  .svg-panel{cursor:pointer;}
  .svg-panel:hover .panel-rect{stroke:#4fb8a8;stroke-width:2.5;}
  .panel-rect.selected{stroke:#4fb8a8;stroke-width:3;}
  .svg-gap, .svg-innergap, .svg-addpanel, .svg-addrow, .svg-addcol, .svg-anacut{cursor:pointer;}
  .svg-anacut:hover circle:first-child{fill:#4fb8a8;r:6;}
  .svg-addpanel:hover rect, .svg-addrow:hover rect, .svg-addcol:hover rect{fill:#2a4a44;}
  .svg-gap:hover .gap-hint, .svg-innergap:hover .gap-hint{stroke:#4fb8a8;stroke-width:2;}

  /* ---------- DÜZENLEYİCİ & LEJANT ---------- */
  .face-main-row{display:flex;gap:16px;align-items:flex-start;}
  .face-main-left{flex:1;min-width:0;}
  .face-side-editor{width:310px;flex-shrink:0;position:sticky;top:16px;}
  .editor{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-m);padding:18px 18px 18px 22px;display:block;box-shadow:var(--shadow-pop);position:relative;}
  .editor::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--accent);}
  .editor .grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));}
  .editor-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;}
  .editor-placeholder{color:var(--muted);font-size:12px;text-align:center;padding:24px 0;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{display:inline-block;width:13px;height:13px;border-radius:4px;border:1px solid var(--border);}

  /* ---------- ERİŞİLEBİLİRLİK ---------- */
  button:focus-visible, .tab:focus-visible, .vbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:999px;}
  /* ---------- DXF'TEN AKTARIM MODALI ---------- */
  #dxa_modal{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;padding:22px;}
  #dxa_modal.open{display:flex;}
  #dxa_backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62);}
  .dxa-panel{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-m);
    box-shadow:var(--shadow-pop);color:var(--text);width:min(96vw,1060px);max-height:92vh;
    display:flex;flex-direction:column;overflow:hidden;}
  .dxa-head{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .dxa-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.2px;}
  .dxa-nav{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;}
  .dxa-nav button{background:var(--panel2);color:var(--text);border:1px solid var(--border);
    border-radius:var(--r-s);padding:2px 10px;font:inherit;font-size:14px;cursor:pointer;line-height:1.5;}
  .dxa-nav button:disabled{opacity:.35;cursor:default;}
  #dxa_kapat{background:none;border:none;color:var(--muted);font-size:22px;padding:0 2px;}
  #dxa_kapat:hover{color:var(--accent);}
  #dxa_serit{display:flex;flex-wrap:wrap;gap:6px;padding:9px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .dxa-cip{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:3px 11px;
    font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;user-select:none;}
  .dxa-cip.sec{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring);}
  .dxa-cip.pas{opacity:.45;}
  .dxa-nokta{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  #dxa_body{padding:14px 18px 18px;overflow:auto;flex:1;}
  .dxa-kunye{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:9px 18px;}
  .dxa-kunye>div{font-size:11.5px;color:var(--muted);line-height:1.35;}
  .dxa-kunye b{display:block;color:var(--text);font-size:13.5px;font-weight:600;}
  .dxa-kunye b.bos{color:var(--warn);}
  .dxa-secenek{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:13px 0 4px;}
  .dxa-secenek label{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;margin:0;font-weight:600;}
  .dxa-secenek input{width:auto;margin:0;}
  #dxa_body h3{font-size:11.5px;margin:15px 0 5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  #dxa_body table{width:100%;border-collapse:collapse;font-size:12.5px;}
  #dxa_body th,#dxa_body td{border:1px solid var(--border);padding:4px 9px;text-align:left;}
  #dxa_body th{background:var(--panel2);font-weight:600;font-size:11.5px;}
  #dxa_body td.n{text-align:right;font-variant-numeric:tabular-nums;}
  #dxa_body tr.k-alt td:first-child{box-shadow:inset 3px 0 0 var(--accent);}
  #dxa_body tr.k-ust td:first-child{box-shadow:inset 3px 0 0 var(--warn);}
  #dxa_body tr.k-tam td:first-child{box-shadow:inset 3px 0 0 var(--bad);}
  #dxa_body ul.dxa-liste{margin:7px 0 0;padding-left:18px;font-size:12px;font-weight:400;line-height:1.6;}
  .dxa-sema{border:1px solid var(--border);border-radius:var(--r-s);background:var(--panel2);
    padding:8px;margin-top:6px;overflow:auto;}
  .dxa-alt{padding:11px 18px;border-top:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-shrink:0;}
  .dxa-alt .dxa-not{font-size:11.5px;color:var(--muted);flex:1;line-height:1.45;}
  /* ---------- GERÇEK YERLEŞİM — SANTRAL SEÇİMİ ---------- */
  /* Panel/başlık/alt satır DXF aktarım modalının sınıflarını paylaşır (.dxa-panel /
     .dxa-head / .dxa-alt) — beş temada da çalışması onlara bağlı. */
  #gsm_modal{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;padding:22px;}
  #gsm_modal.open{display:flex;}
  #gsm_backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62);}
  #gsm_kapat{background:none;border:none;color:var(--muted);font-size:22px;padding:0 2px;cursor:pointer;}
  #gsm_kapat:hover{color:var(--accent);}
  #gsm_ust{display:flex;gap:8px;align-items:center;padding:9px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
  #gsm_ust button{padding:3px 12px;font-size:12px;width:auto;margin:0;}
  #gsm_body{padding:8px 18px 14px;overflow:auto;flex:1;}
  .gsm-satir{display:flex;align-items:flex-start;gap:11px;padding:9px 12px;border:1px solid var(--border);
    border-radius:var(--r-s);margin-top:7px;cursor:pointer;user-select:none;background:var(--panel2);}
  .gsm-satir:hover{border-color:var(--accent);}
  .gsm-satir.sec{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring);}
  .gsm-satir input{width:auto;margin:2px 0 0;flex-shrink:0;}
  .gsm-ad{font-size:13.5px;font-weight:600;}
  .gsm-bilgi{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4;}
  .gsm-bilgi .u{color:var(--warn);}
  .gsm-rozet{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--border);
    border-radius:999px;padding:1px 9px;flex-shrink:0;}
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important;}
  }
</style>
</head>
<body>

<header class=&quot;appbar&quot;>
  <div>
    <h1>AHU Panel Konfigüratörü</h1>
    <span class=&quot;appdev&quot;>Cenk Altınay</span>
  </div>
  <div class=&quot;appbar-right&quot;>
    <div style=&quot;display:flex;align-items:center;gap:6px;&quot;>
      <label for=&quot;theme_sel&quot; style=&quot;margin:0;&quot;>Tema</label>
      <select id=&quot;theme_sel&quot; style=&quot;width:130px;&quot;>
        <option value=&quot;gece&quot; selected>Gece</option>
        <option value=&quot;celik&quot;>Çelik</option>
        <option value=&quot;aydinlik&quot;>Aydınlık</option>
        <option value=&quot;kehribar&quot;>Kehribar</option>
        <option value=&quot;nordik&quot;>Nordik</option>
        <option value=&quot;panel&quot;>Panel</option>
      </select>
    </div>
    <button class=&quot;add-btn2&quot; id=&quot;btn_save_proj&quot; style=&quot;background:linear-gradient(135deg,#2a6496,#3a85c4);color:#fff;&quot; title=&quot;Projeyi .ahu.json dosyasına indir&quot;>💾 Projeyi Kaydet</button>
    <label class=&quot;add-btn2&quot; style=&quot;background:linear-gradient(135deg,#3a5a3a,#4a7a4a);color:#fff;cursor:pointer;margin:0;&quot; title=&quot;Kaydedilmiş .ahu.json dosyasını yükle&quot;>
      📂 Proje Aç

];
const SABIT_TYPES = [&quot;Üst Panel&quot;,&quot;Normal Panel&quot;,&quot;Boğaz Uzun&quot;,&quot;Boğaz 2 Uzun&quot;];
const ACILIR_TYPES = [&quot;Camlı Açılır&quot;,&quot;Camsız Açılır&quot;];
const ELEMAN_TYPES = [&quot;Damper&quot;,&quot;Boğaz&quot;,&quot;Tava&quot;];               // panel değil: 0 tolerans, girilen ölçü = kesim ölçüsü
const BOS_TYPES = [&quot;Boş Alan&quot;];                             // bilinçli boşluk: yer kaplar, kesim listesine girmez
// Ara kat gözünde kapak tipleri geçerli değil — ayrı liste (bkz. ARA KAT bölümü).
const ARAKAT_CELL_TYPES = [&quot;Ara Kat Paneli&quot;,&quot;Damper&quot;,&quot;Boş Alan&quot;];

const isEleman = t => ELEMAN_TYPES.includes(t);
const isBos = t => BOS_TYPES.includes(t);

// ÇİZİM YÖNÜ olan elemanlar. Damper ve boğazda girilen genişlik/yükseklik, çizimde hangi
// ÇERÇEVE PARÇASININ hangi ölçüyü takip edeceğini belirler (damperde yatay parça genişliği,
// dikey parça yüksekliği sürer). Bu eşleme artık sabit değil, göz bazında seçilir —
// panel.yon: '' (yatay, varsayılan) | 'dikey'.
// Tava bilerek DIŞARIDA: gövde boyu ekseni fiziksel olarak asimetriktir (üst büküm payı
// 52.5, alt payı 60'lıkta 77.5 / 50'likte 62.5), ölçü takas etmek başka bir tava çizer.
const ELEMAN_YONLU = ['Damper', 'Boğaz'];
const isYonlu = t => ELEMAN_YONLU.includes(t);
const isDikeyEleman = p => isYonlu(p.type) && p.yon === 'dikey';
// Yönlü elemanın ÇİZİME giden ölçüsü — takas formülünün TEK kopyası, kopyalamayın.
// 'dikey' seçilirse girilen genişlik dikey parçaya, yükseklik yatay parçaya gider; bölme
// eşiği (damper 1800 / boğaz 1950) de takas SONRASI yatay ölçüye bakar, çünkü bölünme
// yatay parçanın imal edilebilir uzunluğundan doğar. Takas YALNIZ çizime gider: yüzdeki
// yerleşim, tolerans ve kesim ölçüsü değişmez.
// TAM BOGAZ (Cenk, 29.08.2026): agiz gozu bolumun tamamini kaplayabilir ama BOGAZIN
// KESIM OLCUSU cizimden gelendir — aradaki pay cerceveye gider, kapak degildir.
// panel.elemanOlcu YALNIZ boyle bir durumda var olur (panel.yon deseni); yoksa gozun
// kendi olcusu (sabitW/sabitH) kesim olcusudur.
// PANELE MONTE AGIZ: panelin IC ve DIS sacina acilan delik. Alan YALNIZ boyle bir
// panelde var olur (panel.yon deseni) — gecersizse syncStructure dusurur ki JSON
// gidis-donusu sabit nokta kalsin. x/y panelin SOL-ALT kosesine gore (DXF yonu).
function gecerliDelik(p){
  const d = p && p.delik;
  return !!(d && Number(d.w) > 0 && Number(d.h) > 0 && Number(d.x) >= 0 && Number(d.y) >= 0);
}
function kesimOlcusu(p){
  const eo = p.elemanOlcu;
  return { w: (eo && eo.w > 0) ? eo.w : p.sabitW, h: (eo && eo.h > 0) ? eo.h : p.sabitH };
}
function elemanCizimOlcusu(p){
  const k = kesimOlcusu(p);
  return isDikeyEleman(p) ? {w: k.h, h: k.w} : {w: k.w, h: k.h};
}

const TYPE_COLORS = {
  &quot;Üst Panel&quot;:&quot;#a8bdd1&quot;, &quot;Normal Panel&quot;:&quot;#afc2d4&quot;,
  &quot;Boğaz Uzun&quot;:&quot;#e2cea2&quot;, &quot;Boğaz 2 Uzun&quot;:&quot;#e5c4a9&quot;,
  &quot;Camlı Açılır&quot;:&quot;#99cde0&quot;, &quot;Camsız Açılır&quot;:&quot;#a4cce0&quot;,
  &quot;Damper&quot;:&quot;#b7bcc2&quot;, &quot;Boğaz&quot;:&quot;#e2bfa1&quot;, &quot;Tava&quot;:&quot;#939ea9&quot;,
  &quot;Boş Alan&quot;:&quot;#7499be&quot;, &quot;Ara Kat Paneli&quot;:&quot;#b3c9b8&quot;
};

/*
 ARA KAT — modülün İÇİNE yatay yerleşen ara döşeme. Kapak değil, iç parçadır.
 Modülün L ve W ölçülerinden hesaplanır (H ile ilgisi yok, kot tutulmaz), 3B'de ÇİZİLMEZ,
 modül başına EN FAZLA 1 tanedir ve açılıp kapatılır (araKat.aktif).

 Çerçevesi iki kare profilden biriyle yapılır (30×30 / 30×60). Bu profillerde takviye
 plastiği ve köşe plastiği YOKTUR — parçalar kaynatılır. Köşe birleşimi 45° gönye DEĞİL:
 bir yöndeki profil boydan boya gider, diğer yöndeki aradan girip 2p kadar kısalır.

 Izgara mantığı yüzlerinkiyle BİREBİR aynı problem olduğu için ikinci bir hesap hattı
 yazılmadı: ara kat, FACE_DEFS'in DIŞINDA duran 7. sanal yüzdür (fi = ARAKAT_FI = 6).
 FACE_DEFS 6 elemanlı kalır — dizi büyütülseydi ara kat 3B/Excel/panel-export döngülerinin
 hepsine sessizce girerdi. computeFace ilk üç satırında faceDefOf/faceOf/vOf çözücülerine
 bağlanır, gerisi (syncStructure, applyDims, resolveColumnLayout, takviyeRecords) hiç
 değişmeden çalışır.
*/
const ARAKAT_FI   = 6;
const ARAKAT_DEF  = {name:'ARA KAT', wKey:'L', hKey:'W'};
const ARAKAT_CODE = 'AK';           // canlı kod öneki (AK-B1K2) ve export sayacı (…-AK1)

// Ara kat profilleri — 'etki' = iç ölçüyü etkileyen kenar (p)
// `etki` = profilin iç ölçüyü daralttığı pay (p). `tip` = f1'in ARA KAT çizim tipi:
// parça aynı ailedendir, tip yalnız BÜKÜM ölçüsünü seçer (4.5X3 → dış 45, 5X3 → dış 50).
//
// PROFİLSİZ (2026-08-25, yol haritası #1): ara katın kendi çerçevesi ve bölme profili
// YOKTUR. p=0 olduğu için panel, modülün iç açıklığının tamamını kaplar
// (açıklık = iç ölçü = L−düşüm × W−düşüm) ve kendi bükümüyle oturur — bu yüzden dış
// büküm 45 değil 50 mm, yani çizim tipi 5X3. Sipariş listesine profil parçası girmez.
const ARAKAT_PROFILLER = {
  '30x30':     { ad:'30×30',     etki:30, tip:'4.5X3' },
  '30x60':     { ad:'30×60',     etki:60, tip:'4.5X3' },
  'profilsiz': { ad:'Profilsiz', etki:0,  tip:'5X3'   }
};
// Modülün dış ölçüsünden iç ölçüye geçerken düşülen toplam pay — AHU profil serisinden.
// Tanınmayan/özel seri 60'lık davranışına düşer (TAVA_ALT varsayılanının aynısı).
const ARAKAT_DUS = { '50':100, '60':130 };
const ARAKAT_DUS_VARSAYILAN = 130;
// Ara kat panelinde imalat toleransı uygulansın mı. false → 0 tolerans (girilen ölçü =
// kesim ölçüsü). Tek anahtar: applyDims'e (tolerans formülünün tek kopyası) dokunmadan
// getVAraKat'ın döndürdüğü tolW/tolH sıfırlanır.
const ARAKAT_TOLERANS = true;

/*
 IZGARA VERİ MODELİ
 face = {
   kapaksiz, orient ('H': bölümler soldan sağa | 'V': bölümler yukarıdan aşağıya),
   columns: [ { size, panels:[{size,type,colSize,colSpan,spanSize}], innerGaps:[bool], araJoinNext:[bool] } ],
   colGaps: [bool],           // bölümler arası ANA takviye (orient H → dikey)
   anaSplitLevels: [[idx,…]], // colGaps ile paralel: bu ANA takviyenin HANGİ seviyelerden
                              // kesildiği (bkz. sharedGapLevels). Boş dizi = boydan boya sürekli.
   selectedCells: [{col, idx}, …],                             // Ctrl ile çoklu seçilebilir
   selectedBars:  [{kind:'ana', i} | {kind:'ara', ci, gi}, …]   // Ctrl ile çoklu seçilebilir
 }
 column.size  = bölümün ana yöndeki ölçüsü (H orient → kapak genişliği w)
 panel.size   = kapağın dik yöndeki ölçüsü  (H orient → kapak yüksekliği h)
                Bölümde TEK kapak varsa ve size=0 → otomatik tam yükseklik.
 panel.colSize  = bu kapağın ana yöndeki ölçüsü (girilmemişse column.size kullanılır).
                  Bölümün genişliği, içindeki kapakların colSize'larının EN BÜYÜĞÜdür —
                  bir satır komşusundan farklı genişlik taşıyabilsin diye (kademe).
 panel.colSpan  = bu kapağın kaç bölüm kapladığı (varsayılan 1). n>1 ise kapak sağındaki
                  n-1 bölüme taşar; aradaki ANA takviye O BANTTA kalkar ve kapladığı
                  bölümlerdeki hizalı hücreler &quot;covered&quot; olur — geometriye katkı verir
                  ama kapak sayılmaz (kesim listesi/DXF/Excel dışında kalır). Böylece üst
                  satır ile alt satır FARKLI sayıda kapak içerebilir.
 panel.spanSize = BİRLEŞİK kapağın elle girilmiş ana yön ölçüsü (0/yok = kapladığı bölümlerin
                  toplamından türetilir). Girilirse o satır komşularından farklı biter;
                  birleşimden sonraki ANA takviye zorunlu olarak kesilir ki satır kendi
                  genişliğini taşıyabilsin. colSpan 1'e düşerse syncStructure temizler.
 innerGaps[i]   = bölüm içindeki i. ile i+1. kapak arasında ARA takviye (orient H → yatay)
 araJoinNext[i] = bu bölümün i. seviyesindeki ARA takviye bir SONRAKİ bölümle BİRLEŞİK mi
                  (varsayılan false = bugünkü gibi her bölüm kendi parçası)
 cont / anaSplit / selected / selectedBar alanları artık okunmuyor (eski projelerle geriye
 dönük uyumluluk için syncStructure bir kez göç ettirir, sonra zararsızca durur).
*/
function newColumn(){ return { size:0, panels:[{size:0, type:&quot;Normal Panel&quot;, colSpan:1}], innerGaps:[], araJoinNext:[] }; }
function newFaceSet(){
  return FACE_DEFS.map(()=>({
    kapaksiz: false,
    orient: 'H',
    selectedCells: [],
    selectedBars: [],
    columns: [ newColumn() ],
    colGaps: [],
    anaSplitLevels: []
  }));
}

// Çoklu seçimde &quot;birincil&quot; öğe = en son tıklanan. Tek kapak/tek bar düzenleyicisi bunu kullanır.
function selCell(face){ const a = face.selectedCells; return (a && a.length) ? a[a.length-1] : null; }
function selBar(face){ const a = face.selectedBars; return (a && a.length) ? a[a.length-1] : null; }
function sameCell(a,b){ return a.col===b.col && a.idx===b.idx; }
function sameBar(a,b){
  if(a.kind!==b.kind) return false;
  return a.kind==='ana' ? a.i===b.i : (a.ci===b.ci && a.gi===b.gi);
}
// Ctrl/Cmd basılıysa listeye ekle/çıkar, değilse tek öğeye indir (tekrar tıklama = seçimi kaldır).
function toggleSel(list, item, eq, additive){
  const at = list.findIndex(x=>eq(x,item));
  if(additive){
    if(at>=0) list.splice(at,1); else list.push(item);
    return list;
  }
  return (at>=0 && list.length===1) ? [] : [item];
}
// Ara kat ızgarası yüz nesnesiyle AYNI şekilde olmak zorunda (syncStructure ve tüm editör
// kodu üzerinde çalışıyor). 'kapaksiz' ara katta kullanılmaz — açık/kapalı bilgisi
// araKat.aktif'te durur.
function newAraKatGrid(){
  const c = newColumn();
  c.panels[0].type = 'Ara Kat Paneli';   // newColumn 'Normal Panel' verir — ara katta yok
  return { kapaksiz:false, orient:'H', selectedCells:[], selectedBars:[],
           columns:[ c ], colGaps:[], anaSplitLevels:[] };
}
function newAraKat(){
  return {
    aktif: false,
    profil: '30x30',        // '30x30' | '30x60'
    surekliYon: '',         // '' = otomatik (uzun kenar) | 'L' | 'W'
    grid: newAraKatGrid()
  };
}
// Modül başına EN FAZLA 1 ara kat — tekil nesne, dizi değil. Alanı olmayan eski
// modüllerde tembel kurulur (göç); applyProjectData yüklerken de bir kez normalize eder.
function araKatOf(m){
  if(!m) return null;
  if(!m.araKat || typeof m.araKat !== 'object') m.araKat = newAraKat();
  const ak = m.araKat;
  if(!ARAKAT_PROFILLER[ak.profil]) ak.profil = '30x30';
  if(ak.surekliYon!=='L' && ak.surekliYon!=='W') ak.surekliYon = '';
  if(!ak.grid || typeof ak.grid !== 'object') ak.grid = newAraKatGrid();
  // Izgara newColumn()'u paylastigi icin YENI eklenen her bolum 'Normal Panel' ile gelir —
  // ara katta boyle bir tip yok. Duzeltilmezse goz ekranda 'Normal Panel' gorunur ve
  // dışa aktarımda 'Ara Kat Paneli' filtresine takilmayip SESSIZCE düşer (arakatList bos
  // kalir). Burada her cagride normalize ediliyor: faceOf(ARAKAT_FI) bu fonksiyondan
  // gectigi icin sonradan eklenen bolumler de kapsanir.
  (ak.grid.columns||[]).forEach(col=>{
    (col.panels||[]).forEach(p=>{
      if(!ARAKAT_CELL_TYPES.includes(p.type)) p.type = 'Ara Kat Paneli';
    });
  });
  return ak;
}
function newModule(){ return { L:0, H:0, W:0, pos:{x:0,y:0,z:0}, faces: newFaceSet(), araKat: newAraKat(), esanjor: newEsanjor() }; }
function newAhu(n){ return { ad:'AHU-'+(n||1), malzeme:'', active:0, modules:[newModule()], varsayimlar:{seri:'', tolW:3, tolH:3} }; }

// ---------- ÜRETİM ADEDİ (2026-08-31) ----------
// Aynı santralden birden fazla cihaz üretilebilir (Cenk, 31.08.2026). Adet SANTRAL
// bazındadır — bütün AHU o kadar kez üretilir, modül bazında bir sayı yoktur.
//
// Alan YALNIZ 1'den büyükken var olur (panel.yon deseni): tek cihazlık projede JSON
// bugünküyle birebir aynı kalır ve projectData() -> JSON -> applyProjectData() gidiş
// dönüşü sabit nokta olmaya devam eder.
const ADET_MAX = 999;
function ahuAdet(a){
  const n = Math.round(Number(a && a.adet));
  return (n > 1 && n <= ADET_MAX) ? n : (n > ADET_MAX ? ADET_MAX : 1);
}
function aktifAdet(){ return ahuAdet(state.ahus[state.activeAhu]); }
function ahuAdetYaz(a, v){
  if(!a) return 1;
  const n = ahuAdet({ adet: v });
  if(n > 1) a.adet = n; else delete a.adet;
  return n;
}
// applyProjectData sonunda çağrılır: geçersiz/1 değerler DÜŞER, yoksa gidiş-dönüş
// sabit nokta olmazdı (araKatNormalize / esanjorNormalize ile aynı gerekçe).
function adetNormalize(){ state.ahus.forEach(a=>ahuAdetYaz(a, a.adet)); }

const GLASS_R_MM = 75; // gözetleme camı: sabit Ø150 mm (katalog değeri)

const state = {
  dims: {},
  proje: { isNo:'', ad:'' },
  activeAhu: 0,
  ahus: [ newAhu(1) ]
};
// modules / active / varsayimlar → aktif AHU'ya yönlenir
Object.defineProperty(state, 'modules', { get(){ return state.ahus[state.activeAhu].modules; }, set(v){ state.ahus[state.activeAhu].modules = v; }, enumerable:true });
Object.defineProperty(state, 'active',  { get(){ return state.ahus[state.activeAhu].active;  }, set(v){ state.ahus[state.activeAhu].active  = v; }, enumerable:true });
Object.defineProperty(state, 'varsayimlar', { get(){ return state.ahus[state.activeAhu].varsayimlar; }, set(v){ state.ahus[state.activeAhu].varsayimlar = v; }, enumerable:true });
// Geriye uyumluluk: mevcut tüm yüz kodu aktif modül üzerinden çalışır
Object.defineProperty(state, 'faces', { get(){ return state.modules[state.active].faces; } });
// Ölçü setter'ları: değer değişince o eksende İLERİDEKİ ve büyüyen modüle TEMASLA
// BAĞLI modüller delta kadar kayar — bitişik montaj korunur: boşluk açılmaz, iç içe
// girme oluşmaz. Temas zinciri şart: yan şeritteki bir kule, yanındaki modül büyüdü
// diye havalanmamalı (bkz. itilecekModuller).
['W','H','L'].forEach(k=>{
  const axis = {L:'x', H:'y', W:'z'}[k];
  Object.defineProperty(state.dims, k, {
    get(){ return state.modules[state.active][k]; },
    set(v){
      const md = state.modules[state.active];
      const oldExt = modExt(md, axis);
      // Küme ESKİ geometriyle çözülmeli — md büyüdükten sonra komşusuyla temas değil
      // çakışma görünür. Bu yüzden delta önce hesaplanır, atama en sonda yapılır.
      const delta = (v>0 ? v : PH3[k]) - oldExt;
      if(delta !== 0) itilecekModuller(md, axis, oldExt).forEach(B=> B.pos[axis] += delta);
      md[k] = v;
    }
  });
});
function withModule(m, fn){
  const prev = state.active; state.active = m;
  try{ return fn(); } finally{ state.active = prev; }
}

// ---------- ARA KAT ÇÖZÜCÜLERİ ----------
// fi = ARAKAT_FI geldiğinde yüz dizilerinin yerine ara kat nesnesini verirler. Tüm
// render/editör/handler kodu doğrudan state.faces[fi] / FACE_DEFS[fi] yerine bunları
// kullanır; böylece FACE_DEFS 6 elemanlı kalır ve ara kat yalnızca elle bağladığımız
// yerlere girer (3B, panel export ve Excel yüz döngüleri onu kendiliğinden atlar).
function isAraKat(fi){ return fi === ARAKAT_FI; }
function activeAraKat(){ return araKatOf(state.modules[state.active]); }

/*
 EŞANJÖR — 8. sekme (2026-08-25, yol haritası #2)

 Eşanjör KAREdir ve modülün içine 45° döndürülmüş (baklava) oturur. Kullanıcı üç şey girer:
 kenar ölçüsü, üst kat ölçüsü ve sağa olan uzaklık; f1'in eşanjör çiziminin istediği beş
 değer (CI + O1..O4) bunlardan TÜRETİLİR. Zincir (Cenk, 25.08.2026):

   x  = kenar × √2 / 2              (karenin köşegeninin yarısı)
   CI = modül iç genişliği          (W − düşüm)
   O1 = üst kat ölçüsü     − x      ← 'üst kat' baklavanın MERKEZİNE olan mesafedir
   O2 = sağa olan uzaklık  − x      ← 'sağa uzaklık' da merkeze olan mesafedir
   O3 = iç yükseklik − O1 − 2x      (2x = köşegenin tamamı)
   O4 = iç uzunluk   − 2x − O2

 ARA KAT'tan farklı olarak eşanjörün ızgarası yoktur — göz/bölüm/takviye kavramı burada
 yok. Bu yüzden computeFace ailesine HİÇ bağlanmaz (faceOf/vOf/faceDefOf çözücüleri
 büyütülmedi); kendi paneli, kendi hesabı ve kendi dışa aktarım adımı vardır.
*/
const ESANJOR_FI  = 7;
const ESANJOR_DEF = { name:'EŞANJÖR' };
// Modül iç ölçüsü = dış − 2 × kenar profili (Cenk, 25.08.2026). ARAKAT_DUS ile AYNI DEĞİL:
// ara katta seri 60 → 130, burada 120. İkisini tek tabloya bağlamayın.
const ESANJOR_DUS = { '50':100, '60':120 };
const ESANJOR_DUS_VARSAYILAN = 120;
const ESANJOR_MIN_O  = 5;    // f1 eşanjör çiziminin çizebildiği en küçük düz parça
const ESANJOR_MIN_CI = 50;
// 1.5 mm sacdan çıkan tek parça 3. ölçüdür (alt) — Cenk, 25.08.2026. İşaretli ölçüler
// f1'de ayrı bir '… (1.5 MM).dxf' dosyasına gider.
const ESANJOR_15MM = { o1:false, o2:false, o3:true, o4:false };

function newEsanjor(){
  return { aktif:false, kenar:0, ustKat:0, saga:0, kod:'' };
}
// araKatOf ile aynı desen: alanı olmayan eski modülde tembel kurar ve değerleri doğrular.
function esanjorOf(m){
  if(!m) return null;
  if(!m.esanjor || typeof m.esanjor !== 'object') m.esanjor = newEsanjor();
  const e = m.esanjor;
  ['kenar','ustKat','saga'].forEach(k=>{
    const v = Number(e[k]);
    e[k] = (isFinite(v) && v>0) ? v : 0;
  });
  if(typeof e.kod !== 'string') e.kod = '';
  e.aktif = !!e.aktif;
  return e;
}
function activeEsanjor(){ return esanjorOf(state.modules[state.active]); }

/* ================== BATARYA KIZAĞI — 9. sekme (2026-09-01) ==================
   Bataryanın altına giren kızak takımı. Takım başına üç parça, her birinden 2 adet:
   ALT L (20/20) · OMEGA (seriye göre iki çeşit) · ÜST L (bir kanadı değişken).

   Eşanjör gibi ızgarası yoktur — göz/bölüm/takviye kavramı burada da yok — bu yüzden
   computeFace ailesine HİÇ bağlanmaz: kendi paneli, kendi hesabı, kendi aktarım adımı.

   ÖLÇÜ ZİNCİRİ (Cenk, 01.09.2026):
     uçtan uca boy      = modülün DIŞ genişliği (W) − seri payı   (50 → 102, 60 → 125)
     kasa iç yüksekliği = H − 2 × kenar profili                   (50 → H−100, 60 → H−120)
     üst L değişken kanat X = iç yükseklik − 25 − HR + 30         (HR batarya föyünden)

   L ve OMEGA'nın KESİTİ SABİTTİR, yalnız boyları değişir. ÜST L'nin bir kanadı 20 kalır,
   diğeri X olur; açılımı X + 17,20 mm'dir (aşağıdaki KIZAK_ACILIM_EK).
*/
const KIZAK_FI  = 8;
const KIZAK_DEF = { name:'KIZAK' };
// Uçtan uca boy payı. ESANJOR_DUS / ARAKAT_DUS ile AYNI DEĞİL — üçünü tek tabloya bağlamayın.
const KIZAK_DUS = { '50':102, '60':125 };
const KIZAK_DUS_VARSAYILAN = 125;   // tanınmayan seride büyük pay: kısa kızak güvenli taraf
const KIZAK_UST_DUS = 25;
const KIZAK_UST_EK  = 30;
const KIZAK_SABIT_KANAT = 20;
// ÖLÇÜLDÜ (referans DXF'ler, üç parçada da tutuyor): her büküm komşu iki kanadın HER
// BİRİNDEN 3 mm götürür, yerine 3,20 mm'lik büküm bölgesi girer. 20/20 L'nin açılımı
// bu yüzden 37,20'dir → değişken kanatta açılım = (20−3) + 3,20 + (X−3) = X + 17,20.
const KIZAK_ACILIM_EK = 17.2;
const KIZAK_MIN_BOY   = 100;
const KIZAK_MIN_KANAT = 20;
const KIZAK_TAKIM_ADET = 2;   // her parçadan takım başına 2 adet (referans dosya adları)
const KIZAK_ROLLER = ['isitici','dx'];
const KIZAK_ROL_AD = { isitici:'Isıtıcı', dx:'DX / Soğutucu' };

function newKizak(){ return { aktif:false, bataryalar:[] }; }
// esanjorOf ile aynı desen: alanı olmayan eski modülde tembel kurar ve değerleri doğrular.
// Rol başına EN FAZLA BİR batarya tutulur — ikinci yükleme aynı rolün üzerine yazar.
function kizakOf(m){
  if(!m) return null;
  if(!m.kizak || typeof m.kizak !== 'object') m.kizak = newKizak();
  const k = m.kizak;
  if(!Array.isArray(k.bataryalar)) k.bataryalar = [];
  const gorulen = {};
  k.bataryalar = k.bataryalar.filter(b => b && typeof b === 'object').map(b => {
    const rol = KIZAK_ROLLER.indexOf(b.rol) >= 0 ? b.rol : KIZAK_ROLLER[0];
    const say = v => { const n = Number(v); return (isFinite(n) && n>0) ? Math.round(n) : 0; };
    const o = { rol:rol, HR:say(b.HR) };
    // Yardımcı alanlar YALNIZ doluyken var olur (panel.yon deseni) — yoksa JSON
    // gidiş-dönüşü sabit nokta olmaz.
    if(say(b.LDmax)) o.LDmax = say(b.LDmax);
    if(say(b.TR))    o.TR    = say(b.TR);
    if(typeof b.kaynak === 'string' && b.kaynak) o.kaynak = b.kaynak;
    return o;
  }).filter(b => { if(gorulen[b.rol]) return false; gorulen[b.rol] = 1; return true; });
  k.aktif = !!k.aktif;
  return k;
}
function activeKizak(){ return kizakOf(state.modules[state.active]); }
// Çizimden gelen modülde hangi batarya rolleri var (dxfBilgi) — panelde ipucu olarak yazılır.
function kizakCizimRolleri(m){
  const ps = (m && m.dxfBilgi && m.dxfBilgi.parcalar) || [];
  const out = [];
  ps.forEach(p => {
    const t = gercekIslev(p);
    const rol = (t === 'isitma') ? 'isitici' : (t === 'sogutma') ? 'dx' : '';
    if(rol && out.indexOf(rol) < 0) out.push(rol);
  });
  return out;
}

function kizakOlculeri(){
  const kz   = activeKizak();
  const seri = String(state.varsayimlar.seri);
  const V    = getV();
  const pay  = KIZAK_DUS[seri] != null ? KIZAK_DUS[seri] : KIZAK_DUS_VARSAYILAN;
  const H = Number(state.dims.H)||0, W = Number(state.dims.W)||0;
  const boy = W>0 ? W - pay : 0;
  const icH = H>0 ? H - 2*V.kenar : 0;

  const eksik = [];
  if(!(W>0)) eksik.push('Modül genişliği (W) girilmedi');
  if(!(H>0)) eksik.push('Modül yüksekliği (H) girilmedi');
  if(!seri)  eksik.push('Profil serisi seçilmedi');
  if(!kz.bataryalar.length) eksik.push('Batarya föyü (PDF) yüklenmedi — HR ölçüsü okunamıyor');

  const hatalar = [];
  if(boy>0 && boy < KIZAK_MIN_BOY)
    hatalar.push('Uçtan uca boy '+boy+' mm — en az '+KIZAK_MIN_BOY+' mm olmalı');

  const bataryalar = kz.bataryalar.map(b => {
    const X = (icH>0 && b.HR>0) ? icH - KIZAK_UST_DUS - b.HR + KIZAK_UST_EK : 0;
    const o = { rol:b.rol, ad:KIZAK_ROL_AD[b.rol], HR:b.HR, kaynak:b.kaynak||'',
                kanat:X, ustAcilim: X>0 ? Math.round((X + KIZAK_ACILIM_EK)*100)/100 : 0 };
    if(b.HR>0 && icH>0 && X < KIZAK_MIN_KANAT)
      hatalar.push(o.ad+' bataryası: üst L kanadı '+X+' mm — en az '+KIZAK_MIN_KANAT
        +' mm olmalı (HR '+b.HR+' mm bu kasaya sığmıyor)');
    return o;
  });

  // «HER BATARYANIN KIZAGI OLACAK» (Cenk, 01.09.2026). Çizimde görünen ama föyü
  // yüklenmemiş batarya, sessizce eksik bir takım demektir — malzeme az sipariş edilir.
  // KİLİTLEMEZ, çünkü çizimden rol okuma bir sezgidir; yanlış pozitifte kullanıcı tıkanmaz.
  // Kilit istenirse tek satır: bu listeyi 'hatalar'a ekleyin.
  const yuklu = bataryalar.map(b => b.rol);
  const uyarilar = kizakCizimRolleri(state.modules[state.active])
    .filter(r => yuklu.indexOf(r) < 0)
    .map(r => 'Çizimde ' + KIZAK_ROL_AD[r] + ' bataryası var ama föyü yüklenmedi — o takım üretilmez');

  return { kz, seri, pay, H, W, boy, icH, kenar:V.kenar, bataryalar, eksik, hatalar, uyarilar,
           gecerli: eksik.length===0 && hatalar.length===0 };
}

/* ---------- Batarya föyü (PDF) → LDmax / HR / TR ----------
   Kaynak: 'iş emri oto/is-emri-uygulamasi.html'. Harici kütüphane KULLANILMAZ: PDF
   akışları tarayıcının yerleşik DecompressionStream'i ile açılır, metin ToUnicode (CMap)
   tablolarıyla çözülür. Föydeki ölçü tablosunda etiket ve değer ayrı parçalar hâlinde
   gelir; her etiketten sonraki ilk sayısal parça o etiketin değeridir.            */
async function kizakPdfInflate(bytes){
  const ds = new DecompressionStream('deflate');
  const writer = ds.writable.getWriter();
  // Bir PDF'te görsel gibi zlib olmayan akışlar da bulunur; write/close'un reddi burada
  // yutulur, gerçek hata aşağıdaki okuma döngüsünden fırlar.
  writer.write(bytes).catch(()=>{});
  writer.close().catch(()=>{});
  const reader = ds.readable.getReader();
  const parcalar = [];
  let toplam = 0;
  while(true){
    const r = await reader.read();
    if(r.done) break;
    parcalar.push(r.value); toplam += r.value.length;
  }
  const sonuc = new Uint8Array(toplam);
  let ofs = 0;
  for(const p of parcalar){ sonuc.set(p, ofs); ofs += p.length; }
  return sonuc;
}
async function kizakPdfAkislari(buf){
  const bytes = new Uint8Array(buf);
  const ham = new TextDecoder('latin1').decode(bytes);
  const akislar = [];
  let i = 0;
  while(true){
    const a = ham.indexOf('stream', i);
    if(a < 0) break;
    let b = a + 6;
    if(ham.charCodeAt(b) === 13) b++;
    if(ham.charCodeAt(b) === 10) b++;
    const e = ham.indexOf('endstream', b);
    if(e < 0) break;
    // 'endstream' öncesindeki satır sonu baytları veriye dahil değildir; kırpılmazsa
    // DecompressionStream onları 'sonda çöp' sayıp hata verir.
    let son = e;
    while(son > b && (bytes[son-1]===10 || bytes[son-1]===13 || bytes[son-1]===32)) son--;
    try{ akislar.push(new TextDecoder('latin1').decode(await kizakPdfInflate(bytes.slice(b, son)))); }
    catch(_){ /* sıkıştırılmamış / şifreli / desteklenmeyen akış — atla */ }
    i = e + 9;
  }
  return akislar;
}
// Her CMap bloğu AYRI bir aday haritadır. Bir PDF'te birden fazla font bulunur ve haritalar
// birleştirilirse karakterler kayar; bu yüzden her metin parçası tüm adaylarla çözülüp en
// anlamlı sonuç seçilir.
function kizakPdfCMap(hepsi){
  const adaylar = [];
  for(const m of hepsi.matchAll(/begincmap([\s\S]*?)endcmap/g)){
    const map = {};
    for(const g of m[1].matchAll(/beginbfchar([\s\S]*?)endbfchar/g))
      for(const p of g[1].matchAll(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g))
        map[p[1].toUpperCase().padStart(4,'0')] = String.fromCharCode(parseInt(p[2].slice(0,4),16));
    for(const g of m[1].matchAll(/beginbfrange([\s\S]*?)endbfrange/g))
      for(const p of g[1].matchAll(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g)){
        const a = parseInt(p[1],16), b = parseInt(p[2],16), c = parseInt(p[3].slice(0,4),16);
        for(let k=a; k<=b && k-a<512; k++)
          map[k.toString(16).toUpperCase().padStart(4,'0')] = String.fromCharCode(c + (k-a));
      }
    if(Object.keys(map).length) adaylar.push(map);
  }
  return adaylar;
}
const KIZAK_PDF_HARF = /[0-9A-Za-zÇĞİÖŞÜçğıöşü .,%/()\-:+Ø]/;
async function kizakPdfParcalar(buf){
  const akislar = await kizakPdfAkislari(buf);
  const adaylar = kizakPdfCMap(akislar.join('\n'));
  const coz = (hex, map) => {
    let t = '';
    for(let i=0; i+4<=hex.length; i+=4){
      const k = hex.slice(i,i+4).toUpperCase();
      t += (k in map) ? map[k] : ' ';
    }
    return t;
  };
  const puan = t => { let n=0; for(const ch of t) n += (ch===' ' ? -3 : (KIZAK_PDF_HARF.test(ch) ? 1 : 0)); return n; };
  const parcalar = [];
  for(const akis of akislar){
    if(akis.indexOf('BT') < 0) continue;
    for(const bolum of akis.split(/\bBT\b/).slice(1)){
      const govde = bolum.split(/\bET\b/)[0];
      const td = govde.match(/([-\d.]+)\s+([-\d.]+)\s+Td/);
      if(!td) continue;
      const hexler = [...govde.matchAll(/<([0-9A-Fa-f]+)>\s*Tj/g)].map(m => m[1]);
      if(!hexler.length) continue;
      let enIyi = '', enIyiPuan = -Infinity;
      for(const map of adaylar){
        const t = hexler.map(h => coz(h, map)).join('');
        const p = puan(t);
        if(p > enIyiPuan){ enIyiPuan = p; enIyi = t; }
      }
      if(enIyi.trim()) parcalar.push({ y: parseFloat(td[2]), txt: enIyi.trim() });
    }
  }
  return parcalar;
}
const KIZAK_PDF_ALANLAR = ['LDmax','HR','TR'];
async function kizakPdfOlculeri(buf){
  const parcalar = (await kizakPdfParcalar(buf)).sort((a,b) => b.y - a.y);
  const sonuc = {};
  let bekleyen = null;
  for(const p of parcalar){
    const t = p.txt.trim();
    if(KIZAK_PDF_ALANLAR.indexOf(t) >= 0){ bekleyen = t; continue; }
    if(bekleyen && /^[\d.,]+$/.test(t)){
      if(!(bekleyen in sonuc)) sonuc[bekleyen] = t.replace(/\./g,'');
      bekleyen = null;
    }
  }
  return sonuc;
}

function faceDefOf(fi){ return isAraKat(fi) ? ARAKAT_DEF : FACE_DEFS[fi]; }
function faceOf(fi){ return isAraKat(fi) ? activeAraKat().grid : state.faces[fi]; }
function vOf(fi){ return isAraKat(fi) ? getVAraKat() : getV(); }
function faceCodeOf(fi){ return isAraKat(fi) ? ARAKAT_CODE : FACE_CODE[fi]; }
// r.def üzerinden kod — getCutRows/getSabitRows yalnızca sonucu alır, yüz indeksini değil.
function codeOfDef(def){
  if(def === ARAKAT_DEF) return ARAKAT_CODE;
  return FACE_CODE[FACE_DEFS.indexOf(def)] || '';
}

// Motoru ara kat geometrisine ayarlayan TEK nokta. Ölçü zinciri:
//   icAcross    = W - 2*kenar          = W - dus - 2p      (panel açıklığı, dik yön)
//   icKullAlong = L - 2*kenar - n*tak  = L - dus - 2p - n*p (n = bölme sayısı)
// kenar = dus/2 + p numarası bunu tek çarpanla kuruyor; bölmeler de aynı profil olduğu
// için takviye = p. Köşe ve takviye plastiği YOK (kaynak birleşim) → 0.
function getVAraKat(){
  const ak   = activeAraKat();
  const seri = String(state.varsayimlar.seri);
  const dus  = ARAKAT_DUS[seri] != null ? ARAKAT_DUS[seri] : ARAKAT_DUS_VARSAYILAN;
  const p    = (ARAKAT_PROFILLER[ak.profil] || ARAKAT_PROFILLER['30x30']).etki;
  return {
    seri,
    arakat: true,
    dus, p,
    kenar: dus/2 + p,
    takviye: p,
    kose: 0,
    takviyePlastik: 0,
    acilirEk: 0,
    // PROFILSIZ ARA KATTA TOLERANS YOK (Cenk, 03.09.2026: «girilen olcuden 4 mm dusuyor,
    // bu 1 mm olmasi yeterli»). Profilli ara katta panel cercevenin icine iniyor, bosluk
    // payi gerekiyor; profilsizde cerceve yok, panel kendi bukumuyle oturuyor.
    // Olculdu: girilen 1000 -> kesim 997 -> DIS parca govdesi 996 (3 tolerans + 1 cizim
    // payi = 4). Tolerans 0 olunca kesim 1000, DIS govde 999 — istenen 1 mm.
    // (IC parca DIS'ten 3 mm kucuk kalir: ic sac disin icine giriyor, tasarim geregi.)
    tolW: (ARAKAT_TOLERANS && p > 0) ? state.varsayimlar.tolW : 0,
    tolH: (ARAKAT_TOLERANS && p > 0) ? state.varsayimlar.tolH : 0
  };
}

// Aktif modülün ara kat ölçü zinciri + çerçeve kesim listesi. Arayüzdeki salt-okunur
// okuma, kesim listesi ve doğrulama aynı bu fonksiyondan beslenir.
function araKatOlculeri(){
  const ak = activeAraKat();
  const V  = getVAraKat();
  const L = Number(state.dims.L)||0, W = Number(state.dims.W)||0;
  const icL = L>0 ? L - V.dus : 0;
  const icW = W>0 ? W - V.dus : 0;
  const surekliYon = ak.surekliYon || (L >= W ? 'L' : 'W');
  // Sürekli yöndeki 2 profil boydan boya; diğer yöndeki 2 profil aradan girip 2p kısalır.
  // Profilsizde çerçeve YOKTUR (V.p===0) — 4 parça hiç üretilmez.
  const cerceve = [];
  if(V.p>0 && icL>0 && icW>0){
    if(surekliYon==='L'){
      cerceve.push({yon:'L', adet:2, boy:icL}, {yon:'W', adet:2, boy:icW - 2*V.p});
    } else {
      cerceve.push({yon:'W', adet:2, boy:icW}, {yon:'L', adet:2, boy:icL - 2*V.p});
    }
  }
  return {
    ak, V, L, W, icL, icW, p: V.p, dus: V.dus, surekliYon,
    acikL: icL>0 ? icL - 2*V.p : 0,
    acikW: icW>0 ? icW - 2*V.p : 0,
    cerceve
  };
}

// Aktif modülün eşanjör ölçü zinciri + doğrulaması. Arayüzdeki okuma, durum satırı,
// collectFaceIssues ve dışa aktarım aynı bu fonksiyondan beslenir (tek kaynak).
// Zincirin anlatımı için yukarıdaki EŞANJÖR blok yorumuna bakın.
function esanjorOlculeri(){
  const es   = activeEsanjor();
  const seri = String(state.varsayimlar.seri);
  const dus  = ESANJOR_DUS[seri] != null ? ESANJOR_DUS[seri] : ESANJOR_DUS_VARSAYILAN;
  const L = Number(state.dims.L)||0, H = Number(state.dims.H)||0, W = Number(state.dims.W)||0;
  const icL = L>0 ? L-dus : 0, icH = H>0 ? H-dus : 0, icW = W>0 ? W-dus : 0;
  const kenar   = es.kenar;
  const kosegen = kenar>0 ? kenar*Math.SQRT2 : 0;
  const x       = kosegen/2;

  const eksik = [];
  if(!(L>0 && H>0 && W>0)) eksik.push('Modül ölçüleri (L / H / W) girilmedi');
  if(!seri)                eksik.push('Profil serisi seçilmedi');
  if(!(kenar>0))           eksik.push('Eşanjör kenar ölçüsü girilmedi');
  if(!(es.ustKat>0))       eksik.push('Üst kat ölçüsü girilmedi');
  if(!(es.saga>0))         eksik.push('Sağa olan uzaklık girilmedi');

  const tam = eksik.length===0;
  // Ölçüler tam sayıya ve HEP AŞAĞI yuvarlanır (Cenk, 25.08.2026): küçük kalan parça
  // yerine oturur, büyük kalan oturmaz — yuvarlamanın güvenli tarafı budur. Kalan
  // kesir (toplamda <2 mm) boşluğa gider; x yuvarlanmaz, o bir kesim ölçüsü değil.
  // 1e-6 payı yalnız kayan nokta gürültüsü içindir (99.9999999 → 100, 99 değil).
  const asagi = v => Math.floor(v + 1e-6);
  const CI = tam ? asagi(icW) : icW;
  const O1 = tam ? asagi(es.ustKat - x)      : 0;
  const O2 = tam ? asagi(es.saga   - x)      : 0;
  const O3 = tam ? asagi(icH - (es.ustKat - x) - 2*x) : 0;
  const O4 = tam ? asagi(icL - 2*x - (es.saga - x))   : 0;

  // f1'in çizimi bu sınırların altında anlamsız parça üretir — burada durdurulur ki
  // bozuk ölçü DXF'e hiç gitmesin (dışa aktarım kapısı collectFaceIssues'tan geçer).
  const hatalar = [];
  if(tam){
    if(CI < ESANJOR_MIN_CI) hatalar.push('Cihaz iç ölçüsü (CI) '+CI.toFixed(0)+' mm — en az '+ESANJOR_MIN_CI+' mm olmalı');
    [['1. ölçü',O1,'üst kat ölçüsünü büyütün'], ['2. ölçü',O2,'sağa olan uzaklığı büyütün'],
     ['3. ölçü',O3,'üst kat ölçüsünü küçültün'], ['4. ölçü',O4,'sağa olan uzaklığı küçültün']
    ].forEach(r=>{
      if(!(r[1] >= ESANJOR_MIN_O)) hatalar.push(r[0]+' '+r[1]+' mm — en az '+ESANJOR_MIN_O+' mm olmalı ('+r[2]+')');
    });
  }
  return { es, seri, dus, L, H, W, icL, icH, icW, kenar, kosegen, x,
           CI, O1, O2, O3, O4, eksik, hatalar,
           gecerli: tam && hatalar.length===0 };
}
// ---------- AHU KOPYALAMA (2026-09-04) ----------
// Cenk: «çok benzer bir AHU daha yapacağım, ufak değişiklikle devam edeyim».
// Kopya DERIN olmali: modul/yuz/sutun nesneleri paylasilirsa birinde yapilan
// degisiklik otekinde de gorunur. JSON gidis-donusu bunun en ucuz ve en guvenli
// yolu — model zaten duz veri (proxy'ler state uzerinde, AHU nesnesinde degil).
function ahuBenzersizAd(taban){
  const adlar = state.ahus.map(a=>a.ad || '');
  if(adlar.indexOf(taban) < 0) return taban;
  for(let i=2;i<200;i++){
    const aday = taban + ' (' + i + ')';
    if(adlar.indexOf(aday) < 0) return aday;
  }
  return taban + ' (kopya)';
}
function copyAhu(i){
  const kaynak = state.ahus[(i===undefined) ? state.activeAhu : i];
  if(!kaynak) return;
  const kopya = JSON.parse(JSON.stringify(kaynak));
  kopya.ad = ahuBenzersizAd(kaynak.ad || 'AHU');
  state.ahus.push(kopya);
  state.activeAhu = state.ahus.length - 1;
  // Tembel kurulan alanlar (araKat/esanjor/kizak/adet) JSON'da ne ise o kalir;
  // normalize ediciler yine de cagrilir ki gidis-donus sabit nokta olsun.
  araKatNormalize(); esanjorNormalize(); kizakNormalize(); adetNormalize();
  renderAll();
  const not = document.getElementById('excel_note');
  if(not) not.textContent = '✓ ' + (kaynak.ad || 'AHU') + ' kopyalandı → ' + kopya.ad
    + '  ·  kopya üzerinde değişiklik yapabilirsiniz.';
}

// ---------- AYNALAMA (2026-09-04) ----------
// UZUNLUK ekseninde (x) aynalar. ÖN yüzdeki kapak ÖN yüzde KALIR (Cenk'in kuralı):
// x ekseni çevrildiği için yer değiştiren yüzler SOL ve SAĞ'dır; ÖN/ARKA/ÜST/ALT
// yüzlerinde ve ARA KAT'ta yalnız bölüm sırası tersine döner.
// Aynalama kendi tersidir — iki kez uygulanınca proje eski hâline döner.
// olculer: computeFace'in colResults'undan gelen bolum genislikleri (mm). Verilirse
// bolum olculeri once SABITLENIR — yoksa 'son bolumde oto genislik' aynalamayla basa
// gecer ve orada otomatik doldurma olmadigi icin yuz eksik kalir (test bulgusu).
function aynalaYuz(face, olculer){
  if(!face || !face.columns || face.columns.length < 1) return;
  const N = face.columns.length;
  // Son bolum otomatik miydi? Bu ozellik aynalamadan sonra YENI son boluma gecer;
  // boylece iki kez aynalamak projeyi birebir eski haline dondurmeye devam eder.
  const sonOtoydu = !(Number(face.columns[N-1].size) > 0);
  if(olculer && olculer.length === N){
    face.columns.forEach((c,i)=>{
      if(olculer[i] > 0) c.size = Math.round(olculer[i] * 100) / 100;
    });
  }
  // 1) Birleşik kapak (colSpan) grupları TERS ÇEVİRMEDEN ÖNCE kaydedilir: taşıyıcı
  //    alan grubun EN SOLUNDAKİ gözdedir, ters çevrilince en sağa düşer.
  const satir = face.columns.reduce((m,c)=>Math.max(m, c.panels.length), 0);
  const gruplar = [];
  for(let r=0;r<satir;r++){
    let i = 0;
    while(i < N){
      const p = face.columns[i].panels[r];
      if(!p){ i++; continue; }
      const uz = Math.max(1, p.colSpan || 1);
      if(uz > 1) gruplar.push({ r:r, bas:i, uz:uz, spanSize:p.spanSize });
      i += uz;
    }
  }
  // 2) Bölüm SINIRLARINDA yaşayan alanlar (i ile i+1 arası) ayrıca kaydedilir.
  const gaps   = (face.colGaps || []).slice(0, N-1);
  const splits = (face.anaSplitLevels || []).slice(0, N-1);
  const araBd  = face.columns.slice(0, N-1).map(c => c.araJoinNext || []);
  // 3) Sütunlar ve sınırlar tersine
  face.columns.reverse();
  face.colGaps = gaps.reverse();
  face.anaSplitLevels = splits.reverse();
  const araTers = araBd.reverse();
  face.columns.forEach((c,j)=>{ c.araJoinNext = (j < N-1) ? (araTers[j] || []) : []; });
  // 4) Birleşik kapakların taşıyıcısı grubun YENİ en soluna
  gruplar.forEach(g=>{
    const yeniBas = N - 1 - (g.bas + g.uz - 1);
    for(let k=0;k<g.uz;k++){
      const c = face.columns[yeniBas + k];
      const p = c && c.panels[g.r];
      if(!p) continue;
      if(k === 0){
        p.colSpan = g.uz;
        if(g.spanSize) p.spanSize = g.spanSize; else delete p.spanSize;
      } else {
        p.colSpan = 1;
        delete p.spanSize;
      }
    }
  });
  // 5) 'Son bölüm otomatik' özelliği yeni son bölüme geçer
  if(sonOtoydu) face.columns[N-1].size = 0;
  // 6) Seçimler indeks tabanlı — aynalamadan sonra anlamsız
  face.selectedCells = [];
  face.selectedBars = [];
}
function aynalaAhu(i){
  const ahu = state.ahus[(i===undefined) ? state.activeAhu : i];
  if(!ahu || !ahu.modules || !ahu.modules.length) return;
  // Montajın toplam boyu: aynalama bunun içinde yapılır, modüller dışarı taşmaz.
  const toplam = ahu.modules.reduce((m,md)=>Math.max(m, (md.pos ? md.pos.x : 0) + (md.L||0)), 0);
  // Bölüm genişlikleri, aynalamadan ÖNCE motorun hesapladığı değerlerden okunur
  // (otomatik dolan bölüm de dahil). collectFaceIssues/exportExcel deseni: aktif AHU
  // geçici olarak değiştirilir ve finally ile geri alınır.
  const eskiAhu = state.activeAhu, hedef = (i===undefined) ? state.activeAhu : i;
  const olcuHar = [];
  try{
    state.activeAhu = hedef;
    ahu.modules.forEach((md, mi)=>{
      const kayit = {};
      withModule(mi, ()=>{
        const yuzler = [0,1,2,3].concat(araKatOf(md).aktif ? [ARAKAT_FI] : []);
        yuzler.forEach(fi=>{
          const f = faceOf(fi);
          if(!f || f.kapaksiz || !f.columns || !f.columns.length) return;
          const r = computeFace(fi);
          if(!r || !r.colResults) return;
          // colResults'taki colSize GIRILEN degerdir, cozulen genislik degil. Otomatik
          // dolan bolumun genisligi motorun kendi zincirinden okunur: kullanilabilir
          // ana yon olcusunden (icKullAlong) girilenlerin toplami dusulur — otomatik
          // doldurmanin yaptigi hesabin ta kendisi.
          const girilenler = f.columns.map(c=>Number(c.size)||0);
          const toplamGirilen = girilenler.reduce((a,b)=>a+b, 0);
          const kalan = Math.max(0, (Number(r.icKullAlong)||0) - toplamGirilen);
          const sonOtoIdx = girilenler.lastIndexOf(0);
          kayit[fi] = girilenler.map((v,ci)=> v>0 ? v : (ci===sonOtoIdx ? kalan : 0));
        });
      });
      olcuHar.push(kayit);
    });
  } finally { state.activeAhu = eskiAhu; }
  ahu.modules.forEach((md, mi)=>{
    const kayit = olcuHar[mi] || {};
    if(md.pos) md.pos.x = toplam - md.pos.x - (md.L || 0);
    if(md.faces && md.faces.length >= 6){
      // SOL <-> SAĞ yer değiştirir (x ekseni çevrildi); ÖN/ARKA/ÜST/ALT yerinde kalır.
      const sol = md.faces[4]; md.faces[4] = md.faces[5]; md.faces[5] = sol;
      // 'along' ekseni L olan yüzlerde bölüm sırası tersine döner.
      [0,1,2,3].forEach(fi => aynalaYuz(md.faces[fi], kayit[fi]));
    }
    // Ara kat da L x W'dir — aynı kural.
    if(md.araKat && md.araKat.grid) aynalaYuz(md.araKat.grid, kayit[ARAKAT_FI]);
  });
  renderAll();
  const not = document.getElementById('excel_note');
  if(not) not.textContent = '⇋ ' + (ahu.ad || 'AHU') + ' aynalandı — ÖN yüzdeki kapaklar ÖN yüzde kaldı, '
    + 'SOL ile SAĞ yer değiştirdi. Aynı düğmeye tekrar basmak eski hâline döndürür.';
}
