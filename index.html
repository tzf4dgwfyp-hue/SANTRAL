    for(let j = i + yon; j >= 0 && j < rowSeg.length; j += yon){
      if(rowSeg[j].bos) return -1;
      if(rowSeg[j].agiz) continue;
      return j;
    }
    return -1;
  }
  const asagi = ara(1), yukari = ara(-1);
  if(asagi < 0) return yukari;
  if(yukari < 0) return asagi;
  return rowSeg[asagi].h >= rowSeg[yukari].h ? asagi : yukari;
}

function gercekAgizKomsu(rowSeg, i){
  if(i > 0 && rowSeg[i-1].agiz) return i-1;
  if(i < rowSeg.length-1 && rowSeg[i+1].agiz) return i+1;
  return -1;
}

// AGIZ KENARA DAYANIR (Cenk, 29.08.2026): agzin bir yaninda 100 mm den ince kapak
// kaliyorsa agiz O KENARA dayanir ve pay otekine yigilir — ustte 100 + altta 100
// yerine USTTE YOK + ALTTA 200. Aktarim serbest segmentler ARASINDA ham olcuyle
// yapildigi icin dusum olcegi degismez: oteki kapaklarin olcusu aynen kalir ve
// agzin KESIM OLCUSU korunur (28.08 de seridi komsu kapaga katmak tam bunu bozuyordu).
//
// Aktaracak ikinci kapak yoksa pay bile 100 mm nin altindadir: o zaman serit hic olmaz,
// AGIZ GOZU BOLUMUN TAMAMINI KAPLAR (yut) ve kesim olcusu cizimdekinden buyur —
// Cenk in 29.08 karari. Olculdu: ince seridi olan 232 bolumun 178 i kenara dayamayla,
// 54 u yutmayla cozuluyor.
function gercekAgizKenara(rowSeg, ic, V, uyari, yuzAd){
  const esik = GERCEK_MIN_KAPAK + (Number(V.tolH)||0);
  for(let tur=0; tur<12; tur++){
    const olc = gercekSeritOlcu(rowSeg, ic);
    let i = -1;
    for(let j=0;j<olc.length;j++)
      if(olc[j] != null && olc[j] < esik - 0.5 && (i < 0 || olc[j] < olc[i])) i = j;
    if(i < 0) return;
    const j = gercekSeritKomsu(rowSeg, i);
    if(j >= 0){ rowSeg[j].h += rowSeg[i].h; rowSeg.splice(i, 1); continue; }
    const a = gercekAgizKomsu(rowSeg, i);
    if(a < 0) return;
    const buyu = olc[i];
    rowSeg[a].hedef = gercekSegHedef(rowSeg[a]) + buyu;
    rowSeg[a].yut = true;
    rowSeg[a].h += rowSeg[i].h;
    rowSeg.splice(i, 1);
    uyari.push(yuzAd+' yüzde ağzın yanına 100 mm altı pay kalıyor — TAM BOĞAZ:'
      +' ağız bölümün tamamını kaplıyor, '+Math.round(buyu)+' mm pay çerçeveye gidiyor');
  }
}

// Aktif modulun SOL (fi=4) / SAG (fi=5) yuzune cizimden okunan agizlari (bogaz / damper)
// yerlestirir. withModule icinden cagrilir. Donus: {damper, bogaz, kapak} ya da null
// (agiz yok / kurulamadi -> yuz eski otomatikle dolar).
//
// Yuz W x H'dir. Agiz W ekseninde ORTALANIR: 634 cizimde olculen 1345 SOL/SAG agzin
// 1343'u zaten tam ortali, bu yuzden W ekseninin yonu hic sorulmaz. Yukseklikteki yeri
// cizimden gelir (900 ortali, 408 uste yakin, 37 alta yakin). Kalan alan gercek kapak
// kuralindaki gibi saca sigacak en az sayida 'Normal Panel'e bolunur.
//
// UST yuzdeki agizlar icin gercekUstYuz'e bakin — o yuz bu fonksiyonun TRANSPOZESIDIR.
function gercekYanYuz(fi, uyari){
  const md = state.modules[state.active];
  const bilgi = md && md.dxfBilgi;
  if(!bilgi || !bilgi.parcalar || !bilgi.parcalar.length) return null;
  const yuzAd = fi === 4 ? 'SOL' : 'SAĞ';
  const ps = bilgi.parcalar;
  const altKat = Number(bilgi.altKat)||0;
  // Agiz ancak KENDI KATININ ucundaki parcada gecerlidir: iki katli kasada alt ve ust
  // zincir ayri ayri baslar/biter (tam yukseklikli parca ikisine de girer).
  const zAlt = ps.filter(function(p){ return p.kat !== 'üst'; });
  const zUst = ps.filter(function(p){ return p.kat === 'üst' || p.kat === 'tam'; });
  const list = [], monte = [];
  ps.forEach(function(p){
    if(!p.agizlar || !p.agizlar.length) return;
    const zin = (p.kat === 'üst') ? zUst : zAlt;
    const ucta = (fi === 4) ? (zin[0] === p) : (zin[zin.length-1] === p);
    p.agizlar.forEach(function(a){
      if(a.yuz !== yuzAd) return;
      if(!(a.w > 0 && a.h > 0)){
        uyari.push(a.etiket+' ağzı ('+yuzAd+') çizimden ölçülemedi — elle eklenmeli'); return;
      }
      if(!ucta){
        uyari.push(a.etiket+' ağzı modülün '+yuzAd+' ucunda değil ('+p.islev+') — elle eklenmeli'); return;
      }
      const kayit = { etiket: a.etiket, w: Number(a.w)||0, h: Number(a.h)||0,
                      y: (Number(a.y)||0) + (p.kat === 'üst' ? altKat : 0),
                      tip: a.damper ? 'Damper' : 'Boğaz' };
      if(gercekMonteAgiz(md, p, a)) monte.push(kayit); else list.push(kayit);
    });
  });
  // Kayis-kasnakli fanin basma agzi kendi bolumunu ACMAZ, PANELE MONTE edilir.
  // Olculdu (634 cizim): boyle bir yuzde hep TEK agiz var ve tam bogazla hic karismiyor.
  if(monte.length){
    if(list.length){
      uyari.push(yuzAd+' yüzde hem tam boğaz hem panele monte ağız var — monte olan elle eklenmeli');
    }else{
      if(monte.length > 1) uyari.push(yuzAd+' yüzde birden çok panele monte ağız var — yalnız ilki kondu');
      return gercekMontajYuz(fi, monte[0], uyari);
    }
  }
  if(!list.length) return null;

  const W = Number(state.dims.W)||0, H = Number(state.dims.H)||0;
  if(W <= 0 || H <= 0) return null;
  const V = getV(), face = state.faces[fi];
  // AĞIZ YÜZÜNDE eşik BÜYÜTÜLMEZ: ince şerit, komşu KAPAĞA katılarak kaldırılamaz —
  // öyle yapınca serbest alan sıfırlanıyor ve gercekDusur ağzın KESİM ÖLÇÜSÜNÜ
  // kısaltıyordu (ölçüldü: 56-57 ağız sapması). Şerit bunun yerine AĞIZ KAYDIRILARAK
  // kaldırılır — bkz. gercekAgizKenara (Cenk, 29.08.2026).
  const esik = V.kenar + 10;
  const esikSatir = esik;

  let band = 0, dar = 0;
  list.forEach(function(a){ if(a.w > band) band = a.w; });
  list.forEach(function(a){ if(a.w < band) dar++; });
  const icGenis = W - 2*V.kenar;
  if(band > icGenis + 0.5){
    // Ölçüldü: P-PH-15xT ailesinde ağız modül genişliğinin ta kendisi (teknik tablo da
    // öyle diyor). Çerçeveden sonra o kadar yer kalmıyor; kısaltılmış bir ağız üretmektense
    // konmaz ve söylenir.
    uyari.push('ağız '+band+' mm ama '+yuzAd+' yüzde çerçeveden sonra '+icGenis
      +' mm kalıyor — konmadı, elle eklenmeli');
    return null;
  }
  if(dar) uyari.push(yuzAd+' yüzde ağızlar farklı genişlikte (en geniş '+band
    +' mm) — dar olan kendi ölçüsünü taşır, yüz satır genişliği uyarısı verir');
  let disari = null;
  list.forEach(function(a){ if(a.y < -1 || a.y + a.h > H + 1) disari = a; });
  if(disari){
    uyari.push(disari.etiket+' ağzı yüz yüksekliğinin dışında ('+disari.y+'+'+disari.h+' > '+H+') — konmadı');
    return null;
  }

  // --- SUTUNLAR (W ekseni) --- agiz ortada; yanlar cerceve payi kadarsa banda katilir
  const yanPay = Math.round((W - band)/2);
  let bandHam = band, solHam = yanPay, sagHam = W - band - yanPay;
  // TAM BOĞAZ, GENİŞLİK EKSENİ (Cenk, 29.08.2026): ağzın yanında 100 mm’den ince kapak
  // kalıyorsa o pay da banda katılır — ağız bölümün tamamını kaplar, KESİM ölçüsü
  // çizimdeki kalır (elemanOlcu). Uçtaki bölümden çerçeve + bir takviye + tolerans
  // düştüğü için eşik ham ölçüde bu kadar yukarıdadır.
  const esikYan = Math.max(esik, GERCEK_MIN_KAPAK + V.kenar + V.takviye + (Number(V.tolW)||0));
  let bandYut = false;
  if(solHam <= esikYan){ bandHam += solHam; if(solHam > esik) bandYut = true; solHam = 0; }
  if(sagHam <= esikYan){ bandHam += sagHam; if(sagHam > esik) bandYut = true; sagHam = 0; }
  const colSeg = [];
  gercekBolGenislik(colSeg, solHam);
  const bandIdx = colSeg.length;
  colSeg.push({ w: bandHam, hedef: bandYut ? null : band, sabit: !bandYut });
  gercekBolGenislik(colSeg, sagHam);
  const N0 = colSeg.length;
  const colGap0 = gercekAraliklar(colSeg.map(function(g){ return g.w; }), V.kenar, V.takviye);
  const icKullAlong = W - 2*V.kenar - colGap0.filter(Boolean).length*V.takviye;
  if(icKullAlong <= N0){ uyari.push(W+' mm '+yuzAd+' yüze '+N0+' bölüm sığmıyor'); return null; }
  const colSize0 = gercekDusur(colSeg.map(function(g){ return g.w; }),
                               colSeg.map(function(g){ return g.sabit ? g.hedef : null; }),
                               icKullAlong, uyari);
  if(!colSize0) return null;

  // Agiz bandi tek basina saca sigmiyorsa bolunur ve AGIZ O BOLUMLERI KAPSAR (colSpan).
  // Birlesik kapagin genisligi = kapladigi bolumlerin toplami + aradaki ACIK ana
  // takviyelerin kalinligi; yani alt bolumler (band - (k-1)*takviye)'yi paylasinca
  // agzin olcusu tam olarak 'band' kalir ve dikme gercekten oradadir.
  const limB = gercekEnGenisBolum();
  let bandK = 1;
  while(bandK < OTO_MAX_BOLME && limB > 0
     && (colSize0[bandIdx] - (bandK-1)*V.takviye)/bandK > limB) bandK++;
  const bandPay = (bandK > 1)
    ? otoDagit(colSize0[bandIdx] - (bandK-1)*V.takviye, bandK) : [colSize0[bandIdx]];
  if(bandPay.some(function(x){ return x < 1; })){
    uyari.push(yuzAd+' yüzde ağız bandı saca sığacak şekilde bölünemedi'); return null;
  }
  const colSize = colSize0.slice(0, bandIdx).concat(bandPay, colSize0.slice(bandIdx+1));
  const colGap = colGap0.slice(0, bandIdx)
    .concat(new Array(bandK-1).fill(true), colGap0.slice(bandIdx));
  const N = colSize.length;

  // --- SATIRLAR (H ekseni) --- ustten alta; agiz satirlari hedefine sabitlenir
  list.sort(function(a,b){ return b.y - a.y; });
  const rowSeg = [];
  let tavan = H, cakisma = false;
  list.forEach(function(a){
    const tepe = a.y + a.h;
    if(tepe > tavan + 0.5){ cakisma = true; return; }
    rowSeg.push({ h: tavan - tepe, agiz: null });
    rowSeg.push({ h: a.h, agiz: a });
    tavan = a.y;
  });
  if(cakisma){ uyari.push(yuzAd+' yüzde ağızlar üst üste biniyor — konmadı'); return null; }
  // KISMİ BİRLEŞME: komşu modülün kapattığı bölge BOŞ kalır; kapak komşunun üst
  // profilinin yüzeyini örtene kadar iner (sınır = örtüşme − kenar profili).
  const mateHi = faceMateHi(state.active, fi);
  const bosSinir = (mateHi > 0.5 && mateHi < H - 0.5) ? Math.max(0, mateHi - V.kenar) : 0;
  if(bosSinir > 0.5 && tavan < bosSinir - 0.5){
    uyari.push(yuzAd+' yüzde ağız komşu modülün kapattığı bölgede kalıyor — konmadı');
    return null;
  }
  if(bosSinir > 0.5){
    // Boş bölge ile ağız arasında kalan şerit GERÇEK BİR KAPAKTIR (Cenk, 29.08.2026:
    // KS-10 M1 SAĞ yüzde boğazın altında 750×120 'Boğaz Uzun' olmalı) — boş alana
    // katılmaz. Boş alanın yanında TAKVİYE de olmaz: orada profil değil komşu modülün
    // gövdesi var (aşağıda rowGap'te sıfırlanır).
    const ustPay = tavan - bosSinir;
    if(ustPay > 0.5) rowSeg.push({ h: ustPay, agiz: null });
    // son segment: çerçeve payı bundan düşer, hedef ona göre verilir
    rowSeg.push({ h: bosSinir, agiz: null, bos: true, hedef: Math.max(1, bosSinir - V.kenar) });
  }else{
    rowSeg.push({ h: tavan, agiz: null });
  }
  if(rowSeg.length > 1 && !rowSeg[0].agiz && rowSeg[0].h <= esikSatir){
    rowSeg[1].h += rowSeg[0].h; rowSeg.shift();
  }
  const sonI = rowSeg.length - 1;
  if(rowSeg.length > 1 && !rowSeg[sonI].agiz && rowSeg[sonI].h <= esikSatir){
    rowSeg[sonI-1].h += rowSeg[sonI].h; rowSeg.pop();
  }
  // AĞIZ KENARA DAYANIR — ağzın yanındaki 100 mm altı şerit kalkar, pay öteki yana
  // yığılır. Takviye payı tahmini: ağzın yanına ve boş alanın yanına takviye konmaz.
  (function(){
    const g0 = gercekAraliklar(rowSeg.map(function(sg){ return sg.h; }), V.kenar, V.takviye);
    let nt = 0;
    for(let i=0;i<g0.length;i++){
      if(!g0[i]) continue;
      if(rowSeg[i].bos || rowSeg[i+1].bos) continue;
      if(bandK === 1 && (rowSeg[i].agiz || rowSeg[i+1].agiz)) continue;
      nt++;
    }
    gercekAgizKenara(rowSeg, H - 2*V.kenar - nt*V.takviye, V, uyari, yuzAd);
  })();
  let enGenis = 0;
  colSize.forEach(function(c){ if(c > enGenis) enGenis = c; });
  const rows = [];
  rowSeg.forEach(function(rw){
    if(rw.agiz || rw.bos){ rows.push(rw); return; }
    if(rw.h <= 0.5) return;
    const tmp = [];
    gercekBolNormal(tmp, rw.h, enGenis);
    tmp.forEach(function(t){ rows.push({ h: t.w, agiz: null }); });
  });
  const M = rows.length;
  if(!M) return null;
  const rowGap = gercekAraliklar(rows.map(function(g){ return g.h; }), V.kenar, V.takviye);
  // Boş alanın yanında takviye olmaz — orada profil değil komşu modülün gövdesi var.
  for(let i=0;i<rowGap.length;i++)
    if(rows[i].bos || rows[i+1].bos) rowGap[i] = false;
  // Ağzın yanına TAKVİYE PROFİLİ KONMAZ (Cenk, 28.08.2026) — bu kural ÜST yüz dışındaki
  // yüzler içindir; ÜST'te ağzın yanında takviye durur (bkz. gercekUstYuz).
  //
  // TEK İSTİSNA: ağız saca sığsın diye BİRDEN ÇOK bölüme yayıldıysa (bandK>1) sınırdaki
  // ara takviye KALIR. O bölümler arasındaki dikey ana takviye ağız hizasında kesiliyor;
  // ucu bir yere dayanmazsa motor birleşimi çözer ve ağız kendi ölçüsünü kaybeder
  // (ölçüldü: 16 yüz, ağız 3150 mm yerine 1545 mm çıkıyordu).
  if(bandK > 1){
    uyari.push(yuzAd+' yüzde ağız '+band+' mm — saca sığması için '+bandK
      +' bölüme yayıldı, yanındaki ara takviye kaldırılamadı');
  }else{
    for(let i=0;i<rowGap.length;i++)
      if(rows[i].agiz || rows[i+1].agiz) rowGap[i] = false;
  }
  const icKullAcross = H - 2*V.kenar - rowGap.filter(Boolean).length*V.takviye;
  if(icKullAcross <= M){ uyari.push(H+' mm '+yuzAd+' yüze '+M+' kapak sığmıyor'); return null; }
  const rowHedef = rows.map(function(g){
    const h = gercekSegHedef(g);
    return h == null ? null : Math.max(1, Math.round(h));
  });
  // Ağız bölümün tamamını yuttuysa serbest kapak kalmaz; yuvarlama artığı da ona gider
  // ki satır toplamı iç ölçüye TAM otursun.
  if(rowHedef.every(function(h){ return h != null; })){
    let yi = -1;
    for(let i=0;i<rows.length;i++) if(rows[i].yut) yi = i;
    if(yi >= 0) rowHedef[yi] += icKullAcross - rowHedef.reduce(function(a,b){ return a+b; }, 0);
  }
  const rowSize = gercekDusur(rows.map(function(g){ return g.h; }), rowHedef,
                              icKullAcross, uyari);
  if(!rowSize) return null;

  face.kapaksiz = false;
  face.orient = 'H';
  // Ağza değen kapak UZUN kesilir (Cenk, 28.08.2026): iki ağız arasındaysa 'Boğaz 2 Uzun',
  // yalnız bir yanı ağızsa 'Boğaz Uzun'. Yalnız ağız bandının kapladığı sütunlar sayılır —
  // yandaki dar şeritler ağza değmez, onlar 'Normal Panel' kalır.
  const bandSon = bandIdx + bandK - 1;
  face.columns = colSize.map(function(cs, ci){
    const bandda = (ci >= bandIdx && ci <= bandSon);
    return {
      size: cs,
      panels: rows.map(function(rw, ri){
        const p = { size: rowSize[ri], type: 'Normal Panel', colSpan: 1 };
        if(rw.agiz && ci === bandIdx){
          p.type = rw.agiz.tip;
          p.colSpan = bandK;
          // Ayni yuzde farkli genislikte iki agiz varsa dar olan KENDI olcusunu tasir.
          // Tek bolumde bu 'colSize', birlesik kapakta 'spanSize'dir.
          if(rw.agiz.w < band - 0.5){
            if(bandK > 1) p.spanSize = rw.agiz.w; else p.colSize = rw.agiz.w;
          }
          // TAM BOGAZ (Cenk, 29.08.2026): goz bolumun tamamini kapladiginda bogazin
          // KESIM olcusu cizimdekidir — aradaki pay cerceveye gider. Alan yalniz
          // burada var olur; syncStructure gecersizse dusurur.
          if(rw.yut || bandYut) p.elemanOlcu = {w: rw.agiz.w, h: rw.agiz.h};
        }else if(rw.bos){
          p.type = 'Boş Alan';
        }else if(!rw.agiz && bandda){
          const ustA = ri > 0 && !!rows[ri-1].agiz;
          const altA = ri < rows.length-1 && !!rows[ri+1].agiz;
          if(ustA && altA) p.type = 'Boğaz 2 Uzun';
          else if(ustA || altA) p.type = 'Boğaz Uzun';
        }
        return p;
      }),
      innerGaps: rowGap.slice(),
      araJoinNext: rows.slice(1).map(function(){ return false; })
    };
  });
  face.colGaps = colGap.slice();
  face.anaSplitLevels = colSize.slice(1).map(function(){ return []; });
  face.selectedCells = [];
  face.selectedBars = [];
  let damper = 0, bogaz = 0;
  list.forEach(function(a){ if(a.tip === 'Damper') damper++; else bogaz++; });
  return { damper: damper, bogaz: bogaz, kapak: N*M };
}

// Aktif modülün ÜST yüzüne çizimden okunan ağızları yerleştirir. withModule içinden
// çağrılır. Dönüş: {damper, bogaz, kapak, tabloDan, ustPanel} ya da null (ağız yok /
// kurulamadı → yüz eski otomatikle dolar, tipini gercekTumAHU atar).
//
// Yüz L×W'dir ve gercekYanYuz'un TRANSPOZESİDİR: ağız L ekseninde ÇİZİMDEKİ YERİNE,
// W ekseninde ORTAYA oturur. Ölçüldü (634 çizim, 48 ÜST ağız): doğru okunan 32 ağzın
// 32'si W ekseninde tam ortalı, L ekseninde yalnız 1'i — yani W'de ortalamak, L'de
// çizimi okumak doğrudur. Ölçüsü teknik tablodan gelen ağzın L'deki yeri bilinmez;
// ortalanır ve bu uyarıyla söylenir.
//
// ÜST yüz kasanın TAVANIDIR: yalnız üst/tam/tek kattaki parçanın ağzı buraya düşer.
// İki katlı kasada alt katın tavanındaki ağız ara döşemededir — uyarı verilir, konmaz.
function gercekUstYuz(uyari){
  const md = state.modules[state.active];
  const bilgi = md && md.dxfBilgi;
  if(!bilgi || !bilgi.parcalar || !bilgi.parcalar.length) return null;
  const ps = bilgi.parcalar;
  // Modulun BUTUN parcalari alt kattaysa modulun kendisi alt kattir ve o catI onun
  // catisidir — agzi buraya duser (Cenk, 31.08.2026: KLM-01'de ATIS ağzı M2'nin
  // catisinda, ustunde modul olmayan uc kisminda). Gercek iki katli modulde (alt + ust
  // parca bir arada) cati ust katindir, alt kattaki agiz oraya dusmez ve uyari cikar.
  let zUst = ps.filter(function(p){ return p.kat !== 'alt'; });
  const hepsiAlt = !zUst.length;
  if(hepsiAlt) zUst = ps;
  const lim = gercekEnGenisBolum();
  const list = [];
  let c = 0, tabloDan = 0;
  zUst.forEach(function(p){
    const boy = Number(p.boy)||0;
    (p.agizlar||[]).forEach(function(a){
      if(a.yuz !== 'ÜST') return;
      if(!(a.w > 0 && a.h > 0)){
        uyari.push(a.etiket+' ağzı (ÜST) çizimden ölçülemedi — elle eklenmeli'); return;
      }
      if(a.w > boy + 0.5){
        uyari.push(a.etiket+' ağzı '+a.w+' mm ama bölme yalnız '+boy
          +' mm — konmadı, elle eklenmeli'); return;
      }
      if(lim > 0 && a.w > lim){
        // Agiz bir ELEMAN, kendisi saca sigmak zorunda degil; ama sutunu paylasan normal
        // kapaklar sigmali. Yan yuzde band bolunup colSpan ile kapsaniyordu; UST'te
        // olculen en genis agiz 750 mm, yani bu dal hic tetiklenmiyor — yine de sessizce
        // sacа sigmayan kapak uretmektense soylemek dogru.
        uyari.push(a.etiket+' ağzı '+a.w+' mm — ÜST yüzde saca sığacak bölüme girmiyor,'
          +' konmadı, elle eklenmeli'); return;
      }
      let x = (a.x == null) ? Math.round((boy - a.w)/2) : (Number(a.x)||0);
      if(x < 0) x = 0;
      if(x > boy - a.w) x = boy - a.w;
      if(a.tabloDan){
        tabloDan++;
        uyari.push(a.etiket+' ağzının ölçüsü teknik tablodan alındı (çizimde ağız'
          +' dikdörtgeni yok) — '+p.islev+' bölmesinin ortasına kondu');
      }
      list.push({ etiket: a.etiket, w: a.w, h: a.h, x: c + x, on: (a.on == null ? null : Number(a.on)||0),
                  tip: a.damper ? 'Damper' : 'Boğaz' });
    });
    c += boy;
  });
  ps.forEach(function(p){
    if(hepsiAlt || p.kat !== 'alt') return;
    (p.agizlar||[]).forEach(function(a){
      if(a.yuz === 'ÜST')
        uyari.push(a.etiket+' ağzı alt katın tavanında ('+p.islev
          +') — ÜST yüze düşmez, elle eklenmeli');
    });
  });
  if(!list.length) return null;

  const L = Number(state.dims.L)||0, W = Number(state.dims.W)||0;
  if(L <= 0 || W <= 0) return null;
  const V = getV(), face = state.faces[2];
  const esik = Math.max(V.kenar + 10, GERCEK_MIN_KAPAK);
  // 'Üst Panel' sayılan kapaklarda sınır 1200 mm (Cenk, 29.08.2026)
  const ustTip = faceMated(state.active, 2) ? 'Normal Panel' : 'Üst Panel';
  const ustLim = (ustTip === 'Üst Panel') ? GERCEK_UST_MAX : GERCEK_KAPAK_MAX;

  // W ekseni tek BANT taşır: bütün ağızlar aynı derinlikte olmalı. Ölçüldü — aynı modülde
  // farklı derinlikte iki ÜST ağız yok; çıkarsa yanlış ölçü üretmektense söylenir.
  let band = 0, farkli = false;
  list.forEach(function(a){ if(a.h > band) band = a.h; });
  list.forEach(function(a){ if(a.h < band - 0.5) farkli = true; });
  if(farkli){
    uyari.push('ÜST yüzde ağızlar farklı derinlikte — konmadı, elle eklenmeli'); return null;
  }
  const icDerin = W - 2*V.kenar;
  if(band > icDerin + 0.5){
    uyari.push('ağız '+band+' mm ama ÜST yüzde çerçeveden sonra '+icDerin
      +' mm kalıyor — konmadı, elle eklenmeli');
    return null;
  }
  // Ağız bandı bir SATIRDIR: ağız dışı sütunlardaki normal kapaklar da o derinliği taşır.
  // Bandın kendisi saca girmiyorsa sütunu bölmek kurtarmaz (ölçüldü: P-ESF 48000, ağız
  // 3247 mm derinliğinde) — sessizce sığmayan kapak üretmektense söylenir.
  if(lim > 0 && band > lim){
    uyari.push('ağız '+band+' mm derinliğinde — ÜST yüzde saca sığacak kapak kalmıyor,'
      +' konmadı, elle eklenmeli');
    return null;
  }

  // --- SÜTUNLAR (L ekseni) --- ağızlar çizimdeki yerinde; uçta kalan çerçeve payı ağza katılır
  list.sort(function(a,b){ return a.x - b.x; });
  const colSeg = [];
  let imlec = 0, cakisma = false;
  list.forEach(function(a){
    if(a.x < imlec - 0.5){ cakisma = true; return; }
    let sol = a.x - imlec, ham = a.w;
    if(sol <= esik){ ham += sol; sol = 0; }
    gercekBolNormal(colSeg, sol, band, ustLim);
    colSeg.push({ w: ham, hedef: a.w, agiz: a });
    imlec = a.x + a.w;
  });
  if(cakisma){ uyari.push('ÜST yüzde ağızlar üst üste biniyor — konmadı'); return null; }
  let sag = L - imlec;
  if(sag < -0.5){ uyari.push('ÜST yüzde ağız modül boyunun dışına taşıyor — konmadı'); return null; }
  if(sag > 0 && sag <= esik){ colSeg[colSeg.length-1].w += sag; sag = 0; }
  gercekBolNormal(colSeg, sag, band, ustLim);
  const N = colSeg.length;
  const colGap = gercekAraliklar(colSeg.map(function(g){ return g.w; }), V.kenar, V.takviye);
  const icKullAlong = L - 2*V.kenar - colGap.filter(Boolean).length*V.takviye;
  if(icKullAlong <= N){ uyari.push(L+' mm ÜST yüze '+N+' bölüm sığmıyor'); return null; }
  const colSize = gercekDusur(colSeg.map(function(g){ return g.w; }),
                              colSeg.map(function(g){ return g.agiz ? g.hedef : null; }),
                              icKullAlong, uyari);
  if(!colSize) return null;

  // --- SATIRLAR (W ekseni) --- ağız bandı ortada; yanlar çerçeve payı kadarsa banda katılır
  // Ağzın W eksenindeki YERİ ÇİZİMDEN gelir (Cenk, 31.08.2026: «çizimden anlaşılıyor
  // hangi yüze dayalı olduğu, her zaman arka yüze dayalı olmak zorunda değil»).
  // ÜST yüzün v ekseninde v=0 ARKA, v=W ÖN'dür (faceUVtoXYZ fi=2 → z=v, ÖN yüz z=W),
  // yani rowSeg'in İLK bloğu ARKA, SON bloğu ÖN tarafındadır. 'on' = ağzın ÖN kenarına
  // uzaklığı. Bilgi yoksa eskisi gibi ortalanır — havuzdaki 32 ÜST ağzın 32'si zaten
  // ortalıydı, kenara dayalı olanı KLM-01'in dönüş boğazı ortaya çıkardı.
  let onPay = null;
  list.forEach(function(a){ if(a.on != null && onPay === null) onPay = a.on; });
  let onFarkli = false;
  list.forEach(function(a){ if(a.on != null && onPay != null && Math.abs(a.on - onPay) > 0.5) onFarkli = true; });
  if(onFarkli){
    uyari.push('ÜST yüzde ağızlar farklı derinlikte duruyor — ilki esas alındı');
  }
  if(onPay === null) onPay = Math.round((W - band)/2);
  if(onPay < 0) onPay = 0;
  if(onPay > W - band) onPay = W - band;
  let bandHam = band, altHam = onPay, ustHam = W - band - onPay;
  if(altHam <= esik){ bandHam += altHam; altHam = 0; }
  if(ustHam <= esik){ bandHam += ustHam; ustHam = 0; }
  let enGenis = 0;
  colSize.forEach(function(cs){ if(cs > enGenis) enGenis = cs; });
  const rowSeg = [];
  gercekBolNormal(rowSeg, ustHam, enGenis, ustLim);
  rowSeg.push({ w: bandHam, hedef: band, agiz: true });
  gercekBolNormal(rowSeg, altHam, enGenis, ustLim);
  const M = rowSeg.length;
  const rowGap = gercekAraliklar(rowSeg.map(function(g){ return g.w; }), V.kenar, V.takviye);
  const icKullAcross = W - 2*V.kenar - rowGap.filter(Boolean).length*V.takviye;
  if(icKullAcross <= M){ uyari.push(W+' mm ÜST yüze '+M+' kapak sığmıyor'); return null; }
  const rowSize = gercekDusur(rowSeg.map(function(g){ return g.w; }),
                              rowSeg.map(function(g){ return g.agiz ? g.hedef : null; }),
                              icKullAcross, uyari);
  if(!rowSize) return null;

  // Ağız dışındaki kapaklar ÜST yüzün kendi kuralını izler: üstünde modül varsa
  // 'Normal Panel', açıksa 'Üst Panel' (Cenk, 28.08.2026).
  const kapakTip = ustTip;
  face.kapaksiz = false;
  face.orient = 'H';
  face.columns = colSeg.map(function(cg, ci){
    return {
      size: colSize[ci],
      panels: rowSeg.map(function(rw, ri){
        const p = { size: rowSize[ri], type: kapakTip, colSpan: 1 };
        if(rw.agiz && cg.agiz){
          p.type = cg.agiz.tip;
          // ÇİZİM YÖNÜ (Cenk, 29.08.2026): boğaz/damperin 'en' ölçüsü SOL/SAĞ yüzde
          // yatay parçayı sürer, ÜST yüzde DİKEY parçayı — çünkü aynı fiziksel ölçü
          // burada başka bir eksende duruyor. Takas 26.08'de kurulan 'çizim yönü'
          // mekanizmasıyla yapılır (elemanCizimOlcusu); yerleşim, tolerans ve göz
          // ölçüsü DEĞİŞMEZ, yalnız f1'e giden eşleme takas edilir.
          p.yon = 'dikey';
        }
        return p;
      }),
      innerGaps: rowGap.slice(),
      araJoinNext: rowSeg.slice(1).map(function(){ return false; })
    };
  });
  face.colGaps = colGap.slice();
  face.anaSplitLevels = colSize.slice(1).map(function(){ return []; });
  face.selectedCells = [];
  face.selectedBars = [];
  let damper = 0, bogaz = 0;
  list.forEach(function(a){ if(a.tip === 'Damper') damper++; else bogaz++; });
  return { damper: damper, bogaz: bogaz, kapak: N*M, tabloDan: tabloDan,
           ustPanel: kapakTip === 'Üst Panel' };
}

// Ağzı olmayan ama komşusuyla KISMEN örtüşen düşey yüz: komşunun kapattığı bölge BOŞ
// kalır (Cenk, 29.08.2026 — «birbirine denk gelen yüzler boş olmalı, içeride hava akışı
// var»), üstü saca sığacak en az sayıda 'Normal Panel'e bölünür. Kapak komşunun üst
// profilinin yüzeyini örtene kadar iner: sınır = örtüşme − kenar profili.
// Ağzı OLAN yüzler bu kuralı gercekYanYuz içinde uygular.
function gercekKismiYuz(fi, uyari){
  const H = Number(state.dims.H)||0;
  const mate = faceMateHi(state.active, fi);
  if(!(mate > 0.5) || mate >= H - 0.5) return null;
  const def = faceDefOf(fi);
  const Wf = Number(state.dims[def.wKey])||0;
  if(H <= 0 || Wf <= 0) return null;
  const V = getV(), face = state.faces[fi];
  const bosHam = Math.max(0, mate - V.kenar);
  if(bosHam <= 0.5) return null;
  const ustHam = H - bosHam;
  if(ustHam <= V.kenar + 10){
    uyari.push(faceCodeOf(fi)+' yüzünde komşudan sonra kapak sığmıyor — kapaksız bırakıldı');
    face.kapaksiz = true;
    return { bos: 1 };
  }

  // ÖNCE SÜTUN, SONRA SATIR (gercekYanYuz'ün sırası). Satırı yüzün TAM GENİŞLİĞİNE göre
  // bölmek geniş santralde kurtarmaz: genişlik saca girmiyorsa hiçbir satır bölmesi onu
  // sığdıramaz, arama üst sınıra (OTO_MAX_BOLME) dayanır ve şerit üretir.
  // ÖLÇÜLDÜ: W=3070 olan V-AHU-05'te bu yüzden 40 satır × 39 mm çıkıyordu; havuzdaki
  // 100 mm altı 1062 kapağın 1040'ı bu yoldan geliyordu.
  const onCol = [];
  gercekBolNormal(onCol, Wf, ustHam);
  let onEnGenis = 0;
  onCol.forEach(function(c){ if(c.w > onEnGenis) onEnGenis = c.w; });

  // SATIRLAR: üst (kapaklı, saca göre bölünür) + alt (boş)
  const rows = [];
  gercekBolNormal(rows, ustHam, onEnGenis || Wf);
  rows.forEach(function(r){ r.h = r.w; r.bos = false; });
  rows.push({ h: bosHam, bos: true, hedef: Math.max(1, bosHam - V.kenar) });
  const M = rows.length;
  const rowGap = gercekAraliklar(rows.map(function(g){ return g.h; }), V.kenar, V.takviye);
  // boş alanın yanında takviye olmaz
  for(let i=0;i<rowGap.length;i++)
    if(rows[i].bos || rows[i+1].bos) rowGap[i] = false;
  const icKullAcross = H - 2*V.kenar - rowGap.filter(Boolean).length*V.takviye;
  if(icKullAcross <= M) return null;
  const rowSize = gercekDusur(rows.map(function(g){ return g.h; }),
                              rows.map(function(g){ return g.bos ? g.hedef : null; }),
                              icKullAcross, uyari);
  if(!rowSize) return null;

  // SÜTUNLAR: en yüksek kapaklı satıra göre
  let enYuk = 0;
  rows.forEach(function(r, i){ if(!r.bos && rowSize[i] > enYuk) enYuk = rowSize[i]; });
  const colSeg = [];
  gercekBolNormal(colSeg, Wf, enYuk);
  const N = colSeg.length;
  const colGap = gercekAraliklar(colSeg.map(function(g){ return g.w; }), V.kenar, V.takviye);
  const icKullAlong = Wf - 2*V.kenar - colGap.filter(Boolean).length*V.takviye;
  if(icKullAlong <= N) return null;
  const colSize = gercekDusur(colSeg.map(function(g){ return g.w; }),
                              colSeg.map(function(){ return null; }), icKullAlong, uyari);
  if(!colSize) return null;

  face.kapaksiz = false;
  face.orient = 'H';
  face.columns = colSize.map(function(cs){
    return {
      size: cs,
      panels: rows.map(function(rw, ri){
        return { size: rowSize[ri], type: rw.bos ? 'Boş Alan' : 'Normal Panel', colSpan: 1 };
      }),
      innerGaps: rowGap.slice(),
      araJoinNext: rows.slice(1).map(function(){ return false; })
    };
  });
  face.colGaps = colGap.slice();
  face.anaSplitLevels = colSize.slice(1).map(function(){ return []; });
  face.selectedCells = [];
  face.selectedBars = [];
  return { bos: 1 };
}

// Aktif modülün ARKA yüzünü kurar — modül İKİ KATLIYSA (Cenk, 29.08.2026: «modül 2
// katlıysa arkadan da 2 katlı olduğu için yatay takviyesi olmalı»). Kat ayırıcı yatay
// takviye ÖN yüzdekiyle aynı kottadır ve BÜTÜNDÜR. Her kat, saca sığacak en az sayıda
// 'Normal Panel'e bölünür. Tek katlı modülde null döner — yüz eski otomatikle dolar.
function gercekArkaYuz(uyari){
  const md = state.modules[state.active];
  const bilgi = md && md.dxfBilgi;
  const altKat = bilgi && Number(bilgi.altKat) || 0;
  if(!(altKat > 0)) return null;
  const L = Number(state.dims.L)||0, H = Number(state.dims.H)||0;
  if(L <= 0 || H <= 0 || altKat >= H) return null;
  const V = getV(), face = state.faces[1];

  // SATIRLAR (H ekseni, üstten alta): üst kat + alt kat, aralarında kat ayırıcı takviye
  const ham = [H - altKat, altKat];
  const rowGap = [true];
  const icKullAcross = H - 2*V.kenar - V.takviye;
  if(icKullAcross <= 2){ uyari.push(H+' mm ARKA yüze iki kat sığmıyor'); return null; }

  // SÜTUNLAR (L ekseni): saca sığacak en az sayıda bölüm — en yüksek kat belirler
  const enYuksek = Math.max(ham[0], ham[1]);
  const colSeg = [];
  gercekBolNormal(colSeg, L, enYuksek);
  const N = colSeg.length;
  const colGap = gercekAraliklar(colSeg.map(function(g){ return g.w; }), V.kenar, V.takviye);
  const icKullAlong = L - 2*V.kenar - colGap.filter(Boolean).length*V.takviye;
  if(icKullAlong <= N){ uyari.push(L+' mm ARKA yüze '+N+' bölüm sığmıyor'); return null; }
  const colSize = gercekDusur(colSeg.map(function(g){ return g.w; }),
                              colSeg.map(function(){ return null; }), icKullAlong, uyari);
  if(!colSize) return null;
  // Satırlar ORANTIYLA bölünmez: kat ayırıcının yeri ÖN yüzle aynı çapaya bağlıdır
  // (bkz. gercekAltSatir). Orantı, ÖN ile ARKA'nın kat ayırıcısını 14 modülde
  // birbirinden ayırıyordu — aynı modülün iki yüzünde takviye farklı kotta olamaz.
  const altSatir = gercekAltSatir(altKat, V, icKullAcross);
  const rowSize = [icKullAcross - altSatir, altSatir];   // ÜSTTEN ALTA

  face.kapaksiz = false;
  face.orient = 'H';
  face.columns = colSize.map(function(cs){
    return {
      size: cs,
      panels: rowSize.map(function(rs){ return { size: rs, type: 'Normal Panel', colSpan: 1 }; }),
      innerGaps: rowGap.slice(),
      // kat ayırıcı BÜTÜNDÜR
      araJoinNext: [true]
    };
  });
  face.colGaps = colGap.slice();
  // kat ayırıcı bütün olduğu için ana takviye o seviyeden kesilir (motorun şartı)
  face.anaSplitLevels = colSize.slice(1).map(function(){ return [0]; });
  face.selectedCells = [];
  face.selectedBars = [];
  return { kapak: N * rowSize.length };
}

// Aktif modülün ALT yüzüne soğutma bataryasının tavasını kurar. withModule içinden çağrılır.
// Dönüş: {tava} ya da null (tava yok → yüz eski otomatikle dolar).
// Tek satırlıdır: ALT yüz L×W'dir, kat ayrımı yoktur — üst kattaki bataryanın tavası bu
// yüze DÜŞMEZ, o durumda uyarı verilir ve tava elle eklenir.
function gercekAltYuz(uyari){
  const md = state.modules[state.active];
  const bilgi = md && md.dxfBilgi;
  if(!bilgi || !bilgi.parcalar || !bilgi.parcalar.length) return null;
  const ps = bilgi.parcalar.filter(function(p){ return p.kat !== 'üst'; });
  if(!ps.length) return null;
  bilgi.parcalar.forEach(function(p){
    if(p.kat === 'üst' && gercekTavalar(p).length)
      uyari.push('üst kattaki '+p.islev+' tavası ALT yüze konamaz — elle eklenmeli');
  });
  const L = Number(state.dims.L)||0, W = Number(state.dims.W)||0;
  if(L <= 0 || W <= 0) return null;
  const V = getV(), face = state.faces[3];
  const icAcross = W - 2*V.kenar;
  if(icAcross <= 1) return null;
  const esik = Math.max(V.kenar + 10, GERCEK_MIN_KAPAK);

  // Tavalar ÇİZİMDEKİ YERİNE oturur (soğutma bataryasınınki bataryanın merkezine).
  // Bir parçada birden çok tava olabilir — rotorlu eşanjörde iki tane (ölçüldü, 45 modül).
  //
  // ARDIŞIK TAVASIZ ALAN BİRİKTİRİLİR (Cenk, 29.08.2026) — ÖN yüzdeki düzeltmenin aynısı.
  // Eskiden her parçanın kalanı ayrı bölünüyordu ve parça sınırında olmayan bir dikme
  // çıkıyordu (KS-10 M2 ALT: Tava 600 | 144 | 860 | 687 — oysa tavadan sonrası tek kapak).
  const segs = [];
  const esikUc = V.kenar + GERCEK_MIN_KAPAK, esikOrta = GERCEK_MIN_KAPAK;
  let tavaN = 0, bos = 0;
  function bosBosalt(){
    if(bos <= 0.5){ bos = 0; return; }
    if(segs.length && bos <= esikUc){ segs[segs.length-1].w += bos; bos = 0; return; }
    gercekBolNormal(segs, bos, icAcross);
    bos = 0;
  }
  ps.forEach(function(p){
    const boy = Number(p.boy)||0;
    if(boy <= 0) return;
    const tv = gercekTavalar(p).slice().sort(function(a,b){ return a.lo - b.lo; });
    let imlec = 0;
    tv.forEach(function(t){
      if(t.lo < imlec - 0.5) return;          // çakışan tava — atlanır
      let ham = t.w;
      bos += t.lo - imlec;
      if(bos <= (segs.length ? esikOrta : esikUc)){ ham += bos; bos = 0; }
      bosBosalt();
      segs.push({ w: ham, hedef: t.w, tip: 'Tava', sabit: true });
      imlec = t.lo + t.w;
      tavaN++;
    });
    bos += boy - imlec;
  });
  bosBosalt();
  if(!tavaN || !segs.length) return null;
  const t = segs.reduce(function(a,b){ return a+b.w; }, 0);
  if(Math.abs(t - L) > 1.5){ uyari.push('ALT yüz toplamı '+Math.round(t)+' mm, modül boyu '+L+' mm'); return null; }

  const N = segs.length;
  const icKullAlong = L - 2*V.kenar - (N-1)*V.takviye;
  if(icKullAlong <= N){ uyari.push(L+' mm modüle '+N+' bölüm sığmıyor (ALT)'); return null; }
  const colSize = gercekDusur(segs.map(function(g){ return g.w; }),
                              segs.map(function(g){ return g.sabit ? g.hedef : null; }),
                              icKullAlong, uyari);
  if(!colSize) return null;

  face.kapaksiz = false;
  face.orient = 'H';
  face.columns = colSize.map(function(cs, ci){
    return { size: cs,
             panels: [{ size: 0, type: segs[ci].tip, colSpan: 1 }],
             innerGaps: [], araJoinNext: [] };
  });
  face.colGaps = colSize.slice(1).map(function(){ return true; });
  face.anaSplitLevels = colSize.slice(1).map(function(){ return []; });
  face.selectedCells = [];
  face.selectedBars = [];
  return { tava: tavaN };
}

// Aktif AHU'nun bütün modüllerini gerçek değerlerle kurar.
// ÖN yüz kural motorundan, ÜST yüz tipi birleşmeden, kalan yüzler 27.08 otomatiğinden gelir.
// ARA TAKVIYE OTOMATIK BIRLESIMI (Cenk, 03.09.2026):
//   «destek profillerinin uclari uc uca denk gelebiliyor, yani birlesim yapmali plastik
//    plastige ama aralarinda bosluk vardi; tiklayip birlestir dememi bekliyor, bunlari
//    kendi yapmali.»
//
// Bir ara takviye komsu bolume GECEBILIYORSA birlestirilir. Sart computeFace'in kendi
// 'joinValid' sartidir, KOPYALANMAZ — burada da ayni iki soru sorulur:
//   (a) komsu bolumde HIZALI bir seviye var mi   (anaBar.levels[].idxA === gi)
//   (b) aradaki ana takviye engel mi             (var, tumuyle ortulu degil ve tam o
//                                                 seviyeden kesik degil ise ENGEL)
// Sart saglanmiyorsa DOKUNULMAZ: aradaki dikey takviyeyi kesmek yapisal bir karardir,
// otomatik verilmez. Birlesim yalniz bar SEGMENTLERINI birlestirir — kapak olculeri,
// bolum sinirlari ve yuz geometrisi degismez, yalniz takviye kesim listesi degisir.
//
// Olculdu (713 cizim / 5357 yuz / 2140 ara takviye): 86 takviye bu durumdaydi. Hepsi
// SOL/SAG yuzde ve hepsinde aradaki ana takviye BOYDAN BOYA birlesik kapagin altinda
// kaliyordu (fullySuppressed) — yani ortada dikme yokken iki ayri segment ciziliyordu.
//
// Donus: birlestirilen takviye sayisi.
function gercekAraBirlestir(fi){
  const face = faceOf(fi);
  if(!face || face.kapaksiz || !face.columns || face.columns.length < 2) return 0;
  let toplam = 0;
  // Zincir uzayabildigi icin degisiklik kalmayana kadar yinelenir. Tur sayisi bolum
  // sayisiyla sinirli: her tur en az bir birlesim ekler, yoksa doner.
  for(let tur = 0; tur < face.columns.length; tur++){
    let c;
    try{ c = computeFace(fi); }catch(e){ return toplam; }
    if(!c || !c.bars || !c.bars.ara) return toplam;
    let degisti = 0;
    c.bars.ara.forEach(function(b){
      if(!b.on || b.joinReq) return;
      if(b.ci >= face.columns.length - 1) return;
      const anaBar = c.bars.ana[b.ci];
      const hizali = !!anaBar && anaBar.levels.some(function(l){ return l.idxA === b.gi; });
      const engel  = !!anaBar && anaBar.on && !anaBar.fullySuppressed
                     && anaBar.cutLevels.indexOf(b.gi) < 0;
      if(!hizali || engel) return;
      const col = face.columns[b.ci];
      if(!col || !col.araJoinNext || b.gi >= col.araJoinNext.length) return;
      col.araJoinNext[b.gi] = true;
      degisti++;
    });
    toplam += degisti;
    if(!degisti) break;
  }
  return toplam;
}

function gercekTumAHU(){
  const sonuc = { modul:0, atlanan:0, kapak:0, acilir:0, camli:0, ust:0, tava:0, mated:0,
                  damper:0, bogaz:0, disAgiz:0, ustTablo:0, arka:0, kismi:0, birlesim:0,
                  uyari:[] };
  state.modules.forEach(function(m, mi){
    withModule(mi, function(){
      const uyari = [];
      const on = gercekOnYuz(uyari);
      if(on){
        sonuc.modul++; sonuc.kapak += on.kapak;
        sonuc.acilir += on.acilir; sonuc.camli += on.camli;
      }else{
        sonuc.atlanan++;
        state.faces[0].kapaksiz = false;
        otoUygulaYuz(0, true, GERCEK_KAPAK_MAX);
      }
      // ÜST yüz her zaman kapak alır; yalnız TİPİ değişir (Cenk, 28.08.2026).
      // Çizimden okunan ağız varsa yüz onunla kurulur — ağız dışındaki kapaklar yine
      // aynı tip kuralını izler (gercekUstYuz içinde).
      state.faces[2].kapaksiz = false;
      const ustY = gercekUstYuz(uyari);
      if(ustY){
        sonuc.damper += ustY.damper; sonuc.bogaz += ustY.bogaz;
        sonuc.ustTablo += ustY.tabloDan;
        if(ustY.ustPanel) sonuc.ust++;
      }else if(otoUygulaYuz(2, true,
                 faceMated(mi, 2) ? GERCEK_KAPAK_MAX : GERCEK_UST_MAX)){
        const tip = faceMated(mi, 2) ? 'Normal Panel' : 'Üst Panel';
        state.faces[2].columns.forEach(function(c){
          c.panels.forEach(function(p){ p.type = tip; });
        });
        if(tip === 'Üst Panel') sonuc.ust++;
      }
      // ALT yüz: soğutma bataryası varsa tava kurulur — birleşme yüzü olsa bile kapaksız
      // işaretlenmez, tava o modülün altında gerçekten vardır.
      const tv = gercekAltYuz(uyari);
      if(tv) sonuc.tava += tv.tava;
      // SOL/SAĞ: çizimden okunan ağızlar. Ağzı olan yüz, birleşme yüzü olsa bile
      // kapaksız işaretlenmez — ağız o yüzde gerçekten vardır (tava kuralının aynısı).
      const yanY = {};
      [4,5].forEach(function(fi){
        const y = gercekYanYuz(fi, uyari);
        if(y){ yanY[fi] = y; sonuc.damper += y.damper; sonuc.bogaz += y.bogaz; }
      });
      (m.dxfBilgi && m.dxfBilgi.parcalar ? m.dxfBilgi.parcalar : []).forEach(function(p){
        (p.agizlar||[]).forEach(function(a){
          if(a.yuz !== 'SOL' && a.yuz !== 'SAĞ' && a.yuz !== 'ÜST'){
            sonuc.disAgiz++;
            uyari.push(a.etiket+' ağzı '+a.yuz+' yüzde — kapsam dışı, elle eklenmeli');
          }
        });
      });
      // ARKA yüz: iki katlı modülde kat ayırıcı yatay takviye ile kurulur.
      // Birleşme yüzüyse kapaksız kalır — o karar aşağıdaki döngüde verilir.
      let arka = null;
      if(!(otoSac.birlesikAtla && faceMated(mi, 1))){
        arka = gercekArkaYuz(uyari);
        if(arka) sonuc.arka++;
      }
      [1,3,4,5].forEach(function(fi){
        if(fi === 1 && arka) return;
        if(fi === 3 && tv) return;
        if(yanY[fi]) return;
        const face = state.faces[fi];
        if(otoSac.birlesikAtla && faceMated(mi, fi)){
          if(!face.kapaksiz){ face.kapaksiz = true; sonuc.mated++; }
          return;
        }
        if(face.kapaksiz) return;
        // Kısmen örtüşen düşey yüzde komşunun kapattığı bölge boş kalır.
        if((fi === 4 || fi === 5 || fi === 1) && gercekKismiYuz(fi, uyari)){ sonuc.kismi++; return; }
        otoUygulaYuz(fi, true, GERCEK_KAPAK_MAX);
      });
      // Yuzler kurulduktan SONRA: uc uca gelen ara takviyeler birlestirilir. Yuz bazinda
      // degil modul bazinda calisir ki gercekOnYuz/gercekYanYuz/otoUygulaYuz hangi yolu
      // kurmus olursa olsun ayni kural gecsin (bkz. gercekAraBirlestir).
      for(let bf = 0; bf < 6; bf++) sonuc.birlesim += gercekAraBirlestir(bf);
      const on2 = (m.ad ? m.ad : 'Modül '+(mi+1)) + ': ';
      uyari.forEach(function(u){ sonuc.uyari.push(on2 + u); });
    });
  });
  return sonuc;
}

function gercekNot(s){
  const not = document.getElementById('excel_note');
  if(!not) return;
  const p = [];
  p.push((s.santral>1 ? s.santral+' santralde ' : '')
    +s.modul+' modül gerçek değerlerle kuruldu — '+s.kapak+' kapak, bunların '
    +s.acilir+' tanesi açılır ('+s.camli+' camlı).');
  if(s.ust) p.push(s.ust+' modülün üstü açık: ÜST PANEL kuruldu.');
  if(s.tava) p.push(s.tava+' bölmenin altına TAVA kuruldu (ALT yüz).');
  if(s.damper || s.bogaz) p.push('Çizimden '+(s.damper+s.bogaz)+' ağız okundu ve SOL/SAĞ/ÜST '
    +'yüze kondu ('+s.damper+' damper, '+s.bogaz+' boğaz).');
  if(s.arka) p.push(s.arka+' iki katlı modülün ARKA yüzüne kat ayırıcı yatay takviye kondu.');
  if(s.kismi) p.push(s.kismi+' yüzde komşu modülün kapattığı bölge BOŞ bırakıldı.');
  if(s.birlesim) p.push(s.birlesim+' ara takviye uç uca geldiği için BİRLEŞTİRİLDİ '
    +'(aralarında dikey takviye yok).');
  if(s.ustTablo) p.push('⚠ '+s.ustTablo+' ÜST ağzın ölçüsü çizimde yok, teknik tablodan alındı.');
  if(s.disAgiz) p.push('⚠ '+s.disAgiz+' ağız ALT yüzde — kapsam dışı, elle eklenmeli.');
  if(s.mated) p.push(s.mated+' birleşme yüzü kapaksız işaretlendi.');
  if(s.atlanan) p.push('⚠ '+s.atlanan+' modülde DXF bilgisi yok — eski otomatikle dolduruldu.');
  if(s.uyari.length) p.push('⚠ '+s.uyari.join(' · '));
  not.textContent = p.join(' ');
}

// Birden çok santralin sonucunu TEK nota indirir. Sayılar toplanır; uyarılar zaten
// 'Modül N: …' önekli, birden çok santral varsa başına santral adı da eklenir.
function gercekSonucBirlestir(liste){
  const t = {santral: liste.length, modul:0, atlanan:0, kapak:0, acilir:0, camli:0, ust:0,
             tava:0, mated:0, damper:0, bogaz:0, disAgiz:0, ustTablo:0, arka:0, kismi:0,
             birlesim:0, uyari:[]};
  liste.forEach(function(s){
    Object.keys(t).forEach(function(k){
      if(k === 'uyari' || k === 'santral') return;
      t[k] += s[k] || 0;
    });
    (s.uyari||[]).forEach(function(u){ t.uyari.push(liste.length>1 ? s.ahu+' — '+u : u); });
  });
  return t;
}

// ---------- SANTRAL SEÇİMİ (Cenk, 31.08.2026) ----------
// Düğme artık doğrudan kurmuyor: önce bütün santralleri listeleyen bir modal açılır ve
// HEPSİ İŞARETLİ gelir; kullanıcı istemediğinin işaretini kaldırır, kalanlar toplu kurulur.
// Seçim yalnız o an içindir — ne projeye ne localStorage'a yazılır (bir sonraki açılışta
// yine hepsi işaretli gelir, çünkü sorulan soru her seferinde 'bu turda hangileri').
let gsmSecili = [];

// Listede ne yazacağı: kaç modül, kaçında çizimden okunmuş bilgi var. DXF bilgisi
// olmayan modül gerçek değerlerle KURULAMAZ, eski otomatikle dolar — kullanıcı bunu
// görüp işaretini kaldırabilsin diye satırda açıkça yazılır.
function gsmAhuOzet(ai){
  const ahu = state.ahus[ai];
  const mods = ahu.modules || [];
  let dxfli = 0;
  mods.forEach(function(m){
    if(m.dxfBilgi && m.dxfBilgi.parcalar && m.dxfBilgi.parcalar.length) dxfli++;
  });
  return {ad: ahu.ad || ('AHU-'+(ai+1)), modul: mods.length, dxfli: dxfli,
          seri: (ahu.varsayimlar && ahu.varsayimlar.seri) || '—',
          malzeme: ahu.malzeme || '—'};
}

function gsmCiz(){
  const body = document.getElementById('gsm_body');
  if(!body) return;
  body.innerHTML = state.ahus.map(function(_, ai){
    const o = gsmAhuOzet(ai);
    const sec = gsmSecili.indexOf(ai) >= 0;
    const bilgi = [];
    bilgi.push(o.modul + ' modül');
    if(o.modul === 0) bilgi.push('<span class=&quot;u&quot;>modül yok</span>');
    else if(o.dxfli === 0) bilgi.push('<span class=&quot;u&quot;>çizimden okunmuş bilgi YOK — eski otomatikle dolar</span>');
    else if(o.dxfli < o.modul) bilgi.push('<span class=&quot;u&quot;>' + o.dxfli + ' modülde çizim bilgisi var, ' + (o.modul-o.dxfli) + ' modülde yok</span>');
    else bilgi.push('hepsinde çizim bilgisi var');
    bilgi.push('seri ' + o.seri);
    bilgi.push(o.malzeme);
    return '<div class=&quot;gsm-satir' + (sec ? ' sec' : '') + '&quot; data-gsm=&quot;' + ai + '&quot;>'
      + '<input type=&quot;checkbox&quot; data-gsmchk=&quot;' + ai + '&quot;' + (sec ? ' checked' : '') + '>'
      + '<div><div class=&quot;gsm-ad&quot; data-gsmad=&quot;' + ai + '&quot;></div>'
      + '<div class=&quot;gsm-bilgi&quot;>' + bilgi.join(' · ') + '</div></div>'
      + (ai === state.activeAhu ? '<span class=&quot;gsm-rozet&quot;>açık olan</span>' : '')
      + '</div>';
  }).join('');
  // AHU adı KULLANICI GİRDİSİDİR ve innerHTML'e string olarak gömülmez. srcdoc tüm HTML
  // varlıklarını çözdüğü için burada bir kaçış fonksiyonu yazmak tuzaklıdır (bkz. §10/11
  // — kaynağa yazılan '&amp;' çalışma anında '&' olur ve fonksiyon sessizce etkisiz
  // kalır); ad bu yüzden DOM üzerinden textContent ile yazılır.
  body.querySelectorAll('.gsm-ad').forEach(function(el){
    el.textContent = gsmAhuOzet(Number(el.dataset.gsmad)).ad;
  });
  const say = document.getElementById('gsm_sayac');
  if(say) say.textContent = gsmSecili.length + '/' + state.ahus.length + ' seçili';
  const btn = document.getElementById('gsm_kur');
  if(btn){
    btn.disabled = gsmSecili.length === 0;
    btn.textContent = gsmSecili.length > 1
      ? (gsmSecili.length + ' Santralde Kur')
      : 'Kur';
  }
}

function gsmAc(){
  gsmSecili = state.ahus.map(function(_, i){ return i; });   // hepsi işaretli açılır
  gsmCiz();
  document.getElementById('gsm_modal').classList.add('open');
}
function gsmKapat(){
  document.getElementById('gsm_modal').classList.remove('open');
}
function gsmSec(ai, ac){
  const i = gsmSecili.indexOf(ai);
  if(ac && i < 0) gsmSecili.push(ai);
  else if(!ac && i >= 0) gsmSecili.splice(i, 1);
  gsmCiz();
}

// Seçili santrallerin hepsinde gerçek yerleşimi kurar. state.activeAhu geçici olarak
// değiştirilir ve finally ile GERİ ALINIR — bir istisna ortada yanlış AHU'yu açık
// bırakmasın (collectFaceIssues/exportExcel'deki tuzağın aynısı).
function gsmKur(){
  const secim = gsmSecili.slice().sort(function(a,b){ return a-b; });
  if(!secim.length) return;
  gsmKapat();
  const orig = state.activeAhu;
  const hepsi = [];
  try{
    secim.forEach(function(ai){
      state.activeAhu = ai;
      const s = gercekTumAHU();
      s.ahu = state.ahus[ai].ad || ('AHU-'+(ai+1));
      hepsi.push(s);
    });
  }finally{
    state.activeAhu = orig;
  }
  renderAll();
  gercekNot(gercekSonucBirlestir(hepsi));
}

function gercekTikla(){ gsmAc(); }

// ve tema PANEL temasına döner; ikinci kez yazılınca kapanır ve tema geri gelir.

// HİÇBİR YERE YAZILMAZ, yalnızca oturumda yaşar: sayfa her açılışta kapalı başlar ve
// 'admincenk' yeniden yazılmadan açılmaz. (Eskiden localStorage'da 'kh_admin' tutuluyordu

const ADMIN_KEY = 'kh_admin';
const ADMIN_SOZ = 'admincenk';
const ADMIN_TEMA = 'panel';
let adminAcik = false, adminTampon = '', adminOncekiTema = '';
// Eski sürümlerin bıraktığı anahtar temizlenir — yoksa o tarayıcılarda kusur sürerdi.
try{ localStorage.removeItem(ADMIN_KEY); }catch(e){}

function adminTus(e){
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(!e.key || e.key.length !== 1) return;
  adminTampon = (adminTampon + e.key.toLowerCase()).slice(-ADMIN_SOZ.length);
  if(adminTampon === ADMIN_SOZ){ adminTampon = ''; adminGecis(); }
}

// Aktif AHU'da açık bir takviye var mı — düğmenin yönünü (ekle / kaldır) belirler.
function otoTakviyeAcikMi(){
  return state.modules.some(m=> m.faces.some(f=>
    !f.kapaksiz && ((f.colGaps||[]).some(Boolean)
      || (f.columns||[]).some(c=>(c.innerGaps||[]).some(Boolean)))));
}

// Aktif AHU'nun bütün modül × yüzünde çalışır. mod: 'doldur' | 'takviye'
function otoTumAHU(mod, tak){
  const sonuc = {yuz:0, kapak:0, atlanan:0, mated:0, tasan:0, cozumsuz:[]};
  state.modules.forEach((m, mi)=>{
    withModule(mi, ()=>{
      FACE_DEFS.forEach((fdef, fi)=>{
        const face = state.faces[fi];
        // İki modülün birleştiği iç yüzde kapak olmaz — maliyeti şişirmesin diye
        // kapaksız işaretlenir (kutucukla kapatılabilir).
        if(otoSac.birlesikAtla && faceMated(mi, fi)){
          if(!face.kapaksiz){ face.kapaksiz = true; sonuc.mated++; }
          return;
        }
        if(face.kapaksiz){ sonuc.atlanan++; return; }
        if(mod === 'doldur'){
          const plan = otoUygulaYuz(fi, tak);
          if(!plan){ sonuc.cozumsuz.push('M'+(mi+1)+' '+fdef.name); return; }
          sonuc.yuz++; sonuc.kapak += plan.adet;
        } else {
          const t = otoTakviyeYuz(fi, tak);
          if(t < 0){ sonuc.cozumsuz.push('M'+(mi+1)+' '+fdef.name); return; }
          sonuc.yuz++; sonuc.tasan += t;
          sonuc.kapak += face.columns.reduce((a,c)=>a+c.panels.length, 0);
        }
      });
    });
  });
  return sonuc;
}

function otoNot(s, mod){

    +' kapak (sac '+otoSac.w+'×'+otoSac.h+' mm, seri payı '+otoAcilimPayi()+' mm).');

    +' ve ölçüler yeniden dağıtıldı ('+s.kapak+' kapak).');

  if(s.atlanan) p.push(s.atlanan+' kapaksız yüz atlandı.');

  not.textContent = p.join(' ');
}
