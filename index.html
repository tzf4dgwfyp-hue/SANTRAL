}


// =====================================================================
// BOGAZ GEOMETRI CIZIMI (BOGAZ_OTOMATIK.lsp portu)
// =====================================================================
// DBP = Dikey Bogaz Parcasi (yukseklik degeri mm)
// YBP = Yatay Bogaz Parcasi (genislik degeri mm)
// Tum koordinatlar ox,oy alt-sol kosesine gore.

var BOGAZ_LAYER = 'BOGAZ';

function drawBogazDBP(dxf, ox, oy, DBP) {
  var LR = DBP - 13.6;
  var dY = LR - 586.4;
  var L = BOGAZ_LAYER;

  // ALT-KAPAK: 3 delik r=2.75
  dxf.addCircle(ox + 51.884,  oy + 12.500, 2.75, L);
  dxf.addCircle(ox + 81.884,  oy + 12.500, 2.75, L);
  dxf.addCircle(ox + 111.884, oy + 12.500, 2.75, L);

  // Govde alt koseler R5
  dxf.addArc(ox + 5.000,   oy + 30.242, 5.0, 180, 270, L);
  dxf.addArc(ox + 158.768, oy + 30.242, 5.0, 270, 360, L);

  // Dil alt koseler R5
  dxf.addArc(ox + 38.684,  oy + 5.000, 5.0, 180, 270, L);
  dxf.addArc(ox + 125.084, oy + 5.000, 5.0, 270, 360, L);

  // Gecis rolezi R0.8 (SW eksik = NE,NW,SE)
  dxf.addArc(ox + 33.684, oy + 25.242, 0.8,   0,  90, L);
  dxf.addArc(ox + 33.684, oy + 25.242, 0.8,  90, 180, L);
  dxf.addArc(ox + 33.684, oy + 25.242, 0.8, 270, 360, L);

  // Gecis rolezi sag R0.8 (SE eksik = NE,NW,SW)
  dxf.addArc(ox + 130.084, oy + 25.242, 0.8,   0,  90, L);
  dxf.addArc(ox + 130.084, oy + 25.242, 0.8,  90, 180, L);
  dxf.addArc(ox + 130.084, oy + 25.242, 0.8, 180, 270, L);

  // Govde yatay kenarlar (alt kapak)
  dxf.addLine(ox + 5.000,   oy + 25.242, ox + 32.884,  oy + 25.242, L);
  dxf.addLine(ox + 130.884, oy + 25.242, ox + 158.768, oy + 25.242, L);

  // Dil tabani (Y=0)
  dxf.addLine(ox + 38.684, oy + 0.000, ox + 125.084, oy + 0.000, L);

  // Dil dikey duvarlari
  dxf.addLine(ox + 33.684,  oy + 24.442, ox + 33.684,  oy + 5.000, L);
  dxf.addLine(ox + 130.084, oy + 5.000,  ox + 130.084, oy + 24.442, L);

  // Govde dikey kenarlar
  var yTop = 30.242 + LR;
  dxf.addLine(ox + 0.000,   oy + 30.242, ox + 0.000,   oy + yTop, L);
  dxf.addLine(ox + 163.768, oy + 30.242, ox + 163.768, oy + yTop, L);

  // UST-KAPAK
  var y616 = 616.642 + dY;
  var y621 = 621.642 + dY;
  var y622 = 622.442 + dY;
  var y634 = 634.384 + dY;
  var y641 = 641.884 + dY;
  var y646 = 646.884 + dY;

  // 3 delik r=2.75
  dxf.addCircle(ox + 51.884,  oy + y634, 2.75, L);
  dxf.addCircle(ox + 81.884,  oy + y634, 2.75, L);
  dxf.addCircle(ox + 111.884, oy + y634, 2.75, L);

  // Govde ust koseler R5
  dxf.addArc(ox + 5.000,   oy + y616, 5.0, 90, 180, L);
  dxf.addArc(ox + 158.768, oy + y616, 5.0,  0,  90, L);

  // Dil ust koseler R5
  dxf.addArc(ox + 38.684,  oy + y641, 5.0, 90, 180, L);
  dxf.addArc(ox + 125.084, oy + y641, 5.0,  0,  90, L);

  // Gecis rolezi ust-sol R0.8 (NW eksik = NE, SW, SE)
  dxf.addArc(ox + 33.684, oy + y621, 0.8,   0,  90, L);
  dxf.addArc(ox + 33.684, oy + y621, 0.8, 180, 270, L);
  dxf.addArc(ox + 33.684, oy + y621, 0.8, 270, 360, L);

  // Gecis rolezi ust-sag R0.8 (NE eksik = NW, SW, SE)
  dxf.addArc(ox + 130.084, oy + y621, 0.8,  90, 180, L);
  dxf.addArc(ox + 130.084, oy + y621, 0.8, 180, 270, L);
  dxf.addArc(ox + 130.084, oy + y621, 0.8, 270, 360, L);

  // Govde yatay kenarlar (ust kapak)
  dxf.addLine(ox + 32.884,  oy + y621, ox + 5.000,   oy + y621, L);
  dxf.addLine(ox + 158.768, oy + y621, ox + 130.884, oy + y621, L);

  // Dil tavani
  dxf.addLine(ox + 38.684, oy + y646, ox + 125.084, oy + y646, L);

  // Dil dikey duvarlari (ust)
  dxf.addLine(ox + 33.684,  oy + y641, ox + 33.684,  oy + y622, L);
  dxf.addLine(ox + 130.084, oy + y622, ox + 130.084, oy + y641, L);
}

function drawBogazYBP(dxf, ox, oy, YBP) {
  var L = BOGAZ_LAYER;
  var BW = YBP + 40;    // govde genislik
  var xR = 5.0 + BW;    // sag koselerin X merkezi
  var xW = 10.0 + BW;   // sag dikey kenar X
  var xC = xW - 12.5;   // sag delik sutunu X

  // SOL-UC
  dxf.addLine(ox + 0.000, oy + 5.000, ox + 0.000, oy + 158.768, L);
  dxf.addArc(ox + 5.000, oy + 5.000,   5.0, 180, 270, L);
  dxf.addArc(ox + 5.000, oy + 158.768, 5.0,  90, 180, L);

  // Sol 5 delik
  dxf.addCircle(ox + 12.500, oy + 20.942,  5.0,  L);
  dxf.addCircle(ox + 12.500, oy + 51.884,  2.75, L);
  dxf.addCircle(ox + 12.500, oy + 81.884,  2.75, L);
  dxf.addCircle(ox + 12.500, oy + 111.884, 2.75, L);
  dxf.addCircle(ox + 12.500, oy + 142.826, 5.0,  L);

  // Govde yatay kenarlar
  dxf.addLine(ox + 5.000, oy + 0.000,   ox + xR, oy + 0.000, L);
  dxf.addLine(ox + 5.000, oy + 163.768, ox + xR, oy + 163.768, L);

  // SAG-UC
  dxf.addLine(ox + xW, oy + 5.000, ox + xW, oy + 158.768, L);
  dxf.addArc(ox + xR, oy + 5.000,   5.0, 270, 360, L);
  dxf.addArc(ox + xR, oy + 158.768, 5.0,   0,  90, L);

  // Sag 5 delik
  dxf.addCircle(ox + xC, oy + 20.942,  5.0,  L);
  dxf.addCircle(ox + xC, oy + 51.884,  2.75, L);
  dxf.addCircle(ox + xC, oy + 81.884,  2.75, L);
  dxf.addCircle(ox + xC, oy + 111.884, 2.75, L);
  dxf.addCircle(ox + xC, oy + 142.826, 5.0,  L);

  // Orta delikler (YBP >= 1950)
  if (YBP >= 1950) {
    var xM = xW / 2.0;
    dxf.addCircle(ox + xM, oy + 51.884,  2.75, L);
    dxf.addCircle(ox + xM, oy + 81.884,  2.75, L);
    dxf.addCircle(ox + xM, oy + 111.884, 2.75, L);
  }
}

// BOGAZ BOLME (Cenk, 03.09.2026) — cok genis bogazin yatay profili (YBP) tek parca
// olarak SACA SIGMIYOR; o durumda bogaz IKIYE bolunur ve iki ayri takim cizilir.
// Damperdeki DAMPER_BOLME_ESIGI kuralinin birebir aynisi: iki yari ortadaki dikmeyi
// paylasir, bu yuzden her yarinin govde kenari tam yaridan 10 mm kisadir.
//
// OLCULDU (havuzun tamami, 713 cizim / 234 benzersiz eleman kaydi): saca sigmayan 7
// kayit vardi ve 7'si de bogazdi — kirilan parca her seferinde YBP. YBP parcasinin
// ayak izi YBP + 50; 1500x3000 sacta (pay 3) kullanilabilir uzun kenar 2994, yani
// gercek sinir 2944 mm. Havuzdaki en kucuk sorunlu olcu 2950 idi.
// Esik SABIT tutuldu (damperdeki 1800 gibi): sac ayari degisince ayni proje farkli
// parca vermesin.
var BOGAZ_BOLME_ESIGI = 2900;   // bu olcu ve uzeri IKI bogaza bolunur
var BOGAZ_BOLME_EK    = 50;
var BOGAZ_BOLME_DUS   = 10;
var BOGAZ_GOVDE_EK    = 40;     // drawBogazYBP: govde genisligi = YBP + 40

// Bir bogaz kaydini cizilecek takimlara ayirir.
//   bolunmezse : { ybp: girilen olcu, takim: 1 }
//   bolunurse  : { ybp: yarinin olcusu, takim: 2 }
// Yarinin govde kenari damper formuluyle bulunur, drawBogazYBP'ye giden deger ondan
// govde payi (40) dusulerek turer — boylece iki yol da ayni fiziksel kenari uretir.
function bogazTakimlari(YBP) {
  var y = Number(YBP) || 0;
  if (y >= BOGAZ_BOLME_ESIGI) {
    var kenar = ((y + BOGAZ_BOLME_EK) / 2) - BOGAZ_BOLME_DUS;
    return { ybp: kenar - BOGAZ_GOVDE_EK, takim: 2 };
  }
  return { ybp: y, takim: 1 };
}

// Tek bir bogaz seti (2xDBP + 2xYBP, haci duzeni)
function drawBogazSet(dxf, ox, oy, YBP, DBP) {
  var G = 100.0;
  var wDBP = 163.768;
  var hDBP = DBP + 46.884;
  var wYBP = YBP + 50.0;
  var hYBP = 163.768;

  // Alt YBP
  drawBogazYBP(dxf, ox + wDBP + G, oy + 0.0, YBP);
  // Sol DBP
  drawBogazDBP(dxf, ox + 0.0, oy + hYBP + G, DBP);
  // Sag DBP
  drawBogazDBP(dxf, ox + wDBP + G + wYBP + G, oy + hYBP + G, DBP);
  // Ust YBP
  drawBogazYBP(dxf, ox + wDBP + G, oy + hYBP + G + hDBP + G, YBP);

  // Uzun durum: 3. DBP
  if (YBP >= 1950) {
    drawBogazDBP(dxf, ox + wDBP + G + wYBP + G + wDBP + 300.0, oy + hYBP + G, DBP);
  }

  // Toplam olcu
  var totalW = (YBP >= 1950)
    ? (wDBP + G + wYBP + G + wDBP + 300.0 + wDBP)
    : (wDBP + G + wYBP + G + wDBP);
  var totalH = hYBP + G + hDBP + G + hYBP;
  return { w: totalW, h: totalH };
}

// DXF dosya adi son ekleri — uretilen her dosya &quot;{proje adi} — {son ek}.dxf&quot; olur.
// Ucu de burada durur ki adlandirma semasi tek yerden gorulsun/degistirilsin.
var ALTUST_DOSYA_EKI = 'ALT-ÜST';
var YAN_DOSYA_EKI    = 'YAN PANELLER';
var BOGAZ_DOSYA_EKI  = 'BOĞAZLAR';
// Toplu uretimin TEK dosyasi — icinde yukaridaki adlarla DXF'ler durur.
var ZIP_DOSYA_EKI    = 'TÜM DXF';
// Cizim modullerinin son ekleri — ayni semayi kullanirlar.
var TAVA_DOSYA_EKI    = 'TAVA';
var DAMPER_DOSYA_EKI  = 'DAMPER';
var ARAKAT_DOSYA_EKI  = 'ARA KAT';
var KIZAK_DOSYA_EKI   = 'BATARYA KIZAĞI';
var ESANJOR_DOSYA_EKI = 'EŞANJÖR';

// Dosya adindan YALNIZCA dosya sisteminde yasakli karakterleri ayiklar (\ / : * ? &quot; < > |).
// Turkce harfler ve bosluklar KORUNUR — panel DXF'leri de ('… DIŞ.dxf', '… İÇ PASLANMAZ.dxf',
// '… — YAN PANELLER.dxf') bunlari aynen kullaniyor, boğaz dosyasi da onlarla ayni gorunmeli.
function dosyaAdiTemizle(s) {
  // Cift tirnak regex icinde \u0022 olarak yazilir: ham hali srcdoc attribute'unu kapatirdi.
  return String(s).replace(/[\\\/:*?\u0022<>|]/g, '_').replace(/\s+/g, ' ').trim();
}

// Kapak Hesabi'ndan gelen proje adi. applyKapakData seriye gore dosyaAdi50 VEYA
// dosyaAdi60'a, bogaz varsa b-dosyaAdi'ya yaziyor — dolu olan ilkini doneriz.
// Modul listeleri elle dolduruldugu icin bu alanlar bos olabilir; o zaman '' doner.
function projeAdiOku() {
  var ids = ['dosyaAdi50', 'dosyaAdi60', 'b-dosyaAdi'];
  for (var i = 0; i < ids.length; i++) {
    var el = document.getElementById(ids[i]);
    if (el && el.value && el.value.trim()) return el.value.trim();
  }
  return '';
}

// Cizim modullerinin (tava / damper / ara kat / esanjor) ORTAK DXF indirme yolu.
// Ad sirasi: elle yazilan ad > &quot;{proje adi} — {son ek}&quot; > modulun varsayilani.
// Bagimsiz modul dosyalarindaki [^a-zA-Z0-9_-] temizligi KULLANILMAZ: Turkce
// harfleri _ yapiyordu; bu, bogaz dosyasinda 2026-08-13'te duzeltilen hatanin
// aynisiydi. dosyaAdiTemizle yalnizca dosya sisteminde yasakli karakterleri atar.
// Uzantisiz taban ad. Ayri durmasinin sebebi esanjor: tek cagride IKI dosya
// uretiyor (ana + '1.5 MM' isaretli olculer), ikisinin de ayni tabandan turemesi
// gerekiyor.
function modulDosyaAdi(elAd, sonEk, varsayilanAd) {
  var elle = ((elAd && elAd.value) || '').trim();
  var proje = projeAdiOku();
  var ham = elle ? elle : (proje ? proje + ' — ' + sonEk : varsayilanAd);
  return dosyaAdiTemizle(ham);
}

// ---------- İNDİRME KUYRUĞU ----------
// f0'daki kuyruğun ikizi (iki iframe ayrı belgedir, ortak fonksiyon paylaşamazlar).
// Tarayıcı, AYNI ANDA tetiklenen indirmelerin ilk 10'unu alıp gerisini SESSİZCE
// düşürüyor (ölçüldü 03.09.2026, gerçek Chrome: 25 tetikleme → 10 dosya; 100 ms
// arayla 25/25). Toplu DXF paslanmaz bir projede 10 dosyayı rahatça aşıyor:
// panel grupları (ANA/ALT-ÜST × kalınlık × DIŞ/İÇ) + boğaz + tava + damper +
// ara kat + eşanjör (2 dosya) + kızak.
// Çağıran BEKLEMEZ — blob hazırdır, yalnız tıklama ertelenir; bu yüzden
// generateAndDownload* fonksiyonlarının {success, filename} sözleşmesi ve
// topluDxfUret'in liste temizleme kuralları hiç değişmez.
var INDIRME_ARA = 300;   // ms — ölçülen sınır 100; üç katı pay bırakıldı
var indirmeKuyrugu = [];
var indirmeCalisiyor = false;
function indirmeSirala(url, ad) {
  indirmeKuyrugu.push({ url: url, ad: ad });
  if (!indirmeCalisiyor) { indirmeCalisiyor = true; indirmeSonraki(); }
  return ad;
}
function indirmeSonraki() {
  var it = indirmeKuyrugu.shift();
  if (!it) { indirmeCalisiyor = false; return; }
  var a = document.createElement('a');
  a.href = it.url;
  a.download = it.ad;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(it.url); }, 5000);
  setTimeout(indirmeSonraki, INDIRME_ARA);
}

// ---------- ZIP YAZICI (store — sikistirma YOK) ----------
// Neden gerekli: tarayici bir turda tetiklenen indirmelerin ancak bir kismini aliyor.
// Olculdu 03.09.2026 (gercek Chrome, 25 dosya): hepsi ayni anda -> 10 dosya; indirme
// kuyrugundan sonra http uzerinde 25/25 AMA file:// uzerinde 1/25. Uygulama cift
// tiklanarak da aciliyor (bkz. CLAUDE.md §2), yani tek guvenli yol TEK dosya indirmek.
// Sikistirma yapilmaz: deflate icin kutuphane gerekir, bu dosya bagimliliksiz kalmali.
// Ad alaninda UTF-8 bayragi (bit 11) kurulur — BOĞAZLAR / EŞANJÖR / KIZAĞI gibi Turkce
// adlar Windows Gezgini ve 7-Zip tarafindan dogru okunur.
var zipCrcTablo = null;
function zipCrc32(u8) {
  if (!zipCrcTablo) {
    zipCrcTablo = new Int32Array(256);
    for (var i = 0; i < 256; i++) {
      var c = i;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      zipCrcTablo[i] = c;
    }
  }
  var crc = -1;
  for (var j = 0; j < u8.length; j++) crc = (crc >>> 8) ^ zipCrcTablo[(crc ^ u8[j]) & 0xFF];
  return (crc ^ -1) >>> 0;
}
// MS-DOS tarih/saat alanlari (2 sn cozunurluk, 1980 baslangic)
function zipTarih(t) {
  return {
    saat: ((t.getHours() & 31) << 11) | ((t.getMinutes() & 63) << 5) | ((t.getSeconds() / 2) & 31),
    gun: (((t.getFullYear() - 1980) & 127) << 9) | (((t.getMonth() + 1) & 15) << 5) | (t.getDate() & 31)
  };
}
// dosyalar: [{ad, veri}] — veri metin ya da Uint8Array/ArrayBuffer olabilir
function zipYap(dosyalar) {
  var enc = new TextEncoder();
  var t = zipTarih(new Date());
  var govde = [], merkez = [], ofset = 0;
  dosyalar.forEach(function (dd) {
    var ad = enc.encode(dd.ad);
    var veri = (typeof dd.veri === 'string') ? enc.encode(dd.veri)
      : (dd.veri instanceof Uint8Array ? dd.veri : new Uint8Array(dd.veri));
    var crc = zipCrc32(veri);
    var yerel = new Uint8Array(30 + ad.length);
    var dv = new DataView(yerel.buffer);
    dv.setUint32(0, 0x04034b50, true);   // yerel baslik imzasi
    dv.setUint16(4, 20, true);           // gereken surum (2.0)
    dv.setUint16(6, 0x0800, true);       // bayrak: ad UTF-8
    dv.setUint16(8, 0, true);            // yontem: store
    dv.setUint16(10, t.saat, true);
    dv.setUint16(12, t.gun, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, veri.length, true); // sikistirilmis boy = ham boy
    dv.setUint32(22, veri.length, true);
    dv.setUint16(26, ad.length, true);
    yerel.set(ad, 30);
    govde.push(yerel, veri);
    var mrk = new Uint8Array(46 + ad.length);
    var mv = new DataView(mrk.buffer);
    mv.setUint32(0, 0x02014b50, true);   // merkez dizin imzasi
    mv.setUint16(4, 20, true);
    mv.setUint16(6, 20, true);
    mv.setUint16(8, 0x0800, true);
    mv.setUint16(10, 0, true);
    mv.setUint16(12, t.saat, true);
    mv.setUint16(14, t.gun, true);
    mv.setUint32(16, crc, true);
    mv.setUint32(20, veri.length, true);
    mv.setUint32(24, veri.length, true);
    mv.setUint16(28, ad.length, true);
    mv.setUint32(42, ofset, true);       // yerel basligin dosya icindeki yeri
    mrk.set(ad, 46);
    merkez.push(mrk);
    ofset += yerel.length + veri.length;
  });
  var merkezBoy = merkez.reduce(function (a, m) { return a + m.length; }, 0);
  var son = new Uint8Array(22);
  var sv = new DataView(son.buffer);
  sv.setUint32(0, 0x06054b50, true);     // merkez dizin sonu
  sv.setUint16(8, dosyalar.length, true);
  sv.setUint16(10, dosyalar.length, true);
  sv.setUint32(12, merkezBoy, true);
  sv.setUint32(16, ofset, true);
  return new Blob(govde.concat(merkez, [son]), { type: 'application/zip' });
}
// Toplu uretimde dosyalar INDIRILMEZ, burada toplanir ve sonunda tek ZIP olur.
// null iken davranis eskisi gibi: her cagri kendi dosyasini indirir.
var indirmeToplama = null;
// ZIP icinde bu turun klasoru — cok santralli projede her santral kendi klasorunde
// (20 santral x 5 dosya duz bir listede okunmuyor). Bos ise klasor yok.
var indirmeKlasor = '';
// DXF indirmenin TEK kapisi — metni bir kez uretir, toplama moduna saygi duyar.
function dxfIndir(dxf, tamAd) {
  var metin = dxf.generate();
  if (indirmeToplama) {
    indirmeToplama.push({ ad: (indirmeKlasor ? indirmeKlasor + '/' : '') + tamAd, veri: metin });
    return tamAd;
  }
  return indirmeSirala(URL.createObjectURL(new Blob([metin], { type: 'application/dxf' })), tamAd);
}
function modulDxfKaydet(dxf, tamAd) {
  return dxfIndir(dxf, tamAd);
}

function modulDxfIndir(dxf, elAd, sonEk, varsayilanAd) {
  return modulDxfKaydet(dxf, modulDosyaAdi(elAd, sonEk, varsayilanAd) + '.dxf');
}

function generateAndDownloadBogazDxf(list) {
  var dxf = new DxfWriter();
  var SET_GAP = 500.0; // setler arasi dusey bosluk
  var yCursor = 0;

  list.forEach(function(b) {
    // Saca sigmayan genis bogaz IKI takima bolunur (bkz. bogazTakimlari).
    var bl = bogazTakimlari(b.ybp);
    for (var a = 0; a < b.adet * bl.takim; a++) {
      var dim = drawBogazSet(dxf, 0, yCursor, bl.ybp, b.dbp);
      yCursor += dim.h + SET_GAP;
    }
  });

  var totalCount = 0;
  list.forEach(function(b) { totalCount += b.adet * bogazTakimlari(b.ybp).takim; });

  // Panellerde oldugu gibi dosya adina icerik son eki yazilir (bkz. topluDxfUret'teki
  // '— ALT-ÜST' ve '— YAN PANELLER'). Proje adi bos ise yalnizca son ek kullanilir.
  var rawName = ((elBDosyaAdi && elBDosyaAdi.value) || '').trim();
  var name = dosyaAdiTemizle(rawName ? rawName + ' — ' + BOGAZ_DOSYA_EKI : BOGAZ_DOSYA_EKI) + '.dxf';
  dxfIndir(dxf, name);
  return { success: true, count: totalCount, filename: name };
}


// SVG WRITER (DxfWriter API uyumlu) - canli onizleme icin
// =====================================================================
function SvgWriter() { this.entities = []; }
SvgWriter.prototype.addLine   = function(x1,y1,x2,y2,layer){ this.entities.push({t:'L',x1:x1,y1:y1,x2:x2,y2:y2}); };
SvgWriter.prototype.addCircle = function(cx,cy,r,layer){ this.entities.push({t:'C',cx:cx,cy:cy,r:r}); };
SvgWriter.prototype.addArc    = function(cx,cy,r,sa,ea,layer){ this.entities.push({t:'A',cx:cx,cy:cy,r:r,sa:sa,ea:ea}); };
SvgWriter.prototype.addText   = function(){};
SvgWriter.prototype.addSpline = function(pts){
  // Spline'i basit bir polyline olarak onizlemede goster
  var e = this.entities;
  for (var i = 1; i < pts.length; i++) {
    e.push({t:'L', x1:pts[i-1][0], y1:pts[i-1][1], x2:pts[i][0], y2:pts[i][1]});
  }
};
SvgWriter.prototype.bbox = function() {
  var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  this.entities.forEach(function(e){
    if (e.t==='L') {
      if (e.x1<minX)minX=e.x1; if (e.x2<minX)minX=e.x2;
      if (e.x1>maxX)maxX=e.x1; if (e.x2>maxX)maxX=e.x2;
      if (e.y1<minY)minY=e.y1; if (e.y2<minY)minY=e.y2;
      if (e.y1>maxY)maxY=e.y1; if (e.y2>maxY)maxY=e.y2;
    } else if (e.t==='C' || e.t==='A') {
      if (e.cx-e.r<minX)minX=e.cx-e.r;
      if (e.cx+e.r>maxX)maxX=e.cx+e.r;
      if (e.cy-e.r<minY)minY=e.cy-e.r;
      if (e.cy+e.r>maxY)maxY=e.cy+e.r;
    }
  });
  return {minX:minX,maxX:maxX,minY:minY,maxY:maxY};
};
SvgWriter.prototype.toSvg = function(width, height) {
  if (this.entities.length === 0) return '';
  var bb = this.bbox();
  var w = bb.maxX - bb.minX;
  var h = bb.maxY - bb.minY;
  var pad = Math.max(w, h) * 0.04 + 10;
  var vbX = bb.minX - pad;
  var vbY = -bb.maxY - pad;
  var vbW = w + 2*pad;
  var vbH = h + 2*pad;
  var sw = Math.max(vbW, vbH) / 180;
  var parts = [];
  parts.push('<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;'+vbX+' '+vbY+' '+vbW+' '+vbH+'&quot; width=&quot;'+width+'&quot; height=&quot;'+height+'&quot; preserveAspectRatio=&quot;xMidYMid meet&quot; style=&quot;stroke:currentColor;fill:none;stroke-width:'+sw+';stroke-linecap:round;stroke-linejoin:round;&quot;>');
  this.entities.forEach(function(e){
    if (e.t==='L') {
      parts.push('<line x1=&quot;'+e.x1+'&quot; y1=&quot;'+(-e.y1)+'&quot; x2=&quot;'+e.x2+'&quot; y2=&quot;'+(-e.y2)+'&quot;/>');
    } else if (e.t==='C') {
      parts.push('<circle cx=&quot;'+e.cx+'&quot; cy=&quot;'+(-e.cy)+'&quot; r=&quot;'+e.r+'&quot;/>');
    } else if (e.t==='A') {
      var sa = e.sa * Math.PI / 180;
      var ea = e.ea * Math.PI / 180;
      var sx = e.cx + e.r * Math.cos(sa);
      var sy = -(e.cy + e.r * Math.sin(sa));
      var ex = e.cx + e.r * Math.cos(ea);
      var ey = -(e.cy + e.r * Math.sin(ea));
      var diff = e.ea - e.sa;
      while (diff < 0) diff += 360;
      while (diff > 360) diff -= 360;
      var la = diff > 180 ? 1 : 0;
      parts.push('<path d=&quot;M '+sx+' '+sy+' A '+e.r+' '+e.r+' 0 '+la+' 1 '+ex+' '+ey+'&quot;/>');
    }
  });
  parts.push('</svg>');
  return parts.join('');
};


// Canli onizleme (setPreviewSvg / attachPreviewZoom / updatePanelPreview /
// updateBogazPreview / setupPreviewListeners) elle giris formuyla birlikte
// kaldirildi — tek tuketicileri o formdaki p-preview-svg ve b-preview-svg
// kutulariydi. SvgWriter DURUYOR: sac nesting onizlemesi (nestSvgPreviewForSheet)
// onun uzerinden calisiyor.

// =====================================================================
// KAPAK HESABI AKTARIMI — URL hash veya postMessage (wrapper iframe)
// =====================================================================
// =====================================================================
// TOPLU DXF URETIMI
// =====================================================================
var elTopluExport = document.getElementById('btn-toplu-export');

// Bes listenin TAMAMINI tek tikta uretir: panel + bogaz + tava + damper + ara kat.
// Her liste yalnizca KENDI dosyasi basariyla indiyse sifirlanir; govdenin tamami
// try/catch icinde oldugu icin bir istisna hicbir listeyi silmez.
// Kayitlari SANTRAL bazinda gruplar (gelis sirasi korunur). Etiketsiz kayit —
// ornegin f1'de elle girilen esanjor — 'etiketsiz' grubuna duser ve dosya adini
// eskisi gibi tasiyicilardan alir.
function santralGruplari() {
  var sira = [], harita = {};
  function ekle(kayit, tur) {
    var ad = kayit.santral || '';
    if (!harita[ad]) {
      harita[ad] = { ad: ad, panels: [], bogaz: [], tava: [], damper: [], arakat: [], esanjor: [], kizak: [] };
      sira.push(harita[ad]);
    }
    harita[ad][tur].push(kayit);
  }
  panels.forEach(function (x) { ekle(x, 'panels'); });
  bogazList.forEach(function (x) { ekle(x, 'bogaz'); });
  tavaList.forEach(function (x) { ekle(x, 'tava'); });
  damperList.forEach(function (x) { ekle(x, 'damper'); });
  arakatList.forEach(function (x) { ekle(x, 'arakat'); });
  esanjorList.forEach(function (x) { ekle(x, 'esanjor'); });
  kizakList.forEach(function (x) { ekle(x, 'kizak'); });
  return sira;
}

// Dosya adi tasiyicilarini bir santralin adina cevirir; eski degerleri geri
// yuklemek icin bir fonksiyon dondurur (tur bitince arayuz eski haline doner).
function santralAdlariKur(ad) {
  var alanlar = [
    ['dosyaAdi50', ad], ['dosyaAdi60', ad], ['b-dosyaAdi', ad],
    ['t-dosyaAdi', ad + ' — ' + TAVA_DOSYA_EKI],
    ['d-dosyaAdi', ad + ' — ' + DAMPER_DOSYA_EKI],
    ['a-dosyaAdi', ad + ' — ' + ARAKAT_DOSYA_EKI],
    ['e-dosyaAdi', ad + ' — ' + ESANJOR_DOSYA_EKI],
    ['k-dosyaAdi', ad + ' — ' + KIZAK_DOSYA_EKI]
  ];
  var eski = [];
  alanlar.forEach(function (a) {
    var el = document.getElementById(a[0]);
    if (!el) return;
    eski.push([el, el.value]);
    el.value = a[1];
  });
  return function () { eski.forEach(function (e) { e[0].value = e[1]; }); };
}

// BIR santralin dosyalarini uretir. Govde eskiden topluDxfUret'in icindeydi;
// tek fark listelerin global degil GRUBUN listeleri olmasi ve temizligin disarida
// yapilmasi (butun santraller basarili olursa).
function turUret(g, exportedNames, klasorlu) {
  var geri = g.ad ? santralAdlariKur(g.ad) : null;
  // Klasor YALNIZ birden fazla santral varken acilir: tek santralde ZIP icinde
  // gereksiz bir katman olurdu ve dosya adi zaten santrali soyluyor.
  indirmeKlasor = (klasorlu && g.ad) ? dosyaAdiTemizle(g.ad) : '';
  try {
    // 1) Panel — grup varsa (ANA / ALTUST) ayrı DXF, yoksa sadece kalınlığa göre ayır
    if (g.panels.length) {
      var hasGrup = g.panels.some(function (p) { return p.grup; });
      var grupSirasi = hasGrup ? ['ANA', 'ALTUST'] : [null];
      grupSirasi.forEach(function (gr) {
        var grupPanels = hasGrup ? g.panels.filter(function (p) { return (p.grup || 'ANA') === gr; }) : g.panels;
        if (!grupPanels.length) return;
        var groups = {};
        grupPanels.forEach(function (p) {
          if (!groups[p.kalinlik]) groups[p.kalinlik] = [];
          groups[p.kalinlik].push(p);
        });
        Object.keys(groups).forEach(function (kalinlik) {
          var customAd = null;
          if (gr === 'ALTUST' || gr === 'ANA') {
            var base = String(kalinlik).replace('P', '');
            var el = base === '60' ? document.getElementById('dosyaAdi60') : document.getElementById('dosyaAdi50');
            var baseAdi = (el && el.value.trim()) || (base + 'lik_panel');
            customAd = baseAdi + ' — ' + (gr === 'ALTUST' ? ALTUST_DOSYA_EKI : YAN_DOSYA_EKI);
          }
          var result = generateAndDownloadDxf(groups[kalinlik], kalinlik, 1, 700, 1000, customAd);
          if (result && result.success) exportedNames.push(result.filename);
        });
      });
    }
    // 2) Boğaz
    if (g.bogaz.length) {
      var bRes = generateAndDownloadBogazDxf(g.bogaz);
      if (bRes && bRes.success) exportedNames.push(bRes.filename);
    }
    // 3) Çizim modülleri — sekmelerindeki tekil düğmelerle AYNI fonksiyonlar.
    if (g.tava.length) {
      var tRes = generateAndDownloadTavaDxf(g.tava);
      if (tRes && tRes.success) exportedNames.push(tRes.filename);
    }
    if (g.damper.length) {
      var dRes = generateAndDownloadDamperDxf(g.damper);
      if (dRes && dRes.success) exportedNames.push(dRes.filename);
    }
    if (g.arakat.length) {
      var aRes = generateAndDownloadArakatDxf(g.arakat);
      if (aRes && aRes.success) exportedNames.push(aRes.filename);
    }
    // Esanjor TEK cagride IKI dosya uretebilir (1.5 MM ayri dosyaya gider).
    if (g.esanjor.length) {
      var eRes = generateAndDownloadEsanjorDxf(g.esanjor);
      if (eRes && eRes.success) exportedNames.push(eRes.filename);
    }
    if (g.kizak.length) {
      var kRes = generateAndDownloadKizakDxf(g.kizak);
      if (kRes && kRes.success) exportedNames.push(kRes.filename);
    }
  } finally {
    indirmeKlasor = '';
    if (geri) geri();
  }
}

// Butun listeleri sifirlar — YALNIZCA tur bastan sona basariyla bittiginde cagrilir
// (yarim kalan turda kullanici aktarimi yeniden yapmak zorunda kalmasin).
function topluListeleriTemizle() {
  panels.length = 0; bogazList.length = 0; tavaList.length = 0; damperList.length = 0;
  arakatList.length = 0; esanjorList.length = 0; kizakList.length = 0;
  renderTable(); renderBogazTable(); renderTavaTable(); renderDamperTable();
  renderArakatTable(); renderEsanjorTable(); renderKizakTable();
}

function topluDxfUret() {
  var hasPanel = panels.length > 0;
  var hasBogaz = bogazList.length > 0;
  var hasTava = tavaList.length > 0;
  var hasDamper = damperList.length > 0;
  var hasArakat = arakatList.length > 0;
  var hasEsanjor = esanjorList.length > 0;
  var hasKizak = kizakList.length > 0;
  if (!hasPanel && !hasBogaz && !hasTava && !hasDamper && !hasArakat && !hasEsanjor && !hasKizak) {
    setStatus('Üretilecek kayıt yok — önce Kapak Hesabı sekmesinden aktarın.');
    return;
  }

  setStatus('Toplu DXF üretiliyor...');
  var exportedNames = [];
  // Dosyalar TEK ZIP olarak inecek — tarayici cok dosyayi bir turda indirmiyor
  // (olculdu: file:// uzerinde 1, http uzerinde 10). Uretim yolu hic degismez:
  // generateAndDownload* fonksiyonlari dxfIndir uzerinden buraya yazar.
  indirmeToplama = [];

  // Uretim sirasinda bir istisna cikarsa listeler DURUR (temizlenmez) ve hata durum
  // cubuguna yazilir — tava/damper/arakat/esanjor dugmelerindeki desenin aynisi.
  var gruplar = santralGruplari();
  try {
    var klasorlu = gruplar.filter(function (g) { return g.ad; }).length > 1;
    gruplar.forEach(function (g) { turUret(g, exportedNames, klasorlu); });
    topluListeleriTemizle();
  } catch (err) {
    indirmeToplama = null;   // yarim kalan tur toplama modunu KAPATMALI
    indirmeKlasor = '';
    setStatus('Hata: ' + err.message +
      (exportedNames.length ? ' — üretilenler: ' + exportedNames.join(' | ') : ''));
    return;
  }

  var toplanan = indirmeToplama || [];
  indirmeToplama = null;
  // AYNI ADLI iki kayit ZIP icinde birbirini ezerdi (ornegin ayni ada sahip iki
  // santral, ya da tek santralde iki profil serisi). Ad tekrarlanirsa sonuna sira
  // numarasi eklenir — sessizce dosya kaybetmektense adi biraz uzun olsun.
  (function () {
    var gorulen = {};
    toplanan.forEach(function (x) {
      if (!gorulen[x.ad]) { gorulen[x.ad] = 1; return; }
      var k = ++gorulen[x.ad];
      var nokta = x.ad.lastIndexOf(String.fromCharCode(46));
      x.ad = nokta > 0 ? x.ad.slice(0, nokta) + ' (' + k + ')' + x.ad.slice(nokta)
                       : x.ad + ' (' + k + ')';
    });
  })();
  var tekIndir = function (x) {
    var ad = String(x.ad).split('/').pop();   // klasor oneki yalniz ZIP icinde anlamli
    indirmeSirala(URL.createObjectURL(new Blob([x.veri], { type: 'application/dxf' })), ad);
  };
  if (toplanan.length === 1) {
    // Tek dosyada ZIP yapilmaz — eski davranis birebir korunur.
    tekIndir(toplanan[0]);
  } else if (toplanan.length > 1) {
    try {
      // ZIP adi: tek santralde onun adi, cok santralde ORTAK ONEK (genelde is no).
      var adlar = gruplar.map(function (g) { return g.ad; }).filter(Boolean);
      var onek = adlar.length ? adlar.reduce(function (a, b) {
        var i = 0;
        while (i < a.length && i < b.length && a[i] === b[i]) i++;
        return a.slice(0, i);
      }) : projeAdiOku();
      onek = String(onek || '');
      // Ortak onek bir santralin TAM adi degilse (ör. '0469 — AHU-' yarim kalmis),
      // son ' — ' ayracindan kes: dosya adi '0469 — TÜM DXF.zip' olsun.
      if (adlar.length > 1 && adlar.indexOf(onek) < 0) {
        var kes = onek.lastIndexOf(' — ');
        if (kes > 0) onek = onek.slice(0, kes);
      }
      onek = onek.replace(/[\s—-]+$/, '');
      var zipAd = dosyaAdiTemizle((onek ? onek + ' — ' : '') + ZIP_DOSYA_EKI) + '.zip';
      indirmeSirala(URL.createObjectURL(zipYap(toplanan)), zipAd);
      setStatus('✓ Toplu DXF: ' + (adlar.length > 1 ? adlar.length + ' santral · ' : '')
        + toplanan.length + ' dosya TEK ZIP içinde indirildi — ' + zipAd
        + (adlar.length > 1 ? '  ·  her santral kendi klasöründe' : '')
        + '  ·  içindekiler: ' + toplanan.slice(0, 12).map(function (x) { return x.ad; }).join(' | ')
        + (toplanan.length > 12 ? ' … (+' + (toplanan.length - 12) + ')' : ''));
    } catch (zerr) {
      // ZIP kurulamazsa dosyalar TEK TEK iner: bir kismi tarayici sinirina takilabilir
      // ama hicbirinin inmemesinden iyidir — sebep de yazilir.
      toplanan.forEach(tekIndir);
      setStatus('⚠ ZIP kurulamadı (' + zerr.message + ') — ' + toplanan.length
        + ' dosya tek tek indiriliyor: ' + exportedNames.join(' | '));
    }
    return;
  }
  if (exportedNames.length > 0) {
    setStatus('✓ Toplu DXF tamamlandı: ' + exportedNames.join(' | '));
  } else {
    setStatus('Hata: Hiçbir DXF üretilemedi.');
  }
}

// ============================================================
// SAC NESTING — panelleri standart stok sac plakalarına optimum
// yerleştirme (BFDH-R) + kesim raporu (plaka sayısı, kg, fire%).
// Mevcut &quot;Toplu DXF Üret&quot; akışına dokunmaz, tamamen ek bir özellik.
// ============================================================

// Gerçek sac kalınlığı (mm) — &quot;kalinlik&quot; alanı burada profil serisi+malzeme
// kodudur (50/60/50P/60P), gerçek mm değeri değildir; bu yüzden ayrı saklanır.
var SAC_GAUGE_KEY = 'dxf_sac_kalinlik_mm';
var SAC_GAUGE_DEFAULT = 0.8;
// Aile bazli varsayilan sac kalinliklari (Cenk, 14.08.2026):
//   bogaz seti, damper, tava -> 1.0 mm | ara kat + TUM paneller -> 0.8 mm
//
// PANELLERDE TEK KALINLIK VAR. 50/60/50P/60P kodlari bir KALINLIK ayrimi degil, bir
// CIZIM ayrimidir (profil serisi + paslanmaz varyanti); ic ve dis sac dahil hepsi
// 0.8 mm'dir. Bu yuzden nesting tarafinda dordu birden tek 'PANEL' kodundan beslenir —
// dort ayri giris birakmak, ayni fiziksel saci dort yerden farkli girmeye davet ederdi.
// Cenk, 31.08.2026: DAMPER 1.5 mm galvaniz, TAVA 1 mm PASLANMAZ sacdan yapılır
// (tavanın malzemesi cihazın iç sacından bağımsızdır — bkz. nestMalzemeOf).
// EŞANJÖR bu turda nesting'e girdi: işaretli ölçüler (ESANJOR_15MM) 1.5 mm sacdan,
// geri kalanı ve düz parçalar eşanjörün kendi kalınlığından.
var SAC_GAUGE_VARSAYILAN = {
  'PANEL': 0.8, 'BOGAZ': 1.0, 'DAMPER': 1.5, 'TAVA': 1.0, 'ARAKAT': 0.8,
  'ESANJOR': 1.0, 'ESANJOR15': 1.5, 'KIZAK': 1.5
};
// Nesting'e giren tum kalinlik kodlari — modal girisleri ve yukleme/baglama burayi gezer.
var SAC_GAUGE_KODLAR = ['PANEL', 'BOGAZ', 'DAMPER', 'TAVA', 'ARAKAT', 'ESANJOR', 'ESANJOR15', 'KIZAK'];

// Bir parcanin KALINLIK kodu. Cizim modulu parcalari kendi aile kodunu tasir; kapak
// panelleri (kalinlik '50'/'60'/'50P'/'60P') tek 'PANEL' koduna duser.
function sacGaugeKoduOf(pc) {
  return pc.aile ? pc.kalinlik : 'PANEL';
}
function sacGaugeLoad() {
  try {
    var raw = localStorage.getItem(SAC_GAUGE_KEY);
    var obj = raw ? JSON.parse(raw) : {};
    return (obj && typeof obj === 'object') ? obj : {};
  } catch (e) { return {}; }
}
function sacGaugeSave(map) {
  try { localStorage.setItem(SAC_GAUGE_KEY, JSON.stringify(map)); } catch (e) {}
}
function sacGaugeVarsayilan(kod) {
  var v = SAC_GAUGE_VARSAYILAN[kod];
  return (v > 0) ? v : SAC_GAUGE_DEFAULT;
}
function sacGaugeFor(kod) {
  var m = sacGaugeLoad();
  var v = Number(m[kod]);
  return (v > 0) ? v : sacGaugeVarsayilan(kod);
}
function sacGaugeSet(kod, mm) {
  var m = sacGaugeLoad();
  m[kod] = Number(mm) || sacGaugeVarsayilan(kod);
  sacGaugeSave(m);
}
// NOT: eski `sacDensityFor(kod)` kaldirildi. Yogunluk artik kalinlik kodundan degil
// GRUP MALZEMESINDEN cozuluyor (`nestDensityOf`) — paslanmaz cihazin DIS saci galvaniz
// oldugu icin kodun 'P' ile bitmesi tek basina yogunlugu belirlemiyor.

// ---- Çizim modülü parçaları için ayak izi ölçümü ----
// Paneller için ayak izi FORMÜLLE veriliyor (nestFootprint) — o formüller draw50/draw60'ın
// kendi W/H hesaplarından birebir çıkarıldı ve doğrulandı. Boğaz/damper/tava/ara kat için
// aynısını elle yapmak formülün çizimden ayrı düşme riskini getirir; onun yerine parça bir
// kez ATILABILIR bir DxfWriter'a çizilip sınır kutusu ÖLÇÜLÜR. Böylece çizim değişirse
// ayak izi kendiliğinden takip eder. (Aynı numara perçin sayımında da kullanılıyor.)
//
// Yay için tam çember sınırı alınır (cx±r): açı aralığını çözmek yerine hafifçe GENİŞ
// ölçmek nesting'de güvenli taraftır — parça asla olduğundan küçük görünmez.
function olcuAyakIzi(cizFn) {
  var scratch = new DxfWriter();
  cizFn(scratch);
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  function nokta(x, y) {
    if (!isFinite(x) || !isFinite(y)) return;
    if (x < minX) minX = x;
    if (x > maxX) maxX = x;
    if (y < minY) minY = y;
    if (y > maxY) maxY = y;
  }
  scratch.entities.forEach(function (e) {
    if (e.type === 'LINE') { nokta(e.x1, e.y1); nokta(e.x2, e.y2); }
    else if (e.type === 'CIRCLE' || e.type === 'ARC') {
      nokta(e.cx - e.r, e.cy - e.r); nokta(e.cx + e.r, e.cy + e.r);
    } else if (e.type === 'SPLINE') {
      (e.controlPoints || []).forEach(function (p) { nokta(p[0], p[1]); });
    } else if (e.type === 'TEXT') { nokta(e.x, e.y); }
  });
  if (!isFinite(minX)) return { x: 0, y: 0, w: 0, h: 0 };
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

// 90° döndürerek çizen writer proxy'si (DxfWriter/SvgWriter arayüzünü taklit eder).
// PANELLERDE gerek yok: onlar B/K parametriktir, döndürmek = ölçüleri takas etmek.
// Çizim modülü parçalarında bu GEÇERSİZ — tavanın üst/alt büküm payı farklı, damper
// parçası tek eksende esniyor. Bu yüzden koordinatlar gerçekten döndürülür.
//   yerel (x,y) ∈ [0,w]×[0,h]  →  (h − y, x) ∈ [0,h]×[0,w]
// Yaylar CCW olduğu için başlangıç/bitiş açılarına +90 eklenir, sıra korunur.
function RotWriter(hedef, ox, oy, h) {
  this.t = hedef; this.ox = ox; this.oy = oy; this.h = h;
}
RotWriter.prototype._x = function (x, y) { return this.ox + (this.h - y); };
RotWriter.prototype._y = function (x, y) { return this.oy + x; };
RotWriter.prototype.addLine = function (x1, y1, x2, y2, layer) {
  this.t.addLine(this._x(x1, y1), this._y(x1, y1), this._x(x2, y2), this._y(x2, y2), layer);
};
RotWriter.prototype.addCircle = function (cx, cy, r, layer) {
  this.t.addCircle(this._x(cx, cy), this._y(cx, cy), r, layer);
};
RotWriter.prototype.addArc = function (cx, cy, r, sa, ea, layer) {
  this.t.addArc(this._x(cx, cy), this._y(cx, cy), r, sa + 90, ea + 90, layer);
};
RotWriter.prototype.addText = function (x, y, hgt, text, layer, rot, hA, vA) {
  this.t.addText(this._x(x, y), this._y(x, y), hgt, text, layer, (rot || 0) + 90, hA, vA);
};
RotWriter.prototype.addSpline = function (cps, knots, degree, flags, layer) {
  var self = this;
  this.t.addSpline((cps || []).map(function (p) { return [self._x(p[0], p[1]), self._y(p[0], p[1])]; }),
    knots, degree, flags, layer);
};

// Panel ailesi + tip + taraf (DIS/IC) -&gt; gerçek dış hat ölçüsü (mm). Bu formüller
// draw50/draw60'ın kendi W/H hesaplarından birebir alınmıştır (drawDisSabit/drawIcSabit/
// drawDisAcilir/drawIcAcilir/drawBogazDis/drawUst — 50'lik; drawDis60/drawIc60/
// drawDisAcilir60/drawIcAcilir60/drawBogazDis60/drawUst60 — 60'lık; hepsi doğrulandı).
function nestFootprint(kalinlikBase, tip, side) {
  if (tip === 'UST') return { w: function (B) { return B + 31; }, h: function (B, K) { return K + 31; } };
  if (kalinlikBase === '50') {
    if (side === 'DIS') return { w: function (B) { return B + 98; }, h: function (B, K) { return K + 98; } };
    if (tip === 'ACILIR') return { w: function (B) { return B + 29; }, h: function (B, K) { return K + 29; } };
    return { w: function (B) { return B + 31; }, h: function (B, K) { return K + 31; } }; // SABIT/BOGAZ IC
  }
  // 60'lık
  if (side === 'DIS') return { w: function (B) { return B + 125; }, h: function (B, K) { return K + 125; } };
  if (tip === 'ACILIR') return { w: function (B) { return B + 29; }, h: function (B, K) { return K + 29; } };
  return { w: function (B) { return B + 31; }, h: function (B, K) { return K + 31; } }; // SABIT/BOGAZ IC
}

// panelList: {kalinlik, tip, B, K, cam, bogazTip, kod, adet} dizisi (bir grup, adet&gt;1 olabilir).
// Her panelObj'u adet kadar, bağımsız DIS+IC (veya UST için sadece IC) parça tanımına ayrıştırır —
// dış/iç artık &quot;çift&quot; olarak taşınmaz, nesting'de tam bağımsız dikdörtgen olarak yerleştirilir.
function buildNestPieces(panelList) {
  var pieces = [];
  var pid = 0;
  panelList.forEach(function (p) {
    var kalinlikBase = String(p.kalinlik).replace('P', '');
    var isPas = String(p.kalinlik).slice(-1) === 'P';
    var adet = Math.max(1, Number(p.adet) || 1);
    for (var a = 0; a < adet; a++) {
      var percinN = null, percinOffsets = null;
      if (!isPas && kalinlikBase === '50' && (p.tip === 'SABIT' || p.tip === 'BOGAZ')) {
        // DIŞ panelin gerçek çizimi perçin sayısını belirliyor (vida çakışması) — atılabilir
        // bir DxfWriter'a karşı bir kez çağırıp sadece sayıyı yakalıyoruz (konum önemsiz).
        var scratch = new DxfWriter();
        if (p.tip === 'SABIT') percinN = drawDisSabit(scratch, 0, 0, p.B, p.K, p.kod);
        else percinN = drawBogazDis(scratch, 0, 0, p.B, p.K, p.bogazTip || 'N', p.kod);
      } else if (isPas && (p.tip === 'SABIT' || p.tip === 'BOGAZ')) {
        percinOffsets = (p.tip === 'SABIT')
          ? computePasPercinOffsets(p.B, p.K, kalinlikBase)
          : computePasPercinOffsets(p.B, p.K, kalinlikBase, 'BOGAZ', p.bogazTip || 'N');
      }

      var sides = (p.tip === 'UST') ? ['IC'] : ['DIS', 'IC'];
      sides.forEach(function (side) {
        var fp = nestFootprint(kalinlikBase, p.tip, side);
        pieces.push({
          id: 'p' + (pid++),
          kod: p.kod, tip: p.tip, side: side,
          kalinlik: p.kalinlik, kalinlikBase: kalinlikBase, isPas: isPas,
          B: p.B, K: p.K, cam: p.cam, bogazTip: p.bogazTip, delik: p.delik || null,
          w: fp.w(p.B, p.K), h: fp.h(p.B, p.K),
          percinN: percinN, percinOffsets: percinOffsets
        });
      });
    }
  });
  return pieces;
}

// ---- Çizim modülü parçaları (boğaz / damper / tava / ara kat) ----
// Her parça KENDİ çizim fonksiyonunu bir closure'da taşır (`ciz`), ayak izi de o
// fonksiyondan ÖLÇÜLÜR. Böylece nesting hiçbir geometri formülünü kopyalamaz —
// tek doğruluk kaynağı çizim kodudur.
//
// ÖNEMLİ: burada üretilenler TEK TEK KESİLEN parçalardır, DXF dosyasındaki hazır
// dizilim grupları değil. Bir damper takımı 2 yatay + 2 dikey parçadır ve nesting
// dördünü de bağımsız yerleştirir; boğaz seti 2 YBP + 2-3 DBP parçasıdır.
function nestParca(pid, aile, kalinlikKod, etiket, cizFn) {
  var fp = olcuAyakIzi(cizFn);
  return {
    id: aile.toLowerCase() + pid,
    aile: aile, kod: etiket, tip: aile, side: null,
    kalinlik: kalinlikKod, kalinlikBase: kalinlikKod, isPas: false,
    w: fp.w, h: fp.h,
    // Parça yerel (0,0)'dan çizilsin diye ölçülen sol-alt köşe geri alınır.
    ciz: function (writer, ox, oy) { cizFn(new OfsWriter(writer, ox - fp.x, oy - fp.y)); }
  };
}

// Basit öteleme proxy'si — ölçülen sınır kutusunun orijine çekilmesi için.
function OfsWriter(hedef, dx, dy) { this.t = hedef; this.dx = dx; this.dy = dy; }
OfsWriter.prototype.addLine = function (x1, y1, x2, y2, l) { this.t.addLine(x1 + this.dx, y1 + this.dy, x2 + this.dx, y2 + this.dy, l); };
OfsWriter.prototype.addCircle = function (cx, cy, r, l) { this.t.addCircle(cx + this.dx, cy + this.dy, r, l); };
OfsWriter.prototype.addArc = function (cx, cy, r, sa, ea, l) { this.t.addArc(cx + this.dx, cy + this.dy, r, sa, ea, l); };
OfsWriter.prototype.addText = function (x, y, h, t, l, r, hA, vA) { this.t.addText(x + this.dx, y + this.dy, h, t, l, r, hA, vA); };
OfsWriter.prototype.addSpline = function (cps, k, d, f, l) {
  var s = this;
  this.t.addSpline((cps || []).map(function (p) { return [p[0] + s.dx, p[1] + s.dy]; }), k, d, f, l);
};

function buildModulNestPieces() {
  var pieces = [];
  var pid = 0;

  // BOĞAZ SETİ — 2 YBP (yatay) + 2 DBP (dikey); YBP >= 1950 ise 3. DBP eklenir.
  // Saca sigmayan genis bogaz IKI takima bolunur — parca sayisi da o kadar artar.
  bogazList.forEach(function (b) {
    var bl = bogazTakimlari(b.ybp);
    var ybp = bl.ybp, dbp = Number(b.dbp) || 0;
    var dbpAdet = (ybp >= 1950) ? 3 : 2;
    for (var a = 0; a < (Number(b.adet) || 1) * bl.takim; a++) {
      for (var i = 0; i < 2; i++) {
        pieces.push(nestParca(pid++, 'BOGAZ', 'BOGAZ', 'BOĞAZ YBP ' + ybp,
          function (w) { drawBogazYBP(w, 0, 0, ybp); }));
      }
      for (var j = 0; j < dbpAdet; j++) {
        pieces.push(nestParca(pid++, 'BOGAZ', 'BOGAZ', 'BOĞAZ DBP ' + dbp,
          function (w) { drawBogazDBP(w, 0, 0, dbp); }));
      }
    }
  });

  // DAMPER — takım başına 2 yatay + 2 dikey parça. Bölünmüş damperde takım 2 olur.
  damperList.forEach(function (d) {
    var genislik = Number(d.genislik) || 0, yukseklik = Number(d.yukseklik) || 0;
    var hes = damperHesap(genislik);
    var dUzun = hes.kenar - DAMPER_UZUN_REF_KENAR;
    var dKisa = (yukseklik + DAMPER_KISA_EK) - DAMPER_KISA_REF_KENAR;
    for (var a = 0; a < (Number(d.adet) || 1); a++) {
      for (var t = 0; t < hes.takim; t++) {
        for (var i = 0; i < 2; i++) {
          pieces.push(nestParca(pid++, 'DAMPER', 'DAMPER', 'DAMPER YATAY ' + Math.round(hes.kenar),
            function (w) { drawDamperParca(w, DAMPER_UZUN_GEOM, 0, 0, dUzun, DAMPER_UZUN_X_BOL, 'x'); }));
          pieces.push(nestParca(pid++, 'DAMPER', 'DAMPER', 'DAMPER DİKEY ' + Math.round(yukseklik),
            function (w) { drawDamperParca(w, DAMPER_KISA_GEOM, 0, 0, dKisa, DAMPER_KISA_Y_BOL, 'y'); }));
        }
      }
    }
  });

  // TAVA — kayıt başına tek açılım parçası.
  tavaList.forEach(function (t) {
    var alt = TAVA_ALT[t.cihaz] || TAVA_ALT['60'];
    var W = (Number(t.genislik) || 0) - TAVA_PAY;
    var H = (Number(t.yukseklik) || 0) - TAVA_PAY;
    for (var a = 0; a < (Number(t.adet) || 1); a++) {
      // drawTava gövde köşesinden çizer, büküm payları eksiye taşar — OfsWriter
      // ölçülen sınır kutusunu zaten orijine çektiği için 0,0 vermek yeterli.
      pieces.push(nestParca(pid++, 'TAVA', 'TAVA', 'TAVA ' + t.cihaz + ' ' + Math.round(W) + 'x' + Math.round(H),
        function (w) { drawTava(w, 0, 0, W, H, alt); }));
    }
  });

  // ARA KAT — kayıt başına DIŞ + İÇ parça (DXF'te yan yana çizilirler, kesimde ayrıdır).
  arakatList.forEach(function (ak) {
    var t = ARAKAT_TYPES[ak.tip];
    if (!t) return;
    var B = Number(ak.B) || 0, K = Number(ak.K) || 0;
    for (var a = 0; a < (Number(ak.adet) || 1); a++) {
      pieces.push(nestParca(pid++, 'ARAKAT', 'ARAKAT', 'ARA KAT DIŞ ' + B + 'x' + K,
        function (w) { drawArakatPiece(w, 0, 0, B, K, 1, t.dis, t.dis - 15, t.dis + 100); }));
      pieces.push(nestParca(pid++, 'ARAKAT', 'ARAKAT', 'ARA KAT İÇ ' + B + 'x' + K,
        function (w) { drawArakatPiece(w, 0, 0, B, K, 4, t.ic, 15, t.ic + 98.5); }));
    }
  });

  // EŞANJÖR — kayıt başına 4 eşanjör sacı (O1..O4) + 4 düz parça. İşaretli ölçüler
  // 1.5 mm sacdan çıkar (DXF'te de ayrı dosyaya gider), geri kalanı ve düz parçalar
  // eşanjörün kendi kalınlığından. Ayak izi burada da ÖLÇÜLÜR — tek doğruluk kaynağı
  // çizim kodudur. Modül başına en fazla bir eşanjör vardır, kayıtta adet yoktur.
  esanjorList.forEach(function (e) {
    var Os = [e.O1, e.O2, e.O3, e.O4];
    var bayrak = [!!e.o1_15, !!e.o2_15, !!e.o3_15, !!e.o4_15];
    Os.forEach(function (O, i) {
      if (!(Number(O) > 0)) return;
      pieces.push(nestParca(pid++, 'ESANJOR', bayrak[i] ? 'ESANJOR15' : 'ESANJOR',
        'EŞANJÖR O' + (i + 1) + ' ' + O,
        function (w) { drawEsanjorSac(w, 0, 0, e.kalinlik, e.CI, O, e.kod); }));
    });
    for (var j = 0; j < 4; j++) {
      pieces.push(nestParca(pid++, 'ESANJOR', 'ESANJOR', 'EŞANJÖR DÜZ ' + e.CI,
        function (w) { drawEsanjorDuz(w, 0, 0, e.kalinlik, e.CI, e.kod); }));
    }
  });

  // BATARYA KIZAĞI — takım başına ALT L + OMEGA + ÜST L, her birinden kayıttaki adet
  // kadar. Ayak izi burada da ÖLÇÜLÜR (olcuAyakIzi), formülle verilmez: geometri
  // gömülü tablodan esnetilerek çıkıyor, tek doğruluk kaynağı çizim kodudur.
  //
  // DÖNDÜRME: kızak parçaları uzun ve ince; nesting bunları döndürebilmeli. Parça
  // ÇİZİMİ kendi geometrisinden gelir (drawKizakParca), o yüzden döndürme RotWriter
  // üzerinden GERÇEK geometrik döndürmedir — B/K takası DEĞİL.
  kizakList.forEach(function (k) {
    var adet = Number(k.adet) || 1;
    kizakParcalari(k).forEach(function (pc) {
      for (var a = 0; a < adet; a++) {
        pieces.push(nestParca(pid++, 'KIZAK', 'KIZAK',
          'KIZAK ' + pc.ad + ' ' + k.boy,
          function (w) { drawKizakParca(w, 0, 0, pc.g); }));
      }
    });
  });

  return pieces;
}

// Bir parçanın MALZEMESİ — sac grubunun ikinci anahtarı. Kalınlık aynı olsa bile
// galvaniz ile paslanmaz aynı sacdan kesilemez, o yüzden kalınlık tek başına yetmez.
//
// PASLANMAZ CİHAZDA YALNIZCA İÇ SAC PASLANMAZDIR, DIŞ SAC GALVANİZDİR (Cenk, 14.08.2026).
// Dosya adları da bunu söylüyor: '… DIŞ.dxf' + '… İÇ PASLANMAZ.dxf'. Bu yüzden paslanmaz
// bir panelin DIŞ parçası nesting'de GALVANİZ havuzuna katılır — aynı kalınlıktaki diğer
// galvaniz parçalarla (panel, boğaz, damper, tava, ara kat) aynı saca yerleşir ve ağırlığı
// 7.85 yoğunlukla hesaplanır.
//
// BU YALNIZCA NESTING GRUPLAMASIDIR. Parçanın ÇİZİMİ değişmez: `pc.isPas` bayrağı
// olduğu gibi durur, drawNestPiece hâlâ paslanmaz çizim yolunu (drawDisSabitPas vb.)
// kullanır ve DXF dosya üretimi/adlandırması hiç etkilenmez.
function nestMalzemeOf(pc) {
  // TAVA paslanmaz 1 mm sacdan yapılır (Cenk, 31.08.2026) — cihazın iç sacı galvaniz
  // olsa bile. Bu YALNIZCA nesting gruplamasıdır: parçanın çizimi, DXF'i ve dosya adı
  // değişmez, yalnız hangi plakaya yerleşeceği ve yoğunluğu (7.93) değişir.
  if (pc.aile === 'TAVA') return 'PAS';
  if (!pc.isPas) return 'GALV';
  return pc.side === 'DIS' ? 'GALV' : 'PAS';
}
var NEST_MALZEME_ETIKET = { 'GALV': 'Galvaniz', 'PAS': 'Paslanmaz' };

// Parçaları sac gruplarına ayırır. ANAHTAR = SAC KALINLIĞI (+ malzeme).
// Kategori (panel / boğaz / damper / tava / ara kat) veya profil serisi (50 / 60)
// gruplamaya GİRMEZ: aynı kalınlıktaki her parça aynı saca yerleşebilir — fire'ı
// düşüren asıl şey bu. 14.08.2026'da Cenk'in kararı; öncesinde her kategori kendi
// sacına gidiyordu.
function groupNestPieces(allPieces) {
  var byKey = {};
  allPieces.forEach(function (pc) {
    var mal = nestMalzemeOf(pc);
    var gauge = sacGaugeFor(sacGaugeKoduOf(pc));
    var key = mal + '|' + gauge;
    if (!byKey[key]) byKey[key] = { malzeme: mal, gauge: gauge, pieces: [] };
    byKey[key].pieces.push(pc);
  });
  // Kalın sac önce, sonra malzeme adı — liste her hesapta aynı sırada çıksın
  return Object.keys(byKey).sort(function (a, b) {
    var A = byKey[a], B = byKey[b];
    return (B.gauge - A.gauge) || A.malzeme.localeCompare(B.malzeme, 'tr');
  }).map(function (key) {
    var g = byKey[key];
    // Grupta hangi aileler var — etikette gösterilir ki kullanıcı ne karıştığını görsün.
    // Paslanmaz panellerde taraf da yazılır: DIŞ parça galvaniz havuzunda, İÇ paslanmazda
    // durur; etikette ayrılmazsa aynı ad iki farklı grupta görünür ve kafa karıştırır.
    var aileler = [];
    g.pieces.forEach(function (pc) {
      var ad = kalinlikLabel(pc.kalinlik);
      if (pc.isPas) ad += (pc.side === 'DIS' ? ' DIŞ' : ' İÇ');
      if (aileler.indexOf(ad) < 0) aileler.push(ad);
    });
    return {
      label: g.gauge + ' mm ' + NEST_MALZEME_ETIKET[g.malzeme] + ' — ' + aileler.join(' + '),
      kalinlik: key, gaugeMm: g.gauge, malzeme: g.malzeme, pieces: g.pieces
    };
  });
}

// MaxRects (maksimal boş dikdörtgen izleme, Best-Short-Side-Fit skoru + döndürme): şerit/raf
// bazlı paketlemenin aksine, bir parçanın ALTINDA/YANINDA kalan boş alan sonraki HERHANGİ bir
// parça için tekrar aday olur (raf'ta olduğu gibi &quot;bu rafın yüksekliğinde kilitli&quot; kalmaz) —
// bu yüzden fire belirgin şekilde daha az. Parçalar büyükten küçüğe sıralanır; her parça için
// TÜM boş dikdörtgenler + hem düz hem 90° döndürülmüş hali denenir, en dar artık kısa kenarı
// bırakan (best-fit) yerleşim seçilir. Yerleştirilen her parça (+ sağına/üstüne bir `gap` payı)
// kesiştiği TÜM boş dikdörtgenleri böler; birbirini tamamen içeren boş dikdörtgenler budanır.
// Saf fonksiyon — DOM/DXF'ten bağımsız, sentetik {w,h} dizileriyle test edilir.
function nestPieces(pieceList, sheetW, sheetH, gap) {
  var EPS = 1e-6;
  var ordered = pieceList.slice().sort(function (a, b) {
    var am = Math.max(a.w, a.h), bm = Math.max(b.w, b.h);
    if (Math.abs(am - bm) > EPS) return bm - am;
    return Math.min(b.w, b.h) - Math.min(a.w, a.h);
  });

  function rectsIntersect(a, b) {
    return a.x < b.x + b.w - EPS && a.x + a.w > b.x + EPS && a.y < b.y + b.h - EPS && a.y + a.h > b.y + EPS;
  }

  // fr'nin used (parça + sağ/üst gap payı) ile kesişmeyen kalan parçalarını üretir (sol/sağ/alt/üst).
  function splitFreeRect(fr, used) {
    var out = [];
    if (used.x > fr.x + EPS) out.push({ x: fr.x, y: fr.y, w: used.x - fr.x, h: fr.h });
    var usedRight = used.x + used.w;
    if (usedRight < fr.x + fr.w - EPS) out.push({ x: usedRight, y: fr.y, w: (fr.x + fr.w) - usedRight, h: fr.h });
    if (used.y > fr.y + EPS) out.push({ x: fr.x, y: fr.y, w: fr.w, h: used.y - fr.y });
    var usedTop = used.y + used.h;
    if (usedTop < fr.y + fr.h - EPS) out.push({ x: fr.x, y: usedTop, w: fr.w, h: (fr.y + fr.h) - usedTop });
    return out.filter(function (r) { return r.w > EPS && r.h > EPS; });
  }

  // Başka bir boş dikdörtgenin içinde tamamen kalan (artık gereksiz) dikdörtgenleri eler.
  function pruneContained(rects) {
    var keep = [];
    for (var i = 0; i < rects.length; i++) {
      var a = rects[i], contained = false;
      for (var j = 0; j < rects.length; j++) {
        if (i === j) continue;
        var b = rects[j];
        var inside = a.x >= b.x - EPS && a.y >= b.y - EPS && a.x + a.w <= b.x + b.w + EPS && a.y + a.h <= b.y + b.h + EPS;
        if (!inside) continue;
        var identical = Math.abs(a.x - b.x) < EPS && Math.abs(a.y - b.y) < EPS && Math.abs(a.w - b.w) < EPS && Math.abs(a.h - b.h) < EPS;
        if (identical && i < j) continue; // birebir eşse tekini (küçük index) tut
        contained = true; break;
      }
      if (!contained) keep.push(a);
    }
    return keep;
  }

  function tryPlaceOnSheet(piece, sheet, sw, sh) {
    var best = null;
    sheet.freeRects.forEach(function (fr) {
      [[piece.w, piece.h, false], [piece.h, piece.w, true]].forEach(function (o) {
        var pw = o[0], ph = o[1], rotated = o[2];
        if (pw <= fr.w + EPS && ph <= fr.h + EPS) {
          var leftoverX = fr.w - pw, leftoverY = fr.h - ph;
          var shortFit = Math.min(leftoverX, leftoverY), longFit = Math.max(leftoverX, leftoverY);
          if (!best || shortFit < best.shortFit - EPS || (Math.abs(shortFit - best.shortFit) <= EPS && longFit < best.longFit)) {
            best = { x: fr.x, y: fr.y, pw: pw, ph: ph, rotated: rotated, shortFit: shortFit, longFit: longFit };
          }
        }
      });
    });
    if (!best) return null; // parça bu sacın hiçbir boş alanına, hiçbir yönde sığmıyor
    var placement = { piece: piece, x: best.x, y: best.y, w: best.pw, h: best.ph, rotated: best.rotated };
    var usedWithGap = { x: best.x, y: best.y, w: Math.min(best.pw + gap, sw - best.x), h: Math.min(best.ph + gap, sh - best.y) };
    var newFree = [];
    sheet.freeRects.forEach(function (fr) {
      if (rectsIntersect(fr, usedWithGap)) newFree = newFree.concat(splitFreeRect(fr, usedWithGap));
      else newFree.push(fr);
    });
    sheet.freeRects = pruneContained(newFree);
    sheet.placements.push(placement);
    return placement;
  }

  function runPack(sw, sh) {
    // Sac kenarından da parçalar-arası ile AYNI payı bırak (kenara yapışık kesim yok) — başlangıç
    // boş dikdörtgeni tüm sacı değil, her yönden `gap` içeri girinti yapılmış alanı kapsar.
    function newSheet() { return { freeRects: [{ x: gap, y: gap, w: Math.max(sw - 2 * gap, 0), h: Math.max(sh - 2 * gap, 0) }], placements: [] }; }
    var sheets = [newSheet()];
    for (var i = 0; i < ordered.length; i++) {
      var piece = ordered[i];
      var placed = null;
      for (var s = 0; s < sheets.length && !placed; s++) placed = tryPlaceOnSheet(piece, sheets[s], sw, sh);
      if (!placed) {
        var ns = newSheet();
        sheets.push(ns);
        placed = tryPlaceOnSheet(piece, ns, sw, sh);
        if (!placed) throw new Error('Parça sac ölçüsüne hiçbir yönde sığmıyor: ' + (piece.kod || piece.id || '?') + ' (' + piece.w + '×' + piece.h + ' mm)');
      }
    }
    return sheets;
  }

  function fillRatio(sheets, sw, sh) {
    var used = 0;
    sheets.forEach(function (s) { s.placements.forEach(function (p) { used += p.w * p.h; }); });
    return used / (sheets.length * sw * sh);
  }

  // İki olası sac ekseninde bir kez daha çalıştır, daha az plaka kullananı (eşitlikte
  // daha iyi doluluk oranını) tut — arbitrary &quot;hangi yön raf ekseni&quot; kararını ortadan kaldırır.
  var runA = runPack(sheetW, sheetH);
  var chosen = runA, chosenW = sheetW, chosenH = sheetH;
  if (sheetW !== sheetH) {
    var runB = runPack(sheetH, sheetW);
    if (runB.length < runA.length || (runB.length === runA.length && fillRatio(runB, sheetH, sheetW) > fillRatio(runA, sheetW, sheetH))) {
      chosen = runB; chosenW = sheetH; chosenH = sheetW;
    }
  }
  return { sheets: chosen, sheetW: chosenW, sheetH: chosenH, gap: gap };
}

// Bir yerleşimi (placement: {piece, x, y, w, h, rotated}) sac koordinatlarında GERÇEK panel
// çizim fonksiyonuna yönlendirir. writer bir DxfWriter (gerçek indirme) VEYA SvgWriter (ekran
// önizleme) olabilir — bu uygulamadaki her çizim fonksiyonu ikisine karşı da çalışır (bkz.
// nestSvgPreviewForSheet'teki mevcut kalıp). 90° döndürme koordinat dönüşümü GEREKTİRMEZ: aynı
// fonksiyon B/K yer değiştirilmiş çağrılır (her panel 4 köşede simetrik bükümlüdür).
function drawNestPiece(writer, placement) {
  var p = placement.piece;

  // Çizim modülü parçaları kendi çizim fonksiyonlarını taşır. Döndürme burada
  // GERÇEK geometrik döndürmedir (RotWriter) — panellerdeki gibi ölçü takası DEĞİL:
  // tavanın üst/alt büküm payı farklı, damper parçası tek eksende esniyor.
  if (p.ciz) {
    if (placement.rotated) p.ciz(new RotWriter(writer, placement.x, placement.y, p.h), 0, 0);
    else p.ciz(writer, placement.x, placement.y);
    return;
  }

  var B = placement.rotated ? p.K : p.B;
  var K = placement.rotated ? p.B : p.K;
  var is60 = p.kalinlikBase === '60';
  var off = is60 ? (p.side === 'DIS' ? 62.5 : 36) : 0;
  var ox = placement.x + off, oy = placement.y + off;
  var kod = p.kod, bt = p.bogazTip || 'N', cam = p.cam || 'H';

  // PANELE MONTE AGIZ: parca 90 dondurulduyse delik de doner (rijit hareket).
  // Kesim dikdortgeni [0,B]x[0,K] iken CCW donusum (x,y) -> (K - y, x) verir.
  var dlk = null;
  if (p.delik && p.delik.w > 0 && p.delik.h > 0) {
    dlk = placement.rotated
      ? { w: p.delik.h, h: p.delik.w, x: p.K - p.delik.y - p.delik.h, y: p.delik.x }
      : { w: p.delik.w, h: p.delik.h, x: p.delik.x, y: p.delik.y };
  }

  if (!is60) {
    if (p.side === 'DIS') {
      if (p.tip === 'SABIT') {
        if (p.isPas) drawDisSabitPas(writer, ox, oy, B, K, kod, p.percinOffsets); else drawDisSabit(writer, ox, oy, B, K, kod);
        if (dlk) drawPanelDelik(writer, ox, oy, B, K, dlk, function (wr) {
          if (p.isPas) drawDisSabitPas(wr, 0, 0, B, K, kod, p.percinOffsets); else drawDisSabit(wr, 0, 0, B, K, kod); });
      }
      else if (p.tip === 'ACILIR') drawDisAcilir(writer, ox, oy, B, K, cam, kod);
      else if (p.tip === 'BOGAZ') { if (p.isPas) drawBogazDisPas(writer, ox, oy, B, K, bt, kod, p.percinOffsets); else drawBogazDis(writer, ox, oy, B, K, bt, kod); }
    } else {
      if (p.tip === 'SABIT') {
        if (p.isPas) drawIcSabitPas(writer, ox, oy, B, K, kod, p.percinOffsets); else drawIcSabit(writer, ox, oy, B, K, kod, p.percinN);
        if (dlk) drawPanelDelik(writer, ox, oy, B, K, dlk, function (wr) {
          if (p.isPas) drawIcSabitPas(wr, 0, 0, B, K, kod, p.percinOffsets); else drawIcSabit(wr, 0, 0, B, K, kod, p.percinN); });
      }
      else if (p.tip === 'ACILIR') drawIcAcilir(writer, ox, oy, B, K, cam, kod);
      else if (p.tip === 'BOGAZ') { if (p.isPas) drawIcBogazPas(writer, ox, oy, B, K, bt, kod, p.percinOffsets); else drawIcSabit(writer, ox, oy, B, K, kod, p.percinN); }
      else if (p.tip === 'UST') drawUst(writer, ox, oy, B, K, kod);
    }
  } else {
    if (p.side === 'DIS') {
      if (p.tip === 'SABIT') {
        if (p.isPas) drawDis60Pas(writer, ox, oy, B, K, kod, p.percinOffsets); else drawDis60(writer, ox, oy, B, K, kod, '0');
        if (dlk) drawPanelDelik(writer, ox, oy, B, K, dlk, function (wr) {
          if (p.isPas) drawDis60Pas(wr, 0, 0, B, K, kod, p.percinOffsets); else drawDis60(wr, 0, 0, B, K, kod, '0'); });
      }
      else if (p.tip === 'ACILIR') drawDisAcilir60(writer, ox, oy, B, K, kod, '0');
      else if (p.tip === 'BOGAZ') { if (p.isPas) drawBogazDis60Pas(writer, ox, oy, B, K, bt, kod, p.percinOffsets); else drawBogazDis60(writer, ox, oy, B, K, bt, kod, '0'); }
    } else {
      if (p.tip === 'SABIT') {
        if (p.isPas) drawIc60Pas(writer, ox, oy, B, K, kod, p.percinOffsets); else drawIc60(writer, ox, oy, B, K, kod, '0');
        if (dlk) drawPanelDelik(writer, ox, oy, B, K, dlk, function (wr) {
          if (p.isPas) drawIc60Pas(wr, 0, 0, B, K, kod, p.percinOffsets); else drawIc60(wr, 0, 0, B, K, kod, '0'); });
      }
      else if (p.tip === 'ACILIR') drawIcAcilir60(writer, ox, oy, B, K, kod, '0');
      else if (p.tip === 'BOGAZ') { if (p.isPas) drawIc60BogazPas(writer, ox, oy, B, K, bt, kod, p.percinOffsets); else drawIc60(writer, ox, oy, B, K, kod, '0'); }
      else if (p.tip === 'UST') drawUst60(writer, ox, oy, B, K, kod, '0');
    }
  }

  // Panelin gerçek sac-üzerindeki yerleşim dikdörtgeni (placement) kullanılır, böylece
  // döndürülmüş parçalarda da doğru ortalanır ve sac üzerinde her zaman dik durur.
  addBigKodLabel(writer, placement.x, placement.y, placement.w, placement.h, kod, p.tip === 'ACILIR' && cam === 'E');
}

// Bir sac plakasının tamamını (sınır dikdörtgeni + üzerindeki tüm parçalar) writer'a çizer.
// yOffset (opsiyonel) — birleşik çok-sac dosyasında her sac'ı dikey kaydırmak için.
function renderNestSheetToWriter(writer, sheet, sheetW, sheetH, yOffset) {
  var yOff = yOffset || 0;
  var lb = 'SAC_SINIRI';
  writer.addLine(0, yOff, sheetW, yOff, lb);
  writer.addLine(sheetW, yOff, sheetW, yOff + sheetH, lb);
  writer.addLine(sheetW, yOff + sheetH, 0, yOff + sheetH, lb);
  writer.addLine(0, yOff + sheetH, 0, yOff, lb);
  sheet.placements.forEach(function (pl) {
    drawNestPiece(writer, { piece: pl.piece, x: pl.x, y: pl.y + yOff, w: pl.w, h: pl.h, rotated: pl.rotated });
  });
}

// Blob→createObjectURL→gizli &lt;a&gt;→click→revoke — mevcut generateAndDownloadDxf'in _dl'siyle birebir aynı desen.
function nestDownloadDxf(dxfWriter, filename) {
  dxfIndir(dxfWriter, filename);
}

// Bir nest-grubunun TÜM sac'larını dikey sabit boşlukla art arda TEK bir DxfWriter'a çizer
// (her sac kendi &quot;SAC n/m&quot; etiketiyle) — birincil indirme, operatör tek dosya açar.
var NEST_SHEET_SEP = 200; // sac'lar arası dikey ayraç (mm), sadece birleşik dosyada
function renderNestGroupCombined(nestResult) {
  var dxf = new DxfWriter();
  nestResult.sheets.forEach(function (sheet, i) {
    var yOff = i * (nestResult.sheetH + NEST_SHEET_SEP);
    renderNestSheetToWriter(dxf, sheet, nestResult.sheetW, nestResult.sheetH, yOff);
    dxf.addText(10, yOff - 40, 45, 'SAC ' + (i + 1) + '/' + nestResult.sheets.length, 'SAC_ETIKET');
  });
  return dxf;
}

// Tek bir sac'ı (birleşik dosyadan bağımsız) kendi DxfWriter'ına çizer — sac-başına ayrı indirme için.
function renderSingleNestSheetDxf(sheet, sheetW, sheetH) {
  var dxf = new DxfWriter();
  renderNestSheetToWriter(dxf, sheet, sheetW, sheetH, 0);
  return dxf;
}

// Bir nest-grubunun kesim raporu: plaka sayısı, gerçek sac kalınlığı/yoğunluğu, kg, fire%.
// Fire hesabında payda KULLANILAN TÜM sac alanı (yarı-dolu son sac dahil) — parçaların
// bounding-box'ı değil; pay her parçanın GERÇEK dış hat alanı (nominal B×K değil).
// Grup anahtarı ('GALV|1') dosya adına giremez — '|' dosya sisteminde yasaklı.
// Dosya adı için kısa, güvenli bir ad üretilir: '1mm_GALV', '0.8mm_PAS-IC' …
function nestGrupSlug(g) {
  return String(g.gaugeMm).replace('.', ',') + 'mm_' + g.malzeme;
}

// Grup malzemesinin yoğunluğu (kg/dm3). Paslanmaz (304) ~7.93, galvaniz/normal ~7.85.
function nestDensityOf(malzeme) {
  return String(malzeme).indexOf('PAS') === 0 ? 7.93 : 7.85;
}

function computeNestReport(nestResult, gaugeMm, density, etiket) {
  var sheetCount = nestResult.sheets.length;
  var totalSheetArea = sheetCount * nestResult.sheetW * nestResult.sheetH; // mm²
  var totalPartsArea = 0;
  nestResult.sheets.forEach(function (sheet) {
    sheet.placements.forEach(function (pl) { totalPartsArea += pl.w * pl.h; });
  });
  var kgPerSheet = (nestResult.sheetW * nestResult.sheetH * gaugeMm) / 1000000 * density;
  var fireRatio = totalSheetArea > 0 ? Math.max(0, 1 - totalPartsArea / totalSheetArea) : 0;
  return {
    kalinlik: etiket, gaugeMm: gaugeMm, densityKgDm3: density,
    sheetCount: sheetCount, sheetW: nestResult.sheetW, sheetH: nestResult.sheetH,
    totalPartsArea: totalPartsArea, totalSheetArea: totalSheetArea,
    firePercent: fireRatio * 100,
    kgPerSheet: kgPerSheet, totalKg: kgPerSheet * sheetCount
  };
}

// Birden fazla grup raporunu TOPLAR (asla ortalamaz) — alan-ağırlıklı tek fire% üretir.
// Grup büyüklükleri farklıysa yüzdelerin ortalaması yanlış sonuç verir; bu yüzden önce
// alanlar toplanır, tek oran EN SONDA hesaplanır.
function aggregateNestReports(reports) {
  var totalSheetCount = 0, totalKg = 0, totalPartsArea = 0, totalSheetArea = 0;
  reports.forEach(function (r) {
    totalSheetCount += r.sheetCount;
    totalKg += r.totalKg;
    totalPartsArea += r.totalPartsArea;
    totalSheetArea += r.totalSheetArea;
  });
  var fireRatio = totalSheetArea > 0 ? Math.max(0, 1 - totalPartsArea / totalSheetArea) : 0;
  return { totalSheetCount: totalSheetCount, totalKg: totalKg, firePercent: fireRatio * 100 };
}

var nestState = null; // { groups:[{label,kalinlik,pieces,nestResult,report,previewIndex}], aggregate, sheetW, sheetH, gap }

function nestLoadGaugeInputs() {
  SAC_GAUGE_KODLAR.forEach(function (kod) {
    var el = document.getElementById('nest-gauge-' + kod);
    if (el) el.value = sacGaugeFor(kod);
  });
}
function nestWireGaugeInputs() {
  SAC_GAUGE_KODLAR.forEach(function (kod) {
    var el = document.getElementById('nest-gauge-' + kod);
    if (el) el.addEventListener('blur', function () { sacGaugeSet(kod, el.value); });
  });
}

function nestComputeAll() {
  var sheetW = Number(document.getElementById('nest-sheet-w').value) || 1500;
  var sheetH = Number(document.getElementById('nest-sheet-h').value) || 3000;
  var gap = Number(document.getElementById('nest-gap').value);
  if (!(gap >= 0)) gap = 3;

  // ANA + ALTUST hepsi aynı fiziksel sac(lar)dan kesileceği için nesting'de birleştirilir
  // (grup ayrımı sadece f0'daki dosya organizasyonu içindi, malzeme tüketimini etkilemez).
  var relevantPanels = panels.slice();

  // Paneller + çizim modülü parçaları TEK havuzda toplanır; gruplama yalnızca SAC
  // KALINLIĞINA (+ malzeme) bakar, kategoriye değil — aynı kalınlıktaki panel, boğaz,
  // damper, tava ve ara kat parçaları aynı saca yerleşir.
  var allPieces = buildNestPieces(relevantPanels).concat(buildModulNestPieces());
  var groups = groupNestPieces(allPieces);
  var reports = [];
  groups.forEach(function (g) {
    g.nestResult = nestPieces(g.pieces, sheetW, sheetH, gap);
    g.report = computeNestReport(g.nestResult, g.gaugeMm, nestDensityOf(g.malzeme), g.label);
    g.previewIndex = 0;
    reports.push(g.report);
  });
  nestState = { groups: groups, aggregate: aggregateNestReports(reports), sheetW: sheetW, sheetH: sheetH, gap: gap };
  return nestState;
}

function nestSvgPreviewForSheet(g, sheetIdx) {
  var sw = new SvgWriter();
  renderNestSheetToWriter(sw, g.nestResult.sheets[sheetIdx], g.nestResult.sheetW, g.nestResult.sheetH, 0);
  return sw.toSvg(360, 620);
}

function renderNestModalContent() {
  var summaryEl = document.getElementById('nest-summary');
  var groupsEl = document.getElementById('nest-groups');
  if (!nestState || !nestState.groups.length) {
    summaryEl.innerHTML = '';
    groupsEl.innerHTML = '<div style=&quot;color:var(--text-muted);font-size:13px;padding:20px;text-align:center;&quot;>Nestlenecek parça yok — önce Kapak Hesabı sekmesinden aktarın.</div>';
    return;
  }
  var agg = nestState.aggregate;
  summaryEl.innerHTML = '<div class=&quot;nest-summary-banner&quot;>'
    + '<div>Toplam plaka: <b>' + agg.totalSheetCount + '</b></div>'
    + '<div>Toplam ağırlık: <b>' + agg.totalKg.toFixed(1) + ' kg</b></div>'
    + '<div>Ortalama fire: <b>%' + agg.firePercent.toFixed(1) + '</b></div>'
    + '</div>';

  groupsEl.innerHTML = nestState.groups.map(function (g, gi) {
    var r = g.report;
    var svg = nestSvgPreviewForSheet(g, g.previewIndex);
    return '<div class=&quot;nest-group-card&quot;>'
      + '<div class=&quot;nest-group-title&quot;>' + g.label + '</div>'
      + '<div class=&quot;nest-group-stats&quot;>'
      + '<div>Plaka: <b>' + r.sheetCount + '</b></div>'
      + '<div>Kalınlık: <b>' + r.gaugeMm + ' mm</b></div>'
      + '<div>Ağırlık: <b>' + r.totalKg.toFixed(1) + ' kg</b></div>'
      + '<div>Fire: <b>%' + r.firePercent.toFixed(1) + '</b></div>'
      + '</div>'
      + '<div class=&quot;nest-preview-box&quot;>' + svg + '</div>'
      + '<div class=&quot;nest-preview-nav&quot;>'
      + '<button data-nestprev=&quot;' + gi + '&quot; ' + (g.previewIndex <= 0 ? 'disabled' : '') + '>‹ Önceki</button>'
      + '<span>Sac ' + (g.previewIndex + 1) + ' / ' + g.nestResult.sheets.length + '</span>'
      + '<button data-nestnext=&quot;' + gi + '&quot; ' + (g.previewIndex >= g.nestResult.sheets.length - 1 ? 'disabled' : '') + '>Sonraki ›</button>'
      + '</div>'
      + '<div class=&quot;nest-group-actions&quot;>'
      + '<button class=&quot;nest-download-btn&quot; data-nestdlgroup=&quot;' + gi + '&quot;>⬇ İndir (Birleşik DXF)</button>'
      + '<button class=&quot;nest-sheet-link&quot; data-nestdlsheet=&quot;' + gi + '&quot;>Sadece Bu Sacı İndir</button>'
      + '</div>'
      + '</div>';
  }).join('');

  nestBindGroupEvents();
}

function nestBindGroupEvents() {
  document.querySelectorAll('[data-nestprev]').forEach(function (b) {
    b.addEventListener('click', function () {
      var gi = Number(b.dataset.nestprev);
      var g = nestState.groups[gi];
      if (g.previewIndex > 0) { g.previewIndex--; renderNestModalContent(); }
    });
  });
  document.querySelectorAll('[data-nestnext]').forEach(function (b) {
    b.addEventListener('click', function () {
      var gi = Number(b.dataset.nestnext);
      var g = nestState.groups[gi];
      if (g.previewIndex < g.nestResult.sheets.length - 1) { g.previewIndex++; renderNestModalContent(); }
    });
  });
  document.querySelectorAll('[data-nestdlgroup]').forEach(function (b) {
    b.addEventListener('click', function () {
      var g = nestState.groups[Number(b.dataset.nestdlgroup)];
      var dxf = renderNestGroupCombined(g.nestResult);
      var elAd = document.getElementById('dosyaAdi50');
      var baseAd = (elAd && elAd.value.trim()) || 'sac_nesting';
      nestDownloadDxf(dxf, baseAd + '_' + nestGrupSlug(g) + '_nesting.dxf');
    });
  });
  document.querySelectorAll('[data-nestdlsheet]').forEach(function (b) {
    b.addEventListener('click', function () {
      var g = nestState.groups[Number(b.dataset.nestdlsheet)];
      var dxf = renderSingleNestSheetDxf(g.nestResult.sheets[g.previewIndex], g.nestResult.sheetW, g.nestResult.sheetH);
      nestDownloadDxf(dxf, nestGrupSlug(g) + '_sac' + (g.previewIndex + 1) + '.dxf');
    });
  });
}

function nestRunAndRender() {
  try {

    document.getElementById('nest-groups').innerHTML = '<div style=&quot;color:var(--bad);font-size:13px;padding:20px;&quot;>Hata: ' + (e.message || e) + '</div>';

function applyKapakData(data) {
  try {

    var imported = data.panels || [];
    var importedBogaz = data.bogazList || [];
    var importedTava = data.tavaList || [];       // Kapak Hesabi'ndaki 'Tava' elemanlari
    var importedDamper = data.damperList || [];   // Kapak Hesabi'ndaki 'Damper' elemanlari
    var importedArakat = data.arakatList || [];   // Kapak Hesabi'ndaki ARA KAT gozleri
    var importedEsanjor = data.esanjorList || []; // Kapak Hesabi'ndaki ESANJOR sekmesi
    var importedKizak = data.kizakList || [];      // Kapak Hesabi'ndaki KIZAK sekmesi
    var seri = data.seri || '60';
    var proje = data.proje || '';
    // Her kayit HANGI SANTRALDEN geldigini tasir. Toplu uretim dosyalari buna gore
    // ayirir; yoksa cok santralli projede panel dosyalari (grup x kalinlik) bazinda
    // birlesiyor, dosya adi da SON gelen santralinkini aliyordu (olculdu 03.09.2026:
    // 20 santral -> 15 dosya, '… AHU-19 — YAN PANELLER.dxf' icinde AHU-3,5,9,…).
    var etiketle = function (kaynak, hedef) {
      kaynak.forEach(function (k) { if (proje) k.santral = proje; hedef.push(k); });
    };

    if (!imported.length && !importedBogaz.length && !importedTava.length
        && !importedDamper.length && !importedArakat.length && !importedEsanjor.length
        && !importedKizak.length) return;

    // Yeni bir aktarim turunun ILK mesaji (data.reset): Kapak Hesabi'ndan gelen ALTI liste
    // sifirlanir. 25.08.2026'ya kadar esanjor listesi ELLE giriliyordu ve dokunulmuyordu;
    // artik o da AHU Studio'nun ESANJOR sekmesinden geliyor, yani ayni kurala tabi.
    // Bayrak yoksa davranis eskisi gibi 'ekle' kalir — ayni turdaki 2. ve sonraki AHU
    // mesajlari ile hash/postMessage ile disaridan gelen cagrilar boylece birikir.
    var temizlenen = 0;
    if (data.reset) {
      temizlenen = panels.length + bogazList.length + tavaList.length
                 + damperList.length + arakatList.length + esanjorList.length
                 + kizakList.length;
      panels.length = 0; bogazList.length = 0; tavaList.length = 0;
      damperList.length = 0; arakatList.length = 0; esanjorList.length = 0;
      kizakList.length = 0;
    }

    // Panel listesi
    if (imported.length) {
      etiketle(imported, panels);
      if (proje) {
        var el60 = document.getElementById('dosyaAdi60');
        var el50 = document.getElementById('dosyaAdi50');
        if (seri === '60' || seri === '60P') { if (el60) el60.value = proje; }
        else { if (el50) el50.value = proje; }
      }
      renderTable();
    }

    // Boğaz listesi
    if (importedBogaz.length) {
      etiketle(importedBogaz, bogazList);
      if (elBDosyaAdi && proje && !elBDosyaAdi.value) elBDosyaAdi.value = proje;
      renderBogazTable();
    }

    // Tava listesi — elle giris yok, tek kaynak burasi.
    // Kayit sekli: { cihaz, genislik, yukseklik, adet }; ikisi PANEL olcusudur ve
    // AYRI anlamlidir (genislik govde enini, yukseklik govde boyunu surer).
    // Tava govdesini cizim programi hesaplar (-45).
    if (importedTava.length) {
      etiketle(importedTava, tavaList);
      // Alan gizli ve tamamen turetilmis: her aktarimda guncellenir. Tava tek
      // basina aktarilirsa dosyaAdi50/60 bos kalacagi icin projeAdiOku() ise
      // yaramaz — ad buradan gelmek zorunda.
      if (elTDosyaAdi && proje) elTDosyaAdi.value = proje + ' — ' + TAVA_DOSYA_EKI;
      renderTavaTable();
    }

    // Damper listesi — elle giris yok. Kayit sekli: { genislik, yukseklik, adet };
    // ikisi AYRI anlamlidir (yatay parca genisligi, dikey parca yuksekligi takip
    // eder) ve bolme kurali yalnizca genislige bakar.
    if (importedDamper.length) {
      etiketle(importedDamper, damperList);
      if (elDDosyaAdi && proje) elDDosyaAdi.value = proje + ' — ' + DAMPER_DOSYA_EKI;
      renderDamperTable();
    }

    // Ara kat listesi — tava/damperden FARKLI olarak elle giris formu DURUYOR.
    // Aktarilan kayitlar listeye eklenir, form da calismaya devam eder.
    // Kayit sekli elle girisin aynisi: { tip, B, K, adet }.
    if (importedArakat.length) {
      etiketle(importedArakat, arakatList);
      // Alan gizli ve tamamen turetilmis (elle giris kaldirildi): her aktarimda
      // guncellenir. Ara kat tek basina aktarilirsa dosyaAdi50/60 bos kalacagi icin
      // projeAdiOku() is gormez — ad buradan gelmek zorunda. Tava/damperin aynisi.
      if (elADosyaAdi && proje) elADosyaAdi.value = proje + ' — ' + ARAKAT_DOSYA_EKI;
      renderArakatTable();
    }

    // Esanjor setleri (25.08.2026): CI ve O1..O4 Kapak Hesabi'nda modul olcusunden
    // turetilir; buraya hazir gelir. 1.5 mm isareti yalnizca O3'tedir.
    if (importedEsanjor.length) {
      etiketle(importedEsanjor, esanjorList);
      if (elEDosyaAdi && proje) elEDosyaAdi.value = proje + ' — ' + ESANJOR_DOSYA_EKI;
      renderEsanjorTable();
    }

    // Batarya kizagi takimlari (01.09.2026): boy modulun W'sinden, ust L kanadi
    // foydeki HR'den Kapak Hesabi'nda turetilir; buraya hazir gelir.
    if (importedKizak.length) {
      etiketle(importedKizak, kizakList);
      if (elKDosyaAdi && proje) elKDosyaAdi.value = proje + ' — ' + KIZAK_DOSYA_EKI;
      renderKizakTable();
    }

    // Sifirlanan ama bu turda kaydi GELMEYEN listenin tablosu da tazelenmeli;
    // yukaridaki bloklarin her biri yalnizca kayit gelen listeyi render ediyor.
    if (data.reset) {
      if (!imported.length)       renderTable();
      if (!importedBogaz.length)  renderBogazTable();
      if (!importedTava.length)   renderTavaTable();
      if (!importedDamper.length) renderDamperTable();
      if (!importedArakat.length) renderArakatTable();
      if (!importedEsanjor.length) renderEsanjorTable();
      if (!importedKizak.length) renderKizakTable();
    }

    // Durum mesajı
    var parts = [];
    if (imported.length)       parts.push(imported.length + ' panel');
    if (importedBogaz.length)  parts.push(importedBogaz.length + ' boğaz seti');
    if (importedTava.length)   parts.push(importedTava.length + ' tava');
    if (importedDamper.length) parts.push(importedDamper.length + ' damper');
    if (importedArakat.length) parts.push(importedArakat.length + ' ara kat');
    if (importedEsanjor.length) parts.push(importedEsanjor.length + ' eşanjör seti');
    if (importedKizak.length) parts.push(importedKizak.length + ' batarya kızağı');

    var onceki = temizlenen ? ' (önceki ' + temizlenen + ' kayıt değiştirildi)' : '';
    if (data.autoGenerate) {
      setStatus('✓ ' + parts.join(' + ') + ' aktarıldı' + (proje ? ' — ' + proje : '') + onceki + '. Otomatik DXF üretiliyor…');
      topluDxfUret();
    } else {
      setStatus('✓ ' + parts.join(' + ') + ' kapak hesabından aktarıldı'
        + (proje ? ' — ' + proje : '') + onceki
        + '. Kontrol edip &quot;Toplu DXF Üret&quot; butonuna basın.');
    }

  } catch (e) {
    console.warn('Kapak aktarım hatası:', e);
  }
}
