  const tipAd = {}, modBoy = {}, modKat = {};
  (r.modules||[]).forEach(function(m){
    tipAd[m.name] = m.type || '';
    modBoy[m.name] = m.boy || 0;
    modKat[m.name] = m.deck === 'her iki kat' ? 'tam'
                   : m.deck === 'alt kat' ? 'alt'
                   : m.deck === 'üst kat' ? 'üst' : 'tek';
  });
  const ham = adlar.map(function(nm){
    const b = bl[nm];
    const y = b ? (b.yanlar.Right || b.yanlar.Left) : null;
    return { nm: nm, islev: tipAd[nm] || nm, boy: modBoy[nm] || 0,
             kat: modKat[nm] || 'tek',
             sira: y ? y.lo : 0,
             kapaklar: (y && y.kapaklar.length) ? y.kapaklar : [],
             acilir: !!(y && y.acilir),
             tavalar: (y && y.tavalar) || [],
             batarya: (y && y.batarya) ? y.batarya : null,
             agizlar: ((r && r.agizlar) || []).filter(function(a){ return a.mod === nm; }) };
  }).sort(function(a,b){ return a.sira - b.sira; });
  if(aynala) ham.reverse();
  return ham.map(function(p){
    const o = { islev: p.islev, boy: p.boy, kat: p.kat };
    // Aynalandiginda kapak modulun icinde de karsi kenara gecer.
    // BUTUN kapaklar tasinir (Cenk, 31.08.2026): eskiden yalniz kapaklar[0] aliniyordu ve
    // KLM-01 M1'de iki acilirin biri, DES M1'lerde ucun ikisi sessizce dusuyordu.
    // 'kapak' alani geriye donuk uyum icin ilk kapaktir; motor 'kapaklar'i kullanir.
    if(p.kapaklar && p.kapaklar.length){
      o.kapaklar = p.kapaklar.map(function(k){
        const q = { x: aynala ? Math.max(0, p.boy - k.lo - k.w) : k.lo, w: k.w, h: k.h };
        if(k.alt > 0) q.alt = k.alt;
        return q;
      }).sort(function(a,b){ return a.x - b.x; });
      o.kapak = { x: o.kapaklar[0].x, w: o.kapaklar[0].w, h: o.kapaklar[0].h };
    }
    if(p.batarya) o.batarya = { lo: aynala ? Math.max(0, p.boy - p.batarya.lo - p.batarya.kalinlik) : p.batarya.lo,
                                kalinlik: p.batarya.kalinlik };
    // Açılır kapak işareti — alan YALNIZ doluyken var olur (panel.yon deseni).
    if(p.acilir) o.acilir = true;
    // Çizimden okunan tavalar; aynalamada modülün içinde karşı kenara geçer.
    if(p.tavalar && p.tavalar.length){
      o.tavalar = p.tavalar.map(function(t){
        return { lo: aynala ? Math.max(0, p.boy - t.lo - t.w) : t.lo, w: t.w };
      }).sort(function(a,b){ return a.lo - b.lo; });
    }
    // Agizlar: alan YALNIZ doluyken var olur (panel.yon deseni) — yoksa JSON gidis-donusu
    // sabit nokta olmaz. Aynalandiginda SOL <-> SAG takas edilir (pos.x cevrildigi icin);
    // W eksenindeki yer ortali oldugu icin (1345 agzin 1343'u) hic degismez.
    // UST agiz L ekseninde konumlanir — o eksen aynalanmada cevrilir, tipki kapak gibi.
    if(p.agizlar && p.agizlar.length){
      const ag = p.agizlar.map(function(a){
        const yz = !aynala ? a.yuz : (a.yuz === 'SOL' ? 'SAĞ' : a.yuz === 'SAĞ' ? 'SOL' : a.yuz);
        const q = { etiket: a.etiket, yuz: yz };
        if(a.w > 0 && a.h > 0){
          q.w = a.w; q.h = a.h;
          if(a.yuz === 'ÜST'){
            if(a.x != null) q.x = aynala ? Math.max(0, p.boy - a.x - a.w) : a.x;
            // W eksenindeki yer: ON kenarina uzaklik. Aynalama yalniz L eksenini cevirir,
            // ON/ARKA degismez — bu alan aynen tasinir.
            if(a.on != null) q.on = a.on;
          }else q.y = a.y;
        }
        if(a.damper) q.damper = true;
        if(a.tabloDan) q.tabloDan = true;
        return q;
      });
      if(ag.length) o.agizlar = ag;
    }
    return o;
  });
}

function dxfModulListesi(r, aynala){
  const hs = (r && r.hucreler) || [];
  if(!hs.length) return [];
  const tipAd = {};
  (r.modules||[]).forEach(function(m){ tipAd[m.name] = m.type || ''; });
  const loList = hs.map(function(h){ return h.lo; });
  const x0 = Math.min.apply(null, loList);
  const altH = (r.deckHeights && r.deckHeights[0]) || 0;
  const toplam = Math.max.apply(null, hs.map(function(h){ return Math.round((h.hi - x0)*10); }));
  const out = hs.map(function(h){
    const x = Math.round((h.lo - x0)*10);
    // Hucredeki islev adlari: 'M2, M3' -> 'Filtre + DX Batarya' (ayni tip iki kez yazilmaz)
    const ad = String(h.moduller||'').split(',').map(function(s){ return s.trim(); })
      .filter(Boolean).map(function(n){ return tipAd[n] || n; })
      .filter(function(v,i,a){ return v && a.indexOf(v)===i; }).join(' + ');
    const fk = String(h.moduller||'').split(',').map(function(s){ return s.trim(); })
      .map(function(nm){ return (r.fanlar||{})[nm]; }).filter(Boolean)[0];
    const adlar = String(h.moduller||'').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    return { L: h.boy, H: h.yukseklik, W: r.genislik||0,
             x: aynala ? toplam - x - h.boy : x,
             y: h.katKod === 'üst' ? altH : 0,
             kat: h.katKod, ad: ad, fan: fk ? dxfFanCoz(fk) : null,
             // TAŞAN GÖVDE (Cenk, 31.08.2026): tek katlı çizimde kat yüksekliğini aşan
             // gövde (DES ailesindeki plakalı eşanjör) da iki katlıdır — ölçü zinciri onu
             // tek hücre gösterse de ÖN/ARKA yüzünde kat ayırıcı takviye vardır ve alt kat
             // kapağı komşusuyla aynı olmalıdır. Alan aynı 'altKat'tır, yeni alan açılmaz.
             altKat: h.katKod === 'tam' ? altH
                   : (h.katKod === 'tek' && altH > 0 && h.yukseklik > altH + 1 ? altH : 0),
             parcalar: dxfParcaListesi(r, adlar, aynala) };
  });
  out.sort(function(a,b){ return a.x - b.x || a.y - b.y; });
  return out;
}

// Proje hic dokunulmamis mi? Oyleyse ilk aktarim bos AHU'yu DEGISTIRIR, yanina eklemez —
// yoksa her oturum 'AHU-1 (bos)' artigiyla baslar.
function dxfProjeBos(){
  if(state.ahus.length !== 1) return false;
  const a = state.ahus[0];
  if(a.modules.length !== 1) return false;
  const m = a.modules[0];
  return !m.L && !m.H && !m.W && !a.malzeme && !a.varsayimlar.seri
    && !state.proje.isNo && !state.proje.ad;
}

// AHU adi tekil olmali: iki cizim ayni Santral Adi'ni tasiyabiliyor (olculdu — KS-1 dosyasi
// iki kez, farkli geometriyle). Excel dosya adi {isNo}_{ahuAd}_KAPAK_HESABI.xlsx oldugu icin
// ayni ad ikinci uniteyi birincinin uzerine yazardi. Dosya adinda yasak karakter de temizlenir.
// haric: adlandirilmakta olan AHU'nun kendisi (listeye girmis olabilir, kendiyle carpismasin)
function dxfTekilAd(ad, haric){
  const t = String(ad||'DXF').replace(/[\\/:*?<>|]/g, '-').trim() || 'DXF';
  const dolu = function(x){ return state.ahus.some(function(a){ return a !== haric && a.ad === x; }); };
  if(!dolu(t)) return t;
  for(let i=2; i<100; i++){ const aday = t + ' (' + i + ')'; if(!dolu(aday)) return aday; }
  return t;
}

// Bir cozumlemeyi yeni bir AHU olarak kurar. renderAll CAGIRMAZ.
// Esanjor hucresinde module.esanjor ACILMAZ: DXF kenar/ust kat/saga uzaklik vermiyor,
// gecersiz esanjor collectFaceIssues'e girip Excel ve DXF'i kilitler.
function dxfAhuKur(r, aynala, adet){
  const k = dxfKunye(r);
  const ml = dxfModulListesi(r, aynala);
  if(!ml.length) return null;
  const bos = dxfProjeBos();          // push'tan ONCE olculmeli
  const yeni = newAhu(state.ahus.length+1);
  yeni.malzeme = k.malzeme;
  yeni.varsayimlar.seri = k.seri;
  yeni.modules = ml.map(function(m, i){
    const md = newModule();
    md.L = m.L; md.H = m.H; md.W = m.W;
    md.pos = { x: m.x, y: m.y, z: 0 };
    if(m.ad) md.ad = m.ad;            // alan YALNIZ doluyken var olur (panel.yon deseni)
    if(m.fan) md.fan = dxfFanKalici(m.fan);
    if(m.parcalar && m.parcalar.length){
      md.dxfBilgi = { parcalar: m.parcalar };
      if(m.altKat > 0) md.dxfBilgi.altKat = m.altKat;
    }
    if(i > 0){                         // ilk modul cipa; digerleri silinince bosluk kapansin
      md.attAxis = m.y > 0 ? 'y' : 'x';
      md.attDir = 1;
    }
    return md;
  });
  yeni.active = 0;
  ahuAdetYaz(yeni, adet);   // alan yalniz 1'den buyukken var olur
  if(bos) state.ahus[0] = yeni; else state.ahus.push(yeni);
  yeni.ad = dxfTekilAd(k.ad, yeni);   // yerlestikten SONRA: bos AHU degistiyse adi serbest kalir
  state.activeAhu = state.ahus.indexOf(yeni);
  araKatNormalize();
  esanjorNormalize();
  kizakNormalize();
  return { ahu: yeni, modulSayisi: yeni.modules.length, kunye: k, adet: ahuAdet(yeni) };
}

// ---------- DXF'TEN AKTARIM — ARAYUZ ----------
// Model tarafi yukarida (dxfKunye / dxfModulListesi / dxfAhuKur). Burasi yalniz gosterim.
var dxaPlanlar = [], dxaIdx = 0;

// srcdoc TUM HTML varliklarini cozer: kaynaga &-a-m-p-; yazarsak calisma aninda tek & olur ve
// kacis fonksiyonu sessizce etkisiz kalir (CLAUDE.md tuzak 11). Varlik metinleri bu yuzden
// karakter kodundan kurulur, f1'deki esanjorEscapeHtml ile ayni yontem.
function dxaKac(s){
  const amp = String.fromCharCode(38);
  return String(s == null ? '' : s)
    .split(amp).join(amp + 'amp;')
    .split('<').join(amp + 'lt;')
    .split('>').join(amp + 'gt;')
    .split(String.fromCharCode(34)).join(amp + 'quot;');
}

function dxaDurum(){ return { planlar: dxaPlanlar, idx: dxaIdx }; }

function dxaPlanYap(r, dosya){
  const ayna = dxfAynalaOnerisi(dosya);
  const adet = dxfAdetOku(dosya, r.santral);
  return { dosya: dosya, coz: r, kunye: dxfKunye(r), ayna: ayna, aynaOto: ayna,
           adet: adet, adetOto: adet > 1,
           sec: r.hucreler.length > 0, hata: null };
}
function dxaHataPlani(dosya, mesaj){
  return { dosya: dosya, coz: null, kunye: null, ayna: false, aynaOto: false,
           adet: 1, adetOto: false, sec: false, hata: mesaj };
}
function dxaModuller(p){ return p.coz ? dxfModulListesi(p.coz, p.ayna) : []; }

// Dosyalari oku -> coz -> modali ac. Her dosya kendi try/catch'inde: bozuk bir dosya
// otekileri dusurmez, kendi seridinde kirmizi gorunur.
function dxaDosyalariOku(fileList){
  const files = Array.prototype.slice.call(fileList || []);
  if(!files.length) return;
  const planlar = new Array(files.length);
  let kalan = files.length;
  const bitir = function(){ if(--kalan === 0) dxaModalAc(planlar); };
  files.forEach(function(file, i){
    const fr = new FileReader();
    fr.onload = function(e){
      try{ planlar[i] = dxaPlanYap(DXFCEK.coz(String(e.target.result), file.name), file.name); }
      catch(err){ planlar[i] = dxaHataPlani(file.name, err.message || 'çözümlenemedi'); }
      bitir();
    };
    fr.onerror = function(){ planlar[i] = dxaHataPlani(file.name, 'dosya okunamadı'); bitir(); };
    fr.readAsText(file);
  });
}

function dxaModalAc(planlar){
  dxaPlanlar = planlar || [];
  dxaIdx = 0;
  document.getElementById('dxa_modal').classList.add('open');
  dxaCiz();
}
function dxaModalKapat(){
  document.getElementById('dxa_modal').classList.remove('open');
  dxaPlanlar = [];   // cozumleme nesneleri buyuk; oturum boyunca tutulmasin
  dxaIdx = 0;
}
function dxaGit(delta){
  const y = dxaIdx + delta;
  if(y < 0 || y >= dxaPlanlar.length) return;
  dxaIdx = y;
  dxaCiz();
}

// Kutulari on gorunuste serer. Ham DXF cizimi degil KURULACAK MODULLERIN semasi:
// aynalama burada aninda gorunur ve ekranda gorulen ile kurulan ayni kaynaktan gelir.
function dxaSema(p){
  const ml = dxaModuller(p);
  if(!ml.length) return '';
  const SW = 940, SH = 230, PAD = 22;
  const toplamL = Math.max.apply(null, ml.map(function(m){ return m.x + m.L; }));
  const toplamH = Math.max.apply(null, ml.map(function(m){ return m.y + m.H; }));
  const sc = Math.min((SW - 2*PAD) / Math.max(toplamL, 1), (SH - 2*PAD) / Math.max(toplamH, 1));
  const ox = (SW - toplamL*sc) / 2, oy = SH - PAD;
  let s = '<svg viewBox=&quot;0 0 ' + SW + ' ' + SH + '&quot; style=&quot;width:100%;height:auto;display:block;&quot;>';
  ml.forEach(function(m, i){
    const x = ox + m.x*sc, y = oy - (m.y + m.H)*sc, w = m.L*sc, h = m.H*sc;
    const renk = m.kat === 'üst' ? 'var(--warn)' : m.kat === 'tam' ? 'var(--bad)' : 'var(--accent)';
    s += '<rect x=&quot;' + x.toFixed(1) + '&quot; y=&quot;' + y.toFixed(1) + '&quot; width=&quot;' + w.toFixed(1)
       + '&quot; height=&quot;' + h.toFixed(1) + '&quot; fill=&quot;' + renk + '&quot; fill-opacity=&quot;0.13&quot; stroke=&quot;' + renk
       + '&quot; stroke-width=&quot;1.5&quot; rx=&quot;2&quot;' + (m.kat === 'tam' ? ' stroke-dasharray=&quot;6,4&quot;' : '') + '/>';
    const satirlar = ['M' + (i+1), m.L + ' × ' + m.H, m.ad || ''].filter(Boolean);
    const gen = Math.max(w - 8, 18);
    const olculen = satirlar.map(function(t, si){
      return fitLabelText(t, gen, si === 0 ? 12.5 : 11, 8.5, si === 0 ? 700 : 400);
    });
    let yuk = 0;
    olculen.forEach(function(f){ yuk += f.size*1.35; });
    let ty = y + h/2 - yuk/2;
    olculen.forEach(function(f, si){
      ty += f.size*1.35;
      s += '<text x=&quot;' + (x + w/2).toFixed(1) + '&quot; y=&quot;' + (ty - f.size*0.32).toFixed(1)
         + '&quot; text-anchor=&quot;middle&quot; font-size=&quot;' + f.size.toFixed(1) + '&quot; font-weight=&quot;'
         + (si === 0 ? 700 : 400) + '&quot; fill=&quot;var(--text)&quot;>' + dxaKac(f.text) + '</text>';
    });
  });
  if(p.ayna) s += '<text x=&quot;' + (SW-6) + '&quot; y=&quot;16&quot; text-anchor=&quot;end&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;var(--warn)&quot;>⇄ AYNALI</text>';
  s += '</svg>';
  return s;
}

function dxaCiz(){
  const serit = document.getElementById('dxa_serit');
  const govde = document.getElementById('dxa_body');
  const sayac = document.getElementById('dxa_sayac');
  const aktar = document.getElementById('dxa_aktar');
  if(!serit || !govde) return;

  const cok = dxaPlanlar.length > 1;
  serit.style.display = cok ? 'flex' : 'none';
  document.getElementById('dxa_onceki').style.display = cok ? '' : 'none';
  document.getElementById('dxa_sonraki').style.display = cok ? '' : 'none';
  sayac.textContent = cok ? (dxaIdx+1) + ' / ' + dxaPlanlar.length : '';
  document.getElementById('dxa_onceki').disabled = dxaIdx <= 0;
  document.getElementById('dxa_sonraki').disabled = dxaIdx >= dxaPlanlar.length - 1;

  serit.innerHTML = dxaPlanlar.map(function(p, i){
    const d = p.hata ? 'var(--bad)' : p.coz.status === 'verified' ? 'var(--good)'
            : p.coz.status === 'warning' ? 'var(--warn)' : 'var(--bad)';
    return '<span class=&quot;dxa-cip' + (i === dxaIdx ? ' sec' : '') + (p.sec ? '' : ' pas')
      + '&quot; data-dxacip=&quot;' + i + '&quot;><span class=&quot;dxa-nokta&quot; style=&quot;background:' + d + '&quot;></span>'
      + dxaKac(p.dosya) + '</span>';
  }).join('');

  const p = dxaPlanlar[dxaIdx];
  if(!p){ govde.innerHTML = ''; return; }

  if(p.hata){
    govde.innerHTML = '<div class=&quot;status bad&quot;><b>Bu dosya çözümlenemedi</b><br>' + dxaKac(p.dosya)
      + ' — ' + dxaKac(p.hata) + '</div>';
  } else {
    const k = p.kunye, r = p.coz, ml = dxaModuller(p);
    const bosluk = function(v){ return v ? dxaKac(v) : '<b class=&quot;bos&quot;>—</b>'; };
    const alan = function(baslik, deger, kaynak){
      return '<div>' + dxaKac(baslik) + (deger === null ? '<b class=&quot;bos&quot;>—</b>' : '<b>' + dxaKac(deger) + '</b>')
        + (kaynak ? dxaKac(kaynak) : '') + '</div>';
    };
    let h = '<div class=&quot;dxa-kunye&quot;>'
      + alan('Dosya', p.dosya, '')
      + alan('AHU Adı', k.ad, 'Santral Adı alanından')
      + alan('Profil Serisi', k.seri ? k.seri + 'lik' : null, k.profilAdi || 'Profil Adı okunamadı')
      + alan('İç Sac', k.malzeme || null, k.icSac || 'İç Sac Adı okunamadı')
      + alan('Üretim Adedi', p.adet + ' cihaz', p.adetOto ? 'dosya adından okundu' : 'elle')
      + alan('Genişlik (W)', k.en ? k.en + ' mm' : null, 'her modüle uygulanır')
      + alan('Katlar', k.katlar.length ? k.katlar.join(' + ') + ' mm' : null,
             k.katlar.length > 1 ? k.katlar.length + ' kat' : 'tek kat')
      + '</div>';

    h += '<div class=&quot;dxa-secenek&quot;>'
      + '<label><input type=&quot;checkbox&quot; id=&quot;dxa_ayna&quot;' + (p.ayna ? ' checked' : '') + '> Aynala (modül sırasını ters çevir)</label>'
      + (dxaPlanlar.length > 1
          ? '<label><input type=&quot;checkbox&quot; id=&quot;dxa_sec&quot;' + (p.sec ? ' checked' : '')
            + (ml.length ? '' : ' disabled') + '> Bu dosyayı aktar</label>'
          : '')
      + '<label>Üretim adedi <input type=&quot;number&quot; id=&quot;dxa_adet&quot; min=&quot;1&quot; max=&quot;999&quot; step=&quot;1&quot; value=&quot;'
      + p.adet + '&quot; style=&quot;width:64px;&quot;></label>'
      + '</div>';
    if(p.aynaOto) h += '<div class=&quot;note&quot;>Dosya adında AYNALANACAK geçtiği için kendiliğinden işaretlendi.</div>';
    if(p.adetOto) h += '<div class=&quot;note&quot;>Dosya adında ' + p.adet + ' ADET yazdığı için üretim adedi kendiliğinden ' + p.adet + ' geldi.</div>';

    const gecen = r.checks.filter(function(c){ return c.ok; }).length;
    const dusen = r.checks.filter(function(c){ return !c.ok; });
    const cls = r.status === 'verified' ? 'good' : r.status === 'warning' ? 'warn' : 'bad';
    let bas;
    if(r.status === 'verified') bas = '✔ ' + r.checks.length + ' bağımsız kontrolün ' + gecen + '\'i geçti.';
    else if(r.status === 'warning') bas = '⚠ Uyarılı sonuç — ölçüleri çizimden teyit edin.';
    else bas = '⛔ Kritik kontrol geçemedi — bu çizim beklenen P-KS düzeninde olmayabilir. Yine de aktarabilirsiniz; modülleri elle doğrulayın.';
    const uyarilar = (k.uyari || []).concat(r.warn ? [r.warn] : [])
      .concat(dusen.map(function(c){ return c.name + (c.detail ? ' (' + c.detail + ')' : ''); }));
    h += '<div class=&quot;status ' + cls + '&quot;>' + dxaKac(bas)
      + (uyarilar.length ? '<ul class=&quot;dxa-liste&quot;>' + uyarilar.map(function(u){
           return '<li>' + dxaKac(u) + '</li>'; }).join('') + '</ul>' : '')
      + '</div>';

    if(!ml.length){
      h += '<div class=&quot;status bad&quot;>Kurulacak modül bulunamadı — bu dosyadan aktarım yapılamaz.</div>';
    } else {
      h += '<h3>Kurulacak Modüller (' + ml.length + ')</h3>'
        + '<table><thead><tr><th>#</th><th>Kat</th><th class=&quot;n&quot;>L</th><th class=&quot;n&quot;>H</th><th class=&quot;n&quot;>W</th>'
        + '<th>Konum x, y, z</th><th>Modül Adı (içindeki işlevler)</th></tr></thead><tbody>'
        + ml.map(function(m, i){
            const sinif = m.kat === 'üst' ? 'k-ust' : m.kat === 'tam' ? 'k-tam' : 'k-alt';
            const katAd = m.kat === 'üst' ? 'Üst kat' : m.kat === 'tam' ? 'Alt+Üst (tam)'
                        : m.kat === 'tek' ? 'Tek kat' : 'Alt kat';
            return '<tr class=&quot;' + sinif + '&quot;><td>M' + (i+1) + '</td><td>' + katAd
              + '</td><td class=&quot;n&quot;>' + m.L + '</td><td class=&quot;n&quot;>' + m.H + '</td><td class=&quot;n&quot;>' + m.W
              + '</td><td>' + m.x + ', ' + m.y + ', 0</td><td>' + dxaKac(m.ad || '—') + '</td></tr>';
          }).join('')
        + '</tbody></table>';
      const altToplam = ml.filter(function(m){ return m.y === 0; })
        .reduce(function(a, m){ return a + m.L; }, 0);
      h += '<div class=&quot;note&quot;>Alt kat uzunlukları toplamı ' + altToplam + ' mm · çizimdeki toplam boy '
        + (r.totalLen || '—') + ' mm. DXF\'teki M1/M2 etiketleri işlevleri gösterir; her hücre AHU Studio\'da bir modül olur.</div>';
      const fanli = ml.filter(function(m){ return m.fan; });
      if(fanli.length){
        h += '<h3>Fan ve Motor (' + fanli.length + ')</h3>'
          + '<table><thead><tr><th>Modül</th><th>Fan</th><th class=&quot;n&quot;>Çap</th><th class=&quot;n&quot;>kW</th>'
          + '<th class=&quot;n&quot;>d/dk</th><th>Motor</th><th class=&quot;n&quot;>Gövde</th><th>Motor Kaidesi</th></tr></thead><tbody>'
          + fanli.map(function(m, i){
              const fn = m.fan;
              const sira = ml.indexOf(m) + 1;
              const kaideHuc = fn.kayis
                ? '<span style=&quot;color:var(--warn)&quot;>kapsam dışı — kayış-kasnaklı</span>'
                : fn.kaide ? '<b>' + dxaKac(fn.kaide) + '</b>'
                : '<span style=&quot;color:var(--bad)&quot;>çözülemedi</span>';
              return '<tr><td>M' + sira + '</td><td>' + dxaKac(fn.ad) + '</td>'
                + '<td class=&quot;n&quot;>' + (fn.cap || '—') + '</td><td class=&quot;n&quot;>' + (fn.kw || '—') + '</td>'
                + '<td class=&quot;n&quot;>' + (fn.devir || '—') + '</td><td>' + dxaKac(fn.motorAd) + '</td>'
                + '<td class=&quot;n&quot;>' + (fn.govde || '—') + '</td><td>' + kaideHuc + '</td></tr>';
            }).join('')
          + '</tbody></table>';
        const fanUyari = fanli.reduce(function(a, m){
          return a.concat((m.fan.uyari || []).map(function(u){ return m.fan.ad + ': ' + u; }))
                  .concat(m.fan.kapsam ? [m.fan.ad + ': ' + m.fan.kapsam] : []);
        }, []);
        if(fanUyari.length){
          h += '<div class=&quot;status warn&quot;>Fan/motor notları<ul class=&quot;dxa-liste&quot;>'
            + fanUyari.map(function(u){ return '<li>' + dxaKac(u) + '</li>'; }).join('') + '</ul></div>';
        } else {
          h += '<div class=&quot;note&quot;>Gövde kW + devir tablosundan çözüldü ve motor adıyla doğrulandı. '
            + 'Kaide kodu <b>SYWB{fan çapı}-{motor gövdesi}</b> biçimindedir.</div>';
        }
      }
      h += '<h3>Şema — kurulacak modüller (ön görünüş)</h3><div class=&quot;dxa-sema&quot;>' + dxaSema(p) + '</div>';
    }
    govde.innerHTML = h;
  }

  const secili = dxaPlanlar.filter(function(x){ return x.sec && !x.hata; }).length;
  aktar.disabled = secili === 0;
  aktar.textContent = secili === 0 ? 'Aktarılacak dosya yok'
    : dxaPlanlar.length > 1 ? secili + ' dosyayı aktar'
    : (p && p.coz && p.coz.status === 'error' ? 'Yine de Aktar' : 'Aktar');
}

function dxaAktar(){
  const secilenler = dxaPlanlar.filter(function(p){ return p.sec && !p.hata; });
  if(!secilenler.length) return;
  let modul = 0, ahu = 0;
  const adlar = [];
  secilenler.forEach(function(p){
    const s = dxfAhuKur(p.coz, p.ayna, p.adet);
    if(s){ ahu++; modul += s.modulSayisi; adlar.push(s.ahu.ad + (s.adet > 1 ? ' ×' + s.adet : '')); }
  });
  dxaModalKapat();
  renderAll();
  const not = document.getElementById('excel_note');
  if(not) not.textContent = ahu + ' AHU (' + adlar.join(', ') + ') · ' + modul
    + ' modül kuruldu. Kapak yerleşimi girilene kadar Excel ve DXF kilitli kalır — yüzlerdeki kapakları girmek size ait.';
}

// ---------- PANEL TEMASI: EFEKTLER ----------
// Kaynak: tema/tema.js. Uygulamaya uyarlanan uc davranis:
//   1) kartlarda imleci takip eden isik  2) kartlarin sirayla iceri girmesi
//   3) acilis isigi (sayfa Panel temasiyla acildiginda ucgen + supurme)
// Hepsi TEMAYA BAGLI: baska temada dinleyici is gormez, DOM'a hicbir sey eklenmez.
const TEMA_NOKTA = [[0,0,0],[-0.5,1,8],[0.5,1,1],[-1,2,7],[0,2,40],[1,2,2],
                    [-1.5,3,6],[-0.5,3,5],[0.5,3,4],[1.5,3,3]];
const TEMA_GIREN = 12;         // giris animasyonuna alinan kart sayisi (bkz. olcum)
const TEMA_PERDE_CIKIS = 1780; // ms — perdenin solmaya basladigi an (CSS'te ayni deger)
const panelTemaMi = () => document.body.dataset.theme === 'panel';

// Kartlar sirayla girsin: sinif 900 ms yasar. renderAll her tusa basista calistigi
// icin animasyonu kalici yapmak ekrani titretirdi — bu yuzden anlik.
function temaGiris(){
  if(!panelTemaMi()) return;
  // Yalniz ilk TEMA_GIREN kart animasyonla gelir — hepsini almak 34 bilesik katman
  // demekti ve acilisi olculebilir bicimde yavaslatiyordu.
  const kartlar = document.querySelectorAll('.section');
  kartlar.forEach((c,i)=>{
    if(i < TEMA_GIREN){ c.style.setProperty('--i', Math.min(i,9)); c.classList.add('tema-gir'); }
    else c.classList.remove('tema-gir');
  });
  document.body.classList.remove('tema-giris');
  void document.body.offsetWidth;            // animasyonu yeniden tetikle
  document.body.classList.add('tema-giris');
  clearTimeout(temaGiris._z);
  temaGiris._z = setTimeout(()=>{
    document.body.classList.remove('tema-giris');
    // will-change katmanlari animasyon bitince birakilsin
    document.querySelectorAll('.section.tema-gir').forEach(c=>c.classList.remove('tema-gir'));
  }, 900);
}

// Panel temasindan CIKILDIGINDA efekt kalintilarini kaldirir: giris sinifi ve
// acilis katmanlari kendi zamanlayicilariyla da silinir ama tema degisince
// beklemenin anlami yok — baska temada ekranda is gormeyen dugum kalmasin.
function temaTemizle(){
  if(panelTemaMi()) return;
  document.body.classList.remove('tema-giris');
  ['tema-loadbeam','tema-splash'].forEach(function(id){
    var e = document.getElementById(id); if(e) e.remove();
  });
}
function temaBeam(){
  if(!panelTemaMi()) return;
  const eski = document.getElementById('tema-loadbeam');
  if(eski) eski.remove();
  const b = document.createElement('div');
  b.id = 'tema-loadbeam';
  document.body.appendChild(b);
  setTimeout(()=>{ if(b.parentNode) b.remove(); }, 1300);
}

// Acilis ucgeni — YALNIZ sayfa acilisinda ve yalnizca Panel temasiyla.
function temaSplash(){
  if(!panelTemaMi() || document.getElementById('tema-splash')) return;
  const d = document.createElement('div');
  d.id = 'tema-splash';
  // Elemanlar tek tek kurulur: innerHTML ile yazmak srcdoc icinde ham tirnak
  // gerektirirdi (bkz. CLAUDE.md §1).
  const tri = document.createElement('div');
  tri.className = 'tri';
  TEMA_NOKTA.forEach((p,i)=>{
    const nok = document.createElement('i');
    nok.style.setProperty('--x', p[0]);
    nok.style.setProperty('--y', p[1]);
    nok.style.setProperty('--i', i);
    nok.style.setProperty('--p', p[2]);
    tri.appendChild(nok);
  });
  d.appendChild(tri);
  document.body.insertBefore(d, document.body.firstChild);
  // Kartlar perde SOLMAYA BASLARKEN girer, perde kalktiktan SONRA degil: ikisi ust
  // uste binsin ve tek bir acilis gibi gorunsun. Ayri ayri olunca 'sayfa iki kez
  // aciliyor' hissi veriyordu (Cenk, 04.09.2026).
  let girisYapildi = false;
  const giris = ()=>{ if(girisYapildi) return; girisYapildi = true; temaGiris(); };
  const kapat = ()=>{
    const e = document.getElementById('tema-splash');
    if(!e) return;
    e.remove();
    giris();   // erken kapatildiysa (tik/tus) kartlar yine de girsin
  };
  // Katman HEMEN basilir (ekrani kaplasin), animasyon ancak ana is parcacigi bosalinca
  // baslar. Olculdu: agir acilisin ortasinda baslayinca ilk kareler 250 ms'ye kadar
  // dusuyordu; bos parcacikta baslayinca akiyor.
  const basla = ()=>{
    d.classList.add('oyna');
    setTimeout(giris, TEMA_PERDE_CIKIS);   // perde solmaya baslarken kartlar girsin
    setTimeout(kapat, 2450);
    ['pointerdown','keydown','wheel'].forEach(ev=>
      window.addEventListener(ev, kapat, {once:true, passive:true}));
  };
  // Iki kare bekle: rAF geri cagrilari MEVCUT is parcacigindan SONRA kosar, yani
  // buildTabs/attachListeners/renderAll zincirinin tamami bittikten sonra baslar.
  // requestIdleCallback denendi ve BIRAKILDI: 3B kurulumu arka planda surdugu
  // icin bos an gelmiyor, perde 900 ms zaman asimini bekleyip gec basliyordu
  // (olculdu: perde 2,6 sn'de hala oynuyordu).
  // requestAnimationFrame HER ORTAMDA yok (jsdom'da pretendToBeVisual kapaliyken
  // tanimsiz) — korumasiz cagri acilisi komple patlatirdi.
  if(typeof requestAnimationFrame === 'function')
    requestAnimationFrame(()=>requestAnimationFrame(basla));
  else setTimeout(basla, 0);
  return true;   // perde kuruldu — acilistaki temaGiris'i O yapacak
}

// Imlec isigi: kartin ustundeki konumu CSS degiskenine yazar (tema: .card --mx/--my).
document.addEventListener('pointermove', e=>{
  if(!panelTemaMi()) return;
  const c = e.target.closest && e.target.closest('.section');
  if(!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  c.style.setProperty('--my', (e.clientY - r.top) + 'px');
}, {passive:true});

// Acilis katmani AGIR ISTEN ONCE basilir: ekrani kaplar, kullanici bos ekran gormez
// ve animasyon (asagida, bos is parcaciginda) takilmadan baslar.
// Tema EN BASTA uygulanir. Kayitli tema attachListeners icinde okunuyordu; acilis
// perdesi ondan ONCE basildigi icin 'tema henuz yok' deyip hic gorunmuyordu

// YENİ kod (İş No + Santral Adı + Y/A/U + sıra) sadece DXF üretiminde ve Excel çıktısında
// (drawFaceSVG'nin GÖRSEL YERLEŞİM görseli + 3B TOPLU MONTAJ görseli) kullanılır — canlı 2D yüz
// düzenleme ve canlı 3D montaj görünümü eski FACE_CODE tabanlı kodu göstermeye devam eder.
// exportExcel bu bayrağı kendi başında true yapıp sonunda false'a döndürür.
var excelKodModu = false;

// Aktif AHU'daki (state.activeAhu) her panelin YENİ kodu — İş No + Santral Adı + Y/A/U + sıra
// (örn. 0469-AHU-1-Y3). DXF üretimi ve Excel bu tek kaynaktan beslenir ki ekranda görünen kod
// ile fiziksel DXF markalaması her zaman birebir aynı olsun.
// Anahtar: &quot;mi:fi:ci:pi&quot; (modül, yüz, kolon, panel indeksleri) -> kod string'i.
function buildActiveAhuKodMap(){
  var proje = (state.proje.isNo || '').trim();
  var isNoParcalari = proje.split('-');
  var isNoKisa = isNoParcalari[isNoParcalari.length - 1] || '';
  var ahu = state.ahus[state.activeAhu];
  var ahuLabel = ahu.ad || ('AHU-' + (state.activeAhu + 1));
  var kodOnEk = (isNoKisa ? isNoKisa + '-' : '') + ahuLabel.replace(/\s+/g, '') + '-';
  var yanSayac = 0, altSayac = 0, ustSayac = 0, akSayac = 0;
  var map = {};
  state.modules.forEach(function(mod, mi) {
    withModule(mi, function() {
      FACE_DEFS.forEach(function(faceDef, fi) {
        var r = computeFace(fi);
        if (!r || r.kapaksiz) return;
        var isAltUst = (fi === 2 || fi === 3);
        (r.colResults || []).forEach(function(col, ci) {
          (col.panels || []).forEach(function(p, pi) {
            if (p.bos || p.eleman || p.covered) return;
            var mapped = KAPAK_TO_HYT[p.type];
            if (!mapped) return;
            var sw = p.sabitW, sh = p.sabitH;
            if (!sw || !sh || sw <= 0 || sh <= 0) return;
            var faceHarf = isAltUst ? (fi === 2 ? 'U' : 'A') : 'Y';
            var faceNo = (faceHarf === 'U') ? ++ustSayac : (faceHarf === 'A') ? ++altSayac : ++yanSayac;
            map[mi + ':' + fi + ':' + ci + ':' + pi] = kodOnEk + faceHarf + faceNo;
          });
        });
      });
      // ARA KAT panelleri kendi sayacıyla '…-AK1, …-AK2' alır (Y/U/A ile karışmaz).
      // Yüz döngüsünün DIŞINDA, ayrı adım; kapalı ara kat hiç haritalanmaz.
      if (araKatOf(mod).aktif) {
        var ra = computeFace(ARAKAT_FI);
        (ra.colResults || []).forEach(function(col, ci) {
          (col.panels || []).forEach(function(p, pi) {
            if (p.bos || p.eleman || p.covered) return;
            if (p.type !== 'Ara Kat Paneli') return;
            var sw = p.sabitW, sh = p.sabitH;
            if (!sw || !sh || sw <= 0 || sh <= 0) return;
            map[mi + ':' + ARAKAT_FI + ':' + ci + ':' + pi] = kodOnEk + ARAKAT_CODE + (++akSayac);
          });
        });
      }
    });
  });
  return map;
}

// map'te varsa yeni kodu, yoksa (BOŞ/eleman/eksik ölçü gibi DXF'e hiç girmeyen satırlar için)
// eski FACE_CODE tabanlı kodu döndürür — böylece her satırda her zaman bir kod görünür.
function kodFor(map, mi, fi, ci, pi){
  var k = map[mi + ':' + fi + ':' + ci + ':' + pi];
  return k || (faceCodeOf(fi) + '-B' + (ci + 1) + 'K' + (pi + 1));
}

// `toplayici` bir DİZİ ise yükler f1'e postlanmaz, çağırana AHU AHU teslim edilir —
// Analiz Excel'i böylece DXF ile TEK kaynaktan beslenir ve ikinci bir panel/eleman
// tarayıcısı yazılmaz. Düğmenin click olayı fonksiyona MouseEvent geçirdiği için
// bayrak Array.isArray ile doğrulanır; başka her değer eski davranışı verir.
function exportToDxf(toplayici) {
  var topla = Array.isArray(toplayici) ? toplayici : null;
  var _bas = topla ? 'Analiz yapılamadı' : 'DXF üretilemedi';
  var _bas2 = topla ? 'Analiz yapılamıyor' : 'DXF üretilemiyor';
  var dxfIssues = collectFaceIssues();
  if(dxfIssues.length>0){
    alert(_bas + ' — önce şu sorunları düzeltin:\n\n'
      + dxfIssues.map(function(i){ return '• '+i.ahu+' — '+i.mod+' '+i.face+': '+i.text; }).join('\n'));
    return;
  }
  var proje = (state.proje.isNo || '').trim();
  var origActiveAhu = state.activeAhu;
  var totalFound = 0;
  // Bu dışa aktarım turunun İLK mesajı mı? Yalnız o mesaj f1'deki listeleri sıfırlar;
  // aynı turdaki sonraki AHU'lar üstüne EKLER (çok AHU'lu projede tek liste oluşur).
  var ilkAktarim = true;

  function openDxfTab(panels, bogazList, projeLabel, seri, tavaList, damperList, arakatList, esanjorList, kizakList, reset){
    var obj = { seri: seri, proje: projeLabel, panels: panels };
    // Bayrak olmadan 'DXF Üret'e ikinci kez basmak f1'deki listeleri ÇİFTLİYORDU:
    // eski (bayat ölçülü) kayıtlar duruyor, yenileri üstüne ekleniyor ve durum çubuğu
    // yalnız yeni gelenleri sayıyordu — DXF'e iki kat parça giriyordu.
    if(reset) obj.reset = true;
    // ANALİZ MODU: yük f1'e postlanmaz, çağırana teslim edilir. AHU indeksi
    // state.activeAhu'dan okunur — aşağıdaki döngü onu her AHU'da set ediyor.
    if(bogazList && bogazList.length > 0) obj.bogazList = bogazList;
    if(tavaList && tavaList.length > 0) obj.tavaList = tavaList;
    if(damperList && damperList.length > 0) obj.damperList = damperList;
    if(arakatList && arakatList.length > 0) obj.arakatList = arakatList;
    if(esanjorList && esanjorList.length > 0) obj.esanjorList = esanjorList;
    if(kizakList && kizakList.length > 0) obj.kizakList = kizakList;
    if(topla){ topla.push({ahuIndex: state.activeAhu, ahuAd: projeLabel, seri: seri, payload: obj}); return; }
    if(window.parent !== window){
      window.parent.postMessage({ type: 'dxfExport', payload: obj }, '*');
    }
  }

  // Tüm AHU'larda İç Sac seçili mi kontrol et
  var eksikMalzeme = [];
  state.ahus.forEach(function(ahu, ai) {
    if(!ahu.malzeme) eksikMalzeme.push(ahu.ad || ('AHU-'+(ai+1)));
  });
  if(eksikMalzeme.length > 0){
    alert(_bas2 + ' — aşağıdaki AHU\'lar için İç Sac tipi seçilmedi:\n• ' + eksikMalzeme.join('\n• ') + '\n\nProje Bilgisi bölümünden Galvaniz veya Paslanmaz seçin.');
    return;
  }

  // Tüm AHU'larda Profil Serisi seçili mi kontrol et
  var eksikProfil = [];
  state.ahus.forEach(function(ahu, ai) {
    if(!ahu.varsayimlar || !ahu.varsayimlar.seri) eksikProfil.push(ahu.ad || ('AHU-'+(ai+1)));
  });
  if(eksikProfil.length > 0){
    alert(_bas2 + ' — aşağıdaki AHU\'lar için Profil Serisi seçilmedi:\n• ' + eksikProfil.join('\n• ') + '\n\nProje Bilgisi bölümünden bir profil serisi seçin.');
    return;
  }

  state.ahus.forEach(function(ahu, ai) {
    state.activeAhu = ai;
    var seriBase = String(state.varsayimlar.seri || 60);
    var seri = seriBase + (ahu.malzeme === 'paslanmaz' ? 'P' : '');
    // ÜRETİM ADEDİ — bu santralden kaç cihaz üretilecek. Çarpım TEK yerde, aktarım
    // sınırında yapılır: f1'in tamamı (çizim, sac serme, delik sayımı, izolasyon) zaten
    // kayıtların 'adet' alanını okuyor, orada hiçbir değişiklik gerekmez.
    var kat = ahuAdet(ahu);
    var ahuLabel = ahu.ad || ('AHU-' + (ai + 1));
    var projeLabel = proje ? proje + ' — ' + ahuLabel : ahuLabel;
    var mainPanels = [];
    var altUstPanels = [];
    // Panel kodu tek kaynaktan gelir (bkz. buildActiveAhuKodMap) — 3D/yüz düzenleme/Excel ile birebir aynı.
    var kodMap = buildActiveAhuKodMap();

    state.modules.forEach(function(mod, mi) {
      withModule(mi, function() {
        FACE_DEFS.forEach(function(faceDef, fi) {
          var r = computeFace(fi);
          if (!r || r.kapaksiz) return;
          var isAltUst = (fi === 2 || fi === 3);
          (r.colResults || []).forEach(function(col, ci) {
            (col.panels || []).forEach(function(p, pi) {
              if (p.bos || p.eleman || p.covered) return;
              var mapped = KAPAK_TO_HYT[p.type];
              if (!mapped) return;
              var sw = p.sabitW, sh = p.sabitH;
              if (!sw || !sh || sw <= 0 || sh <= 0) return;
              var B = Math.max(Math.round(sw), Math.round(sh));
              var K = Math.min(Math.round(sw), Math.round(sh));
              var kod = kodMap[mi + ':' + fi + ':' + ci + ':' + pi];
              var panelObj = { kalinlik: seri, tip: mapped.tip, B: B, K: K,
                cam: mapped.cam, bogazTip: mapped.bogazTip, kod: kod, adet: kat };
              // PANELE MONTE AĞIZ: delik panelin sol-alt köşesine göre YÜZ ekseninde
              // tutulur; DXF parçası B×K çizildiği için yükseklik büyükse parça 90°
              // dönmüş demektir — delik de aynı dönüşü alır (rijit hareket, parça aynı).
              if(p.delik && p.delik.w > 0 && p.delik.h > 0){
                panelObj.delik = (sh > sw)
                  ? { w: p.delik.h, h: p.delik.w, x: p.delik.y, y: sw - p.delik.x - p.delik.w }
                  : { w: p.delik.w, h: p.delik.h, x: p.delik.x, y: p.delik.y };
              }
              panelObj.grup = isAltUst ? 'ALTUST' : 'ANA';
              if(isAltUst) altUstPanels.push(panelObj);
              else mainPanels.push(panelObj);
            });
          });
        });
      });
    });

    // ELEMAN tipleri (Boğaz / Tava / Damper) panel listesine girmez — üçü de
    // f1'de kendi çizim moduna gider. Hepsi ÖLÇÜYE GÖRE tekilleştirilip adediyle
    // aktarılır: aynı ölçüde 4 tava, tek satır + adet 4 olur.
    // Elemanda tolerans yoktur (isEleman -> 0 tol), yani p.sabitW/H girilen ölçünün
    // ta kendisidir; çizim programlarına olduğu gibi gider.
    var elemanDimMap = { 'Boğaz': {}, 'Tava': {}, 'Damper': {} };
    var arakatDimMap = {};   // ara kat panelleri — ölçüye göre tekilleştirilir
    var importedEsanjor = [];   // eşanjör setleri — modül başına en fazla bir tane
    var importedKizak   = [];   // batarya kızağı takımları — batarya başına bir tane
    state.modules.forEach(function(mod, mi) {
      withModule(mi, function() {
        FACE_DEFS.forEach(function(faceDef, fi) {
          var r = computeFace(fi);
          if (!r || r.kapaksiz) return;
          (r.colResults || []).forEach(function(col) {
            (col.panels || []).forEach(function(p) {
              // PANELE MONTE AĞIZ: göz değil, panelin deliğidir — boğaz/damper seti yine
              // üretilmeli, yoksa kanal ağzı hiç imal edilmezdi.
              if (p.delik && p.delik.w > 0 && p.delik.h > 0) {
                var dHar = elemanDimMap[p.delik.tip === 'Damper' ? 'Damper' : 'Boğaz'];
                var dKey = Math.round(p.delik.w) + '|' + Math.round(p.delik.h);
                dHar[dKey] = (dHar[dKey] || 0) + 1;
              }
              if (!p.eleman) return;
              var harita = elemanDimMap[p.type];
              if (!harita) return;
              // Yönlü elemanda (Damper/Boğaz) ölçüler çizim eşlemesine göre takas edilir.
              // Anahtar takas SONRASI ölçüdür: aynı parçaları veren yatay 1250×450 ile
              // dikey 450×1250 tek satırda toplanır, bölme eşiği de doğru ölçüye bakar.
              // Yönsüz elemanda (Tava) fonksiyon ölçüyü olduğu gibi döndürür.
              var co = elemanCizimOlcusu(p);
              var sw = co.w, sh = co.h;
              if (!sw || !sh || sw <= 0 || sh <= 0) return;
              var key = Math.round(sw) + '|' + Math.round(sh);
              harita[key] = (harita[key] || 0) + 1;
            });
          });
        });
        // ARA KAT — yüz döngüsünün DIŞINDA, ayrı adım. Gözlerdeki damperler mevcut damper
        // listesine KATILIR (aynı ölçüdekiler tek satırda toplanır); ara kat panelleri
        // kendi haritasına gider.
        // EŞANJÖR — ara kat gibi yüz döngüsünün DIŞINDA, ayrı adım. Ölçüler modülden
        // türer (esanjorOlculeri); f1'in beklediği kayıt şekli burada kurulur.
        // Geçersiz eşanjör buraya hiç gelmez: collectFaceIssues dışa aktarımı kilitler.
        if (esanjorOf(mod).aktif) {
          var eo = esanjorOlculeri();
          if (eo.gecerli) {
            // Eşanjör kaydında 'adet' alanı YOKTUR — f1'de her kayıt bir cihaz setidir
            // (modül başına en fazla bir eşanjör). Üretim adedi bu yüzden kaydı KAT KEZ
            // ekleyerek verilir; f1'in çizim ve sac serme kodu değişmez.
            for (var _e = 0; _e < kat; _e++) {
              importedEsanjor.push({
                kalinlik: seriBase, CI: eo.CI,
                O1: eo.O1, O2: eo.O2, O3: eo.O3, O4: eo.O4,
                o1_15: ESANJOR_15MM.o1, o2_15: ESANJOR_15MM.o2,
                o3_15: ESANJOR_15MM.o3, o4_15: ESANJOR_15MM.o4,
                kod: eo.es.kod || ''
              });
            }
          }
        }
        // BATARYA KIZAĞI — eşanjör gibi yüz döngüsünün DIŞINDA, ayrı adım. Ölçüler
        // modülden ve föydeki HR'den türer (kizakOlculeri). Geçersiz kızak buraya hiç
        // gelmez: collectFaceIssues dışa aktarımı kilitler.
        if (kizakOf(mod).aktif) {
          var ko = kizakOlculeri();
          if (ko.gecerli) {
            ko.bataryalar.forEach(function(b){
              // Kayıtta 'adet' PARÇA ÇİFTİ sayısıdır (her parçadan 2 adet); üretim adedi
              // onunla ÇARPILIR — eşanjördeki 'kaydı kat kez ekle' yolu burada gerekmez.
              importedKizak.push({
                kalinlik: seriBase, seri: ko.seri, boy: Math.round(ko.boy),
                kanat: b.kanat, rol: b.rol, ad: b.ad, HR: b.HR,
                adet: KIZAK_TAKIM_ADET * kat
              });
            });
          }
        }
        if (araKatOf(mod).aktif) {
          var ra = computeFace(ARAKAT_FI);
          (ra.colResults || []).forEach(function(col) {
            (col.panels || []).forEach(function(p) {
              if (p.bos || p.covered) return;
              // Ara kat gözündeki damper de yönlüdür; ara kat PANELİ yönsüz olduğu için
              // fonksiyon onun ölçüsünü olduğu gibi döndürür (akKey değişmez).
              var co = elemanCizimOlcusu(p);
              var sw = co.w, sh = co.h;
              if (!sw || !sh || sw <= 0 || sh <= 0) return;
              // Anahtar ÇİZİM TİPİNİ de taşır: aynı ölçüdeki profilli (4.5X3) ve profilsiz
              // (5X3) panel farklı parçadır, tek satırda toplanamaz.
              var akTip = (ARAKAT_PROFILLER[araKatOf(mod).profil] || ARAKAT_PROFILLER['30x30']).tip;
              var key = Math.round(sw) + '|' + Math.round(sh);
              if (p.type === 'Ara Kat Paneli') {
                var akKey = akTip + '|' + key;
                arakatDimMap[akKey] = (arakatDimMap[akKey] || 0) + 1;
              }
              else if (p.type === 'Damper') elemanDimMap['Damper'][key] = (elemanDimMap['Damper'][key] || 0) + 1;
            });
          });
        }
      });
    });
    function elemanKayitlari(tip, yap) {
      var harita = elemanDimMap[tip];
      return Object.keys(harita).map(function(k) {
        var pts = k.split('|');
        return yap(parseInt(pts[0]), parseInt(pts[1]), harita[k] * kat);
      });
    }
    var importedBogaz = elemanKayitlari('Boğaz', function(w, h, adet) {
      return { ybp: w, dbp: h, adet: adet };
    });
    // Tava: girilen ölçü PANEL/açıklık ölçüsüdür; çizim programı 45'i kendi düşer
    // (panel 600 geniş x 1350 yüksek -> gövde 555 x 1305). Cihaz tipi profil serisinden
    // gelir; özel seri tanımlıysa tava tarafı 60'lık paya düşer (TAVA_ALT varsayılanı).
    // GENİŞLİK ve YÜKSEKLİK ayrı anlamlıdır — büyük/küçük diye normalize EDİLMEZ:
    // tavanın üst büküm payı (52.5) ile alt büküm payı (60'lık 77.5 / 50'lik 62.5)
    // FARKLIDIR, yani gövde boyu ekseni fiziksel olarak asimetriktir. İki ölçüyü takas
    // etmek başka bir tava çizer. sabitW -> gövde eni (W), sabitH -> gövde boyu (H).
    var importedTava = elemanKayitlari('Tava', function(w, h, adet) {
      return { cihaz: seriBase, genislik: w, yukseklik: h, adet: adet };
    });
    // Damper: GENİŞLİK ve YÜKSEKLİK ayrı anlamlıdır — büyük/küçük diye
    // normalize EDİLMEZ. Yüzün kendi ekseninde sabitW = genişlik, sabitH = yükseklik;
    // çerçevenin yatay parçası genişliği, dikey parçası yüksekliği takip eder
    // (yatay kenar = genişlik+40, dikey = yükseklik−13.6).
    // İkiye bölme YALNIZCA genişliğe bakar: 1800+ genişlik bölünür, yükseklik bölmez.
    var importedDamper = elemanKayitlari('Damper', function(w, h, adet) {
      return { genislik: w, yukseklik: h, adet: adet };
    });
    // Ara kat paneli: f1'in ARA KAT modülüne gider. Kayıt şekli oradaki elle girişle aynı
    // ({tip, B, K, adet}) ve tip her iki profil için de '4.5X3' — 30×30 ile 30×60 arasındaki
    // fark parçanın kendisinde değil, iç ölçüyü ne kadar daralttığındadır (p). B/K normalize
    // edilir çünkü ara kat parçası bu eksende simetriktir (kaldırılan elle giriş de öyle yapıyordu).
    var importedArakat = Object.keys(arakatDimMap).map(function(k) {
      var pts = k.split('|');
      var w = parseInt(pts[1]), h = parseInt(pts[2]);
      return { tip: pts[0], B: Math.max(w, h), K: Math.min(w, h), adet: arakatDimMap[k] * kat };
    });

    var allPanels = mainPanels.concat(altUstPanels);
    if(allPanels.length > 0 || importedBogaz.length > 0 || importedTava.length > 0
       || importedDamper.length > 0 || importedArakat.length > 0 || importedEsanjor.length > 0
       || importedKizak.length > 0){
      openDxfTab(allPanels, importedBogaz, projeLabel, seri, importedTava, importedDamper, importedArakat, importedEsanjor, importedKizak, ilkAktarim);
      ilkAktarim = false;
      totalFound++;
    }
  });

  state.activeAhu = origActiveAhu;

  if(totalFound === 0){
    alert((topla ? 'Analiz edilecek' : 'DXF üretilecek') + ' panel, boğaz, tava, damper veya ara kat bulunamadı.\nLütfen modül ölçülerini (W/H/L) girin ve yüzlere kapak/eleman ekleyin.\n\nNot: Boş Alan tipi DXFʼye aktarılmaz.');
  }
}

// ==================== ANALİZ EXCEL ÇIKTISI ====================
// SANTRAL BAZLI (Cenk, 31.08.2026): her AHU kendi dosyasını alır ve sac plakası sayısı
// yalnız o santralin parçalarından çıkar — rakam santrale atfedilebilir olsun diye.
// Kapı Kapak Hesabı Excel'iyle aynıdır (collectFaceIssues); yükler exportToDxf'in
// toplayıcısından gelir, yani DXF'e giden neyse analiz de onu sayar.
async function exportAnalizExcel(){
  const note = document.getElementById('excel_note');
  const issues = collectFaceIssues();
  if(issues.length>0){
    alert('Analiz alınamadı — önce şu sorunları düzeltin:\n\n'
      + issues.map(i=>'• '+i.ahu+' — '+i.mod+' '+i.face+': '+i.text).join('\n'));
    return;
  }
  if(typeof ExcelJS==='undefined'){
    note.textContent = '⚠ ExcelJS kütüphanesi yüklenemedi — internet bağlantısı gereklidir (cdnjs).';
    return;
  }
  const yukler = [];
  exportToDxf(yukler);                 // kendi kapılarını da uygular; boşsa uyarısını kendi verir
  if(!yukler.length) return;

  const stok = {boy: analizStok.boy, pay: analizStok.pay};
  const origActiveAhu = state.activeAhu;
  const hatalar = [];              // santral başına toplanan hatalar (tur durmaz)
  const sanitizeF = s => s.replace(/[\\/:*?&quot;<>|]/g,'').replace(/\s+/g,'_');
  let indirilen = 0;
  // Cok santralli projede dosyalar TEK ZIP olarak iner (bkz. coklaIndir).
  const analizToplama = [];
  try{
    for(let i=0;i<yukler.length;i++){
      const y = yukler[i];
      const ahuAd = state.ahus[y.ahuIndex] ? (state.ahus[y.ahuIndex].ad || ('AHU-'+(y.ahuIndex+1))) : y.ahuAd;
      note.textContent = (yukler.length>1 ? '['+(i+1)+'/'+yukler.length+'] ' : '')
        + 'Analiz hesaplanıyor… ' + ahuAd;

      // Bir santralin analizi patlarsa DİĞERLERİ ETKİLENMEZ: hata toplanır, döngü
      // devam eder, sonunda hangi santralin alınamadığı yazılır. Eskiden tek bir hata
      // (ör. f1 zaman aşımı ya da sac hesabı) bütün turu durduruyordu — kullanıcı
      // yalnız o ana kadar inen dosyaları görüyor, sebebini göremiyordu.
      try{
      // f1: sac serme + kapak deliği. Bekleme burada — hesap DXF sekmesinde yapılıyor.
      const f1 = await analizIste(y.payload);

      state.activeAhu = y.ahuIndex;
      const V = getV();
      const profilAileleri = analizProfilAileleri();
      const plastik = analizPlastikler();
      const planlar = profilAileleri.map(a=>({
        aile: a, plan: profilKesimPlani(a.kalemler, stok.boy, stok.pay)
      }));
      const toplamBoy = planlar.reduce((t,p)=>t+p.plan.boyAdedi, 0);

      const wb = new ExcelJS.Workbook();
      wb.creator = 'Cenk Altınay';
      wb.lastModifiedBy = 'Cenk Altınay';
      wb.created = new Date();

      // ---- ÖZET ----
      const wsO = wb.addWorksheet('ÖZET');
      wsO.columns = [{width:38},{width:20},{width:16},{width:16},{width:16}];
      xlDevFooter(wsO);
      wsO.getCell(1,1).value = 'Cenk Altınay';
      wsO.getCell(1,1).font = XL_DEV_FONT;
      const kat = aktifAdet();
      let rr = xlTable(wsO, 2, 'ANALİZ — MALZEME TÜKETİMİ', ['Alan','Değer'], [
        ['İş Numarası', state.proje.isNo || '—'],
        ['Santral Adı', ahuAd],
        ['Üretim Adedi', kat + (kat > 1 ? ' cihaz — aşağıdaki bütün miktarlar TOPLAMDIR' : ' cihaz')],
        ['Profil Serisi', V.seri],
        ['İç Sac', state.ahus[y.ahuIndex] ? (state.ahus[y.ahuIndex].malzeme || '—') : '—'],
        ['Modül Sayısı', state.modules.length],
        ['Sac Plakası (mm)', f1.sacW + ' × ' + f1.sacH],
        ['Profil Stok Boyu (mm)', stok.boy],
        ['Testere Payı (mm)', stok.pay],
        ['Toplam Sac Plakası', f1.toplamPlaka],
        ['Toplam Profil Boyu', toplamBoy],
        ['Toplam Sac Ağırlığı (kg)', Number(f1.toplamKg.toFixed(1))]
      ]);
      // SATIN ALMA KALEMLERİ — Cenk'in 31.08.2026'da verdiği liste. Tek bir 'toplam
      // profil' / 'toplam sac' satırı yerine HER KALEM AYRI: sipariş bu tablodan verilir,
      // ve farklı kesitten profil ile farklı kalınlıktan sac tek kalemde toplanamaz.
      const kalemler = [];
      // 1-2) Profil aileleri — her biri kendi stok boyundan kesilir
      planlar.forEach(function(x){
        kalemler.push([x.aile.ad, x.plan.boyAdedi, 'boy',
          x.plan.parcaAdedi+' parça · '+(x.plan.netMm/1000).toFixed(1)+' m net · fire %'
            + x.plan.firePercent.toFixed(1)
            + (x.aile.eksik ? ' · ⚠ '+x.aile.eksik+' parça ölçüsü eksik' : '')]);
      });
      // 3,5,6,7) Sac plakaları — kalınlık + malzeme bazında, kalından inceye
      f1.gruplar.forEach(function(g){
        const icerik = String(g.etiket).split(' — ')[1] || '';
        kalemler.push([sacKalemAdi(g), g.plaka, 'plaka',
          f1.sacW+'×'+f1.sacH+' mm · '+g.kg.toFixed(1)+' kg · fire %'+g.fire.toFixed(1)
            + (icerik ? ' · '+icerik : '')]);
      });
      // 4) İzolasyon — kapağın kesim ölçüsünden, kalınlık profil serisini izler
      (f1.izolasyon||[]).forEach(function(iz){
        kalemler.push(['İzolasyon (Kayayünü '+iz.kalinlikMm+' mm)', Number(iz.m2.toFixed(2)), 'm²',
          'kapakların kesim ölçüsünden (B×K)']);
      });
      // Sarf
      kalemler.push(['Köşe plastiği (3 yönlü)', plastik.kose, 'adet',
        state.modules.length+' modül × 8 köşe' + (kat>1 ? ' × '+kat+' cihaz' : '')]);
      kalemler.push(['Takviye plastiği', plastik.takviye, 'adet',
        plastik.takviyePlastikVar ? plastik.takviyeParca+' takviye × 2 uç' : 'bu profilde kullanılmıyor']);
      if(kat > 1) kalemler.push(['— not —', kat, 'cihaz',
        'Bütün miktarlar '+kat+' cihazın toplamıdır; bir cihazın kesim listesi Kapak Hesabı Excel dosyasındadır.']);
      kalemler.push(['Vida', f1.delik.vida, 'adet', 'kapak panelleri — dış sac']);
      kalemler.push(['Perçin', f1.delik.percin, 'adet', 'kapak panelleri — iç/dış aynı delik, bir kez']);
      rr = xlTable(wsO, rr, 'SATIN ALMA KALEMLERİ', ['Kalem','Miktar','Birim','Not'], kalemler);

      // ---- SAC ----
      const wsS = wb.addWorksheet('SAC');
      wsS.columns = [{width:34},{width:12},{width:12},{width:10},{width:12},{width:12},{width:12}];
      xlDevFooter(wsS);
      let rs = xlTable(wsS, 1, 'SAC PLAKASI — NESTING SONUCU ('+f1.sacW+'×'+f1.sacH+' mm, parça boşluğu '+f1.gap+' mm)',
        ['Grup','Kalınlık (mm)','Malzeme','Plaka','Parça','Ağırlık (kg)','Fire (%)'],
        f1.gruplar.map(g=>[g.etiket, g.gaugeMm, g.malzeme, g.plaka, g.parca,
          Number(g.kg.toFixed(1)), Number(g.fire.toFixed(1))]));
      rs = xlTable(wsS, rs, 'TOPLAM', ['Kalem','Değer'], [
        ['Plaka sayısı', f1.toplamPlaka],
        ['Ağırlık (kg)', Number(f1.toplamKg.toFixed(1))],
        ['Fire (%)', Number(f1.fire.toFixed(1))]
      ]);
      wsS.getCell(rs,1).value = 'Gruplama SAC KALINLIĞINA (+ malzemeye) göredir, kategoriye değil: aynı '
        + 'kalınlıktaki panel, boğaz, damper, tava ve ara kat parçaları aynı plakaya yerleşir. '
        + 'Paslanmaz cihazda yalnız İÇ sac paslanmazdır, DIŞ sac galvanizdir.';
      wsS.getCell(rs,1).font = XL_DEV_FONT;

      // ---- PROFİL ----
      const wsP = wb.addWorksheet('PROFİL');
      wsP.columns = [{width:38},{width:14},{width:12},{width:14},{width:14},{width:12}];
      xlDevFooter(wsP);
      let rp = xlTable(wsP, 1, 'PROFİL KESİM PLANI — '+stok.boy+' mm STOK BOYU (testere payı '+stok.pay+' mm)',
        ['Profil Ailesi','Parça Adedi','Net (m)','Kullanılan Boy','Stok (m)','Fire (%)'],
        planlar.map(x=>[x.aile.ad, x.plan.parcaAdedi, Number((x.plan.netMm/1000).toFixed(2)),
          x.plan.boyAdedi, Number((x.plan.stokMm/1000).toFixed(2)), Number(x.plan.firePercent.toFixed(1))]));
      rp = xlTable(wsP, rp, 'TOPLAM PROFİL', ['Kalem','Değer'], [['Kullanılan boy sayısı', toplamBoy]]);

      // Aile başına parça dökümü ve boyların içine ne girdiği — atölye bu tabloyla keser.
      planlar.forEach(x=>{
        rp = xlTable(wsP, rp, x.aile.ad + ' — PARÇA DÖKÜMÜ', ['Boy (mm)','Adet','Toplam (m)'],
          x.aile.kalemler.map(k=>[Math.round(k.boy), k.adet, Number((k.boy*k.adet/1000).toFixed(2))])
            .concat(x.aile.eksik ? [['ÖLÇÜ EKSİK', x.aile.eksik, '—']] : []));
        rp = xlTable(wsP, rp, x.aile.ad + ' — BOY BOY KESİM', ['Boy No','Parçalar (mm)','Kullanılan (mm)','Artık (mm)'],
          x.plan.boylar.map((b,bi)=>[bi+1, b.parcalar.map(v=>Math.round(v)).join(' + '),
            Math.round(b.kullanilan), Math.round(stok.boy - b.kullanilan)])
            .concat(x.plan.sigmayan.length
              ? [['⚠ SIĞMAYAN', x.plan.sigmayan.map(v=>Math.round(v)).join(' , '), 'stok boyundan uzun', '—']]
              : []));
      });

      // ---- SARF ----
      const wsF = wb.addWorksheet('SARF');
      wsF.columns = [{width:34},{width:14},{width:14},{width:40}];
      xlDevFooter(wsF);
      let rf = xlTable(wsF, 1, 'PLASTİK', ['Kalem','Adet','Birim','Kaynak'], [
        ['Köşe plastiği (3 yönlü)', plastik.kose, 'adet',
          state.modules.length+' modül × 8 köşe' + (kat>1 ? ' × '+kat+' cihaz' : '')],
        ['Takviye plastiği', plastik.takviye, 'adet',
          plastik.takviyePlastikVar
            ? plastik.takviyeParca+' takviye parçası × 2 uç (profil payı '+V.takviyePlastik+' mm)'
            : 'profilde takviye plastiği tanımlı değil']
      ]);
      const tipAd = {SABIT:'Sabit kapak', ACILIR:'Açılır kapak', BOGAZ:'Boğazlı kapak', UST:'Üst panel'};
      const dTipler = f1.delik.tipler || {};
      rf = xlTable(wsF, rf, 'VİDA VE PERÇİN — KAPAK PANELLERİ', ['Panel Tipi','Vida','Perçin'],
        Object.keys(dTipler).sort().map(t=>[tipAd[t]||t, dTipler[t].vida, dTipler[t].percin])
          .concat([['TOPLAM', f1.delik.vida, f1.delik.percin]]));
      wsF.getCell(rf,1).value = 'Perçin İÇ sacdan, vida DIŞ sacdan sayılır. Perçin iki sacı birbirine '
        + 'bağlar ve her iki sacda AYNI deliğe atılır (ölçüldü: iç ve dış perçin sayısı her varyantta '
        + 'eşit), bu yüzden iki kez sayılmaz. Vida dış sacdan profile takılır; paslanmaz iç sacındaki '
        + 'slot aynı vidanın geçiş yeridir. Sayı, gerçekten kesilen DXF parçasının üzerinden ölçülür.';
      wsF.getCell(rf,1).font = XL_DEV_FONT;

      const buf = await wb.xlsx.writeBuffer();
      const parts = [];
      if(state.proje.isNo) parts.push(sanitizeF(state.proje.isNo));
      if(ahuAd) parts.push(sanitizeF(ahuAd));
      parts.push('ANALIZ');
      analizToplama.push({ad: parts.join('_')+'.xlsx', veri: buf});
      indirilen++;
      }catch(err){
        hatalar.push(ahuAd + ' — ' + (err && err.message ? err.message : err));
      }
    }
    const analizZip = (state.proje.isNo ? sanitizeF(state.proje.isNo)+'_' : '') + 'ANALIZ.zip';
    const analizInen = coklaIndir(analizToplama, analizZip);
    const basari = indirilen>1
      ? '✓ '+indirilen+' santral için analiz dosyaları indirildi'
        + (analizToplama.length > 1 && analizInen ? ' — TEK ZIP içinde: '+analizInen : '')+'.'
      : (indirilen===1 ? '✓ Analiz dosyası indirildi (ÖZET + SAC + PROFİL + SARF).' : '');
    note.textContent = basari + (hatalar.length
      ? (basari ? '  ' : '') + '⚠ Alınamayan santral: ' + hatalar.join(' | ')
      : '');
  }catch(err){
    note.textContent = '⚠ Analiz hatası: ' + (err && err.message ? err.message : err);
  }finally{
    state.activeAhu = origActiveAhu;
  }
}
