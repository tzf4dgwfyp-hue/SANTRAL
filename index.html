// ---------- 3B GÖRÜNÜM VERİSİ ----------
// Bu bölüm yalnızca geometri/veri üretir (faceLayoutRects, faceUVtoXYZ). Gerçek 3B render
// (kamera, ışık, derinlik testi, tıklama) sayfa sonundaki Three.js modülünde yapılır — bkz.
// <script type=&quot;module&quot;> bloğu. window.APP üzerinden bu fonksiyonlara erişir.
const EL3_DEPTH = 150; // Damper/Boğaz dışa çıkıntısı (mm) — yalnızca görsel
const PH3 = {W:800, H:1200, L:1400}; // ölçü girilmemişse temsili prizma

// Yüzün mm cinsinden hücre geometrisi (u: yüz yatayı, v: yüz dikeyi, sol-üst orijin)
function faceLayoutRects(fi){
  const r = computeFace(fi);
  // 3B sahnesi YALNIZCA 6 yüzden beslenir — ara kat modülün içinde kaldığı için
  // buraya hiç girmez, bu yüzden çözücüler değil doğrudan diziler kullanılır.
  const face = state.faces[fi], def = FACE_DEFS[fi];
  const V = r.V;
  const kodMap = excelKodModu ? buildActiveAhuKodMap() : null;
  const mi = state.active;
  const FW = (Number(state.dims[def.wKey])||0) > 0 ? Number(state.dims[def.wKey]) : PH3[def.wKey];
  const FH = (Number(state.dims[def.hKey])||0) > 0 ? Number(state.dims[def.hKey]) : PH3[def.hKey];
  const k = V.kenar, tk = V.takviye;
  const kp = V.kose, tp3 = V.takviyePlastik;
  const PL3 = '#10161d';
  // Her takviye kendi süreklilik durumuna göre renklenir (bkz. drawFaceSVG'deki 2B aynası — r.bars)
  const CONT3 = '#547a96', SEG3 = '#3d5568';
  const innerBarR = [], colBarR = [];   // ayrılmış/birleşik barlar en son eklenir (3B'de üstte)
  const gapAcrossMm = face.columns.map(()=>({})); // açık her ara takviyenin mm across-konumu, [ci][gi]
  const rects = [], labels = [];
  rects.push({u0:0,v0:0,u1:FW,v1:FH, fill:'#131d27'});
  rects.push({u0:0,v0:0,u1:FW,v1:k, fill:'#22303d'});
  rects.push({u0:0,v0:FH-k,u1:FW,v1:FH, fill:'#22303d'});
  rects.push({u0:0,v0:0,u1:k,v1:FH, fill:'#22303d'});
  rects.push({u0:FW-k,v0:0,u1:FW,v1:FH, fill:'#22303d'});
  // Köşe plastikleri (görsel) — profilde köşe plastiği yoksa çizilmez
  if(kp>0) [[0,0],[FW-kp,0],[0,FH-kp],[FW-kp,FH-kp]].forEach(cc=>{
    rects.push({u0:cc[0],v0:cc[1],u1:cc[0]+kp,v1:cc[1]+kp, fill:PL3});
  });
  if(face.kapaksiz){
    labels.push({u:FW/2, v:FH/2, text:'KAPAKSIZ'});
    return {FW,FH,rects,labels};
  }
  const orient = face.orient;
  const alongLen = orient==='H'?FW:FH, acrossLen = orient==='H'?FH:FW;
  const icAcross = acrossLen-2*k;
  const icKullAlong = alongLen-2*k-r.anaTakAdedi*tk;
  const colSizes = r.colResults.map(c=>c.colSize);
  const tot = colSizes.reduce((a,b)=>a+(b>0?b:0),0);
  const zc = colSizes.filter(x=>x<=0).length;
  const phCol = zc>0 ? Math.max((icKullAlong-tot)/zc, icKullAlong*0.1) : 0;

  // SATIR BAZLI YERLEŞİM — 2B aynası drawFaceSVG ile BİREBİR aynı çözücü; tek fark birim
  // (mm) ve ölçüsüz bölümler için yer tutucu (phCol) kullanılması.
  const colMmOf = ci=>{ const c = r.colResults[ci]; return c.colSize>0 ? c.colSize : phCol; };
  const cellMmOf = (ci,pi)=>{ const p = r.colResults[ci].panels[pi]; return (p.pColSize||0)>0 ? p.pColSize : colMmOf(ci); };
  const L3 = resolveColumnLayout(r.colResults, face, r.bars.ana, cellMmOf, colMmOf, tk);
  const startOf3 = (ci,pi)=> k + L3.start[ci][pi];
  const junction3 = (ci,seg)=> k + L3.junctionX[ci][Math.min(seg, L3.junctionX[ci].length-1)];
  const araSpan3 = m=>{
    const cRes = r.colResults[m.ci];
    const a = m.gi, b2 = Math.min(m.gi+1, cRes.panels.length-1);
    return {left:  Math.max(startOf3(m.ci,a), startOf3(m.ci,b2)),
            right: k + Math.max(L3.rightAt(m.ci,a), L3.rightAt(m.ci,b2))};
  };

  r.colResults.forEach((cRes,ci)=>{
    const col = face.columns[ci];
    const colMm = colMmOf(ci);
    const alongOf = pi => startOf3(ci, pi);

    const icCol = icAcross - cRes.innerTakAdedi*tk;
    const effs = cRes.panels.map(p=>p.auto?icCol:p.entered);
    const ptot = effs.reduce((a,b)=>a+(b>0?b:0),0);
    const pzc = effs.filter(x=>x<=0).length;
    const phP = pzc>0?Math.max((icCol-ptot)/pzc, icCol*0.12):0;
    let pc = k;
    cRes.panels.forEach((p,pi)=>{
      const pm = effs[pi]>0?effs[pi]:phP;
      const pColMm = (p.pColSize||0) > 0 ? p.pColSize : colMm;
      const alongMm = alongOf(pi);
      const rc = orient==='H'
        ? {u0:alongMm, v0:pc, u1:alongMm+pColMm, v1:pc+pm}
        : {u0:pc, v0:alongMm, u1:pc+pm, v1:alongMm+pColMm};
      rc.fill = TYPE_COLORS[p.type]||'#34495e';
      if(p.eleman){ rc.eleman = true; rc.elType = p.type; rc.lbl = FACE_CODE[fi]+'-B'+(ci+1)+'K'+(pi+1);
        // TAM BOĞAZ: 3B etiketi de İMALAT ölçüsünü yazar (2B ile aynı sayı); alan
        // yalnız dolu olduğunda eklenir ki deliksiz/tam boğazsız çıktı değişmesin.
        if(p.elemanOlcu) rc.olcu = Math.round(p.elemanOlcu.w)+'×'+Math.round(p.elemanOlcu.h);
      }
      // Çizim yönü 3B'de damper kanatlarını döndürür. `bos`/`acilir` gibi YALNIZ dolu
      // olduğunda eklenir — yatay (varsayılan) yüzlerde bu çıktı bayt bayt eskisi gibi kalsın.
      if(p.yon==='dikey') rc.yon = 'dikey';
      // PANELE MONTE AĞIZ: boğaz panelin ÜZERİNDE durur; 3B onu bu kutudan çizer.
      // delik.x/y panelin KESİM dikdörtgeninin sol-ALT köşesine göredir (DXF yönü),
      // buradaki v ekseni ise YUKARIDAN aşağı ilerler — bu yüzden çevrilir. Alan
      // yalnız dolu olduğunda eklenir (`yon`/`bos` deseni) ki deliksiz yüzlerde bu
      // çıktı bayt bayt eskisi gibi kalsın.
      if(p.delik && orient==='H'){
        const tw = (Number(V.tolW)||0)/2, th = (Number(V.tolH)||0)/2;
        const du0 = rc.u0 + tw + p.delik.x, dv1 = rc.v1 - th - p.delik.y;
        rc.delik = { u0: du0, u1: du0 + p.delik.w, v0: dv1 - p.delik.h, v1: dv1,
                     tip: p.delik.tip, lbl: FACE_CODE[fi]+'-B'+(ci+1)+'K'+(pi+1) };
      }
      if(p.bos) rc.bos = true;
      if(p.acilir) rc.acilir = true;
      // Birleştirilmiş kapağın kapladığı hücre 3B'de de üretilmez (2B aynası ile aynı kural) —
      // soldaki yayılan kapağın tek geniş yüzeyi onun yerini de kaplar.
      if(!p.covered){
        rects.push(rc);
        if(p.type==='Camlı Açılır'){
          rects.push({circle:true, cu:(rc.u0+rc.u1)/2, cv:(rc.v0+rc.v1)/2,
            r: Math.min(GLASS_R_MM, Math.min(rc.u1-rc.u0, rc.v1-rc.v0)*0.42), fill:'rgba(127,200,220,0.30)'});
        }
        if(!p.eleman) labels.push({u:(rc.u0+rc.u1)/2, v:(rc.v0+rc.v1)/2, text: p.bos ? 'BOŞ' : (excelKodModu ? kodFor(kodMap, mi, fi, ci, pi) : (FACE_CODE[fi]+'-B'+(ci+1)+'K'+(pi+1))), size: `${Math.round(rc.u1-rc.u0)}×${Math.round(rc.v1-rc.v0)}`, type: p.type, bos: !!p.bos});
      }
      pc += pm;
      if(pi<cRes.panels.length-1 && col.innerGaps[pi]){
        gapAcrossMm[ci][pi] = pc;
        // Zincir üyesi barlar tek parça olarak döngü sonrasında eklenir
        if(r.bars.araChainIdx[ci][pi] === undefined){
          // Kademeli düzende bar EN DIŞ kenara kadar uzanır (2B aynası ile aynı kural);
          // kademesiz durumda iki kenar zaten aynı olduğundan bugünkü sonuçla birebir aynıdır.
          const sp = araSpan3({ci, gi:pi});
          const tr = orient==='H'
            ? {u0:sp.left,v0:pc,u1:sp.right,v1:pc+tk}
            : {u0:pc,v0:sp.left,u1:pc+tk,v1:sp.right};
          tr.fill=SEG3; innerBarR.push(tr);
          if(tp3>0){
            if(orient==='H'){
              innerBarR.push({u0:tr.u0,v0:tr.v0,u1:tr.u0+tp3,v1:tr.v1, fill:PL3});
              innerBarR.push({u0:tr.u1-tp3,v0:tr.v0,u1:tr.u1,v1:tr.v1, fill:PL3});
            } else {
              innerBarR.push({u0:tr.u0,v0:tr.v0,u1:tr.u1,v1:tr.v0+tp3, fill:PL3});
              innerBarR.push({u0:tr.u0,v0:tr.v1-tp3,u1:tr.u1,v1:tr.v1, fill:PL3});
            }
          }
        }
        pc+=tk;
      }
    });
    if(ci<r.colResults.length-1 && face.colGaps[ci]){
      const bAna = r.bars.ana[ci];
      // 2B aynası drawFaceSVG ile BİREBİR aynı mantık: bar, KESİLMİŞ seviyelerden
      // (bAna.cutLevels) segmentlere ayrılır; birleşik kapağın kapladığı bant çizilmez.
      // Hiç kesim yoksa tek segment çıkar = eski &quot;boydan boya sürekli&quot; çizimin aynısı.
      if(bAna && !bAna.fullySuppressed){
        const aEnd = (orient==='H') ? FH-k : FW-k;
        const xOf = seg => junction3(ci, seg);
        const fill3 = bAna.splitValid ? SEG3 : CONT3;
        const boundsMm = bAna.cutLevels.map(ix=>gapAcrossMm[ci][ix]).filter(v=>v!=null).sort((a,b)=>a-b);
        let segStart = k;
        const bounds = [];
        boundsMm.forEach(b=>{ bounds.push([segStart,b]); segStart = b+tk; });
        bounds.push([segStart, aEnd]);
        bounds.forEach((bd,seg)=>{
          if(bAna.segments[seg] && bAna.segments[seg].suppressed) return; // o bant birleşik kapak
          const s0=bd[0], s1=bd[1];
          if(s1-s0 < 1) return;
          const segX = xOf(seg);
          const tr = orient==='H'
            ? {u0:segX,v0:s0,u1:segX+tk,v1:s1}
            : {u0:s0,v0:segX,u1:s1,v1:segX+tk};
          tr.fill=fill3; colBarR.push(tr);
          if(tp3>0){
            if(orient==='H'){
              colBarR.push({u0:tr.u0,v0:s0,u1:tr.u1,v1:s0+tp3, fill:PL3});
              colBarR.push({u0:tr.u0,v0:s1-tp3,u1:tr.u1,v1:s1, fill:PL3});
            } else {
              colBarR.push({u0:s0,v0:tr.v0,u1:s0+tp3,v1:tr.v1, fill:PL3});
              colBarR.push({u0:s1-tp3,v0:tr.v0,u1:s1,v1:tr.v1, fill:PL3});
            }
          }
        });
      }
    }
  });
  // BİRLEŞİK (zincir) ARA TAKVİYELER — kaç bölüm sürerse sürsün TEK parça (2B aynası ile aynı)
  r.bars.araChains.forEach(ch=>{
    const acrossMm = gapAcrossMm[ch.members[0].ci][ch.members[0].gi];
    if(acrossMm==null) return;
    const s0 = araSpan3(ch.members[0]).left;
    const s1 = araSpan3(ch.members[ch.members.length-1]).right;
    if(s1-s0 < 1) return;
    const tr = orient==='H'
      ? {u0:s0,v0:acrossMm,u1:s1,v1:acrossMm+tk}
      : {u0:acrossMm,v0:s0,u1:acrossMm+tk,v1:s1};
    tr.fill=CONT3; innerBarR.push(tr);
    if(tp3>0){
      if(orient==='H'){
        innerBarR.push({u0:s0,v0:acrossMm,u1:s0+tp3,v1:acrossMm+tk, fill:PL3});
        innerBarR.push({u0:s1-tp3,v0:acrossMm,u1:s1,v1:acrossMm+tk, fill:PL3});
      } else {
        innerBarR.push({u0:acrossMm,v0:s0,u1:acrossMm+tk,v1:s0+tp3, fill:PL3});
        innerBarR.push({u0:acrossMm,v0:s1-tp3,u1:acrossMm+tk,v1:s1, fill:PL3});
      }
    }
  });
  rects.push(...innerBarR, ...colBarR);
  return {FW,FH,rects,labels};
}

// Yüz-yerel (u,v) → cihaz XYZ (X=L ekseni, Y=H ekseni, Z=W ekseni); dışarıdan bakış yönelimi
function faceUVtoXYZ(fi, u, v, L, H, W){
  switch(fi){
    case 0: return [u,   H-v, W  ];  // ÖN   (z=W)
    case 1: return [L-u, H-v, 0  ];  // ARKA (z=0)
    case 2: return [u,   H,   v  ];  // ÜST  (y=H)
    case 3: return [u,   0,   W-v];  // ALT  (y=0)
    case 4: return [0,   H-v, u  ];  // SOL  (x=0)
    case 5: return [L,   H-v, W-u];  // SAĞ  (x=L)
  }
}

// ---------- EXCEL DIŞA AKTARMA ----------
// ---------- MONTAJ — PATLATILMIŞ ÖN GÖRÜNÜM ----------
// Sahada birleştirme için: modüller gerçek konumlarına yakın, ama aralarında pay bırakılarak
// çizilir; her modülün dış ölçüsü okunur. 3B sahneden BAĞIMSIZDIR — yalnız model + SVG
// kullanır, bu yüzden aktif olmayan AHU'lar için de üretilebilir (3B görselleri yalnız aktif
// AHU alır). Ara kat ÇİZİLMEZ — kotu modelde tutulmuyor (bkz. CLAUDE.md §4); yalnız not düşülür.
function drawMontajSVG(){
  const SVG_W = 1120, SVG_H = 660, PAD = 96;
  const mods = state.modules;
  let svg = `<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;${SVG_W}&quot; height=&quot;${SVG_H}&quot; viewBox=&quot;0 0 ${SVG_W} ${SVG_H}&quot; font-family=&quot;Arial, Helvetica, sans-serif&quot;>`;
  svg += `<rect x=&quot;0&quot; y=&quot;0&quot; width=&quot;${SVG_W}&quot; height=&quot;${SVG_H}&quot; fill=&quot;#ffffff&quot;/>`;
  if(!mods.length){
    svg += `<text x=&quot;${SVG_W/2}&quot; y=&quot;${SVG_H/2}&quot; fill=&quot;#3d4d5a&quot; font-size=&quot;16&quot; text-anchor=&quot;middle&quot;>MODÜL YOK</text></svg>`;
    return svg;
  }
  const say = v => Math.round(v);
  const kk = v => Math.round(v*2)/2;   // aynı düzlemden başlayan modüller TEK anahtar paylaşır
  const ext = mods.map(md=>modExtAll(md));
  // Gerçek (bitişik) montaj sınırları — toplam dış ölçü buradan yazılır
  let gMinX=Infinity,gMaxX=-Infinity,gMinY=Infinity,gMaxY=-Infinity,gMinZ=Infinity,gMaxZ=-Infinity;
  mods.forEach((md,i)=>{
    gMinX=Math.min(gMinX,md.pos.x); gMaxX=Math.max(gMaxX,md.pos.x+ext[i].x);
    gMinY=Math.min(gMinY,md.pos.y); gMaxY=Math.max(gMaxY,md.pos.y+ext[i].y);
    gMinZ=Math.min(gMinZ,md.pos.z); gMaxZ=Math.max(gMaxZ,md.pos.z+ext[i].z);
  });
  const totL=gMaxX-gMinX, totH=gMaxY-gMinY, totW=gMaxZ-gMinZ;
  // Patlatma payı yalnız GÖRSELDİR. Modülü kendi başlangıç düzlemine göre kaydırdığımız için
  // aynı x'ten başlayan dikey istif birlikte kayar, sıralama ve komşuluk bozulmaz.
  const pay = Math.max(150, Math.round(Math.max(totL,totH)*0.06));
  const xKeys = [...new Set(mods.map(md=>kk(md.pos.x)))].sort((a,b)=>a-b);
  const yKeys = [...new Set(mods.map(md=>kk(md.pos.y)))].sort((a,b)=>a-b);
  const box = mods.map((md,i)=>({
    md, i, w: ext[i].x, h: ext[i].y, d: ext[i].z,
    x: md.pos.x + pay*xKeys.indexOf(kk(md.pos.x)),
    y: md.pos.y + pay*yKeys.indexOf(kk(md.pos.y))
  }));
  let pMinX=Infinity,pMaxX=-Infinity,pMinY=Infinity,pMaxY=-Infinity;
  box.forEach(b=>{
    pMinX=Math.min(pMinX,b.x); pMaxX=Math.max(pMaxX,b.x+b.w);
    pMinY=Math.min(pMinY,b.y); pMaxY=Math.max(pMaxY,b.y+b.h);
  });
  const modelW = Math.max(pMaxX-pMinX, 1), modelH = Math.max(pMaxY-pMinY, 1);
  const scale = Math.min((SVG_W-2*PAD)/modelW, (SVG_H-2*PAD)/modelH);
  const ox = (SVG_W - modelW*scale)/2;
  const oy = (SVG_H - modelH*scale)/2 + 10;
  const sx = v => ox + (v-pMinX)*scale;
  const sy = v => oy + (pMaxY-v)*scale;   // model y yukarı bakar, ekranda ters çevrilir

  svg += `<text x=&quot;${SVG_W/2}&quot; y=&quot;26&quot; fill=&quot;#1b2a36&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; text-anchor=&quot;middle&quot;>MONTAJ — PATLATILMIŞ ÖN GÖRÜNÜM</text>`;
  svg += `<text x=&quot;${SVG_W/2}&quot; y=&quot;45&quot; fill=&quot;#33424e&quot; font-size=&quot;11.5&quot; text-anchor=&quot;middle&quot;>${mods.length} modül · toplam dış ölçü (bitişik montaj): L ${say(totL)} × H ${say(totH)} × W ${say(totW)} mm</text>`;

  const dimOff = Math.max(10, Math.min(18, pay*scale*0.45));
  box.forEach(b=>{
    const rx = sx(b.x), ry = sy(b.y+b.h), rw = b.w*scale, rh = b.h*scale;
    svg += `<rect x=&quot;${rx.toFixed(1)}&quot; y=&quot;${ry.toFixed(1)}&quot; width=&quot;${rw.toFixed(1)}&quot; height=&quot;${rh.toFixed(1)}&quot; fill=&quot;#eef1f4&quot; stroke=&quot;#3a4d5c&quot; stroke-width=&quot;2&quot;/>`;
    // Kenar profili bandı — kutunun bir modül çerçevesi olduğu görünsün
    const band = Math.max(Math.min(rw,rh)*0.055, 2.5);
    if(rw>band*2.5 && rh>band*2.5){
      svg += `<rect x=&quot;${(rx+band/2).toFixed(1)}&quot; y=&quot;${(ry+band/2).toFixed(1)}&quot; width=&quot;${(rw-band).toFixed(1)}&quot; height=&quot;${(rh-band).toFixed(1)}&quot; fill=&quot;none&quot; stroke=&quot;#22303d&quot; stroke-width=&quot;${band.toFixed(1)}&quot;/>`;
    }
    // Kutu içi bilgi — dar kutuda alttan satır atılır, modül adı her zaman kalır
    const fs = Math.max(8.5, Math.min(15, Math.min(rw, rh)/7));
    const satir = [
      {t:'M'+(b.i+1)+(b.md.ad ? ' — '+b.md.ad : ''), s:fs*1.25, w:700, f:'#16232e'},
      {t:say(b.w)+' × '+say(b.h)+' mm', s:fs, w:600, f:'#33424e'},
      {t:'Derinlik (W): '+say(b.d)+' mm', s:fs*0.92, w:400, f:'#46596a'}
    ];
    if(araKatOf(b.md).aktif) satir.push({t:'ARA KAT VAR — '+say(b.w)+'×'+say(b.d)+' mm', s:fs*0.92, w:600, f:'#a8701f'});
    // Kutuya sigmayan satir once kuculur, yine sigmiyorsa dusurulur — tasan yazi komsu
    // modulun uzerine binerdi. Genislik tahmini: Arial ortalama karakter ~0.56 em.
    // Sinir kutunun IC alanidir — cerceve bandi iki yandan yer kapar; ona tasan yazi koyu
    // bandin, hatta komsu modulun uzerine binerdi. Olcum yuz cizimindeki etiketlerle ayni
    // yardimciyla yapilir (fitLabelText). Kisaltilmasi gereken bir OLCU satiri hic yazilmaz:
    // yarim okunan bir olcu (2400 × 20…) yanlis parca demektir.
    const yaziGen = Math.max(rw - 2*band - 10, 24);
    for(let si=satir.length-1; si>=1; si--){
      const fit = fitLabelText(satir[si].t, yaziGen, satir[si].s, 6.5, satir[si].w);
      if(fit.text !== satir[si].t) satir.splice(si,1); else satir[si].s = fit.size;
    }
    const bas = fitLabelText(satir[0].t, yaziGen, satir[0].s, 6, satir[0].w);
    satir[0].t = bas.text; satir[0].s = bas.size;
    const yuk = ss => ss.reduce((a,s)=>a+s.s*1.35, 0);
    while(satir.length>1 && yuk(satir) > rh-8) satir.pop();
    let ty = ry + rh/2 - yuk(satir)/2;
    satir.forEach(s=>{
      ty += s.s*1.35;
      svg += `<text x=&quot;${(rx+rw/2).toFixed(1)}&quot; y=&quot;${(ty-s.s*0.35).toFixed(1)}&quot; fill=&quot;${s.f}&quot; font-size=&quot;${s.s.toFixed(1)}&quot; font-weight=&quot;${s.w}&quot; text-anchor=&quot;middle&quot;>${s.t}</text>`;
    });
    // Dış ölçü çizgileri: altta uzunluk (L), solda yükseklik (H)
    const dy = ry+rh+dimOff;
    svg += `<line x1=&quot;${rx.toFixed(1)}&quot; y1=&quot;${dy.toFixed(1)}&quot; x2=&quot;${(rx+rw).toFixed(1)}&quot; y2=&quot;${dy.toFixed(1)}&quot; stroke=&quot;#5a6f80&quot; stroke-width=&quot;1&quot;/>`;
    svg += `<line x1=&quot;${rx.toFixed(1)}&quot; y1=&quot;${(dy-4).toFixed(1)}&quot; x2=&quot;${rx.toFixed(1)}&quot; y2=&quot;${(dy+4).toFixed(1)}&quot; stroke=&quot;#5a6f80&quot; stroke-width=&quot;1&quot;/>`;
    svg += `<line x1=&quot;${(rx+rw).toFixed(1)}&quot; y1=&quot;${(dy-4).toFixed(1)}&quot; x2=&quot;${(rx+rw).toFixed(1)}&quot; y2=&quot;${(dy+4).toFixed(1)}&quot; stroke=&quot;#5a6f80&quot; stroke-width=&quot;1&quot;/>`;
    svg += `<text x=&quot;${(rx+rw/2).toFixed(1)}&quot; y=&quot;${(dy-5).toFixed(1)}&quot; fill=&quot;#33424e&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot;>L ${say(b.w)}</text>`;
    const dx = rx-dimOff;
    svg += `<line x1=&quot;${dx.toFixed(1)}&quot; y1=&quot;${ry.toFixed(1)}&quot; x2=&quot;${dx.toFixed(1)}&quot; y2=&quot;${(ry+rh).toFixed(1)}&quot; stroke=&quot;#5a6f80&quot; stroke-width=&quot;1&quot;/>`;
    svg += `<line x1=&quot;${(dx-4).toFixed(1)}&quot; y1=&quot;${ry.toFixed(1)}&quot; x2=&quot;${(dx+4).toFixed(1)}&quot; y2=&quot;${ry.toFixed(1)}&quot; stroke=&quot;#5a6f80&quot; stroke-width=&quot;1&quot;/>`;
    svg += `<line x1=&quot;${(dx-4).toFixed(1)}&quot; y1=&quot;${(ry+rh).toFixed(1)}&quot; x2=&quot;${(dx+4).toFixed(1)}&quot; y2=&quot;${(ry+rh).toFixed(1)}&quot; stroke=&quot;#5a6f80&quot; stroke-width=&quot;1&quot;/>`;
    svg += `<text x=&quot;${(dx-5).toFixed(1)}&quot; y=&quot;${(ry+rh/2).toFixed(1)}&quot; fill=&quot;#33424e&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 ${(dx-5).toFixed(1)} ${(ry+rh/2).toFixed(1)})&quot;>H ${say(b.h)}</text>`;
  });

  svg += `<text x=&quot;16&quot; y=&quot;${SVG_H-14}&quot; fill=&quot;#7a8a96&quot; font-size=&quot;10&quot; font-style=&quot;italic&quot;>Modüller arası boşluk yalnızca okunabilirlik içindir — montajda modüller bitişiktir. Bakış: ÖN (+Z) · yatay: Uzunluk (L) · dikey: Yükseklik (H)</text>`;
  svg += `<text x=&quot;${SVG_W-16}&quot; y=&quot;${SVG_H-14}&quot; fill=&quot;#9aa8b2&quot; font-size=&quot;9.5&quot; text-anchor=&quot;end&quot; font-style=&quot;italic&quot;>Cenk Altınay</text>`;
  svg += '</svg>';
  return svg;
}

function svgToPng(svgString, w, h){
  return new Promise((resolve, reject)=>{
    // Bağımsız SVG görüntüsü katı XML ister: xmlns zorunlu, HTML entiteleri geçersiz
    let src = svgString.replace(/&amp;nbsp;/g, ' ');
    if(!/xmlns=/.test(src)) src = src.replace('<svg ', '<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; ');
    const img = new Image();
    const blob = new Blob([src], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = w*2; canvas.height = h*2;   // 2× çözünürlük
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.scale(2,2);
      ctx.drawImage(img,0,0);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('SVG render hatası')); };
    img.src = url;
  });
}

// İki PNG data URL'ini (örn. SOL/SAĞ cephe) tek bir görselde yan yana birleştirir.
function combineSideBySide(dataUrlLeft, dataUrlRight){
  return new Promise((resolve, reject)=>{
    const imgL = new Image(), imgR = new Image();
    let loaded = 0;
    function done(){
      const canvas = document.createElement('canvas');
      canvas.width = imgL.width + imgR.width;
      canvas.height = Math.max(imgL.height, imgR.height);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(imgL, 0, 0);
      ctx.drawImage(imgR, imgL.width, 0);
      resolve(canvas.toDataURL('image/png'));
    }
    function onErr(){ reject(new Error('Görsel birleştirme hatası')); }
    imgL.onload = ()=>{ loaded++; if(loaded===2) done(); };
    imgR.onload = ()=>{ loaded++; if(loaded===2) done(); };
    imgL.onerror = onErr; imgR.onerror = onErr;
    imgL.src = dataUrlLeft; imgR.src = dataUrlRight;
  });
}

// Excel'e giren HER görselin sol üst köşesine iş emri no + ünite adı damgalanır — sahada
// sayfalar birbirine karışmasın. Görseller 2× çözünürlükte üretildiği için yazı boyu
// görselin kendi piksel genişliğinden türetilir (880/900/450 nominal genişliklerin hepsinde
// ekranda ~11 px'e denk gelir). Hata hâlinde DAMGASIZ görsel döner: damga uğruna resmin
// tamamı kaybedilmez.
function pngKoseDamga(dataUrl, satirlar){
  const rows = (satirlar||[]).map(s=>String(s||'').trim()).filter(s=>s!=='');
  if(rows.length===0) return Promise.resolve(dataUrl);
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const fs = Math.max(11, Math.round(img.width*0.0125));
        const pad = Math.round(fs*0.6), lh = Math.round(fs*1.35);
        ctx.font = '700 '+fs+'px Arial, Helvetica, sans-serif';
        let wMax = 0;
        rows.forEach(t=>{ const m = ctx.measureText(t); if(m.width>wMax) wMax = m.width; });
        const bw = wMax + pad*2, bh = lh*rows.length + pad;
        ctx.fillStyle = 'rgba(255,255,255,0.93)';
        ctx.fillRect(pad, pad, bw, bh);
        ctx.strokeStyle = '#33424e';
        ctx.lineWidth = Math.max(1, fs*0.09);
        ctx.strokeRect(pad, pad, bw, bh);
        ctx.fillStyle = '#1b2a36';
        ctx.textBaseline = 'top';
        rows.forEach((t,i)=>{ ctx.fillText(t, pad*2, pad*1.4 + i*lh); });
        resolve(canvas.toDataURL('image/png'));
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}

// 1D KESİM PLANI — First-Fit Decreasing. Parçalar uzundan kısaya sıralanır, her biri
// sığdığı İLK boya girer. 1D kesim NP-zordur; FFD optimalin en çok 11/9 katını kullanır,
// sonucu tekrarlanabilirdir ve elde kesim yapan operatörün sezgisiyle aynı yönde çalışır.
// Testere payı HER PARÇADA gider (parçanın ucu da düzeltilir), yani sığma ölçütü
// Σ(parça + pay) ≤ stok boyu.
function profilKesimPlani(kalemler, stokBoy, pay){
  const parcalar = [];
  (kalemler||[]).forEach(k=>{ for(let i=0;i<(k.adet||0);i++) parcalar.push(k.boy); });
  parcalar.sort((a,b)=>b-a);
  const boylar = [];            // {kullanilan, parcalar[]}
  const sigmayan = [];          // tek boydan çıkmayacak kadar uzun parçalar
  let net = 0;
  parcalar.forEach(p=>{
    if(p + pay > stokBoy + 1e-9){ sigmayan.push(p); return; }
    net += p;
    let yer = null;
    for(let i=0;i<boylar.length;i++){
      if(boylar[i].kullanilan + p + pay <= stokBoy + 1e-9){ yer = boylar[i]; break; }
    }
    if(!yer){ yer = {kullanilan:0, parcalar:[]}; boylar.push(yer); }
    yer.kullanilan += p + pay;
    yer.parcalar.push(p);
  });
  const stokToplam = boylar.length * stokBoy;
  return {
    boyAdedi: boylar.length, boylar, sigmayan,
    parcaAdedi: parcalar.length - sigmayan.length,
    netMm: net, stokMm: stokToplam,
    firePercent: stokToplam>0 ? Math.max(0, (1 - net/stokToplam)*100) : 0
  };
}

// Türkçe ek: 50'lik / 60'lık (ünlü uyumu). Özel profil serisi tanımlanabildiği için
// genel bir kural yazmak yerine bilinen ikisi tabloda durur, gerisi 'Seri N' olur.
const SERI_EK = {'50': '50\'lik', '60': '60\'lık'};
function seriAdi(seri){ return SERI_EK[String(seri)] || ('Seri ' + seri); }

// Sac kaleminin satın alma adı: '0,8 mm Galvaniz', '1 mm Paslanmaz'. Ondalık ayraç
// Türkçe virgüldür — dosyanın geri kalanı gibi.
function sacKalemAdi(g){
  return String(g.gaugeMm).replace('.', ',') + ' mm '
    + (String(g.malzeme).indexOf('PAS') === 0 ? 'Paslanmaz' : 'Galvaniz');
}

// Aktif AHU'nun profil kalemleri, AİLE bazında. Aileler ayrı stoktan kesilir: kasa
// (köşe) profili, takviye profili ve ara katın kare profili farklı KESİTLERDİR — tek
// kesim planına giremezler. Ara kat kendi içinde de profile göre ayrılır (30×30 / 30×60).
// ÜRETİM ADEDİ analiz sınırında uygulanır: alttaki üreticiler (koseProfilKalemleri,
// groupTakviyeSiparis, groupAraKatSiparis) BİR cihazın listesini verir — ekran özeti ve
// Kapak Hesabı Excel'i onu öyle gösterir. Satın alma ise toplamı ister, o yüzden burada
// her kalemin adedi santralin üretim adediyle çarpılır (Cenk, 31.08.2026).
function analizProfilAileleri(){
  const V = getV();
  const kat = aktifAdet();
  const carp = ar => ar.map(k=>({boy:k.boy, adet:k.adet*kat}));
  const aileler = [];
  const kp = koseProfilKalemleri();
  if(kp.kalemler.length || kp.eksik)
    aileler.push({ad:seriAdi(V.seri)+' Köşe (Kasa) Profili', kalemler:carp(kp.kalemler), eksik:kp.eksik*kat});

  const {rows} = collectTakviyeRows();
  const takRows = rows.filter(x=>!x.arakat);
  const tg = groupTakviyeSiparis(takRows);
  if(tg.groups.length || tg.skipped)
    aileler.push({ad:seriAdi(V.seri)+' Takviye Profili',
      kalemler: carp(tg.groups.map(g=>({boy:g.boy, adet:g.adet}))), eksik: tg.skipped*kat});

  const akRows = rows.filter(x=>x.arakat);
  if(akRows.length){
    const ag = groupAraKatSiparis(akRows);
    [...new Set(ag.groups.map(g=>g.profil))].forEach(pr=>{
      aileler.push({ad:'Ara Kat Profili — '+pr,
        kalemler: carp(ag.groups.filter(g=>g.profil===pr).map(g=>({boy:g.boy, adet:g.adet}))), eksik:0});
    });
    if(ag.skipped) aileler.push({ad:'Ara Kat Profili — ölçüsü eksik', kalemler:[], eksik:ag.skipped*kat});
  }
  return aileler;
}

// PLASTİKLER. Köşe plastiği: modül başına 8 (3 yönlü birleşim, kutunun 8 köşesi) —
// ekran özeti ve Excel ÖZET sayfasıyla aynı kural. Takviye plastiği: her takviye
// parçasının İKİ ucunda birer tane; kural motorun kendisinden okunur — takviye boyu
// zaten '− 2×takviyePlastik' ile kısaltılıyor (takviyeRecords). Profilde takviye
// plastiği yoksa (V.takviyePlastik = 0) adet de yazılmaz.
// ARA KAT dışarıdadır: kare profil KAYNAK birleşimdir, plastik kullanmaz — getVAraKat
// hem kose'yi hem takviyePlastik'i 0 döndürür.
function analizPlastikler(){
  const V = getV();
  const kat = aktifAdet();
  const {rows} = collectTakviyeRows();
  let takParca = 0;
  rows.forEach(x=>{ if(!x.arakat) takParca += x.adet; });
  takParca *= kat;   // satın alma toplamı — bkz. analizProfilAileleri
  return {
    kose: 8 * state.modules.length * kat,
    modulSayisi: state.modules.length,
    adet: kat,
    takviyeParca: takParca,
    takviye: V.takviyePlastik>0 ? takParca*2 : 0,
    takviyePlastikVar: V.takviyePlastik>0
  };
}

// f1'den sac plakası + delik sayımı ister. Köprü kabuk sayfadan geçer (f0 ile f1
// birbirini doğrudan göremez); her istek kendi id'siyle eşlenir, böylece AHU'lar
// sırayla sorulabilir. f1 yanıt vermezse zaman aşımı ile düşer — sessizce beklemez.
let analizIstekSayaci = 0;
function analizIste(payload, zamanAsimiMs){
  return new Promise((resolve, reject)=>{
    if(window.parent === window){ reject(new Error('DXF sekmesi yok (uygulama tek başına açılmış)')); return; }
    const id = 'az' + (++analizIstekSayaci);
    const sure = setTimeout(()=>{ temizle(); reject(new Error('DXF sekmesi yanıt vermedi (zaman aşımı)')); },
      zamanAsimiMs || 30000);
    function temizle(){ clearTimeout(sure); window.removeEventListener('message', dinle); }
    function dinle(e){
      if(!e.data || e.data.type !== 'analizSonuc' || e.data.id !== id) return;
      temizle();
      if(e.data.hata) reject(new Error(e.data.hata));
      else resolve(e.data.sonuc);
    }
    window.addEventListener('message', dinle);
    window.parent.postMessage({type:'analizIste', id:id, payload:payload}, '*');
  });
}

// ---------- İNDİRME KUYRUĞU ----------
// Tarayıcı, AYNI ANDA tetiklenen indirmelerin ilk 10'unu alıp gerisini SESSİZCE
// düşürüyor (ölçüldü 03.09.2026, gerçek Chrome: 25 tetikleme → 10 dosya; aralarına
// 100 ms konunca 25/25). Çok santralli Excel/Analiz ve f1'in Toplu DXF'i bu sınırı
// aşıyordu — hata da vermiyordu, dosyalar sessizce düşüyordu.
// Bu yüzden BÜTÜN indirmeler tek kuyruktan geçer: ilki hemen (kullanıcı hareketinin
// içinde), gerisi INDIRME_ARA ms arayla. Çağıran BEKLEMEZ — blob zaten hazırdır,
// yalnızca tıklama ertelenir; bu yüzden mevcut başarı/liste-temizleme mantığı ve
// fonksiyonların dönüş değerleri hiç değişmez.
const INDIRME_ARA = 300;   // ms — ölçülen sınır 100; üç katı pay bırakıldı
const indirmeKuyrugu = [];
let indirmeCalisiyor = false;
function indirmeSirala(url, ad){
  indirmeKuyrugu.push({url:url, ad:ad});
  if(!indirmeCalisiyor){ indirmeCalisiyor = true; indirmeSonraki(); }
  return ad;
}
function indirmeSonraki(){
  const it = indirmeKuyrugu.shift();
  if(!it){ indirmeCalisiyor = false; return; }
  const a = document.createElement('a');
  a.href = it.url;
  a.download = it.ad;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(it.url), 5000);
  setTimeout(indirmeSonraki, INDIRME_ARA);
}

// ---------- ZIP YAZICI (store — sikistirma YOK) ----------
// f1'deki yazicinin ikizi (iki iframe ayri belgedir). Neden gerekli: tarayici bir
// turda tetiklenen indirmelerin ancak bir kismini aliyor — olculdu 03.09.2026
// (gercek Chrome, 25 dosya): hepsi ayni anda -> 10; indirme kuyrugundan sonra http
// uzerinde 25/25 AMA file:// uzerinde 1/25. Uygulama cift tiklanarak da aciliyor,
// yani cok dosyali ciktinin tek guvenli yolu TEK dosya indirmek.
// Sikistirma yapilmaz: deflate icin kutuphane gerekir, bu dosya bagimliliksiz kalmali.
// Ad alaninda UTF-8 bayragi (bit 11) kurulur — Turkce adlar dogru okunur.
let zipCrcTablo = null;
function zipCrc32(u8){
  if(!zipCrcTablo){
    zipCrcTablo = new Int32Array(256);
    for(let i=0;i<256;i++){
      let c = i;
      for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      zipCrcTablo[i] = c;
    }
  }
  let crc = -1;
  for(let j=0;j<u8.length;j++) crc = (crc >>> 8) ^ zipCrcTablo[(crc ^ u8[j]) & 0xFF];
  return (crc ^ -1) >>> 0;
}
// MS-DOS tarih/saat alanlari (2 sn cozunurluk, 1980 baslangic)
function zipTarih(t){
  return {
    saat: ((t.getHours() & 31) << 11) | ((t.getMinutes() & 63) << 5) | ((t.getSeconds()/2) & 31),
    gun: (((t.getFullYear()-1980) & 127) << 9) | (((t.getMonth()+1) & 15) << 5) | (t.getDate() & 31)
  };
}
// dosyalar: [{ad, veri}] — veri metin ya da ArrayBuffer/Uint8Array olabilir
function zipYap(dosyalar){
  const enc = new TextEncoder();
  const t = zipTarih(new Date());
  const govde = [], merkez = [];
  let ofset = 0;
  dosyalar.forEach(dd=>{
    const ad = enc.encode(dd.ad);
    const veri = (typeof dd.veri === 'string') ? enc.encode(dd.veri)
      : (dd.veri instanceof Uint8Array ? dd.veri : new Uint8Array(dd.veri));
    const crc = zipCrc32(veri);
    const yerel = new Uint8Array(30 + ad.length);
    const dv = new DataView(yerel.buffer);
    dv.setUint32(0, 0x04034b50, true);   // yerel baslik imzasi
    dv.setUint16(4, 20, true);           // gereken surum (2.0)
    dv.setUint16(6, 0x0800, true);       // bayrak: ad UTF-8
    dv.setUint16(8, 0, true);            // yontem: store
    dv.setUint16(10, t.saat, true);
    dv.setUint16(12, t.gun, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, veri.length, true); // sikistirilmis boy = ham boy
    dv.setUint32(22, veri.length, true);
    dv.setUint16(26, ad.length, true);
    yerel.set(ad, 30);
    govde.push(yerel, veri);
    const mrk = new Uint8Array(46 + ad.length);
    const mv = new DataView(mrk.buffer);
    mv.setUint32(0, 0x02014b50, true);   // merkez dizin imzasi
    mv.setUint16(4, 20, true);
    mv.setUint16(6, 20, true);
    mv.setUint16(8, 0x0800, true);
    mv.setUint16(10, 0, true);
    mv.setUint16(12, t.saat, true);
    mv.setUint16(14, t.gun, true);
    mv.setUint32(16, crc, true);
    mv.setUint32(20, veri.length, true);
    mv.setUint32(24, veri.length, true);
    mv.setUint16(28, ad.length, true);
    mv.setUint32(42, ofset, true);       // yerel basligin dosya icindeki yeri
    mrk.set(ad, 46);
    merkez.push(mrk);
    ofset += yerel.length + veri.length;
  });
  const merkezBoy = merkez.reduce((a,m)=>a+m.length, 0);
  const son = new Uint8Array(22);
  const sv = new DataView(son.buffer);
  sv.setUint32(0, 0x06054b50, true);     // merkez dizin sonu
  sv.setUint16(8, dosyalar.length, true);
  sv.setUint16(10, dosyalar.length, true);
  sv.setUint32(12, merkezBoy, true);
  sv.setUint32(16, ofset, true);
  return new Blob(govde.concat(merkez, [son]), {type:'application/zip'});
}
const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
// Cok dosyali ciktida TEK ZIP indirir; TEK dosyada eski davranis birebir korunur.
// ZIP kurulamazsa (cok eski tarayici) dosyalar tek tek iner — bir kismi tarayici
// sinirina takilabilir ama hicbirinin inmemesinden iyidir.
function coklaIndir(dosyalar, zipAd){
  if(!dosyalar.length) return '';
  const tek = dd => indirmeSirala(URL.createObjectURL(new Blob([dd.veri], {type:XLSX_MIME})), dd.ad);
  if(dosyalar.length === 1){ tek(dosyalar[0]); return dosyalar[0].ad; }
  try{
    indirmeSirala(URL.createObjectURL(zipYap(dosyalar)), zipAd);
    return zipAd;
  }catch(err){
    dosyalar.forEach(tek);
    return '';
  }
}

    ]);

    const kpX = koseProfilKalemleri();
    const NM = kpX.modulSayisi, missX = kpX.eksik;
    const frameRows = kpX.kalemler.map(({boy,adet})=>['Köşe Profili', Math.round(boy), adet]);

    {

        rr = addTable(wsO, rr, 'ARA KAT PROFİLLERİ — DETAY', t.bas, t.rows);
      }
      const ag = groupAraKatSiparis(arakatRows);
      {
        const t = katTablo(['Profil','Boy (mm)','Toplam Adet','Toplam Uzunluk (m)'],
          ag.groups.map(g=>[g.profil, g.boy, g.adet, g.metre]), [2,3],
          ['Adet — 1 cihaz','Uzunluk (m) — 1 cihaz'], ['Toplam Adet','Toplam Uzunluk (m)']);
        rr = addTable(wsO, rr, 'ARA KAT PROFİLLERİ — SİPARİŞ (PROFİL + BOY)', t.bas, t.rows);
      }
    }

    // Kapak toplamları (tip bazında, Boş Alan hariç) — Boğaz/Damper ayrı tabloda
    const kapakMap = new Map();
    const bogazDamperMap = new Map();
    state.modules.forEach((md,m)=>{
      withModule(m, ()=>{
        const say2 = (r)=>{
          if(!r || r.kapaksiz) return;
          r.colResults.forEach(c=>c.panels.forEach(p=>{
            if(p.bos || p.covered) return;
            const map = isEleman(p.type) ? bogazDamperMap : kapakMap;
            map.set(p.type, (map.get(p.type)||0)+1);
          }));
        };
        FACE_DEFS.forEach((_,fi)=>{ say2(computeFace(fi)); });
        if(araKatOf(md).aktif) say2(computeFace(ARAKAT_FI));
      });
    });
    {
      const t = katTablo(['Panel Tipi','Toplam Adet'],
        [...kapakMap.entries()].map(([tp,a])=>[tp,a]), [1], ['Adet — 1 cihaz'], ['Toplam Adet']);
      rr = addTable(wsO, rr, 'KAPAK TOPLAMLARI (TİP BAZINDA)', t.bas, t.rows);
    }
    {
      const t = katTablo(['Tip','Toplam Adet'],
        [...bogazDamperMap.entries()].map(([tp,a])=>[tp,a]), [1], ['Adet — 1 cihaz'], ['Toplam Adet']);
      rr = addTable(wsO, rr, 'BOĞAZ VE DAMPERLER', t.bas, t.rows);
    }

    // Resimler tablolardan sayfa kırımı ile ayrılır; her resim yeni sayfada başlar
    if (!wsO.rowBreaks) wsO.rowBreaks = [];

    // 3B görünüm — yalnızca aktif AHU (diğer AHUlar için sahne değiştirilmez)
    if(_isActiveAhu){
      wsO.rowBreaks.push({id: rr - 1, max: 16383, man: 1});
      try{
        const png3 = await pngKoseDamga(await window.capture3DView(null, null, 900, 560), damgaSatirlari);
        const img3 = wb.addImage({base64: png3, extension:'png'});
        const t3 = wsO.getCell(rr,1); t3.value = '3B GÖRÜNÜM (mevcut açı)'; t3.font = titleFont;
        wsO.addImage(img3, {tl:{col:0, row:rr}, ext:{width:900, height:560}});
        rr += Math.ceil(560/20) + 2;
      }catch(err){
        const t3 = wsO.getCell(rr,1); t3.value = '⚠ 3B görsel eklenemedi: '+err.message; t3.font = FONT;
        rr += 2;
      }
      {
        const cepheViews = [
          {label:'ÖN CEPHE',  yaw:0,        pitch:0},
          {label:'ARKA CEPHE',yaw:Math.PI,  pitch:0},
          {label:'ÜST CEPHE', yaw:0,        pitch: Math.PI/2},
          {label:'ALT CEPHE', yaw:0,        pitch:-Math.PI/2}
        ];
        for(const cv of cepheViews){
          wsO.rowBreaks.push({id: rr - 1, max: 16383, man: 1});
          try{
            const pngC = await pngKoseDamga(await window.capture3DView(cv.yaw, cv.pitch, 900, 560), damgaSatirlari);
            const imgC = wb.addImage({base64: pngC, extension:'png'});
            const tC = wsO.getCell(rr,1); tC.value = '3B TOPLU MONTAJ — '+cv.label; tC.font = titleFont;
            wsO.addImage(imgC, {tl:{col:0, row:rr}, ext:{width:900, height:560}});
            rr += Math.ceil(560/20) + 2;
          }catch(err){
            const tC = wsO.getCell(rr,1); tC.value = '⚠ '+cv.label+' eklenemedi: '+err.message; tC.font = FONT;
            rr += 2;
          }
        }
        // SOL ve SAĞ CEPHE — iki ayrı görsel yerine tek görselde yan yana (SOL solda, SAĞ sağda)
        wsO.rowBreaks.push({id: rr - 1, max: 16383, man: 1});
        try{
          const pngSol = await window.capture3DView(-Math.PI/2, 0, 450, 560);
          const pngSag = await window.capture3DView(Math.PI/2, 0, 450, 560);
          const pngSS = await pngKoseDamga(await combineSideBySide(pngSol, pngSag), damgaSatirlari);
          const imgSS = wb.addImage({base64: pngSS, extension:'png'});
          const tSS = wsO.getCell(rr,1); tSS.value = '3B TOPLU MONTAJ — SOL CEPHE / SAĞ CEPHE'; tSS.font = titleFont;
          wsO.addImage(imgSS, {tl:{col:0, row:rr}, ext:{width:900, height:560}});
          rr += Math.ceil(560/20) + 2;
        }catch(err){
          const tSS = wsO.getCell(rr,1); tSS.value = '⚠ SOL/SAĞ CEPHE eklenemedi: '+err.message; tSS.font = FONT;
          rr += 2;
        }
      }
    }

    // ---- MONTAJ SAYFASI (patlatılmış ön görünüm) ----
    // Sahada birleştirme için modül dış ölçüleri + aralarında pay bırakılmış ön görünüm.
    // 3B sahneden bağımsız olduğu için AKTİF OLMAYAN AHU'larda da üretilir.
    {
      const wsM = wb.addWorksheet('MONTAJ');
      wsM.columns = [{width:14},{width:14},{width:14},{width:14},{width:24},{width:14}];
      setDevFooter(wsM);
      wsM.getCell(1,1).value = 'Cenk Altınay';
      wsM.getCell(1,1).font = devFont;
      let mrr = addTable(wsM, 2, 'MONTAJ — MODÜL DIŞ ÖLÇÜLERİ',
        ['Modül','L (mm)','H (mm)','W (mm)','Konum x,y,z (mm)','Ara Kat'],
        state.modules.map((md,i)=>['M'+(i+1)+(md.ad ? ' — '+md.ad : ''), md.L||'—', md.H||'—', md.W||'—',
          md.pos.x+', '+md.pos.y+', '+md.pos.z, araKatOf(md).aktif ? 'VAR' : '—']));
      if(!wsM.rowBreaks) wsM.rowBreaks = [];
      wsM.rowBreaks.push({id: mrr-1, max:16383, man:1});
      try{
        const pngM = await pngKoseDamga(await svgToPng(drawMontajSVG(), 1120, 660), damgaSatirlari);
        const imgM = wb.addImage({base64: pngM, extension:'png'});
        const tM = wsM.getCell(mrr,1);
        tM.value = 'PATLATILMIŞ ÖN GÖRÜNÜM — modüller arası pay yalnızca görseldir';
        tM.font = titleFont;
        wsM.addImage(imgM, {tl:{col:0, row:mrr}, ext:{width:1120, height:660}});
      }catch(err){
        const tM = wsM.getCell(mrr,1); tM.value = '⚠ Montaj görseli eklenemedi: '+err.message; tM.font = FONT;
      }
    }

    // ---- MODÜL × YÜZ SAYFALARI ----
    for(let m=0; m<state.modules.length; m++){
      // 6 yüz + (varsa) ARA KAT. FACE_DEFS büyütülmediği için sayfa listesi burada
      // elle uzatılır; ara kat kapalıysa sayfa hiç üretilmez.
      const sayfaFi = [0,1,2,3,4,5];
      if(araKatOf(state.modules[m]).aktif) sayfaFi.push(ARAKAT_FI);
      for(const fi of sayfaFi){
        const r = withModule(m, ()=>computeFace(fi));
        const face = withModule(m, ()=>faceOf(fi));
        const sheetName = 'M'+(m+1)+' '+faceDefOf(fi).name;
        const ws = wb.addWorksheet(sheetName);
        ws.columns = [{width:14},{width:20},{width:14},{width:16},{width:14},{width:14}];
        setDevFooter(ws);

        let row = addTable(ws, 1, sheetName+' — YÜZ BİLGİSİ', ['Alan','Değer'], [
          ['Modül', 'M'+(m+1)+' ('+(state.modules[m].L||'?')+'×'+(state.modules[m].H||'?')+'×'+(state.modules[m].W||'?')+' mm @ '+state.modules[m].pos.x+','+state.modules[m].pos.y+','+state.modules[m].pos.z+')'],
          ['Kullanılan eksenler', r.def.wKey+' × '+r.def.hKey],
          ['Çalışma ölçüleri (mm)', (r.faceW||'—')+' × '+(r.faceH||'—')],
          ['Yerleşim yönü', face.orient==='H'?'Soldan Sağa':'Yukarıdan Aşağıya'],
          ['Takviye düzeni', (function(){
            const splitCount = (r.bars?r.bars.ana:[]).filter(b=>b.splitValid).length;
            const joinCount = (r.bars?r.bars.ara:[]).filter(b=>b.joinValid).length;
            if(splitCount===0 && joinCount===0) return 'Varsayılan (ana sürekli, ara segment)';
            const parts = [];
            if(splitCount>0) parts.push(splitCount+' ana takviye ayrılmış');
            if(joinCount>0) parts.push(joinCount+' ara takviye birleştirilmiş');
            return parts.join(', ');
          })()],
          ['Kapaksız yüz', isAraKat(fi) ? '— (ara kat)' : (face.kapaksiz?'EVET':'HAYIR')],
          ['Bölüm / Kapak adedi', face.kapaksiz?'—':(face.columns.length+' / '+r.toplamKapak)],
          ['Durum', r.status.text]
        ].concat(isAraKat(fi) ? withModule(m, ()=>{
          // Ara katta ölçü modülden türer — zinciri sayıyla yazalım ki sayfa kendi kendini
          // açıklasın (3B görseli YOK: ara kat modülün içinde kalır, sahneye hiç girmez).
          const o = araKatOlculeri();
          return [
            ['Ara kat profili', (ARAKAT_PROFILLER[o.ak.profil]||ARAKAT_PROFILLER['30x30']).ad+' (p='+o.p+' mm)'],
            ['Düşüm (seri '+o.V.seri+')', o.dus+' mm'],
            ['İç ölçü (L × W)', (o.icL>0?Math.round(o.icL):'—')+' × '+(o.icW>0?Math.round(o.icW):'—')],
            ['Panel açıklığı (−2p)', (o.acikL>0?Math.round(o.acikL):'—')+' × '+(o.acikW>0?Math.round(o.acikW):'—')],
            ['Boydan boya giden yön', (o.surekliYon==='L' ? 'Uzunluk (L)' : 'Genişlik (W)')
              + (o.ak.surekliYon ? '' : ' — otomatik (uzun kenar)')],
            ['Çerçeve kesim', o.p===0
              ? '— (profilsiz: çerçeve yok)'
              : (o.cerceve.length
                  ? o.cerceve.map(c=>c.adet+' × '+Math.round(c.boy)).join('  +  ')
                  : 'ÖLÇÜ EKSİK')]
          ];
        }) : []));

        if(!r.kapaksiz){
          row = addTable(ws, row, 'KESİM LİSTESİ — KAPAKLAR', ['Kapak','Tip','Genişlik (mm)','Yükseklik (mm)'], getSabitRows(r));
          row = addTable(ws, row, 'TAKVİYELER', ['Takviye','Adet','Boy (mm)','Kaynak'],
            r.takviyeRecords.map(t=>[t.yon+' '+t.tip, t.adet, t.boy!==null?Math.round(t.boy):'ÖLÇÜ EKSİK', t.kaynak]));
        }

        // Tablolar bitti — görsel yeni sayfada başlasın
        if (!ws.rowBreaks) ws.rowBreaks = [];
        ws.rowBreaks.push({id: row - 1, max: 16383, man: 1});

        try{
          const png = await pngKoseDamga(await svgToPng(withModule(m, ()=>drawFaceSVG(fi)), 880, 480), damgaSatirlari);
          const imgId = wb.addImage({base64: png, extension:'png'});
          const t = ws.getCell(row,1); t.value = 'GÖRSEL YERLEŞİM'; t.font = titleFont;
          ws.addImage(imgId, {tl:{col:0, row:row}, ext:{width:880, height:480}});
        }catch(err){
          const t = ws.getCell(row,1); t.value = '⚠ Görsel eklenemedi: '+err.message; t.font = FONT;
        }
      }
    }

    const buf = await wb.xlsx.writeBuffer();
    const parts = [];
    if(state.proje.isNo) parts.push(sanitizeF(state.proje.isNo));
    if(_ahuLabel) parts.push(sanitizeF(_ahuLabel));
    parts.push('KAPAK_HESABI');
    if(parts.length===1) parts.push(new Date().toISOString().slice(0,10));
    xlsxToplama.push({ad: parts.join('_')+'.xlsx', veri: buf});
    totalExported++;
  }catch(err){
    note.textContent = '⚠ Excel oluşturma hatası ('+ _ahuLabel +'): '+err.message;
  }
  } // end AHU loop
  state.activeAhu = origActiveAhu;
  excelKodModu = false;
  render3D();
  const excelZip = (state.proje.isNo ? sanitizeF(state.proje.isNo)+'_' : '') + 'KAPAK_HESABI.zip';
  const excelInen = coklaIndir(xlsxToplama, excelZip);
  if(totalExported > 0){
    note.textContent = ahuCount > 1
      ? '✓ '+totalExported+'/'+ahuCount+' AHU için Excel dosyaları indirildi'
        + (xlsxToplama.length > 1 && excelInen ? ' — TEK ZIP içinde: '+excelInen : '')+'.'
      : '✓ Excel dosyası indirildi: 1 özet + 1 montaj + '
        +(state.modules.length*6 + state.modules.filter(md=>araKatOf(md).aktif).length)
        +' modül-yüz sayfası.';
  }
}

  // Tema

      kenar: Number(document.getElementById('pe_kenar').value)||0,
      takviye: Number(document.getElementById('pe_takviye').value)||0,
      kose: Number(document.getElementById('pe_kose').value)||0,
      takviyePlastik: Number(document.getElementById('pe_tp').value)||0,
      acilirEk: Number(document.getElementById('pe_acilirek').value)||0,
      builtin: false
    };
    saveCustomProfiles();
    state.varsayimlar.seri = ad;
    pe.style.display = 'none';
    renderAll();
  });
  document.getElementById('pe_sil').addEventListener('click', ()=>{
    const cur = String(state.varsayimlar.seri);
    if(PROFILES[cur] && !PROFILES[cur].builtin){
      delete PROFILES[cur];
      saveCustomProfiles();
      state.varsayimlar.seri = '60';
      pe.style.display = 'none';
      renderAll();
    }
  });

  document.getElementById('btn_addmod').addEventListener('click', ()=>{
    addModuleAt(state.active, 5); // SAĞ
    document.getElementById('dim_L').focus();
  });
  document.getElementById('modtabs').addEventListener('click', e=>{
    const del = e.target.closest('[data-moddel]');
    if(del){
      const i = Number(del.dataset.moddel);
      if(state.modules.length>1){
        const D = state.modules[i];
        // Boşluk kapatma: silinen modülün bağlanma ekseninde, aynı şeritteki modüller geri kayar
        const ax = D.attAxis || 'x';
        const dExt = modExt(D, ax);
        const eps = 0.5;
        const perp = ['x','y','z'].filter(a=>a!==ax);
        const inLane = B => perp.every(a=>{
          const bE = modExt(B,a), dE = modExt(D,a);
          return B.pos[a] < D.pos[a]+dE-eps && D.pos[a] < B.pos[a]+bE-eps;
        });
        if((D.attDir||1) > 0){
          const farPlane = D.pos[ax] + dExt;
          state.modules.forEach(B=>{ if(B!==D && B.pos[ax] >= farPlane-eps && inLane(B)) B.pos[ax] -= dExt; });
        } else {
          state.modules.forEach(B=>{
            const bExt = modExt(B, ax);
            if(B!==D && B.pos[ax]+bExt <= D.pos[ax]+eps && inLane(B)) B.pos[ax] += dExt;
          });
        }
        state.modules.splice(i,1);
        if(state.active>=state.modules.length) state.active = state.modules.length-1;
        renderAll();
      }
      e.stopPropagation(); return;
    }
    const tab = e.target.closest('[data-modtab]');
    if(tab){
      state.active = Number(tab.dataset.modtab);
      renderAll();
    }
  });
  // &quot;Görünümü Sıfırla&quot; butonu ve fare/tekerlek/tıkla-ekle etkileşimi artık sayfa sonundaki
  // Three.js modülünde (gerçek kamera + raycaster ile) yönetiliyor.
  ['dim_W','dim_H','dim_L'].forEach(id=>{
    document.getElementById(id).addEventListener('input', e=>{
      state.dims[id.split('_')[1]] = Number(e.target.value)||0;
      FACE_DEFS.forEach((_,i)=>renderFace(i));
  renderFace(ARAKAT_FI);
    });
  });
  document.getElementById('seri').addEventListener('change', e=>{
    state.varsayimlar.seri = e.target.value; renderAll();
  });
  ['v_tolw','v_tolh'].forEach(id=>{
    document.getElementById(id).addEventListener('input', e=>{
      state.varsayimlar[id==='v_tolw'?'tolW':'tolH'] = Number(e.target.value)||0; renderAll();
    });
  });
  const PROFIELD = {v_kenar:'kenar', v_takviye:'takviye', v_kose:'kose', v_takviyeplastik:'takviyePlastik', v_acilirek:'acilirEk'};
  Object.keys(PROFIELD).forEach(id=>{
    document.getElementById(id).addEventListener('input', e=>{
      const seri = String(state.varsayimlar.seri);
      const prof = PROFILES[seri] || PROFILES['60'];
      prof[PROFIELD[id]] = Number(e.target.value)||0;
      saveCustomProfiles();
      renderAll();
    });
  });

  document.body.addEventListener('click', e=>{
    // ---- BATARYA KIZAĞI: rol seçimi ve satır silme ----
    const kzRol = e.target.closest && e.target.closest('[data-kzrol]');
    if(kzRol){
      const rol = kzRol.dataset.kzrol;
      if(kzRol.classList.contains('kz-sil')){
        const kz = activeKizak();
        kz.bataryalar = kz.bataryalar.filter(b => b.rol !== rol);
        renderKizakPanel(); renderIssuesBadge(); renderGlobalSummary();
      } else {
        KIZAK_ROLLER.forEach(r=>{
          const el = document.getElementById('kz_rol_'+r);
          if(el) el.classList.toggle('active', r === rol);
        });
      }
      return;
    }
    const additive = e.ctrlKey || e.metaKey;   // Ctrl/Cmd: seçime ekle-çıkar
    // Kapak ekle (aynı satıra)
    const addP = e.target.closest('.svg-addpanel');
    if(addP){
      const fi = Number(addP.dataset.face);
      const ci = Number(addP.dataset.col);
      const face = faceOf(fi);
      face.columns[ci].panels.push({size:0, type:&quot;Normal Panel&quot;, colSpan:1});
      syncStructure(face);
      face.selectedCells = [{col: ci, idx: face.columns[ci].panels.length-1}];
      face.selectedBars = [];
      renderFace(fi);
      const inp = document.getElementById(`f${fi}_ed_psize`);
      if(inp) inp.focus();
      return;
    }
    // Yeni satır ekle (V orient — soldaki küçük +)
    const addRow = e.target.closest('.svg-addrow');
    if(addRow){
      const fi = Number(addRow.dataset.face);
      const ci = Number(addRow.dataset.addrow);
      const face = faceOf(fi);
      face.columns.splice(ci + 1, 0, newColumn());
      syncStructure(face);
      face.selectedCells = [{col: ci + 1, idx: 0}];
      face.selectedBars = [];
      renderFace(fi);
      const inp = document.getElementById(`f${fi}_ed_colsize`);
      if(inp) inp.focus();
      return;
    }
    // Yeni bölüm ekle (H orient — üstteki küçük +)
    const addCol = e.target.closest('.svg-addcol');
    if(addCol){
      const fi = Number(addCol.dataset.face);
      const ci = Number(addCol.dataset.addcol);
      const face = faceOf(fi);
      face.columns.splice(ci + 1, 0, newColumn());
      syncStructure(face);
      face.selectedCells = [{col: ci + 1, idx: 0}];
      face.selectedBars = [];
      renderFace(fi);
      const inp = document.getElementById(`f${fi}_ed_colsize`);
      if(inp) inp.focus();
      return;
    }
    // KESİM NOKTASI — ana takviyeyi YALNIZ tıklanan seviyeden ayırır/birleştirir.
    // .svg-gap'ten ÖNCE denenir (ikisi kardeş elemanlar; sıra niyeti netleştirir).
    const cutG = e.target.closest('.svg-anacut');
    if(cutG){
      const fi = Number(cutG.dataset.face);
      const gi = Number(cutG.dataset.gap);
      const lvl = Number(cutG.dataset.lvl);
      const face = faceOf(fi);
      // '*' (eski projelerden gelen &quot;hepsi kesik&quot;) ilk dokunuşta gerçek listeye açılır
      let cur = face.anaSplitLevels[gi];
      if(cur === '*'){
        const rNow = computeFace(fi);
        cur = (rNow.bars.ana[gi] ? rNow.bars.ana[gi].levels.map(l=>l.idxA) : []);
      }
      cur = Array.isArray(cur) ? cur.slice() : [];
      const at = cur.indexOf(lvl);
      if(at >= 0) cur.splice(at, 1); else cur.push(lvl);
      face.anaSplitLevels[gi] = cur;
      renderFace(fi);
      return;
    }
    // Ana takviye: kapalıysa aç; açıksa seç (Ctrl ile çoklu). Kapatma editördeki Kaldır ile.
    const gapG = e.target.closest('.svg-gap');
    if(gapG){
      const fi = Number(gapG.dataset.face);
      const gi = Number(gapG.dataset.gap);
      const face = faceOf(fi);
      if(!face.colGaps[gi]){
        face.colGaps[gi] = true;
      } else {
        const mixed = face.selectedBars.some(b=>b.kind!=='ana');   // tür değişti → seçimi sıfırla
        face.selectedCells = [];
        face.selectedBars = toggleSel(mixed ? [] : face.selectedBars, {kind:'ana', i:gi}, sameBar, additive && !mixed);
      }
      renderFace(fi);
      return;
    }
    // Ara takviye: kapalıysa aç; açıksa seç (Ctrl ile çoklu). Kapatma editördeki Kaldır ile.
    const inG = e.target.closest('.svg-innergap');
    if(inG){
      const fi = Number(inG.dataset.face);
      const gi = Number(inG.dataset.gap);
      const ci = Number(inG.dataset.col);
      const face = faceOf(fi);
      const col = face.columns[ci];
      if(!col.innerGaps[gi]){
        col.innerGaps[gi] = true;
      } else {
        const mixed = face.selectedBars.some(b=>b.kind!=='ara');
        face.selectedCells = [];
        face.selectedBars = toggleSel(mixed ? [] : face.selectedBars, {kind:'ara', ci, gi}, sameBar, additive && !mixed);
      }
      renderFace(fi);
      return;
    }
    // Kapak seç (Ctrl ile çoklu — birleştirme için)
    const panelG = e.target.closest('.svg-panel');
    if(panelG){
      const fi = Number(panelG.dataset.face);
      const ci = Number(panelG.dataset.col);
      const pi = Number(panelG.dataset.panel);
      const face = faceOf(fi);
      face.selectedBars = [];
      face.selectedCells = toggleSel(face.selectedCells, {col:ci, idx:pi}, sameCell, additive);
      renderFace(fi);
      if(face.selectedCells.length === 1){
        const inp = document.getElementById(`f${fi}_ed_colsize`);
        if(inp) inp.focus();
      }
      return;
    }
    // Kapak sil
    const m = e.target.id && e.target.id.match(/^f(\d+)_ed_del$/);
    if(m){
      const fi = Number(m[1]);
      const face = faceOf(fi);
      const s = selCell(face);
      if(!s) return;
      const {col:ci, idx:pi} = s;
      const col = face.columns[ci];
      if(col.panels.length>1){
        col.panels.splice(pi,1);
      } else if(face.columns.length>1){
        face.columns.splice(ci,1);
      } else return;
      syncStructure(face);
      face.selectedCells = [];
      renderFace(fi);
      return;
    }
    // KAPAKLARI BİRLEŞTİR — soldaki kapağa colSpan verilir, sağdakiler onun altında kalır
    let cellMergeM = e.target.id && e.target.id.match(/^f(\d+)_cell_merge$/);
    if(cellMergeM){
      const fi = Number(cellMergeM[1]);
      const face = faceOf(fi);
      const chk = canMergeCells(computeFace(fi), face, face.selectedCells);
      if(chk.ok){ applyMerge(face, chk); renderFace(fi); }
      return;
    }
    // BİRLEŞİMİ SAĞA BÜYÜT — Ctrl'lü çoklu seçim gerektirmeden 2 → 3 → 4 … bölüm.
    // (Birleştirmeden sonra base zaten seçili kalır; ona Ctrl'süz yeniden tıklamak seçimi
    // kaldırdığı için çoklu seçim yolu bu senaryoda kullanışsızdı.)
    let cellGrowM = e.target.id && e.target.id.match(/^f(\d+)_cell_grow$/);
    if(cellGrowM){
      const fi = Number(cellGrowM[1]);
      const face = faceOf(fi);
      const s = selCell(face);
      if(s){
        const r = computeFace(fi);
        const nxt = nextAlignedCell(r, s.col, s.idx);
        if(nxt){
          const chk = canMergeCells(r, face, [s, nxt]);
          if(chk.ok){ applyMerge(face, chk); renderFace(fi); }
        }
      }
      return;
    }
    // BİRLEŞİMİ ÇÖZ
    let cellUnmergeM = e.target.id && e.target.id.match(/^f(\d+)_cell_unmerge$/);
    if(cellUnmergeM){
      const fi = Number(cellUnmergeM[1]);
      const face = faceOf(fi);
      const s = selCell(face);
      if(s){
        const p = face.columns[s.col].panels[s.idx];
        p.colSpan = 1;
        p.spanSize = 0;   // birleşim genişliği tek kapağa taşınmaz
        renderFace(fi);
      }
      return;
    }
    let cellClearM = e.target.id && e.target.id.match(/^f(\d+)_cell_clear$/);
    if(cellClearM){
      const fi = Number(cellClearM[1]);
      faceOf(fi).selectedCells = [];
      renderFace(fi);
      return;
    }
    // Takviye bar: Birleştir / Ayır — SEÇİMİN TAMAMINA uygulanır, uygulanamayanlar atlanır
    let barJoinM = e.target.id && e.target.id.match(/^f(\d+)_bar_(join|split)$/);
    if(barJoinM){
      const fi = Number(barJoinM[1]);
      const join = barJoinM[2] === 'join';
      const face = faceOf(fi);
      const r = computeFace(fi);
      face.selectedBars.forEach(b=>{
        if(b.kind==='ana'){
          // Birleştir = tüm kesimleri kaldır | Ayır = hizalı TÜM seviyelerden kes
          const st = anaBarState(r, b.i);
          if(join) face.anaSplitLevels[b.i] = [];
          else if(st && st.canSplit) face.anaSplitLevels[b.i] = st.bar.levels.map(l=>l.idxA);
        } else {
          const st = araBarState(r, face, b.ci, b.gi);
          if(join){ if(st && st.canJoin) face.columns[b.ci].araJoinNext[b.gi] = true; }
          else face.columns[b.ci].araJoinNext[b.gi] = false;
        }
      });
      renderFace(fi);
      return;
    }
    // Takviye bar: Kaldır (seçimin tamamı)
    let barRemoveM = e.target.id && e.target.id.match(/^f(\d+)_bar_remove$/);
    if(barRemoveM){
      const fi = Number(barRemoveM[1]);
      const face = faceOf(fi);
      face.selectedBars.forEach(b=>{
        if(b.kind==='ana') face.colGaps[b.i] = false;
        else face.columns[b.ci].innerGaps[b.gi] = false;
      });
      face.selectedBars = [];
      renderFace(fi);
      return;
    }
  });

  // ---- BATARYA KIZAĞI (9. sekme) ----
  // Sabit chrome: buildTabs bu üçünü bir kez basar, delege gerekmez.
  const kzAktif = document.getElementById('kz_aktif');
  if(kzAktif) kzAktif.addEventListener('change', e=>{
    activeKizak().aktif = e.target.checked;
    renderKizakPanel(); renderIssuesBadge();
  });
  const kzBtn = document.getElementById('kz_pdf_btn');
  if(kzBtn) kzBtn.addEventListener('click', ()=>{
    const inp = document.getElementById('kz_pdf');
    if(inp){ inp.value = ''; inp.click(); }
  });
  const kzPdf = document.getElementById('kz_pdf');
  if(kzPdf) kzPdf.addEventListener('change', async e=>{
    const dosya = e.target.files && e.target.files[0];
    if(!dosya) return;
    const st = document.getElementById('kz_status');
    if(st){ st.className = 'status info'; st.textContent = 'Föy okunuyor: ' + dosya.name; }
    try{
      const olcu = await kizakPdfOlculeri(await dosya.arrayBuffer());
      const HR = Number(olcu.HR)||0;
      if(!(HR>0)){
        if(st){ st.className = 'status bad';
          st.textContent = '⚠ Bu PDF\'te HR ölçüsü bulunamadı — batarya seçim föyü (Friterm) olduğundan emin olun.'; }
        return;
      }
      const kz  = activeKizak();
      const rol = kizakSeciliRol();
      const b   = { rol:rol, HR:HR, kaynak:dosya.name };
      if(Number(olcu.LDmax)>0) b.LDmax = Number(olcu.LDmax);
      if(Number(olcu.TR)>0)    b.TR    = Number(olcu.TR);
      // Aynı rolün ikinci föyü ESKİSİNİN ÜZERİNE yazar — rol başına tek batarya.
      const i = kz.bataryalar.findIndex(x => x.rol === rol);
      if(i >= 0) kz.bataryalar[i] = b; else kz.bataryalar.push(b);
      if(!kz.aktif) kz.aktif = true;
      renderKizakPanel(); renderIssuesBadge(); renderGlobalSummary();
    }catch(err){
      if(st){ st.className = 'status bad'; st.textContent = '⚠ PDF okunamadı: ' + err.message; }
    }
  });

  document.body.addEventListener('input', e=>{
    // ---- EŞANJÖR alanları (8. sekme) ----
    if(e.target.id === 'es_kenar' || e.target.id === 'es_ustkat' || e.target.id === 'es_saga'){
      const es = activeEsanjor();
      const v = Number(e.target.value)||0;
      if(e.target.id === 'es_kenar') es.kenar = v;
      else if(e.target.id === 'es_ustkat') es.ustKat = v;
      else es.saga = v;
      renderEsanjorPanel();
      renderGlobalSummary();
      return;
    }
    if(e.target.id === 'es_kod'){ activeEsanjor().kod = e.target.value; return; }
    let m = e.target.id && e.target.id.match(/^f(\d+)_ed_colsize$/);
    if(m){
      const fi = Number(m[1]);
      const face = faceOf(fi);
      const s = selCell(face);
      if(s){
        const val = Number(e.target.value)||0;
        const col = face.columns[s.col];
        if(face.orient === 'V'){
          // V modunda ed_colsize = satır yüksekliği (col.size); per-panel override kullanılmaz
          col.size = val;
          col.panels.forEach(pp => { pp.colSize = 0; });
        } else {
          // H modunda: bireysel kapak genişliği; col.size yeni kapaklar için varsayılan
          col.panels[s.idx].colSize = val;
          col.size = val;
        }
        partialRender(fi);
      }
      return;
    }
    // Birleşik kapağın elle girilen genişliği. Boş = türetilene dön. Kapladığı hücrelere
    // YAZILMAZ (onların kendi bölüm genişlikleri üstteki satırları belirlemeye devam eder);
    // yalnız birleşik kapağın kendi ölçüsünü ve o satırın kademesini etkiler.
    m = e.target.id && e.target.id.match(/^f(\d+)_ed_spansize$/);
    if(m){
      const fi = Number(m[1]);
      const face = faceOf(fi);
      const s = selCell(face);
      if(s){
        face.columns[s.col].panels[s.idx].spanSize = Number(e.target.value)||0;
        partialRender(fi);
      }
      return;
    }
    m = e.target.id && e.target.id.match(/^f(\d+)_ed_psize$/);
    if(m){
      const fi = Number(m[1]);
      const face = faceOf(fi);
      const s = selCell(face);
      if(s){
        // Birleşik kapakta yükseklik kapladığı hücrelere de yazılır — yoksa birleşim çözülür
        syncSpannedCell(fi, s.col, s.idx, {size: Number(e.target.value)||0});
        partialRender(fi);
      }
      return;
    }
  });

  document.body.addEventListener('change', e=>{
    // ---- EŞANJÖR (8. sekme) ----
    if(e.target.id === 'es_aktif'){
      activeEsanjor().aktif = e.target.checked;
      renderEsanjorPanel();
      renderGlobalSummary();
      return;
    }
    // ---- ARA KAT kontrolleri (7. sekme) ----
    if(e.target.id === `f${ARAKAT_FI}_aktif`){
      activeAraKat().aktif = e.target.checked;
      renderFace(ARAKAT_FI);
      return;
    }
    if(e.target.id === `f${ARAKAT_FI}_profil`){
      activeAraKat().profil = ARAKAT_PROFILLER[e.target.value] ? e.target.value : '30x30';
      renderFace(ARAKAT_FI);
      return;
    }
    if(e.target.id === `f${ARAKAT_FI}_surekli`){
      const v = e.target.value;
      activeAraKat().surekliYon = (v==='L'||v==='W') ? v : '';
      renderFace(ARAKAT_FI);
      return;
    }
    let m = e.target.id && e.target.id.match(/^f(\d+)_ed_type$/);
    if(m){
      const fi = Number(m[1]);
      const face = faceOf(fi);
      const s = selCell(face);
      if(s){
        // Birleşik kapakta tip de kapladığı hücrelere yazılır (tek kapak, tek tip)
        syncSpannedCell(fi, s.col, s.idx, {type: e.target.value});
        syncStructure(face); // boğaz seçilirse bitişik ana takviyeler kalkar; ölü 'yon' düşer
        renderFace(fi);
      }
      return;
    }
    // Yönlü elemanın (Damper/Boğaz) çizim yönü. Birleşik kapakta kapladığı hücrelere de
    // yazılır — tek kapak, tek yön. syncStructure geçersiz değeri zaten düşürür.
    m = e.target.id && e.target.id.match(/^f(\d+)_ed_yon$/);
    if(m){
      const fi = Number(m[1]);
      const face = faceOf(fi);
      const s = selCell(face);
      if(s){
        syncSpannedCell(fi, s.col, s.idx, {yon: e.target.value === 'dikey' ? 'dikey' : ''});
        syncStructure(face);
        renderFace(fi);
      }
      return;
    }
    if(e.target.matches('[data-orientface]')){
      const fi = Number(e.target.dataset.orientface);
      const face = faceOf(fi);
      if(e.target.value !== face.orient){
        face.orient = e.target.value;
        face.selectedCells = [];
        face.selectedBars = [];
        // Yönelim değişince tüm ölçüleri ve birleşimleri sıfırla — otomatik yerleşim devreye girsin
        face.columns.forEach(col => {
          col.size = 0;
          col.panels.forEach(p => { p.size = 0; p.colSize = 0; p.colSpan = 1; });
        });
        face.anaSplitLevels = face.anaSplitLevels.map(()=>[]);
      }
      renderFace(fi);
      return;
    }
    if(e.target.matches('[data-kapaksizface]')){
      const fi = Number(e.target.dataset.kapaksizface);
      faceOf(fi).kapaksiz = e.target.checked;
      faceOf(fi).selectedCells = [];
      faceOf(fi).selectedBars = [];
      renderFace(fi);
      return;
    }
  });
}

// EŞANJÖR sekmesinin iskeleti. Yüz panellerinden farklıdır: ızgara, göz düzenleyici ve
// kesim tablosu yoktur — üç giriş, türetilen beş ölçü ve bir yerleşim çizimi vardır.
// Kimlikler `es_*` önekiyle; yüzlerin `f{fi}_*` deseninden ayrı tutulur ki delege
// handler'ların regex'lerine (örn. /^f(\d+)_ed_del$/) hiç takılmasın.
function buildEsanjorHTML(){
  return `
  <div class=&quot;section&quot;>
    <div class=&quot;flex-between&quot; style=&quot;margin-bottom:10px;&quot;>
      <span class=&quot;badge&quot;>EŞANJÖR — 45° yerleşim (baklava)</span>
      <div class=&quot;checkbox-row&quot;>
        <input type=&quot;checkbox&quot; id=&quot;es_aktif&quot;>
        <label for=&quot;es_aktif&quot;>Bu modülde eşanjör var</label>

// Yerleşim çizimi: modülün iç açıklığı (uzunluk × yükseklik) + 45° eşanjör + dört ölçü.
// Yüz çizimleriyle aynı gerekçeyle tema-bağımsız sabit renkler kullanır (Excel'e beyaz
// zeminde gömülebilsin diye).
function drawEsanjorSVG(){
  const SVG_W = 880, SVG_H = 480, PAD = 54;
  const o = esanjorOlculeri();
  let svg = `<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;${SVG_W}&quot; height=&quot;${SVG_H}&quot; viewBox=&quot;0 0 ${SVG_W} ${SVG_H}&quot; font-family=&quot;Arial, Helvetica, sans-serif&quot;>`;
  svg += `<rect x=&quot;0&quot; y=&quot;0&quot; width=&quot;${SVG_W}&quot; height=&quot;${SVG_H}&quot; fill=&quot;#ffffff&quot;/>`;
  if(!(o.icL>0 && o.icH>0)){
    svg += `<text x=&quot;${SVG_W/2}&quot; y=&quot;${SVG_H/2}&quot; fill=&quot;#3d4d5a&quot; font-size=&quot;15&quot; text-anchor=&quot;middle&quot;>Modül ölçüleri girilmedi</text></svg>`;
    return svg;
  }
  const scale = Math.min((SVG_W-2*PAD)/o.icL, (SVG_H-2*PAD)/o.icH);
  const fw = o.icL*scale, fh = o.icH*scale;
  const ox = (SVG_W-fw)/2, oy = (SVG_H-fh)/2;
  // Modülün iç açıklığı
  svg += `<rect x=&quot;${ox}&quot; y=&quot;${oy}&quot; width=&quot;${fw}&quot; height=&quot;${fh}&quot; fill=&quot;#eef1f4&quot; stroke=&quot;#3a4d5c&quot; stroke-width=&quot;2&quot;/>`;
  svg += `<text x=&quot;${ox+fw/2}&quot; y=&quot;${oy-16}&quot; fill=&quot;#33424e&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;>İç uzunluk = ${Math.round(o.icL)} mm</text>`;
  svg += `<text x=&quot;${ox-16}&quot; y=&quot;${oy+fh/2}&quot; fill=&quot;#33424e&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 ${ox-16} ${oy+fh/2})&quot;>İç yükseklik = ${Math.round(o.icH)} mm</text>`;
  if(o.x>0 && o.es.ustKat>0 && o.es.saga>0){
    const cx = ox + (o.icL - o.es.saga)*scale;
    const cy = oy + o.es.ustKat*scale;
    const r  = o.x*scale;
    const kotu = !o.gecerli;
    const dolgu = kotu ? 'rgba(224,90,90,0.20)' : 'rgba(79,184,168,0.20)';
    const cizgi = kotu ? '#c0392b' : '#2f8f80';
    svg += `<polygon points=&quot;${cx},${cy-r} ${cx+r},${cy} ${cx},${cy+r} ${cx-r},${cy}&quot; fill=&quot;${dolgu}&quot; stroke=&quot;${cizgi}&quot; stroke-width=&quot;2&quot;/>`;
    svg += `<line x1=&quot;${cx-r}&quot; y1=&quot;${cy}&quot; x2=&quot;${cx+r}&quot; y2=&quot;${cy}&quot; stroke=&quot;${cizgi}&quot; stroke-width=&quot;0.8&quot; stroke-dasharray=&quot;4,3&quot;/>`;
    svg += `<line x1=&quot;${cx}&quot; y1=&quot;${cy-r}&quot; x2=&quot;${cx}&quot; y2=&quot;${cy+r}&quot; stroke=&quot;${cizgi}&quot; stroke-width=&quot;0.8&quot; stroke-dasharray=&quot;4,3&quot;/>`;
    svg += `<text x=&quot;${cx}&quot; y=&quot;${cy-4}&quot; fill=&quot;#1b2a36&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; text-anchor=&quot;middle&quot;>EŞANJÖR ${Math.round(o.kenar)}×${Math.round(o.kenar)}</text>`;
    svg += `<text x=&quot;${cx}&quot; y=&quot;${cy+12}&quot; fill=&quot;#46596a&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;>köşegen ${Math.round(o.kosegen)} · x ${o.x.toFixed(1)}</text>`;
    // Dört ölçü — baklavanın köşesinden iç açıklığın kenarına
    const olcuCiz = (x1,y1,x2,y2,tx,ty,metin,deger,yatayMi)=>{
      const kirmizi = !(deger >= ESANJOR_MIN_O);
      const renk = kirmizi ? '#c0392b' : '#5a6f80';
      svg += `<line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${renk}&quot; stroke-width=&quot;1&quot;/>`;
      const rot = yatayMi ? '' : ` transform=&quot;rotate(-90 ${tx} ${ty})&quot;`;
      svg += `<text x=&quot;${tx}&quot; y=&quot;${ty}&quot; fill=&quot;${renk}&quot; font-size=&quot;11&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;${rot}>${metin} ${deger}</text>`;
    };
    olcuCiz(cx, oy, cx, cy-r, cx+22, (oy+cy-r)/2, '1.', o.O1, false);
    olcuCiz(cx+r, cy, ox+fw, cy, (cx+r+ox+fw)/2, cy-6, '2.', o.O2, true);
    olcuCiz(cx, cy+r, cx, oy+fh, cx+22, (cy+r+oy+fh)/2, '3.', o.O3, false);
    olcuCiz(ox, cy, cx-r, cy, (ox+cx-r)/2, cy-6, '4.', o.O4, true);
  }
  svg += `<text x=&quot;${SVG_W-PAD}&quot; y=&quot;${SVG_H-12}&quot; fill=&quot;#9aa8b2&quot; font-size=&quot;9.5&quot; text-anchor=&quot;end&quot; font-style=&quot;italic&quot;>Cenk Altınay</text>`;
  svg += '</svg>';
  return svg;
}

// Eşanjör sekmesini modelden tazeler. renderAll'dan ve giriş handler'larından çağrılır.
function renderEsanjorPanel(){
  const panel = document.getElementById('face-'+ESANJOR_FI);
  if(!panel) return;
  const es = activeEsanjor();
  const o  = esanjorOlculeri();
  const set = (id, txt)=>{ const el = document.getElementById(id); if(el) el.textContent = txt; };
  const val = (id, v)=>{ const el = document.getElementById(id); if(el && el !== document.activeElement) el.value = v; };

  const cb = document.getElementById('es_aktif');
  if(cb) cb.checked = !!es.aktif;
  val('es_kenar',  es.kenar>0  ? es.kenar  : '');
  val('es_ustkat', es.ustKat>0 ? es.ustKat : '');
  val('es_saga',   es.saga>0   ? es.saga   : '');
  val('es_kod',    es.kod || '');

  const mm = v => v>0 ? Math.round(v)+'' : '—';
  set('es_z_ic', (o.icL>0 && o.icH>0 && o.icW>0) ? `${mm(o.icL)} × ${mm(o.icH)} × ${mm(o.icW)}` : '—');
  set('es_z_x',  o.x>0 ? `${Math.round(o.kosegen)} → ${o.x.toFixed(1)}` : '—');
  set('es_z_ci', o.CI>0 ? mm(o.CI) : '—');
  const say = v => o.gecerli || o.hatalar.length ? String(v) : '—';
  set('es_z_o1', o.eksik.length ? '—' : say(o.O1));
  set('es_z_o2', o.eksik.length ? '—' : say(o.O2));
  set('es_z_o3', o.eksik.length ? '—' : say(o.O3));
  set('es_z_o4', o.eksik.length ? '—' : say(o.O4));

  const st = document.getElementById('es_status');
  if(st){
    let cls = 'info', txt = o.eksik.join('  |  ');
    if(o.eksik.length===0 && o.hatalar.length>0){ cls = 'bad'; txt = '⚠ ' + o.hatalar.join('  |  '); }
    else if(o.gecerli){ cls = 'good'; txt = `✓ CI ${o.CI} · 1. ${o.O1} · 2. ${o.O2} · 3. ${o.O3} (1.5 mm) · 4. ${o.O4}`; }
    st.className = 'status ' + cls;
    st.textContent = txt;
  }
  const cv = document.getElementById('es_canvas');
  if(cv) cv.innerHTML = drawEsanjorSVG();

  const govde = document.getElementById('es_govde');
  if(govde) govde.style.display = es.aktif ? '' : 'none';
  const tab = document.getElementById('tab-'+ESANJOR_FI);
  if(tab) tab.style.opacity = es.aktif ? '' : '0.55';
}

// srcdoc TÜM HTML varlıklarını çözdüğü için kaçış haritası kaynağa yazılamaz
// (bkz. §10 tuzak 11) — varlık metinleri karakter kodundan kurulur.
function kizakEscapeHtml(str){
  const amp = String.fromCharCode(38), tirnak = String.fromCharCode(34);
  return String(str)
    .split(amp).join(amp+'amp;')
    .split('<').join(amp+'lt;')
    .split('>').join(amp+'gt;')
    .split(tirnak).join(amp+'quot;');
}

function buildTabs(){
  const tabsEl = document.getElementById('tabs');
  const container = document.getElementById('faces-container');
  // 6 yüz + ARA KAT (7., sanal yüz). FACE_DEFS büyütülmez — sekme listesi burada
  // elle uzatılır ki ara kat yalnızca istediğimiz yerlere girsin.
  const tabDefs = FACE_DEFS.concat([ARAKAT_DEF, ESANJOR_DEF, KIZAK_DEF]);
  tabDefs.forEach((def, idx)=>{
    const tab = document.createElement('div');
    tab.className = 'tab'+(idx===0?' active':'');
    tab.id = 'tab-'+idx;
    tab.textContent = def.name;
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.face-panel').forEach(p=>p.style.display='none');
      document.getElementById('face-'+idx).style.display='block';
    });
    tabsEl.appendChild(tab);

    const panel = document.createElement('div');
    panel.id = 'face-'+idx;
    panel.className = 'face-panel';
    panel.style.display = idx===0?'block':'none';
    panel.innerHTML = (idx === ESANJOR_FI) ? buildEsanjorHTML()
                    : (idx === KIZAK_FI) ? buildKizakHTML() : buildFaceHTML(idx);
    container.appendChild(panel);
  });
}

// ---------- DXF OKUMA CEKIRDEGI (DXFCEK) ----------
// P-KS teknik resim DXF'inden hucre/modul olculerini cikarir. Kaynak: proje kokundeki
// &quot;DXF Hucre Olcu Cikarici&quot; programinin cekirdegi; malzeme listesi ve yuzey alani
// bolumleri alinmadi. Disariya TEK isim sizar (DXFCEK) — icindeki yardimci adlar
// (mode, geo, dims...) f0'da zaten kullaniliyor, IIFE onlari kapatir.
var DXFCEK = (function () {
'use strict';

function fixTR(s) {
  if (!s) return s;
  return s.replace(/\\U\+([0-9A-Fa-f]{4})/g, function (m, h) { return String.fromCharCode(parseInt(h, 16)); });
}

function parseDxf(text) {
  const lines = text.split(/\r\n|\n|\r/);
  const pairs = [];
  for (let i = 0; i + 1 < lines.length; i += 2) {
    const code = parseInt(lines[i].trim(), 10);
    if (Number.isNaN(code)) continue;
    pairs.push([code, lines[i + 1]]);
  }
  let section = null, curType = null, cur = null;
  const texts = [], dims = [], geo = [], rlines = [], rpolys = [];
  function flush() {
    if (!cur) { curType = null; return; }
    if (cur.sec === 'ENTITIES') {
      if (curType === 'TEXT' || curType === 'MTEXT') {
        texts.push({ str: fixTR((cur.str || '').trim()), x: cur.x, y: cur.y, h: cur.h || 6,
                     layer: cur.layer || '' });
      } else if (curType === 'DIMENSION') dims.push(cur);
      else if (curType === 'LINE') {
        if (cur.x1 != null && cur.x2 != null) {
          geo.push({ xlo: Math.min(cur.x1, cur.x2), xhi: Math.max(cur.x1, cur.x2),
                     ylo: Math.min(cur.y1, cur.y2), yhi: Math.max(cur.y1, cur.y2) });
          rlines.push({ layer: cur.layer || '', xlo: Math.min(cur.x1, cur.x2), xhi: Math.max(cur.x1, cur.x2),
                        ylo: Math.min(cur.y1, cur.y2), yhi: Math.max(cur.y1, cur.y2) });
        }
      } else if (curType === 'LWPOLYLINE' && cur.pts.length) {
        const xs = cur.pts.map(p => p[0]), ys = cur.pts.map(p => p[1]);
        geo.push({ xlo: Math.min.apply(null, xs), xhi: Math.max.apply(null, xs),
                   ylo: Math.min.apply(null, ys), yhi: Math.max.apply(null, ys) });
        rpolys.push({ layer: cur.layer || '', n: cur.pts.length, closed: cur.closed,
                      xlo: Math.min.apply(null, xs), xhi: Math.max.apply(null, xs),
                      ylo: Math.min.apply(null, ys), yhi: Math.max.apply(null, ys) });
      }
    }
    cur = null; curType = null;
  }
  for (let i = 0; i < pairs.length; i++) {
    const c = pairs[i][0], v = pairs[i][1];
    if (c === 0 && v === 'SECTION') { flush(); section = pairs[i + 1] && pairs[i + 1][0] === 2 ? pairs[i + 1][1] : null; continue; }
    if (c === 0 && v === 'ENDSEC') { flush(); section = null; continue; }
    if (section !== 'ENTITIES') continue;
    if (c === 0) {
      flush();
      if (v === 'TEXT' || v === 'MTEXT' || v === 'DIMENSION' || v === 'LINE' || v === 'LWPOLYLINE') {
        curType = v; cur = { sec: section, pts: [] };
      }
      continue;
    }
    if (!cur) continue;
    if (c === 8) { cur.layer = fixTR(v); continue; }
    if (curType === 'LINE') {
      if (c === 10) cur.x1 = +v; else if (c === 20) cur.y1 = +v;
      else if (c === 11) cur.x2 = +v; else if (c === 21) cur.y2 = +v;
    } else if (curType === 'LWPOLYLINE') {
      if (c === 10) cur.pts.push([+v, 0]);
      else if (c === 20 && cur.pts.length) cur.pts[cur.pts.length - 1][1] = +v;
      else if (c === 70) cur.closed = (+v & 1) === 1;
    } else if (curType === 'TEXT' || curType === 'MTEXT') {
      if (c === 1) cur.str = (cur.str || '') + v;
      else if (c === 3 && curType === 'MTEXT') cur.str = (cur.str || '') + v;
      else if (c === 10) cur.x = +v; else if (c === 20) cur.y = +v;
      else if (c === 40) cur.h = +v;
    } else if (curType === 'DIMENSION') {
      if (c === 13) cur.x13 = +v; else if (c === 23) cur.y13 = +v;
      else if (c === 14) cur.x14 = +v; else if (c === 24) cur.y14 = +v;
      else if (c === 42) cur.meas = +v;
    }
  }
  flush();
  return { texts: texts, dims: dims, geo: geo, rlines: rlines, rpolys: rpolys };
}

// ---------- BILESEN CIKARIMI (2026-08-28) ----------
// Her modulun kendi geometrisi kendi katmanindadir: '(M3) - Isıtıcı Batarya_Right_…'.
// Yan gorunusten uc sey okunur ve hepsi modulun KENDI kasasina gore YEREL mm verilir:
//   kapak     — ic ice iki dikdortgen (dis cerce + 10 mm icerlek kanat). 601 cizimin
//               601'inde bulundu ve 601'inde de ayni gorunustedir (servis tarafi).
//   batarya   — kasanin icinde duran, yuksekligi kasanin %50-%95'i olan en genis
//               dikdortgen. Cizilen bataryanin KENDI derinligi budur (isitici 110-215,
//               DX 215-598 mm) — modulun kasa boyu (300-900) ile KARISTIRILMAMALI.
//   kasa      — modulun yan gorunusteki kutusu; boy bundan da okunabilir ama modul
//               boyunun asil kaynagi olcu zinciridir, burasi ona dokunmaz.
const BILESEN_LAY_RE = /^\((M\d+)\) - (.+?)_(Right|Left|Front|Back|Top|Bottom)_/;

// Kapagin imzasi: her kenarda 5..15 mm icerlek ikinci bir dikdortgen (cizim birimi cm).
function bilesenIcIce(A, B) {
  return (B.xlo - A.xlo) >= 0.5 && (B.xlo - A.xlo) <= 1.5
      && (A.xhi - B.xhi) >= 0.5 && (A.xhi - B.xhi) <= 1.5
      && (B.ylo - A.ylo) >= 0.5 && (B.ylo - A.ylo) <= 1.5
      && (A.yhi - B.yhi) >= 0.5 && (A.yhi - B.yhi) <= 1.5;
}

// ACILIR KAPAK ISARETI — cizimde acilir panel KAPI KOLU (30x100) ve MENTESE (50x50)
// sembolleriyle temsil edilir (Cenk, 29.08.2026). Olculdu, 634 cizim / 1180 modul:
//   - desen 817 modulde var; KS-10'da TAM 3 modulde (M2 Filtre, M8 Fan, M9 Fan) —
//     Cenk'in saydigi sayi.
//   - desen YALNIZ servis tarafinda (Right) var, Left'te hic yok.
//   - eski kural (batarya HER ZAMAN acilir + kapak dikdortgeni gorulen bolme) 941 acilir
//     uretiyordu; desen bunun ALT KUMESIDIR ('yalniz desen' = 0), yani yeni kural hicbir
//     yeni acilir eklemez, 124 yanlis acilirdan kurtarir (48 DX + 42 isitici + 32 filtre).
function acilirIsareti(rpolys, gor, mod) {
  let kare = 0, kol = 0;
  for (let i = 0; i < rpolys.length; i++) {
    const p = rpolys[i];
    const m = BILESEN_LAY_RE.exec(p.layer || '');
    if (!m || m[3] !== gor || m[1] !== mod) continue;
